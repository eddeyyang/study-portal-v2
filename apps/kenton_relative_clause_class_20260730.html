  <script>
  (() => {
    'use strict';
    const APP_ID='kenton-relative-clause-20260730';
    const VERSION='2.0.0';
    const STORAGE_KEY='study:kenton:kenton-relative-clause-20260730:v1';
    const MATERIAL='《知识点梳理》p.112—114（定语从句）与 2026-07-30 老师课堂反馈';
    const AUDIO_DIR='audio/kenton_relative_clause_class_20260730';
    const LESSON_BLUEPRINT=Object.freeze({
      appId:APP_ID,
      child:'kenton',
      source:MATERIAL,
      courseDate:'2026-07-30',
      currentGap:'暂时不能独立把两句话合并成定语从句并稳定选择关系代词',
      observableOutcome:'能圈出重复的人或物、选对关系代词并把从句贴回先行词后',
      knowledgeMechanism:'第二句的重复成分换成关系代词，再整体移动到先行词后',
      primaryInteraction:'句子纸条拼装、关系代词连接扣与错后原题返回',
      audio:'pending',
      surprise:'两张句子纸条在关系代词连接后合拢成完整句',
      surpriseTrigger:'完成圈重复、选代词和贴回三步',
      phases:['teach','guided','recall','independent','repair','transfer']
    });
    const DAILY_SURPRISES=Object.freeze([
      '先不看答案，猜猜今天第一枚连接扣是 who 还是 which。',
      '合并完成后，把关系从句轻声读两遍。',
      '今天找一句可以把关系代词省略的句子。'
    ]);
    function dailySurpriseKey(){
      const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
      return`${APP_ID}|kenton|${date}`;
    }
    function dailySurprise(){
      let hash=0;
      for(const char of dailySurpriseKey())hash=(hash*31+char.charCodeAt(0))>>>0;
      return DAILY_SURPRISES[hash%DAILY_SURPRISES.length];
    }
    const mergeCases=[
      {
        id:'person',label:'说明人',pronoun:'who',audio:'01-everyone-who.mp3',
        first:[['Good news for',0],['everyone',1],['!',0]],second:[['Everyone',1],['loves the stars',0],['.',0]],
        noun:'everyone',clause:'who loves the stars',result:'Good news for everyone who loves the stars!',
        rule:'先行词 everyone 指人；第二句的 Everyone 是 loves 的主语，所以换成 who。'
      },
      {
        id:'thing',label:'说明物',pronoun:'that',audio:'02-suckers-that.mp3',
        first:[['Those eight arms are covered with rows of',0],['round suckers',1],['.',0]],second:[['The round suckers',1],['can taste and grip at the very same time',0],['.',0]],
        noun:'round suckers',clause:'that can taste and grip at the very same time',result:'Those eight arms are covered with rows of round suckers that can taste and grip at the very same time.',
        rule:'先行词 round suckers 是物；第二句缺主语，这里用 that，也可以用 which。'
      },
      {
        id:'thing-extra',label:'补充说明物',pronoun:'which',audio:'03-arms-which.mp3',
        first:[['And of course it has',0],['eight long arms',1],['.',0]],second:[['The eight long arms',1],['are exactly what its name means: eight feet',0],['.',0]],
        noun:'eight long arms',clause:'which is exactly what its name means: eight feet',result:'And of course it has eight long arms, which is exactly what its name means: eight feet.',
        rule:'先行词 eight long arms 是物；逗号后的 which 补充说明整件事，这里不能换成 who。'
      }
    ];
    const recallCards=[
      ['先行词是什么？','被后面小句说明的人或物。定语从句要紧贴先行词。'],
      ['人和物怎样选？','人常用 who；物常用 which；that 可指人或物。'],
      ['什么时候用 whose？','表达“谁的 / 什么的”，结构是 whose + 名词。'],
      ['关系代词能省吗？','作主语不能省；作宾语时 who/whom/which/that 常可省。']
    ];
    const questions=[
      makeQ('q1','人 + 缺主语','The doctor ___ helped me was patient.',['which','who','whose'],1,'先行词 doctor 是人，从句 ___ helped me 缺主语，用 who。','人 + 缺主语 → who。',transfer('The teacher ___ speaks English is friendly.',['who','which','whose'],0)),

      if(!soundOn)return;
      try{
        if(!audioContext)audioContext=new (window.AudioContext||window.webkitAudioContext)();
        if(audioContext.state==='suspended')audioContext.resume();
        const now=audioContext.currentTime;
        const notes=kind==='ok'?[[523,.00],[659,.08]]:kind==='bad'?[[196,.00],[165,.12]]:[[340,.00]];
        notes.forEach(([hz,delay])=>{
          const osc=audioContext.createOscillator(),gain=audioContext.createGain();
          osc.type=kind==='bad'?'triangle':'sine';osc.frequency.value=hz;

    function repairPage(){
      const q=repairQuestion;
      return`${pageHead('定点重教',`保持第 ${quizPos+1} 题现场，不丢进度`)}<section class="panel" data-phase="repair"><span class="pill">${esc(q.skill)}</span><h2>这一步为什么会错？</h2><div class="repair-rule"><b>判断口令：</b>${esc(q.repair)}<br><b>放回原句：</b>${esc(q.explain)}</div><p>请把口令说一遍，再回到刚才那一道题改答。</p><div class="btn-row"><button class="btn primary wide" data-return-to-question="independent" onclick="returnToQuestion()">我看懂了，返回刚才第 ${quizPos+1} 题 →</button></div></section>`;
    }
    function returnToQuestion(){route='quiz';quizMode='original';answerState=null;render();scrollTo(0,0)}
    function startTransfer(){quizMode='transfer';answerState=null;render();scrollTo(0,0)}
    function nextQuiz(){quizPos++;quizMode='original';answerState=null;render();scrollTo(0,0)}
    function recordsPage(){
      const wrong=Object.values(state.wrongbook).filter(x=>x.errors>0);
      return`${pageHead('学习记录','只属于 Kenton 与本软件')}<section class="panel"><div class="metrics"><div class="metric"><strong>${state.attempts.length}</strong><span>独立作答</span></div><div class="metric"><strong>${wrong.filter(x=>!x.solved).length}</strong><span>待回炉</span></div><div class="metric"><strong>${wrong.filter(x=>x.solved).length}</strong><span>已解决</span></div></div></section>
      <section class="panel"><h2>错题回炉</h2>${wrong.length?`<div class="wrong-list">${wrong.map(item=>`<div class="wrong-item"><div><strong>${esc(item.skill)}</strong><small>错 ${item.errors} 次 · 连对 ${item.streak}/2</small></div><span class="status ${item.solved?'solved':'open'}">${item.solved?'已解决':'待回炉'}</span></div>`).join('')}</div>`:'<div class="empty"><strong>暂无错题</strong><p>完成独立检验后，这里会按知识点记录。</p></div>'}
      <div class="btn-row"><button class="btn" onclick="downloadJson()">导出 JSON</button><button class="btn" onclick="downloadMarkdown()">导出学习汇报</button><button class="btn" onclick="document.getElementById('importFile').click()">导入记录</button><input id="importFile" type="file" accept="application/json" hidden onchange="importJson(event)"><button class="btn primary" onclick="startQuiz()">只做检验</button></div><p class="privacy">本机记录键包含 Kenton、软件名和版本；不会与 Eddey 或家长测试记录混用。</p></section>`;
    }
    function report(){
      const wrong=Object.values(state.wrongbook).filter(x=>x.errors>0&&!x.solved);
      return`# Kenton 定语从句学习汇报\n\n- 软件版本：${VERSION}\n- 最近学习：${state.lastOpened}\n- 累计学习：${Math.round(state.totalMs/60000)} 分钟\n- 独立作答：${state.attempts.length}\n- 待回炉：${wrong.length}\n\n## 待回炉\n${wrong.length?wrong.map(x=>`- ${x.skill}：错 ${x.errors} 次，连对 ${x.streak}/2`).join('\n'):'- 无'}\n\n材料：${MATERIAL}\n`;
    }
    function download(name,type,text){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([text],{type}));link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
    function downloadJson(){download('kenton-relative-clause-record.json','application/json',JSON.stringify(state,null,2))}
    function downloadMarkdown(){download('kenton-relative-clause-report.md','text/markdown',report())}
    function importJson(event){
      const file=event.target.files?.[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data?.child!=='Kenton'||data?.appId!==APP_ID||!Array.isArray(data.attempts)||typeof data.wrongbook!=='object')throw new Error();state={...defaultState(),...data,schema:2,version:VERSION};save();toast('记录导入成功');go('records')}catch(_){toast('导入失败：不是本软件的 Kenton 记录')}};
      reader.readAsText(file);event.target.value='';
    }
    function syncSoundButton(){
      const button=document.getElementById('soundToggle');if(!button)return;
      button.textContent=soundOn?'声':'静';button.setAttribute('aria-label',soundOn?'关闭点击反馈音':'打开点击反馈音');
    }
    document.getElementById('soundToggle').addEventListener('click',()=>{soundOn=!soundOn;localStorage.setItem('study:kenton:ui-sound',soundOn?'1':'0');if(soundOn)tone('ok');syncSoundButton()});
    Object.assign(window,{go,startMerge,pickWord,confirmRepeat,pickPronoun,joinSentence,nextMerge,playSentence,setLens,markLens,flipRecall,resetRecall,finishRecall,startQuiz,answerQuiz,openRepair,returnToQuestion,startTransfer,nextQuiz,downloadJson,downloadMarkdown,importJson});
    render();
  })();
  </script>
</body>
</html>
