 const forms=node.kind==='forms';$('#lesson').innerHTML=shell('independent',forms?'把“更”和“最”写出来':node.kind==='words'?'这个词，你来拼':'把缺的那一块写出来',`<div class="main-surface"><div class="${forms?'word en':'definition'}">${esc(forms?q.base:q.zh).replace(/\n/g,'<br>')}</div>${forms?`<p class="definition">${esc(q.zh)}</p>`:node.kind==='time'?`<p class="word en">${esc(q.base)}</p>`:''}<div class="${forms?'fields':''}">${q.answers.map((_,i)=>`<label class="field"><span>${forms?(i===0?'比较级':'最高级'):'我的答案'}</span><input type="text" id="answer${i}" maxlength="200" autocorrect="off" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(r.drafts[q.id]?.[i]||'')}"></label>`).join('')}</div><label class="assisted"><input type="checkbox" id="voice">我用了语音输入或提示</label><div class="actions"><button id="check" class="primary">检查</button><button id="help">教我这个</button>${node.kind==='words'?`<button id="listen">${icon('sound')}听单词</button>`:''}</div><div id="feedback" class="feedback" aria-live="polite"></div></div>`);
 $('#voice').checked=!!r.assistedDrafts?.[q.id];$('#voice').onchange=()=>{if($('#voice').checked)(r.assistedDrafts??={})[q.id]=true;save()};
 q.answers.forEach((_,i)=>{$('#answer'+i).oninput=()=>{r.drafts[q.id]=q.answers.map((_,j)=>$('#answer'+j).value);save()};$('#answer'+i).onkeydown=e=>{if(e.key==='Enter')$('#check').click()}});$('#check').onclick=()=>check(q);$('#help').onclick=()=>repair(q,true);if($('#listen'))$('#listen').onclick=()=>play(q.base);if(r.answered[q.id])success(q,false);else if(r.phase==='repair')repair(q,(r.tries[q.id]||0)>=2);
}
function check(q){cancel();if(state.run.answered[q.id])return;const answers=q.answers.map((_,i)=>$('#answer'+i).value),voice=!!($('#voice').checked||state.run.assistedDrafts?.[q.id]);if(voice)(state.run.assistedDrafts??={})[q.id]=true;save();if(answers.every(x=>!x.trim())){$('#feedback').textContent='试着写一点，或点“教我这个”。';return}
 // Voice transcription is not an exact spelling test: offer a meaning confirmation instead of a spelling-failure loop.
 if(voice&&!q.answers.every((set,i)=>set.some(a=>H.normalize(a)===H.normalize(answers[i])))){
  state.run.drafts[q.id]=answers;H.expose(state,q);event(q.id,answers.join(' | '),'voice-transcript-review-needed');$('#feedback').innerHTML=`<div class="repair"><p>转写可能有偏差。你想说的是下面这句吗？</p><p class="reference en">${esc(reference(q))}</p><div class="actions"><button id="voiceConfirm" class="primary">意思是这个，继续</button><button id="voiceEdit">改一下转写</button></div><p class="hint">这次记为口述练习，拼写以后再试。</p></div>`;$('#voiceConfirm').onclick=()=>{event(q.id,answers.join(' | '),'voice-meaning-confirmed-review-needed');state.run.answered[q.id]=true;advance(q.id)};$('#voiceEdit').onclick=()=>{$('#feedback').innerHTML='';$('#answer0').focus()};return;
 }
 const result=H.mark(state,q,answers,voice);save();if(result.result==='needs-repair')repair(q,state.run.tries[q.id]>=2,result.fields);else success(q,result.result==='independent-correct');
}
const reference=q=>q.answers.map(a=>a.join(' / ')).join(' → ');
function repair(q,reveal=false,fields=[]){cancel();H.expose(state,q);state.run.phase='repair';save();const first=fields.some(Boolean)?'你有一格已经写对了。':({forms:'先看这个词的变化。',words:'先看清这个词的字母顺序。',sentence:'先找问的是谁、什么、哪里还是时间。',time:'先看这是哪一类时间。',position:'先看清谁在哪里，再找参照物。'})[node.kind];$('#feedback').innerHTML=`<section class="repair" data-phase="repair">${explanation(first,q.tip,node.kind==='words'?'看清后遮住，回原题自己拼。':'回到原题，把这一处改好。')}${node.kind==='words'?model(q):''}<button id="return" data-return-to-question="true">回原题再写</button>${reveal?`<div data-learning-escape="answer-and-continue"><p class="reference en" data-reference-answer>${esc(reference(q))}</p><button class="primary" id="escape" data-continue-after-reveal>留待复习，继续</button></div>`:''}</section>`;$('#return').onclick=()=>{state.run.phase='independent';if(node.kind==='words'){state.run.drafts[q.id]=q.answers.map(()=> '');q.answers.forEach((_,i)=>$('#answer'+i).value='')}save();$('#feedback').innerHTML='';$('#answer0').focus()};if($('#escape'))$('#escape').onclick=()=>{event(q.id,(state.run.drafts[q.id]||[]).join(' | '),'reference-shown-review-needed');advance(q.id)};}
function success(q,independent){$('#check').disabled=true;$('#help').disabled=true;q.answers.forEach((_,i)=>$('#answer'+i).disabled=true);$('#feedback').innerHTML=`<p class="success">${independent?'这次自己写对了。':'这次练好了，隔天再自己试。'}</p><div class="actions"><button id="next" class="primary">${state.run.index+1<items().length?'下一项':'用自己的话试一下'}</button><button id="hold">停一下</button></div>`;$('#next').onclick=()=>advance(q.id);$('#hold').onclick=()=>{clearTimeout(autoTimer);$('#hold').textContent='已停，准备好再继续'};if(independent)autoTimer=setTimeout(()=>advance(q.id),1800);}
function advance(id){if(!active||currentQ()?.id!==id)return;cancel();state.run.index++;state.run.phase=state.run.index>=items().length?'transfer':'independent';save();renderLesson();window.scrollTo({top:0,behavior:'auto'})}
function renderReading(q){const r=state.run;$('#lesson').innerHTML=shell('independent','一句听，一句自己读',`<div class="main-surface"><div class="model"><p class="reading-line en" id="readingText" ${r.covered?.[q.id]?'hidden':''}>${q.base.split(/([A-Za-z]+(?:[’'][A-Za-z]+)*)/).map(w=>/^[A-Za-z]/.test(w)?`<button data-read="${esc(w)}" aria-label="读 ${esc(w)}">${esc(w)}</button>`:esc(w)).join('')}</p></div><div class="actions"><button id="listen">${icon('sound')}听这一句</button><button id="cover">${r.covered?.[q.id]?'再看看原句':'遮住，我来读'}</button></div><p class="hint">先听句意和停顿，再用自己的声音读。</p><div class="actions"><button id="readDone" class="primary">这句我读过了</button><button id="readLater">这句留待复习</button></div><p class="footnote">这里只记练读，不自动评发音。</p></div>`);$('#listen').onclick=()=>play(q.base);document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>play(b.dataset.read));$('#cover').onclick=()=>{const text=$('#readingText'),cover=!text.hidden;text.hidden=cover;(r.covered??={})[q.id]=cover;save();$('#cover').textContent=cover?'再看看原句':'遮住，我来读'};$('#readDone').onclick=()=>finishReading(q,false);$('#readLater').onclick=()=>finishReading(q,true);}
function finishReading(q,review){const r=state.run;if(!active||currentQ()?.id!==q.id||r.answered[q.id])return;if(review)H.expose(state,q);r.answered[q.id]=true;event(q.id,review?'':'本人报告已读',review?'reading-review-needed':'self-reported-reading',{covered:!!r.covered?.[q.id],mastery:'not-assessed'});advance(q.id)}
function renderReceipt(reason){base(node.title,'这一段的记录已经收好。');const r=state.receipts.at(-1),review=node.questions.filter(q=>state.progress[q.id]?.review),left=items().slice(state.run.index).map(q=>q.base),canResume=!state.run.complete,ended=session().usedMs>=1800000;
 $('#stage').innerHTML=`<section class="receipt"><div class="seal">${icon(reason==='complete'?'check':'pause')}</div><h2>${reason==='complete'?'这一段，练完了':reason==='time'?'到休息时间了':'先到这里，很好'}</h2><p>${reason==='time'?(ended?'这一轮30分钟已用完，进度留在原处。':'可以休息，也可以接着完成这一段。'):reason==='complete'?'可以休息，不会自动打开下一段。':'下次直接接着，不用从头再来。'}</p>${canResume?`<button class="primary more" id="resume">${continueLabel(ended)} ${icon('next')}</button>${reason==='time'&&!ended?'<p class="hint">继续会再留最多5分钟；本轮仍累计计时。</p>':''}`:''}<div class="details"><p>本段用时 ${time(r?.spentMs||0)}</p>${node.kind!=='reading'?`<p>首答独立写对 ${r?.independent||0} 项；提示后写对 ${r?.assisted||0} 项。</p>`:'<p>练读已记录；发音质量尚未评定。</p>'}${review.length?`<p>下次再看看：${review.slice(0,7).map(q=>`<span class="tag-word en">${esc(q.base)}</span>`).join('')}</p>`:''}${left.length&&canResume?`<p>接续点：第 ${state.run.index+1} 项。</p>`:''}</div><div class="actions"><button id="sync" class="${canResume?'':'primary'}">${test?'保存测试结果':reason==='complete'?'完成并同步本段':'暂停并同步本段'}</button><a href="${home}" class="button">回到入口</a></div><p id="syncStatus" class="hint" role="status"></p></section>`;$('#sync').onclick=sync;if($('#resume'))$('#resume').onclick=()=>continueCurrent(ended);}
function renderLimit(){base('这一轮，到这里','已有内容都已保留。');const ended=session().usedMs>=1800000;$('#stage').innerHTML=`<section class="receipt"><div class="seal">${icon('pause')}</div><h2>先休息，也能接着学</h2><p>${ended?'这一轮30分钟已用完。':'这一段到休息时间了。'}</p><p>点继续，从原来的题目和草稿接着做。</p><button id="resume" class="primary more">${continueLabel(ended)} ${icon('next')}</button><a href="${home}" class="button quiet more">回到入口</a></section>`;$('#resume').onclick=()=>continueCurrent(ended);}
async function sync(){const el=$('#syncStatus'),receipt=state.receipts.at(-1);if(test){el.textContent='家长测试已隔离，不会上传。';return}if(!receipt){el.textContent='先结束这一段，再保存摘要。';return}if(receipt.synced){el.textContent='这段摘要已进入同步队列。';return}const ok=DDLearningSync.complete({kid:child,subject:'英语',topic:node.title,item:'独立学习节点结算',client_event_id:child+':en-node:'+node.id+':'+receipt.id,payload:{appId:child+'-english-nodes-20260913',nodeId:node.id,version:1,status:receipt.reason==='complete'?'completed':'paused',elapsedSeconds:Math.round(receipt.spentMs/1000),independentCorrect:receipt.independent,assistedCorrect:receipt.assisted,remainingItems:items().length-state.run.index,reviewItems:receipt.review,mastery:'not-assessed'}});if(!ok){el.textContent='暂未加入队列，记录仍在本机。';return}receipt.synced=true;save();el.textContent='摘要已进入同步队列。';try{const out=await DDLearningSync.flush();el.textContent=out.ok?'本段摘要已同步。':'已保留在队列，联网后补传。'}catch{el.textContent='已保留在队列，联网后补传。'}}
function bundle(){const nodes={};for(const n of CONTENT.nodes){const s=read(H.key(child,n.id,mode));if(H.valid(s,child,n,mode))nodes[n.id]=s}return {schema:'english-nodes-backup-v1',child,mode,at:new Date().toISOString(),nodes,homework:read(H.key(child,'homework',mode))};}
function validBundle(b){return H.plain(b)&&b.schema==='english-nodes-backup-v1'&&b.child===child&&b.mode===mode&&H.plain(b.nodes)&&(!b.homework||(H.plain(b.homework)&&H.plain(b.homework.homework)&&Object.values(b.homework.homework).every(v=>typeof v==='boolean')&&Array.isArray(b.homework.computer)&&b.homework.computer.length===3&&b.homework.computer.every(v=>typeof v==='boolean')))&&Object.entries(b.nodes).every(([id,s])=>{const n=CONTENT.nodes.find(n=>n.id===id);return n&&H.valid(s,child,n,mode)})}
function parent(which='records'){cancel();pause();const b=bundle();$('#modalBody').innerHTML=which==='tasks'?`<p class="hint">做完书本任务后，在这里记下。打开网页不等于做完。</p><div id="taskList"></div>`:`<p>每段单独记录；“练完”和“独立会”分开。语音转写、提示后改对与自己写对分别保存。</p><p>音频仍是固定候选声线，逐条听感和手机实播待验收。表达按意思接住，拿不准时保留原话，不以关键词判掌握。</p><div class="actions"><button id="exportJson">完整备份 JSON</button><button id="exportMd">可读记录</button></div><label class="field"><span>导入本孩子、本模式的新节点备份</span><input id="import" type="file" accept=".json,application/json"></label><p id="importStatus" role="status"></p>${node&&node.questions.some(q=>state.progress[q.id]?.review)?'<button id="reviewOnly">只练本段待复习项</button>':''}<details><summary>各段结果和接续点</summary>${CONTENT.nodes.map(n=>{const s=b.nodes[n.id];return `<div class="record-row"><strong>${esc(n.title)}</strong> · ${s?.run?.complete?'这一段练过':s?.run?'暂停在第 '+(s.run.index+1)+' 项':'未有练习记录'}${s?.history?.length?`<details><summary>原始作答 ${s.history.length} 条</summary>${s.history.slice(-40).map(h=>`<p>${esc(h.answers.join(' | '))} · ${esc(h.result)}</p>`).join('')}</details>`:''}</div>`}).join('')}</details><details data-parent-analysis><summary>材料与旧记录</summary><p>${esc(CONTENT.source)}</p><p>${child==='kenton'?'保留原词形15组、动物词表11词，以及本周课堂补充。':'保留 Word Bank 共36词，以及校内补充。'}书面和视频任务由本人报告，不自动完成。</p><a class="button" href="${CONTENT.legacy}${test?'?test=1':''}">打开旧版及原记录</a></details><button id="newRound" class="quiet">家长：另开一轮 30 分钟</button>`;
 $('#modal').showModal();if(which==='tasks'){taskUI();return}
 $('#exportJson').onclick=()=>exportData('json');$('#exportMd').onclick=()=>exportData('md');$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>4000000)throw Error();const x=JSON.parse(await f.text());if(!validBundle(x))throw Error();const before=bundle();if(!write(H.key(child,'import-backup-'+Date.now(),mode),before))throw Error();const originals={};for(const id of Object.keys(x.nodes))originals[id]=read(H.key(child,id,mode));try{for(const [id,s]of Object.entries(x.nodes)){if(s.run)s.run.active=false;if(!write(H.key(child,id,mode),s))throw Error()}if(x.homework&&!write(H.key(child,'homework',mode),x.homework))throw Error()}catch(error){for(const [id,s]of Object.entries(originals))write(H.key(child,id,mode),s);if(before.homework)write(H.key(child,'homework',mode),before.homework);throw error}if(node)state=read(key)||H.empty(child,node.id,mode);$('#importStatus').textContent='导入成功；导入前的记录已保留备份。'}catch{$('#importStatus').textContent='这不是本孩子、本模式的有效备份。原记录没变。'}};if($('#reviewOnly'))$('#reviewOnly').onclick=()=>{$('#modal').close();start(true,true)};$('#newRound').onclick=()=>{const r={id:H.uid(),day:today,usedMs:0,activeKey:'',leaseAt:0};write(sessionKey,r);$('#newRound').textContent='新一轮已准备；孩子可自行选一段。'};
}
function taskUI(){const tk=H.key(child,'homework',mode),oldKey=`study:${child}:${child}-english-week-20260913:v1:${mode}`,legacy=read(oldKey)||{},tasks=read(tk)||{homework:{...legacy.homework},computer:legacy.computer||[false,false,false]};$('#taskList').innerHTML=CONTENT.homework.map(([id,t,tip])=>`<label class="assisted"><input type="checkbox" data-task="${id}" ${tasks.homework[id]?'checked':''}><span>${esc(t)}<small class="hint"> · ${esc(tip)}</small></span></label>`).join('')+(CONTENT.computer?'<h3>老师指定平台上机</h3>'+tasks.computer.map((v,i)=>`<label class="assisted"><input type="checkbox" data-computer="${i}" ${v?'checked':''}>第 ${i+1} 次已实际完成</label>`).join(''):'');document.querySelectorAll('[data-task]').forEach(e=>e.onchange=()=>{tasks.homework[e.dataset.task]=e.checked;write(tk,tasks)});document.querySelectorAll('[data-computer]').forEach(e=>e.onchange=()=>{tasks.computer[+e.dataset.computer]=e.checked;write(tk,tasks)})}
function exportData(kind){const b=bundle();const content=kind==='json'?JSON.stringify(b,null,2):'# '+CONTENT.title+'\n\n'+Object.entries(b.nodes).map(([id,s])=>'## '+CONTENT.nodes.find(n=>n.id===id).title+'\n\n'+s.history.map(h=>'- '+h.at+' | '+h.answers.join(' | ')+' | '+h.result).join('\n')).join('\n\n');const url=URL.createObjectURL(new Blob([content],{type:kind==='json'?'application/json':'text/markdown;charset=utf-8'}));$('#modalBody').innerHTML=`<label class="field"><span>可复制或下载</span><textarea id="exportText" readonly></textarea></label><a class="button primary" href="${url}" download="${child}-english-nodes-${today}.${kind}">下载记录</a>`;$('#exportText').value=content;}
const DAILY_SURPRISES=['先抓一个变化，再自己试。','说法可以不同，意思要说清。','这一段做好了，就可以休息。'];const dailySurpriseKey=child+'-english-nodes-20260913|'+today;$('#dailyTip').textContent=DAILY_SURPRISES[[...dailySurpriseKey].reduce((s,c)=>s+c.charCodeAt(0),0)%DAILY_SURPRISES.length];
$('#parent').onclick=()=>parent();$('#closeModal').onclick=()=>{$('#modal').close();node?renderStart():renderHub()};$('#modal').addEventListener('cancel',e=>{e.preventDefault();$('#closeModal').click()});$('#stop').onclick=()=>settle('pause');
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();if(node)renderStart()}});window.addEventListener('pagehide',()=>pause());window.addEventListener('storage',e=>{if(e.key===sessionKey&&active){const r=session();if(r.activeKey!==key){pause();renderStart()}}});
if(PAGE_KIND==='hub')renderHub();else if(node)renderStart();else{base('找不到这一小段','从英语入口重新选一段。');$('#stage').innerHTML=`<a class="button primary" href="${home}">回英语入口</a>`}
if(test)$('#modeNotice').textContent='家长测试 · 记录与孩子分开';
})();
</script></body></html>
