<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../assets/learning-sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>哥哥英语 · 不规则动词变形实验室</title>
<style>
:root{--blue:#2f6fb3;--blued:#225182;--bluebg:#e8f0fa;--gold:#f2b632;--golddk:#c98a00;
 --ink:#23303a;--paper:#eef5fc;--card:#fff;--line:#dbe7f3;--green:#2e9c54;--greenbg:#e9f7ee;
 --red:#e1553f;--redbg:#fdecea;--muted:#7d8a96;--purple:#7b54c0;--purplebg:#f1ebfa;--orange:#e8842c;--orangebg:#fdf1e3;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'LXGW WenKai Screen','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
 background:radial-gradient(circle at 10% 4%,#d3e6fb 0,transparent 40%),radial-gradient(circle at 92% 98%,#dde9fb 0,transparent 44%),var(--paper);
 color:var(--ink);min-height:100vh;padding:0 0 50px;}
.wrap{max-width:620px;margin:0 auto;padding:12px;}
.top{display:flex;align-items:center;gap:10px;padding:8px 2px 6px;}
.badge{background:var(--blue);color:#fff;font-weight:800;font-size:17px;padding:6px 13px;border-radius:13px 13px 13px 4px;box-shadow:0 4px 0 var(--blued);}
.top h1{font-size:16px;margin:0;flex:1;}
.top .home{text-decoration:none;font-size:20px;background:#fff;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink);box-shadow:0 3px 0 #cddcec;}
.mute{font-size:18px;background:#fff;border:none;width:38px;height:38px;border-radius:11px;cursor:pointer;box-shadow:0 3px 0 #cddcec;}
.intro{font-size:13px;color:var(--muted);line-height:1.7;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;}
.intro b{color:var(--blued);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
.tile{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 12px;cursor:pointer;box-shadow:0 6px 0 #e1ecf7;text-align:center;transition:transform .08s;border-top:6px solid var(--blue);position:relative;}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 #e1ecf7;}
.tile .ic{font-size:38px;line-height:1;}
.tile .nm{font-weight:800;font-size:16px;margin-top:8px;color:var(--blued);}
.tile .ds{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
.tile .done{position:absolute;top:6px;right:8px;font-size:11px;font-weight:800;color:var(--green);background:var(--greenbg);border-radius:8px;padding:2px 7px;}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:11px 0;box-shadow:0 6px 0 #e4eef8;}
.h2{font-size:18px;font-weight:800;margin:0 0 4px;color:var(--blued);}
.hint{font-size:13px;color:var(--muted);line-height:1.7;}
.btn{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:13px;padding:11px 16px;cursor:pointer;color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blued);transition:transform .06s;}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blued);}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 var(--golddk);color:#5a3d00;}
.btn.ghost{background:#fff;color:var(--blued);border:2px solid var(--blue);box-shadow:0 5px 0 #cddcec;}
.btn.green{background:var(--green);box-shadow:0 5px 0 #1f7a3e;}
.btn.red{background:var(--red);box-shadow:0 5px 0 #a83b2a;}
.btn.sm{font-size:13.5px;padding:9px 13px;}
.btn:disabled{opacity:.45;box-shadow:none;transform:none;}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.center{justify-content:center;}
.hide{display:none!important;}
.back{background:none;border:none;color:var(--muted);font-size:15px;font-family:inherit;cursor:pointer;font-weight:800;padding:6px 2px;}
.why{background:var(--greenbg);border-left:5px solid var(--green);border-radius:10px;padding:11px 14px;font-size:14px;line-height:1.7;margin:10px 0;}
.why.bad{background:var(--redbg);border-left-color:var(--red);}
.why .lab{font-weight:800;color:var(--green);}
.why.bad .lab{color:var(--red);}
.opts{display:grid;gap:10px;margin-top:8px;}
.opt{font-family:inherit;font-size:16px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:13px;padding:12px 15px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 #e4eef8;}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 #e4eef8;}
.opt.right{background:var(--greenbg);border-color:var(--green);color:var(--green);font-weight:800;}
.opt.wrong{background:var(--redbg);border-color:var(--red);color:var(--red);font-weight:800;}
.opt.off{pointer-events:none;}
.formula{background:var(--bluebg);border-radius:13px;padding:12px 14px;font-size:15px;line-height:1.8;margin:8px 0;}
.formula b{color:var(--blued);}
.say{font-family:inherit;font-size:13.5px;font-weight:800;padding:7px 13px;border-radius:11px;border:2px solid var(--gold);background:#fffaf0;color:var(--golddk);cursor:pointer;box-shadow:0 3px 0 #f0dca0;}
.pgr{font-size:12.5px;color:var(--muted);text-align:center;margin:2px 0 6px;}
.stamp{display:inline-block;border:3px solid var(--green);color:var(--green);font-weight:800;border-radius:10px;padding:3px 10px;font-size:14px;transform:rotate(-6deg);margin:6px 0;}
/* ---- 魔法阵脑图 ---- */
.mapsvg{width:100%;height:auto;display:block;}
.mapsvg .node{cursor:pointer;}
.famchips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
.chip{font-family:inherit;font-size:14.5px;font-weight:800;padding:8px 12px;border-radius:11px;border:2px solid var(--line);background:#fff;color:var(--blued);cursor:pointer;box-shadow:0 3px 0 #e4eef8;}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.chip small{font-weight:600;color:inherit;opacity:.7;}
.rulebox{border-radius:13px;padding:12px 14px;font-size:14px;line-height:1.8;margin:8px 0;}
.rulebox b{font-weight:800;}
/* ---- 变形动画 ---- */
.morphrow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0 6px;}
.mstage{font-size:26px;font-weight:800;background:#fff;border:2px solid var(--line);border-radius:13px;padding:8px 14px;opacity:0;transform:scale(.6);transition:all .45s cubic-bezier(.34,1.56,.64,1);letter-spacing:1px;}
.mstage.go{opacity:1;transform:scale(1);}
.mstage.st0{border-color:var(--blue);color:var(--blued);}
.mstage.st1{border-color:var(--orange);color:var(--orange);}
.mstage.st2{border-color:var(--purple);color:var(--purple);}
.mstage .hl{color:var(--red);border-bottom:3px solid var(--red);font-style:normal;}
.mstage .fl{display:block;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:0;text-align:center;}
.marw{font-size:20px;color:var(--muted);opacity:0;transition:opacity .4s;}
.marw.go{opacity:1;}
.ftable{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0;}
.ftable td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
.ftable td:first-child{background:var(--bluebg);font-weight:800;color:var(--blued);width:38%;}
.tipbox{background:#fffaf0;border:2px dashed var(--gold);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.7;margin:8px 0;}
.tipbox b{color:var(--golddk);}
/* ---- 时光机 ---- */
.tl{position:relative;height:200px;background:linear-gradient(180deg,#f7fbff,#eef5fd);border:2px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden;}
.tl .axis{position:absolute;left:4%;right:4%;top:150px;height:5px;background:#c8d9ec;border-radius:3px;}
.tl .axis:after{content:"";position:absolute;right:-2px;top:-6px;border-left:14px solid #c8d9ec;border-top:8px solid transparent;border-bottom:8px solid transparent;}
.tl .mk{position:absolute;top:162px;font-size:12px;font-weight:800;color:var(--muted);transform:translateX(-50%);}
.tl .nowline{position:absolute;top:20px;bottom:36px;width:0;border-left:2px dashed var(--red);left:62%;}
.tl .nowtag{position:absolute;top:4px;left:62%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--red);}
.ech{position:absolute;font-size:12.5px;font-weight:800;background:#fff;border:2px solid var(--blue);color:var(--blued);border-radius:10px;padding:5px 8px;box-shadow:0 3px 0 #d7e5f4;opacity:0;transform:translateY(10px) scale(.85);transition:all .5s;white-space:nowrap;}
.ech.gold{border-color:var(--gold);color:var(--golddk);}
.ech.purple{border-color:var(--purple);color:var(--purple);}
.ech.go{opacity:1;transform:translateY(0) scale(1);}
.ech .tag{display:block;font-size:10.5px;color:var(--red);font-weight:800;}
.ebar{position:absolute;height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--purple) 0 12px,#a98bd6 12px 24px);width:0;transition:width 1.6s linear;opacity:.9;}
.tlcap{background:var(--purplebg);border-radius:11px;padding:10px 13px;font-size:14px;line-height:1.7;min-height:44px;margin:8px 0;}
.tlcap b{color:var(--purple);}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.ech.pulse{animation:pulse 1s infinite;}
/* ---- 翻卡 ---- */
.fbox{perspective:900px;margin:12px auto;max-width:340px;height:230px;}
.fcard{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s;cursor:pointer;}
.fcard.flip{transform:rotateY(180deg);}
.fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;}
.ffront{background:linear-gradient(160deg,#fff,#eaf2fc);border:3px solid var(--blue);}
.fback{background:linear-gradient(160deg,#fff,#f3edfc);border:3px solid var(--purple);transform:rotateY(180deg);}
.fword{font-size:38px;font-weight:800;color:var(--blued);letter-spacing:1px;}
.fcn{font-size:16px;color:var(--muted);font-weight:700;}
.fipa{font-size:14px;color:var(--muted);}
.ftap{font-size:12px;color:var(--muted);margin-top:8px;}
.bform{font-size:22px;font-weight:800;margin:2px 0;}
.bform .hl{color:var(--red);border-bottom:3px solid var(--red);font-style:normal;}
.bform .bl{font-size:11px;color:var(--muted);font-weight:800;margin-right:6px;}
.btip{font-size:12px;color:var(--muted);line-height:1.5;text-align:center;margin-top:4px;}
/* ---- 分拣机 ---- */
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
.basket{border:3px dashed var(--blue);background:var(--bluebg);border-radius:15px;padding:12px 8px;text-align:center;font-weight:800;color:var(--blued);cursor:pointer;font-size:14.5px;font-family:inherit;}
.basket small{display:block;font-weight:600;color:var(--muted);font-size:11px;margin-top:3px;}
.basket:active{transform:scale(.97);}
.basket.hit{background:var(--greenbg);border-color:var(--green);color:var(--green);}
.basket.miss{background:var(--redbg);border-color:var(--red);color:var(--red);}
.sortword{font-size:26px;font-weight:800;text-align:center;margin:10px 0;color:var(--ink);letter-spacing:1px;}
/* ---- 背诵演练 ---- */
.bigword{font-size:42px;font-weight:800;text-align:center;color:var(--blued);letter-spacing:2px;margin:8px 0 0;}
.bigcn{font-size:16px;text-align:center;color:var(--muted);font-weight:700;margin-bottom:6px;}
.sayzone{background:var(--orangebg);border:2px dashed var(--orange);border-radius:13px;padding:12px;text-align:center;font-size:14.5px;line-height:1.7;margin:10px 0;color:#8a5200;font-weight:700;}
.anschip{font-family:inherit;font-size:23px;font-weight:800;background:#fff;border:3px solid var(--green);color:var(--green);border-radius:13px;padding:9px 16px;cursor:pointer;letter-spacing:1px;}
.anschip .bl{display:block;font-size:10.5px;color:var(--muted);letter-spacing:0;}
.anschip.bad{border-color:var(--red);color:var(--red);background:var(--redbg);text-decoration:line-through;}
.ansnote{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;}
.wbrow{background:var(--bluebg);border-radius:12px;padding:10px 13px;margin:7px 0;font-size:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.wbrow b{font-size:17px;color:var(--blued);}
.wbrow .cnt{font-size:12px;color:var(--red);font-weight:800;}
.wbrow .stk{font-size:12px;color:var(--green);font-weight:800;}
.rec{background:var(--bluebg);border-radius:12px;padding:11px 13px;margin:8px 0;font-size:13.5px;line-height:1.8;}
.rec b{color:var(--blued);}
.tipbar{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6;}
.en{border-bottom:1px dashed rgba(122,110,130,.4);cursor:pointer;padding:0 1px;border-radius:3px;}
.en:active{background:#ffe9a8;}
#bub{position:fixed;background:#fff;border-radius:13px;padding:11px 15px;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:9999;max-width:280px;text-align:center;border:2px solid var(--gold);animation:pop .25s;}
#bub .be{font-size:13.5px;font-weight:800;}
#bub .bc{font-size:15px;font-weight:800;color:var(--blued);margin-top:3px;}
@keyframes pop{0%{transform:scale(.7);opacity:0;}60%{transform:scale(1.06);}100%{transform:scale(1);opacity:1;}}
textarea.exp{width:100%;height:120px;font-family:inherit;font-size:12px;border:2px solid var(--line);border-radius:10px;padding:8px;}
.sen{font-size:16px;font-weight:700;line-height:1.7;text-align:center;margin:10px 0 2px;}
.sencn{font-size:13px;color:var(--muted);text-align:center;margin-bottom:6px;}
/* ---- 语法术语：点一下有解释 ---- */
.term{border-bottom:2px dotted var(--blue);cursor:pointer;color:inherit;font-style:normal;}
.term:active{background:#ffe9a8;border-radius:3px;}
.gl{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0;margin-top:2px;}
.gli{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:0;}
.termbar{font-size:11.5px;color:var(--muted);text-align:center;margin:4px 0 0;}
/* ---- 三张脸入门 ---- */
.idots{display:flex;gap:6px;justify-content:center;margin:8px 0 2px;}
.idot{width:10px;height:10px;border-radius:50%;background:#c8d9ec;transition:all .3s;}
.idot.on{background:var(--blue);transform:scale(1.3);}
.ivis{background:linear-gradient(180deg,#f7fbff,#eef5fd);border:2px solid var(--line);border-radius:14px;padding:16px 12px;margin:10px 0;text-align:center;min-height:150px;}
.ibig{font-size:30px;font-weight:800;letter-spacing:1px;margin:6px 0;}
.ivrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.ivword{background:#fff;border:2px solid var(--line);border-radius:13px;padding:10px 14px;font-weight:800;font-size:17px;animation:pop .5s;}
.ivword small{display:block;font-size:12px;color:var(--muted);font-weight:700;}
.ivline{font-size:16.5px;font-weight:700;line-height:1.9;margin:6px 0;animation:pop .5s;}
.ivline .zh{color:var(--muted);font-size:13px;font-weight:600;display:block;}
.hand{display:inline-block;animation:pulse 1.2s infinite;}
.facecard{display:inline-block;background:#fff;border-radius:13px;padding:9px 15px;font-weight:800;font-size:22px;margin:4px;animation:pop .55s;}
.facecard small{display:block;font-size:11px;font-weight:800;letter-spacing:0;}
.kout{background:var(--bluebg);border-radius:12px;padding:10px 13px;font-size:14.5px;line-height:2;margin:6px 0;text-align:left;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="home" href="../apps.html?who=kenton">‹</a>
    <span class="badge">哥哥</span>
    <h1>英语 · 不规则动词变形实验室（31~90）</h1>
    <button class="mute" id="muteBtn">🔔</button>
  </div>
  <div id="home"></div>
  <div id="view" class="hide">
    <button class="back" id="backBtn">← 回实验室大厅</button>
    <div id="stage"></div>
  </div>
  <div class="tipbar">把「136个不规则动词表」的 31~90 号做成会动的实验室（顶部可切批次）——先看变形规律，再背就轻松。<br>英文看不懂？<b>长按</b>带虚线的英文可以看中文。</div>
</div>

<script>
"use strict";
/* ===================== 朗读：audio-first（预合成神经音优先，缺失回退浏览器TTS） ===================== */
const AUDIO_DIR="audio/kenton_verb_lab/";
let exAudio=null,audioTok=0;
/* 必须与 tools 脚本 fnv() 一致：对 (lang+"|"+text) 的 UTF-8 字节做 FNV-1a，8位十六进制 */
function audioHash(s){const b=new TextEncoder().encode(s);let x=0x811c9dc5>>>0;for(let i=0;i<b.length;i++){x^=b[i];x=Math.imul(x,0x01000193)>>>0;}return('0000000'+x.toString(16)).slice(-8);}
function getExAudio(){if(!exAudio){exAudio=new Audio();exAudio.setAttribute('playsinline','');exAudio.preload='auto';try{document.body.appendChild(exAudio);}catch(e){}}return exAudio;}
function mkUtter(t,lang){const u=new SpeechSynthesisUtterance(t);u.lang=(lang==='en')?'en-US':'zh-CN';u.rate=(lang==='en')?0.85:0.95;u.pitch=1.03;
  try{const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang&&x.lang.startsWith(lang==='en'?'en':'zh'));if(v)u.voice=v;}catch(e){}return u;}
/* Chrome/Edge 坑：cancel() 后立刻 speak() 会被静默吞掉，必须隔一拍再说 */
let ttsTok=0;
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{try{speechSynthesis.getVoices();}catch(e){}};}catch(e){}
function ttsSpeakOnce(t,lang){
  if(!('speechSynthesis'in window))return;
  try{speechSynthesis.cancel();}catch(e){}
  ttsTok++;const my=ttsTok;
  setTimeout(()=>{if(my!==ttsTok)return;
    try{speechSynthesis.resume();speechSynthesis.speak(mkUtter(t,lang));}catch(e){}
  },120);
}
function speakOnce(t,lang){
  lang=lang||'en';
  try{speechSynthesis.cancel();}catch(e){}
  ttsTok++;audioTok++;const myTok=audioTok;
  const a=getExAudio();let done=false;
  const stale=()=>done||myTok!==audioTok;
  const fb=()=>{if(stale())return;done=true;ttsSpeakOnce(t,lang);};
  a.onended=()=>{if(stale())return;done=true;};
  a.onerror=fb;
  try{a.pause();}catch(e){}
  a.src=AUDIO_DIR+audioHash(lang+"|"+t)+".mp3";
  try{a.currentTime=0;}catch(e){}
  const p=a.play();
  if(p&&typeof p.catch==='function')p.catch(fb);
}
/* ===================== 音效 + 静音 ===================== */
let actx=null,muted=localStorage.getItem('kvl_mute')==='1';
function beep(ok){
  if(muted)return;
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime;
    (ok?[[523,0],[659,.09],[784,.18]]:[[196,0],[147,.14]]).forEach(f=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=ok?'triangle':'sawtooth';o.frequency.value=f[0];
      g.gain.setValueAtTime(.0001,t+f[1]);g.gain.exponentialRampToValueAtTime(.18,t+f[1]+.02);g.gain.exponentialRampToValueAtTime(.0001,t+f[1]+.22);
      o.connect(g);g.connect(actx.destination);o.start(t+f[1]);o.stop(t+f[1]+.26);});
  }catch(e){}
}
function syncMute(){document.getElementById('muteBtn').textContent=muted?'🔕':'🔔';}
document.getElementById('muteBtn').onclick=()=>{muted=!muted;localStorage.setItem('kvl_mute',muted?'1':'0');syncMute();};
syncMute();

/* ===================== 错词本（持久，默错过就进，连对2次才出关） ===================== */
const WB_KEY='kvl_wrongbook_v1';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return{};}}
function wbSave(w){localStorage.setItem(WB_KEY,JSON.stringify(w));}
function wbAddWrong(word){const w=wbLoad();const e=w[word]||{wrong:0,streak:0,mastered:false};e.wrong++;e.streak=0;e.mastered=false;e.last=Date.now();w[word]=e;wbSave(w);}
function wbAddRight(word){const w=wbLoad();const e=w[word];if(!e||e.mastered)return;e.streak++;e.last=Date.now();if(e.streak>=2)e.mastered=true;w[word]=e;wbSave(w);}
function wbActive(){const w=wbLoad();return Object.keys(w).filter(k=>!w[k].mastered);}

/* ===================== 记录（localStorage + 导出） ===================== */
const EV_KEY='kvl_events_v1';
function loadEv(){try{return JSON.parse(localStorage.getItem(EV_KEY)||'[]');}catch(e){return[];}}
function logEvent(ev){
  const a=loadEv();a.push(ev);localStorage.setItem(EV_KEY,JSON.stringify(a));
  /* dict 事件的词都要进/出错词本；背诵演练已逐词实时写过（wbApplied），不再重复计 */
  if(ev.type==='dict'&&!ev.wbApplied)(ev.items||[]).forEach(it=>{if(it.ok)wbAddRight(it.word);else wbAddWrong(it.word);});
}
function lastScore(lesson){const a=loadEv();for(let i=a.length-1;i>=0;i--)if(a[i].lesson===lesson)return a[i];return null;}

const DICT={'school':'学校','every day':'每天','park':'公园','yesterday':'昨天','work':'工作/上班','home':'家',
'gift':'礼物','birthday':'生日','book':'书','books':'书(复数)','homework':'作业','water bottle':'水壶','morning':'早晨',
'name':'名字','trees':'树(复数)','tree':'树','spring':'春天','meters':'米(复数)','last year':'去年','tall':'高的',
'leaves':'树叶(复数)','autumn':'秋天','head':'头','never':'从不','already':'已经','look':'看','brother':'弟弟/哥哥',
'this year':'今年','fast':'快','wow':'哇','oh no':'哦不','he is not at home now':'他现在不在家'};
function getTrans(t){
  if(!t)return null;const c=t.trim().replace(/[.,!?;:'"]+$/,'').trim();
  if(DICT[c])return DICT[c];const lo=c.toLowerCase();
  for(const k in DICT)if(k.toLowerCase()===lo)return DICT[k];
  const ws=c.split(/\s+/);
  if(ws.length>1)return ws.map(w=>{const wc=w.replace(/[.,!?;:'"]+$/,'');if(DICT[wc])return DICT[wc];const wl=wc.toLowerCase();for(const k in DICT)if(k.toLowerCase()===wl)return DICT[k];return wc;}).join(' · ');
  return null;
}
function hideBub(){const b=document.getElementById('bub');if(b)b.remove();}
function showBub(text,x,y){
  hideBub();const tr=getTrans(text);if(!tr)return;
  const b=document.createElement('div');b.id='bub';
  b.innerHTML='<div class="be">'+text+'</div><div class="bc">'+tr+'</div>';
  document.body.appendChild(b);
  const r=b.getBoundingClientRect();
  let l=x-r.width/2,t=y-r.height-16;
  if(l<8)l=8;if(l+r.width>window.innerWidth-8)l=window.innerWidth-r.width-8;if(t<8)t=y+24;
  b.style.left=l+'px';b.style.top=t+'px';
  setTimeout(()=>{document.addEventListener('click',hideBub,{once:true});document.addEventListener('touchstart',hideBub,{once:true});},120);
}
let lpT=null,lpEl=null;
document.addEventListener('touchstart',e=>{const el=e.target.closest('.en');if(!el)return;lpEl=el;const tc=e.touches[0];
  lpT=setTimeout(()=>{if(lpEl===el){showBub(el.textContent||'',tc.clientX,tc.clientY);if(navigator.vibrate)navigator.vibrate(30);}},480);},{passive:true});
document.addEventListener('touchend',()=>{clearTimeout(lpT);lpEl=null;},{passive:true});
document.addEventListener('touchmove',()=>{clearTimeout(lpT);lpEl=null;},{passive:true});
document.addEventListener('mousedown',e=>{const el=e.target.closest('.en');if(!el)return;lpEl=el;
  lpT=setTimeout(()=>{if(lpEl===el)showBub(el.textContent||'',e.clientX,e.clientY);},480);});
document.addEventListener('mouseup',()=>{clearTimeout(lpT);lpEl=null;});
document.addEventListener('dblclick',e=>{const el=e.target.closest('.en');if(!el)return;e.preventDefault();showBub(el.textContent||'',e.clientX,e.clientY);});
document.addEventListener('click',e=>{const el=e.target.closest('[data-say]');if(!el)return;speakOnce(el.dataset.say,el.dataset.lang||'en');});
/* ===================== 语法术语：点一下弹出小讲解 ===================== */
const TERMS={
 '动词':'表示"做什么动作"的词。比如 fall 落下、go 去、eat 吃。',
 '原形':'动词平时的样子（词典里的样子）。说"现在、经常、每天做"的事就用它：I go to school every day. 我每天去上学。',
 '过去式':'动词的第二张脸：事情发生在过去（昨天/去年/刚才）就用它。它可以自己单独用：I went to the park yesterday. 我昨天去了公园。',
 '过去分词':'动词的第三张脸："已经做完"的样子。它是个小跟班，不能自己单独用，必须牵着 have/has 的手：Dad has gone to work. 爸爸已经去上班了。',
 '三单':'"他/她/它"一个人（一个东西）做事时，动词后面要加 s：he goes、she falls。',
 '现在分词':'"正在做"的样子（动词+ing），要跟 am/is/are 搭档：He is going. 他正在去。',
 'have/has':'和过去分词手拉手，表示"已经做完了"：I have finished. 我已经做完了。他/她/它用 has，其他人用 have。'
};
function term(t){return '<span class="term" data-term="'+t+'">'+t+'</span>';}
function showTermBub(t,x,y){
  hideBub();const tr=TERMS[t];if(!tr)return;
  const b=document.createElement('div');b.id='bub';
  b.innerHTML='<div class="be">📖 '+t+'</div><div class="bc" style="font-size:13px;font-weight:600;text-align:left;line-height:1.7;">'+tr+'</div>';
  document.body.appendChild(b);
  const r=b.getBoundingClientRect();
  let l=x-r.width/2,tp=y-r.height-16;
  if(l<8)l=8;if(l+r.width>window.innerWidth-8)l=window.innerWidth-r.width-8;if(tp<8)tp=y+24;
  b.style.left=l+'px';b.style.top=tp+'px';
  setTimeout(()=>{document.addEventListener('click',hideBub,{once:true});document.addEventListener('touchstart',hideBub,{once:true});},120);
}
document.addEventListener('click',e=>{const el=e.target.closest('.term');if(!el)return;e.stopPropagation();showTermBub(el.dataset.term,e.clientX||window.innerWidth/2,e.clientY||120);});
/* 每个动词形态的中文小注释（跟在单词后面） */
function cn0(v){return v.cn.split(/[，,]/)[0];}
function gloss(v){const c=cn0(v);if(v.pp==='/')return{b:c,p:'过去'+c,q:'（没有）'};return{b:c,p:'昨天'+c+'了',q:'已经'+c};}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function enS(t){return '<span class="en">'+esc(t)+'</span>';}
function sayBtn(t,label){return '<button class="say" data-say="'+esc(t)+'" data-lang="en">🔊 '+(label||'听')+'</button>';}

function batchDef(){return BATCHES.find(b=>b.id===curBatch);}

function curFams(){const set=new Set(CUR().map(v=>v.fam));return FAMORDER.filter(k=>set.has(k));}
function famOf(v){return FAMS[v.fam];}
function isMod(v){return v.pp==='/';}
function triple(v){if(v.say)return v.say;return isMod(v)?(v.base+', '+v.past):(v.base+', '+v.past+', '+v.pp);}
function hl(s){return esc(s).replace(/\[([^\]]+)\]/g,'<i class="hl">$1</i>');}

let iIdx=0,iqIdx=0,iqItems=[],iqT0=0;
function renderIntro(){iIdx=0;introStep();}
function introStep(){
  const s=ISTEPS[iIdx];
  let h='<div class="card"><div class="h2">🎈 三张脸入门</div>'+
   '<div class="idots">'+ISTEPS.map((x,i)=>'<div class="idot'+(i===iIdx?' on':'')+'"></div>').join('')+'</div>'+
   '<div class="pgr">第 '+(iIdx+1)+' / '+ISTEPS.length+' 步 · '+s.t+'</div>'+
   '<div class="ivis">'+s.vis+'</div>'+
   '<div class="tlcap">👉 '+s.cap+'</div>'+
   (s.say?'<div class="row center">'+sayBtn(s.say,'听这句')+'</div>':'')+
   '<div class="termbar">带虚线的词（如'+term('过去分词')+'）都可以<b>点一下看解释</b></div>'+
   '<div class="row center" style="margin-top:10px;">'+
    (iIdx>0?'<button class="btn ghost" id="iPrev">← 上一步</button>':'')+
    (iIdx<ISTEPS.length-1?'<button class="btn" id="iNext">下一步 →</button>':'<button class="btn gold" id="iQuiz">✏️ 学会了？试3小题</button>')+
   '</div></div>';
  $('stage').innerHTML=h;
  if(s.say)speakOnce(s.say,'en');
  const p=$('iPrev');if(p)p.onclick=()=>{iIdx--;introStep();};
  const n=$('iNext');if(n)n.onclick=()=>{iIdx++;introStep();beep(true);};
  const q=$('iQuiz');if(q)q.onclick=()=>{iqIdx=0;iqItems=[];iqT0=Date.now();introQ();};
}
function introQ(){
  if(iqIdx>=IQ.length){
    finishMod('三张脸入门',iqItems,iqT0);beep(true);
    const wrong=iqItems.filter(x=>!x.ok).length;
    $('stage').innerHTML='<div class="card" style="text-align:center;"><div style="font-size:52px;">🎈🎉</div>'+
     '<div class="h2">入门完成！对 '+(IQ.length-wrong)+' / '+IQ.length+'</div>'+
     '<div class="hint">记住：<b>原形＝现在经常做 · 过去式＝昨天做过了 · have/has+过去分词＝已经做完了</b></div>'+
     '<div class="row center" style="margin-top:10px;"><button class="btn" onclick="renderIntro()">🔁 再看一遍</button>'+
     '<button class="btn gold" onclick="openMod(\'map\')">🧠 去魔法阵认词</button></div></div>';
    return;
  }
  const q=IQ[iqIdx],t0=Date.now();
  $('stage').innerHTML='<div class="card"><div class="pgr">小检验 '+(iqIdx+1)+' / '+IQ.length+'</div>'+
   '<div class="sen" style="font-size:16px;">'+q.stem+'</div><div class="opts" id="iqOpts">'+
   q.opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div><div id="iqFb"></div></div>';
  document.querySelectorAll('#iqOpts .opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,ok=i===q.a;
    document.querySelectorAll('#iqOpts .opt').forEach(x=>x.classList.add('off'));
    b.classList.add(ok?'right':'wrong');
    if(!ok)document.querySelector('#iqOpts .opt[data-i="'+q.a+'"]').classList.add('right');
    beep(ok);
    iqItems.push({word:'入门第'+(iqIdx+1)+'题',hint:q.stem,ok:ok,ms:Date.now()-t0,user:q.opts[i],tag:q.why});
    $('iqFb').innerHTML='<div class="why'+(ok?'':' bad')+'"><span class="lab">'+(ok?'✅ 对啦！':'❌ 看讲解：')+'</span> '+q.why+'</div>'+
     '<div class="row center"><button class="btn" id="iqNx">'+(iqIdx<IQ.length-1?'下一题 →':'完成 ✅')+'</button></div>';
    $('iqNx').onclick=()=>{iqIdx++;introQ();};
  });
}

  morphTimers.push(setTimeout(()=>{const e=$('a0');if(e)e.classList.add('go');},750));
  morphTimers.push(setTimeout(()=>{const e=$('m1');if(e)e.classList.add('go');},1000));
  morphTimers.push(setTimeout(()=>{const e=$('a1');if(e)e.classList.add('go');},1600));
  morphTimers.push(setTimeout(()=>{const e=$('m2');if(e)e.classList.add('go');},1850));

    '<button class="btn" onclick="renderRecite(null)">🎤 再背一轮</button>'+
    '<button class="btn ghost" onclick="document.getElementById(\'backBtn\').click()">回大厅</button></div></div>';
  const rd=$('rRedo');if(rd)rd.onclick=()=>{rLesson='错词重背';startRecite(wrongVerbs.slice());};
}

/* ===================== 🔁 错词本 ===================== */
function renderWrong(){
  const w=wbLoad();
  const act=Object.keys(w).filter(k=>!w[k].mastered);
  const done=Object.keys(w).filter(k=>w[k].mastered);
  let h='<div class="card"><div class="h2">🔁 我的错词本</div>'+
   '<div class="hint">背诵演练里说错的词自动住进来；<b>连续答对 2 次</b>才算掌握、自动搬出去。</div>';
  if(!act.length&&!done.length){h+='<div class="hint" style="margin-top:8px;">错词本是空的——先去🎤背诵演练吧！</div></div>';$('stage').innerHTML=h;return;}
  if(act.length){
    h+='<div style="margin-top:8px;"><b style="color:var(--red);">还没过关（'+act.length+'个）：</b>'+
     act.map(k=>{const v=VERBS.find(x=>x.base===k),e=w[k];if(!v)return'';
       return '<div class="wbrow"><b>'+v.base+'</b>（'+esc(cn0(v))+'）→ '+v.past+' → '+(isMod(v)?'—':v.pp)+
        '<span class="cnt">错'+e.wrong+'次</span><span class="stk">连对'+e.streak+'/2</span>'+sayBtn(triple(v),'听')+
        '<span style="flex-basis:100%;font-size:12px;color:var(--muted);">💡 '+esc(v.tip)+'</span></div>';}).join('')+'</div>';
    h+='<div class="row center" style="margin-top:10px;"><button class="btn red" id="wbGo">🎤 重背错词（'+act.length+'个）</button></div>';
  }
  if(done.length)h+='<div style="margin-top:10px;"><b style="color:var(--green);">已过关 🎉：</b><div class="hint">'+done.join(' · ')+'</div></div>';
  h+='</div>';
  $('stage').innerHTML=h;
  const g=$('wbGo');if(g)g.onclick=()=>{rLesson='错词重背';startRecite(VERBS.filter(v=>act.includes(v.base)));};
}

/* ===================== 📖 学习记录 ===================== */
function buildExport(){
  const evs=loadEv();
  const wrongMap={};
  evs.forEach(e=>(e.items||[]).forEach(it=>{if(!it.ok){const k=it.word;wrongMap[k]=(wrongMap[k]||0)+1;}}));
  let txt='【哥哥 · 不规则动词变形实验室(31~61) · 练习导出】\n日期：'+new Date().toLocaleString('zh-CN')+'\n\n== 错词本（说错过、还没连对2次的） ==\n';
  const w=wbLoad(),act=Object.keys(w).filter(k=>!w[k].mastered);
  txt+=act.length?act.map(k=>{const v=VERBS.find(x=>x.base===k);return '- '+k+(v?' → '+v.past+' → '+(isMod(v)?'—':v.pp):'')+'（错'+w[k].wrong+'次，连对'+w[k].streak+'/2）';}).join('\n'):'（空）';
  const done=Object.keys(w).filter(k=>w[k].mastered);
  if(done.length)txt+='\n已过关：'+done.join('、');
  txt+='\n\n== 反复错的题（错≥2） ==\n';
  const rep=Object.entries(wrongMap).filter(x=>x[1]>=2);
  txt+=rep.length?rep.map(x=>'- '+x[0]+'（错'+x[1]+'次）').join('\n'):'（暂无）';
  txt+='\n\n== 每次明细 ==\n';
  evs.forEach(e=>{txt+='['+new Date(e.ts).toLocaleString('zh-CN')+'] '+e.lesson+'：共'+e.total+'题 错'+e.wrong+'题 用时'+(e.durationSec||0)+'s\n';
    (e.items||[]).forEach(it=>{if(!it.ok)txt+='   ❌ '+(it.word||'')+'：'+(it.hint||'')+'（'+(it.user||'?')+'）\n';});});
  txt+='\n== 原始JSON（投喂给爸爸的Claude归档用） ==\n'+JSON.stringify({child:'哥哥',subject:'英语·不规则动词31-61',events:evs,wrongbook:w});
  return txt;
}
function renderRec(){
  const evs=loadEv();
  const mods={};evs.forEach(e=>{mods[e.lesson]=e;});
  let h='<div class="card"><div class="h2">📖 我的学习记录</div>';
  if(!evs.length){h+='<div class="hint">还没有记录，先去玩魔法阵吧！</div></div>';$('stage').innerHTML=h;return;}
  h+='<div class="rec"><b>已练 '+evs.length+' 次</b> · 共 '+evs.reduce((s,e)=>s+e.total,0)+' 题 · 错 '+evs.reduce((s,e)=>s+e.wrong,0)+' 题</div>';
  h+=Object.values(mods).map(e=>'<div class="rec"><b>'+e.lesson+'</b>（最近一次）：✅对'+(e.total-e.wrong)+' ❌错'+e.wrong+' · '+new Date(e.ts).toLocaleDateString('zh-CN')+'</div>').join('');
  const w=wbLoad(),act=Object.keys(w).filter(k=>!w[k].mastered);
  h+='<div class="rec"><b>错词本</b>：'+(act.length?('还没过关 <b style="color:var(--red);">'+act.length+'</b> 个：'+act.join('、')):'全部过关 🎉')+'</div>';
  h+='<div class="row center" style="margin-top:10px;"><button class="btn" id="cpBtn">📋 复制导出</button>'+
     '<button class="btn ghost" id="dlBtn">💾 存成文件</button>'+
     '<button class="btn ghost sm" id="clrBtn" style="color:var(--red);border-color:var(--red);">🗑 清空</button></div>'+
     '<textarea class="exp hide" id="expTxt"></textarea></div>';
  $('stage').innerHTML=h;
  $('cpBtn').onclick=()=>{const t=buildExport();const ta=$('expTxt');ta.classList.remove('hide');ta.value=t;ta.select();
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{$('cpBtn').textContent='✅ 已复制';}).catch(()=>{document.execCommand('copy');$('cpBtn').textContent='✅ 已复制';});
    else{document.execCommand('copy');$('cpBtn').textContent='✅ 已复制';}};
  $('dlBtn').onclick=()=>{const b=new Blob([buildExport()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='哥哥_不规则动词31-61_练习记录_'+new Date().toISOString().slice(0,10)+'.txt';a.click();};
  $('clrBtn').onclick=()=>{if(confirm('确定清空全部练习记录？（错词本会保留；导出之后再清哦）')){localStorage.removeItem(EV_KEY);renderRec();}};
}

renderHome();
</script>
