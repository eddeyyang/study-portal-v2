<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="lesson-audio" content="pending: 30条Aria神经音已外置apps/audio/kenton_verb_sprint_0130_20260803/，机器校验通过；手机实播待家长验收">
<title>动词三态 · 默写冲刺营（1—30）· Kenton</title>
<style>
:root{--bg:#fff7f0;--card:#ffffff;--ink:#33304b;--teal:#0ea5a5;--teal-d:#0b7c7c;--pink:#f472b6;--amber:#f59e0b;--red:#ef4444;--line:#f3e4d8;--soft:#fdf1e7}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
header{position:sticky;top:0;z-index:9;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--amber),#fbbf24);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:0 3px 0 #b45309}
.brand{font-weight:800;font-size:14px}
header .sp{flex:1}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer}
main{padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 4px 0 rgba(243,228,216,.8);margin-bottom:14px}
.tag{display:inline-block;background:#fef3d9;color:#a86a00;font-size:12px;font-weight:800;border-radius:8px;padding:4px 10px;margin-bottom:10px}
h1{font-size:22px;line-height:1.3;margin-bottom:8px}
h2{font-size:19px;margin-bottom:6px}
.sub{font-size:13.5px;color:#7a7690;line-height:1.7}
.big{font-size:32px;font-weight:900;text-align:center;letter-spacing:1px}
.zh{text-align:center;color:#7a7690;font-size:14px;margin-top:2px}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:15px;font-size:16.5px;font-weight:800;cursor:pointer;margin-top:12px;font-family:inherit}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d)}
.btn-amber{background:var(--amber);color:#fff;box-shadow:0 4px 0 #b45309}
.btn-soft{background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn-teal:active,.btn-amber:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.trio{display:flex;justify-content:center;gap:8px;margin-top:14px}
.trio .tcell{flex:1;border-radius:14px;padding:12px 6px;text-align:center;font-weight:900;font-size:19px}
.tcell small{display:block;font-size:10.5px;font-weight:700;color:#8a8496;margin-bottom:3px}
.t1{background:#e0f5f5;color:var(--teal-d)}
.t2{background:#fef3d9;color:#a86a00}
.t3{background:#fde8f3;color:#c2377f}
.tcell.reveal{outline:3px solid currentColor}
input.spellin{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:17px;font-weight:800;letter-spacing:2px;text-align:center;margin-top:8px;font-family:inherit;outline:none}
input.spellin:focus{border-color:var(--teal)}
input.spellin.ok{border-color:var(--teal);background:#e0f5f5}
input.spellin.no{border-color:var(--red);background:#fee2e2}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#fbbf24);border-radius:99px;transition:width .4s}
.steps{display:flex;gap:6px;margin-top:12px}
.step{flex:1;background:var(--soft);border-radius:10px;text-align:center;font-size:11px;font-weight:700;padding:8px 3px;color:#8a8496;line-height:1.5}
.step b{display:block;font-size:15px;color:var(--amber)}
.fb{border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.7;margin-top:12px;display:none}
.fb.ok{display:block;background:#e0f5f5;color:var(--teal-d)}
.fb.no{display:block;background:#fee2e2;color:#b91c1c}
.note{font-size:12px;color:#9a94b0;line-height:1.7;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.voice-note{background:#fdf0f8;border:1px solid #f5c6e0;color:#a3437c;font-size:12px;border-radius:12px;padding:9px 12px;line-height:1.6;margin-top:10px}
.recall-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.recall-card .q{font-size:16px;font-weight:800;line-height:1.6}
.recall-card .a{font-size:14.5px;line-height:1.8;color:var(--teal-d);margin-top:10px;display:none;background:#e0f5f5;border-radius:12px;padding:10px 12px}
.recall-card.open .a{display:block}
.recall-card .tap{font-size:12px;color:var(--pink);font-weight:700;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{background:var(--soft);border-radius:14px;padding:12px;text-align:center;font-weight:800;font-size:14px}
.mini small{display:block;font-weight:600;color:#8a8496;font-size:11.5px;margin-top:4px}
.hidden{display:none}
.taprow{display:flex;gap:8px;margin-top:12px}
.taprow .btn{margin-top:0}
.plan{display:flex;gap:10px;margin-top:12px}
.pcard{flex:1;border-radius:14px;padding:12px;line-height:1.7;font-size:12.5px;font-weight:700}
.pcard b{display:block;font-size:15px;margin-bottom:2px}
.pd1{background:#e0f5f5;color:var(--teal-d)}
.pd2{background:#fde8f3;color:#c2377f}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 15px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt .k{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;background:var(--soft);margin-right:8px;font-size:13px}
.hp{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;background:var(--line);color:#fff;font-size:12px;text-align:center;margin-left:3px}
.hp.on{background:var(--teal)}
</style>
</head>
<body>
<header>
  <div class="logo">🔥</div>
  <div class="brand">Kenton · 1—30 默写冲刺营</div>
  <div class="sp"></div>
  <button class="pill" id="soundToggle">声</button>
  <button class="pill" onclick="go('records')">学习档案</button>
</header>
<main id="app"></main>
<script>
(function(){
'use strict';
const APP_ID='kenton-verb-sprint-0130-20260803';
const VERSION='1.0.0';
const STORAGE_KEY='study:kenton:'+APP_ID+':v1';
const MATERIAL='老师136词表原表 1—30（最高优先级：1—30 仍未默出）· 原表逐行核对';
const AUDIO_DIR='audio/kenton_verb_sprint_0130_20260803/';
const VERBS=[
 {n:1,base:'be',past:'was/were',pp:'been',zh:'是',tip:'两副面孔：单数 was、复数和 you 用 were；分词 been',audio:'01-be.mp3'},
 {n:2,base:'bear',past:'bore',pp:'born',zh:'出生，忍受',tip:'bear—bore—born：o 变长，最后穿 n',audio:'02-bear.mp3'},
 {n:3,base:'beat',past:'beat',pp:'beaten',zh:'（心）跳动，打',tip:'过去式不变，分词加 -en：beaten',audio:'03-beat.mp3'},
 {n:4,base:'become',past:'became',pp:'become',zh:'变为',tip:'ABA 型：第三态回到原形',audio:'04-become.mp3'},
 {n:5,base:'begin',past:'began',pp:'begun',zh:'开始',tip:'i—a—u 三拍：begin—began—begun',audio:'05-begin.mp3'},
 {n:6,base:'bend',past:'bent',pp:'bent',zh:'弯曲',tip:'结尾 d 变 t，后两项相同',audio:'06-bend.mp3'},
 {n:7,base:'bite',past:'bit',pp:'bit',zh:'咬',tip:'按老师原表记：bite—bit—bit',audio:'07-bite.mp3'},
 {n:8,base:'bleed',past:'bled',pp:'bled',zh:'流血',tip:'长 ee 缩短：bleed—bled—bled',audio:'08-bleed.mp3'},
 {n:9,base:'blow',past:'blew',pp:'blown',zh:'吹，刮风',tip:'ow—ew—own 三兄弟：blow—blew—blown',audio:'09-blow.mp3'},
 {n:10,base:'break',past:'broke',pp:'broken',zh:'打破',tip:'ea 变 o，最后加 n：broken',audio:'10-break.mp3'},
 {n:11,base:'bring',past:'brought',pp:'brought',zh:'带来',tip:'-ought 家族：brought 后两项双胞胎',audio:'11-bring.mp3'},
 {n:12,base:'build',past:'built',pp:'built',zh:'建筑，建设',tip:'结尾 d 变 t：build—built—built',audio:'12-build.mp3'},
 {n:13,base:'burn',past:'burnt/burned',pp:'burnt/burned',zh:'燃烧',tip:'原表保留两种：主背 burnt，也认得 burned',audio:'13-burn.mp3'},
 {n:14,base:'burst',past:'burst',pp:'burst',zh:'爆发',tip:'三态原地不动：burst—burst—burst',audio:'14-burst.mp3'},
 {n:15,base:'buy',past:'bought',pp:'bought',zh:'买',tip:'-ought 家族，和 bring 一起记',audio:'15-buy.mp3'},
 {n:16,base:'can',past:'could',pp:'/',zh:'能',tip:'情态搭档 can—could；原表过去分词为 /，只默两态',audio:'16-can.mp3'},
 {n:17,base:'cast',past:'cast',pp:'cast',zh:'投，抛',tip:'三态不变：cast—cast—cast',audio:'17-cast.mp3'},
 {n:18,base:'catch',past:'caught',pp:'caught',zh:'捉，抓',tip:'-aught 家族：caught 后两项双胞胎',audio:'18-catch.mp3'},
 {n:19,base:'choose',past:'chose',pp:'chosen',zh:'选择',tip:'choose—chose—chosen：最后加 n',audio:'19-choose.mp3'},
 {n:20,base:'come',past:'came',pp:'come',zh:'来',tip:'ABA 型：第三态回到原形',audio:'20-come.mp3'},
 {n:21,base:'cost',past:'cost',pp:'cost',zh:'价值，花费',tip:'三态不变：cost—cost—cost',audio:'21-cost.mp3'},
 {n:22,base:'cut',past:'cut',pp:'cut',zh:'割，切',tip:'三态不变；现在分词才双写 t（cutting）',audio:'22-cut.mp3'},
 {n:23,base:'deal',past:'dealt',pp:'dealt',zh:'对付，对待',tip:'deal—dealt—dealt，后两项双胞胎',audio:'23-deal.mp3'},
 {n:24,base:'dig',past:'dug',pp:'dug',zh:'挖，掘',tip:'i 变 u：dig—dug—dug',audio:'24-dig.mp3'},
 {n:25,base:'do',past:'did',pp:'done',zh:'做',tip:'三项各不相同：do—did—done',audio:'25-do.mp3'},
 {n:26,base:'draw',past:'drew',pp:'drawn',zh:'画画，拉',tip:'aw—ew—awn：draw—drew—drawn',audio:'26-draw.mp3'},
 {n:27,base:'dream',past:'dreamed/dreamt',pp:'dreamed/dreamt',zh:'做梦',tip:'原表保留两种：主背 dreamed，也认得 dreamt',audio:'27-dream.mp3'},
 {n:28,base:'drink',past:'drank',pp:'drunk',zh:'喝',tip:'i—a—u 三拍：drink—drank—drunk',audio:'28-drink.mp3'},
 {n:29,base:'drive',past:'drove',pp:'driven',zh:'驾驶，驱赶',tip:'drive—drove—driven：最后穿 -en',audio:'29-drive.mp3'},
 {n:30,base:'eat',past:'ate',pp:'eaten',zh:'吃',tip:'eat—ate—eaten：最后穿 -en',audio:'30-eat.mp3'}
];
const GROUPS=[[1,5],[6,10],[11,15],[16,20],[21,25],[26,30]];
const RECALL=[
 {q:'三态全一样的（AAA型）有哪些？',a:'burst-burst-burst、cast-cast-cast、cost-cost-cost、cut-cut-cut。四个最省心。'},
 {q:'ABA 型（第三态回原形）？',a:'become-became-become、come-came-come。就这两个，一起记。'},
 {q:'i—a—u 三拍的是哪两个？',a:'begin-began-begun、drink-drank-drunk。念出来就有节奏。'},
 {q:'-ought / -aught 家族怎么记？',a:'bring-brought、buy-bought 是 -ought；catch-caught 是 -aught。后两项双胞胎，别写成 brang/buyed。'},
 {q:'最特殊的三个词？',a:'be→was/were→been（两副面孔）；do→did→done（三项全不同）；can→could（情态词，原表过去分词是 /，只默两态）。'},
 {q:'原表保留两种写法的词？',a:'burn→burnt/burned；dream→dreamed/dreamt。默写主背前一个（burnt、dreamed），认出后一个也算对。'}
];
/* ============ 基础 ============ */
const app=document.getElementById('app');
let soundOn=localStorage.getItem('study:kenton:ui-sound')!=='0';
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s&&s.v===VERSION)return s}catch(e){}
 return {v:VERSION,done:{},attempts:[],wrong:{},streak:{},groupsDone:{},created:Date.now()};}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(S));}
function recordAttempt(kind,key,ok){
 S.attempts.push({t:Date.now(),kind,key,ok});
 if(kind==='spell'){const w=key;
  if(ok){S.streak[w]=(S.streak[w]||0)+1;if(S.streak[w]>=2&&S.wrong[w])delete S.wrong[w];}
  else{S.wrong[w]=1;S.streak[w]=0;}}
 save();}
function el(html){app.innerHTML=html;window.scrollTo(0,0);}
function tone(k){if(!soundOn)return;try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=k==='ok'?660:220;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();c.close()},k==='ok'?120:220)}catch(e){}}
function playFile(fn,rate){const a=new Audio(AUDIO_DIR+fn);a.playbackRate=rate||1;const p=a.play();if(p&&p.catch)p.catch(()=>{});}
function norm(x){return (x||'').trim().toLowerCase().replace(/\s+/g,'');}
function okField(input,expected){
 const n=norm(input);if(!n)return false;
 if(n===norm(expected))return true;
 const parts=expected.split('/').map(function(s){return s.trim()});
 if(parts.indexOf(n)>-1)return true;
 if(n===norm(parts.slice().reverse().join('/')))return true;
 return false;
}
function shuffled(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function inGroup(v,g){return v.n>=GROUPS[g][0]&&v.n<=GROUPS[g][1];}
/* ============ 页面 ============ */
function go(m){({home,listen,drill,camp,exam,recall,records}[m]||home)();}
function head(tag,title,sub,back){
 return (back?'<button class="pill" onclick="go(\'home\')" style="margin-bottom:10px">←</button>':'')
 +'<div class="card"><span class="tag">'+tag+'</span><h2>'+title+'</h2>'
 +(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
}
function home(){
 const wrongN=Object.keys(S.wrong).length;
 const mastered=VERBS.filter(function(v){return (S.streak[v.base]||0)>=2}).length;
 el('<div class="card"><span class="tag">最高优先级 · 1—30 仍未默出，先攻这一批</span>'
 +'<h1>🔥 动词三态默写冲刺营</h1>'
 +'<div class="sub">be 到 eat 共 <b>30 个</b>，按老师 136 词表原表逐行核对。不硬背——先听熟，再分组过关，错词进集中营反复打，最后模拟默写验收。</div>'
 +'<div class="plan">'
 +'<div class="pcard pd1"><b>📅 今天 Day 1</b>① 磨耳朵全听一遍<br>② 分组闯关 1—3 组（1—15）<br>③ 睡前听一遍错词</div>'
 +'<div class="pcard pd2"><b>📅 明天 Day 2</b>① 闯关 4—6 组（16—30）<br>② 错词集中营清零<br>③ 模拟默写 ≥90 分</div>'
 +'</div>'
 +'<button class="btn btn-amber" onclick="go(\'listen\')">🎧 开始冲刺：先磨耳朵 →</button>'
 +'<div class="steps"><div class="step"><b>1</b>磨耳朵</div><div class="step"><b>2</b>分组闯关</div><div class="step"><b>3</b>错词营</div><div class="step"><b>4</b>模拟默写</div></div>'
 +'<div class="grid2" style="margin-top:12px">'
 +'<div class="mini">⭐ 已连对出营<small>'+mastered+' / 30 词（连对2次算出营）</small></div>'
 +'<div class="mini">🏥 错词营<small>'+wrongN+' 个词在营中治疗</small></div>'
 +'</div>'
 +'<div class="voice-note">🔊 音频待验收（手机）：三态读音为统一预录音，首次播放前请先点任意按钮解锁声音。</div>'
 +'</div>'
 +'<div class="card"><div class="grid2">'
 +'<div class="mini">📚 材料<small>'+MATERIAL+'</small></div>'
 +'<div class="mini">🎯 目标<small>30 词三态默写全对</small></div>'
 +'</div></div>');
}
let lIdx=0;
function listen(){lIdx=0;listenCard();}
function listenCard(){
 const v=VERBS[lIdx];
 const g=GROUPS.findIndex(function(gr){return v.n>=gr[0]&&v.n<=gr[1]});
 el(head('第 1 站 · 磨耳朵','第 '+(lIdx+1)+' / 30 个 · 第 '+(g+1)+' 组 · 听三遍，跟着念',null,1)
 +'<div class="card">'
 +'<div class="tag">No.'+v.n+' · '+v.zh+'</div>'
 +'<div class="trio">'
 +'<div class="tcell t1"><small>原形</small>'+v.base+'</div>'
 +'<div class="tcell t2"><small>过去式</small>'+v.past+'</div>'
 +'<div class="tcell t3"><small>过去分词</small>'+v.pp+'</div>'
 +'</div>'
 +'<div class="sub" style="text-align:center;margin-top:8px">💡 '+v.tip+'</div>'
 +'<div class="taprow">'
 +'<button class="btn btn-soft" onclick="playFile(\''+v.audio+'\')">🔊 听三态</button>'
 +'<button class="btn btn-soft" onclick="playFile(\''+v.audio+'\',0.75)">🐢 慢速</button>'
 +'</div>'
 +'<button class="btn btn-amber" onclick="listenNext()">'+(lIdx<VERBS.length-1?'下一个 →':'听完啦，去闯关 →')+'</button>'
 +'</div>'
 +'<div class="progress"><i style="width:'+((lIdx+1)/30*100)+'%"></i></div>');
}
window.listenNext=function(){if(lIdx<VERBS.length-1){lIdx++;listenCard();}else{finishStage('listen');go('drill');}};
/* 分组闯关：看原形+中文，输入 past 和 pp */
let dGroup=0,dQueue=[];
function drill(){
 const ghtml=GROUPS.map(function(gr,gi){
  const done=S.groupsDone['g'+gi];
  return '<button class="opt" onclick="drillGroup('+gi+')"><span class="k">'+(done?'✅':(gi+1))+'</span>第 '+(gi+1)+' 组 · No.'+gr[0]+'—'+gr[1]+(done?'（已过）':'')+'</button>';}).join('');
 el(head('第 2 站 · 分组闯关','看原形和中文，默写过去式 + 过去分词；错词自动进集中营',null,1)
 +'<div class="card">'+ghtml
 +'<div class="note">今天目标：第 1—3 组（1—15）；明天：第 4—6 组（16—30）。全部过完去"错词集中营"清零。</div></div>');
}
window.drillGroup=function(gi){dGroup=gi;dQueue=VERBS.filter(function(v){return inGroup(v,gi)});drillCard();};
function drillCard(){
 if(dQueue.length===0){
  S.groupsDone['g'+dGroup]=true;save();
  el(head('第 2 站 · 分组闯关',null,null,1)
  +'<div class="card" style="text-align:center"><div class="big">🎉</div>'
  +'<div class="big" style="font-size:23px;margin-top:8px">第 '+(dGroup+1)+' 组过关！</div>'
  +'<div class="sub" style="margin-top:8px">错词已进集中营，记得去清零（连对 2 次出营）。</div>'
  +'<div class="taprow"><button class="btn btn-soft" onclick="go(\'drill\')">选下一组</button>'
  +'<button class="btn btn-amber" onclick="go(\'camp\')">去错词营 →</button></div></div>');
  return;
 }
 const v=dQueue[0];
 el(head('第 2 站 · 分组闯关','第 '+(dGroup+1)+' 组 · 还剩 '+dQueue.length+' 个',null,1)
 +'<div class="card">'
 +'<div class="tag">No.'+v.n+' · '+v.zh+'</div>'
 +'<div class="big">'+v.base+'</div>'
 +'<div class="zh">'+v.zh+'</div>'
 +'<input class="spellin" id="inPast" placeholder="'+(v.past.indexOf('/')>-1?'过去式（两种写法都算对）':'过去式（如 began）')+'" autocomplete="off" autocapitalize="off">'
 +(v.pp==='/'?'<div class="sub" style="text-align:center;margin-top:8px">ℹ️ can 是情态词，原表过去分词为 /，只默两态</div>'
  :'<input class="spellin" id="inPp" placeholder="过去分词（如 begun）" autocomplete="off" autocapitalize="off">')
 +'<div class="fb" id="dfb"></div>'
 +'<div class="taprow">'
 +'<button class="btn btn-soft" onclick="playFile(\''+v.audio+'\')">🔊 偷偷听</button>'
 +'<button class="btn btn-amber" onclick="drillCheck()">默写好了 →</button>'
 +'</div></div>');
 setTimeout(function(){const i=document.getElementById('inPast');if(i)i.focus()},300);
}
window.drillCheck=function(){
 const v=dQueue[0];
 const p=(document.getElementById('inPast').value||'').trim().toLowerCase();
 const q=v.pp==='/'?'':(document.getElementById('inPp').value||'').trim().toLowerCase();
 const okP=okField(p,v.past),okQ=v.pp==='/'?true:okField(q,v.pp);
 const fb=document.getElementById('dfb');
 document.getElementById('inPast').classList.add(okP?'ok':'no');
 if(v.pp!=='/')document.getElementById('inPp').classList.add(okQ?'ok':'no');
 if(okP&&okQ){
  tone('ok');fb.className='fb ok';fb.textContent='✅ 全对！'+v.base+' — '+v.past+' — '+v.pp;
  recordAttempt('spell',v.base,true);
  dQueue.shift();setTimeout(drillCard,900);
 }else{
  tone('no');recordAttempt('spell',v.base,false);
  fb.className='fb no';
  fb.innerHTML='💡 正确答案：<b>'+v.base+' — '+v.past+' — '+v.pp+'</b><br>'+(okP?'':'过去式是 '+v.past+'；')+(okQ?'':'过去分词是 '+v.pp+'；')+'这个词进集中营了，点"再来一次"重写。';
  const btn=document.querySelector('.btn-amber');btn.textContent='再来一次 →';
  btn.onclick=function(){drillCard();};
 }
};
/* 错词集中营 */
let cQueue=[];
function camp(){
 const wrongs=VERBS.filter(function(v){return S.wrong[v.base]});
 if(wrongs.length===0){
  el(head('第 3 站 · 错词集中营','营地空空如也',null,1)
  +'<div class="card" style="text-align:center"><div class="big">🏕️</div>'
  +'<div class="big" style="font-size:23px;margin-top:8px">集中营是空的，太棒了！</div>'
  +'<div class="sub" style="margin-top:8px">分组闯关里写错的词才会进来；每个词连对 2 次就能出营。</div>'
  +'<button class="btn btn-amber" onclick="go(\'exam\')">去模拟默写 →</button></div>');
  return;
 }
 el(head('第 3 站 · 错词集中营','每个词连对 2 次才能出营（两颗心点亮）',null,1)
 +'<div class="card">'
 +wrongs.map(function(v){
  const st=S.streak[v.base]||0;
  return '<button class="opt" onclick="campStart(\''+v.base+'\')"><span class="k">🏥</span>'+v.base+' <span style="color:#8a8496">'+v.zh+'</span>'
  +'<span style="float:right"><span class="hp'+(st>=1?' on':'')+'">❤</span><span class="hp'+(st>=2?' on':'')+'">❤</span></span></button>';}).join('')
 +'<div class="note">全部出营后，去"模拟默写"验收。</div></div>');
}
let campV=null;
window.campStart=function(base){campV=VERBS.filter(function(v){return v.base===base})[0];campCard();};
function campCard(){
 const v=campV;const st=S.streak[v.base]||0;
 el(head('第 3 站 · 错词集中营','No.'+v.n+' · 连对 '+(2-st)+' 次出营',null,1)
 +'<div class="card">'
 +'<div class="tag">'+v.zh+' · 💡 '+v.tip+'</div>'
 +'<div class="big">'+v.base+'</div>'
 +'<input class="spellin" id="inPast" placeholder="过去式" autocomplete="off" autocapitalize="off">'
 +(v.pp==='/'?'<div class="sub" style="text-align:center;margin-top:8px">ℹ️ 只默两态（原表分词为 /）</div>'
  :'<input class="spellin" id="inPp" placeholder="过去分词" autocomplete="off" autocapitalize="off">')
 +'<div class="fb" id="cfb"></div>'
 +'<div class="taprow">'
 +'<button class="btn btn-soft" onclick="playFile(\''+v.audio+'\')">🔊 听</button>'
 +'<button class="btn btn-amber" onclick="campCheck()">默写好了 →</button>'
 +'</div>'
 +'<button class="btn btn-soft" onclick="go(\'camp\')">← 回营地列表</button>'
 +'</div>');
 setTimeout(function(){const i=document.getElementById('inPast');if(i)i.focus()},300);
}
window.campCheck=function(){
 const v=campV;
 const p=(document.getElementById('inPast').value||'').trim().toLowerCase();
 const q=v.pp==='/'?'':(document.getElementById('inPp').value||'').trim().toLowerCase();
 const ok=okField(p,v.past)&&(v.pp==='/'||okField(q,v.pp));
 const fb=document.getElementById('cfb');
 recordAttempt('spell',v.base,ok);
 if(ok){tone('ok');const st=S.streak[v.base]||0;
  fb.className='fb ok';fb.textContent=st>=2?'🎉 出营成功！'+v.base+' 已经拿下！':'✅ 连对 '+st+'/2，再来一次就出营！';
  setTimeout(function(){if(S.wrong[v.base]){campCard();}else{go('camp');}},900);
 }else{tone('no');fb.className='fb no';fb.innerHTML='💡 是 <b>'+v.past+' — '+v.pp+'</b>。'+v.tip+'；重新默写。';
  setTimeout(campCard,1400);}
};
/* 模拟默写 */
let eQueue=[],eIdx=0,eScore=0;
function exam(){eQueue=shuffled(VERBS).slice(0,10);eIdx=0;eScore=0;examCard();}
function examCard(){
 if(eIdx>=eQueue.length){
  finishStage('exam');
  const pct=eScore*10;
  el(head('终点站 · 模拟默写',null,null,1)
  +'<div class="card" style="text-align:center">'
 +'<div class="big">'+(pct>=90?'🏆':pct>=70?'💪':'📖')+'</div>'
 +'<div class="big" style="font-size:26px;margin-top:8px">'+pct+' 分（'+eScore+'/10 词）</div>'
 +'<div class="sub" style="margin-top:8px">'+(pct>=90?'90 分过关！明天老师再默写也不怕。睡前把错词营再扫一眼，明早听一遍磨耳朵。':'还没到 90 分——错词已进集中营，清零后再来考一次！')+'</div>'
 +'<div class="taprow"><button class="btn btn-soft" onclick="go(\'camp\')">去错词营</button>'
 +'<button class="btn btn-amber" onclick="go(\'exam\')">再考一次</button></div>'
 +'</div>');
  return;
 }
 const v=eQueue[eIdx];
 el(head('终点站 · 模拟默写','第 '+(eIdx+1)+' / 10 词 · 假装老师正在念',null,1)
 +'<div class="card">'
 +'<div class="sub" style="text-align:center">老师念：</div>'
 +'<button class="btn btn-soft" onclick="playFile(\''+v.audio+'\')">🔊 播放考题（可听2遍）</button>'
 +'<div class="zh" style="margin-top:6px">提示：'+v.zh+' · No.'+v.n+'</div>'
 +'<input class="spellin" id="inBase" placeholder="原形" autocomplete="off" autocapitalize="off">'
 +'<input class="spellin" id="inPast" placeholder="过去式" autocomplete="off" autocapitalize="off">'
 +(v.pp==='/'?'<div class="sub" style="text-align:center;margin-top:8px">ℹ️ 本题只默两态（原表分词为 /）</div>'
  :'<input class="spellin" id="inPp" placeholder="过去分词" autocomplete="off" autocapitalize="off">')
 +'<div class="fb" id="efb"></div>'
 +'<button class="btn btn-amber" onclick="examCheck()">交卷 →</button>'
 +'</div>');
}
window.examCheck=function(){
 const v=eQueue[eIdx];
 const b=(document.getElementById('inBase').value||'').trim().toLowerCase();
 const p=(document.getElementById('inPast').value||'').trim().toLowerCase();
 const q=v.pp==='/'?'':(document.getElementById('inPp').value||'').trim().toLowerCase();
 const ok=okField(b,v.base)&&okField(p,v.past)&&(v.pp==='/'||okField(q,v.pp));
 const fb=document.getElementById('efb');
 recordAttempt('exam',v.base,ok);
 if(!ok){S.wrong[v.base]=1;S.streak[v.base]=0;save();}
 if(ok){eScore++;tone('ok');}
 else{tone('no');}
 fb.className='fb '+(ok?'ok':'no');
 fb.innerHTML=(ok?'✅ ':'💡 ')+v.base+' — '+v.past+' — '+v.pp+(ok?'':'（已送进集中营）');
 const btn=document.querySelector('.btn-amber');btn.textContent='下一题 →';
 btn.onclick=function(){eIdx++;examCard();};
};
function recall(){
 el(head('口诀屋 · 分组规律','先自己说，再点开核对',null,1)
 +'<div class="card">'+RECALL.map(function(c,i){
  return '<div class="recall-card" id="rc'+i+'"><div class="q">'+(i+1)+'. '+c.q+'</div>'
  +'<div class="tap" onclick="document.getElementById(\'rc'+i+'\').classList.toggle(\'open\')">先自己说，再点开 👆</div>'
  +'<div class="a">'+c.a+'</div></div>';}).join('')
 +'<button class="btn btn-amber" onclick="finishStage(\'recall\');go(\'exam\')">背熟了，去模拟默写 →</button></div>');
}
function finishStage(k){S.done[k]=true;save();}
window.finishStage=finishStage;
function records(){
 const okN=S.attempts.filter(function(a){return a.ok}).length;
 const wrongs=VERBS.filter(function(v){return S.wrong[v.base]}).map(function(v){return v.base}).join('、');
 const rows=S.attempts.slice(-30).reverse().map(function(a){
  return '<div style="font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)">'+(a.ok?'✅':'❌')+' ['+a.kind+'] '+a.key+'<span style="color:#9a94b0"> · '+new Date(a.t).toLocaleString('zh-CN',{hour12:false})+'</span></div>';}).join('');
 el(head('学习档案','本次冲刺记录','',1)
 +'<div class="card">'
 +'<div class="sub">错词营在营：'+(wrongs||'（空）')+'</div>'
 +'<div class="sub" style="margin-top:6px">总作答：'+S.attempts.length+' 次 · 正确 '+okN+' 次</div>'
 +'<div style="margin-top:10px">'+(rows||'<div class="sub">还没有作答记录。</div>')+'</div>'
 +'<div class="taprow"><button class="btn btn-soft" onclick="dlJson()">导出 JSON</button>'
 +'<button class="btn btn-soft" onclick="dlMd()">导出 Markdown</button></div>'
 +'</div>');
}
function dl(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
window.dlJson=function(){dl('kenton-verb-sprint-0130-record.json',JSON.stringify({app:APP_ID,material:MATERIAL,exported:new Date().toISOString(),state:S},null,1),'application/json');};
window.dlMd=function(){
 let md='# Kenton 1—30 默写冲刺记录\n\n- 材料：'+MATERIAL+'\n- 作答：'+S.attempts.length+' 次，正确 '+S.attempts.filter(function(a){return a.ok}).length+' 次\n\n| 时间 | 环节 | 内容 | 结果 |\n|---|---|---|---|\n';
 S.attempts.forEach(function(a){md+='| '+new Date(a.t).toLocaleString('zh-CN',{hour12:false})+' | '+a.kind+' | '+a.key+' | '+(a.ok?'对':'错')+' |\n';});
 dl('kenton-verb-sprint-0130-report.md',md,'text/markdown');
};
document.getElementById('soundToggle').addEventListener('click',function(){soundOn=!soundOn;localStorage.setItem('study:kenton:ui-sound',soundOn?'1':'0');this.textContent=soundOn?'声':'静';if(soundOn)tone('ok');});
document.getElementById('soundToggle').textContent=soundOn?'声':'静';
Object.assign(window,{go,playFile});
home();
})();
</script>
