function parent(which='records'){cancel();pause();const b=bundle();$('#modalBody').innerHTML=which==='tasks'?`<p class="hint">做完书本任务后，在这里记下。打开网页不等于做完。</p><div id="taskList"></div>`:`<p>每段单独记录；“练完”和“独立会”分开。语音转写、提示后改对与自己写对分别保存。</p><p>音频仍是固定候选声线，逐条听感和手机实播待验收。表达按意思接住，拿不准时保留原话，不以关键词判掌握。</p><div class="actions"><button id="exportJson">完整备份 JSON</button><button id="exportMd">可读记录</button></div><label class="field"><span>导入本孩子、本模式的新节点备份</span><input id="import" type="file" accept=".json,application/json"></label><p id="importStatus" role="status"></p>${node&&node.questions.some(q=>state.progress[q.id]?.review)?'<button id="reviewOnly">只练本段待复习项</button>':''}<details><summary>各段结果和接续点</summary>${CONTENT.nodes.map(n=>{const s=b.nodes[n.id];return `<div class="record-row"><strong>${esc(n.title)}</strong> · ${s?.run?.complete?'这一段练过':s?.run?'暂停在第 '+(s.run.index+1)+' 项':'未有练习记录'}${s?.history?.length?`<details><summary>原始作答 ${s.history.length} 条</summary>${s.history.slice(-40).map(h=>`<p>${esc(h.answers.join(' | '))} · ${esc(h.result)}</p>`).join('')}</details>`:''}</div>`}).join('')}</details><details data-parent-analysis><summary>材料与旧记录</summary><p>${esc(CONTENT.source)}</p><p>${child==='kenton'?'保留原词形15组、动物词表11词，以及本周课堂补充。':'保留 Word Bank 共36词，以及校内补充。'}书面和视频任务由本人报告，不自动完成。</p><a class="button" href="${CONTENT.legacy}${test?'?test=1':''}">打开旧版及原记录</a></details><button id="newRound" class="quiet">家长：另开一轮 30 分钟</button>`;
 $('#modal').showModal();if(which==='tasks'){taskUI();return}
 $('#exportJson').onclick=()=>exportData('json');$('#exportMd').onclick=()=>exportData('md');$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>4000000)throw Error();const x=JSON.parse(await f.text());if(!validBundle(x))throw Error();const before=bundle();if(!write(H.key(child,'import-backup-'+Date.now(),mode),before))throw Error();const originals={};for(const id of Object.keys(x.nodes))originals[id]=read(H.key(child,id,mode));try{for(const [id,s]of Object.entries(x.nodes)){if(s.run)s.run.active=false;if(!write(H.key(child,id,mode),s))throw Error()}if(x.homework&&!write(H.key(child,'homework',mode),x.homework))throw Error()}catch(error){for(const [id,s]of Object.entries(originals))write(H.key(child,id,mode),s);if(before.homework)write(H.key(child,'homework',mode),before.homework);throw error}if(node)state=read(key)||H.empty(child,node.id,mode);$('#importStatus').textContent='导入成功；导入前的记录已保留备份。'}catch{$('#importStatus').textContent='这不是本孩子、本模式的有效备份。原记录没变。'}};if($('#reviewOnly'))$('#reviewOnly').onclick=()=>{$('#modal').close();start(true,true)};$('#newRound').onclick=()=>{const r={id:H.uid(),day:today,usedMs:0,activeKey:'',leaseAt:0};write(sessionKey,r);$('#newRound').textContent='新一轮已准备；孩子可自行选一段。'};
}
function taskUI(){const tk=H.key(child,'homework',mode),oldKey=`study:${child}:${child}-english-week-20260913:v1:${mode}`,legacy=read(oldKey)||{},tasks=read(tk)||{homework:{...legacy.homework},computer:legacy.computer||[false,false,false]};$('#taskList').innerHTML=CONTENT.homework.map(([id,t,tip])=>`<label class="assisted"><input type="checkbox" data-task="${id}" ${tasks.homework[id]?'checked':''}><span>${esc(t)}<small class="hint"> · ${esc(tip)}</small></span></label>`).join('')+(CONTENT.computer?'<h3>老师指定平台上机</h3>'+tasks.computer.map((v,i)=>`<label class="assisted"><input type="checkbox" data-computer="${i}" ${v?'checked':''}>第 ${i+1} 次已实际完成</label>`).join(''):'');document.querySelectorAll('[data-task]').forEach(e=>e.onchange=()=>{tasks.homework[e.dataset.task]=e.checked;write(tk,tasks)});document.querySelectorAll('[data-computer]').forEach(e=>e.onchange=()=>{tasks.computer[+e.dataset.computer]=e.checked;write(tk,tasks)})}
function exportData(kind){const b=bundle();const content=kind==='json'?JSON.stringify(b,null,2):'# '+CONTENT.title+'\n\n'+Object.entries(b.nodes).map(([id,s])=>'## '+CONTENT.nodes.find(n=>n.id===id).title+'\n\n'+s.history.map(h=>'- '+h.at+' | '+h.answers.join(' | ')+' | '+h.result).join('\n')).join('\n\n');const url=URL.createObjectURL(new Blob([content],{type:kind==='json'?'application/json':'text/markdown;charset=utf-8'}));$('#modalBody').innerHTML=`<label class="field"><span>可复制或下载</span><textarea id="exportText" readonly></textarea></label><a class="button primary" href="${url}" download="${child}-english-nodes-${today}.${kind}">下载记录</a>`;$('#exportText').value=content;}
const DAILY_SURPRISES=['先抓一个变化，再自己试。','说法可以不同，意思要说清。','这一段做好了，就可以休息。'];const dailySurpriseKey=child+'-english-nodes-20260913|'+today;$('#dailyTip').textContent=DAILY_SURPRISES[[...dailySurpriseKey].reduce((s,c)=>s+c.charCodeAt(0),0)%DAILY_SURPRISES.length];
$('#parent').onclick=()=>parent();$('#closeModal').onclick=()=>{$('#modal').close();node?renderStart():renderHub()};$('#modal').addEventListener('cancel',e=>{e.preventDefault();$('#closeModal').click()});$('#stop').onclick=()=>settle('pause');
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();if(node)renderStart()}});window.addEventListener('pagehide',()=>pause());window.addEventListener('storage',e=>{if(e.key===sessionKey&&active){const r=session();if(r.activeKey!==key){pause();renderStart()}}});
if(PAGE_KIND==='hub')renderHub();else if(node)renderStart();else{base('找不到这一小段','从英语入口重新选一段。');$('#stage').innerHTML=`<a class="button primary" href="${home}">回英语入口</a>`}
if(test)$('#modeNotice').textContent='家长测试 · 记录与孩子分开';
})();
</script></body></html>
