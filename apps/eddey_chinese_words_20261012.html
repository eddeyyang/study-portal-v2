    if(action==='exportRaw') return download(COURSE.child+'-chinese-original.json',localStorage.getItem(KEY)||'');
    if(action==='report') {
      const lines=['# '+(COURSE.child==='eddey'?'弟弟':'哥哥')+'按课背默','模式：'+MODE,'日期：'+day(),''];
      for(const l of COURSE.lessons) { lines.push('## '+(l.number?'第'+l.number+'课 · ':'')+l.title); for(const key of ['words','characters','extra']) if(l[key].length) lines.push(label(key)+'：'+l[key].map(w=>w.text+'（'+w.pinyin+'）'+(pending(w.id)?'〔待复习〕':'')).join('；')); if(l.characterList) lines.push('课本会写字：'+l.characterList); if(l.recitation) lines.push('背诵范围：'+l.recitation); lines.push(''); }
      return download(COURSE.child+'-lesson-words.md',lines.join('\n'),'text/markdown;charset=utf-8');
    }
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='answer' && active()) { active().draft=event.target.value.slice(0,80); active().updatedAt=new Date().toISOString(); save(); }
    if(event.target.id==='sentence' && active()) { active().sentence=event.target.value.slice(0,240); active().updatedAt=new Date().toISOString(); save(); }
  });
  document.addEventListener('keydown',event=>{if(event.target.id==='answer' && event.key==='Enter'&&!event.isComposing){event.preventDefault(); $('[data-action="check"]')?.click();}});
  document.addEventListener('change',event=>{if(event.target.id==='importFile') importFile(event.target.files[0]);});
  $('#parentButton').addEventListener('click',parent);
  $('#closeDialog').addEventListener('click',()=>{$('#dialog').close();lastTick=Date.now();});
  $('#dialog').addEventListener('close',()=>{lastTick=Date.now();});
  document.addEventListener('visibilitychange',()=>{lastTick=Date.now();save();});
  window.addEventListener('pagehide',save);
  setInterval(()=>{
    const now=Date.now(),elapsed=Math.max(0,Math.min((now-lastTick)/1000,2)); lastTick=now;
    if(document.hidden || $('#dialog').open || route.name!=='practice' || active()?.phase==='finish') return;
    const b=budget(); b.seconds=Math.min(900,b.seconds+elapsed); save();
    const display=$('[data-time]'); if(display) display.textContent=Math.floor(b.seconds/60)+' 分 '+Math.floor(b.seconds%60)+' 秒';
    if(b.seconds>=900) go('limit',{sessionId:active()?.id});
  },1000);
  const DAILY_SURPRISES=['试试只遮住最容易写错的那个字。','写完先查一个字，再查整个词。','今天看过的词，隔天再写一次。','挑一个词，说说生活里什么时候会用到。','先在脑海里看见这个词，再下笔。'];
  const dailySurpriseKey=COURSE.appId+':'+COURSE.child+':'+day();
  $('#daily').textContent=DAILY_SURPRISES[[...dailySurpriseKey].reduce((sum,c)=>sum+c.charCodeAt(0),0)%DAILY_SURPRISES.length];
  $('#daily').className='daily';
  render();
})();
</script></body></html>
