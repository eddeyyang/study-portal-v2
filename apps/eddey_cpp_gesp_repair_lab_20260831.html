.headcopy{text-align:center;min-width:0}
h1{

.headcopy p{

.progress-wrap{padding:10px 16px 0}
.progress-meta{

.progress{height:9px;background:#eadfd5;border-radius:999px;overflow:hidden}
.progress>i{

.phase-strip{display:flex;gap:6px;overflow:auto;padding:10px 16px 4px;scrollbar-width:none}
.phase-strip::-webkit-scrollbar{display:none}
.phase{

  border-radius:999px;background:#efe8e1;color:#7b7068;font-size:12px;font-weight:800
}
.phase b{
  display:grid;place-items:center;width:19px;height:19px;border-radius:50%;
  background:white;font-size:11px
}
.phase.active{background:var(--coral);color:white}
.phase.done{background:var(--green-soft);color:var(--green)}
main{padding:14px 16px 112px}
.screen{animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{
  margin:0 0 6px;color:var(--coral-dark);font-size:13px;font-weight:800;letter-spacing:.08em
}
h2{font-size:clamp(23px,6vw,32px);line-height:1.22;margin:0 0 9px;font-weight:800}
h3{font-size:19px;line-height:1.3;margin:0 0 8px;font-weight:800}
p{margin:7px 0}
.lead{font-size:17px;color:#435860}
.root{

.root strong{color:var(--red)}
.card{

  box-shadow:0 8px 24px rgba(55,38,25,.07)
}
.card+.card{margin-top:12px}
.color-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}
.gate{
  min-height:64px;padding:8px 5px;border:2px solid transparent;border-radius:16px;
  background:#f3eee8;text-align:center;color:#6b625d;font-size:12px;font-weight:800;
  transition:.25s ease
}
.gate span{display:block;font-size:19px;line-height:1.2;margin-bottom:3px}
.gate.active{
  transform:translateY(-3px);border-color:var(--coral);background:var(--coral-soft);
  color:var(--coral-dark);box-shadow:0 8px 16px rgba(238,112,79,.16)
}
.gate.pass{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.gate.stop{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.code{
  margin:10px 0;padding:13px 14px;border-radius:16px;background:#172b34;color:#f8f2e7;
  font:600 15px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;
  overflow:auto;white-space:pre-wrap
}
.code .hot{color:#ffd36b}
.scene-note{
  min-height:52px;padding:11px 13px;border-radius:14px;background:var(--blue-soft);
  color:#1d607e;font-weight:700
}
.question{margin-top:10px}
.question-title{font-size:18px;font-weight:800;margin:0 0 10px}
.options{display:grid;gap:9px}
.option{
  position:relative;width:100%;min-height:var(--tap);padding:12px 14px 12px 52px;
  border:2px solid var(--line);border-radius:16px;background:white;color:var(--ink);
  text-align:left;cursor:pointer;font-weight:700;transition:.18s ease
}
.option:hover{border-color:#d7a28f;background:#fffaf7}
.option .letter{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);display:grid;
  place-items:center;width:28px;height:28px;border-radius:10px;background:#f0e8e1;
  color:#6f625b;font-weight:800
}
.option.correct{border-color:var(--green);background:var(--green-soft)}
.option.wrong{border-color:var(--red);background:var(--red-soft)}
.option[disabled]{cursor:default}
.feedback{display:none;margin-top:12px;padding:12px 14px;border-radius:16px;font-weight:700}
.feedback.show{display:block}
.feedback.ok{background:var(--green-soft);color:#17664d}
.feedback.no{background:var(--red-soft);color:#8f3030}
.why{
  margin-top:10px;padding:11px 13px;border-radius:14px;background:var(--amber-soft);
  color:#74500e;font-size:14px
}
.why strong{color:#7e4800}
.actions{
  display:flex;gap:9px;align-items:center;justify-content:flex-end;

.next-btn,.tiny-btn{

  border:0;border-radius:16px;padding:11px 17px;background:var(--coral);
  color:white;font-weight:800;cursor:pointer
}
.next-btn.secondary,.tiny-btn.secondary{background:white;color:var(--ink);border:2px solid var(--line)}
.tiny-btn{padding:8px 12px;font-size:14px}
.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}
.rule{padding:12px;border-radius:16px;font-weight:800}
.rule.blue{background:var(--blue-soft);color:#1c6685}
.rule.green{background:var(--green-soft);color:#1c6a51}
.rule.amber{background:var(--amber-soft);color:#76500b}
.rule.violet{background:var(--violet-soft);color:#60428a}
.rule small{display:block;margin-top:3px;font-weight:600}
.original{
  margin:10px 0;border:1px solid var(--line);border-radius:16px;
  background:#faf7f2;overflow:hidden
}
.original summary{
  min-height:var(--tap);display:flex;align-items:center;padding:10px 13px;
  cursor:pointer;font-weight:800
}
.original>div{padding:0 13px 13px;color:#4c5d63}
.tag,.streak{
  display:inline-flex;align-items:center;margin:2px 3px 2px 0;padding:5px 9px;
  border-radius:999px;font-size:12px;font-weight:800
}
.tag{background:#f0e7df;color:#6d5e54}
.streak{background:var(--green-soft);color:var(--green)}
.repair-head{
  padding:14px;border-radius:18px;background:linear-gradient(135deg,var(--red-soft),#fff8ef);
  border:2px solid #efb0a5;margin-bottom:12px
}
.repair-step{display:flex;gap:6px;margin:12px 0}
.repair-step i{height:8px;flex:1;border-radius:999px;background:#eadfd5}
.repair-step i.on{background:var(--coral)}
.finish-orbit{
  display:grid;place-items:center;width:160px;height:160px;margin:12px auto 18px;border-radius:50%;
  background:radial-gradient(circle,#fff 34%,#ffe1d7 35% 52%,#e5f7f4 53% 70%,transparent 71%);
  animation:orbit 8s linear infinite
}
.finish-orbit b{font-size:35px;color:var(--coral-dark);animation:orbit 8s linear infinite reverse}
@keyframes orbit{to{transform:rotate(360deg)}}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.summary-box{padding:11px 5px;border-radius:16px;background:#f7f1eb;text-align:center}
.summary-box b{display:block;font-size:24px}
.summary-box small{color:var(--muted);font-weight:700}
.daily{
  padding:10px 13px;border-radius:16px;background:linear-gradient(135deg,#fff6d7,#ffe7d9);
  font-size:14px;color:#704b16;font-weight:700
}
.drawer{position:fixed;inset:0;z-index:50;display:none;background:rgba(24,37,43,.55);padding:18px}
.drawer.open{display:grid;place-items:center}
.drawer-box{
  width:min(100%,560px);max-height:88vh;overflow:auto;background:var(--paper);
  border-radius:24px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.25)
}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.drawer h2{font-size:24px;margin:0}
.drawer-list{display:grid;gap:8px;margin:12px 0}
.drawer-list button,.drawer-list label{
  display:flex;align-items:center;justify-content:center;min-height:var(--tap);
  border:2px solid var(--line);border-radius:16px;background:white;font-weight:800;cursor:pointer
}
.drawer input{display:none}
.footnote{color:var(--muted);font-size:12px}
@media(max-width:480px){
  .topbar{padding-inline:10px}
  .progress-wrap,.phase-strip,main{padding-left:12px;padding-right:12px}
  .color-row{grid-template-columns:1fr 1fr}
  .gate{min-height:55px}
  .rule-grid{grid-template-columns:1fr}
  .option{padding-left:48px}
  .summary-grid{gap:6px}
  .summary-box b{font-size:20px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    scroll-behavior:auto!important;transition:none!important
  }
}
</style>

<script>
function freshState(){
  return {
    v:1,phase:"intro",teach:0,guided:0,recall:0,original:0,transfer:0,
    attempts:[],wrong:{},streak:{},repair:null,repairStep:0,
    returnMode:"independent",startedAt:new Date().toISOString(),finishedAt:""
  };
}
function loadState(){
  if(TEST_MODE)return freshState();
  try{
    const value=JSON.parse(localStorage.getItem(STORE_KEY)||"null");
    return value&&value.v===1?Object.assign(freshState(),value):freshState();
  }catch(_){
    return freshState();
  }
}
let state=loadState();
let sceneStep=0;

function saveState(){
  if(!TEST_MODE)localStorage.setItem(STORE_KEY,JSON.stringify(state));
}
function safeText(value){
  return String(value).replace(/[&<>"']/g,function(mark){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[mark];
  });
}
function codeHtml(value){
  return safeText(value||"").replace(
    /(printf|cout|for|while|if|else|break|double|int)/g,
    '<span class="hot">$1</span>'
  );
}
function gates(active,status){
  const names=[["TYPE","类型"],["LOOP","入口"],["VAR","变量"],["OUT","输出"]];
  return names.map(function(name,index){
    return '<div class="gate '+(index===active?status:"")+'"><span>'+name[0]+'</span>'+name[1]+'</div>';
  }).join("");
}
function optionHtml(choices){
  return choices.map(function(choice,index){
    return '<button class="option" type="button" data-choice="'+index+'">'+
      '<span class="letter">'+String.fromCharCode(65+index)+'</span>'+safeText(choice)+'</button>';
  }).join("");
}
function progressValue(){
  const map={
    intro:0,teach:8+state.teach*6,guided:33+state.guided*4,recall:49+state.recall*3,
    independent:61+state.original*2.3,repair:76,redo:84,
    transfer:88+state.transfer*2.2,finish:100
  };
  return Math.min(100,Math.round(map[state.phase]||0));
}
function navPhase(){
  if(state.phase==="intro")return "teach";
  if(state.phase==="redo")return "repair";
  if(state.phase==="finish")return "transfer";
  return state.phase;
}
function updateChrome(){
  const percent=progressValue();
  document.getElementById("progressBar").style.width=percent+"%";
  document.getElementById("progressText").textContent=percent+"%";
  const names={
    intro:"先找真正卡点",teach:"看懂四关",guided:"老师陪跑",recall:"遮住回想",
    independent:"重做昨日原题",repair:"只修这一处",redo:"错题连对两次",
    transfer:"换题也会",finish:"本课完成"
  };
  document.getElementById("progressName").textContent=names[state.phase]||"学习中";
  const order=["teach","guided","recall","independent","repair","transfer"];
  const index=order.indexOf(navPhase());
  document.querySelectorAll(".phase").forEach(function(node,i){
    node.classList.toggle("active",i===index);
    node.classList.toggle("done",i<index);
  });
}
function render(){
  updateChrome();
  const app=document.getElementById("app");
  if(state.phase==="intro")app.innerHTML=introHtml();
  else if(state.phase==="teach")renderTeach(app);
  else if(state.phase==="guided")renderQuiz(app,GUIDED[state.guided],"guided");
  else if(state.phase==="recall")renderQuiz(app,RECALL[state.recall],"recall");
  else if(state.phase==="independent")renderQuiz(app,ORIGINALS[state.original],"independent");
  else if(state.phase==="repair")renderRepair(app);
  else if(state.phase==="redo")renderRedo(app);
  else if(state.phase==="transfer")renderQuiz(app,TRANSFER[state.transfer],"transfer");
  else renderFinish(app);
  updateRecordSummary();
  window.scrollTo({top:0,behavior:"smooth"});
}
function introHtml(){
  return '<section class="screen">'+
    '<p class="eyebrow">昨日错题 · 根因先说</p>'+
    '<h2>不是不会语法，是没有让代码完整跑一遍</h2>'+
    '<div class="root"><strong>真正的大问题：</strong>看到代码后容易直接猜答案，少了“类型、入口、变量、输出”四次检查。</div>'+
    '<div class="card"><h3>每道题只走这四关</h3>'+
    '<div class="color-row">'+gates(-1,"")+'</div>'+
    '<div class="rule-grid">'+
      '<div class="rule blue">1 输入是什么<small>先认数字和题目要什么</small></div>'+
      '<div class="rule green">2 能不能运行<small>类型合法？循环进吗？</small></div>'+
      '<div class="rule amber">3 盒子怎么变<small>逐行更新，不凭感觉</small></div>'+
      '<div class="rule violet">4 屏幕写什么<small>数值和格式都要一样</small></div>'+
    '</div>'+
    '<div class="daily" data-micro-surprise="daily">'+safeText(DAILY_SURPRISES[dailySurpriseKey()])+'</div>'+
    '<div class="actions"><button class="next-btn" type="button" id="startLesson">开始侦察 '+ICON_NEXT+'</button></div>'+
    '</div></section>';
}
function renderTeach(app){
  const item=TEACH[state.teach];
  const frame=item.frames[Math.min(sceneStep,item.frames.length-1)];
  app.innerHTML='<section class="screen">'+
    '<p class="eyebrow">看懂 '+(state.teach+1)+' / '+TEACH.length+'</p>'+
    '<h2>'+safeText(item.title)+'</h2>'+
    '<div class="root"><strong>这一处误区：</strong>'+safeText(item.root)+'</div>'+
    '<div class="card"><div class="color-row">'+gates(frame[1],frame[2])+'</div>'+
      '<div class="code">'+codeHtml(item.code)+'</div>'+
      '<div class="scene-note">'+safeText(frame[0])+'</div>'+
      '<div class="actions"><button class="tiny-btn secondary" type="button" id="runScene" data-surprise="xray">'+
        ICON_PLAY+(sceneStep<item.frames.length-1?"运行下一步":"重新播放")+'</button></div>'+
    '</div>'+
    '<div class="card question"><h3>'+safeText(item.ask)+'</h3>'+
      '<div class="options" id="teachOptions">'+optionHtml(item.choices)+'</div>'+
      '<div class="feedback" id="teachFeedback"></div>'+
    '</div></section>';
}
function originalDetails(item){
  if(!item.original&&!item.code)return "";
  return '<details class="original"><summary>展开昨日原题信息</summary><div>'+
    (item.code?'<div class="code">'+codeHtml(item.code)+'</div>':"")+
    (item.original?'<p>'+safeText(item.original)+'</p>':"")+
    '</div></details>';
}
function renderQuiz(app,item,mode){
  if(!item){
    advanceAfter(mode);
    return;
  }
  const labels={guided:"跟着做",recall:"遮住回想",independent:"昨日原题",transfer:"迁移挑战"};
  const position=mode==="guided"?state.guided:
    mode==="recall"?state.recall:
    mode==="independent"?state.original:state.transfer;
  const total=mode==="guided"?GUIDED.length:
    mode==="recall"?RECALL.length:
    mode==="independent"?ORIGINALS.length:TRANSFER.length;
  const streak=state.streak[item.id]||0;
  app.innerHTML='<section class="screen">'+
    '<p class="eyebrow">'+labels[mode]+' '+(position+1)+' / '+total+'</p>'+
    '<h2>'+safeText(item.skill)+'</h2>'+
    (mode==="independent"?'<span class="tag">'+safeText(item.type)+'</span>'+
      (streak?'<span class="streak">连续答对 '+streak+' / 2</span>':""):"")+
    '<div class="card question">'+
      '<p class="question-title">'+safeText(item.prompt)+'</p>'+
      originalDetails(item)+
      '<div class="options" id="quizOptions">'+optionHtml(item.choices)+'</div>'+
      '<div class="feedback" id="quizFeedback"></div>'+
      (item.question?'<div class="why"><strong>深想一问：</strong>'+safeText(item.question)+'</div>':"")+
    '</div></section>';
}
function renderRepair(app){
  const item=ORIGINALS.find(function(question){return question.id===state.repair;});
  if(!item){
    state.phase=state.returnMode;
    saveState();
    render();
    return;
  }
  const mini=REPAIRS[item.repair][state.repairStep];
  app.innerHTML='<section class="screen">'+
    '<div class="repair-head" data-child-explanation="primary"><p class="eyebrow">定点修复 · 不重讲整章</p>'+
      '<h2>'+safeText(item.skill)+'</h2>'+
      '<p data-child-part="gap"><strong>你卡在：</strong>'+safeText(item.skill)+'的第一步没有检查。</p>'+
      '<p data-child-part="reason"><strong>真正原因：</strong>'+safeText(item.why)+'</p>'+
      '<p data-child-part="check"><strong>现在你来：</strong>'+safeText(mini.prompt)+'</p>'+
    '</div>'+
    '<div class="repair-step"><i class="on"></i><i class="'+(state.repairStep>0?"on":"")+'"></i></div>'+
    '<div class="card question"><p class="question-title">'+safeText(mini.prompt)+'</p>'+
      '<div class="options" id="repairOptions">'+optionHtml(mini.choices)+'</div>'+
      '<div class="feedback" id="repairFeedback"></div>'+
    '</div></section>';
}
function pendingWrongIds(){
  return Object.keys(state.wrong).filter(function(id){return (state.streak[id]||0)<2;});
}
function renderRedo(app){
  const ids=pendingWrongIds();
  if(!ids.length){
    state.phase="transfer";
    state.transfer=0;
    saveState();
    render();
    return;
  }
  const item=ORIGINALS.find(function(question){return question.id===ids[0];});
  app.innerHTML='<section class="screen">'+
    '<p class="eyebrow">错题回炉 · '+ids.length+' 道待毕业</p>'+
    '<h2>同一道原题，再独立一次</h2>'+
    '<div class="root"><strong>毕业规则：</strong>不是“看懂答案”就算会；原题要连续答对2次。</div>'+
    '<div class="card question"><span class="streak">连续答对 '+(state.streak[item.id]||0)+' / 2</span>'+
      '<p class="question-title">'+safeText(item.prompt)+'</p>'+
      originalDetails(item)+
      '<div class="options" id="redoOptions">'+optionHtml(item.choices)+'</div>'+
      '<div class="feedback" id="redoFeedback"></div>'+
      '<div class="why"><strong>审题四问：</strong>类型对吗？第一次进吗？哪个盒子变？屏幕严格写什么？</div>'+
    '</div></section>';
}
function renderFinish(app){
  const originalAttempts=state.attempts.filter(function(item){return item.mode==="independent";});
  const firstRight=ORIGINALS.filter(function(question){
    const first=originalAttempts.find(function(item){return item.id===question.id;});
    return first&&first.result==="right";
  }).length;
  const repaired=Object.keys(state.wrong).length;
  app.innerHTML='<section class="screen">'+
    '<p class="eyebrow">完成 · 会讲才算会</p>'+
    '<h2>Eddey 已跑完整条代码链</h2>'+
    '<div class="finish-orbit"><b>AC</b></div>'+
    '<div class="card"><div class="summary-grid">'+
      '<div class="summary-box"><b>'+firstRight+'</b><small>原题首答对</small></div>'+
      '<div class="summary-box"><b>'+repaired+'</b><small>定点修复</small></div>'+
      '<div class="summary-box"><b>5</b><small>迁移通过</small></div>'+
    '</div>'+
    '<div class="root"><strong>费曼收尾：</strong>请用一句话告诉爸爸：“我看到代码，不先猜；我先查类型和入口，再看变量，最后核对输出。”</div>'+
    '<div class="actions">'+
      '<button class="next-btn secondary" type="button" id="redoAll">'+ICON_BACK+' 再练全部原题</button>'+
      '<button class="next-btn" type="button" id="finishSync">完成并同步 '+ICON_NEXT+'</button>'+
    '</div></div></section>';
}
function markOptions(container,chosen,answer,reveal){
  container.querySelectorAll(".option").forEach(function(button,index){
    button.disabled=true;
    if(reveal&&index===answer)button.classList.add("correct");
    if(index===chosen&&index!==answer)button.classList.add("wrong");
    if(index===chosen&&index===answer)button.classList.add("correct");
  });
}
function showFeedback(id,success,text){
  const box=document.getElementById(id);
  if(!box)return;
  box.className="feedback show "+(success?"ok":"no");
  box.textContent=text;
}
function record(item,mode,choice,success){
  state.attempts.push({
    id:item.id,mode:mode,choice:choice,result:success?"right":"wrong",
    at:new Date().toISOString(),skill:item.skill
  });
  saveState();
  if(TEST_MODE||!window.DDLearningSync)return;
  window.DDLearningSync.recordAttempt({
    kid:"eddey",subject:"编程",activity:mode,
    topic:"GESP一级错题修复 · "+item.skill,
    item:item.id+" "+item.prompt,ok:success,
    hint:success?"独立作答正确":item.why||"进入定点修复",
    source:"apps/eddey_cpp_gesp_repair_lab_20260831.html",
    payload:{app_id:APP_ID,choice:choice,phase:mode}
  });
}
function addNextButton(afterId,callback,label){
  const box=document.getElementById(afterId);
  const wrap=document.createElement("div");
  wrap.className="actions";
  wrap.innerHTML='<button class="next-btn" type="button" id="dynamicNext">'+
    safeText(label||"继续")+" "+ICON_NEXT+"</button>";
  box.after(wrap);
  document.getElementById("dynamicNext").onclick=callback;
}
function handleTeachChoice(index,button){
  const item=TEACH[state.teach];
  const box=document.getElementById("teachOptions");
  if(index!==item.answer){
    button.classList.add("wrong");
    showFeedback("teachFeedback",false,"再想一次：只说代码真的会做的事。");
    return;
  }
  markOptions(box,index,item.answer,true);
  showFeedback("teachFeedback",true,"讲清楚了。你不是在背答案，是在教机器人。");
  addNextButton("teachFeedback",function(){
    state.teach+=1;
    sceneStep=0;
    if(state.teach>=TEACH.length){
      state.phase="guided";
      state.guided=0;
    }
    saveState();
    render();
  },"进入下一步");
}
function handleQuizChoice(item,mode,index){
  const success=index===item.answer;
  const container=document.getElementById("quizOptions");
  record(item,mode,index,success);
  if(mode==="independent"){
    markOptions(container,index,item.answer,success);
    if(success){
      state.streak[item.id]=(state.streak[item.id]||0)+1;
      saveState();
      showFeedback("quizFeedback",true,"答对。证据："+item.why);
      addNextButton("quizFeedback",function(){
        state.original+=1;
        advanceAfter("independent");
      },"下一道原题");
    }else{
      state.wrong[item.id]=true;
      state.streak[item.id]=0;
      state.repair=item.id;
      state.repairStep=0;
      state.returnMode="independent";
      saveState();
      showFeedback("quizFeedback",false,"先不看正确选项。只修："+item.skill+"。");
      addNextButton("quizFeedback",function(){
        state.phase="repair";
        saveState();
        render();
      },"进入两步修复");
    }
    return;
  }
  markOptions(container,index,item.answer,true);
  showFeedback(
    "quizFeedback",success,
    success?"说对了。"+item.why:"这次不对。"+item.why
  );
  if(success){
    addNextButton("quizFeedback",function(){advanceIndex(mode);},mode==="transfer"?"下一道迁移":"继续");
  }else{
    addNextButton("quizFeedback",render,"遮住答案再做一次");
  }
}
function advanceIndex(mode){
  if(mode==="guided")state.guided+=1;
  else if(mode==="recall")state.recall+=1;
  else if(mode==="transfer")state.transfer+=1;
  advanceAfter(mode);
}
function advanceAfter(mode){
  if(mode==="guided"&&state.guided>=GUIDED.length){
    state.phase="recall";state.recall=0;
  }else if(mode==="recall"&&state.recall>=RECALL.length){
    state.phase="independent";state.original=0;
  }else if(mode==="independent"&&state.original>=ORIGINALS.length){
    state.phase=pendingWrongIds().length?"redo":"transfer";state.transfer=0;
  }else if(mode==="transfer"&&state.transfer>=TRANSFER.length){
    state.phase="finish";state.finishedAt=new Date().toISOString();
  }
  saveState();
  render();
}
function handleRepairChoice(index,button){
  const item=ORIGINALS.find(function(question){return question.id===state.repair;});
  const mini=REPAIRS[item.repair][state.repairStep];
  const box=document.getElementById("repairOptions");
  if(index!==mini.answer){
    button.classList.add("wrong");
    showFeedback("repairFeedback",false,"别猜。把数字或条件真正代进去。");
    return;
  }
  markOptions(box,index,mini.answer,true);
  showFeedback("repairFeedback",true,"这一步清楚了。");
  if(state.repairStep<1){
    addNextButton("repairFeedback",function(){
      state.repairStep=1;saveState();render();
    },"修第二步");
  }else{
    const wrap=document.createElement("div");
    wrap.className="actions";
    wrap.innerHTML='<button class="next-btn" type="button" id="returnOriginal" data-return-to-question="independent">'+
      "回到同一道原题 "+ICON_NEXT+"</button>";
    box.parentElement.appendChild(wrap);
    document.getElementById("returnOriginal").onclick=function(){
      state.phase=state.returnMode;
      state.repairStep=0;
      saveState();
      render();
    };
  }
}
function handleRedoChoice(item,index){
  const success=index===item.answer;
  const container=document.getElementById("redoOptions");
  record(item,"repair_return",index,success);
  markOptions(container,index,item.answer,success);
  if(success){
    state.streak[item.id]=(state.streak[item.id]||0)+1;
    saveState();
    const graduated=state.streak[item.id]>=2;
    showFeedback(
      "redoFeedback",true,
      graduated?"连续两次正确，这道错题毕业。":"已对1次，再对1次才毕业。"
    );
    addNextButton("redoFeedback",render,graduated?"练下一道":"再做同题");
  }else{
    state.streak[item.id]=0;
    state.repair=item.id;
    state.repairStep=0;
    state.returnMode="redo";
    saveState();
    showFeedback("redoFeedback",false,"不显示正确选项。回去只修证据链断掉的这一处。");
    addNextButton("redoFeedback",function(){
      state.phase="repair";saveState();render();
    },"回两步修复");
  }
}
function finishSync(){
  if(TEST_MODE){
    alert("测试模式：流程已完成，不写入正式记录。");
    return;
  }
  if(window.DDLearningSync){
    window.DDLearningSync.complete({
      kid:"eddey",subject:"编程",topic:"GESP一级昨日错题修复",
      item:"完成10道原题、错题两连对和5道迁移题",
      source:"apps/eddey_cpp_gesp_repair_lab_20260831.html",
      payload:{
        app_id:APP_ID,attempts:state.attempts.length,
        repaired:Object.keys(state.wrong).length,finished_at:state.finishedAt
      }
    });
    window.DDLearningSync.flush().then(function(){
      alert("学习记录已保存并同步。");
    });
  }else{
    alert("学习记录已保存在本机。");
  }
}
function download(name,text,type){
  const blob=new Blob([text],{type:type||"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function exportJson(){
  const data={
    version:1,appId:APP_ID,kid:"eddey",
    savedAt:new Date().toISOString(),state:state
  };
  download("eddey-cpp-gesp-repair.json",JSON.stringify(data,null,2),"application/json");
}
function exportMarkdown(){
  const wrong=Object.keys(state.wrong);
  const right=state.attempts.filter(function(item){return item.result==="right";}).length;
  const topics=wrong.length?wrong.map(function(id){
    return "- "+ORIGINALS.find(function(question){return question.id===id;}).skill;
  }).join("\n"):"- 暂无";
  const text="# Eddey C++ 错题修复记录\n\n"+
    "- 日期：2026-08-31\n- 原题：10道\n- 作答次数："+state.attempts.length+
    "\n- 正确作答："+right+"\n- 进入修复："+wrong.length+
    "道\n- 当前阶段："+state.phase+"\n\n## 需要继续留意\n"+topics+"\n";
  download("eddey-cpp-gesp-repair.md",text,"text/markdown;charset=utf-8");
}
function importJson(file){
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const data=JSON.parse(String(reader.result));
      if(data.version!==1||data.appId!==APP_ID||data.kid!=="eddey"||!data.state){
        throw new Error("不是本课的 Eddey 记录");
      }
      state=Object.assign(freshState(),data.state);
      saveState();
      closeTools();
      render();
      alert("记录导入成功。");
    }catch(error){
      alert("无法导入："+error.message);
    }
  };
  reader.readAsText(file);
}
function updateRecordSummary(){
  const node=document.getElementById("recordSummary");
  if(!node)return;
  node.textContent="已作答 "+state.attempts.length+" 次；当前有 "+
    pendingWrongIds().length+" 道错题尚未连续答对2次。";
}
function openTools(){
  document.getElementById("toolsDrawer").classList.add("open");
  updateRecordSummary();
}
function closeTools(){
  document.getElementById("toolsDrawer").classList.remove("open");
}

document.addEventListener("click",function(event){
  const choice=event.target.closest("[data-choice]");
  if(choice){
    const index=Number(choice.dataset.choice);
    if(choice.closest("#teachOptions")){
      handleTeachChoice(index,choice);
    }else if(choice.closest("#quizOptions")){
      const item=state.phase==="guided"?GUIDED[state.guided]:
        state.phase==="recall"?RECALL[state.recall]:
        state.phase==="independent"?ORIGINALS[state.original]:TRANSFER[state.transfer];
      handleQuizChoice(item,state.phase,index);
    }else if(choice.closest("#repairOptions")){
      handleRepairChoice(index,choice);
    }else if(choice.closest("#redoOptions")){
      const item=ORIGINALS.find(function(question){return question.id===pendingWrongIds()[0];});
      handleRedoChoice(item,index);
    }
    return;
  }
  if(event.target.closest("#startLesson")){
    state.phase="teach";state.teach=0;sceneStep=0;saveState();render();
  }else if(event.target.closest("#runScene")){
    sceneStep=(sceneStep+1)%TEACH[state.teach].frames.length;render();
  }else if(event.target.closest("#finishSync")){
    finishSync();
  }else if(event.target.closest("#redoAll")){
    state.phase="independent";state.original=0;state.wrong={};state.streak={};
    saveState();render();
  }
});
document.getElementById("openTools").onclick=openTools;
document.getElementById("closeTools").onclick=closeTools;
document.getElementById("toolsDrawer").addEventListener("click",function(event){
  if(event.target.id==="toolsDrawer")closeTools();
});
document.getElementById("exportJson").onclick=exportJson;
document.getElementById("exportMd").onclick=exportMarkdown;
document.getElementById("importFile").onchange=function(event){
  if(event.target.files[0])importJson(event.target.files[0]);
  event.target.value="";
};
document.getElementById("resetLesson").onclick=function(){
  if(confirm("确定重新开始本课吗？")){
    state=freshState();saveState();closeTools();render();
  }
};
document.addEventListener("keydown",function(event){
  if(event.key==="Escape")closeTools();
});
render();
</script>
<script src="../assets/learning-sync.js"></script>
</body>
</html>
