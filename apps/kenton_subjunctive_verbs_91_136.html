  <script>

    {id:'wish-now',label:'现在不如愿',fact:'It is not true.',factZh:'事实：这不是真的。',wish:'I wish (that) it were true.',wishZh:'教材例句：我但愿这是真的。',formula:'主语 + wish + (that) + 主语 + 过去式 / were',why:'说的是“现在”，却把动词往过去退一步，表示它和现在事实相反。教材本页例句使用 were，本课按教材写 were。',cue:'现在不是真的 → 往回退一步'},

  function renderVerbHub(){const counts=Object.fromEntries(Object.keys(families).map(k=>[k,verbs.filter(v=>v.fam===k).length]));return `${pageHead('91—136 老师带背课','先按小组学会变化，再遮住开口背')}

  function submitDictation(){const v=verbQueue[verbPos];['third','ing','past','pp','zh'].filter(f=>!(f==='pp'&&isModal(v))).forEach(f=>updateVerbField(v,f,!dictationWrong.has(f),'paper-dictation'));verbPos++;dictationWrong=new Set();dictationRevealed=false;render();scrollTo(0,0);if(verbPos<verbQueue.length)setTimeout(playDictation,320)}
  function renderDictationResult(){const weak=verbs.filter(verbIsWeak);DDMemory.markModule('paper-dictation-91-136','complete',{tested:verbQueue.length,weak:weak.length});return `${pageHead('纸笔默写完成','五个栏目分别记录，不用只看总分')}
    <section class="panel"><div class="empty"><div class="big">📝</div><h2>本轮完成 ${verbQueue.length} 个词</h2><p>当前仍有 ${weak.length} 个词存在未解决错栏。回炉时只重学具体错误形态，连续正确 2 次才关闭。</p></div><div class="btn-row">${weak.length?'<button class="btn secondary" onclick="startVerbTeach(\'weak\')">老师重教错词</button><button class="btn green" onclick="startVerbRecall(\'weak\')">只背错词</button>':''}<button class="btn primary" onclick="go('records')">查看学习记录</button></div></section>`}

  function grammarWeakItems(){return grammarSteps.filter(g=>state.grammar.stats[g.id]?.errors>0&&!state.grammar.stats[g.id]?.solved)}
  function verbWeakFields(v){return ['third','ing','past','pp','zh'].filter(f=>!(f==='pp'&&isModal(v))).filter(f=>{const s=getStat(v.n,f);return s.errors>0&&!s.solved})}
  function renderRecords(){const p=progressSummary(),gWeak=grammarWeakItems(),vWeak=verbs.filter(verbIsWeak);return `${pageHead('错题与学习记录','记录只保存在这台设备，可导出后回传')}
    <section class="progress-board" style="margin-top:0"><div class="progress-grid"><div class="metric"><strong>${p.grammarDone}/4</strong><span>语法过关</span></div><div class="metric"><strong>${p.copyDone}/38</strong><span>抄写格</span></div><div class="metric"><strong>${p.seen}/46</strong><span>已带背</span></div><div class="metric"><strong>${vWeak.length}</strong><span>错词待回炉</span></div></div></section>
    <section class="panel"><h2>虚拟语气待回炉</h2>${gWeak.length?`<div class="weak-list">${gWeak.map(g=>{const s=state.grammar.stats[g.id];return `<div class="weak-item"><div><h3>${esc(g.label)}</h3><p>${esc(g.formula)} · 累计错 ${s.errors} 次</p></div><span class="streak">连对 ${s.streak}/2</span></div>`}).join('')}</div><div class="btn-row"><button class="btn secondary" onclick="startGrammarPractice(true)">只练这些结构</button></div>`:'<div class="empty"><div class="big">✅</div><p>目前没有未解决的虚拟语气错误。</p></div>'}</section>
    <section class="panel"><h2>不规则动词待回炉</h2>${vWeak.length?`<div class="weak-list">${vWeak.map(v=>`<div class="weak-item"><div><h3>${v.n}. ${esc(v.base)}</h3><p>错栏：${verbWeakFields(v).map(fieldName).join('、')}</p></div><span class="streak">${families[v.fam].icon}</span></div>`).join('')}</div><div class="btn-row"><button class="btn secondary" onclick="startVerbTeach('weak')">老师重教</button><button class="btn green" onclick="startVerbRecall('weak')">只背错词</button><button class="btn ghost" onclick="startDictation('weak')">只默错词</button></div>`:'<div class="empty"><div class="big">🌱</div><p>目前没有未解决错词。正式默写后如果出现错误，会自动进入这里。</p></div>'}</section>
    <section class="panel"><h2>导出与跨设备</h2><div class="report-actions"><button class="btn primary" onclick="downloadJSON()">下载 JSON 学习记录</button><button class="btn secondary" onclick="downloadMarkdown()">下载 Markdown 汇报</button><button class="btn green" onclick="copyMarkdown()">一键复制给 ChatGPT</button><button class="btn ghost" onclick="document.getElementById('importInput').click()">导入另一台设备记录</button></div><p class="privacy">隐私说明：只记录 Kenton、本课学习步骤、作答和错因；不保存学校、班级、账号、密码或任何 GitHub Token。</p></section>`}
  function exportObject(){sessionTick();return{...state,materialSources:MATERIAL_SOURCES,exportedAt:new Date().toISOString(),summary:progressSummary()}}
  function markdownReport(){const p=progressSummary(),vWeak=verbs.filter(verbIsWeak),gWeak=grammarWeakItems();return `# Kenton 英语学习记录：虚拟语气 + 不规则动词 91—136\n\n- 导出时间：${new Date().toLocaleString('zh-CN')}\n- 目标日期：${DUE}\n- 虚拟语气过关：${p.grammarDone}/4\n- 第103页抄写：${p.copyDone}/38 格\n- 已带背动词：${p.seen}/46\n- 累计学习时长：${Math.round(state.totalMs/60000)} 分钟\n\n## 材料依据\n- ${MATERIAL_SOURCES.grammar}\n- ${MATERIAL_SOURCES.verbs}\n- ${MATERIAL_SOURCES.pedagogy}\n\n## 虚拟语气待回炉\n${gWeak.length?gWeak.map(g=>`- ${g.label}：累计错 ${state.grammar.stats[g.id].errors} 次，连续正确 ${state.grammar.stats[g.id].streak}/2`).join('\n'):'- 无'}\n\n## 不规则动词待回炉\n${vWeak.length?vWeak.map(v=>`- ${v.n}. ${v.base}：${verbWeakFields(v).map(fieldName).join('、')}`).join('\n'):'- 无'}\n\n## 下一步\n- 先重教未解决结构和错词。\n- 每个错栏连续答对 2 次后再标记解决。\n- 下周一正式默写结果需继续回传。\n`}
  function download(name,text,type){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
  function downloadJSON(){download('Kenton_虚拟语气_不规则动词91-136_学习记录.json',JSON.stringify(exportObject(),null,2),'application/json;charset=utf-8');toast('JSON 已下载')}
  function downloadMarkdown(){download('Kenton_虚拟语气_不规则动词91-136_学习汇报.md',markdownReport(),'text/markdown;charset=utf-8');toast('Markdown 已下载')}
  async function copyMarkdown(){try{await navigator.clipboard.writeText(markdownReport());toast('学习汇报已复制，可以发给 ChatGPT')}catch(e){downloadMarkdown()}}
  function importProgress(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(x.child!=='Kenton'||x.lesson!=='subjunctive-verbs-91-136')throw Error('wrong');state=x;state.schema=1;save();toast('学习记录导入成功');render()}catch(err){toast('这不是本软件的 Kenton 学习记录')}e.target.value=''};reader.readAsText(file)}
  render();
  </script>
</body>
