<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../assets/learning-sync.js"></script>

<title>Eddey · 计算技法大通关（技巧篇速算 10 馆）</title>
<style>
:root{--c:#e8642f;--cd:#c24e20;--cbg:#fff0e6;--gold:#f2b632;--golddk:#c98a00;--ink:#2e2a26;--paper:#fdf6ee;
 --line:#eadfd2;--muted:#8a8178;--green:#2e9c54;--greenbg:#e9f7ee;--red:#d64545;--redbg:#fdecec;--orange:#e8862f;--orangebg:#fdf1e3;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:'LXGW WenKai Screen','PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding-bottom:50px;
 background:radial-gradient(circle at 15% 5%,#ffe3d1 0,transparent 45%),radial-gradient(circle at 85% 20%,#ffefd9 0,transparent 40%),var(--paper);}
.wrap{max-width:620px;margin:0 auto;padding:14px;}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.badge{background:var(--c);color:#fff;font-weight:800;font-size:17px;padding:6px 13px;border-radius:13px 13px 13px 4px;box-shadow:0 4px 0 var(--cd);}
.back{background:none;border:none;color:var(--muted);font-size:15px;font-family:inherit;font-weight:800;cursor:pointer;padding:6px 2px;}
.mute{background:none;border:none;font-size:20px;cursor:pointer;}
h1{font-size:21px;text-align:center;margin:8px 0 2px;color:var(--cd);}
.sub{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.7;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:400px){.grid{grid-template-columns:repeat(2,1fr);}}
.tile{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 8px 10px;text-align:center;cursor:pointer;box-shadow:0 5px 0 #efe3d4;transition:transform .12s;}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #efe3d4;}
.tile.lock{opacity:.55;filter:grayscale(.6);}
.tile .ic{font-size:32px;}
.tile .nm{font-weight:800;font-size:14px;margin-top:6px;color:var(--cd);line-height:1.3;}
.tile .ds{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.45;}
.tile .done{position:absolute;top:6px;right:8px;font-size:10.5px;font-weight:800;background:var(--greenbg);color:var(--green);border-radius:8px;padding:2px 6px;}
.tile .today{position:absolute;top:-9px;left:10px;font-size:11px;font-weight:800;background:var(--gold);color:#5a3d00;border-radius:8px;padding:2px 8px;box-shadow:0 2px 0 var(--golddk);}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 6px 0 #f2e7d9;}
.h2{font-size:17px;font-weight:800;color:var(--cd);margin:0 0 8px;}
.h2 .tag{font-size:11px;background:var(--cbg);color:var(--cd);border-radius:8px;padding:2px 8px;vertical-align:2px;margin-left:6px;}
.btn{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:12px;padding:11px 16px;cursor:pointer;color:#fff;background:var(--c);box-shadow:0 4px 0 var(--cd);}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cd);}
.btn.gold{background:var(--gold);color:#5a3d00;box-shadow:0 4px 0 var(--golddk);}
.btn.ghost{background:#fff;color:var(--cd);border:2px solid var(--line);box-shadow:0 4px 0 #efe3d4;}
.btn.red{background:var(--red);box-shadow:0 4px 0 #a83232;}
.btn.wide{display:block;width:100%;margin:8px 0;}
.hide{display:none!important;}
/* 放大镜 */
.bigexpr{text-align:center;font-size:24px;font-weight:900;margin:12px 0;line-height:1.8;word-break:break-all;}
.bigexpr .tk{display:inline-block;padding:1px 2px;border-radius:6px;transition:all .3s;}
.bigexpr .tk.hn{background:var(--orangebg);color:var(--orange);animation:pulse 1s ease 2;}
.bigexpr .tk.ho{background:var(--cbg);color:var(--c);animation:pulse 1s ease 2;}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.mirbtns{display:flex;gap:8px;}
.mirbtns .btn{flex:1;font-size:14px;}
.feat{background:var(--orangebg);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.7;margin:8px 0;font-weight:700;animation:fadein .5s;}
.feat.blue{background:var(--cbg);}
.mchip{display:inline-block;background:#fff;border:2px solid var(--gold);color:#a8730a;border-radius:12px;padding:5px 12px;font-size:13.5px;font-weight:800;margin:3px;animation:fadein .5s;}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 分步动画 */
.srow{display:flex;align-items:flex-start;gap:8px;margin:10px 0;animation:slidein .5s ease;}
@keyframes slidein{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.srow .math{font-size:19px;font-weight:800;line-height:1.6;word-break:break-all;flex:1;}
.srow.cur .math{background:#fffbe8;border-radius:8px;padding:2px 6px;}
.snote{align-self:center;flex-shrink:0;max-width:42%;background:var(--orange);color:#fff;font-size:12px;font-weight:800;border-radius:10px 10px 10px 2px;padding:5px 9px;line-height:1.5;animation:fadein .6s;}
.snote:before{content:"⬅ ";}
.swhy{font-size:12.5px;color:#8a6a3a;background:var(--orangebg);border-radius:8px;padding:6px 10px;margin:-4px 0 10px 6px;line-height:1.7;animation:fadein .7s;}
.fin{text-align:center;font-size:16px;font-weight:900;color:var(--green);margin:10px 0;animation:pop .4s;}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
/* 妙招 */
.fmla{background:linear-gradient(135deg,#fff8e0,#ffefc9);border:2px dashed var(--gold);border-radius:12px;padding:10px 13px;font-size:16.5px;font-weight:900;color:#7a5200;text-align:center;margin:8px 0;line-height:1.8;word-break:break-all;}
.usebox{font-size:14px;line-height:1.8;color:#4a443e;}
.usebox b{color:#a8730a;}
/* 训练 */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px;}
.hint{background:var(--cbg);border-radius:12px 12px 12px 2px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--cd);margin:6px 0;line-height:1.6;}
.hint:before{content:"💡 ";}
.star{color:#c98a00;font-weight:900;}
.qtext{font-size:20px;font-weight:900;text-align:center;margin:10px 0 12px;line-height:1.8;word-break:break-all;}
.qtext.word{font-size:16px;text-align:left;font-weight:700;line-height:1.9;}
.opt{display:block;width:100%;text-align:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;margin:8px 0;}
.opt.good{border-color:var(--green);background:var(--greenbg);color:var(--green);}
.opt.bad{border-color:var(--red);background:var(--redbg);color:var(--red);animation:shake .35s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.steps{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:16.5px;line-height:2;margin:10px 0;font-weight:800;word-break:break-all;animation:fadein .4s;}
.steps .lb{font-size:12px;color:var(--muted);font-weight:800;display:block;}
.steps .last{background:var(--gold);border-radius:6px;padding:0 5px;}
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 13px;display:flex;gap:14px;justify-content:space-around;font-size:13px;font-weight:800;color:var(--cd);margin:8px 0;text-align:center;}
.wbitem{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:7px 2px;border-bottom:1px dashed var(--line);align-items:center;}
.wbitem .t{font-size:11px;color:var(--red);font-weight:800;white-space:nowrap;}
textarea{width:100%;height:130px;font-size:12px;border:2px solid var(--line);border-radius:10px;padding:8px;font-family:monospace;}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">

<!-- ============ 首页 ============ -->
<div id="vHome">
  <div class="top"><span class="badge">🐯 Eddey</span><button class="mute" id="muteBtn" onclick="toggleMute()">🔔</button></div>
  <h1>⚡ 计算技法大通关 · 技巧篇速算（弟弟版）</h1>
  <div class="sub">技巧篇 10 讲速算口诀：「放大镜」找特点 → 「分步变身」讲为什么 → 背口诀 → 原书真题检验<br>📘 每天开一个新馆 · 错题自动进错题本</div>
  <div id="wbEntry"></div>
  <div id="reviewEntry"></div>
  <div class="grid" id="homeGrid"></div>
  <div class="card">
    <div class="h2">📋 我的练习记录</div>
    <div class="stat" id="statBar"></div>
    <div id="wbPanel"></div>
    <button class="btn ghost wide" onclick="exportCopy()">📋 复制记录（发给爸爸）</button>
    <button class="btn ghost wide" onclick="exportFile()">💾 存成文件</button>
    <button class="btn ghost wide" onclick="toggleExp()">👀 看一眼导出内容</button>
    <div id="expBox" class="hide"><textarea id="expTa" readonly></textarea></div>
    <button class="btn gold wide" onclick="parentUnlock()">🔓 家长提前解锁下一馆</button>
  </div>
</div>

<!-- ============ 教学页 ============ -->
<div id="vTeach" class="hide">
  <div class="top"><button class="back" onclick="goHome()">← 回选馆</button><span class="badge" id="tBadge"></span></div>
  <div class="card">
    <div class="h2">🔍 题干放大镜<span class="tag" id="tTag"></span></div>
    <div class="note">别急着算！先像书里一样，用放大镜看看这道题长什么样：</div>
    <div class="bigexpr" id="mExpr"></div>
    <div class="mirbtns">
      <button class="btn" id="btnNum" onclick="revealNum()">🔍 数字有什么特点?</button>
      <button class="btn" id="btnOp" onclick="revealOp()">🔍 算法有什么特点?</button>
    </div>
    <div id="mFeats"></div>
    <div id="mMethods" class="hide" style="margin-top:8px"></div>
    <button class="btn gold wide hide" id="btnToSteps" onclick="showSteps()">▶ 看它一步步变身!</button>
  </div>
  <div class="card hide" id="cardSteps">
    <div class="h2">🎬 分步变身（每一步都有为什么）</div>
    <div id="stepRows"></div>
    <button class="btn wide" id="btnStep" onclick="nextStep()">▶ 下一步</button>
  </div>
  <div class="card hide" id="cardTips">
    <div class="h2">🧙 帮帮妙招（背下来）</div>
    <div class="usebox" id="tipUse"></div>
    <div id="tipFms"></div>
    <button class="btn gold wide" onclick="qStart(CUR.id)">✏️ 开始训练（原书真题）</button>
  </div>
</div>

<!-- ============ 训练页 ============ -->
<div id="vQuiz" class="hide">
  <div class="top"><button class="back" onclick="quitQuiz()">← 退出</button><span class="badge" id="qTime">⏱ 0:00</span></div>
  <div class="card">
    <div class="qhead"><span id="qProg"></span><span id="qScore"></span></div>
    <div id="qHint"></div>
    <div id="qText" class="qtext"></div>
    <div id="qOpts"></div>
    <div id="qEx"></div>
    <button class="btn wide hide" id="btnNext" onclick="qNext()">下一题 →</button>
  </div>
</div>

<!-- ============ 结果页 ============ -->
<div id="vResult" class="hide">
  <div class="top"><button class="back" onclick="goHome()">← 回选馆</button><span class="badge">🏁 完成</span></div>
  <div class="card" id="resCard"></div>
</div>

</div>
<script>
"use strict";
function $(id){return document.getElementById(id);}
var LSK='calc_skills_eddey_v1', WBK=LSK+'_wb', START='2026-07-14';
function load(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var DB=load(LSK,{done:{},events:[]});
var WB=load(WBK,{items:{}});
var UNL_EXTRA=load(LSK+'_unl',0);
var MUTE=localStorage.getItem(LSK+'_mute')==='1';

/* ---- 声音 ---- */
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,delay,type,vol){var a=ac();if(!a||MUTE)return;var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;
 g.gain.setValueAtTime(vol||0.18,a.currentTime+(delay||0));g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(delay||0)+dur);
 o.connect(g);g.connect(a.destination);o.start(a.currentTime+(delay||0));o.stop(a.currentTime+(delay||0)+dur+0.05);}
function ding(){tone(660,0.14,0);tone(880,0.2,0.12);}
function buzz(){tone(170,0.28,0,'sawtooth',0.1);}
function tick(){tone(520,0.06,0,'triangle',0.12);}
function toggleMute(){MUTE=!MUTE;localStorage.setItem(LSK+'_mute',MUTE?'1':'0');$('muteBtn').textContent=MUTE?'🔕':'🔔';}

/* ---- 错题本（错过必进本，连对2次才出本） ---- */
function wbAddWrong(d){var it=WB.items[d.q]||{q:d.q,a:d.a,ex:d.ex,hint:d.hint||'',streak:0,mastered:false,wrong:0};
 it.wrong++;it.streak=0;it.mastered=false;it.ex=d.ex;WB.items[d.q]=it;save(WBK,WB);}
function wbAddRight(q){var it=WB.items[q];if(!it||it.mastered)return;it.streak++;if(it.streak>=2)it.mastered=true;save(WBK,WB);}
function wbList(){var r=[];for(var k in WB.items){if(!WB.items[k].mastered)r.push(WB.items[k]);}return r;}
function logEvent(ev){ev.ts=Date.now();DB.events.push(ev);save(LSK,DB);}
function modStat(id){var d=DB.done[id];if(!d)return null;var st=d.wrong===0?'⭐⭐⭐':(d.wrong<=2?'⭐⭐':'⭐');return st+'✅'+d.ok+'❌'+d.wrong;}

/* =================== 16 馆数据（照原书方法篇讲次） =================== */
var MODS=[
{id:'s01',ic:'🔄',nm:'第1讲 颠倒数的加法',ds:'58+85？首尾相加两边拉',
 ex:{expr:'58+85',num:'两个加数首尾颠倒：个位与十位上的数字交换了位置！',op:'两位数相加求和。',
  feats:['数字首尾颠倒','加数都是两位数','相加求和'],methods:['(首+尾)×11','化加为乘'],
  steps:[{t:'58+85'},{t:'=(5+8)×11',n:'首尾和×11',w:'为什么？58+85=(50+8)+(80+5)=(5+8)个十+(8+5)个一=(5+8)×11！'},{t:'=13×11',n:'化加为乘',w:'首尾相加得 13，再乘 11。'},{t:'=143',n:'乘11口诀',w:'一个数乘 11：两边一拉，中间相加（1_3 → 1+3=4? 不对，13×11：1和3拉开，1+3=4 放中间=143）。'}]},
 tips:{use:'适用：<b>首尾颠倒的两位数相加</b>。',fms:['和 =（首+尾）× 11','口诀：首尾相加两边拉，两边相加放中间']},
 drills:[
  {q:'56+65',a:121,ex:'56+65\n=(5+6)×11\n=11×11\n=121',hint:'标准形式直接套公式。'},
  {q:'48+84',a:132,ex:'48+84\n=(4+8)×11\n=12×11\n=132',hint:'首尾和是 12。'},
  {q:'35+53',a:88,ex:'35+53\n=(3+5)×11\n=8×11\n=88',hint:'首尾相加仅一位，不能两边拉，连着写两个。'},
  {q:'27+72',a:99,ex:'27+72\n=(2+7)×11\n=9×11\n=99',hint:'9×11=99。'},
  {q:'46+64',a:110,ex:'46+64\n=(4+6)×11\n=10×11\n=110',hint:'首尾相加是 10，0 占个位。'},
  {q:'19+91',a:110,ex:'19+91\n=(1+9)×11\n=110',hint:'又是和为 10。'},
  {q:'468+864',a:1332,star:1,ex:'三位颠倒数(各位和相等):\n首尾相加:4+8=12 两边一拉\n两边再加,中间双插\n=1332',hint:'★变式：三位数！口诀"首尾相加两边一拉，两边再加中间双插"。'},
  {q:'234+432',a:666,star:1,ex:'2+4=6(一位数)\n连着写三个\n=666',hint:'★首尾和是一位数，连写三个。'},
  {q:'507+705',a:1212,star:1,ex:'5+7=12(进位)\n中间有0:连着写两个\n=1212',hint:'★中间有 0：首尾和进位就连写两个。'},
  {q:'806+608',a:1414,star:1,ex:'8+6=14\n连着写两个\n=1414',hint:'★同上一题。'}]},

{id:'s02',ic:'↩️',nm:'第2讲 颠倒数的减法',ds:'72−27？首尾差乘 9',
 ex:{expr:'72-27',num:'首尾颠倒：个位与十位交换位置！',op:'两位数相减求差。',
  feats:['数字首尾颠倒','两位数','相减求差'],methods:['(首−尾)×9','化减为乘'],
  steps:[{t:'72-27'},{t:'=(7-2)×9',n:'首尾差×9',w:'为什么？(7×10+2)-(2×10+7)=(7-2)×10+(2-7)=(7-2)×10-(7-2)=(7-2)×9！'},{t:'=5×9',n:'化减为乘',w:'首尾差是 5。'},{t:'=45',n:'完成',w:'不列竖式不退位！'}]},
 tips:{use:'适用：<b>首尾颠倒的两位数相减</b>；三位数中间相同用 ×99，四位数中间两位相同用 ×999。',fms:['差 =（首−尾）× 9','三位：×99　四位：×999']},
 drills:[
  {q:'73-37',a:36,ex:'73-37\n=(7-3)×9\n=4×9\n=36',hint:'标准形式直接套公式。'},
  {q:'91-19',a:72,ex:'91-19\n=(9-1)×9\n=8×9\n=72',hint:'首尾差 8。'},
  {q:'936-639',a:297,ex:'936-639\n=(9-6)×99\n=3×99\n=297',hint:'三位数中间相同：×99！'},
  {q:'723-327',a:396,ex:'723-327\n=(7-3)×99\n=4×99\n=396',hint:'4×99=396。'},
  {q:'4362-2364',a:1998,ex:'4362-2364\n=(4-2)×999\n=2×999\n=1998',hint:'四位数中间两位相同：×999！'},
  {q:'6251-1256',a:4995,ex:'6251-1256\n=(6-1)×999\n=5×999\n=4995',hint:'5×999=4995。'},
  {q:'73-27',a:46,star:1,ex:'73和27互补(和=100):\n=(73-50)×2\n=23×2\n=46',hint:'★变式：两数相加是 100（互补数）？差=(被减数−50)×2！'},
  {q:'613-387',a:226,star:1,ex:'和=1000 互补:\n=(613-500)×2\n=113×2\n=226',hint:'★三位互补：减 500 再乘 2。'},
  {q:'8043-1957',a:6086,star:1,ex:'和=10000 互补:\n=(8043-5000)×2\n=3043×2\n=6086',hint:'★四位互补：减 5000 再乘 2。'}]},

{id:'s03',ic:'💯',nm:'第3讲 100/1000…的减法',ds:'100−58？前面用9减末位用10减',
 ex:{expr:'100-58',num:'被减数是 100（整百整千数）；减数比它少一位。',op:'相减求差。',
  feats:['被减数是100、1000、10000……','减数的位数比被减数少一位','相减求差'],methods:['前面用9减','末位用10减'],
  steps:[{t:'100-58'},{t:'十位：9-5=4',n:'前面用9减',w:'把 100 看成 9个十+10个一：十位上用 9 去减 5。'},{t:'个位：10-8=2',n:'末位用10减',w:'个位上用 10 去减 8——不用一路借位！'},{t:'=42',n:'完成',w:'口诀：前面用 9 减，末位用 10 减。'}]},
 tips:{use:'适用：<b>被减数是 100、1000、10000……</b>的减法。',fms:['口诀：前面用 9 减，末位用 10 减','减数中间有几个0，差就对着几个9']},
 drills:[
  {q:'100-37',a:63,ex:'十位:9-3=6\n个位:10-7=3\n=63',hint:'直接套口诀。'},

/* =================== 引擎 =================== */
var CUR=null, TS={idx:0,gDone:-1}, Q={};
function guessStep(btn){
 var ok=(btn.textContent===window._gAns);
 if(ok){btn.classList.add('good');ding();}else{btn.classList.add('bad');buzz();}
 document.querySelectorAll('#guessBox .opt').forEach(function(b){b.disabled=true;if(b.textContent===window._gAns)b.classList.add('good');});
 setTimeout(function(){var gb=$('guessBox');if(gb)gb.remove();$('btnStep').classList.remove('hide');nextStep();},ok?500:1100);
}

function unlockedCount(){var d0=new Date(START+'T00:00:00');var days=Math.floor((Date.now()-d0.getTime())/86400000);
 return Math.max(1,Math.min(MODS.length,days+1+UNL_EXTRA));}
function parentUnlock(){if(unlockedCount()>=MODS.length){alert('所有馆都已开放!');return;}UNL_EXTRA++;save(LSK+'_unl',UNL_EXTRA);ding();renderHome();}
function lockMsg(day){buzz();alert('这个馆第 '+day+' 天才开放哦!\n每天学一个馆,学得牢。\n(家长可在「练习记录」里提前解锁)');}

function renderHome(){
 show('vHome');
 var unl=unlockedCount(),g=$('homeGrid'),h='';
 MODS.forEach(function(m,i){
  var open=i<unl, st=modStat(m.id);
  h+='<div class="tile'+(open?'':' lock')+'" onclick="'+(open?('openMod(\''+m.id+'\')'):('lockMsg('+(i+1)+')'))+'">'
   +(i===unl-1&&open?'<span class="today">今日</span>':'')
   +(st?'<span class="done">'+st+'</span>':'')
   +'<div class="ic">'+(open?m.ic:'🔒')+'</div><div class="nm">'+m.nm+'</div><div class="ds">'+m.ds+'</div></div>';
 });
 g.innerHTML=h;
 var done=0;for(var k in DB.done)done++;
 var wrong=0;DB.events.forEach(function(e){if(e.type==='quiz'&&!e.ok)wrong++;});
 $('statBar').innerHTML='<span>已练 '+done+'/'+MODS.length+' 馆</span><span>共答 '+DB.events.filter(function(e){return e.type==='quiz';}).length+' 题</span><span>错 '+wrong+' 题</span>';
 var wl=wbList();
 $('wbEntry').innerHTML=wl.length?'<div class="card" style="border-color:var(--red)"><div class="h2" style="color:var(--red)">📕 错题本（'+wl.length+' 题待掌握）</div><div class="note">错过的题连续答对 2 次才算掌握。</div><button class="btn red wide" onclick="startWrongbook()">🔁 重做错题</button></div>':'';
 $('wbPanel').innerHTML=wl.length?wl.map(function(it){return '<div class="wbitem"><span>'+esc(short(it.q))+'</span><span class="t">错'+it.wrong+'次·连对'+it.streak+'/2</span></div>';}).join(''):'<div class="note">错题本是空的，太棒了！</div>';
 var rh='';
 if(done>0)rh+='<button class="btn ghost wide" onclick="startWarmup()">🔄 今日热身：把学过的再练 5 题</button>';
 if(unl>=4)rh+='<button class="btn gold wide" onclick="startRadar()">📡 选招雷达：一眼认出该用哪招</button>';
 $('reviewEntry').innerHTML=rh?'<div class="card"><div class="h2">🧠 学得牢小工具</div>'+rh+'<div class="note">🔄 热身＝昨天学的今天再见一面，记得更牢；📡 雷达＝先认出「用哪招」再动手，才是真的会。</div></div>':'';
}
function short(s){return s.length>24?s.slice(0,24)+'…':s;}
function esc(s){return String(s).replace(/</g,'&lt;');}
function show(id){['vHome','vTeach','vQuiz','vResult'].forEach(function(v){$(v).classList.toggle('hide',v!==id);});window.scrollTo(0,0);}
function goHome(){if(Q.timer)clearInterval(Q.timer);renderHome();}

/* ---- 教学流程：放大镜 → 分步 → 妙招 ---- */
var mir={n:false,o:false};
function openMod(id){
 CUR=null;MODS.forEach(function(m){if(m.id===id)CUR=m;});
 if(!CUR)return;tick();
 mir={n:false,o:false};TS.idx=0;TS.gDone=-1;
 show('vTeach');
 $('tBadge').textContent=CUR.ic+' '+CUR.nm.replace(/^第\d+讲 /,'');
 $('tTag').textContent='原书·'+CUR.nm.split(' ')[0];
 var html='';
 String(CUR.ex.expr).split(/([0-9.²]+)/).forEach(function(seg){
  if(!seg)return;
  if(/^[0-9.²]+$/.test(seg))html+='<span class="tk num">'+seg+'</span>';
  else html+='<span class="tk op">'+esc(seg)+'</span>';
 });
 $('mExpr').innerHTML=html;
 $('mFeats').innerHTML='';$('mMethods').innerHTML='';$('mMethods').classList.add('hide');
 $('btnToSteps').classList.add('hide');
 $('btnNum').style.opacity=1;$('btnOp').style.opacity=1;
 $('cardSteps').classList.add('hide');$('cardTips').classList.add('hide');
 $('stepRows').innerHTML='';$('btnStep').classList.remove('hide');$('btnStep').textContent='▶ 下一步';
}
function revealNum(){if(mir.n)return;mir.n=true;tick();
 document.querySelectorAll('#mExpr .tk.num').forEach(function(el){el.classList.add('hn');});
 $('mFeats').innerHTML+='<div class="feat">🔢 数字特点：'+CUR.ex.num+'</div>';
 $('btnNum').style.opacity=.4;mirDone();}
function revealOp(){if(mir.o)return;mir.o=true;tick();
 document.querySelectorAll('#mExpr .tk.op').forEach(function(el){el.classList.add('ho');});
 $('mFeats').innerHTML+='<div class="feat blue">➗ 算法特点：'+CUR.ex.op+'</div>';
 $('btnOp').style.opacity=.4;mirDone();}
function mirDone(){
 if(!(mir.n&&mir.o))return;
 var h='<div class="note" style="margin-top:8px">✅ 题干特点：'+CUR.ex.feats.map(function(f,i){return (i+1)+'.'+f;}).join('　')+'</div><div style="margin-top:4px">'
  +CUR.ex.methods.map(function(m){return '<span class="mchip">🏷️ '+m+'</span>';}).join('')+'</div>';
 $('mMethods').innerHTML=h;$('mMethods').classList.remove('hide');
 $('btnToSteps').classList.remove('hide');ding();
}
function showSteps(){$('cardSteps').classList.remove('hide');$('btnToSteps').classList.add('hide');nextStep();
 $('cardSteps').scrollIntoView({behavior:'smooth'});}
function nextStep(){
 var steps=CUR.ex.steps;
 if(TS.idx>=steps.length)return;
 var s=steps[TS.idx];
 if(s.n&&TS.idx>=1&&TS.idx<steps.length-1&&TS.gDone!==TS.idx){
  TS.gDone=TS.idx;
  var pool=['从左往右硬算','列竖式慢慢算','先算最大的数'];
  MODS.forEach(function(m){m.ex.steps.forEach(function(x){if(x.n&&x.n!==s.n&&pool.indexOf(x.n)<0)pool.push(x.n);});});
  var dtr=pool[Math.floor(Math.random()*pool.length)];if(dtr===s.n)dtr=pool[0];
  var go=Math.random()<0.5?[s.n,dtr]:[dtr,s.n];
  window._gAns=s.n;
  $('btnStep').classList.add('hide');
  var box=document.createElement('div');box.id='guessBox';
  box.innerHTML='<div class="hint">🤔 猜一猜：下一步该用哪一招？</div>'+go.map(function(o){return '<button class="opt" onclick="guessStep(this)">'+esc(o)+'</button>';}).join('');
  $('stepRows').appendChild(box);box.scrollIntoView({behavior:'smooth',block:'center'});
  return;
 }
 tick();
 document.querySelectorAll('#stepRows .srow').forEach(function(el){el.classList.remove('cur');});
 var row=document.createElement('div');row.className='srow cur';
 row.innerHTML='<div class="math">'+esc(s.t)+'</div>'+(s.n?'<div class="snote">'+s.n+'</div>':'');
 $('stepRows').appendChild(row);
 if(s.w){var wd=document.createElement('div');wd.className='swhy';wd.innerHTML='🤔 为什么：'+s.w;$('stepRows').appendChild(wd);}
 TS.idx++;
 if(TS.idx>=steps.length){
  $('btnStep').classList.add('hide');ding();
  var f=document.createElement('div');f.className='fin';f.textContent='🎉 变身完成！这就是巧算的思路';$('stepRows').appendChild(f);
  $('cardTips').classList.remove('hide');
  $('tipUse').innerHTML=CUR.tips.use;
  $('tipFms').innerHTML=CUR.tips.fms.map(function(x){return '<div class="fmla">'+x+'</div>';}).join('');
 }else{
  $('btnStep').textContent='▶ 下一步（'+TS.idx+'/'+steps.length+'）';
 }
 row.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---- 训练 ---- */
function fmt(n){return (Math.round(Number(n)*10000)/10000).toString();}
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function genOpts(a){
 var x=Number(a),pool=[];
 function push(v){v=Math.round(v*10000)/10000;if(v!==x&&pool.indexOf(v)<0&&v>=0)pool.push(v);}
 if(x===0){push(10);push(2);push(1);}
 else{
  push(x+(x>=1000?100:x>=100?100:x>=10?10:1));
  push(x-(x>=1000?90:x>=100?90:x>=10?9:0.9));
  push(x*10);push(x>=1?Math.round(x/10*10000)/10000:x*100);push(x+(x>=10?1:0.1));
 }
 return shuffle([x].concat(pool.slice(0,3)));
}
function qStart(modId){
 var m=null;MODS.forEach(function(x){if(x.id===modId)m=x;});
 Q={list:m.drills.slice(),i:0,t0:Date.now(),sess0:Date.now(),mod:modId,nm:m.nm,ok:0,wrong:0,timer:null,isWb:false,wrongs:[]};
 show('vQuiz');qRender();
 Q.timer=setInterval(function(){var el=$('qTime');if(el){var s=Math.floor((Date.now()-Q.sess0)/1000);el.textContent='⏱ '+Math.floor(s/60)+':'+('0'+s%60).slice(-2);}},500);
}
function startWrongbook(){
 var wl=wbList();if(!wl.length)return;
 Q={list:wl.map(function(it){return {q:it.q,a:it.a,ex:it.ex,hint:it.hint,wb:1,word:it.q.length>16?1:0};}),i:0,t0:Date.now(),sess0:Date.now(),mod:'wrongbook',nm:'错题本重做',ok:0,wrong:0,timer:null,isWb:true,wrongs:[]};
 show('vQuiz');qRender();
 Q.timer=setInterval(function(){var el=$('qTime');if(el){var s=Math.floor((Date.now()-Q.sess0)/1000);el.textContent='⏱ '+Math.floor(s/60)+':'+('0'+s%60).slice(-2);}},500);
}
function quitQuiz(){if(Q.timer)clearInterval(Q.timer);if(Q.isWb||Q.warm)renderHome();else openMod(Q.mod);}
function qRender(){
 var d=Q.list[Q.i];Q.t0=Date.now();
 $('qProg').innerHTML=(Q.isWb?'📕 错题本 ':'')+(Q.i+1)+' / '+Q.list.length+(d.star?'　<span class="star">★举一反三</span>':'')+(d.rq?'　<span class="star">🔁再战</span>':'');
 $('qScore').textContent='✅'+Q.ok+' ❌'+Q.wrong;
 var gh=d.hint?'<div class="hint">'+esc(d.hint)+'</div>':'';
 if(Q.i===0&&!Q.isWb&&!Q.warm&&!d.rq&&!d.sopts){
  var gl=d.ex.split('\n');
  if(gl.length>2){gl.pop();gh+='<div class="steps"><span class="lb">🧭 第一题扶你走：思路都摆好了，最后一步你来算！</span>'+gl.map(esc).join('<br>')+'</div>';}
 }
 $('qHint').innerHTML=gh;
 $('qText').className='qtext'+(d.word?' word':'');
 $('qText').textContent=d.q;
 $('qText').style.whiteSpace='pre-line';
 if(d.sopts){
  var hs='';d.sopts.forEach(function(o,i){hs+='<button class="opt" onclick="qAnsS(this,'+i+')">'+esc(o)+'</button>';});
  $('qOpts').innerHTML=hs;
 }else{
  var opts=d.wo?shuffle([Number(d.a)].concat(d.wo)):genOpts(d.a),h='';
  opts.forEach(function(o){h+='<button class="opt" onclick="qAns(this,'+o+')">'+fmt(o)+'</button>';});
  $('qOpts').innerHTML=h;
 }
 $('qEx').innerHTML='';$('btnNext').classList.add('hide');
}
function qAns(btn,val){
 var d=Q.list[Q.i],ok=(Math.abs(val-Number(d.a))<1e-9),ms=Date.now()-Q.t0;
 document.querySelectorAll('#qOpts .opt').forEach(function(b){b.disabled=true;
  if(Math.abs(Number(b.textContent)-Number(d.a))<1e-9)b.classList.add('good');});
 if(ok){btn.classList.add('good');Q.ok++;ding();if(Q.isWb||d.wb)wbAddRight(d.q);}
 else{btn.classList.add('bad');Q.wrong++;buzz();wbAddWrong(d);Q.wrongs.push(d);if(!d.rq){var c={};for(var k in d)c[k]=d[k];c.rq=1;Q.list.push(c);}}
 if(!Q.isWb)logEvent({type:'quiz',subject:'数学',lesson:Q.nm,word:d.q,hint:d.hint||'',ok:ok,ms:ms,user:String(val),tag:d.star?'举一反三':'即时训练'});
 var lines=d.ex.split('\n');
 $('qEx').innerHTML='<div class="steps"><span class="lb">'+(ok?'✅ 对啦！再看一遍书上的分步：':'❌ 别急，跟着书上的思路走一遍：')+'</span>'
  +lines.map(function(l,i){return i===lines.length-1?'<span class="last">'+esc(l)+'</span>':esc(l);}).join('<br>')+'</div>';
 $('btnNext').classList.remove('hide');
 $('qScore').textContent='✅'+Q.ok+' ❌'+Q.wrong;
}
function qNext(){
 Q.i++;
 if(Q.i>=Q.list.length){qFinish();return;}
 qRender();window.scrollTo(0,0);
}
function qFinish(){
 if(Q.timer)clearInterval(Q.timer);
 var sec=Math.floor((Date.now()-Q.sess0)/1000);
 if(!Q.isWb&&!Q.warm){
  DB.done[Q.mod]={ok:Q.ok,wrong:Q.wrong,ts:Date.now()};save(LSK,DB);
  logEvent({type:'lesson',subject:'数学',lesson:Q.nm,total:Q.list.length,wrong:Q.wrong,durationSec:sec});
 }
 show('vResult');
 var h='<div class="h2">'+(Q.isWb?'📕 错题重做完成':'🏁 '+Q.nm+' 完成!')+'</div>'
  +'<div class="stat"><span>✅ 对 '+Q.ok+'</span><span>❌ 错 '+Q.wrong+'</span><span>⏱ '+Math.floor(sec/60)+'分'+(sec%60)+'秒</span></div>';
 if(Q.wrongs.length){
  h+='<div class="h2" style="margin-top:12px">错题回顾（看懂再走）</div>';
  Q.wrongs.forEach(function(d){
   h+='<div class="note" style="font-weight:800;color:var(--red)">✗ '+esc(d.q)+'</div><div class="steps">'+d.ex.split('\n').map(esc).join('<br>')+'</div>';
  });
  h+='<div class="note">这些题已进错题本，连续答对 2 次才能出来哦。</div>';
 }else{
  h+='<div class="fin">🌟 全对！太厉害了！</div>';
 }
 if(!Q.isWb&&!Q.warm&&Q.wrong>0)h+='<button class="btn gold wide" onclick="qStart(Q.mod)">🔁 再练一次，冲 ⭐⭐⭐ 满星</button>';
 h+='<button class="btn wide" onclick="goHome()">回选馆地图</button>';
 $('resCard').innerHTML=h;
}

function qAnsS(btn,idx){
 var d=Q.list[Q.i],ok=(d.sopts[idx]===d.a),ms=Date.now()-Q.t0;
 document.querySelectorAll('#qOpts .opt').forEach(function(b){b.disabled=true;if(b.textContent===d.a)b.classList.add('good');});
 if(ok){Q.ok++;ding();}
 else{btn.classList.add('bad');Q.wrong++;buzz();Q.wrongs.push(d);if(!d.rq){var c={};for(var k in d)c[k]=d[k];c.rq=1;Q.list.push(c);}}
 logEvent({type:'quiz',subject:'数学',lesson:Q.nm,word:d.q,hint:d.hint||'',ok:ok,ms:ms,user:d.sopts[idx],tag:'选招雷达'});
 var lines=d.ex.split('\n');
 $('qEx').innerHTML='<div class="steps"><span class="lb">'+(ok?'✅ 认对了！看看这招怎么打：':'❌ 认错招了！先看题目特点：')+'</span>'+lines.map(function(l,i){return i===lines.length-1?'<span class="last">'+esc(l)+'</span>':esc(l);}).join('<br>')+'</div>';
 $('btnNext').classList.remove('hide');
 $('qScore').textContent='✅'+Q.ok+' ❌'+Q.wrong;
}
function modName(m){return m.nm.replace(/^第\d+讲 /,'').replace(/^专项 /,'');}
function startWarmup(){
 var pool=[];
 MODS.forEach(function(m){if(DB.done[m.id])m.drills.forEach(function(dd){pool.push(dd);});});
 if(!pool.length){alert('先练完至少一个馆，再来热身！');return;}
 var picks=wbList().slice(0,2).map(function(it){return {q:it.q,a:it.a,ex:it.ex,hint:it.hint,wb:1};});
 var guard=0;
 while(picks.length<5&&guard<80){guard++;var dd=pool[Math.floor(Math.random()*pool.length)];var dup=false;picks.forEach(function(p){if(p.q===dd.q)dup=true;});if(!dup)picks.push(dd);}
 Q={list:shuffle(picks),i:0,t0:Date.now(),sess0:Date.now(),mod:'warmup',nm:'今日热身',ok:0,wrong:0,timer:null,isWb:false,warm:true,wrongs:[]};
 show('vQuiz');qRender();
 Q.timer=setInterval(function(){var el=$('qTime');if(el){var s=Math.floor((Date.now()-Q.sess0)/1000);el.textContent='⏱ '+Math.floor(s/60)+':'+('0'+s%60).slice(-2);}},500);
}
function startRadar(){
 var unl=unlockedCount();
 if(unl<4){alert('再解锁几个馆，雷达的招式才够多！');return;}
 var list=[];
 MODS.slice(0,unl).forEach(function(m){
  var dd=m.drills[Math.floor(Math.random()*m.drills.length)];
  var name=modName(m),others=[];
  MODS.slice(0,unl).forEach(function(x){if(x.id!==m.id)others.push(modName(x));});
  shuffle(others);
  list.push({q:'这道题该用哪一招？\n'+dd.q,sopts:shuffle([name].concat(others.slice(0,3))),a:name,
   ex:'招式：'+name+'\n题目特点：'+m.ex.feats.join('；')+'\n'+dd.ex,hint:'先用放大镜看：数字有什么特点？算法有什么特点？'});
 });
 list=shuffle(list).slice(0,8);
 Q={list:list,i:0,t0:Date.now(),sess0:Date.now(),mod:'radar',nm:'选招雷达',ok:0,wrong:0,timer:null,isWb:false,warm:true,wrongs:[]};
 show('vQuiz');qRender();
 Q.timer=setInterval(function(){var el=$('qTime');if(el){var s=Math.floor((Date.now()-Q.sess0)/1000);el.textContent='⏱ '+Math.floor(s/60)+':'+('0'+s%60).slice(-2);}},500);
}

/* ---- 导出（兼容 data/learning 归档格式） ---- */
function exportText(){
 var wl=wbList();
 var t='【Eddey 计算技法大通关(技巧篇速算10馆) 练习记录】\n导出时间:'+new Date().toLocaleString()+'\n\n';
 t+='== 各馆成绩 ==\n';
 MODS.forEach(function(m){var d=DB.done[m.id];if(d)t+=m.nm+': ✅'+d.ok+' ❌'+d.wrong+'\n';});
 t+='\n== 错题本(未掌握 '+wl.length+' 题) ==\n';
 wl.forEach(function(it){t+='· '+it.q+'（错'+it.wrong+'次,连对'+it.streak+'/2）\n';});
 var cnt={};DB.events.forEach(function(e){if(e.type==='quiz'&&!e.ok)cnt[e.word]=(cnt[e.word]||0)+1;});
 var rep=Object.keys(cnt).filter(function(k){return cnt[k]>=2;});
 t+='\n== 反复错的题(错≥2次) ==\n'+(rep.length?rep.map(function(k){return '· '+k+' ×'+cnt[k];}).join('\n'):'(无)')+'\n';
 t+='\n== 原始JSON ==\n'+JSON.stringify({child:'弟弟',subject:'数学',app:'calc_skills_eddey_v1',events:DB.events,wrongbook:wl});
 return t;
}
function exportCopy(){var t=exportText();
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert('已复制!把内容发给爸爸即可');},function(){fallbackCopy(t);});}
 else fallbackCopy(t);}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('已复制!');}catch(e){alert('复制失败,请用「看一眼」手动复制');}document.body.removeChild(ta);}
function exportFile(){var b=new Blob([exportText()],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='eddey_技巧篇速算记录_'+new Date().toISOString().slice(0,10)+'.txt';a.click();}
function toggleExp(){var box=$('expBox');box.classList.toggle('hide');if(!box.classList.contains('hide'))$('expTa').value=exportText();}

$('muteBtn').textContent=MUTE?'🔕':'🔔';
renderHome();
</script>
