function tiles(text,active=-1,end=false,capacity=0){const cs=[...text];if(end)cs.push('\0');while(cs.length<capacity)cs.push('\0');return '<div class="tiles">'+cs.map((c,i)=>'<span class="tile '+(i===active?'active ':'')+(c==='\0'?'end':'')+'"><b>'+esc(c==='\0'?'\\0':c==='\n'?'\\n':c===' '?'␣':c)+'</b><small>'+i+'</small></span>').join('')+'</div>';}

function sampleButtons(arr){return '<div class="row sample-row">'+arr.map((x,i)=>'<button data-sample="'+i+'" aria-pressed="'+(model.sample===i)+'">'+esc(x===''?'空串':x===' '?'空格':x)+'</button>').join('')+'</div>';}
function sourceInput(method,raw,cap=10){if(method==='cin'){const skip=raw.match(/^\s*/)[0].length;const t=raw.slice(skip).match(/^\S*/)[0];return{value:t,rest:raw.slice(skip+t.length)}}if(method==='getline'){const n=raw.indexOf('\n');return{value:n<0?raw:raw.slice(0,n),rest:n<0?'':raw.slice(n+1)}}const n=raw.indexOf('\n');const count=Math.min(cap-1,n<0?raw.length:n+1);return{value:raw.slice(0,count),rest:raw.slice(count)}}
function replaceOne(c,broken){const m={'+':'-','-':'+','*':'/','/':'*'};if(!broken)return m[c]||c;let x=c;if(x==='+')x='-';if(x==='-')x='+';if(x==='*')x='/';if(x==='/')x='*';return x;}

function bindModel(){document.querySelectorAll('[data-sample]').forEach(b=>b.onclick=()=>{model.sample=Number(b.dataset.sample);model.step=0;save();render();});for(const [id,key] of [['readMethod','method'],['stringKind','kind'],['stringOp','op'],['shift','shift']])if($(id))$(id).onchange=e=>{model[key]=e.target.value;model.step=0;save();render();};if($('modelStep'))$('modelStep').onclick=()=>{model.step=Math.min(8,model.step+1);record('model_step',{step:model.step});render();};if($('modelBack'))$('modelBack').onclick=()=>{model.step=Math.max(0,model.step-1);save();render();};if($('modelReset'))$('modelReset').onclick=()=>{model.step=0;save();render();};if($('toggleBroken'))$('toggleBroken').onclick=()=>{model.broken=!model.broken;model.step=0;save();render();};}
function currentQ(){return state.phase==='transfer'?UNITS[state.unit].transfer:UNITS[state.unit].checks[state.q]}
function normalizeCode(x){return String(x).replace(/\s+/g,'').replace(/;$/,'')}
function correct(q,answer){if(q.id==='f1')return ['s.size()','s.length()','(int)s.size()','(int)s.length()'].includes(normalizeCode(answer));if(q.id==='f3')return ['S+=s[i]','S=S+s[i]','S.push_back(s[i])'].includes(normalizeCode(answer));if(q.id==='f4')return ['S==s','s==S','(S==s)','(s==S)'].includes(normalizeCode(answer));return String(answer).trim()===q.answer;}

function answer(value){const q=currentQ(),old=state.answers[q.id]||{tries:0,first:null,reveal:false,hinted:false,history:[]};if(old.passed)return;const ok=correct(q,value);old.tries++;old.history.push({value,ok,at:new Date().toISOString()});if(old.first===null)old.first=ok;old.passed=ok;old.independent=ok&&old.tries===1&&!old.reveal&&!old.hinted;old.reviewNeeded=!old.independent;state.answers[q.id]=old;state.drafts[q.id]=value;record('answer',{question:q.id,ok,independent:old.independent});if(!ok){old.hinted=true;if(old.tries>=2){old.reveal=true;render();}else{state.returnPhase=state.phase;state.phase='repair';save();render();}}else{save();render();}}

else if(state.phase==='repair'){html='<section data-phase="repair">'+repairHTML()+'</section>';$('nextBtn').hidden=true;}
else if(state.phase==='done'){const qs=[...u.checks,u.transfer],count=qs.filter(q=>state.answers[q.id]?.independent).length;html='<span class="tag">这一段已收好</span><section class="stage">'+tiles(u.id==='palindrome'?'level':'done')+'<div class="result">'+count+' / '+qs.length+' 项首次独立答对。<br>用过提示的题，保留为待复习。</div></section><p>能看懂一步，再把它写进程序。</p>'+(state.unit===6?'<button id="codingTask" class="primary">最后：自己写一个程序</button>':'')+'<button id="reviewUnit" class="plain toolbar">回看这一段</button>';$('nextBtn').textContent=state.unit<6?'下一段':'查看学习记录';$('nextBtn').onclick=()=>state.unit<6?startUnit(state.unit+1):openParent();}
$('screen').innerHTML=html;bindModel();if($('diagnoseBtn'))$('diagnoseBtn').onclick=()=>{state.q=0;go('independent')};if($('dailyBtn'))$('dailyBtn').onclick=()=>{$('dailyAnswer').hidden=!$('dailyAnswer').hidden;$('dailyBtn').setAttribute('aria-expanded',String(!$('dailyAnswer').hidden))};if($('flipBtn'))$('flipBtn').onclick=()=>{$('recallText').hidden=!$('recallText').hidden;$('flipBtn').setAttribute('aria-expanded',String(!$('recallText').hidden))};if($('answerForm')){$('answerForm').onsubmit=e=>{e.preventDefault();answer($('answerInput').value)};$('answerInput').oninput=e=>{state.drafts[currentQ().id]=e.target.value;save()};}document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));if($('showHelp'))$('showHelp').onclick=()=>{const q=currentQ();state.answers[q.id]||={tries:0,first:null,history:[]};state.answers[q.id].hinted=true;state.returnPhase=state.phase;go('repair')};if($('returnQuestion'))$('returnQuestion').onclick=()=>go(state.returnPhase||'independent');if($('continueReview'))$('continueReview').onclick=advanceQuestion;if($('reviewUnit'))$('reviewUnit').onclick=()=>go('teach');if($('codingTask'))$('codingTask').onclick=()=>{openParent();$('finalTask').open=true};save();}

function openMenu(){paused=true;$('routes').innerHTML=UNITS.map((u,i)=>'<button data-unit="'+i+'"><b>'+String(i+1).padStart(2,'0')+'</b><span>'+u.title+'<small>'+u.short+'</small></span><small>'+(state.done.includes(i)?'已走过':'约3—5分')+'</small></button>').join('');document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{$('menu').close();paused=false;startUnit(Number(b.dataset.unit))});$('menu').showModal()}
const finalCode='#include <iostream>\n#include <string>\nusing namespace std;\nint main() {\n    string s;\n    getline(cin, s);\n    int letters=0, digits=0;\n    for (int i=0; i<(int)s.size(); i++) {\n        char c=s[i];\n        if ((c>=\'A\' && c<=\'Z\') || (c>=\'a\' && c<=\'z\')) letters++;\n        else if (c>=\'0\' && c<=\'9\') digits++;\n    }\n    cout << letters << " " << digits;\n    return 0;\n}';
function openParent(){paused=true;const rows=UNITS.map(u=>{const qs=[...u.checks,u.transfer],a=qs.map(q=>state.answers[q.id]);return '<tr><td>'+u.title+'</td><td>'+a.filter(x=>x?.independent).length+'/'+qs.length+'</td><td>'+a.filter(x=>x?.reviewNeeded).length+'</td></tr>'}).join('');$('parentContent').innerHTML='<p><span class="status">仅弟弟 Eddey</span> <span class="status">'+(IS_TEST?'验收记录':'本机学习记录')+'</span></p><p>进度定位：循环和一维数组之后，进入第04课字符数组与字符串、第05课字符串应用。第05课图片屏幕日期为2026-10-25；不据此推断出勤或独立掌握。</p><p>来源：家长2026-10-29提供的教师反馈与7张材料。第04课日期未知，课堂反馈“熟练掌握”按教师概括保留，本页用独立题另验。</p><table><thead><tr><th>知识段</th><th>首次独立</th><th>待复习</th></tr></thead><tbody>'+rows+'</tbody></table><p class="tiny">口述翻卡、演示完成不计掌握；同题订正不计首次独立。用时 '+Math.floor(state.elapsed/60)+' 分钟。原答案仅保存在本机及手动导出文件。</p><details><summary>课堂材料与补充校准</summary><p>20557：回文组合题；20558：特殊符号互换；20559：string/char[]对照；20560：四个cstring函数；20561/20563：cin和fgets；20562：第04课知识脑图。</p><p>char数组本身不需要cstring头文件，strlen/strcpy/strcat/strcmp才需&lt;cstring&gt;；string用&lt;string&gt;，fgets用&lt;cstdio&gt;。char a[10]={\'h\',\'e\',\'l\',\'l\',\'o\'}剩余元素补零；char a[5]={这5个字母}没有结束符，不能直接strlen。</p><p>strcmp返回负/零/正；if(strcmp(a,b))表示不相等，不能代表大于。拼接、复制前必须有足够的目标空间。比较按字符顺序，不按长度或数字大小。</p><p>cin后接getline可能读到残留换行，应按输入约定先处理；本课三个读取器分别从同一份新输入开始演示。fgets可能保留换行，也可能因容量满而读不完整。</p><p>正序遍历用 i&lt;(int)s.size()。倒序先把本课短字符串长度转为int，避免空串时无符号size()-1绕回大数。这里只处理ASCII，中文UTF-8字节数不等于汉字个数。</p><p>第7段“移3位并回绕”为自编拓展，不声称是老师给出的完整加密算法。</p></details><details id="finalTask"><summary>最后：自己写、编译、运行</summary><p>打开本人已使用的 ACGO Playground 或 Dev-C++。写一个程序：读取一整行，统计英文字母与数字字符个数，输出两个数，用一个空格隔开；空格和其他符号不计。输入保证为不超过100个ASCII字符。</p><p>测试1：A7 b2! → 2 2；测试2：hello → 5 0；测试3：123 → 0 3；测试4：空行 → 0 0。</p><p class="tiny">先独立写，再展开参考。网页演示不是C++编译器；运行结果请保留截图或代码，供后续核验。</p><details><summary>完整参考程序</summary>'+code(finalCode)+'</details></details><details><summary>原回文题完整参考</summary>'+code('#include <iostream>\n#include <string>\nusing namespace std;\nint main(){\n    string s, S;\n    cin >> s;\n    int len = (int)s.size();\n    for(int i=len-1; i>=0; i--) S += s[i];\n    if(S==s) cout << "Yes";\n    else cout << "No";\n    return 0;\n}')+'</details><details><summary>技术校准来源</summary><p><a href="https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/fgets-fgetws?view=msvc-170" target="_blank" rel="noopener">Microsoft：fgets</a> · <a href="https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/strcmp-wcscmp-mbscmp?view=msvc-170" target="_blank" rel="noopener">Microsoft：strcmp</a> · <a href="https://learn.microsoft.com/en-us/cpp/standard-library/basic-string-class?view=msvc-170" target="_blank" rel="noopener">Microsoft：string</a></p></details>';$('syncStatus').textContent=IS_TEST?'当前为测试隔离状态，不会发送。':'仅在点击“完成并同步”后发送匿名化结果，不发送自由输入原文。';$('parent').showModal()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=APP_ID+(IS_TEST?'-test':'')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

$('importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>2000000)throw Error('文件过大');const x=JSON.parse(await f.text());if(!validImport(x))throw Error('孩子、课程、模式或格式不匹配');state=x;model=Object.assign({step:0,sample:0,method:'cin',op:'length',kind:'string',broken:false,shift:3},x.model||{});save();$('parent').close();paused=false;render()}catch(err){$('syncStatus').textContent='未导入：'+err.message}e.target.value=''};
