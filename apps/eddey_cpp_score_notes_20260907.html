(()=>{
const qaParams=new URLSearchParams(location.search);

}
const LESSON_BLUEPRINT={appId:'eddey_cpp_score_notes_20260907',child:'eddey',source:'2026年3月C++一级：取位、双螺旋数、循环累乘；公开匿名知识版，近远迁移为自编',courseDate:'2026-09-07',currentGap:'区分取末位与改变量，区分最后执行与退出值',observableOutcome:'记关键规则，重做两道原题，短输入检验迁移；练习提交动作',essentialQuestion:'电脑这一步读了哪个值，又改了哪个值？',coreInsight:'表达式算出值，赋值才改盒子；条件决定当前一步是否执行。',realMeaning:'检查拆位、循环与输出，减少代码阅读丢分。',compressionPath:'抄三句规则→亲手执行→原题→迁移；已会者直接验证。',visibleMechanism:'执行指针、末位数字、N与两组和同时变化；循环退出才出现输出。',transferProof:'132交替分组是近迁移，反转120的一步是结构迁移，原题通过不等于整卷能力。',knowledgeMechanism:'同一代码台按真实顺序改变变量和输出',primaryInteraction:'点下一步执行，先预测再查看变量',childAnswerContract:'child-first-v1',childFirstLayerLimit:100,escapePolicy:'repair-once-then-reveal-and-continue',maxBlockingAttempts:2,masteryBoundary:'首答正确、修复后正确、看答案、口述待复核分开；不推算考试分数',audio:'not-applicable',surprise:'数字离开N并进入不同的和；最后输出与循环内部区分',surpriseTrigger:'孩子按下一步触发实际状态变化',phases:['teach','guided','recall','independent','repair','transfer']};
const APP_ID=LESSON_BLUEPRINT.appId, CHILD='eddey', VERSION=1;
const testQuery=new URLSearchParams(location.search).get('test')==='1';
const KEY='dd:eddey:'+APP_ID+':v1'+(testQuery?':test':'');
const DAILY_SURPRISES=['检查清单：读值、改值、看输出。','先把关键句记好，再用一道题检查。','今天的提醒：运行过，还要确认提交结果。'];
const day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date());
const dailySurpriseKey=APP_ID+'|'+CHILD+'|'+day;
document.getElementById('daily').textContent=DAILY_SURPRISES[Array.from(dailySurpriseKey).reduce((n,c)=>n+c.charCodeAt(0),0)%DAILY_SURPRISES.length];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOTES=[
['取位与删位','正整数：N % 10 取个位；N / 10 算出去掉个位后的值；N /= 10 才把新值存回 N。','N=12375：N%10 是5；N/10 是1237；只计算不会改N。'],
['交替分组','先取位加进一组，再删位；下一位加进另一组。奇偶位置不是数字本身的奇偶。','N1 += N%10; N /= 10;\nN2 += N%10; N /= 10;'],
['循环结束','for：检查条件 → 执行循环体 → 更新 → 再检查。正常退出时保留检查失败的值。','i=4 做完后 i++ 成5；5<5不成立，退出时 i=5。'],
['取余条件','% 求余数。if 中0为假，非0为真。i%3==1只接收余1；i%3接收余1和余2。','i=2：i%3==1 为假；i%3 为真。两种条件不等价。'],
['边界和分号','在正整数正常范围，i<N+1 与 i<=N 包含同一整数边界；i<N 不含N。for末尾的分号可能是空循环体。','for(i=1;i<N+1;i++);\ntotal+=i; // 累加在循环外，只做一次'],
['输出与赋值','屏幕只显示输出语句执行时的值。= 是赋值，== 才是判断相等。逗号不代表成对赋值。','a=4;b=4; a,b=3,4; // 最后a=4，b=3\nprintf("%-5d",314); // 314后补2个空格，负号表示左对齐'],
['整除与倒序','判断整除用%除数==0。倒序：new_number=new_number*10+n%10；然后n/=10。','N/1000取高三位；N%1000取低三位。差是不是314倍数，要看差%314==0。'],
['身高题程序','先读入；所有人都和同一个目标比距离；保留最佳身高和距离；距离相同选更矮；输出身高。','距离：h>=target ? h-target : target-h。\n编程得分不能按“写了几行”估算，要运行、提交并看评测。'],
['提交不漏','保存代码 → 编译运行 → 对照样例和边界 → 提交测评 → 查看提交记录与参考得分。全部答完才交卷。','运行成功 ≠ 已提交。修改后再提交，检查最后一次记录。']
];
const ORIGINAL_DIGIT='int i,N,N1=0,N2=0,N0;\ncin>>N; N0=N;\nwhile(N){ ____; ____; }\nif(N1==N2) cout<<N0<<"是双螺旋数"<<endl;';
const ORIGINAL_LOOP='int i, tnt=1;\nfor(i=0; i<5; i++)\n    tnt *= i;\nprintf("%2d%2d\\n", tnt, i);';
const QUESTIONS=[
{id:'digit-recall',topic:'取位与删位',phase:'recall',prompt:'不看笔记：N=12375。N%10 和 N/10 的结果依次是多少？',code:'int N=12375;\n// 这里只求值，没有给N重新赋值。',answer:'5 1237',kind:'numbers',why:'%10拿个位；整数除以10得到前面几位。'},
{id:'digit-original',topic:'交替分组',phase:'independent',prompt:'原题：N是正整数。奇数位置的数字和等于偶数位置的数字和，称双螺旋数。12375两组和都是9。两处空白选哪组？',code:ORIGINAL_DIGIT,choices:['N1+=N%10,N/=10;\nN2+=N%10,N/=10;','N1+=N/10,N/=10;\nN2+=N/10,N/=10;','N1+=N%10,N%=10;\nN2+=N%10,N%=10;','N1+=N/10,N%=10;\nN2+=N/10,N%=10;'],answer:'A',kind:'choice',why:'每次先用%10拿一位，再用/=10删这一位。两组轮流收数字。'},
{id:'digit-near',topic:'交替分组',phase:'transfer',prompt:'换数检验：输入132。按原题从右到左交替分组，N1和N2最后各是多少？',code:ORIGINAL_DIGIT.replace('____; ____;','N1+=N%10,N/=10; N2+=N%10,N/=10;'),answer:'3 3',kind:'numbers',why:'第一组2+1=3，第二组3；补取的0不改变和。'},
{id:'digit-far',topic:'倒序更新',phase:'transfer',prompt:'换用途：已经取完120的个位0。现在n=12、new_number=0，再执行下面两行后，两者依次是多少？',code:'new_number=new_number*10+n%10;\nn/=10;\n// 回答顺序：new_number，n',answer:'2 1',kind:'numbers',why:'末位2放入新数：0*10+2=2；原数12删个位变1。'},
{id:'digit-code',topic:'自己写两行',phase:'transfer',prompt:'给第一组N1加上N的个位，然后删掉N的个位。写出两条C++语句（检查大小写和分号）。',code:'// 变量N、N1已经声明。\n// 只写：累加个位、更新N。',answer:'N1 += N % 10;\nN /= 10;',kind:'code',why:'先加N%10，再把N/10存回N。代码检查只覆盖这两条语句，不是完整程序评测。'},
{id:'loop-original',topic:'循环终值与累乘',phase:'independent',prompt:'原题：最后输出的tnt、i这两个数依次是多少？此处只填数值，格式在笔记中核对。',code:ORIGINAL_LOOP,answer:'0 5',kind:'numbers',why:'第一次乘0，乘积保持0；i=4后仍要++到5。printf在循环外。'},
{id:'loop-transfer',topic:'循环终值',phase:'transfer',prompt:'换数检验：循环结束后s、i各是多少？',code:'int i,s=0;\nfor(i=0;i<4;i++) s+=i;\ncout<<s<<" "<<i;',answer:'6 4',kind:'numbers',why:'s=0+1+2+3=6；i更新到4后检查失败，输出6 4。'}
];
function fresh(){return {appId:APP_ID,child:CHILD,version:VERSION,screen:'home',q:0,notes:{},drafts:{},tries:{},assisted:{},history:[],done:{},started:new Date().toISOString(),activeSeconds:0,submission:{stage:0},syncDone:false};}
let state=fresh();try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.appId===APP_ID&&v.child===CHILD&&v.version===VERSION&&Array.isArray(v.history)&&v.notes&&v.drafts&&v.tries&&v.assisted&&v.done){state={...state,...v};if(!['home','note','model','quiz','repair','finish','notebook','records','submission'].includes(state.screen))state.screen='home';if(!Number.isInteger(state.q)||state.q<0||state.q>=QUESTIONS.length)state.q=0;}}catch(e){}
let model={N:12375,N1:0,N2:0,step:0,turn:0,i:0,tnt:1,phase:0,ended:false,last:'先检查 while(N)。'},modelType='digits';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){$('notice').textContent='本机保存失败，请在记录页下载本次记录。';}}
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const v=JSON.parse(e.newValue);if(v.appId===APP_ID&&v.child===CHILD&&v.version===VERSION&&Array.isArray(v.history)&&v.notes&&v.drafts&&v.tries&&v.assisted&&v.done){state=v;render();}}catch(err){}});
setInterval(()=>{if(!document.hidden&&['note','model','quiz','repair','submission'].includes(state.screen)){state.activeSeconds+=5;save();}},5000);
function go(screen){state.screen=screen;save();render();window.scrollTo({top:0,behavior:'auto'});}
function btn(text,action,cls=''){return '<button type="button" class="'+cls+'" data-action="'+action+'">'+text+'</button>';}
function home(){return '<section class="screen"><span class="badge">先记关键句，再检验</span><h1>考前代码笔记</h1><p>准备笔和本子。今天先把取位、循环两处得分点记牢。</p><div class="hero-art" aria-label="从123取出个位3"><span class="digit">1</span><span class="digit">2</span><span class="digit">3</span><span>→ 个位 <b>3</b></span></div><p class="muted">约15分钟。会的直接做；不会的看一次变化。</p>'+['取位与删位 · 约8分钟','循环与输出 · 约4分钟','提交检查 · 约2分钟'].map((s,i)=>'<button class="course-row" data-action="start-'+i+'"><span><b>'+s+'</b><span class="mini">'+['抄3句 → 操作 → 原题与迁移','抄2句 → 原题与迁移','运行之后，别忘记提交'][i]+'</span></span><span>→</span></button>').join('')+'<p class="daily">十二月卷另外留时间完成，这里只练关键点。</p></section>';}
function note(){const loop=state.q>=5;return '<section class="screen" data-phase="teach"><span class="eyebrow">'+(loop?'02 / 循环':'01 / 取位')+'</span><h1>先记到本子上</h1><p>只抄下面'+(loop?'两':'三')+'句，例子不必整段抄。</p><div class="note">'+(loop?'<p>检查 → 做事 → 更新 → 再检查。</p><p>退出保留失败值；输出看语句位置。</p>':'<p><code>N%10</code> 取个位。</p><p><code>N/=10</code> 删个位并存回N。</p><p>先取再删，两组交替。</p>')+'</div><p class="mini muted">“已抄好”只记录你的确认，不等于已经会做。</p><div class="actions">'+btn('我已抄好，直接检验','noted','primary')+btn('看一次代码变化','model')+'</div></section>';}
function resetModel(){model={N:12375,N1:0,N2:0,step:0,turn:0,i:0,tnt:1,phase:0,ended:false,last:modelType==='digits'?'先检查 while(N)。':'先检查 i<5。'};}
function modelHtml(){const d=modelType==='digits';return '<section class="screen" data-phase="guided"><span class="eyebrow">点一步，看一个变化</span><h1>'+(d?'个位去了哪里':'循环何时结束')+'</h1><div class="machine">'+(d?'<div class="digits">'+String(model.N).split('').map(n=>'<span class="digit">'+n+'</span>').join('')+'</div><div class="boxes"><div class="box"><small>N 当前值</small><b>'+model.N+'</b></div><div class="box"><small>N1 第一组</small><b>'+model.N1+'</b></div><div class="box"><small>N2 第二组</small><b>'+model.N2+'</b></div></div>':'<div class="boxes"><div class="box"><small>i 当前值</small><b>'+model.i+'</b></div><div class="box"><small>tnt 当前值</small><b>'+model.tnt+'</b></div><div class="box"><small>下一步</small><b style="font-size:17px">'+(model.ended?'已退出':['检查','乘法','更新'][model.phase])+'</b></div></div>')+'<div class="pointer" role="status">'+esc(model.last)+'</div>'+(!d?'<p class="mini">屏幕输出（下面保留空格）</p><div class="output">'+(model.ended?' 0 5\n':'尚未执行 printf')+'</div>':'')+'<div class="actions">'+btn(model.ended?'重新演示':'执行下一步',model.ended?'reset-model':'step-model','primary')+btn('还原','reset-model')+'</div></div><pre>'+esc(d?'while(N){\n  N1+=N%10; N/=10;\n  N2+=N%10; N/=10;\n}':ORIGINAL_LOOP)+'</pre><p class="mini muted">取位模型把原题的逗号拆成分号来单步展示，执行顺序相同；原题检验保留原代码。</p><div class="actions">'+btn('回到刚才那道题','return-quiz')+btn('回到笔记','return-note')+'</div></section>';}
function stepModel(){if(modelType==='digits'){if(model.step===0){if(!model.N){model.ended=true;model.last='N=0，while条件为假，退出。';}else{model.last='N='+model.N+'，不是0，进入循环。';model.step=1;}}else if(model.step===1||model.step===3){const name=model.step===1?'N1':'N2';const v=model.N%10;model[name]+=v;model.last=name+' += N%10：取出'+v+'，'+name+'变成'+model[name]+'；N还没变。';model.step++;}else{const before=model.N;model.N=Math.floor(model.N/10);model.last='N /= 10：'+before+' → '+model.N+'，删掉刚才的个位。';model.step=model.step===2?3:0;}}else if(model.phase===0){if(model.i<5){model.last=model.i+' < 5 成立，下一步做乘法。';model.phase=1;}else{model.last='5 < 5 不成立，退出后执行 printf。';model.ended=true;}}else if(model.phase===1){model.tnt*=model.i;model.last='tnt *= i：乘积变成'+model.tnt+'。接着还要更新i。';model.phase=2;}else{model.i++;model.last='i++：i变成'+model.i+'。下一步重新检查。';model.phase=0;}render();}
const PHASE_OPEN={recall:'<section class="screen" data-phase="recall">',independent:'<section class="screen" data-phase="independent">',transfer:'<section class="screen" data-phase="transfer">'};
function question(){const q=QUESTIONS[state.q];return PHASE_OPEN[q.phase]+'<span class="eyebrow">'+(q.phase==='independent'?'原题检验':q.phase==='transfer'?'短迁移 · 自编':'遮住笔记，自己试')+' · '+(state.q+1)+'/7</span><h1>'+q.topic+'</h1><p>'+q.prompt+'</p><pre>'+esc(q.code)+'</pre>'+(q.kind==='choice'?'<div class="answer-options">'+q.choices.map((s,i)=>btn(String.fromCharCode(65+i)+' · '+esc(s),'answer-'+String.fromCharCode(65+i))).join('')+'</div>':'<form id="answerForm"><label for="answer">'+(q.kind==='code'?'输入两条语句；变量名大小写要正确':q.kind==='explain'?'写一句原因，也可用系统语音输入':'按题目顺序填写，用空格隔开')+'</label><textarea id="answer" '+(q.kind==='numbers'?'inputmode="numeric"':'')+' maxlength="600">'+esc(state.drafts[q.id]||'')+'</textarea><div class="actions"><button class="primary" type="submit">'+(q.kind==='explain'?'保存解释，查看要点':'检查答案')+'</button></div></form>')+'<div id="feedback" aria-live="polite"></div><div class="actions">'+btn('看关键笔记','help-note')+btn('先标待复习，继续','skip')+'</div></section>';}
function reference(q){return q.kind==='choice'?q.answer+'：'+q.choices[q.answer.charCodeAt(0)-65]:q.answer;}
function repair(){const q=QUESTIONS[state.q];return '<section class="screen" data-phase="repair"><h1>只补这一处</h1><div data-child-explanation="primary"><p data-child-part="gap">你卡在：'+q.topic+'。</p><p data-child-part="reason">'+q.why+'</p><p data-child-part="check">对照原代码，回去再试一次。</p></div><pre>'+esc(q.code)+'</pre><div class="actions"><button class="primary" data-action="return-quiz" data-return-to-question="original">回到刚才那道题</button>'+btn('看一步变化','model')+'</div><div class="escape" data-learning-escape="answer-and-continue"><p>赶时间可以先记参考答案。</p><pre data-reference-answer>'+esc(reference(q))+'</pre><button data-action="skip" data-continue-after-reveal>记为待复习并继续</button></div></section>';}
function notebook(){return '<section class="screen"><span class="eyebrow">拿出本子 · 抄关键句</span><h1>得分点笔记</h1><p>先抄今天练到的条目。例子只用来核对。</p>'+NOTES.map((n,i)=>'<article class="notebook-item"><h3>'+String(i+1).padStart(2,'0')+' / '+n[0]+'</h3><p>'+esc(n[1])+'</p><pre>'+esc(n[2])+'</pre><button data-action="note-'+i+'">'+(state.notes['all-'+i]?'已确认抄好':'我已抄好这一条')+'</button></article>').join('')+'<div class="actions">'+btn('下载笔记','download-notes')+btn('返回刚才的位置','back','primary')+'</div></section>';}
function records(){return '<section class="screen" data-parent-analysis><h1>本次学习记录</h1><p>只记录Eddey本次操作。抄写为自报，解释待复核；未做题不会计为通过。</p><p>活跃用时约 '+Math.ceil(state.activeSeconds/60)+' 分钟。</p><table class="proof"><thead><tr><th>题目</th><th>当前证据</th></tr></thead><tbody>'+QUESTIONS.map(q=>'<tr><td>'+q.topic+' / '+q.id+'</td><td>'+esc(state.done[q.id]||'未做')+'</td></tr>').join('')+'</tbody></table><details><summary>查看原回答与尝试</summary><pre>'+esc(JSON.stringify(state.history,null,2))+'</pre></details><p>未做整套新卷，也未自动评测任意C++程序。本课不据局部正确率预测考试分数。</p><div class="actions">'+btn('下载学习记录','export')+btn('复制待问问题','copy')+btn('返回','back','primary')+'</div></section>';}
function submission(){const n=state.submission.stage;return '<section class="screen"><span class="eyebrow">操作练习 · 不是正式考试系统</span><h1>运行后还要提交</h1><div class="note"><p>运行成功 ≠ 已提交。</p><p>提交测评后，查看最后一次记录。</p></div><p>'+['模拟现场：程序已经写好，现在只在编辑器里。','模拟现场：编译运行通过，样例输出相符。还没有提交。','模拟现场：提交记录已出现，状态为已收到。','已查看模拟提交记录。正式考试还要核对题号、语言与最后一次结果。'][n]+'</p><div class="machine"><p>保存代码：已保存</p><p>样例运行：'+(n>=1?'已检查':'未检查')+'</p><p>提交记录：'+(n>=2?'模拟记录 #1 · 已收到':'没有记录')+'</p><p>最后结果：'+(n>=3?'已查看（仅操作练习）':'未查看')+'</p></div><div class="actions">'+btn(['检查样例运行','提交测评（模拟）','查看提交记录','我已记下，结束短练'][n],'submit-step','primary')+btn('本次先停，保留记录','finish')+'</div><p class="mini muted">本页没有向考试平台提交代码，不代表已获得编程分数。</p></section>';}
function finish(){const checked=Object.keys(state.done).length;return '<section class="screen"><span class="badge">短练收尾</span><h1>把关键点带走</h1><div class="success-mark">已处理 '+checked+' / '+QUESTIONS.length+' 个检验节点</div><p>把待复习的题带来问我；今天的笔记明天再遮住看一次。</p><div class="actions">'+btn('查看得分笔记','notebook')+btn('查看记录','records')+'</div><div class="actions">'+btn(state.syncDone?'已加入同步队列':'完成并同步','sync','primary')+btn('下载记录','export')+'</div><p class="mini muted">只有点击“完成并同步”才申请上传。网络失败会保留本机队列；不把练过记成考试通过。</p><div class="actions">'+btn('回到短练入口','home')+'</div></section>';}
function render(){const count=Object.keys(state.done).length;$('progress').innerHTML=Array.from({length:7},(_,i)=>'<span class="'+(i<count?'on':'')+'"></span>').join('');$('stage').innerHTML=({home,note,model:modelHtml,quiz:question,repair,notebook,records,submission,finish}[state.screen]||home)();}
function assess(value){const q=QUESTIONS[state.q],v=value.trim();if(!v){$('notice').textContent='先写一个答案，或选“先标待复习，继续”。';return;}state.drafts[q.id]=v;state.tries[q.id]=(state.tries[q.id]||0)+1;const ok=q.kind==='numbers'?v.normalize('NFKC').split(/[\s,，、；;]+/).filter(Boolean).join(' ')===q.answer:q.kind==='choice'?v===q.answer:q.kind==='code'?/^N1\s*\+=\s*N\s*%\s*10\s*[;,]\s*N\s*(?:\/=\s*10|=\s*N\s*\/\s*10)\s*;$/.test(v):null;const helped=!!state.assisted[q.id]||state.tries[q.id]>1;const outcome=ok===null?'解释已记录，待复核':ok?(helped?'修复后正确':'本次首答正确'):'待复习';state.history.push({questionId:q.id,topic:q.topic,response:v,outcome,assisted:helped,at:new Date().toISOString()});state.syncDone=false;
if(ok===false){state.done[q.id]='待复习';state.assisted[q.id]=true;save();if(state.tries[q.id]===1){go('repair');return;}$('feedback').innerHTML='<div class="escape" data-learning-escape="answer-and-continue"><p>不反复卡在这里。先抄要点，再继续。</p><pre data-reference-answer>'+esc(reference(q))+'</pre><p>'+q.why+'</p><div class="actions">'+btn('我再改一次','return-quiz')+'<button data-action="skip" data-continue-after-reveal>记为待复习并继续</button></div></div>';return;}
state.done[q.id]=outcome;if(ok===null)state.assisted[q.id]=true;save();$('feedback').innerHTML='<div class="feedback good"><p>'+(ok===null?'解释已保存，待家长复核。':'这一步正确。')+'</p><p>'+esc(ok===null?q.answer:q.why)+'</p><div class="actions">'+btn('继续','next','primary')+'</div></div>';const f=$('answerForm');if(f)f.querySelector('button').disabled=true;document.querySelectorAll('[data-action^="answer-"]').forEach(b=>b.disabled=true);}
function next(){if(state.q===4){state.q=5;go('note');}else if(state.q===6){go('submission');}else{state.q++;go('quiz');}}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function report(){return 'Eddey 考前短练\n'+QUESTIONS.map(q=>q.id+' '+q.topic+'：'+(state.done[q.id]||'未做')).join('\n')+'\n最近回答：\n'+state.history.slice(-12).map(h=>h.questionId+'：'+h.response+'（'+h.outcome+'）').join('\n')+'\n请只讲待复习题的第一个错误转折，保留原代码。';}
async function action(a){$('notice').textContent='';if(a.startsWith('answer-')){assess(a.slice(7));return;}if(a.startsWith('note-')){state.notes['all-'+a.slice(5)]=new Date().toISOString();save();render();return;}if(a.startsWith('start-')){state.q=a==='start-1'?5:0;if(a==='start-2')go('submission');else go('note');return;}switch(a){case'noted':state.notes[state.q>=5?'loop':'digits']=new Date().toISOString();go('quiz');break;case'model':modelType=state.q>=5?'loop':'digits';if(state.screen==='quiz'||state.screen==='repair')state.assisted[QUESTIONS[state.q].id]=true;resetModel();go('model');break;case'step-model':stepModel();break;case'reset-model':resetModel();render();break;case'return-quiz':go('quiz');break;case'return-note':go('note');break;case'help-note':state.assisted[QUESTIONS[state.q].id]=true;go('note');break;case'next':next();break;case'skip':{const q=QUESTIONS[state.q];state.done[q.id]='待复习';state.assisted[q.id]=true;state.history.push({questionId:q.id,topic:q.topic,response:state.drafts[q.id]||'',outcome:'查看参考或跳过，待复习',assisted:true,at:new Date().toISOString()});state.syncDone=false;next();break;}case'submit-step':if(state.submission.stage<3){state.submission.stage++;save();render();}else{state.submission.confirmedAt=new Date().toISOString();state.notes.submit=state.submission.confirmedAt;go('finish');}break;case'finish':go('finish');break;case'notebook':case'records':state.returnScreen=state.screen;go(a);break;case'back':go(['notebook','records'].includes(state.returnScreen)?'home':state.returnScreen||'home');break;case'home':go('home');break;case'export':download(APP_ID+'-record.json',JSON.stringify({...state,test:testQuery||!!window.DDLearningSync?.isTest(),exportedAt:new Date().toISOString()},null,2),'application/json');$('notice').textContent='已生成本次记录文件。';break;case'download-notes':download('Eddey-考前代码得分笔记.txt',NOTES.map((n,i)=>(i+1)+'. '+n[0]+'\n'+n[1]+'\n'+n[2]).join('\n\n'),'text/plain;charset=utf-8');break;case'copy':try{await navigator.clipboard.writeText(report());$('notice').textContent='已复制，可粘贴给老师。';}catch(e){$('notice').textContent='复制不可用，请下载记录。';}break;case'sync':if(state.syncDone){$('notice').textContent='本次结果已加入同步队列；可在门户检查同步状态。';break;}if(testQuery||!window.DDLearningSync||window.DDLearningSync.isTest()){$('notice').textContent='测试环境：只保存本机，不上传正式记录。';break;}const sync=window.DDLearningSync;for(const h of state.history){sync.recordAttempt({client_event_id:APP_ID+'-'+state.started+'-'+state.history.indexOf(h),kid:CHILD,subject:'编程',topic:h.topic,item:h.questionId,ok:h.outcome==='本次首答正确'||h.outcome==='修复后正确'?true:h.outcome==='解释已记录，待复核'?null:false,payload:{...h,notesSelfReported:true}});}state.syncDone=!!sync.complete({kid:CHILD,subject:'编程',topic:'考前取位与循环短练',item:'完成短练并保留待复习项',payload:{outcomes:state.done,notes:state.notes,submissionPractice:state.submission,activeSeconds:state.activeSeconds,mastery:'not_inferred'}});save();render();$('notice').textContent=state.syncDone?'已加入同步队列；发送结果以门户同步状态为准。':'同步队列未保存成功，请下载记录。';break;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b.dataset.action);});document.addEventListener('submit',e=>{if(e.target.id==='answerForm'){e.preventDefault();assess($('answer').value);}});document.addEventListener('input',e=>{if(e.target.id==='answer'){state.drafts[QUESTIONS[state.q].id]=e.target.value;save();}});$('notesNav').onclick=()=>{if(['quiz','repair'].includes(state.screen))state.assisted[QUESTIONS[state.q].id]=true;action('notebook');};$('recordsNav').onclick=()=>{if(state.screen==='quiz')state.assisted[QUESTIONS[state.q].id]=true;action('records');};render();
})();
</script></body></html>
