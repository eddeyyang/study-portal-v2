<script>window.COURSE={"child":"kenton","appId":"kenton_math_catchup_20260916","subject":"数学","subjectKey":"math","schema":"math-catchup-v1","version":"v1","revision":"math-child-first-r2","title":"看图学小数","scope":"按原书顺序支撑当前课堂。后续章节为储备，实际漏课清单待老师确认；选课不代表完成。","paperNote":"《一课一练·第三周》P9–12对应除数是整数的小数除法。先按老师要求试纸书原题，卡在哪一步再选讲解；小数作除数、商的近似数单列为预备。","sources":[{"title":"尖子生·学习笔记·同步教材 数学五年级上（家长金牌数学资料）","pages":"P15–32","note":"依教材解释、辨误、学方法、常考题型顺序原创改编，不公开原书页图或私人作业。"},{"title":"华东师大版一课一练·数学五年级第一学期（增强版）","pages":"第三周 P9–12","note":"已核对对应书页原图，用于回接纸书。这里的网页例题是原创改编，网页通过不代替纸书任务完成。"}],"lessons":[{"bookPages":"P15—22","curriculum":{"promotion":"只按本人实际独立尝试与提示记录接续，不由点击完成推定掌握。","stage":"课内衔接"},"date":"2026-09-16","goal":"看见计数单位怎样继续分；独立算出整数作除数的小数除法，并检查0的位置。","id":"integer-division","paperPages":"一课一练·第三周 P9—12","level":"current","minutes":28,"segments":[{"check":"独立完成18.4÷8、6.6÷4；提示后正确另记。","endStepId":"ki08","goal":"理解单位分拆，自己计算并解释单价。","id":"integer-first","minutes":14,"scene":"hotel","startStepId":"ki01","title":"先把余下的分完"},{"check":"独立完成0.72÷9、0.912÷16和单价比较。","endStepId":"ki16","goal":"商中留对0，用验乘找错并比较单价。","id":"integer-zero","minutes":14,"scene":"hotel","startStepId":"ki09","title":"再把0和单位留对"}],"source":"《尖子生·学习笔记同步教材·数学五年级上》（档案简称金牌数学）P15—22。","sourceNotes":["课内衔接主线，课程位置不等于已经掌握；从本人实际检查与断点接续。","按解教材、辨易误、学方法的顺序原创改编，不复刻扫描页或损坏OCR竖式。","P15—20提供模型和独立检查；P21—22提高方法在可选展开层，读例不计独立通过。","两段各14分钟可分开接续；同科纸笔、对话、网页共享实际预算。"],"steps":[{"body":"","id":"ki01","kicker":"P15—17","phase":"teach","source":"原创改编，对应《学习笔记同步教材·数学五年级上》P15—17","title":"余下的，还能怎样分？","tutorial":[{"title":"5元8角，4个人分","text":"每人先拿1元。分走4元，还剩1元8角。","picture":{"kind":"money","cents":580,"groups":4,"stage":1}},{"title":"剩下的钱，换成角","text":"1元8角就是18角。每人再拿4角，还剩2角。","picture":{"kind":"money","cents":580,"groups":4,"stage":2}},{"title":"最后2角，换成分","text":"2角就是20分。每人再拿5分。每人合起来拿了1元4角5分。","picture":{"kind":"money","cents":580,"groups":4,"stage":3}}],"type":"teach"},{"body":"先把5元8角分给4人，再试4元5角分给6人。点底部“下一步”，看剩下的钱怎样继续分。","id":"ki02","kicker":"P16—19","model":"decimal-share","phase":"guided","source":"原创改编，对应《学习笔记同步教材·数学五年级上》P16—19","title":"轮到你来分钱","tutorial":[],"type":"model"},{"answer":"1.45","body":"5.8元平均分给4人，每人多少元？","explanation":"每人1元4角5分，写成小数就是1.45元。 答案是1.45。","expression":"5.8/4","id":"ki03","kicker":"P17","phase":"guided","reference":"每人1元4角5分，写成小数就是1.45元。 答案是1.45。","repair":{"gap":"先看这一小步。","reason":"每人1元4角5分，写成小数就是1.45元。","check":"按这个想法，回刚才那道题再试一次。"},"source":"原创改编，对应《学习笔记同步教材·数学五年级上》P17","title":"每人拿到多少元？","type":"number","tutorial":[{"title":"先定位","text":"看剩余是哪种单位。"},{"title":"只修这一处","text":"2个0.1等于20个0.01，20÷4得5。"},{"title":"回原题再试","text":"把个位1、十分位4、百分位5合起来。"}]},{"body":"","id":"ki04","kicker":"P17—18","phase":"teach","source":"原创改编，对应《学习笔记同步教材·数学五年级上》P17—18","title":"换小单位，钱没变","tutorial":[{"title":"钱没变，只换个说法","text":"5元8角，也可以说成5元80分。5.8元和5.80元是同一笔钱。","picture":{"kind":"equation","lines":["5.8元 = 5元8角","5.80元 = 5元80分","5.8 = 5.80"],"caption":"添在小数末尾的0，没有把钱变多。"}},{"title":"没分完，就换小单位","text":"17元分给4人。每人先拿4元，剩下1元换成100分，每人再拿25分。","picture":{"kind":"money","cents":1700,"groups":4,"stage":3}}],"type":"teach"},{"body":"可以用“元、角、分”讲一讲。","checklist":["说出两个数相等","说明换的是计数单位","没有把添0说成乘10"],"id":"ki05","kicker":"P17—18","phase":"recall","prompt":"","reference":"5元8角就是5元80分。只是换了更小的单位，钱还是原来那么多。","source":"原创改编，对应《学习笔记同步教材·数学五年级上》P17—18","title":"5.8元为什么也是5.80元？","type":"recall","placeholder":"可以先说给身边的人听，也可以写在这里。"},{"answer":"2.3","body":"18.4÷8等于多少？纸上算后，只输入数字。","explanation":"18.4元分给8人：先分整元，剩下的换成角。 答案是2.3。","expression":"18.4/8","id":"ki06","kicker":"P16","phase":"independent","reference":"18.4元分给8人：先分整元，剩下的换成角。 答案是2.3。","repair":{"gap":"先看这一小步。","reason":"18.4元分给8人：先分整元，剩下的换成角。","check":"按这个想法，回刚才那道题再试一次。"},"source":"原创改编，对应《学习笔记同步教材·数学五年级上》P16","title":"自己算一次","type":"number","tutorial":[{"title":"先定位","text":"先核对18÷8的余数。"},{"title":"只修这一处","text":"18−16=2，接上4个0.1成为24个0.1。"},{"title":"回原题再试","text":"24个0.1分8份，每份是多少？"}]},{"answer":"1.65","body":"6.6÷4等于多少？只输入数字。","explanation":"分走4元后，剩下2元6角，换成26角继续分。 答案是1.65。","expression":"6.6/4","id":"ki07","kicker":"P17","phase":"independent","reference":"分走4元后，剩下2元6角，换成26角继续分。 答案是1.65。","repair":{"gap":"先看这一小步。","reason":"分走4元后，剩下2元6角，换成26角继续分。","check":"按这个想法，回刚才那道题再试一次。"},"source":"原创改编，对应《学习笔记同步教材·数学五年级上》P17","title":"有剩余也能分完","type":"number","tutorial":[{"title":"先定位","text":"除到十分位，还剩2个0.1。"},{"title":"只修这一处","text":"它们能换20个0.01，不能丢掉。"},{"title":"回原题再试","text":"20÷4得几？写在百分位。"}]},{"body":"7本同价笔记本共17.5元。求每本的单价。","checklist":["总价÷数量","算式回答所求","结果带元，口述与书面计算分别记录"],"id":"ki08","kicker":"P15—18","phase":"transfer","prompt":"","reference":"17.5÷7=2.5元/本。总价平均分成7份，每份就是一本的价钱。","source":"原创改编，对应《学习笔记同步教材·数学五年级上》P15—18","title":"买东西时怎样用？","type":"open","placeholder":"可以先说给身边的人听，也可以写在这里。"},{"body":"","id":"ki09","kicker":"P19—20","phase":"teach","source":"原创改编，对应《学习笔记同步教材·数学五年级上》P19—20","title":"不够分1角，怎么办？","tutorial":[{"title":"4角，够6个人分吗？","text":"这次是4角8分，分给6人。整元不够分，4角也不够每人1角。","picture":{"kind":"money","cents":48,"groups":6,"stage":2}},{"title":"换成48分，就能分了","text":"每人8分，也就是0.08元。中间的0告诉我们：每人没有拿到整角。","picture":{"kind":"money","cents":48,"groups":6,"stage":3}}],"type":"teach"},{"answer":"0.06","body":"跟刚才的方法算0.42÷7，只输入数字。","explanation":"4角不够7人各1角。把4角2分看成42分。 答案是0.06。","expression":"0.42/7","id":"ki10","kicker":"P19—20","phase":"guided","reference":"4角不够7人各1角。把4角2分看成42分。 答案是0.06。","repair":{"gap":"先看这一小步。","reason":"4角不够7人各1角。把4角2分看成42分。","check":"按这个想法，回刚才那道题再试一次。"},"source":"原创改编，对应《学习笔记同步教材·数学五年级上》P19—20","title":"守住十分位的0","type":"number","tutorial":[{"title":"先定位","text":"先别把42直接写成6。"},{"title":"只修这一处","text":"42表示42个0.01，所得6也是6个0.01。"},{"title":"回原题再试","text":"6个0.01写成哪个小数？"}]},{"body":"0.08元是8分。如果少写中间的0，变成0.8元，那是几角？","checklist":["每份不足1个0.1","8表示8个0.01","省0会改变数值"],"id":"ki11","kicker":"P19—20","phase":"recall","prompt":"","reference":"0.08元是8分，0.8元是8角。中间的0留下了十分位，8才在百分位。","source":"原创改编，对应《学习笔记同步教材·数学五年级上》P19—20","title":"少了这个0，会变成几角？","type":"recall","placeholder":"可以先说给身边的人听，也可以写在这里。"},{"answer":"0.08","body":"0.72÷9等于多少？只输入数字。","explanation":"7角不够9人各1角。把7角2分看成72分。 答案是0.08。","expression":"0.72/9","id":"ki12","kicker":"P19—20","phase":"independent","reference":"7角不够9人各1角。把7角2分看成72分。 答案是0.08。","repair":{"gap":"先看这一小步。","reason":"7角不够9人各1角。把7角2分看成72分。","check":"按这个想法，回刚才那道题再试一次。"},"source":"原创改编，对应《学习笔记同步教材·数学五年级上》P19—20","title":"换个数，自己留对0","type":"number","tutorial":[{"title":"先定位","text":"先估商在0和1之间。"},{"title":"只修这一处","text":"7个0.1不够分9份各1个0.1。"},{"title":"回原题再试","text":"72个0.01÷9得8个0.01。"}]},{"answer":"a","body":"有人把1.5÷6写成2.5。哪项检查能立即发现不对？","explanation":"验乘发现结果大10倍。正确商0.25；0.25×6=1.5。","id":"ki13","kicker":"P20","options":[{"id":"a","text":"2.5×6=15，没回到1.5。"},{"id":"b","text":"只要商有小数点就不会错。"},{"id":"c","text":"除法的商一定是整数。"}],"phase":"repair","reference":"商×除数应回到被除数。","repair":{"check":"把2.5×6与1.5比较。","gap":"检查能不能乘回原数。","reason":"商×除数应等于被除数。"},"source":"原创改编，对应《学习笔记同步教材·数学五年级上》P20","title":"找第一处错误","type":"choice"},{"answer":"0.057","body":"0.912÷16等于多少？只输入数字。","explanation":"个位、十分位都不够分1个，要留0。用算出的商×16检查。 答案是0.057。","expression":"0.912/16","id":"ki14","kicker":"P20","phase":"independent","reference":"个位、十分位都不够分1个，要留0。用算出的商×16检查。 答案是0.057。","repair":{"gap":"先看这一小步。","reason":"个位、十分位都不够分1个，要留0。用算出的商×16检查。","check":"按这个想法，回刚才那道题再试一次。"},"source":"原创改编，对应《学习笔记同步教材·数学五年级上》P20","title":"把除数换成两位数","type":"number","tutorial":[{"title":"先定位","text":"先核对每位上的数量。"},{"title":"只修这一处","text":"个位和十分位都不够商1；91个0.01先分出5个。"},{"title":"回原题再试","text":"112个0.001÷16得7个，写在哪一位？"}]},{"body":"","id":"ki15","kicker":"P21—22","phase":"teach","source":"原创改编，对应《学习笔记同步教材·数学五年级上》P21—22","title":"哪盒笔更便宜？","tutorial":[{"title":"先算每支多少钱","text":"A盒10支，22元；B盒8支，20元。支数不同，先都算成“1支的价钱”。","picture":{"kind":"equation","lines":["A：22 ÷ 10 = 2.2元/支","B：20 ÷ 8 = 2.5元/支"],"caption":"现在每一份都是1支笔，才能直接比。"}},{"title":"再看贵了多少","text":"B每支2.5元，A每支2.2元。相减，就知道一支贵多少钱。","picture":{"kind":"equation","lines":["2.5 − 2.2 = 0.3元"],"caption":"两盒总价相减，不是每支的价差。"}}],"type":"teach"},{"answer":"0.2","body":"A盒12支笔27.6元，B盒8支笔20元。B平均每支比A贵多少元？只输入数字。","explanation":"分别算每支的价钱，再用B的单价减A的。 答案是0.2 <script>(function(){

window.MathMechanisms=Object.freeze({
 share(cents,groups,stage){let rest=cents,per=0;return [100,10,1].slice(0,stage).map(unit=>{const count=Math.floor(rest/(unit*groups)),before=rest;per+=count*unit;rest-=count*groups*unit;return {unit,count,before,rest,per};});},
 distribute(a,b,c){return {whole:(a+b)*c,left:a*c,right:b*c};},
 equivalent(a,b,scale,both){return {a:both?a*scale:a,b:b*scale,q:both?a/b:a/(b*scale)};}
});
const f=(title,text,picture)=>({title,text,picture});
const sets={
 'decimal-share':[
  f('先拿整元，够不够？','5元8角，分给4人。下一步，先让每人拿1元。',{kind:'money',cents:580,groups:4,stage:0}),

  f('每人1元4角5分','1.45×4=5.8，合起来正好是原来的钱。再换一种情况。',{kind:'money',cents:580,groups:4,stage:3}),
  f('4元5角，分给6人呢？','不够每人1元，就换成45角。下一步，每人先分7角。',{kind:'money',cents:450,groups:6,stage:0}),
  f('分走42角，还剩3角','3角就是30分。下一步，把30分平均分给6人。',{kind:'money',cents:450,groups:6,stage:2}),
  f('每人7角5分，是0.75元','整元不够分，商的个位写0。剩下的钱换小单位，仍能继续分。',{kind:'money',cents:450,groups:6,stage:3})],
 'distribute-area':[
  f('每袋装了什么？','每袋3张橙色、2张绿色，共4袋。下一步，分开两种颜色。',{kind:'bags',a:3,b:2,c:4}),
  f('分开后，一张也没少','橙色3×4=12张，绿色2×4=8张。下一步，再放进一袋。',{kind:'bags',a:3,b:2,c:4,split:true}),
  f('两种颜色，都多一份','变成5袋后，橙色3×5=15张，绿色2×5=10张。下一步，合着看。',{kind:'bags',a:3,b:2,c:5,split:true}),
  f('合起来，还是25张','(3+2)×5=3×5+2×5。袋数变了，两种颜色都要跟着变。',{kind:'bags',a:3,b:2,c:5})],

  f('换了说法，仍能买9块','54角，每块6角。下一步，故意只把原来单价0.6元乘10，看看会怎样。',{kind:'units',scale:10,both:true}),
  f('只改单价，事情变了','手里仍是5.4元，每块却涨到6元，连1块都买不起。下一步，把原来的两笔钱一起换成分。',{kind:'units',scale:10,both:false}),

window.renderChineseModel=function(s,host,emit){
 const frames=sets[s.model];if(!frames)throw Error('Unknown mathematics model');
 let index=Number.isInteger(s.savedState?.frame)?Math.min(Math.max(s.savedState.frame,0),frames.length-1):0;
 function draw(){const part=frames[index];host.innerHTML='<div class="model-page"><p class="step-count">动手看 · '+(index+1)+' / '+frames.length+'</p><h2>'+part.title+'</h2><p class="model-instruction">'+part.text+'</p>'+window.MathPicture.render(part.picture)+'</div>';emit({model:s.model,frame:index,complete:index===frames.length-1});}
 window.advanceMathModel=()=>{if(index>=frames.length-1)return false;index++;draw();return true;};
 window.rewindMathModel=()=>{if(index<=0)return false;index--;draw();return true;};
 draw();return ()=>{window.advanceMathModel=null;window.rewindMathModel=null;};
};
})();

(function(){
'use strict';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n.toFixed(10)).toString();
function svg(label,body,height=240){return '<svg viewBox="0 0 360 '+height+'" role="img" aria-label="'+esc(label)+'">'+body+'</svg>';}
function text(x,y,value,size=16,color='#244e46',anchor='middle'){return '<text x="'+x+'" y="'+y+'" text-anchor="'+anchor+'" font-size="'+size+'" fill="'+color+'">'+esc(value)+'</text>';}
function rect(x,y,w,h,color,rx=10){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+rx+'" fill="'+color+'"/>';}
function money(p){
 const rows=window.MathMechanisms.share(p.cents,p.groups,p.stage),last=rows.at(-1),per=last?.per||0,rest=last?.rest??p.cents;
 const cols=p.groups===4?2:3,cell=cols===2?170:116,card=cols===2?150:104,rowHeight=108,start=cols===2?20:12;
 const positions=Array.from({length:p.groups},(_,i)=>({x:start+i%cols*cell,y:14+Math.floor(i/cols)*rowHeight}));
 let body=positions.map(({x,y},i)=>{
  const centers=cols===2?[35,75,115]:[22,52,82];
  return rect(x,y,card,95,'#ffffff')+text(x+card/2,y+22,'第'+(i+1)+'人',14,'#68716a')+[Math.floor(per/100),Math.floor(per%100/10),per%10].map((n,j)=>'<circle cx="'+(x+centers[j])+'" cy="'+(y+49)+'" r="'+(cols===2?16:13)+'" fill="'+['#ecd9a3','#dbe9d6','#eee5db'][j]+'"/>'+text(x+centers[j],y+55,n,cols===2?22:18)).join('')+centers.map((center,j)=>text(x+center,y+82,['元','角','分'][j],cols===2?16:14)).join('');
 }).join('');
 const h=Math.ceil(p.groups/cols)*rowHeight+15;body+=text(180,h+22,rest?'还剩 '+fmt(rest/100)+' 元':'分完了：每人 '+fmt(per/100)+' 元',19);
 return svg(fmt(p.cents/100)+'元平均分给'+p.groups+'人，已分到每人'+fmt(per/100)+'元，还剩'+fmt(rest/100)+'元',body,h+44);
}
function bags(p){
 // Each row is a bag; the unit spacing is constant when another bag is added.
 const unit=44,left=p.split?82:92,top=30,w=(p.a+p.b)*unit,h=p.c*42;
 let body='';
 for(let row=0;row<p.c;row++){
  body+=rect(left-22,top+row*42-19,w,38,p.split?'transparent':'#fff');
  body+=text(30,top+row*42+5,(row+1)+'袋',14,'#677369');
  for(let col=0;col<p.a+p.b;col++){const x=left+col*unit+(p.split&&col>=p.a?20:0),y=top+row*42;
   body+=col<p.a?'<circle cx="'+x+'" cy="'+y+'" r="14" fill="#ce784a"/>':rect(x-14,y-14,28,28,'#6d9473',6);
  }

async function completeAndSync(){
