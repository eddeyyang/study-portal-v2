    }
    function playVerb(n,showTrack=true){
      const verb=verbs.find(x=>x.n===n);if(!verb)return;
      stopVoice();
      const audio=new Audio(audioFile(verb));
      audio.preload='auto';

      audio.ontimeupdate=()=>{
        if(!showTrack||!audio.duration)return;
        const count=verb.n===16?2:3;

          playingStation=next;
          document.querySelectorAll('.station').forEach((station,i)=>station.classList.toggle('playing',i===next))

      audio.onended=()=>{currentAudio=null;playingStation=-1;document.querySelectorAll('.station').forEach(station=>station.classList.remove('playing'))};
      audio.onerror=()=>{audioBroken=true;currentAudio=null;playingStation=-1;toast('这条英语 MP3 没有成功播放，请再点一次')};

        state.seen[verb.n]=true;

        audioBroken=true;

    function trackPage(){
      const verb=verbs[trackNo-1],forms=verb.n===16?[verb.base,verb.past]:[verb.base,verb.past,verb.pp];
      return`${pageHead('三态同步轨道',`老师原表第 ${verb.n} 个 · 每次建议只学 5 个`)}<section class="panel" data-phase="guided"><div class="range-tabs">${Array.from({length:6},(_,i)=>{const a=i*5+1,b=a+4,seen=verbs.filter(x=>x.n>=a&&x.n<=b&&state.seen[x.n]).length;return`<button class="chip ${verb.n>=a&&verb.n<=b?'on':''}" onclick="startTrack(${a})">${a}—${b} · ${seen}/5</button>`}).join('')}</div>
      <div class="track-card" data-no="${String(verb.n).padStart(2,'0')}"><div class="word">${esc(verb.base)}</div><div class="ipa">${esc(verb.ipa)}</div><div class="meaning">${esc(verb.zh)}</div>
      ${trackCovered?`<div class="cover"><div><strong>先开口说三态</strong><small>${verb.n===16?'can 的过去式是什么？':'原形 → 过去式 → 过去分词'}</small></div></div><div class="btn-row"><button class="btn primary wide" onclick="revealTrack()">我说完了，播放并核对</button></div>`:
      `<div class="audio-track">${forms.map((form,i)=>`${i?'<div class="track-arrow">→</div>':''}<div class="station ${playingStation===i?'playing':''}"><span>${i===0?'原形':i===1?'过去式':'过去分词'}</span><strong>${esc(form)}</strong></div>`).join('')}</div><div class="tip"><b>记忆钩子：</b>${esc(verb.tip)}</div><div class="btn-row"><button class="btn" onclick="playVerb(${verb.n})">播放三态</button><button class="btn" onclick="coverTrack()">遮住，我自己说</button><button class="btn primary" onclick="nextTrack()">${verb.n===30?'完成轨道':'下一个 →'}</button></div>`}</div></section>`;
    }
    function coverTrack(){trackCovered=true;stopVoice();render()}
    function revealTrack(){trackCovered=false;render();setTimeout(()=>playVerb(trackNo),100)}
    function nextTrack(){
      state.seen[trackNo]=true;save();tone('ok');
      if(trackNo===30){markModule('track',{seen:Object.keys(state.seen).length});go('families');return}
      trackNo++;trackCovered=false;playingStation=-1;render();scrollTo(0,0)
    }
    function familyPage(){
      const entries=Object.entries(families);
      return`${pageHead('变化家族','同一路线一起背，减少 30 个孤立记忆')}<section class="panel" data-phase="transfer"><span class="pill">8 条路线</span><h2>点动词，直接听它的三态</h2><div class="family-board">${entries.map(([key,data])=>`<div class="family-lane"><h3>${data[0]}</h3><p>${data[2]}</p><div class="verb-chips">${verbs.filter(x=>x.fam===key).map(verb=>`<button class="verb-chip" onclick="openFamilyVerb(${verb.n})">${esc(verb.base.split(' ')[0])}</button>`).join('')}</div></div>`).join('')}</div><div class="btn-row"><button class="btn" onclick="markFamilies()">我能说出家族规律</button><button class="btn primary" onclick="chooseRecall()">去遮挡回忆 →</button></div></section>`;
    }
    function openFamilyVerb(n){trackNo=n;trackCovered=false;route='track';render();scrollTo(0,0);setTimeout(()=>playVerb(n),100)}
    function markFamilies(){markModule('families',{groups:8});tone('ok');toast('变化家族已记录')}
    function chooseRecall(){recallQueue=[];recallPos=0;recallRevealed=false;recallRetry=false;route='recall';render();scrollTo(0,0)}
    function startRecall(a,b){recallQueue=verbs.filter(x=>x.n>=a&&x.n<=b);recallPos=0;recallRevealed=false;recallRetry=false;render();scrollTo(0,0)}
    function recallPage(){
      if(!recallQueue.length)return`${pageHead('遮挡回忆卡','先选 5 个，短时学习更容易坚持')}<section class="panel" data-phase="recall"><span class="pill">每组 5 个</span><h2>今天从哪一组开始？</h2><div class="grid">${Array.from({length:6},(_,i)=>{const a=i*5+1,b=a+4;return`<button class="home-card" onclick="startRecall(${a},${b})"><span class="kicker">${a}—${b}</span><h3>${verbs[a-1].base.split(' ')[0]} → ${verbs[b-1].base}</h3><p>看原形和中文，遮住说三态，翻开后自己判断。</p></button>`}).join('')}</div></section>`;
      if(recallPos>=recallQueue.length){markModule('recall',{count:recallQueue.length});return`${pageHead('这一组回忆完成','错误仍保留，连续正确两次才解决')}<section class="panel" data-phase="recall"><div class="empty"><strong>${recallQueue.length} 个完成</strong><p>下一步进入纸笔默写，检查是不是能真正写出来。</p><div class="btn-row"><button class="btn" onclick="chooseRecall()">换一组</button><button class="btn primary" onclick="chooseDictation()">去纸笔默写 →</button></div></div></section>`}
      const verb=recallQueue[recallPos];
      return`${pageHead('遮挡回忆卡',`第 ${recallPos+1} / ${recallQueue.length} 张${recallRetry?' · 原词重说':''}`)}<section class="panel" data-phase="recall"><div class="deck-nav">${Array.from({length:6},(_,i)=>{const a=i*5+1,b=a+4,done=Object.keys(state.seen).filter(n=>+n>=a&&+n<=b).length;return`<button class="${verb.n>=a&&verb.n<=b?'on':done===5?'done':''}" onclick="startRecall(${a},${b})">${a}—${b}<br>${done}/5</button>`}).join('')}</div>
      <div class="track-card" data-no="${String(verb.n).padStart(2,'0')}"><div class="word">${esc(verb.base)}</div><div class="ipa">${esc(verb.ipa)}</div><div class="meaning">${esc(verb.zh)}</div>
      ${recallRevealed?`<div class="forms">${form('三单',verb.third)}${form('现在分词',verb.ing)}${form('过去式',verb.past)}${form('过去分词',verb.pp)}</div><div class="tip"><b>记忆钩子：</b>${esc(verb.tip)}</div><div class="btn-row"><button class="btn danger" data-phase="repair" data-return-to-question="recall" onclick="rateRecall(false)">还没说对，重教原词</button><button class="btn primary" onclick="rateRecall(true)">遮住后能说对 →</button></div>`:
      `<div class="cover"><div><strong>先别翻：请开口说</strong><small>${verb.n===16?'can → 过去式':'原形 → 过去式 → 过去分词'}</small></div></div><div class="btn-row"><button class="btn" onclick="playVerb(${verb.n},false)">先听一遍</button><button class="btn primary wide" onclick="revealRecall()">我说完了，翻开核对</button></div>`}</div></section>`;
    }
    function form(label,value){return`<div class="form"><span>${label}</span><strong>${esc(value)}</strong></div>`}
    function revealRecall(){recallRevealed=true;state.seen[recallQueue[recallPos].n]=true;save();render();setTimeout(()=>playVerb(recallQueue[recallPos].n),100)}
    function rateRecall(correct){
      const verb=recallQueue[recallPos];updateField(verb,'triple',correct,'covered-recall',correct?'口述正确':'口述错误',`${verb.base}—${verb.past}—${verb.pp}`);tone(correct?'ok':'bad');
      if(correct){recallPos++;recallRetry=false;recallRevealed=false}else{recallRetry=true;recallRevealed=false;toast('不跳词：遮住后再说同一个原词')}
      render();scrollTo(0,0)
    }
    function chooseDictation(){dictQueue=[];dictPos=0;dictRevealed=false;dictWrong=new Set();dictRetry=false;route='dictation';render();scrollTo(0,0)}
    function startDictation(a,b){dictQueue=verbs.filter(x=>x.n>=a&&x.n<=b);dictPos=0;dictRevealed=false;dictWrong=new Set();dictRetry=false;render();scrollTo(0,0)}
    function dictationPage(){
      if(!dictQueue.length)return`${pageHead('报读纸笔默写','拿出纸和笔，再选今天的范围')}<section class="panel" data-phase="independent"><span class="pill">作业出口</span><h2>每次 10 个，或完整默写 30 个</h2><p>点“播放三态”，在纸上写三单、现在分词、过去式、过去分词和中文。写完后翻开逐栏核对。</p><div class="grid">${[[1,10],[11,20],[21,30],[1,30]].map(([a,b])=>`<button class="home-card" onclick="startDictation(${a},${b})"><span class="kicker">${a}—${b}</span><h3>${b-a+1} 个动词</h3><p>${a===1&&b===30?'完整作业检查':'分段完成，控制学习时长'}</p></button>`).join('')}</div></section>`;
      if(dictPos>=dictQueue.length){markModule('dictation',{count:dictQueue.length});return`${pageHead('纸笔默写完成','错栏已经进入 Kenton 专属回炉记录')}<section class="panel" data-phase="independent"><div class="empty"><strong>${dictQueue.length} 个完成</strong><p>错哪一栏，就按哪一栏继续回炉；一次答对不会抹掉历史错误。</p><div class="btn-row"><button class="btn primary wide" onclick="go('records')">查看错栏记录 →</button></div></div></section>`}
      const verb=dictQueue[dictPos];
      return`${pageHead('报读纸笔默写',`第 ${dictPos+1} / ${dictQueue.length} 个${dictRetry?' · 原词重默':''}`)}<section class="panel" data-phase="independent"><span class="pill">老师原表第 ${verb.n} 个</span>
      <div class="track-card" data-no="${String(verb.n).padStart(2,'0')}">${dictRevealed?`<div class="word">${esc(verb.base)}</div><div class="ipa">${esc(verb.ipa)}</div><div class="meaning">${esc(verb.zh)}</div>`:`<div class="cover"><div><strong>先听，再写在纸上</strong><small>原形 · 三单 · 现在分词 · 过去式 · 过去分词 · 中文</small></div></div>`}
      <div class="btn-row" style="justify-content:flex-start"><button class="btn gold" onclick="playVerb(${verb.n},false)">播放三态</button></div>
      <div class="paper-fields">${['third','ing','past','pp','zh'].map(field=>`<div class="paper-field"><span>${fieldName(field)}</span><strong>${dictRevealed?esc(verb[field]):'纸上完成 ______'}</strong></div>`).join('')}</div>
      ${dictRevealed?`<div class="tip"><b>记忆钩子：</b>${esc(verb.tip)}</div><p><b>点出写错的栏目；没有点的栏目按正确记录。</b></p><div class="field-checks">${['third','ing','past','pp','zh'].map(field=>`<button class="field-check ${dictWrong.has(field)?'wrong':''}" onclick="toggleField('${field}')">${fieldName(field)} ${dictWrong.has(field)?'× 写错':'✓ 写对'}</button>`).join('')}</div><div class="btn-row"><button class="btn primary wide" onclick="finishDictWord()">${dictWrong.size?'保存错栏，回到同一个词重默':'核对完成，下一个 →'}</button></div>`:
      `<div class="btn-row"><button class="btn primary wide" onclick="revealDict()">纸上写完了，翻开原表核对</button></div>`}</div></section>`;
    }
    function revealDict(){dictRevealed=true;render()}
    function toggleField(field){dictWrong.has(field)?dictWrong.delete(field):dictWrong.add(field);tone('tap');render()}
    function finishDictWord(){
      const verb=dictQueue[dictPos],hadWrong=dictWrong.size>0;
      ['third','ing','past','pp','zh'].forEach(field=>updateField(verb,field,!dictWrong.has(field),'paper-dictation',dictWrong.has(field)?'纸笔自评错误':'纸笔自评正确',verb[field]));
      tone(hadWrong?'bad':'ok');
      if(hadWrong){dictRetry=true;dictRevealed=false;dictWrong=new Set();toast('不跳词：先看钩子，再重默同一个原词')}else{dictPos++;dictRetry=false;dictRevealed=false;dictWrong=new Set()}
      render();scrollTo(0,0)
    }
    function tablePage(){
      const list=familyFilter==='all'?verbs:verbs.filter(x=>x.fam===familyFilter);
      return`${pageHead('老师原表 1—30','七个栏目与顺序保持不变')}<section class="panel"><div class="family-tabs"><button class="chip ${familyFilter==='all'?'on':''}" onclick="setFamilyFilter('all')">全部 30 个</button>${Object.entries(families).map(([key,data])=>`<button class="chip ${familyFilter===key?'on':''}" onclick="setFamilyFilter('${key}')">${data[0]}</button>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>#</th><th>原形 / 音标</th><th>三单</th><th>现在分词</th><th>过去式</th><th>过去分词</th><th>中文</th><th>听</th></tr></thead><tbody>${list.map(x=>`<tr><td>${x.n}</td><td>${esc(x.base)}<br><small>${esc(x.ipa)}</small></td><td data-label="三单">${esc(x.third)}</td><td data-label="现在分词">${esc(x.ing)}</td><td data-label="过去式">${esc(x.past)}</td><td data-label="过去分词">${esc(x.pp)}</td><td data-label="中文">${esc(x.zh)}</td><td><button class="audio-mini" onclick="playVerb(${x.n},false)" aria-label="朗读 ${esc(x.base)}">听</button></td></tr>`).join('')}</tbody></table></div><div class="btn-row"><button class="btn primary" onclick="startTrack(1)">回到三态轨道 →</button></div></section>`;
    }
    function setFamilyFilter(value){familyFilter=value;render()}
    function recordsPage(){
      const wrong=Object.values(state.wrongbook).filter(x=>x.errors>0).sort((a,b)=>a.n-b.n);
      return`${pageHead('错栏与学习记录','具体到每个动词、每一栏；连续正确两次才解决')}<section class="panel"><div class="metrics"><div class="metric"><strong>${Object.keys(state.seen).length}</strong><span>已听动词</span></div><div class="metric"><strong>${state.attempts.length}</strong><span>学习记录</span></div><div class="metric"><strong>${wrong.filter(x=>!x.solved).length}</strong><span>待回炉栏</span></div><div class="metric"><strong>${wrong.filter(x=>x.solved).length}</strong><span>已解决栏</span></div></div></section>
      <section class="panel"><h2>错栏明细</h2>${wrong.length?`<div class="wrong-list">${wrong.map(item=>`<div class="wrong-item"><div><strong>#${item.n} ${esc(item.base)} · ${fieldName(item.field)}</strong><small>错 ${item.errors} 次 · 连对 ${item.streak}/2</small></div><span class="status ${item.solved?'solved':'open'}">${item.solved?'已解决':'待回炉'}</span></div>`).join('')}</div>`:'<div class="empty"><strong>暂无错栏</strong><p>完成遮挡回忆或纸笔默写后，这里会精确记录。</p></div>'}
      <div class="btn-row"><button class="btn" onclick="downloadJson()">导出 JSON</button><button class="btn" onclick="downloadMarkdown()">导出学习汇报</button><button class="btn" onclick="document.getElementById('importFile').click()">导入记录</button><input id="importFile" type="file" accept="application/json" hidden onchange="importJson(event)"><button class="btn primary" onclick="chooseRecall()">重新回忆</button></div><p class="privacy">本机记录键包含 Kenton、软件名和版本；不会与 Eddey 或家长测试记录混用。</p></section>`;
    }
    function report(){
      const open=openWrong();
      return`# Kenton 不规则动词 1—30 学习汇报\n\n- 软件版本：${VERSION}\n- 最近学习：${state.lastOpened}\n- 已听三态：${Object.keys(state.seen).length}/30\n- 累计学习：${Math.round(state.totalMs/60000)} 分钟\n- 学习记录：${state.attempts.length}\n- 待回炉栏目：${open.length}\n\n## 待回炉\n${open.length?open.map(x=>`- #${x.n} ${x.base} · ${fieldName(x.field)}（错 ${x.errors} 次，连对 ${x.streak}/2）`).join('\n'):'- 无'}\n\n材料：${MATERIAL}\n`;
    }
    function download(name,type,text){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([text],{type}));link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
    function downloadJson(){download('kenton-irregular-verbs-1-30-record.json','application/json',JSON.stringify(state,null,2))}
    function downloadMarkdown(){download('kenton-irregular-verbs-1-30-report.md','text/markdown',report())}
    function importJson(event){
      const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();
      reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data?.child!=='Kenton'||data?.appId!==APP_ID||!Array.isArray(data.attempts)||typeof data.wrongbook!=='object')throw new Error();state={...defaultState(),...data,schema:2,version:VERSION};save();toast('记录导入成功');go('records')}catch(_){toast('导入失败：不是本软件的 Kenton 记录')}};
      reader.readAsText(file);event.target.value='';
    }
    function syncSoundButton(){const button=document.getElementById('soundToggle');if(!button)return;button.textContent=soundOn?'声':'静';button.setAttribute('aria-label',soundOn?'关闭点击反馈音':'打开点击反馈音')}
    document.getElementById('soundToggle').addEventListener('click',()=>{soundOn=!soundOn;localStorage.setItem('study:kenton:ui-sound',soundOn?'1':'0');if(soundOn)tone('ok');syncSoundButton()});
    Object.assign(window,{go,startTrack,playVerb,coverTrack,revealTrack,nextTrack,openFamilyVerb,markFamilies,chooseRecall,startRecall,revealRecall,rateRecall,chooseDictation,startDictation,revealDict,toggleField,finishDictWord,setFamilyFilter,downloadJson,downloadMarkdown,importJson});
    render();
  })();
  </script>
</body>
</html>
