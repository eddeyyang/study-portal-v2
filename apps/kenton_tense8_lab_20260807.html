<script>
'use strict';
const APP_ID='kenton-tense8-lab-20260807';
const VERSION='1.0.0';
const STORAGE_KEY='study:kenton:'+APP_ID+':v1';
const MATERIAL='2026-08-07 周课：八大时态（老师：做题一定要划出时间词，在家好好背时间词）+ 四个花费用法（用法已会，细节要抠）· 教材第9章动词时态表';
const AUDIO_DIR='audio/kenton_tense8_lab_20260807/';
/* 八大时态（老师课堂口径；构成与信号词取自教材第9章时态表） */
const TENSES=[
 {k:'usual',name:'① 一般现在时',form:'V原 / 三单(+s、+es、y→ies)',sig:'always · usually · often · every day · on Sundays',ex:'He goes to school every day.',hl:'goes',cn:'他每天去上学。（经常、真理、时刻表）'},
 {k:'past',name:'② 一般过去时',form:'V-ed / 不规则',sig:'yesterday · last… · …ago · just now',ex:'I saw a film yesterday.',hl:'saw',cn:'我昨天看了场电影。'},
 {k:'future',name:'③ 一般将来时',form:'will + 原形 / be going to',sig:'tomorrow · next… · soon · in+时段',ex:'We will have a picnic tomorrow.',hl:'will have',cn:'我们明天要去野餐。'},
 {k:'now',name:'④ 现在进行时',form:'be + doing',sig:'now · Look! · Listen! · at the moment',ex:'Look! They are playing football.',hl:'are playing',cn:'看！他们正在踢足球。'},
 {k:'pastc',name:'⑤ 过去进行时',form:'was/were + doing',sig:'at that time · this time yesterday · when+过去',ex:'I was reading at that time.',hl:'was reading',cn:'那时我正在看书。'},
 {k:'prf',name:'⑥ 现在完成时',form:'have/has + 过去分词',sig:'already · just · yet · ever · never · since · for',ex:'I have already finished my homework.',hl:'have finished',cn:'我已经写完作业了。'},
 {k:'pastp',name:'⑦ 过去完成时',form:'had + 过去分词',sig:'by the time · before+过去',ex:'The train had left before we arrived.',hl:'had left',cn:'我们到之前火车已经开了。（过去的过去）'},
 {k:'futp',name:'⑧ 过去将来时',form:'would + 原形',sig:'said/asked 后的宾语从句',ex:'He said he would come back soon.',hl:'would come',cn:'他说他很快会回来。'}
];
/* 时间词金库：0=过去家族 1=现在家族 2=将来家族 3=完成家族 */
const BANK=[
 {w:'yesterday',f:0},{w:'last week',f:0},{w:'three days ago',f:0},{w:'just now',f:0},{w:'at that time',f:0},
 {w:'always',f:1},{w:'every day',f:1},{w:'now',f:1},{w:'Look!',f:1},{w:'at the moment',f:1},
 {w:'tomorrow',f:2},{w:'next year',f:2},{w:'soon',f:2},
 {w:'already',f:3},{w:'yet',f:3},{w:'since last year',f:3}
];
const FAMS=[{n:'⏪ 过去家族',s:'一般过去/过去进行',c:'#c2377f'},{n:'📍 现在家族',s:'一般现在/现在进行',c:'#a86a00'},{n:'🚀 将来家族',s:'一般将来',c:'#1d4ed8'},{n:'✅ 完成家族',s:'现在完成/过去完成',c:'#157a3e'}];
/* 划词判态：先点时间词，再选动词。tset=时间词token下标，空数组=没有时间词 */
const MARK=[
 {tk:['He','___','TV','every','evening.'],tset:[3,4],opts:['watches','watch','is watching','watched'],a:0,why:'every evening 是"每天"→习惯，一般现在时；he 是三单，watch→watches（ch结尾+es）。'},
 {tk:['Look!','The','boys','___','football.'],tset:[0],opts:['are playing','play','played','will play'],a:0,why:'Look! 一出现就是"正在看"→现在进行时 be+doing；boys 复数用 are。'},
 {tk:['I','___','my','grandparents','last','Sunday.'],tset:[4,5],opts:['visited','visit','am visiting','will visit'],a:0,why:'last Sunday 是过去信号→一般过去时，visit→visited。'},
 {tk:['We','___','a','picnic','tomorrow.'],tset:[4],opts:['will have','have','had','have had'],a:0,why:'tomorrow 是将来信号→will+原形。'},
 {tk:['She','___','her','homework','already.'],tset:[4],opts:['has finished','finishes','finished','will finish'],a:0,why:'already 是现在完成时信号→have/has+过去分词；she 用 has。'},
 {tk:['They','___','English','at','this','time','yesterday.'],tset:[3,4,5,6],opts:['were learning','learn','are learning','have learned'],a:0,why:'at this time yesterday=昨天这个时候（正在做）→过去进行时 was/were+doing；they 用 were。'},
 {tk:['The','train','___','when','we','got','to','the','station.'],tset:[3],opts:['had left','left','has left','will leave'],a:0,why:'when we got…给出"过去的参照点"，火车在那时"之前"已开→过去的过去，had+过去分词。'},
 {tk:['He','said','he','___','back','soon.'],tset:[1],opts:['would come','will come','comes','came'],a:0,why:'said 是过去——站在过去说"很快会"，宾语从句用过去将来时 would+原形。'},
 {tk:['Listen!','Someone','___','at','the','door.'],tset:[0],opts:['is knocking','knocks','knocked','has knocked'],a:0,why:'Listen! 和 Look! 一样是进行时信号→be+doing；someone 当单数用 is。'},
 {tk:['Light','___','faster','than','sound.'],tset:[],opts:['travels','traveled','is traveling','will travel'],a:0,why:'这句没有时间词！想想是不是"真理/事实"——光比声音快是真理，真理永真，用一般现在时。'}
];
/* 四个花费（老师课堂口径：用法已会，抠小细节） */
const SPENDCARDS=[
 {cls:'w1',icon:'💸 spend',formula:'人 + spend + 时间/钱 + on sth / (in) doing',tip:'主语是<b>人</b>｜过去式 spent｜I spend two hours on my homework.',say:'I spend two hours on my homework.'},
 {cls:'w2',icon:'🏷️ cost',formula:'物 + cost + (人) + 钱',tip:'主语是<b>物</b>，不能是人｜三态同形 cost｜The book costs (me) twenty yuan.',say:'The book costs me twenty yuan.'},
 {cls:'w3',icon:'💰 pay',formula:'人 + pay + 钱 + for sth',tip:'主语是<b>人</b>｜<b>for 不能丢</b>｜过去式 paid（不是 payed）｜I paid twenty yuan for the book.',say:'I paid twenty yuan for the book.'},
 {cls:'w4',icon:'⏳ take',formula:'It takes/took + 人 + 时间 + to do',tip:'<b>It 开头</b>（形式主语）｜后面接 <b>to do</b>｜It takes me two hours to do my homework.',say:'It takes me two hours to do my homework.'}
];
const SPDRILL=[
 {task:'选动词',s:'这本书花了我 20 元。The book ___ me 20 yuan.',opts:['costs','spends','pays'],a:0,why:'主语 the book 是"物"→cost；spend/pay 的主语必须是人。'},
 {task:'选动词',s:'我每天花一小时读书。I ___ an hour (in) reading every day.',opts:['spend','cost','take'],a:0,why:'人+spend+时间+(in) doing；cost 主语是物，take 要用 It 开头。'},
 {task:'选搭配',s:'他付了 100 元买这双鞋。He ___ 100 yuan ___ the shoes.',opts:['paid; for','paid; /','payed; for'],a:0,why:'pay 的过去式是 paid（y变i+d，不是 payed）；pay for 的 for 不能丢。'},
 {task:'选句型',s:'做作业花了我两小时。___ me two hours to do my homework.',opts:['It took','I took','It cost'],a:0,why:'"花（时间）做某事"= It takes/took + 人 + 时间 + to do，必须 It 开头。'},
 {task:'选搭配',s:'spend 后面能接哪个？',opts:['on books / (in) reading','to read','for books'],a:0,why:'spend…on sth 或 (in) doing sth；接 to do 的是 take；接 for 的是 pay。'},
 {task:'考细节',s:'cost 的过去式是？',opts:['cost','costed','costs'],a:0,why:'cost 三态同形：cost—cost—cost，别加 -ed。'},
 {task:'考细节',s:'"为某物付款"pay 后面哪个介词不能丢？',opts:['for','on','to'],a:0,why:'pay (钱) for sth；on 是 spend 的搭档，别串门。'},
 {task:'选动词',s:'哪个词的主语必须是"物/事"，不能是人？',opts:['cost','spend','pay'],a:0,why:'人花钱用 spend/pay；cost 的主语是物——The bag costs 50 yuan. ✔，I cost 50 yuan. ✘'}
];
const QUIZ=[
 {cat:'时间词→时态',q:'看到 yesterday / last week / …ago，该用什么时态？',opts:['一般过去时','一般现在时','现在完成时'],a:0,why:'yesterday、last…、…ago、just now 都是一般过去时信号，动词用过去式。'},
 {cat:'时间词→时态',q:'看到 Look! / Listen! / now，该用什么时态？',opts:['现在进行时 be+doing','一般现在时','一般将来时'],a:0,why:'Look!、Listen!、now、at the moment → 此刻正在发生 → be+doing。'},
 {cat:'时间词→时态',q:'already、just、yet、since、for 是哪个时态的信号？',opts:['现在完成时 have/has+pp','一般过去时','过去进行时'],a:0,why:'already/just/yet/ever/never/since/for → have/has+过去分词。'},
 {cat:'时间词→时态',q:'at this time yesterday（昨天这个时候）该用？',opts:['过去进行时 was/were+doing','一般过去时','现在进行时'],a:0,why:'"过去某一时刻正在做"→过去进行时。'},
 {cat:'时间词→时态',q:'every day、always、on Sundays 该用？',opts:['一般现在时','现在进行时','一般将来时'],a:0,why:'经常、习惯、真理 → 一般现在时；注意三单 +s/+es。'},

 {cat:'构成',q:'He said he ___ back soon.（过去将来时）',opts:['would come','will come','comes'],a:0,why:'said 是过去，站在过去看将来 → would+原形，常用于宾语从句。'},
 {cat:'花费',q:'The new bag ___ my mother 200 yuan.（包花了妈妈200元）',opts:['cost','spend','pay'],a:0,why:'主语是"物"（bag）→ cost；人称主语才用 spend/pay。'},

function audioHash(s){const b=new TextEncoder().encode(s);let x=0x811c9dc5>>>0;for(let i=0;i<b.length;i++){x^=b[i];x=Math.imul(x,0x01000193)>>>0;}return ('0000000'+x.toString(16)).slice(-8);}

 try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}
 const a=getAudio();let done=false;

  try{if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.85;window.speechSynthesis.speak(u);}catch(e){}};
 a.onerror=fb;a.onended=function(){done=true;};
 a.src=AUDIO_DIR+audioHash('en|'+text)+'.mp3';
 try{a.currentTime=0;}catch(e){}
 const p=a.play();if(p&&typeof p.catch==='function')p.catch(fb);}
function shuffled(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

 +'<div class="fb" id="sfb"></div>'
 +'<button class="btn btn-teal hidden" id="snext" onclick="spendNext()">'+(sIdx<SPDRILL.length-1?'下一题 →':'收工报告 →')+'</button>'
 +'</div>'
 +'<div class="progress"><i style="width:'+(sIdx/SPDRILL.length*100)+'%"></i></div>');
}
window.spendPick=function(i){
 const t=SPDRILL[sIdx];const ok=i===t.a;
 document.querySelectorAll('.opt').forEach(function(o){o.style.pointerEvents='none';});
 document.getElementById('sopt'+t.a).classList.add('ok');
 const fb=document.getElementById('sfb');
 if(ok){sOk++;tone('ok');fb.className='fb ok';fb.textContent='✅ '+t.why;}
 else{document.getElementById('sopt'+i).classList.add('no');tone('no');fb.className='fb no';fb.textContent='💡 '+t.why;}
 recordAttempt('spend',t.s,ok);
 document.getElementById('snext').classList.remove('hidden');
};
window.spendNext=function(){sIdx++;spendCard();};
/* ---- 5 遮挡回忆 ---- */
function recall(){
 el(head('第 5 站 · 遮挡回忆','先在心里说答案，再点开核对',null,1)
 +'<div class="card">'+RECALL.map(function(c,i){
  return '<div class="recall-card" id="rc'+i+'"><div class="q">'+(i+1)+'. '+c.q+'</div>'
  +'<div class="tap" onclick="document.getElementById(\'rc'+i+'\').classList.toggle(\'open\')">先自己说，再点开 👆</div>'
  +'<div class="a">'+c.a+'</div></div>';}).join('')
 +'<button class="btn btn-pink" onclick="go(\'quiz\')">回忆完成，参加通关考 →</button></div>');
}
/* ---- 6 通关考 ---- */
let qIdx=0,qScore=0,qLock=false;
function quiz(){qIdx=0;qScore=0;quizCard();}
function quizCard(){
 const q=QUIZ[qIdx];qLock=false;
 el(head('🏆 通关考 · 八时态 + 四花费','第 '+(qIdx+1)+' / '+QUIZ.length+' 题 · 心里先划时间词，再作答',null,1)
 +'<div class="card"><span class="tag amber">'+q.cat+'</span>'
 +'<div style="font-size:19px;font-weight:800;line-height:1.8;margin-top:4px">'+q.q+'</div>'
 +q.opts.map(function(o,i){return '<button class="opt" id="opt'+i+'" onclick="answer('+i+')"><span class="k">'+'ABC'[i]+'</span>'+o+'</button>';}).join('')
 +'<div class="fb" id="qfb"></div>'
 +'<button class="btn btn-pink hidden" id="qnext" onclick="quizNext()">'+(qIdx<QUIZ.length-1?'下一题 →':'🏆 看成绩 →')+'</button>'
 +'</div>'
 +'<div class="progress"><i style="width:'+(qIdx/QUIZ.length*100)+'%"></i></div>');
}
window.answer=function(i){
 if(qLock)return;qLock=true;
 const q=QUIZ[qIdx];const ok=i===q.a;
 document.getElementById('opt'+q.a).classList.add('ok');
 const fb=document.getElementById('qfb');
 if(ok){qScore++;tone('ok');fb.className='fb ok';fb.textContent='✅ '+q.why;}
 else{document.getElementById('opt'+i).classList.add('no');tone('no');fb.className='fb no';fb.textContent='💡 '+q.why;}
 recordAttempt('quiz',q.q,ok);
 document.getElementById('qnext').classList.remove('hidden');
};
window.quizNext=function(){
 if(qIdx<QUIZ.length-1){qIdx++;quizCard();return;}
 finishStage('quiz');
 const pct=Math.round(qScore/QUIZ.length*100);
 el(head('🏆 通关成绩单',null,null,1)
 +'<div class="card" style="text-align:center">'
 +'<div class="big">'+(pct>=80?'🏆🕰️':pct>=60?'💪🕰️':'📖🕰️')+'</div>'
 +'<div class="big" style="font-size:25px;margin-top:8px">通关考 '+qScore+' / '+QUIZ.length+'</div>'
 +'<div class="owl" style="text-align:left;margin-top:12px">🦉 <b>猫头鹰博士：</b>'+(pct>=80?
  '"先划时间词再答题——这个习惯会救你无数次！花费细节也抠干净了，跟老师报喜吧！"'
  :'"错哪站补哪站：时态混回时态地图，时间词不熟回金库，花费细节回四兄弟。80 分拿金奖杯，再来一次！"')+'</div>'
 +badges()
 +'<div class="taprow"><button class="btn btn-soft" onclick="go(\'home\')">回首页</button>'
 +'<button class="btn btn-pink" onclick="go(\'quiz\')">再考一次</button></div>'
 +'</div>');
};
function finishStage(k){S.done[k]=true;save();}
window.finishStage=finishStage;
/* ---- 学习档案 ---- */
function records(){
 const okN=S.attempts.filter(function(a){return a.ok}).length;
 const rows=S.attempts.slice(-30).reverse().map(function(a){
  return '<div style="font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)">'+(a.ok?'✅':'❌')+' ['+a.kind+'] '+a.key+'<span style="color:#9a94b0"> · '+new Date(a.t).toLocaleString('zh-CN',{hour12:false})+'</span></div>';}).join('');
 el(head('学习档案','本次练习记录','',1)
 +'<div class="card">'
 +'<div class="sub">完成环节：'+(Object.keys(S.done).filter(function(k){return S.done[k]}).join('、')||'（暂无）')+'</div>'
 +'<div class="sub" style="margin-top:6px">总作答：'+S.attempts.length+' 次 · 正确 '+okN+' 次</div>'
 +'<div style="margin-top:10px">'+(rows||'<div class="sub">还没有作答记录。</div>')+'</div>'
 +'<div class="taprow"><button class="btn btn-soft" onclick="dlJson()">导出 JSON</button>'
 +'<button class="btn btn-soft" onclick="dlMd()">导出 Markdown</button></div>'
 +'</div>');
}
function dl(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
window.dlJson=function(){dl('kenton-tense8-lab-record.json',JSON.stringify({app:APP_ID,material:MATERIAL,exported:new Date().toISOString(),state:S},null,1),'application/json');};
window.dlMd=function(){
 let md='# Kenton 八大时态实验室记录\n\n- 材料：'+MATERIAL+'\n- 作答：'+S.attempts.length+' 次，正确 '+S.attempts.filter(function(a){return a.ok}).length+' 次\n\n| 时间 | 环节 | 内容 | 结果 |\n|---|---|---|---|\n';
 S.attempts.forEach(function(a){md+='| '+new Date(a.t).toLocaleString('zh-CN',{hour12:false})+' | '+a.kind+' | '+a.key+' | '+(a.ok?'对':'错')+' |\n';});
 dl('kenton-tense8-lab-report.md',md,'text/markdown');
};
document.getElementById('soundToggle').addEventListener('click',function(){soundOn=!soundOn;localStorage.setItem('study:kenton:ui-sound',soundOn?'1':'0');this.textContent=soundOn?'声':'静';if(soundOn)tone('ok');});
document.getElementById('soundToggle').textContent=soundOn?'声':'静';
Object.assign(window,{go,speak,TENSES});
home();
})();
</script>
</body>
