需要？孩子怎样发现并试着改变？"},{"lessonId":"tianji","question":"马没有换，哪三场对阵变了？为什么只赢一场还不够？"}]}},"scope":"先按实际学到的位置衔接，再用酒店早晨和车上时间分段学。后续备课库不等于旅途必做清单；老师实际漏课清单尚未确认。","sources":[{"title":"金牌训练·学习笔记同步教材·五年级语文上","pages":"P60–124","note":"按学字词、讲课文、划重点、理结构、做课后题的顺序改编；按用户要求录入所选课文全文，段落讲解与自测为原创。"}],"lessons":[{"id":"kenton-speed","title":"什么比猎豹的速度更快","date":"2026-09-15","minutes":32,"bookPages":"P60—66","goal":"找出谁比谁快，读懂比较和数字；遇到删词题，能说出意思怎样变了。","source":"Kenton 五年级上语文《金牌训练》P60—66；part03 P60—64、part04 P65—66；P60—62 字表已对原图。","sourceNotes":["按原书学基础、讲课文、划重点、结构主旨、解习题顺序原创改述。","本课各速度数据均作为课文内容理解，保留条件和单位；不是实时测速资料。","P65未写水中事物的问答保留选材考向；不把原书关于水中速度的概括扩写为普遍科学定律。","原书未单列向课文学写法，本课把列数字、作比较、过渡句放回相关段落讲。"],"steps":[{"id":"sp01","phase":"teach","type":"teach","title":"今天读懂一场速度接力","kicker":"① 学基础 · P60—62","body":"先认识容易卡住的字词。再找每段“谁比谁快”，最后练怎样把理由说清楚。","source":"P60—62：目标、作者、字词","detail":["作者罗伯特·E.威尔斯是一位美国儿童画家。本课用我们熟悉的跑步，带我们认识越来越快的事物。阅读目标：借关键词句把握内容；提出自己的问题。","会写字自查：赛（sài，赛跑）、冠（guàn，冠军）、超（chāo，超过）、箭（jiàn，火箭）。用眼睛找结构，不要求现在默写整组。“赛”下面是贝；“箭”上面是竹字头，下面是前。","会认字自查：鸵（tuó，鸵鸟）、冠（guàn，冠军）、隼（sǔn，游隼）、瀚（hàn，浩瀚）、啸（xiào，呼啸）。“隼”读平舌音 sǔn。","多音字：衣冠 guān／冠军 guàn；喷泉 pēn／喷香 pèn；圆圈 quān／羊圈 juàn。先看词的意思，再选读音。","词语表：赛跑、冠军、超过、火箭、速度、高度、摆脱、发动机。俯冲是很快地向下飞；摆脱是脱离束缚或困难；浩瀚形容广大；难以置信是很难相信。","词义自查：俯冲—向下冲，摆脱—挣脱，呼啸—发出高而长的声音；前进和后退、静止和运动意思相反。词义要放回句子，不能随便把近义词换进去。"],"reading":{"title":"把速度课完整读明白","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"开头：从自己跑步想起","text":"假如你参加赛跑，你会觉得自己很快。但把人、鸵鸟和猎豹放到一起，就会发现“快”要有比较对象。文章先用你熟悉的跑步引路，再带你认识不熟悉的速度。"},{"label":"陆地三棒：人、鸵鸟、猎豹","text":"按课文给定的数据，人的最大奔跑速度为每小时44千米，鸵鸟约为72千米，猎豹最大可达110千米。后一段接住前一段的对象，再介绍更快的对象。说“最大”是说能达到的高值，不等于总保持这样的速度。"},{"label":"飞到空中：游隼和飞机","text":"游隼向下俯冲时，速度超过每小时320千米。这里改变了运动条件，不能说它平常飞行一直这么快。随后文章转向高速喷气式飞机，并用飞行高度上的声速作参照；声音也成了比较对象。"},{"label":"继续提问：怎样去月球","text":"飞机已很快，可文章把目的地换成月球，于是引出更快的火箭。文中介绍火箭最大速度可达每小时4万千米，又提到进入太空后关掉发动机仍能前进。后一句提出了值得继续探究的现象，文章没有把原因全讲完。"},{"label":"进入太空：流星体超过火箭","text":"文章再用提问制造悬念，然后介绍流星体。其中一部分最大速度可达每小时25万千米。和这样的流星体相比，火箭仿佛没有动；这是相差悬殊带来的感觉，不是火箭真的停止。"},{"label":"最后一棒：光回到身边","text":"作者最后用手电筒的光把话题拉回生活。课文给出的光速约为每秒30万千米，又用一秒绕赤道数圈的设想帮助读者想象。注意，这里从“每小时”换成了“每秒”。"},{"label":"把全文接起来","text":"按文中给定条件，一条主线是：人→鸵鸟→猎豹→游隼→喷气式飞机→火箭→流星体→光。每次比较都借助刚认识的对象，新对象就不显得完全陌生。标题从猎豹发问，全文不断回答“还有谁更快”。"},{"label":"阅读题要用的短引","text":"原句关键词：“有的”“最大”“大约”“向下俯冲时”。比较时要同时保留对象、数值、单位和条件。考试让你解释一个词能不能删，实际在检查删前删后意思是否相同。"}]},"tutorial":[{"title":"这课先解决什么","text":"“很快”到底有多快？今天把速度说清，再学会解释句子里的条件词。"},{"title":"先认会挡路的词","text":"游隼读 yóu sǔn；俯冲是快速向下飞；浩瀚形容广大。看到词就想到动作或画面。"},{"title":"会写字怎样记","text":"赛：下面是贝；冠：冠军读 guàn；超：走字旁；箭：竹字头下面是前。先认准，再到后面的例句里用。"},{"title":"你将怎样学","text":"先看三种动物的比较，再亲手切换条件；最后不用选项，把理由说成自己的话。"}]},{"id":"sp02","phase":"guided","type":"choice","title":"这只游隼在做什么？","kicker":"① 学基础 · 用进句子","body":"游隼从高空迅速向下扑向目标。哪个词最贴切？","source":"P61—62：隼、俯冲","options":[{"id":"a","text":"俯冲"},{"id":"b","text":"静止"},{"id":"c","text":"缓缓上升"}],"answer":"a","explanation":"“俯”指向下。这里既有向下的方向，又有很快的速度。","repair":{"gap":"先看它朝哪里飞。","reason":"俯冲是快速向下，不只是飞得快。","check":"找出同时写出方向和速度的词。"},"reference":"俯冲。读游隼时，“隼”读 sǔn。"},{"id":"sp03","phase":"teach","type":"teach","title":"先从你熟悉的跑步说起","kicker":"② 讲课文 · 第1—3段","body":"人 → 鸵鸟 → 猎豹，速度一层比一层快。每次有了参照，“快”就不再只是一个感觉。","source":"P62—63：第1—3自然段","detail":["第1段先请你想象自己参加赛跑，再说人跑不过猎豹和鸵鸟。这是在用人熟悉的经验，准备后面的比较。","第2段把人的最大奔跑速度44千米每小时，与鸵鸟约72千米每小时放在一起。数字让差别具体；“约”保留估计的意思。“两条腿的动物里面”给冠军圈定了范围。","第3段接过上一段的鸵鸟，引出猎豹。课文给出猎豹最大速度可达110千米每小时，突出它在陆地动物奔跑中的速度。这里说最大速度，不是说猎豹一直能这样跑。","连接段落的关键句，前半接住“鸵鸟”，后半引出“猎豹”。这样的句子像接力：告诉你上一棒是谁、下一棒是谁。"],"tutorial":[{"title":"先读熟悉对象","text":"人的速度能给你一个起点。把44和72放在相同单位下，便看出鸵鸟比人快。"},{"title":"新对象接住旧对象","text":"下一段借鸵鸟介绍猎豹。读每段时，先圈出旧对象和新对象。","evidence":"教学转述：鸵鸟已经很快，猎豹还能更快。"},{"title":"关键句有什么用","text":"只记一串数字容易散。抓住“谁比谁快”，就能连成全文顺序。","example":"我看到本段拿猎豹和鸵鸟比较，就知道本段在介绍猎豹的速度。"}],"reading":{"title":"把速度课完整读明白","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"开头：从自己跑步想起","text":"假如你参加赛跑，你会觉得自己很快。但把人、鸵鸟和猎豹放到一起，就会发现“快”要有比较对象。文章先用你熟悉的跑步引路，再带你认识不熟悉的速度。"},{"label":"陆地三棒：人、鸵鸟、猎豹","text":"按课文给定的数据，人的最大奔跑速度为每小时44千米，鸵鸟约为72千米，猎豹最大可达110千米。后一段接住前一段的对象，再介绍更快的对象。说“最大”是说能达到的高值，不等于总保持这样的速度。"}]}},{"id":"sp04","phase":"guided","type":"model","title":"接上“谁比谁快”","kicker":"② 讲课文 · 动手看关系","body":"点相邻的两个事物，找连接它们的比较。再试着去掉条件词，看一句话会不会说得太满。","source":"P63—64：第2—8段关键句","model":"speed","config":{"purpose":"把相邻对象与比较关系连起来；限定词切换必须同步显示意义变化。","sequence":["人","鸵鸟","猎豹","游隼","喷气式飞机","火箭","流星体","光"],"direction":"从慢到快，按课文介绍的条件","pairs":[{"from":"人","to":"鸵鸟","evidence":"人最大44千米每小时；鸵鸟最大约72千米每小时。"},{"from":"鸵鸟","to":"猎豹","evidence":"猎豹比鸵鸟跑得更快，最大可达110千米每小时。"},{"from":"猎豹","to":"游隼","evidence":"游隼向下俯冲时超过320千米每小时；这里比较俯冲和奔跑。"},{"from":"游隼","to":"喷气式飞机","evidence":"课文用高速喷气式飞机接过游隼这一棒。"},{"from":"喷气式飞机","to":"火箭","evidence":"课文介绍的火箭，比喷气式飞机快得多。"},{"from":"火箭","to":"流星体","evidence":"有的流星体最大速度可达25万千米每小时，比课文中的火箭快。"},{"from":"流星体","to":"光","evidence":"光约30万千米每秒，比流星体快得多；注意单位变了。"}],"qualifiers":[{"word":"陆地上","with":"猎豹是陆地上跑得最快的动物。","without":"猎豹是跑得最快的动物。","effect":"删去“陆地上”，比较范围从陆地动物扩大了，不再保留原句的范围限制。"},{"word":"有的","with":"有的流星体运动的最大速度能达到25万千米每小时。","without":"流星体运动的最大速度能达到25万千米每小时。","effect":"把其中一部分的情况，说成了整个类别的共同情况。"},{"word":"大约","with":"在课文给定的飞行高度，声速大约是1050千米每小时。","without":"在课文给定的飞行高度，声速是1050千米每小时。","effect":"把估计值，说成了一个确定不变的数值。"}]}},{"id":"sp05","phase":"guided","type":"open","title":"不用选项，把关系讲回来","kicker":"② 讲课文 · 你来解释","body":"只用人、鸵鸟、猎豹这三棒。讲讲作者为什么不只说“猎豹很快”。","source":"P62—63：作比较的作用","prompt":"你可以说一句，也可以写下来：有了人和鸵鸟，读者怎样更容易懂猎豹的“快”？","reference":"人和鸵鸟给我们参照，再用具体速度一步步比较，猎豹的快就容易想清楚。只说“很快”，不知道究竟快到什么程度。","checklist":["说到先用熟悉的对象作参照","说出比较让“快多少／有多快”更具体"],"tutorial":[{"title":"题目在问什么","text":"题目没有让你再背一次速度表。它问：比较怎样帮助读者理解？"},{"title":"先找同单位证据","text":"人44、鸵鸟约72、猎豹最大110，都是千米每小时。熟悉的对象加上数字，差距就可想象。"},{"title":"把证据变成解释","text":"先说用什么作参照，再说读者因此懂了什么。不要只写“作比较，生动形象”。"}],"responseSupport":[{"label":"找参照","text":"作者先拿人和鸵鸟作参照，","why":"先回答“拿什么比较”；后半句由你解释。"},{"label":"说作用","text":"这样，读者就能看出","why":"后面接具体差距，别只接“更加生动”。"}]},{"id":"sp06","phase":"teach","type":"teach","title":"离开地面，比较条件变了","kicker":"② 讲课文 · 第4—5段","body":"游隼赢的是“向下俯冲”这一项。接着，作者又把游隼、飞机和声音放到一起比较。","source":"P63：第4—5自然段","detail":["第4段介绍游隼俯冲速度超过320千米每小时，还用高速公路上的汽车作参照。这里不能漏掉“向下俯冲时”，也不能把它偷换成游隼平常一直这样飞。","第5段用“不过”转折，从游隼接到飞机。在喷气式飞机飞行的高度，课文给出的声速大约是1050千米每小时；一些高速喷气式飞机可达声速的数倍。","课文还设想：声音追不上前方以超音速离开的人。这个生活化的想象，是帮助读者理解速度差异；做阅读题时仍要注意具体条件。","读关键句，先找比较双方；读数字，再找单位；读结论，检查“俯冲时、一些、大约”有没有被漏掉。"],"tutorial":[{"title":"俯冲不是平飞","text":"游隼从高处向下冲，与平常平飞不是同一种状态。比较时先把状态带上。"},{"title":"单位相同才直接看数","text":"超过320与大约1050都以千米每小时计。单位若改变，不能只看数字大小。"},{"title":"读快仍要保留条件","text":"“向下俯冲时”管状态，“大约”管数值的精确程度。快读不是把小词略掉。"}],"reading":{"title":"把速度课完整读明白","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"飞到空中：游隼和飞机","text":"游隼向下俯冲时，速度超过每小时320千米。这里改变了运动条件，不能说它平常飞行一直这么快。随后文章转向高速喷气式飞机，并用飞行高度上的声速作参照；声音也成了比较对象。"}]}},{"id":"sp07","phase":"teach","type":"teach","title":"去月球，需要再快一棒","kicker":"② 讲课文 · 第6段","body":"作者先问“要去月球怎么办”，再引出火箭。新问题把下一段自然接了出来。","source":"P64：第6自然段","detail":["上一段的飞机已经很快，但作者把目的地换成月球，让读者产生新的需要：还得有更快的工具。火箭就这样被引出来。","课文介绍火箭的速度要比喷气式飞机快得多，给出的最大速度是4万千米每小时，约为课文所说声速的30多倍。读数时要保留“最大”“多”等词。","进入太空后，课文说火箭关掉发动机仍可前进。这是文中提出的一个现象，可以把“为什么还会前进”记作自己的科学问题；本课先学会从文字中找到这一信息。"],"tutorial":[{"title":"先看段落怎样转弯","text":"作者不突然堆一个火箭数字，而是先问去月球要怎么办。"},{"title":"问题带出新对象","text":"目的地变远，原来的飞机不能承担这个任务，新的介绍就自然接到火箭。"},{"title":"会提问也要分边界","text":"“发动机关了还前进”是文中现象。它为什么发生，需要再查科学资料；不要把猜测当本课给出的答案。"}],"reading":{"title":"把速度课完整读明白","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"继续提问：怎样去月球","text":"飞机已很快，可文章把目的地换成月球，于是引出更快的火箭。文中介绍火箭最大速度可达每小时4万千米，又提到进入太空后关掉发动机仍能前进。后一句提出了值得继续探究的现象，文章没有把原因全讲完。"}]}},{"id":"sp08","phase":"teach","type":"teach","title":"最快的一棒，原来就在身边","kicker":"② 讲课文 · 第7—8段","body":"流星体让火箭显得很慢。最后，手电筒的光接过这一棒：从遥远太空，又回到你的生活。","source":"P64：第7—8自然段","detail":["第7段先用一个问句引起好奇，再揭开流星体的名字。有的流星体最大速度能达到25万千米每小时，是课文所说火箭最大速度的6倍多。","火箭“好像”静止，是拿它同更快的流星体比较产生的感觉。它并没有真的停住。回答词句题时，要分清比较后的感受和实际状态。","第8段先顺着读者的猜测，再告诉我们还有更快的光。作者用手电筒这样熟悉的东西，让遥远的速度问题回到眼前。","课文写光速大约30万千米每秒，又设想一秒沿赤道转7圈多。数字、比较和能想象的场景，一起帮助读者感到惊讶。这里是每秒，前面的主要数据是每小时。"],"tutorial":[{"title":"“好像没动”是真的吗","text":"不是。原来就很快的火箭遇到更快的参照，才显得慢。"},{"title":"光为什么最后出场","text":"它是这条比较链的最后一棒；又用手电筒把遥远的太空拉回身边。"},{"title":"遇到数字停一眼","text":"25万后面是每小时，30万后面是每秒。完整信息是数值加单位，不能只圈两个数字。"}],"reading":{"title":"把速度课完整读明白","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"进入太空：流星体超过火箭","text":"文章再用提问制造悬念，然后介绍流星体。其中一部分最大速度可达每小时25万千米。和这样的流星体相比，火箭仿佛没有动；这是相差悬殊带来的感觉，不是火箭真的停止。"},{"label":"最后一棒：光回到身边","text":"作者最后用手电筒的光把话题拉回生活。课文给出的光速约为每秒30万千米，又用一秒绕赤道数圈的设想帮助读者想象。注意，这里从“每小时”换成了“每秒”。"}]}},{"id":"sp09","phase":"independent","type":"choice","title":"两个数字，先看哪里？","kicker":"② 讲课文 · 检查细节","body":"流星体25万千米每小时，光约30万千米每秒。比较前，最不能漏看什么？","source":"P64：第7—8段速度单位","options":[{"id":"a","text":"先看谁的名字更长"},{"id":"b","text":"先看“每小时”和“每秒”"},{"id":"c","text":"只看25和30"}],"answer":"b","explanation":"一个算1小时，一个算1秒。时间单位不同，不能只比25和30。","repair":{"gap":"先别急着比两个数。","reason":"数字后面的单位也属于信息。","check":"圈出两个速度里表示时间的词。"},"reference":"先看单位：每小时与每秒不同。"},{"id":"sp10","phase":"teach","type":"teach","title":"答“说明方法”，还要说作用","kicker":"② 讲课文 · 数字与比较","body":"列数字，让快慢具体。作比较，让差距好懂。答题时把方法连回“正在说明谁的什么特点”。","source":"P63—64：列数字、作比较、过渡句","detail":["示范：写鸵鸟约72千米每小时，是列数字；把它同人奔跑的最大速度放在一起，是作比较。两种方法合用，具体说明鸵鸟跑得比人快。","只写“用了列数字和作比较，生动形象”，还没有把句子读实。继续补：这里比较哪两种事物？突出哪一种事物速度快？","文章多次用转折或比较句接段：前一句接住已介绍的事物，后一句引出更快的事物。这些过渡句也帮你快速找准每段重点。"],"tutorial":[{"title":"先判方法","text":"看到具体数值，检查是不是列数字；看到两个对象摆在一起，检查是不是作比较。"},{"title":"再问说明谁","text":"一句可能用了两种方法，但作用必须连回这一句的对象与特点。","evidence":"教学转述：小盒最多装20张，大盒最多装60张。"},{"title":"老师示范完整回答","text":"先报方法，再说对象和效果。","example":"列数字并作比较，具体说明大盒的最大容量是小盒的3倍，让容量差别清楚可见。"},{"title":"换回本课","text":"你解释猎豹的句子时，最后落到猎豹的速度；不能照搬“大盒容量”。"}],"reading":{"title":"把速度课完整读明白","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"陆地三棒：人、鸵鸟、猎豹","text":"按课文给定的数据，人的最大奔跑速度为每小时44千米，鸵鸟约为72千米，猎豹最大可达110千米。后一段接住前一段的对象，再介绍更快的对象。说“最大”是说能达到的高值，不等于总保持这样的速度。"},{"label":"飞到空中：游隼和飞机","text":"游隼向下俯冲时，速度超过每小时320千米。这里改变了运动条件，不能说它平常飞行一直这么快。随后文章转向高速喷气式飞机，并用飞行高度上的声速作参照；声音也成了比较对象。"}]}},{"id":"sp11","phase":"recall","type":"recall","title":"把这条读法藏起来，再讲","kicker":"② 讲课文 · 遮挡回忆","body":"读到一段新的速度介绍，你会先找哪两样信息，再检查什么？","source":"P63—65：关键词句与准确表达","prompt":"用你自己的话说出读法，不用背术语。","reference":"先找比较的是谁和谁，判断谁更快；再看数字、单位和限制条件，例如最大、约、有的、俯冲时。","checklist":["比较双方与快慢关系","数字的单位","限制范围或条件的词"]},{"id":"sp12","phase":"teach","type":"teach","title":"题目与选材，都在带你往下读","kicker":"③ 划重点 · 新考向","body":"猎豹是一个有力的起点。作者每次介绍更快的一棒，让你想知道下一棒；比较也让陌生速度变得好懂。","source":"P63新考向1；P65新考向3—4","detail":["为什么从人跑步写起，题目却问猎豹？人跑步方便读者进入情境；猎豹是人熟悉的陆地奔跑强者，用它提问更容易引起好奇。回答要分清“开头怎样引入”和“题目怎样吸引人”。","为什么不一开始直接公布光最快？只公布答案，读者没有参照。先从熟悉的事物说起，逐步比较，既能理解差距，也愿意继续读。","为什么没有列水中事物？这是选材问题：文章要构成越来越快的比较链，作者选了合适的代表，不必把每类事物都写全。没写到，不等于水中每样事物都慢，也不能从这篇课文推出所有环境里的速度排名。"],"tutorial":[{"title":"标题设了什么悬念","text":"猎豹已是熟悉的快动物，问“还有谁更快”能让读者继续寻找。"},{"title":"为什么不把所有事物都写来","text":"作者选取能连成比较链、便于理解的对象。选材要服务说明主线，不是列世上一切快的事物。"},{"title":"考标题作用怎样答","text":"先指出问题怎样吸引阅读，再连回文章确实怎样介绍速度；两部分都有依据。"}]},{"id":"sp13","phase":"guided","type":"open","title":"删掉“大约”，意思哪里变了？","kicker":"③ 划重点 · 词语能否删去","body":"课文写：在喷气式飞机飞行的高度，声速大约是1050千米每小时。先比较有词、没词两种意思。","source":"P64：新考向2","prompt":"“大约”能删去吗？说清它原来表示什么、删后变成什么，再下结论。","reference":"不能随意删去。“大约”表示这个数是近似值；删去后，就变成确定的数值，意思说得太满。保留它，才符合原句的准确表达。","checklist":["解释“大约”是近似或估计","说明删后成了确定数值","结论有具体理由，不只写“更准确”"],"detail":"答题顺序可以是：表态 → 解释这个词 → 比较删前删后 → 联系原句说明理由。不把“所有词都不能删”当万能规则。","tutorial":[{"title":"先理解问法","text":"删词题不是问你喜不喜欢“大约”，而是问删掉后意思变没变。"},{"title":"把两句放一起","text":"有“大约”：接近这个数；没“大约”：直接确定为这个数。","evidence":"原句短引：“声速大约是1050千米每小时”。"},{"title":"收成自己的三步","text":"解释原词→说删后变化→判断是否保留。先讲意思，再说“体现准确性”。"}],"responseSupport":[{"label":"先解释","text":"“大约”表示","why":"由你补词义；不要只写“不能删”。"},{"label":"比较删后","text":"删掉后，原来的近似值就被说成","why":"说明它为什么不再准确。"}],"reading":{"title":"把速度课完整读明白","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"飞到空中：游隼和飞机","text":"游隼向下俯冲时，速度超过每小时320千米。这里改变了运动条件，不能说它平常飞行一直这么快。随后文章转向高速喷气式飞机，并用飞行高度上的声速作参照；声音也成了比较对象。"},{"label":"阅读题要用的短引","text":"原句关键词：“有的”“最大”“大约”“向下俯冲时”。比较时要同时保留对象、数值、单位和条件。考试让你解释一个词能不能删，实际在检查删前删后意思是否相同。"}]}},{"id":"sp14","phase":"teach","type":"teach","title":"把全文收成两大块","kicker":"④ 结构与主旨 · 回看读法","body":"第1—3段：走到陆地奔跑强者。第4—8段：继续寻找更快的事物。抓住每棒的关键句，就抓住了全文。","source":"P65：阅读方法、结构、主题","detail":["全文不是八件互不相干的事物。它们由“比上一种更快”连成一条线：先从人和动物讲起，再到人造工具、天体和光。","主要内容可以这样概括：作者用具体数字与比较，介绍人、鸵鸟、猎豹、游隼、喷气式飞机、火箭、流星体和光的速度，让我们一步步认识速度差异。","本课主题包含认识世界的兴趣。飞机、火箭的制造，速度的测量，都离不开科学探索；这是从文中信息得到的感受，概括内容时不必用空泛的大口号替代。","提高阅读速度的办法：先抓每段交接对象的关键句，再读支持它的数字和条件。读快要以读懂为前提，不因超过几分钟就扣分。"],"tutorial":[{"title":"先收大块","text":"第1—3段先让你认识陆地奔跑的速度；后面把范围一步步展开。"},{"title":"再收小连接","text":"每段保留一个“谁比谁快”的关系，八个对象就能排出顺序。"},{"title":"概括要少什么","text":"可以暂不抄每个数字；但不能把不同运动状态说成完全相同条件。"}]},{"id":"sp15","phase":"independent","type":"order","title":"这次从最快排到最慢","kicker":"⑤ 解习题 · 速度排序","body":"按课文介绍的速度排序。注意：这一题的方向换成“快 → 慢”。","source":"P66：课后第2题","items":[{"id":"human","text":"人"},{"id":"falcon","text":"游隼"},{"id":"meteor","text":"流星体"},{"id":"cheetah","text":"猎豹"},{"id":"rocket","text":"火箭"},{"id":"ostrich","text":"鸵鸟"},{"id":"light","text":"光"},{"id":"plane","text":"喷气式飞机"}],"answer":["light","meteor","rocket","plane","falcon","cheetah","ostrich","human"],"explanation":"从全文最后揭开的光开始，沿比较链倒着排回人。","repair":{"gap":"先检查题目要求的方向。","reason":"课文从慢到快介绍，本题要从快到慢。","check":"先确定最快与最慢，再检查相邻两项。"}},{"id":"sp16","phase":"independent","type":"open","title":"课后交流，讲你真正用过的方法","kicker":"⑤ 解习题 · 阅读体会","body":"不照抄“我用了几分钟”。说出这次读懂的内容，再举一个帮你读懂的关键句或词。","source":"P66：课后第1题","prompt":"我知道了……。读到……时，我判断这一段主要讲……。你若实际计时，也可以写真实用时。","reference":"一种合格表达：我知道文章用比较说明速度差异。读到猎豹比鸵鸟更快的句子，我就知道这一段要介绍猎豹的速度。用时只记录实际值。","checklist":["说出这篇课文的主要内容","举了具体句子或词说明阅读方法","没有编造阅读用时"],"reading":{"title":"把速度课完整读明白","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"把全文接起来","text":"按文中给定条件，一条主线是：人→鸵鸟→猎豹→游隼→喷气式飞机→火箭→流星体→光。每次比较都借助刚认识的对象，新对象就不显得完全陌生。标题从猎豹发问，全文不断回答“还有谁更快”。"}]}},{"id":"sp17","phase":"independent","type":"open","title":"留下一个真想追的问题","kicker":"⑤ 解习题 · 带问题再读","body":"从课文中选一句让你好奇的话。先写问题，再说回哪一段找线索。","source":"P66：课后第3题","prompt":"我想知道……；这个问题来自第……段的……。课文已经回答了吗？","reference":"例如：第6段说火箭关掉发动机仍能前进，我想知道为什么。课文提供了现象，但原因需要继续查资料。也可以提别的问题。","checklist":["问题和课文中的具体信息相连","说明课文能否直接回答","不是为了凑题照抄一个自己不关心的问题"],"reading":{"title":"把速度课完整读明白","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"继续提问：怎样去月球","text":"飞机已很快，可文章把目的地换成月球，于是引出更快的火箭。文中介绍火箭最大速度可达每小时4万千米，又提到进入太空后关掉发动机仍能前进。后一句提出了值得继续探究的现象，文章没有把原因全讲完。"},{"label":"进入太空：流星体超过火箭","text":"文章再用提问制造悬念，然后介绍流星体。其中一部分最大速度可达每小时25万千米。和这样的流星体相比，火箭仿佛没有动；这是相差悬殊带来的感觉，不是火箭真的停止。"},{"label":"最后一棒：光回到身边","text":"作者最后用手电筒的光把话题拉回生活。课文给出的光速约为每秒30万千米，又用一秒绕赤道数圈的设想帮助读者想象。注意，这里从“每小时”换成了“每秒”。"}]}},{"id":"sp18","phase":"transfer","type":"open","title":"换个词，还会解释吗？","kicker":"⑥ 换一句 · 近迁移","body":"“有的流星体运动的最大速度能达到25万千米每小时。”现在删去的词换成了“有的”。","source":"P64第7段；原创变式","prompt":"删掉“有的”，范围会怎么变？用自己的话解释。","reference":"“有的”只说其中一部分；删掉后容易让人以为流星体这一类都能达到这样的最大速度。范围扩大了，原句的限制丢了。","checklist":["指出原来只指其中一部分","指出删后范围扩大","理由对应“有的”，没有照搬“大约”的估计值解释"],"reading":{"title":"把速度课完整读明白","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"进入太空：流星体超过火箭","text":"文章再用提问制造悬念，然后介绍流星体。其中一部分最大速度可达每小时25万千米。和这样的流星体相比，火箭仿佛没有动；这是相差悬殊带来的感觉，不是火箭真的停止。"},{"label":"阅读题要用的短引","text":"原句关键词：“有的”“最大”“大约”“向下俯冲时”。比较时要同时保留对象、数值、单位和条件。考试让你解释一个词能不能删，实际在检查删前删后意思是否相同。"}]}},{"id":"sp19","phase":"transfer","type":"open","title":"把说明方法用到新材料","kicker":"⑥ 换材料 · 远迁移","body":"班级整理同样的卡片：小盒最多装20张，大盒最多装60张。怎样向新同学说明大盒的容量？","source":"原创迁移；对应P63—65的列数字、作比较与限定词","prompt":"写或说一两句，让他知道大盒有多能装。再说为什么“最多”值得保留。","reference":"例如：小盒最多装20张卡片，大盒最多装60张，是小盒最大容量的3倍。“最多”说明容量上限，不是说盒子里现在一定装着这么多。","checklist":["使用材料给出的数字","作了明确比较","把“最多”理解为上限，而非当前数量"]},{"id":"sp20","phase":"recall","type":"recall","title":"合上提示，带走你的读法","kicker":"本课收束 · 先说，再自查","body":"请讲三件事：全文怎样一棒接一棒；数字为什么有用；遇到删词题先比较什么。","source":"P60—66：本课独立回顾","prompt":"可以连着口述，也可以写三句短话。想不起的地方就标记待复习。","reference":"全文按课文给定条件，从慢到快比较；数字让差别具体，单位和限制词不能漏；删词题先看原词的意思，再看删后数值、范围或条件怎样改变。","checklist":["能讲出比较链的组织办法","知道数字必须连同单位和条件读","能解释删前删后的意义差异"]}],"reading":{"title":"把速度课完整读明白","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"开头：从自己跑步想起","text":"假如你参加赛跑，你会觉得自己很快。但把人、鸵鸟和猎豹放到一起，就会发现“快”要有比较对象。文章先用你熟悉的跑步引路，再带你认识不熟悉的速度。"},{"label":"陆地三棒：人、鸵鸟、猎豹","text":"按课文给定的数据，人的最大奔跑速度为每小时44千米，鸵鸟约为72千米，猎豹最大可达110千米。后一段接住前一段的对象，再介绍更快的对象。说“最大”是说能达到的高值，不等于总保持这样的速度。"},{"label":"飞到空中：游隼和飞机","text":"游隼向下俯冲时，速度超过每小时320千米。这里改变了运动条件，不能说它平常飞行一直这么快。随后文章转向高速喷气式飞机，并用飞行高度上的声速作参照；声音也成了比较对象。"},{"label":"继续提问：怎样去月球","text":"飞机已很快，可文章把目的地换成月球，于是引出更快的火箭。文中介绍火箭最大速度可达每小时4万千米，又提到进入太空后关掉发动机仍能前进。后一句提出了值得继续探究的现象，文章没有把原因全讲完。"},{"label":"进入太空：流星体超过火箭","text":"文章再用提问制造悬念，然后介绍流星体。其中一部分最大速度可达每小时25万千米。和这样的流星体相比，火箭仿佛没有动；这是相差悬殊带来的感觉，不是火箭真的停止。"},{"label":"最后一棒：光回到身边","text":"作者最后用手电筒的光把话题拉回生活。课文给出的光速约为每秒30万千米，又用一秒绕赤道数圈的设想帮助读者想象。注意，这里从“每小时”换成了“每秒”。"},{"label":"把全文接起来","text":"按文中给定条件，一条主线是：人→鸵鸟→猎豹→游隼→喷气式飞机→火箭→流星体→光。每次比较都借助刚认识的对象，新对象就不显得完全陌生。标题从猎豹发问，全文不断回答“还有谁更快”。"},{"label":"阅读题要用的短引","text":"原句关键词：“有的”“最大”“大约”“向下俯冲时”。比较时要同时保留对象、数值、单位和条件。考试让你解释一个词能不能删，实际在检查删前删后意思是否相同。"}]},"examTargets":["抓关键句理清比较顺序","列数字、作比较及其具体作用","限定词删前删后的意思变化","区分已有信息与自己提出的新问题"],"segments":[{"id":"speed-first","title":"先把比较读懂","startStepId":"sp01","endStepId":"sp05","minutes":10,"scene":"hotel","goal":"看懂旧对象怎样带出新对象，亲手比较后讲回。","check":"不用选项解释：作者为什么先写人和鸵鸟。"},{"id":"speed-method","title":"读完全文，学会答删词题","startStepId":"sp06","endStepId":"sp14","minutes":13,"scene":"hotel","goal":"读通天空、太空与光，分清单位和限定词。","check":"用“大约”的词义与删后变化解释是否能删。"},{"id":"speed-apply","title":"收起讲解，独立用一次","startStepId":"sp15","endStepId":"sp20","minutes":9,"scene":"train","goal":"换方向排序，自己提出问题，再解释新材料。","check":"能正确连比较顺序，并在新词或新材料上说出依据。"}],"unit":2,"reader":{"author":"［美］罗伯特·E.威尔斯　于姝译","pages":"P62–64","core":"找每段“谁比谁快”的句子，就能串起全文。","hook":"你跑得再快，也追不上谁？","notes":[{"anchor":"跟猎豹或鸵鸟赛跑","meaning":"先从你熟悉的跑步说起。","why":"想一想自己跑步的样子，再认识更快的动物。"},{"anchor":"这个速度跟鸵鸟比起来差远了","meaning":"这一段把人和鸵鸟放在一起比。","why":"抓住这句，就知道本段主要说谁比谁快。"},{"anchor":"比鸵鸟跑得更快的动物就要数猎豹了","meaning":"上一段说鸵鸟，这一段接着说猎豹。","why":"文章像接力：接住前一个，再引出更快的。"},{"anchor":"向下俯冲时","meaning":"游隼快，是说它向下俯冲的时候。","why":"这几个字不能漏。不是说它一直飞得这么快。"},{"anchor":"在喷气式飞机飞行的高度","meaning":"这一段从游隼接到飞机。","why":"声速的数字带着条件。读数字，也要读它前面的条件。"},{"anchor":"火箭的速度要比喷气式飞机的速度快得多","meaning":"从坐飞机旅行，想到乘火箭去月球。","why":"圈住这句，快速抓住飞机和火箭的比较。"},{"anchor":"火箭就好像是静止的一样","meaning":"流星体太快，显得火箭像没动。","why":"火箭并没有停。这是比较带来的感觉。"},{"anchor":"30万千米每秒","meaning":"最后写光：从手电筒想到惊人的速度。","why":"注意“每秒”。前面的多数数字用“每小时”。"}],"tests":[{"q":"不看课文，说三组“谁比谁快”。你靠什么句子快速找到它们？","ref":"如鸵鸟比人快、猎豹比鸵鸟快、游隼俯冲比猎豹快。抓住每段的比较句，能接起全文。","back":1,"modelAnswer":"鸵鸟比人跑得快，猎豹比鸵鸟跑得快，游隼向下俯冲时比猎豹跑得快。\n我抓住每段中“谁比谁快”的比较句，就能迅速找到这三组关系，并把各段接起来。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"“游隼向下俯冲时”中的“向下俯冲时”能删吗？说说为什么。","ref":"不能随便删。这一速度有运动条件，不代表游隼任何时候都这样快。","back":3,"modelAnswer":"不能删。“向下俯冲时”说明了游隼达到这个速度的条件。删掉后，就好像游隼在任何时候都飞得这样快，与原文的意思不符，也不够准确。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"介绍高铁很快时，你会拿什么来比较？先说两句，不用编速度数字。","ref":"例如：坐高铁和坐普通列车去同一地方，高铁往往用时更短。要让比较条件相近，再用核实的数据说明。","back":2,"modelAnswer":"从同一座城市出发，到同一个目的地，高铁通常比普通列车用时短。拿两种列车在相近条件下比较，就容易让人明白高铁的速度快。","answerKind":"表达示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"kind":"article","paragraphs":[{"text":"也许你跑得很快，不过要是你跟猎豹或鸵鸟赛跑的话，就一点儿赢的希望也没有了。","anchor":"跟猎豹或鸵鸟赛跑","meaning":"先从你熟悉的跑步说起。","why":"想一想自己跑步的样子，再认识更快的动物。","label":"第 1 段"},{"text":"人在奋力奔跑的时候，最大速度能够达到44千米每小时。这个速度跟鸵鸟比起来差远了——鸵鸟奔跑的最大速度约72千米每小时。在两条腿的动物里面，鸵鸟应该算是奔跑的世界冠军。","anchor":"这个速度跟鸵鸟比起来差远了","meaning":"这一段把人和鸵鸟放在一起比。","why":"抓住这句，就知道本段主要说谁比谁快。","label":"第 2 段"},{"text":"比鸵鸟跑得更快的动物就要数猎豹了。猎豹奔跑的最大速度可达110千米每小时。猎豹才是陆地上跑得最快的动物。","anchor":"比鸵鸟跑得更快的动物就要数猎豹了","meaning":"上一段说鸵鸟，这一段接着说猎豹。","why":"文章像接力：接住前一个，再引出更快的。","label":"第 3 段"},{"text":"但是游隼向下俯冲时的速度更快，超过320千米每小时。这个速度是汽车在高速公路上飞速行驶时速度的两到三倍。它俯冲时的速度比任何一种动物奔跑时的速度都要快。","anchor":"向下俯冲时","meaning":"游隼快，是说它向下俯冲的时候。","why":"这几个字不能漏。不是说它一直飞得这么快。","label":"第 4 段"},{"text":"不过，游隼还是没有飞机飞行的速度快。在喷气式飞机飞行的高度，声音传播的速度大约是1050千米每小时，而一些高速喷气式飞机的飞行速度是声速的数倍。如果你对着一个以超音速移动的人大喊，他是什么都听不见的，因为声音根本就追不上他。","anchor":"在喷气式飞机飞行的高度","meaning":"这一段从游隼接到飞机。","why":"声速的数字带着条件。读数字，也要读它前面的条件。","label":"第 5 段"},{"text":"乘坐喷气式飞机去旅行，速度绝对是够快的了。但是，如果你想到月球上去，就需要搭乘速度更快的工具了。对！我们需要一枚火箭。为了摆脱地心引力，飞到浩瀚的太空中，火箭的速度要比喷气式飞机的速度快得多才行。火箭的最大速度能达到4万千米每小时，是声速的30多倍。进入太空之后，即使关掉发动机，火箭仍可以继续前进。","anchor":"火箭的速度要比喷气式飞机的速度快得多","meaning":"从坐飞机旅行，想到乘火箭去月球。","why":"圈住这句，快速抓住飞机和火箭的比较。","label":"第 6 段"},{"text":"看！前面呼啸而过的东西是什么？跟它的速度一比，火箭就好像是静止的一样。那是流星体！流星体是太空中一种较小的天体。有的流星体运动的最大速度能达到25万千米每小时，是火箭运动最大速度的6倍多。","anchor":"火箭就好像是静止的一样","meaning":"流星体太快，显得火箭像没动。","why":"火箭并没有停。这是比较带来的感觉。","label":"第 7 段"},{"text":"现在，你一定会认为流星体是人们所能见到的速度最快的物体。不过，还有比流星体运动速度快得多的东西，而且它就在我们身边。只要我们按下手电筒的开关，立刻会出现一束光柱。光的速度是惊人的，大约是30万千米每秒，比流星体的速度要快几千倍！如果按照光速运动，我们一秒钟就可以沿着地球赤道转7圈多，真是令人难以置信！","anchor":"30万千米每秒","meaning":"最后写光：从手电筒想到惊人的速度。","why":"注意“每秒”。前面的多数数字用“每小时”。","label":"第 8 段"}],"poem":false,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P62–64；按该书课文录入，省去注音与教参批注。","media":null}},{"id":"kenton-normandy","title":"“诺曼底号”遇难记","date":"2026-09-17","minutes":32,"bookPages":"P67—78","goal":"读清撞船后的救援过程；从船长说了什么、做了什么，解释作者为什么赞美他。","source":"Kenton 五年级上语文《金牌训练》P67—78；part04 P67—78；P67—70 字表已对原图。","sourceNotes":["按原书学基础、逐段讲课文、新考向、结构主旨、课后题、词语拓展顺序原创改述。","P75威胁开枪与P76随船下沉只作文学情境分析；不作为儿童现实应急方法。","作者对人物意图的解释与文中直接描写分开；不把推断标成唯一可核事实。"],"steps":[{"id":"no01","phase":"teach","type":"teach","title":"带着一个问题登上这艘船","kicker":"① 学基础 · P67—72","body":"船上发生了什么？哈尔威船长怎样帮助大家脱险？先认识字词，读时盯住他的语言和行动。","source":"P67—72：目标、作者、字词","detail":["作者是法国作家雨果。今天的重点是带着问题读懂救援经过，再用具体言行解释人物，理解最后一段的赞美。","会写字自查：例 lì、弥 mí、峡 xiá、晨 chén、剖 pōu、混 hùn、哗 huā、喘 chuǎn、违 wéi、悲 bēi、岗 gǎng、宰 zǎi、措 cuò、犹 yóu。遇到不熟的字再停下观察，不要求现在默写整表。","会认字自查：曼 màn、敦 dūn、伊 yī、玛 mǎ、葬 zàng、裸 luǒ、泣 qì、艇 tǐng、祸 huò、遣 qiǎn、莱 lái；弥、剖、岗、宰已在会写字中。","易混字：峡是山字旁，海峡的峡；剖右边是立刀旁，读 pōu；措是提手旁，惊慌失措。注意岗位 gǎng、调遣 qiǎn。","多音字：山脉 mài／脉脉 mò；哗啦 huā／喧哗 huá。先认词意：水流的声响与人多吵闹，读法不同。","词语自查：照例、弥漫、海峡、凌晨、剖开、混乱、哗啦、喘气、违抗、悲壮、岗位、主宰、犹如、航线、容量、隐约、震荡、争执、壮举、小心翼翼、惊恐万状、势不可当、纹丝不动、相提并论、忠于职守、惊慌失措。","词义放进画面：弥漫是到处充满；湍急是水流很急；猝然、蓦地都写突然；须臾是很短的时间；井然有序是有条理、有秩序。混乱与井然有序，惊慌失措与镇定自若，正好形成对照。"],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：深夜航行","text":"“诺曼底号”在海上夜航，雾越来越浓，周围难以看清。哈尔威船长留意海面，小心驾驶。故事先交代这样的环境，使后面的意外有了背景，也先让人看见船长的认真。"},{"label":"二：另一艘船逼近","text":"黑暗中，“玛丽号”快速靠近。留给双方避让的时间很短，碰撞造成“诺曼底号”船身破裂。海水不断涌入，发动设备受到破坏，乘客从睡梦中惊醒，纷纷冲上甲板。"},{"label":"三：所有人一起抢","text":"人们奔跑、哭喊、争抢，小艇的撤离容易被堵住。船长站在指挥的位置，要求先安静，放下救生艇，并让需要优先帮助的人先走，其他乘客随后，船员最后。秩序改变，才能让有限的时间用来救人。"},{"label":"四：六十和六十一","text":"船长要求把六十人救出去。叙述者提醒：实际连他在内有六十一人。他安排的救援名单里没有计算自己。数字差别让读者看到他在危急时先想着别人。"},{"label":"五：问话是为了作决定","text":"船长接连询问轮机情况、剩余时间。得到大约只剩二十分钟的回答后，他安排大副维持秩序，继续指挥撤离。他的问题短而具体，因为每一个答案都关系接下来怎样救人。"},{"label":"六：混乱变成有序","text":"救援人员往返运送，发生事故的“玛丽号”也派小艇来救人。船长的安排逐一执行，原先的争抢变成了按顺序行动。紧迫的处境没有消失，组织方式却改变了结果。"},{"label":"七：不忘年幼的水手","text":"忙乱中，船长还特意点名让人救出克莱芒。这个见习水手仍是孩子。只写“他关心大家”比较空；写到这一次具体提醒，读者才看见他连容易被忽略的人也顾到了。"},{"label":"八：最后的画面","text":"二十分钟过去，轮船沉没。其他人得到救援，船长仍留在岗位上，随船沉入海中。结尾没有继续堆命令，而是留下沉默、静止的形象。作者由他的实际行动表达悲痛与敬意。"},{"label":"阅读短引","text":"原句关键词：“必须把六十人救出去！”“把克莱芒救出去！”“忠于职守”。人物题要先找一次具体言行，再解释这次言行怎样表现他的特点；不必把所有赞美词都写上。"}]},"tutorial":[{"title":"先知道这篇在问什么","text":"轮船遇险时，船长怎样让人脱险？学完要能用一件事说明他的特点。"},{"title":"三个读音先通路","text":"剖开 pōu：切开；湍急 tuān：水流急；井然有序：有条理、不混乱。"},{"title":"按事情读，别急着贴标签","text":"先读夜航、碰撞、救援、船沉。知道事情经过，才能判断一句话说明什么。"}]},{"id":"no02","phase":"guided","type":"choice","title":"哪一个词，写出了秩序？","kicker":"① 学基础 · 放回情境","body":"大家听从安排，一批接一批上小艇，没有争抢。这时可以说救援工作怎样？","source":"P71—72：井然有序、惊慌失措","options":[{"id":"a","text":"井然有序"},{"id":"b","text":"惊慌失措"},{"id":"c","text":"不可开交"}],"answer":"a","explanation":"有安排、不争抢，是井然有序。这个词也提示你看救援前后的变化。","repair":{"gap":"先看人们有没有按安排行动。","reason":"井然有序说的是有条理、有秩序。","check":"用“有秩序”放回句子试一试。"},"reference":"井然有序。"},{"id":"no03","phase":"teach","type":"teach","title":"开头的雾，先让你担心","kicker":"② 讲课文 · 第1—4段","body":"夜深、雾浓、看不清。船长仍小心驾驶。环境让你预感危险，也先写出了他的认真负责。","source":"P72—73：第1—4自然段，故事开端","detail":["事情发生在1870年3月17日夜晚。哈尔威船长驾驶“诺曼底号”，走从南安普敦到根西岛的航线，乘客正在熟睡。","第2段介绍这是一艘大邮船：有容量、长、宽等具体数字。船员称它还很“年轻”，把船当作有生命的伙伴，显出喜爱之情。","第3—4段雾越来越浓，到了大约凌晨四点，周围一片漆黑，只能隐约看见桅杆顶端。危险还没发生，环境已让读者感到不安。","考开头环境的作用，要连到后文：看不清，为相撞作铺垫；乘客熟睡，也解释他们突然遇险后为何慌乱。这叫伏笔，不能只背“渲染气氛”四个字。"],"tutorial":[{"title":"环境先给了什么信息","text":"深夜加浓雾，意味着视线不好。危险还没发生，读者已知道航行不容易。"},{"title":"人的动作也要一起读","text":"同样的环境里，船长谨慎观察、认真驾驶。这是判断他负责的第一处事实。"},{"title":"考环境作用，分两层说","text":"先说环境带来什么处境，再说它怎样为事故作铺垫或衬托人物。不是见到天气就写“渲染气氛”。"}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：深夜航行","text":"“诺曼底号”在海上夜航，雾越来越浓，周围难以看清。哈尔威船长留意海面，小心驾驶。故事先交代这样的环境，使后面的意外有了背景，也先让人看见船长的认真。"}]}},{"id":"no04","phase":"teach","type":"teach","title":"危险到了，大家乱成一团","kicker":"② 讲课文 · 第5—10段","body":"“玛丽号”突然逼近，撞破船身。水往里涌，人们奔跑、尖叫、哭泣。越乱，逃生越困难。","source":"P73：第5—10自然段","detail":["第5—8段写“玛丽号”从浓雾中快速驶来。它速度快、负载大，灾难来得急，撞击也严重。“冒出”写突然，“剖开”写出船身被撞破的惨状。","第9段先交代人员：28名船员、1名女服务员、31名乘客，共60人；加上船长自己是61人。后面的“救六十人”需要联系这个信息读。","第10段写出两种危急：海水迅猛地涌入，船在下沉；人群十分害怕，奔跑、尖叫、哭泣，现场混乱。","轮机火炉像人一样喘气，是拟人；一连串人的动作，让你看见惊恐场面。这一段不只是说“很危险”，还为后来船长的镇定安排提供对照。"],"tutorial":[{"title":"先找直接危险","text":"船被撞破，海水灌入；逃离时间因此变少。"},{"title":"再找人带来的困难","text":"大家同时争抢，可能挡住撤离。船长要处理的不只是船坏了，还有乱了的秩序。"},{"title":"为下一步作预测","text":"如果每个人都只争先上艇，会发生什么？看看指挥怎样针对这个问题。"}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"二：另一艘船逼近","text":"黑暗中，“玛丽号”快速靠近。留给双方避让的时间很短，碰撞造成“诺曼底号”船身破裂。海水不断涌入，发动设备受到破坏，乘客从睡梦中惊醒，纷纷冲上甲板。"},{"label":"三：所有人一起抢","text":"人们奔跑、哭喊、争抢，小艇的撤离容易被堵住。船长站在指挥的位置，要求先安静，放下救生艇，并让需要优先帮助的人先走，其他乘客随后，船员最后。秩序改变，才能让有限的时间用来救人。"}]}},{"id":"no05","phase":"guided","type":"model","title":"一条命令，改变了什么？","kicker":"② 讲课文 · 动手看救援","body":"先看混乱时的甲板。选择船长的安排，观察问题怎样改变，再把这条证据连到人物特点。","source":"P74—76：第11—39自然段","model":"rescue","config":{"purpose":"对照现场问题、人物言行、救援变化；先连证据再连品质，避免背空标签。","states":[{"id":"chaos","label":"人群拥挤","problem":"争抢小艇，差点把小艇弄翻。"},{"id":"assess","label":"问清情况","action":"船长连续询问炉子、机器、剩余时间。","effect":"知道船已失去动力，救援时间只有二十分钟。","trait":"沉着，抓住关键"},{"id":"order","label":"安排次序","action":"让弱者和乘客先走，船员断后，明确分工。","effect":"从争抢变成按安排撤离。","trait":"果断，照顾他人"},{"id":"child","label":"照顾遗漏者","action":"特意要求把年幼的克莱芒救出去。","effect":"忙乱中也没有漏掉这个孩子。","trait":"考虑周全"},{"id":"command","label":"坚持指挥","action":"留在岗位上，反复催促救援。","effect":"他人得到持续指挥和帮助。","trait":"忠于职守"}],"safetyBoundary":"模型只观察文章中的安排和结果，不把武器威胁或随船沉没作为操作选项，也不判孩子必须模仿。"}},{"id":"no06","phase":"guided","type":"open","title":"别先说“他很伟大”","kicker":"② 讲课文 · 把因果讲回来","body":"挑模型里一条安排，讲清：原来有什么问题，他做了什么，后来怎样。","source":"P74—76：语言、行动与结果","prompt":"原来……；船长……；这让……。你想用哪个特点形容这样的做法？","reference":"例如：原来人们争抢小艇；船长规定撤离次序、安排分工；后来大家有序撤离。这说明他在危险中仍能冷静而果断地组织救援。","checklist":["有具体的现场问题","有对应的人物言行","说明了变化，特点不是空标签"],"tutorial":[{"title":"先读题目真正要什么","text":"不是让你报一个好品质；题目要你讲清一条命令怎样解决困难。"},{"title":"把前后摆在一起","text":"之前：人们拥挤争抢。行动：规定撤离顺序、安排分工。之后：救援按秩序进行。"},{"title":"老师示范由事到人","text":"有了前后变化，才有理由判断人物。","example":"他先规定撤离次序，再安排人员执行，混乱才逐渐平息。这说明他能冷静地组织救援。"},{"title":"这次由你选证据","text":"你可以选另一条安排，说清“原来怎样—他怎么做—带来什么变化”。"}],"responseSupport":[{"label":"搭因果","text":"原来大家","why":"先填困难，再接船长针对困难的行动。"},{"label":"连到特点","text":"这项安排让","why":"填实际变化，最后再判断冷静或考虑周全。"}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"三：所有人一起抢","text":"人们奔跑、哭喊、争抢，小艇的撤离容易被堵住。船长站在指挥的位置，要求先安静，放下救生艇，并让需要优先帮助的人先走，其他乘客随后，船员最后。秩序改变，才能让有限的时间用来救人。"},{"label":"六：混乱变成有序","text":"救援人员往返运送，发生事故的“玛丽号”也派小艇来救人。船长的安排逐一执行，原先的争抢变成了按顺序行动。紧迫的处境没有消失，组织方式却改变了结果。"}]}},{"id":"no07","phase":"teach","type":"teach","title":"六十一人，他却喊救六十人","kicker":"② 讲课文 · 第11—14段","body":"船长先让大家安静、放艇、按次序撤离。他说要救六十人，把自己漏在了数字外。","source":"P74：第11—14自然段","detail":["第11段的命令很具体：先安静听指挥，再放救生艇，安排妇女和其他乘客先走，船员断后。危险中光喊“快点”不够，还得让每个人知道怎么行动。","第12段补出全船61人，却只喊救60人。作者用这个细节，让读者看见船长优先想到别人；这里不是算术粗心题。","第13段人群仍争抢，差点把小艇弄翻，说明仅有救生艇还不够，秩序是脱险的重要条件。","第14段转向船长威严、简短有力的声音。混乱的人群与镇定的船长形成对比，让人物特点变得可见。"],"tutorial":[{"title":"先核对两个数","text":"船长喊救六十人；连他在内共有六十一人。只相差一人，意思却很重要。"},{"title":"少掉的是谁","text":"他把自己留在救援数字之外，先考虑其他人的生命。"},{"title":"从数字到人物","text":"回答时先把“一人之差”说清，再解释他先为别人安排。不要只抄“他很伟大”。"}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"四：六十和六十一","text":"船长要求把六十人救出去。叙述者提醒：实际连他在内有六十一人。他安排的救援名单里没有计算自己。数字差别让读者看到他在危急时先想着别人。"}]}},{"id":"no08","phase":"teach","type":"teach","title":"这些短问短答，都在抓关键","kicker":"② 讲课文 · 第15—29段","body":"船长不绕弯：船还能不能动？还剩多少时间？问清后，他才迅速决定救援怎样进行。","source":"P74—75：第15—29自然段","detail":["他先问机械师炉子、火和机器的情况。回答很短：炉子进水、火灭、机器停了。短句让我们感到事态紧迫，也看见船长思路清楚。","再问大副还剩多少分钟，得到二十分钟的答案。有限的时间，解释了他为什么必须迅速安排每个人进入小艇。","文章随后写船长用极严厉的话阻止争抢。我们分析这段语言，是要看它在故事里怎样制止混乱、保护弱者；这不是教你在现实中威胁别人。","读人物对话时，可以用“问什么 → 为了知道什么 → 接着怎么做”来追思路，比单记“沉着镇定”更有证据。"],"tutorial":[{"title":"问题一：船还能怎样","text":"船长先问设备情况，知道船还能不能继续行动。"},{"title":"问题二：时间剩多少","text":"问清余下二十分钟，他才能安排分工和次序。"},{"title":"短对话为什么有力量","text":"问题短、回答快，写出情势紧迫；问的都是救援关键，写出他镇定而有判断。"}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"五：问话是为了作决定","text":"船长接连询问轮机情况、剩余时间。得到大约只剩二十分钟的回答后，他安排大副维持秩序，继续指挥撤离。他的问题短而具体，因为每一个答案都关系接下来怎样救人。"}]}},{"id":"no09","phase":"teach","type":"teach","title":"对比让“镇定”真正看得见","kicker":"② 讲课文 · 第30—33段","body":"前面争抢，后来有序。别人惊慌，他仍指挥。把两边放在一起，才能看见他的作用。","source":"P75：第30—33自然段","detail":["第30段人群安静下来；第31段“玛丽号”也放艇救人。到第32段，救援井然有序，和前面争抢、混乱形成鲜明对比。","第33段连用指挥、主宰、领导等动作，写船长一直控制救援局面。“巍然屹立”写站得稳，也突出他遇险不乱的形象。","说他仿佛向灾难下命令，不是灾难真的会听话；是作者通过这样的表达，突出他冷静有力的指挥。","作者对利己与舍己的议论，带出赞美和悲痛。“悲壮”也让读者预感结局。分析议论，要联系前后的救援事实。"],"tutorial":[{"title":"把两幅画面放一起","text":"撞船后，乘客惊慌；指挥开始后，救援逐渐有序。"},{"title":"找变化中间的桥","text":"中间不是运气，而是船长问情况、定次序、作分工。"},{"title":"答对比题的三步","text":"写清比较的两边→指出差别→解释突出了谁的什么特点。","example":"众人的惊慌与船长的镇定形成对比，突出他在危急时仍能沉着指挥。"}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"三：所有人一起抢","text":"人们奔跑、哭喊、争抢，小艇的撤离容易被堵住。船长站在指挥的位置，要求先安静，放下救生艇，并让需要优先帮助的人先走，其他乘客随后，船员最后。秩序改变，才能让有限的时间用来救人。"},{"label":"五：问话是为了作决定","text":"船长接连询问轮机情况、剩余时间。得到大约只剩二十分钟的回答后，他安排大副维持秩序，继续指挥撤离。他的问题短而具体，因为每一个答案都关系接下来怎样救人。"},{"label":"六：混乱变成有序","text":"救援人员往返运送，发生事故的“玛丽号”也派小艇来救人。船长的安排逐一执行，原先的争抢变成了按顺序行动。紧迫的处境没有消失，组织方式却改变了结果。"}]}},{"id":"no10","phase":"teach","type":"teach","title":"他没有漏掉那个孩子","kicker":"② 讲课文 · 第34—39段","body":"救援正忙，他仍想起年幼的克莱芒。一个很小的命令，支持了“考虑到每个人”这个判断。","source":"P76：第34—39自然段","detail":["第34—35段，船长点名要求救出见习水手克莱芒；课文特意补充，他还只是个孩子。这个细节使“照顾弱者、考虑周全”有了具体证据。","第36—38段，船继续下沉，人们划艇往返，船长继续催促。救援行动和下沉的船交替出现，让时间紧迫感越来越强。","第39段二十分钟到了，轮船沉没。这个时间回应前面大副的报告，把救援过程收住。概括时不能漏掉“在有限时间内组织他人脱险”。"],"tutorial":[{"title":"“考虑周全”还缺什么","text":"缺一个能让读者相信的事实。这里只报品质，答案会太空。"},{"title":"到文字里找一个动作","text":"船长在救援中专门提醒救出克莱芒，连年幼的水手也没有忘记。"},{"title":"把意思补完整","text":"不是再写第二个故事，而是补一句：他照顾到了可能被忽略的人。"}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"七：不忘年幼的水手","text":"忙乱中，船长还特意点名让人救出克莱芒。这个见习水手仍是孩子。只写“他关心大家”比较空；写到这一次具体提醒，读者才看见他连容易被忽略的人也顾到了。"}]}},{"id":"no11","phase":"teach","type":"teach","title":"结尾不再喊话，画面却更重了","kicker":"② 讲课文 · 第40—44段","body":"船长随船沉入海中。作者把他写得像一尊雕像，让读者感到沉稳，也感到悲痛与敬意。","source":"P76：第40—44自然段","detail":["第40—41段船逐渐沉没。船长没有再做手势，也没再说话；铁铸一般、纹丝不动、黑色的雕像，把他静止的姿态留在读者眼前。","“雕像”是比喻，不是人物真的变成了石头。它突出沉稳坚毅，也承载了获救者的崇敬。阴惨惨的雾气，让结尾的悲痛更浓。","第42—44段从叙事转向评价。作者把这次救援同他一贯的忠于职守联系起来，赞美他把别人的生命放在心上、坚持完成职责。","文章赞美的是人物在这个故事中的责任与救人行动。现实里的负责也包括保护自己、及时求援；不是必须牺牲生命才算负责。"],"tutorial":[{"title":"先看结尾写了什么","text":"船长没有继续说话或做手势，站在岗位上随船沉没。"},{"title":"再想为什么不写热闹","text":"安静、稳定的画面与前面的惊慌形成反差，让人感到庄重和沉痛。"},{"title":"感受要有分寸","text":"可以写崇敬、悲伤、惋惜；不需要说你也应当牺牲自己，才能理解作品。"}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"八：最后的画面","text":"二十分钟过去，轮船沉没。其他人得到救援，船长仍留在岗位上，随船沉入海中。结尾没有继续堆命令，而是留下沉默、静止的形象。作者由他的实际行动表达悲痛与敬意。"}]}},{"id":"no12","phase":"recall","type":"order","title":"合上故事，把四个阶段接好","kicker":"② 讲课文 · 遮挡回忆","body":"按事情发生的先后排列。把“发生什么”说清，再谈人物特点。","source":"P72—76：开端、发展、高潮、结局","items":[{"id":"rescue","text":"船长组织救援，让他人脱险"},{"id":"sail","text":"浓雾中夜航"},{"id":"end","text":"船长随船沉入海中"},{"id":"hit","text":"“玛丽号”撞破船身"}],"answer":["sail","hit","rescue","end"],"explanation":"夜航是开端，撞船是发展，救援是高潮，船沉与船长牺牲是结局。","repair":{"gap":"先找到危险还没发生的阶段。","reason":"事情的先后不能按你最难忘的画面来排。","check":"先夜航，再遇险，接着救援，最后结局。"}},{"id":"no13","phase":"teach","type":"teach","title":"他的真实念头，文章都告诉了吗？","kicker":"③ 划重点 · 新考向1","body":"船长用严厉的话阻止争抢。目的可以联系救援判断；他是否真打算开枪，文中没有直接交代。","source":"P75：新考向1，人物语言与推断","detail":["原书提出：他是否真的想让大副开枪？它列了不同理解。做这类题，应分开“文中写了什么”和“我根据什么推想”。","可以确定：现场争抢严重，他发出严厉命令，此后人群安静、救援有序。因此，维护秩序、让人获救，是有前后文支持的目的。","至于他是否真想开枪，可以提出解释并说明依据，不能说自己能直接读到人物心里。文学讨论不把武器威胁变成你处理现实冲突的方法。"],"tutorial":[{"title":"先分清两类话","text":"文中写出的命令属于事实；人物没有说出的完整内心，只能据文推想。"},{"title":"知道命令解决什么","text":"严厉的话在阻止争抢，目的可由救援前后变化来判断。"},{"title":"回答时别补成事实","text":"可以写“我理解为……因为……”。不能断言作者没交代的每一个念头。"}]},{"id":"no14","phase":"guided","type":"open","title":"为什么结尾一言不发？","kicker":"③ 划重点 · 新考向2","body":"把他此前的行动和最后的静止连起来。先说文中写了什么，再解释作者想突出什么。","source":"P76：新考向2","prompt":"船长先做了哪些事？结尾的沉默和不动，让你怎样理解这个人物？","reference":"他此前一直了解情况、安排救援、照顾他人。其他人脱险后，作者用沉默和不动的画面，突出他坚守岗位的沉稳形象，表达悲痛和崇敬。对人物内心的推想，要说明这是理解。","checklist":["联系前面的具体救援行动","解释结尾画面或作者情感","没有把人物选择说成现实中人人必须模仿的规则"],"tutorial":[{"title":"题目问的是结尾画面","text":"先回想结尾前，船长已经完成了哪些救援安排。"},{"title":"抓住动与静","text":"前面不断询问、命令、照顾人；结尾静立沉默。两者连起来看。"},{"title":"答案落到表达效果","text":"用此前行动解释静立形象，再说你的感受。不要替船长编一段文中没有的心理独白。"}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"五：问话是为了作决定","text":"船长接连询问轮机情况、剩余时间。得到大约只剩二十分钟的回答后，他安排大副维持秩序，继续指挥撤离。他的问题短而具体，因为每一个答案都关系接下来怎样救人。"},{"label":"七：不忘年幼的水手","text":"忙乱中，船长还特意点名让人救出克莱芒。这个见习水手仍是孩子。只写“他关心大家”比较空；写到这一次具体提醒，读者才看见他连容易被忽略的人也顾到了。"},{"label":"八：最后的画面","text":"二十分钟过去，轮船沉没。其他人得到救援，船长仍留在岗位上，随船沉入海中。结尾没有继续堆命令，而是留下沉默、静止的形象。作者由他的实际行动表达悲痛与敬意。"}]}},{"id":"no15","phase":"independent","type":"open","title":"人物题：拿出证据再下判断","kicker":"③ 划重点 · 新考向3","body":"只选船长的一个特点。用一处语言或行动支撑它，再补一句“这说明……”。","source":"P77：新考向3","prompt":"我觉得他……。因为文中……。这说明……。","reference":"例如：他考虑周全。救援最忙时，他仍点名让人救出年幼的克莱芒，说明他不只看大局，也留意容易被遗漏的人。也可选冷静、果断、忠于职守等，但必须有对应证据。","checklist":["一个清楚的人物特点","一处准确的语言或行动","解释这条证据为什么支持判断"],"responseSupport":[{"label":"先找言行","text":"我选的证据是：","why":"写一处具体言行即可；不要同时堆四个特点。"},{"label":"解释证据","text":"这件事让我看出","why":"接上它为什么支持你的判断。"}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"三：所有人一起抢","text":"人们奔跑、哭喊、争抢，小艇的撤离容易被堵住。船长站在指挥的位置，要求先安静，放下救生艇，并让需要优先帮助的人先走，其他乘客随后，船员最后。秩序改变，才能让有限的时间用来救人。"},{"label":"四：六十和六十一","text":"船长要求把六十人救出去。叙述者提醒：实际连他在内有六十一人。他安排的救援名单里没有计算自己。数字差别让读者看到他在危急时先想着别人。"},{"label":"五：问话是为了作决定","text":"船长接连询问轮机情况、剩余时间。得到大约只剩二十分钟的回答后，他安排大副维持秩序，继续指挥撤离。他的问题短而具体，因为每一个答案都关系接下来怎样救人。"},{"label":"七：不忘年幼的水手","text":"忙乱中，船长还特意点名让人救出克莱芒。这个见习水手仍是孩子。只写“他关心大家”比较空；写到这一次具体提醒，读者才看见他连容易被忽略的人也顾到了。"}]}},{"id":"no16","phase":"independent","type":"open","title":"如果你是获救的乘客","kicker":"③ 划重点 · 新考向4","body":"对船长说两句话。一句提到他做过的事，一句说你的真实感受。可以感激，也可以难过或惋惜。","source":"P77：新考向4","prompt":"船长，您……。我……。不必堆“伟大”“崇高”，让你的话有一件真事作依靠。","reference":"例如：船长，是您安排大家有序进入小艇，我才有机会获救。我很感激您，也难过没能看到您一起回来。表达可以不同，关键是连着文中事实。","checklist":["提到真实的救援细节","感受来自这个细节","用自己的话，没有只堆赞美词"],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"六：混乱变成有序","text":"救援人员往返运送，发生事故的“玛丽号”也派小艇来救人。船长的安排逐一执行，原先的争抢变成了按顺序行动。紧迫的处境没有消失，组织方式却改变了结果。"},{"label":"七：不忘年幼的水手","text":"忙乱中，船长还特意点名让人救出克莱芒。这个见习水手仍是孩子。只写“他关心大家”比较空；写到这一次具体提醒，读者才看见他连容易被忽略的人也顾到了。"},{"label":"八：最后的画面","text":"二十分钟过去，轮船沉没。其他人得到救援，船长仍留在岗位上，随船沉入海中。结尾没有继续堆命令，而是留下沉默、静止的形象。作者由他的实际行动表达悲痛与敬意。"}]}},{"id":"no17","phase":"teach","type":"teach","title":"收拢全文：事情、证据、赞美","kicker":"④ 结构与主旨","body":"事情线：夜航 → 遇险 → 救援 → 船沉。人物线：看他说什么、做什么，再理解最后的赞美。","source":"P77：结构与主题；P72—76逐段写法","detail":["主要内容：浓雾夜航中，“诺曼底号”被撞。哈尔威船长沉着组织救援，让其他人脱险，自己却随船沉入海中。作者借这件事，赞美他忠于职守、救助他人的精神。","概括不要只报结果“船长牺牲了”；救援是篇幅最多的高潮，也是理解人物的主要证据。没有这段经过，最后的赞美就会空掉。","写法回看：开头浓雾铺垫危险；人群混乱与船长镇定形成对比；简短对话显出紧迫与冷静；救克莱芒的细节显出周全；雕像比喻凝住结尾的悲痛与敬意。","原书本课没有独立的“向课文学写法”专栏。这些方法来自逐段批注，学会把方法和它产生的效果连起来即可。"],"tutorial":[{"title":"先把故事说短","text":"什么情况下遇险→船长怎样组织→大家与船长的结果。"},{"title":"把人物说实","text":"一个特点配一处言行，再说明联系。自己的句子通顺，比背几个词重要。"},{"title":"把方法带出去","text":"以后读另一个人物，也先观察他在困难前做了什么，再评价。"}]},{"id":"no18","phase":"independent","type":"open","title":"课后两问，用一条证据线回答","kicker":"⑤ 解习题 · 主要内容与结尾","body":"先用一句话说故事。再用船长的一次行动，解释最后一段为什么说他忠于职守。","source":"P78：课后第1—2题","prompt":"①发生了什么，他怎样应对，结果怎样？②选哪件事解释“忠于职守”？还可补充这次带问题阅读的真实体会。","reference":"①轮船相撞后，船长冷静组织救援，让他人脱险，自己随船沉没。②例如，他问清剩余时间并持续指挥撤离，说明危急时仍在完成船长救人的职责。带着“怎样救人”的问题读，能集中找相关言行。","checklist":["概括包含遇险、救援和结果","结尾的理解有具体言行支撑","阅读体会或用时只写实际发生的内容"],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：深夜航行","text":"“诺曼底号”在海上夜航，雾越来越浓，周围难以看清。哈尔威船长留意海面，小心驾驶。故事先交代这样的环境，使后面的意外有了背景，也先让人看见船长的认真。"},{"label":"二：另一艘船逼近","text":"黑暗中，“玛丽号”快速靠近。留给双方避让的时间很短，碰撞造成“诺曼底号”船身破裂。海水不断涌入，发动设备受到破坏，乘客从睡梦中惊醒，纷纷冲上甲板。"},{"label":"六：混乱变成有序","text":"救援人员往返运送，发生事故的“玛丽号”也派小艇来救人。船长的安排逐一执行，原先的争抢变成了按顺序行动。紧迫的处境没有消失，组织方式却改变了结果。"},{"label":"八：最后的画面","text":"二十分钟过去，轮船沉没。其他人得到救援，船长仍留在岗位上，随船沉入海中。结尾没有继续堆命令，而是留下沉默、静止的形象。作者由他的实际行动表达悲痛与敬意。"}]}},{"id":"no19","phase":"transfer","type":"open","title":"换个人物，你还能找证据吗？","kicker":"⑥ 换材料 · 近迁移","body":"新故事：展览前，讲解员先检查通道，再询问谁需要帮助。发现一位同学没跟上，她请队伍停在安全处等候。","source":"原创迁移；对应P74—77的人物言行分析","prompt":"她有什么特点？选一处行动，解释它怎样支持你的判断。","reference":"例如：她考虑周全。她不只带队前进，还发现没跟上的同学并安排等待，说明她留意每个人。","checklist":["特点与实际行动匹配","说清行动和特点的关系"],"detail":"可选词语拓展（P78）：惊慌失措、面如土色、大惊失色、不寒而栗、惶恐不安，都能写出害怕。另想一个害怕的情境，选一个词来描述；不同词不能在任何句子里随便互换。"},{"id":"no20","phase":"transfer","type":"recall","title":"把责任带回生活，怎么做？","kicker":"⑥ 换情境 · 远迁移","body":"疏散演练中，有同学推挤，又有同学想返回拿水杯。你怎样照顾他人，也保护自己？","source":"原创现实迁移；对应P75—78的秩序与责任主题","prompt":"说一个你能做的安全行动，再用本课的一条证据说明你为什么这样想。","reference":"例如：自己不推挤，按老师安排撤离，提醒同伴不要返回拿物品；有人需要帮助就告诉老师。课文让我看见，争抢会增加危险，有序行动能帮助大家。负责不等于威胁别人，也不要求牺牲自己。","checklist":["提出本人能做的安全行动","联系了课文中的具体证据","照顾他人时也保护自己"]}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：深夜航行","text":"“诺曼底号”在海上夜航，雾越来越浓，周围难以看清。哈尔威船长留意海面，小心驾驶。故事先交代这样的环境，使后面的意外有了背景，也先让人看见船长的认真。"},{"label":"二：另一艘船逼近","text":"黑暗中，“玛丽号”快速靠近。留给双方避让的时间很短，碰撞造成“诺曼底号”船身破裂。海水不断涌入，发动设备受到破坏，乘客从睡梦中惊醒，纷纷冲上甲板。"},{"label":"三：所有人一起抢","text":"人们奔跑、哭喊、争抢，小艇的撤离容易被堵住。船长站在指挥的位置，要求先安静，放下救生艇，并让需要优先帮助的人先走，其他乘客随后，船员最后。秩序改变，才能让有限的时间用来救人。"},{"label":"四：六十和六十一","text":"船长要求把六十人救出去。叙述者提醒：实际连他在内有六十一人。他安排的救援名单里没有计算自己。数字差别让读者看到他在危急时先想着别人。"},{"label":"五：问话是为了作决定","text":"船长接连询问轮机情况、剩余时间。得到大约只剩二十分钟的回答后，他安排大副维持秩序，继续指挥撤离。他的问题短而具体，因为每一个答案都关系接下来怎样救人。"},{"label":"六：混乱变成有序","text":"救援人员往返运送，发生事故的“玛丽号”也派小艇来救人。船长的安排逐一执行，原先的争抢变成了按顺序行动。紧迫的处境没有消失，组织方式却改变了结果。"},{"label":"七：不忘年幼的水手","text":"忙乱中，船长还特意点名让人救出克莱芒。这个见习水手仍是孩子。只写“他关心大家”比较空；写到这一次具体提醒，读者才看见他连容易被忽略的人也顾到了。"},{"label":"八：最后的画面","text":"二十分钟过去，轮船沉没。其他人得到救援，船长仍留在岗位上，随船沉入海中。结尾没有继续堆命令，而是留下沉默、静止的形象。作者由他的实际行动表达悲痛与敬意。"},{"label":"阅读短引","text":"原句关键词：“必须把六十人救出去！”“把克莱芒救出去！”“忠于职守”。人物题要先找一次具体言行，再解释这次言行怎样表现他的特点；不必把所有赞美词都写上。"}]},"examTargets":["概括遇险、救援、结果","用语言与动作解释人物特点","环境与对比怎样衬托人物","理解结尾评价并区分事实与推想"],"segments":[{"id":"normandy-event","title":"先读故事，看指挥怎样起作用","startStepId":"no01","endStepId":"no06","minutes":11,"scene":"hotel","goal":"读清事故与混乱，让命令和秩序变化连起来。","check":"用原来—行动—结果讲回一条安排的作用。"},{"id":"normandy-evidence","title":"沿言行找人物证据","startStepId":"no07","endStepId":"no14","minutes":12,"scene":"hotel","goal":"读六十人、关键问话、救孩子与沉默结尾。","check":"用实际行动解释结尾，不把猜想当作课文事实。"},{"id":"normandy-answer","title":"自己回答人物题","startStepId":"no15","endStepId":"no20","minutes":9,"scene":"train","goal":"用一处事实支撑特点，并在新人物身上迁移。","check":"独立说清特点、具体言行和两者的关系。"}],"unit":2,"reader":{"author":"［法］雨果　张汉钧译","pages":"P72–76","core":"看船长说了什么、做了什么，再判断他是什么样的人。","hook":"船要沉了，船长先做哪件事？","groups":[[0,3,"小心翼翼","深夜大雾中，船长认真驾驶。","先交代环境，也让你看到他的做事态度。"],[4,7,"飞驶过来","另一艘船冲来，碰撞发生了。","“缓缓”与“飞驶”对照，危险一下子逼近。"],[8,9,"一片混乱","人们慌乱，海水还在往船里灌。","先记住这里的乱，后面看它怎样改变。"],[10,12,"妇女先走","船长安排撤离次序。","大家都抢，反而会翻船；按次序走才有机会获救。"],[13,25,"二十分钟","船长先查清机器和剩余时间。","问得短、答得快，说明此时每一分钟都重要。"],[26,29,"够了","船长用严厉的命令制止争抢。","这是故事中的险情描写。看它怎样使人群安静下来。"],[30,32,"井然有序","救援从争抢变成有秩序。","用前后的变化，说明船长冷静指挥起了作用。"],[33,38,"把克莱芒救出去","他还记得要救年幼的水手。","一个具体细节，比只说“他关心别人”更有力量。"],[39,43,"犹如铁铸一般","船长最终随船沉没，作者表达敬意。","回到他的言行理解“忠于职守”。不猜没有写出的逃生可能。"]],"tests":[{"q":"按顺序讲一遍：船怎么遇险，船长怎么救人，最后怎样？","ref":"大雾中撞船；船长查明情况、安排撤离；其他人获救，船长随船沉没。","back":4,"modelAnswer":"深夜大雾中，“诺曼底号”被“玛丽号”撞伤，海水涌入船舱。哈尔威船长先查清机器和剩余时间，再安排妇女、其他乘客和船员有序撤离，还命令救出小水手克莱芒。最后，其他人获救，船长仍守在岗位上，随船沉入大海。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"找船长的一句话，说明他是怎样的人。","ref":"如“把克莱芒救出去”：在危急时仍记得保护年幼水手，可见考虑周全、关心别人。","back":33,"modelAnswer":"船长说：“把克莱芒救出去！”在船快要沉没的危急时刻，他仍记得保护年幼的见习水手。这说明他考虑周全、关心他人，也表现出他对船上人员负责的精神。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"要写一个人“做事冷静”，你会写什么具体场面？","ref":"例如遇到突发情况，他先弄清原因、安排分工，再有序处理。要写做了什么，别只写“他很冷静”。","back":13,"modelAnswer":"活动时，一个装着道具的箱子突然倒了，大家围了过去。老师先让我们退开，查看有没有人受伤，又请两位同学扶稳箱子，自己把散落的道具收好。等通道空出来，他才让活动继续。","answerKind":"写法示例","answerNote":"这是虚构的写法示例。写自己的经历时，请换成真实的人和事。"}],"kind":"article","paragraphs":[{"text":"1870年3月17日夜晚，哈尔威船长照例走着从南安普敦到根西岛这条航线。大海上夜色正浓，烟雾弥漫。船长站在驾驶室里，小心翼翼地驾驶着他的“诺曼底号”。乘客们都进入了梦乡。","anchor":"小心翼翼","meaning":"深夜大雾中，船长认真驾驶。","why":"先交代环境，也让你看到他的做事态度。","label":"第 1 段"},{"text":"“诺曼底号”是一艘大轮船，在英吉利海峡也许可以算得上是最漂亮的邮船之一。它装货容量六百吨，船体长二百二十英尺，宽二十五英尺。海员们都说它很“年轻”，因为它还不满七岁，是1863年造的。","anchor":"","meaning":"深夜大雾中，船长认真驾驶。","why":"先交代环境，也让你看到他的做事态度。","label":"第 2 段"},{"text":"雾越来越浓了，轮船驶出南安普敦河后，来到茫茫大海上，距离埃居伊山脉估计有十五海里。轮船缓缓行驶着。这时大约凌晨四点钟。","anchor":"","meaning":"深夜大雾中，船长认真驾驶。","why":"先交代环境，也让你看到他的做事态度。","label":"第 3 段"},{"text":"周围一片漆黑，船桅的梢尖隐约可辨。","anchor":"","meaning":"深夜大雾中，船长认真驾驶。","why":"先交代环境，也让你看到他的做事态度。","label":"第 4 段"},{"text":"突然，沉沉夜雾中冒出一枚黑点，它好似一个幽灵，又仿佛一座山峰。只见一个阴森森的往前翘起的船头，突破黑暗，在一片浪花中飞驶过来。那是“玛丽号”，一艘装有螺旋推进器的大轮船，它从敖德萨起航，船上载着五百吨小麦，行驶速度非常快，负载又特别大。它笔直地朝着“诺曼底号”逼了过来。","anchor":"飞驶过来","meaning":"另一艘船冲来，碰撞发生了。","why":"“缓缓”与“飞驶”对照，危险一下子逼近。","label":"第 5 段"},{"text":"眼看就要撞船，已经没有任何办法避开它了。一瞬间，大雾中似乎耸起许许多多船只的幻影，人们还没来得及一一看清，就要死到临头，葬身鱼腹了。","anchor":"","meaning":"另一艘船冲来，碰撞发生了。","why":"“缓缓”与“飞驶”对照，危险一下子逼近。","label":"第 6 段"},{"text":"全速前进的“玛丽号”向“诺曼底号”的侧舷撞过去，在它的船身上剖开一个大窟窿。","anchor":"","meaning":"另一艘船冲来，碰撞发生了。","why":"“缓缓”与“飞驶”对照，危险一下子逼近。","label":"第 7 段"},{"text":"由于这一猛撞，“玛丽号”自己也受了伤，终于停了下来。","anchor":"","meaning":"另一艘船冲来，碰撞发生了。","why":"“缓缓”与“飞驶”对照，危险一下子逼近。","label":"第 8 段"},{"text":"“诺曼底号”上有二十八名船员和一名女服务员，还有三十一名乘客，其中十二名是妇女。","anchor":"","meaning":"人们慌乱，海水还在往船里灌。","why":"先记住这里的乱，后面看它怎样改变。","label":"第 9 段"},{"text":"震荡可怕极了。一刹那间，男人、女人、小孩，所有的人都奔到甲板上，人们半裸着身子，奔跑着，尖叫着，哭泣着，惊恐万状，一片混乱。海水哗哗往里灌，汹涌湍急，势不可当。轮机火炉被海浪呛得嘶嘶地直喘粗气。","anchor":"一片混乱","meaning":"人们慌乱，海水还在往船里灌。","why":"先记住这里的乱，后面看它怎样改变。","label":"第 10 段"},{"text":"船上没有封舱用的防漏隔墙。哈尔威船长站在指挥台上，大声吼喝：“全体安静，注意听命令！把救生艇放下去。妇女先走，其他乘客跟上，船员断后，必须把六十人救出去！”","anchor":"妇女先走","meaning":"船长安排撤离次序。","why":"大家都抢，反而会翻船；按次序走才有机会获救。","label":"第 11 段"},{"text":"实际上一共有六十一人，但是他把自己给忘了。","anchor":"","meaning":"船长安排撤离次序。","why":"大家都抢，反而会翻船；按次序走才有机会获救。","label":"第 12 段"},{"text":"船员赶紧解开救生艇的绳索。大家一窝蜂拥了上去，这股你推我搡的势头，险些把小艇都弄翻了。奥克勒福大副和三名工头拼命想维持秩序，但整个人群因为猝然而至的变故简直都像疯了似的，乱得不可开交。几秒钟前大家还在酣睡，蓦地，而且，立刻就要丧命，这怎么不叫人失魂落魄！","anchor":"","meaning":"船长安排撤离次序。","why":"大家都抢，反而会翻船；按次序走才有机会获救。","label":"第 13 段"},{"text":"就在这时，船长威严的声音压倒了一片呼号和嘈杂，黑暗中人们听到这一段简短有力的对话：","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 14 段"},{"text":"“洛克机械师在哪儿？”","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 15 段"},{"text":"“船长叫我吗？”","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 16 段"},{"text":"“炉子怎么样了？”","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 17 段"},{"text":"“淹了。”","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 18 段"},{"text":"“火呢？”","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 19 段"},{"text":"“灭了。”","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 20 段"},{"text":"“机器怎样？”","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 21 段"},{"text":"“停了。”","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 22 段"},{"text":"船长喊了一声：“奥克勒福大副？”","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 23 段"},{"text":"大副回答：“到！”","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 24 段"},{"text":"船长问道：“还有多少分钟？”","anchor":"","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 25 段"},{"text":"“二十分钟。”","anchor":"二十分钟","meaning":"船长先查清机器和剩余时间。","why":"问得短、答得快，说明此时每一分钟都重要。","label":"第 26 段"},{"text":"“够了，”船长说，“让每个人都下到小艇上去。奥克勒福大副，你的手枪在吗？”","anchor":"够了","meaning":"船长用严厉的命令制止争抢。","why":"这是故事中的险情描写。看它怎样使人群安静下来。","label":"第 27 段"},{"text":"“在，船长。”","anchor":"","meaning":"船长用严厉的命令制止争抢。","why":"这是故事中的险情描写。看它怎样使人群安静下来。","label":"第 28 段"},{"text":"“哪个男人胆敢抢在女人前面，你就开枪打死他。”","anchor":"","meaning":"船长用严厉的命令制止争抢。","why":"这是故事中的险情描写。看它怎样使人群安静下来。","label":"第 29 段"},{"text":"大家立时不出声了。没有一个人违抗他的意志，人们感到有一个伟大的灵魂出现在他们的上空。","anchor":"","meaning":"船长用严厉的命令制止争抢。","why":"这是故事中的险情描写。看它怎样使人群安静下来。","label":"第 30 段"},{"text":"“玛丽号”也放下救生艇，赶来搭救由于它肇祸而遇险的人员。","anchor":"","meaning":"救援从争抢变成有秩序。","why":"用前后的变化，说明船长冷静指挥起了作用。","label":"第 31 段"},{"text":"救援工作进行得井然有序，几乎没有发生什么争执或殴斗。事情总是这样，哪里有可鄙的利己主义，哪里也会有悲壮的舍己救人。","anchor":"井然有序","meaning":"救援从争抢变成有秩序。","why":"用前后的变化，说明船长冷静指挥起了作用。","label":"第 32 段"},{"text":"哈尔威巍然屹立在他的船长岗位上，指挥着，主宰着，领导着大家。他把每件事和每个人都考虑到了，面对惊慌失措的众人，他镇定自若，仿佛他不是给人而是给灾难下达命令，就连失事的船舶似乎也听从他的调遣。","anchor":"","meaning":"救援从争抢变成有秩序。","why":"用前后的变化，说明船长冷静指挥起了作用。","label":"第 33 段"},{"text":"过了一会儿，他喊道：“把克莱芒救出去！”","anchor":"把克莱芒救出去","meaning":"他还记得要救年幼的水手。","why":"一个具体细节，比只说“他关心别人”更有力量。","label":"第 34 段"},{"text":"克莱芒是见习水手，还不过是个孩子。","anchor":"","meaning":"他还记得要救年幼的水手。","why":"一个具体细节，比只说“他关心别人”更有力量。","label":"第 35 段"},{"text":"轮船在深深的海水中慢慢下沉。","anchor":"","meaning":"他还记得要救年幼的水手。","why":"一个具体细节，比只说“他关心别人”更有力量。","label":"第 36 段"},{"text":"人们尽力加快速度划着小艇，在“诺曼底号”和“玛丽号”之间来回穿梭。","anchor":"","meaning":"他还记得要救年幼的水手。","why":"一个具体细节，比只说“他关心别人”更有力量。","label":"第 37 段"},{"text":"“快干！”船长又叫道。","anchor":"","meaning":"他还记得要救年幼的水手。","why":"一个具体细节，比只说“他关心别人”更有力量。","label":"第 38 段"},{"text":"二十分钟到了，轮船沉没了。","anchor":"","meaning":"他还记得要救年幼的水手。","why":"一个具体细节，比只说“他关心别人”更有力量。","label":"第 39 段"},{"text":"船头先下去，须臾，海水把船尾也浸没了。","anchor":"","meaning":"船长最终随船沉没，作者表达敬意。","why":"回到他的言行理解“忠于职守”。不猜没有写出的逃生可能。","label":"第 40 段"},{"text":"哈尔威船长一个手势也没有做，一句话也没有说，犹如铁铸一般，纹丝不动，随着轮船一起沉入了深渊。人们透过阴惨惨的雾气，凝视着这尊黑色的雕像徐徐沉进大海。","anchor":"犹如铁铸一般","meaning":"船长最终随船沉没，作者表达敬意。","why":"回到他的言行理解“忠于职守”。不猜没有写出的逃生可能。","label":"第 41 段"},{"text":"哈尔威船长的生命就这样结束了。","anchor":"","meaning":"船长最终随船沉没，作者表达敬意。","why":"回到他的言行理解“忠于职守”。不猜没有写出的逃生可能。","label":"第 42 段"},{"text":"在英伦海峡上，没有任何一个海员能与他相提并论。","anchor":"","meaning":"船长最终随船沉没，作者表达敬意。","why":"回到他的言行理解“忠于职守”。不猜没有写出的逃生可能。","label":"第 43 段"},{"text":"他一生都要求自己忠于职守，履行做人之道。面对死亡，他又践行了一次英雄的壮举。","anchor":"","meaning":"船长最终随船沉没，作者表达敬意。","why":"回到他的言行理解“忠于职守”。不猜没有写出的逃生可能。","label":"第 44 段"}],"poem":false,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P72–76；按该书课文录入，省去注音与教参批注。","media":{"src":"/assets/reader-art/normandy.webp","alt":"雾夜中的轮船，乘客正在被帮助登上救生艇。","caption":"人们怎样从慌乱变得有秩序？读的时候，留意船长说的话。","credit":"AI 情境插画","kind":"story"}}},{"id":"teacher-writing","title":"习作：漫画老师","date":null,"minutes":25,"bookPages":"P79","unit":2,"goal":"抓住一位老师鲜明的特点，用一两件事把特点写出来。","source":"金牌训练·同步教材 P79；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"先知道这次写什么","body":"抓住一位老师鲜明的特点，用一两件事把特点写出来。","detail":["这里的“漫画”是突出特点。外貌、性格、爱好或教学方式都可以选，不是随意夸大或只画肖像。","原书方法：选熟悉的老师→确定一个突出特点→挑典型事例→用语言、动作、神态等写具体。"],"id":"teacher-writing-01","source":"P79","kicker":"按书细读","reading":{"title":"老师教你写《漫画老师》","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"任务到底是什么","text":"这里的“漫画”不是画一张脸，而是用文字突出一位老师最鲜明的特点。可以写外貌、性格、爱好、课堂方式，但要让读者从真实的小事里认出这个特点。"},{"label":"先找一件事，不先找好词","text":"回想一个具体时刻：当时出了什么情况？老师说了什么、做了什么？你或同学怎么反应？如果这些想不起来，先换一件真的记得的事，不必凭空编一句老师原话。"},{"label":"老师的局部示范：耐心","text":"空句：“老师非常有耐心。”原创示范：“我第二次停住时，老师把题目分成两句，指着第一句说：先看这一小步。”这个例子用重复帮助与具体动作说明耐心。它是教你写法的虚构片段，不能当作你的老师真实做过的事。"},{"label":"一篇怎样站起来","text":"开头简要介绍这位老师和鲜明特点；中间用一两件有代表性的事，其中一件重点写；结尾回到自己对老师的真实感受。人物外貌不必从头到脚全写，只有帮助认出特点的细节才值得保留。"},{"label":"变丰富不靠堆形容词","text":"“老师很认真”可以补认真发生在哪一步。“大家都笑了”可以补你看见的反应。但没有听清的对话可概述，不能为精彩而造假。一个准确的普通动词，常比一串不贴切的成语更有用。"}]},"tutorial":[{"title":"题目里的“漫画”是什么","text":"突出最让人记住的一点，不是把缺点夸大，也不是写所有优点。"},{"title":"先从事情找特点","text":"如果你记得老师如何反复帮助，就可能写耐心；如果只有“老师很好”，材料还没落地。"},{"title":"今天先完成哪件事","text":"选一件真实小事，把老师当时怎样做写清；完整文章可以留到安静的一段时间再接上。"}]},{"type":"choice","phase":"guided","title":"哪种材料能写出特点？","body":"比较两种写法。","options":[{"id":"0","text":"只用“非常好、特别棒”评价"},{"id":"1","text":"写一件具体事情，让言行说明特点"}],"answer":"1","explanation":"读者要看到发生了什么，才能相信你的判断。","repair":{"gap":"先看题目要你比较什么。","reason":"读者要看到发生了什么，才能相信你的判断。","check":"回到原题，用这个依据再判断。"},"id":"teacher-writing-02","source":"P79","kicker":"跟着推演"},{"type":"open","phase":"guided","title":"先找真实小事，再定特点","prompt":"用关键词记下：什么情况下，老师做了什么，我或同学怎么反应。再写你从这件事看出的一个特点。","reference":"先有真实发生的事，再判断它表现耐心、幽默、严格或别的特点。记不清原话可以概述，不需要补造对话。","checklist":["有一件真实小事","老师的行动具体","特点能由这件事看出来"],"id":"teacher-writing-03","source":"P79","kicker":"跟着推演"},{"type":"teach","phase":"teach","title":"从一个点写清楚","body":"把镜头对准最能表现特点的那一刻。不要从早到晚流水账。","detail":["先交代事情的条件，再写最能说明变化的动作、语言或细节。次要经过可以简写，重要转折展开写。"],"id":"teacher-writing-04","source":"P79","kicker":"按书细读","tutorial":[{"title":"先看单薄句缺在哪里","text":"“老师很幽默，大家都笑了。”缺的不是成语，是让人发笑的那一句或动作。"},{"title":"把镜头往前移","text":"先交代课堂遇到什么，再写老师怎样反应。读者知道前因，才知道笑点。"},{"title":"局部示范怎样读","text":"虚构示范：“教室忽然安静下来，老师指指窗外：连小鸟都在等你们的答案呢。”它示范语言如何表现幽默，不是你的真实素材。"},{"title":"最后留给孩子","text":"回到你记得的那件事，补一个最有用的动作或一句概述，不必学示范里的小鸟。"}]},{"type":"open","phase":"independent","title":"写一个关键片段","prompt":"写老师当时的一处具体言行，再写你或同学的真实反应。记清原话才加引号；记不清就概述意思，不编造对话。","reference":"具体事例应当让人看出你选的特点。外貌可以简写，与中心无关的经过要收短。","checklist":["场景与我选的特点有关","有老师的一处具体言行","有我真实观察到的反应"],"id":"teacher-writing-05","source":"P79","kicker":"课后题与常见考法","responseSupport":[{"label":"反复帮助","text":"又把","why":"适合老师重复帮助的真实情境；后面写他具体做什么。"},{"label":"语气温和","text":"轻声提醒","why":"只有你确实听到温和语气才用，不把所有老师写成一个样子。"},{"label":"显出反差","text":"刚才还……，这时却……","why":"适合前后反应确实改变的场景；把两处省略号换成真实内容。"}],"collectFrom":["teacher-writing-03"]},{"type":"recall","phase":"recall","title":"遮住提示，说出路线","prompt":"不用看刚才的说明，讲一遍你准备先写什么、重点写什么、怎样收尾。","reference":"路线服务中心。读者需要知道起点、重要变化和结果；不要只报三个空标题。","checklist":["先收起提示，再试着讲","讲出了本题要求的关键关系","需要重新看的地方如实保留"],"id":"teacher-writing-06","source":"P79","kicker":"遮住讲回"},{"type":"choice","phase":"independent","title":"哪一次修改更有帮助？","body":"回看刚才的关键片段。哪种修改更能帮助读者看出老师的特点？","options":[{"id":"0","text":"把所有普通词都换成成语"},{"id":"1","text":"找出与中心无关的句子，再补一处关键细节"},{"id":"2","text":"把参考范文整段搬进来"}],"answer":"1","explanation":"修改的目标是更清楚、更具体，不是堆砌华丽词语。","repair":{"gap":"先看题目要你比较什么。","reason":"修改的目标是更清楚、更具体，不是堆砌华丽词语。","check":"回到原题，用这个依据再判断。"},"id":"teacher-writing-07","source":"P79","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"连起来，写自己的初稿","prompt":"按“认出老师—重点小事—我的感受”组织自己的文章。前面写的材料在下方可取回；可以在这里成文，也可在纸上写并记下位置。","reference":"具体事例应当让人看出你选的特点。外貌可以简写，与中心无关的经过要收短。","checklist":["读者能认出一个鲜明特点","重点事件有经过和细节","结尾感受来自前面的事","没有把示范当成自己的经历"],"id":"teacher-writing-08","source":"P79","kicker":"课后题与常见考法","collectFrom":["teacher-writing-03","teacher-writing-05"],"tutorial":[{"title":"先取回你自己的两块材料","text":"把前面的小事和关键片段放在一起。先检查它们是不是都表现同一个特点。"},{"title":"开头不必很长","text":"介绍是谁，再点一个鲜明特点。不要在开头把中间的事全讲完。"},{"title":"中间给关键时刻最多位置","text":"简单交代起因，把最能看出特点的一次言行写细，后面的结果收住。"},{"title":"结尾回到你的感受","text":"具体说这件事让你怎样看待老师；不用为了漂亮加一段与前文无关的大道理。"}]},{"type":"open","phase":"independent","title":"给自己的稿子改一笔","prompt":"选一处重复、含糊或不合情理的地方，写出修改前后，并说为什么改。","reference":"说明修改怎样帮助读者看清人物、过程或变化。开放习作需要家长复看，软件不按关键词自动判优秀。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"teacher-writing-09","source":"P79","kicker":"课后题与常见考法","tutorial":[{"title":"先改一个具体缺口","text":"你写“他特别负责”，读者知道他做了哪件事吗？不知道，就补那件事。"},{"title":"再检查词是否贴合","text":"严厉不是生气的同义词，耐心不是说话慢。用你看到的言行核对。"},{"title":"保留自己的口气","text":"如果普通说法更准确，就用普通说法。改前改后都留下，比较清楚在哪里。"}],"responseSupport":[{"label":"补回行动","text":"原来我只写了……；现在补上他……","why":"先指出原句的问题，再补真实的动作。"},{"label":"删去无关","text":"这一句写的是……，和我要表现的……关系不大。","why":"用来决定哪些外貌或经过可以简写。"}]},{"type":"open","phase":"transfer","title":"把方法带出去","prompt":"旅行里遇到一位认真做事的人，你会观察什么，才有材料写出他的特点？","reference":"先有自己的材料，再组织和修改；没有真正观察或发生过的内容，要明确写成想象。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"teacher-writing-10","source":"P79","kicker":"换个情境"},{"id":"teacher-writing-end","type":"teach","phase":"transfer","title":"这一段先收住，下次从这里接","body":"先说一件今天能自己解释的事。还不会的留下来；暂停不清空，下一次从未完成处继续。","source":"P79","tutorial":[{"title":"带走一句自己的话","text":"不用追求现在把整课都做完。先说你今天学会使用的一种方法。"},{"title":"留下真正的接续点","text":"还有未完成的题或需要提示的地方，继续保留，不把“看过”记成“独立会”。"}]}],"reading":{"title":"老师教你写《漫画老师》","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"任务到底是什么","text":"这里的“漫画”不是画一张脸，而是用文字突出一位老师最鲜明的特点。可以写外貌、性格、爱好、课堂方式，但要让读者从真实的小事里认出这个特点。"},{"label":"先找一件事，不先找好词","text":"回想一个具体时刻：当时出了什么情况？老师说了什么、做了什么？你或同学怎么反应？如果这些想不起来，先换一件真的记得的事，不必凭空编一句老师原话。"},{"label":"老师的局部示范：耐心","text":"空句：“老师非常有耐心。”原创示范：“我第二次停住时，老师把题目分成两句，指着第一句说：先看这一小步。”这个例子用重复帮助与具体动作说明耐心。它是教你写法的虚构片段，不能当作你的老师真实做过的事。"},{"label":"一篇怎样站起来","text":"开头简要介绍这位老师和鲜明特点；中间用一两件有代表性的事，其中一件重点写；结尾回到自己对老师的真实感受。人物外貌不必从头到脚全写，只有帮助认出特点的细节才值得保留。"},{"label":"变丰富不靠堆形容词","text":"“老师很认真”可以补认真发生在哪一步。“大家都笑了”可以补你看见的反应。但没有听清的对话可概述，不能为精彩而造假。一个准确的普通动词，常比一串不贴切的成语更有用。"}]},"examTargets":["一个鲜明特点与一两件典型事例对应","用语言动作神态写具体","全文有重点、有顺序、感受真实","修改自己的句子而非搬范文"],"segments":[{"id":"teacher-draft","title":"用一件真事写出老师的特点","startStepId":"teacher-writing-01","endStepId":"teacher-writing-end","minutes":25,"scene":"hotel","goal":"从真实材料、关键片段走到自己组织初稿和修改。","check":"留下自己的提纲与片段或初稿，指出一处为什么修改。"}],"sourceNotes":["本次教学重做：随身阅读为依据原书的原创转述；分步示范与局部表达帮助必须记提示，不代表孩子已独立完成。"],"reader":{"kind":"guide","core":"把老师写得像他本人。","hook":"回想一件小事，就能把老师“画”出来。","author":"读写小练习","pages":"P79","textSource":"依据家长所供教辅的本课要求编写；以下是原创学习指引，不是课文原文。","paragraphs":[{"label":"选一位老师","text":"想到他，你先想起什么？说话很快？总爱笑？先选最鲜明的一个特点。","anchor":"","meaning":"选一位老师","why":"特点要具体，读者才认得出。"},{"label":"想一件真的发生过的事","text":"写下当时的情况，再写老师做了什么。记不清原话，可以用自己的话概述。","anchor":"","meaning":"想一件真的发生过的事","why":"用事情让人看见特点。"},{"label":"看一个写法示范","text":"“老师很耐心。”还看不出过程。可以写：“我又停住了。老师把题分成两句，指着第一句陪我读。”这是虚构示范。","anchor":"","meaning":"看一个写法示范","why":"动作一具体，“耐心”就看得见。"},{"label":"你来写","text":"用一件真事写一小段。写完问：不写“耐心”“幽默”这些词，别人还看得出来吗？","anchor":"","meaning":"你来写","why":"能从事情看出特点，就写到点上了。"}],"tests":[{"q":"用关键词记下：什么情况下，老师做了什么，我或同学怎么反应。再写你从这件事看出的一个特点。","ref":"先有真实发生的事，再判断它表现耐心、幽默、严格或别的特点。记不清原话可以概述，不需要补造对话。","back":0,"modelAnswer":"情况：我做题时连续两次漏掉一个步骤。\n老师的做法：他把题分成两小步，指着第一步陪我重新读。\n我的反应：我不再急着擦答案，而是一边读一边补全步骤。\n老师的特点：耐心，善于帮助学生找到问题。","answerKind":"写法示例","answerNote":"这是虚构的写法示例。写自己的经历时，请换成真实的人和事。"},{"q":"写老师当时的一处具体言行，再写你或同学的真实反应。记清原话才加引号；记不清就概述意思，不编造对话。","ref":"具体事例应当让人看出你选的特点。外貌可以简写，与中心无关的经过要收短。","back":0,"modelAnswer":"我又停在了那道题前。老师蹲在桌边，把题分成两句，用笔尖轻轻点着第一句，陪我读了一遍。我先前绷紧的肩膀慢慢放松，终于把漏掉的一步补上了。","answerKind":"写法示例","answerNote":"这是虚构的写法示例。写自己的经历时，请换成真实的人和事。"},{"q":"旅行里遇到一位认真做事的人，你会观察什么，才有材料写出他的特点？","ref":"先有自己的材料，再组织和修改；没有真正观察或发生过的内容，要明确写成想象。","back":0,"modelAnswer":"我会观察他遇到了什么情况、先做什么、怎样检查细节，以及别人提出问题时他怎样回应。例如，观察工作人员是否仔细核对车票、发现疑问后怎样确认。记下看见的动作和听清的话，才能用具体事情说明“认真”。","answerKind":"观察计划示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"media":null}},{"id":"k-unit2-garden","title":"语文园地二与单元回看","date":null,"minutes":22,"bookPages":"P80–84","unit":2,"goal":"选对提高阅读速度的方法，并用关键词概括；回看本单元常考处。","source":"金牌训练五年级上P80–84；《将相和》衔接回忆另核对P52–58。教学材料与讲解原创改述。","steps":[{"type":"teach","phase":"teach","title":"快读，也要读明白","body":"带着问题找关键句。读完能说主要意思，才算有效。","detail":["四种方法：集中注意；连词成句地读；遇到暂不影响理解的难词先记号、接着读；带着问题定位关键信息。","读速不是唯一成绩。人物转折、限定条件或不懂会影响主旨的词，需要回读。"],"id":"k-unit2-garden-01","source":"P80–84","kicker":"按书细读","reading":{"title":"把第二单元接起来：快读、人物与概括","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"快读的目标","text":"快读要减少无用停顿，不能丢掉意思。可以按词组读、带问题找关键句；遇到不影响当前主线的陌生词先作记号，遇到决定因果和人物态度的词要停下来弄清。读后用自己的话讲主要内容，才知道读懂没有。"},{"label":"将相和回忆一：完璧归赵","text":"秦王想用城池换赵国的和氏璧。蔺相如到了秦国，发现秦王只顾宝物、不提交城，便设法取回宝物、争取时间，安排人把璧送回赵国，自己再去应对秦王。他有了功劳，得到任用。"},{"label":"将相和回忆二：渑池会面","text":"两国国君相会，秦王想借赵王演奏来显示自己占上风。蔺相如据理力争，维护赵王和赵国的尊严；廉颇同时带兵在边境作准备。蔺相如再次立功，职位升得比廉颇更高。"},{"label":"将相和回忆三：负荆请罪","text":"廉颇因职位高低不服气，想让蔺相如难堪。蔺相如主动避让，解释自己担心将相相争会削弱赵国，让秦国有机可乘。廉颇明白后真诚认错，两人共同保卫国家。前两件事解释“不和”怎样发生，第三件事解释为什么能“和”。"},{"label":"同一人物，面对的人不同","text":"蔺相如面对秦王强硬，面对廉颇却退让。看起来相反，背后的理由相同：维护赵国利益。不能把一次退让直接判断成胆小。看人物要同时看行动、处境和原因。"},{"label":"概括的三个位置","text":"谁遇到什么事？怎样处理？结果如何？写一句概括时，删去重复对话和次要细节，但不能删掉导致后续变化的关键结果。例如海难故事的结果，要同时说到他人得救与船长随船沉没。"},{"label":"成语各有着重点","text":"泰然自若重神态镇定；身先士卒重带头行动；神机妙算重谋划巧妙；百折不挠重屡次受挫仍坚持；坚韧不拔重意志坚定；勇往直前重坚定向前；视死如归重不畏死亡；奋不顾身重不顾个人安危。选词要贴合文中情境，不能用极端词形容普通小事。"},{"label":"可在这里学习的惜时句","text":"陶渊明：“盛年不重来，一日难再晨。及时当勉励，岁月不待人。”意思是好年华和过去的时间不会重来，要珍惜当下。岳飞：“莫等闲，白了少年头，空悲切。”劝人别把时光轻易耗去。珍惜时间也包括学一段、休息后再接续。"},{"label":"第三组惜时积累","text":"毛泽东：“多少事，从来急；天地转，光阴迫。一万年太久，只争朝夕。”这里夸张地对照很久的等待与眼前的日子，勉励人抓紧当下、主动行动。可以和陶渊明、岳飞的句子比较：共同都在劝珍惜时间，语气和表达方式不同。"}],"source":"P80–84；将相和回忆P52–58"},"tutorial":[{"title":"先定一个阅读问题","text":"例如“将相为什么不和，后来怎么和了？”带着它读，才知道哪些信息最值得抓。"},{"title":"把字连成有意思的块","text":"“蔺相如／设法送回宝物／维护赵国利益”。一次看一个意思块，比一字一顿更容易理解。"},{"title":"读完合上材料检查","text":"如果你能说出主要事件和它们的联系，这次快读才有成效；不需要和别人比秒数。"}]},{"type":"model","phase":"guided","title":"删掉条件，再判断","body":"分别删去、放回两组条件词，看方法会不会变样。","model":"precision","config":{"pairs":[{"word":"主要","withText":"先概括主要事件。","without":"先概括事件。","why":"主要提醒你筛选，不能把全部细节都抄下来。"},{"word":"不影响理解的","withText":"先跳过不影响理解的难词。","without":"先跳过难词。","why":"删去条件，容易误以为所有难词都可以不管。"}]},"id":"k-unit2-garden-02","source":"P80–84","kicker":"跟着推演"},{"type":"recall","phase":"recall","title":"讲回自己的快读办法","prompt":"如果一个陌生词不影响眼前事情的理解，你怎样处理？如果它决定人物态度呢？","reference":"前者先标记继续，读后查；后者回读或查清。快读不能牺牲理解。","checklist":["先收起提示，再试着讲","讲出了本题要求的关键关系","需要重新看的地方如实保留"],"id":"k-unit2-garden-03","source":"P80–84","kicker":"遮住讲回"},{"type":"choice","phase":"independent","title":"概括《将相和》","body":"先读随身材料中的三个故事，再选抓住全文主线的路线。","options":[{"id":"0","text":"完璧归赵、渑池会面、负荆请罪"},{"id":"1","text":"只抄人物说过的每句话"},{"id":"2","text":"只写结尾两个人和好了"}],"answer":"0","explanation":"先找三件事，再说明由不和到和的变化。细节服务主线。","repair":{"gap":"先看题目要你比较什么。","reason":"先找三件事，再说明由不和到和的变化。细节服务主线。","check":"回到原题，用这个依据再判断。"},"id":"k-unit2-garden-04","source":"P80–84单元回看；相关原课文与讲解P52–58","kicker":"课后题与常见考法","tutorial":[{"title":"三个标题不是三件散事","text":"先把完璧归赵和渑池会面的共同结果找出来：蔺相如立功升职。"},{"title":"升职怎样带出冲突","text":"职位高过廉颇，引起不满，才有后来的避让和认错。"},{"title":"用“因为—所以—后来”连起来","text":"故事标题记住只是第一步，能解释它们为什么接在一起，才读懂全文结构。"}],"reading":{"title":"把第二单元接起来：快读、人物与概括","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"将相和回忆一：完璧归赵","text":"秦王想用城池换赵国的和氏璧。蔺相如到了秦国，发现秦王只顾宝物、不提交城，便设法取回宝物、争取时间，安排人把璧送回赵国，自己再去应对秦王。他有了功劳，得到任用。"},{"label":"将相和回忆二：渑池会面","text":"两国国君相会，秦王想借赵王演奏来显示自己占上风。蔺相如据理力争，维护赵王和赵国的尊严；廉颇同时带兵在边境作准备。蔺相如再次立功，职位升得比廉颇更高。"},{"label":"将相和回忆三：负荆请罪","text":"廉颇因职位高低不服气，想让蔺相如难堪。蔺相如主动避让，解释自己担心将相相争会削弱赵国，让秦国有机可乘。廉颇明白后真诚认错，两人共同保卫国家。前两件事解释“不和”怎样发生，第三件事解释为什么能“和”。"},{"label":"同一人物，面对的人不同","text":"蔺相如面对秦王强硬，面对廉颇却退让。看起来相反，背后的理由相同：维护赵国利益。不能把一次退让直接判断成胆小。看人物要同时看行动、处境和原因。"}]}},{"type":"open","phase":"independent","title":"一句话概括","prompt":"用“谁＋做了什么＋结果”概括《“诺曼底号”遇难记》，再说哪一处不能省。","reference":"可抓船遇险、船长组织救援、乘客获救而船长殉职。不要为了短而丢掉决定人物形象的结果。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"k-unit2-garden-05","source":"P80–84","kicker":"课后题与常见考法","tutorial":[{"title":"先问主要人物","text":"这道概括题抓船长和遇难的轮船，不需要先抄轮船长宽。"},{"title":"留下决定事情的动作","text":"遇险之后，他组织救援。这比逐条重复所有命令更简练。"},{"title":"结果不能少一半","text":"“大家获救”还没有包含最后的变化；船长随船沉没也影响全文意思。"}],"reading":{"title":"这场海难，事情怎样一步步发生","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：深夜航行","text":"“诺曼底号”在海上夜航，雾越来越浓，周围难以看清。哈尔威船长留意海面，小心驾驶。故事先交代这样的环境，使后面的意外有了背景，也先让人看见船长的认真。"},{"label":"二：另一艘船逼近","text":"黑暗中，“玛丽号”快速靠近。留给双方避让的时间很短，碰撞造成“诺曼底号”船身破裂。海水不断涌入，发动设备受到破坏，乘客从睡梦中惊醒，纷纷冲上甲板。"},{"label":"三：所有人一起抢","text":"人们奔跑、哭喊、争抢，小艇的撤离容易被堵住。船长站在指挥的位置，要求先安静，放下救生艇，并让需要优先帮助的人先走，其他乘客随后，船员最后。秩序改变，才能让有限的时间用来救人。"},{"label":"四：六十和六十一","text":"船长要求把六十人救出去。叙述者提醒：实际连他在内有六十一人。他安排的救援名单里没有计算自己。数字差别让读者看到他在危急时先想着别人。"},{"label":"五：问话是为了作决定","text":"船长接连询问轮机情况、剩余时间。得到大约只剩二十分钟的回答后，他安排大副维持秩序，继续指挥撤离。他的问题短而具体，因为每一个答案都关系接下来怎样救人。"},{"label":"六：混乱变成有序","text":"救援人员往返运送，发生事故的“玛丽号”也派小艇来救人。船长的安排逐一执行，原先的争抢变成了按顺序行动。紧迫的处境没有消失，组织方式却改变了结果。"},{"label":"七：不忘年幼的水手","text":"忙乱中，船长还特意点名让人救出克莱芒。这个见习水手仍是孩子。只写“他关心大家”比较空；写到这一次具体提醒，读者才看见他连容易被忽略的人也顾到了。"},{"label":"八：最后的画面","text":"二十分钟过去，轮船沉没。其他人得到救援，船长仍留在岗位上，随船沉入海中。结尾没有继续堆命令，而是留下沉默、静止的形象。作者由他的实际行动表达悲痛与敬意。"},{"label":"阅读短引","text":"原句关键词：“必须把六十人救出去！”“把克莱芒救出去！”“忠于职守”。人物题要先找一次具体言行，再解释这次言行怎样表现他的特点；不必把所有赞美词都写上。"}]}},{"type":"teach","phase":"teach","title":"成语要落在事情上","body":"先明白情境，再挑词。几个“勇敢”的词，着重点也不同。","detail":["视死如归：面对死亡毫不畏惧。百折不挠、坚韧不拔：受挫仍坚持。泰然自若：镇定自然。身先士卒：带头行动。奋不顾身：奋勇向前不顾个人安危。神机妙算：机智且善于谋划。勇往直前：勇敢向前。"],"id":"k-unit2-garden-06","source":"P80–84","kicker":"按书细读","tutorial":[{"title":"先分出你在写什么","text":"写一个人看起来不慌，关注神态；写他冲在前面，关注行动。"},{"title":"比较两个容易混的词","text":"“泰然自若”说明镇定；“身先士卒”说明带头。一个人可能都有，但题目问神态时选前者。"},{"title":"成语放回句子","text":"负责人镇定安排撤离，可说泰然自若；困难前率先上前，可说身先士卒。"}]},{"type":"choice","phase":"independent","title":"选一个最贴切的词","body":"大家慌乱时，负责人神态镇定地安排撤离。重点写神态，选哪个？","options":[{"id":"0","text":"神机妙算"},{"id":"1","text":"泰然自若"},{"id":"2","text":"望眼欲穿"}],"answer":"1","explanation":"泰然自若着重镇定的神态；神机妙算着重计谋。","repair":{"gap":"先看题目要你比较什么。","reason":"泰然自若着重镇定的神态；神机妙算着重计谋。","check":"回到原题，用这个依据再判断。"},"id":"k-unit2-garden-07","source":"P80–84","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"把珍惜时间读出意思","body":"不是催自己一直做题，而是知道一段好时光值得认真使用。","detail":["陶渊明：盛年不重来，一日难再晨。及时当勉励，岁月不待人。意思是光阴不能重来，应及时自勉。","岳飞：莫等闲，白了少年头，空悲切。意思是不要虚度年华，年老时才徒然悲伤。","原书还列毛泽东惜时词句：联系时间紧迫、抓住当下的意思理解，可对照纸书积累。"],"id":"k-unit2-garden-08","source":"P80–84","kicker":"按书细读","tutorial":[{"title":"先读完整的意思","text":"“盛年不重来，一日难再晨。”好年华、一天的早晨过去就不会重来。"},{"title":"再读作者在劝什么","text":"“及时当勉励，岁月不待人。”劝人把眼前时间用好，别一直拖到以后。"},{"title":"再比较两种劝法","text":"岳飞劝人别虚度青春，毛泽东用“一万年”与“朝夕”对照，强调现在行动。共同意思相近，不能混写作者和句子。"},{"title":"用一件事解释","text":"火车上先读懂一个故事，到了酒店接着写一段，比一边惦记一边始终不开工更实际。"}]},{"type":"recall","phase":"recall","title":"遮住积累，背后解释","prompt":"从随身阅读的三组惜时句里先选一组。读懂后收起材料背出，再写一句自己的解释；另两组可留下一次积累。","reference":"可以选“盛年不重来，一日难再晨”等。先核对原句，再说明时间过去不再回来，要珍惜当下；理解不等于要求自己不停学习。","checklist":["背的是这里提供的原句","我能解释主要意思","我的例子与珍惜时间有关"],"id":"k-unit2-garden-09","source":"P80–84","kicker":"遮住讲回","reading":{"title":"把第二单元接起来：快读、人物与概括","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"可在这里学习的惜时句","text":"陶渊明：“盛年不重来，一日难再晨。及时当勉励，岁月不待人。”意思是好年华和过去的时间不会重来，要珍惜当下。岳飞：“莫等闲，白了少年头，空悲切。”劝人别把时光轻易耗去。珍惜时间也包括学一段、休息后再接续。"},{"label":"第三组惜时积累","text":"毛泽东：“多少事，从来急；天地转，光阴迫。一万年太久，只争朝夕。”这里夸张地对照很久的等待与眼前的日子，勉励人抓紧当下、主动行动。可以和陶渊明、岳飞的句子比较：共同都在劝珍惜时间，语气和表达方式不同。"}],"source":"P80–84；将相和回忆P52–58"}},{"type":"open","phase":"independent","title":"单元独立回看","prompt":"用《将相和》作独立检查：蔺相如为何对秦王强硬、对廉颇避让？两种做法背后共同看重什么？先凭记忆说，再决定是否打开材料。","reference":"对秦王强硬是为维护赵国尊严；对廉颇避让是为避免将相相争削弱赵国。态度不同，背后都把国家利益放在个人意气前。","checklist":["分别解释面对两人的处境","没有把退让直接判成胆小","指出两种行动共同维护的利益"],"id":"k-unit2-garden-10","source":"P80–84单元回看；相关原课文与讲解P52–58","kicker":"课后题与常见考法"},{"type":"open","phase":"transfer","title":"新文章也能用","prompt":"读旅行地的一段介绍，你想知道开放区域在哪里。怎样读得快又不漏条件？","reference":"先带问题定位，再读“仅、开放时间、除外”等限制；概括答案并保留决定行动的条件。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"k-unit2-garden-11","source":"P80–84","kicker":"换个情境"},{"id":"k-unit2-garden-end","type":"teach","phase":"transfer","title":"这一段先收住，下次从这里接","body":"先说一件今天能自己解释的事。还不会的留下来；暂停不清空，下一次从未完成处继续。","source":"P80–84","tutorial":[{"title":"带走一句自己的话","text":"不用追求现在把整课都做完。先说你今天学会使用的一种方法。"},{"title":"留下真正的接续点","text":"还有未完成的题或需要提示的地方，继续保留，不把“看过”记成“独立会”。"}]}],"reading":{"title":"把第二单元接起来：快读、人物与概括","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"快读的目标","text":"快读要减少无用停顿，不能丢掉意思。可以按词组读、带问题找关键句；遇到不影响当前主线的陌生词先作记号，遇到决定因果和人物态度的词要停下来弄清。读后用自己的话讲主要内容，才知道读懂没有。"},{"label":"将相和回忆一：完璧归赵","text":"秦王想用城池换赵国的和氏璧。蔺相如到了秦国，发现秦王只顾宝物、不提交城，便设法取回宝物、争取时间，安排人把璧送回赵国，自己再去应对秦王。他有了功劳，得到任用。"},{"label":"将相和回忆二：渑池会面","text":"两国国君相会，秦王想借赵王演奏来显示自己占上风。蔺相如据理力争，维护赵王和赵国的尊严；廉颇同时带兵在边境作准备。蔺相如再次立功，职位升得比廉颇更高。"},{"label":"将相和回忆三：负荆请罪","text":"廉颇因职位高低不服气，想让蔺相如难堪。蔺相如主动避让，解释自己担心将相相争会削弱赵国，让秦国有机可乘。廉颇明白后真诚认错，两人共同保卫国家。前两件事解释“不和”怎样发生，第三件事解释为什么能“和”。"},{"label":"同一人物，面对的人不同","text":"蔺相如面对秦王强硬，面对廉颇却退让。看起来相反，背后的理由相同：维护赵国利益。不能把一次退让直接判断成胆小。看人物要同时看行动、处境和原因。"},{"label":"概括的三个位置","text":"谁遇到什么事？怎样处理？结果如何？写一句概括时，删去重复对话和次要细节，但不能删掉导致后续变化的关键结果。例如海难故事的结果，要同时说到他人得救与船长随船沉没。"},{"label":"成语各有着重点","text":"泰然自若重神态镇定；身先士卒重带头行动；神机妙算重谋划巧妙；百折不挠重屡次受挫仍坚持；坚韧不拔重意志坚定；勇往直前重坚定向前；视死如归重不畏死亡；奋不顾身重不顾个人安危。选词要贴合文中情境，不能用极端词形容普通小事。"},{"label":"可在这里学习的惜时句","text":"陶渊明：“盛年不重来，一日难再晨。及时当勉励，岁月不待人。”意思是好年华和过去的时间不会重来，要珍惜当下。岳飞：“莫等闲，白了少年头，空悲切。”劝人别把时光轻易耗去。珍惜时间也包括学一段、休息后再接续。"},{"label":"第三组惜时积累","text":"毛泽东：“多少事，从来急；天地转，光阴迫。一万年太久，只争朝夕。”这里夸张地对照很久的等待与眼前的日子，勉励人抓紧当下、主动行动。可以和陶渊明、岳飞的句子比较：共同都在劝珍惜时间，语气和表达方式不同。"}],"source":"P80–84；将相和回忆P52–58"},"examTargets":["用词组、问题和关键句提高阅读效率","将相和三故事的因果与人物共同目标","概括保留关键事件与结果","成语辨义和惜时名句理解"],"segments":[{"id":"unit2-bridge","title":"接上将相和：三个故事为什么连着","startStepId":"k-unit2-garden-01","endStepId":"k-unit2-garden-04","minutes":9,"scene":"train","goal":"连词成句快读，回想三件事与升职、不和、和好的因果。","check":"不只背故事名，还能解释前两件事怎样带出第三件事。"},{"id":"unit2-review","title":"概括、成语和一道人物题","startStepId":"k-unit2-garden-05","endStepId":"k-unit2-garden-end","minutes":13,"scene":"hotel","goal":"保留概括的关键结果，辨成语，再解释将相共同目标。","check":"独立说明蔺相如为何强硬又避让，并指出共同原因。"}],"sourceNotes":["本次教学重做：随身阅读为依据原书的原创转述；分步示范与局部表达帮助必须记提示，不代表孩子已独立完成。"],"reader":{"kind":"guide","core":"抓关键句，把一篇文章用几句话说清。","hook":"读得快，也要说得明白。","author":"读写小练习","pages":"P80–84","textSource":"依据家长所供教辅的本课要求编写；以下是原创学习指引，不是课文原文。","paragraphs":[{"label":"带着问题读","text":"先看题目，想知道什么？读的时候去找答案，不必每一句都停下来分析。","anchor":"","meaning":"带着问题读","why":"快读有一个要找的东西。"},{"label":"抓住关键句","text":"速度课抓“谁比谁快”；人物故事抓他在困难中说了什么、做了什么。","anchor":"","meaning":"抓住关键句","why":"线索抓住，整篇就容易接起来。"},{"label":"试着概括","text":"说“谁，遇到什么，怎样做，结果怎样”。留下关键事情，去掉不影响主线的细节。","anchor":"","meaning":"试着概括","why":"短，不等于把重要结果漏掉。"},{"label":"讲回这一单元","text":"选一篇，不看提示讲半分钟。卡住时只回到卡住的地方再读。","anchor":"","meaning":"讲回这一单元","why":"自己能讲出，才知道哪里读懂了。"}],"tests":[{"q":"如果一个陌生词不影响眼前事情的理解，你怎样处理？如果它决定人物态度呢？","ref":"前者先标记继续，读后查；后者回读或查清。快读不能牺牲理解。","back":0,"modelAnswer":"陌生词如果暂时不影响理解事情的主要经过，我会先往下读，读完再回头查。它如果决定人物的态度，我就会停下来，联系前后文弄清意思，因为理解错这个词，可能连人物的想法也判断错。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"用“谁＋做了什么＋结果”概括《“诺曼底号”遇难记》，再说哪一处不能省。","ref":"可抓船遇险、船长组织救援、乘客获救而船长殉职。不要为了短而丢掉决定人物形象的结果。","back":0,"modelAnswer":"哈尔威船长在“诺曼底号”遇险后，冷静指挥大家有序撤离，使其他人获救，自己却随船沉没。\n“别人获救、船长随船沉没”这一结果不能省，否则就不能完整表现他的选择和忠于职守的精神。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"读旅行地的一段介绍，你想知道开放区域在哪里。怎样读得快又不漏条件？","ref":"先带问题定位，再读“仅、开放时间、除外”等限制；概括答案并保留决定行动的条件。","back":0,"modelAnswer":"我会先找介绍中的区域名称和位置说明，再仔细读与开放有关的句子。时间、入口以及“只限”“暂不开放”等条件要一起看，不能只看到地点名称就以为所有地方都能去。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"media":null}},{"id":"hailibu","title":"猎人海力布","date":null,"minutes":32,"bookPages":"P85–96","unit":3,"goal":"读懂起因、经过、结果；用具体言行理解人物，并换角色讲故事。","source":"金牌训练·同步教材 P85–96；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"这一单元，跟着故事走","body":"民间故事常有奇特想象。先理清因果，再把动人的地方讲出来。","detail":["P85–86单元目标：了解民间故事特点；创造性复述；提取主要信息。奇异情节表达人的愿望，不把传说当作真实历史证据。"],"id":"hailibu-01","source":"P85–96","kicker":"按书细读","reading":{"title":"海力布：读通一个秘密怎样改变所有人","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"起点：他平时怎样生活","text":"海力布靠打猎生活，也常把猎物分给别人。文章先让我们看到他平时乐于帮助人的行为。后面遇见更大的困难时，他怎样选择，就有了性格上的依据。"},{"label":"第一件事：救下小白蛇","text":"打猎时，他救下一条被老鹰抓走的小白蛇。小白蛇告诉他，自己是龙王的女儿，愿意带他去接受酬谢。一个普通的帮助行动，引出了故事中的神奇经历。"},{"label":"第二件事：得宝，也知道代价","text":"海力布不要许多珍宝，想要能听懂动物话语的宝石。龙王给了他，小白蛇又反复叮嘱：动物的话不能转告别人，否则他会变成石头。宝石既给能力，也带来限制，两件事必须一起记住。"},{"label":"变化：帮助更多人，又听见警报","text":"他用宝石了解到动物所在，分给乡亲的猎物更多。几年后，他听见鸟群准备逃离，因为当晚大山会崩塌、洪水会淹没村庄。知道灾难，不等于别人也知道他为什么可信。"},{"label":"矛盾：时间急，大家却不相信","text":"他赶回去催乡亲搬家。乡亲认为搬走老人、孩子和家产并不容易，需要听到原因；而解释原因会让他变石头。于是他面对两难：不解释，大家可能不走；解释，自己会付出代价。"},{"label":"决定：焦急变成镇定","text":"海力布明白，继续催促已经不能解决问题。他决定把得宝、听鸟语和禁忌都讲清，随后变成石头。“镇定”并非不在乎，而是在紧迫中作出了选择。"},{"label":"结果：撤离、灾难与纪念","text":"乡亲悲痛又后悔，带着老人孩子离开。夜里暴雨、大山崩塌，原来的村子被洪水淹没，印证了海力布的警告。后来人们纪念他，把一块石头与他的故事联系起来。文章用“据说”提示这是流传的民间故事。"},{"label":"读这篇要带走的办法","text":"先连起救蛇—得宝—救乡亲三件事；评价人物时用平时的小事和危急时的决定作证；换成“我”复述时，人物知道什么、经历什么不能变，心情和说法可以合理组织。"}]},"tutorial":[{"title":"先认识民间故事的读法","text":"神奇情节很吸引人，但要先弄懂它让人物多了什么能力、又受到什么限制。"},{"title":"本篇最重要的两条线","text":"海力布想保护乡亲；宝石的秘密却不能说。两条线碰到一起，故事的难题就出现了。"},{"title":"读完要能做什么","text":"换成海力布的身份讲劝说那一段；再给没听过的人介绍石头的来历。"}]},{"type":"teach","phase":"teach","title":"先过字词关","body":"读一遍，圈出不熟的字。先看结构和意思，再回课文读通。","detail":["会写字：救、蛇、酬、叮、嘱、禽、催、延、避、悔、倾、涌","会认字：誓 shì、谎 huǎng（酬见会写字）","词语：酬谢、叮嘱、飞禽走兽、催促、迟延、避难、后悔、倾盆大雨、流传、千真万确","“救”右边是攵；“延”不要写成廷；“悔”是忄。“给”在送给中读gěi，在给予中读jǐ。号叫háo、号召hào。"],"id":"hailibu-02","source":"P85–96","kicker":"按书细读","tutorial":[{"title":"词义先连到情节","text":"酬谢：救了人以后得到感谢和回报。叮嘱：反复认真提醒。催促：希望别人赶快行动。"},{"title":"三个容易写混的字","text":"救右边是攵；延不要写成廷；悔左边是忄。看字形，再放进“迟延、后悔”读。"},{"title":"把词放回事件","text":"小白蛇反复叮嘱，海力布焦急催促。前者提醒规则，后者希望立刻行动，不能乱换。"}]},{"type":"recall","phase":"recall","title":"遮住字表，自己写","prompt":"从刚才字词里选3个不熟的，看准后收起材料。可在纸上写并对照本页，或先打字认词；纸写和认词分开记录。","reference":"会写字供核对：救、蛇、酬、叮、嘱、禽、催、延、避、悔、倾、涌。“救”右攵、“延”别写廷、“悔”左忄。没有纸笔可以认词后继续，书写留待酒店完成。","checklist":["我说明这次是认词还是纸写","核对了自己不熟的字","仍不确定的已记下"],"id":"hailibu-03","source":"P85–96","kicker":"遮住讲回"},{"type":"model","phase":"guided","title":"一个秘密，连着两种后果","body":"先依次看四个转折，再试着抽走“禁忌”，看后面会缺少什么依据。","model":"story","config":{"scenes":[{"label":"获得宝石","cause":"救下小白蛇，得到报答","event":"能听懂动物的话","result":"能更好地帮助乡亲","evidence":"帮助别人，是他一直做的事"},{"label":"知道禁忌","cause":"小白蛇反复叮嘱","event":"把动物说的话告诉别人会变石头","result":"后面作决定时，他知道代价","evidence":"反复叮嘱为后文埋下伏笔"},{"label":"鸟儿报信","cause":"听到山崩洪水的消息","event":"催大家马上搬走","result":"乡亲不明白原因，不肯离开","evidence":"催促写出紧急"},{"label":"说清真相","cause":"灾难将至，解释时间不多","event":"讲出得宝石和听鸟语的经过","result":"变成石头；乡亲撤离得救","evidence":"人物的选择与结果连在一起"}]},"id":"hailibu-04","source":"P85–96","kicker":"跟着推演"},{"type":"recall","phase":"recall","title":"遮住图，讲清转折","prompt":"他为什么不能随便解释，却最后还是解释了？","reference":"说出动物的话会触发变石头的禁忌；乡亲缺乏原因不肯搬走，灾难又逼近，他选择说出真相救人。","checklist":["先收起提示，再试着讲","讲出了本题要求的关键关系","需要重新看的地方如实保留"],"id":"hailibu-05","source":"P85–96","kicker":"遮住讲回"},{"type":"teach","phase":"teach","title":"第1–6段：先认识人，再见宝物","body":"“平时怎样做”给人物打底。救蛇、得宝和叮嘱，把后面的冲突准备好。","detail":["第1段交代故事流传；第2段写他总把猎物分给乡亲；第3段救小白蛇；第4–6段得知宝石用途和代价。反复叮嘱让“知道危险仍选择救人”有依据。"],"id":"hailibu-06","source":"P85–96","kicker":"按书细读","tutorial":[{"title":"为什么不从神奇宝石开始","text":"先写分享猎物，读者认识的是一个平常就愿助人的猎人。"},{"title":"救蛇和得宝怎样相接","text":"先救下小白蛇，才获得龙王的答谢；宝物的出现不是凭空发生。"},{"title":"叮嘱在为哪一处作准备","text":"小白蛇反复说出代价，后面海力布变石头才有依据。这种预先埋下的线索叫伏笔。"}],"reading":{"title":"海力布：读通一个秘密怎样改变所有人","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"起点：他平时怎样生活","text":"海力布靠打猎生活，也常把猎物分给别人。文章先让我们看到他平时乐于帮助人的行为。后面遇见更大的困难时，他怎样选择，就有了性格上的依据。"},{"label":"第一件事：救下小白蛇","text":"打猎时，他救下一条被老鹰抓走的小白蛇。小白蛇告诉他，自己是龙王的女儿，愿意带他去接受酬谢。一个普通的帮助行动，引出了故事中的神奇经历。"},{"label":"第二件事：得宝，也知道代价","text":"海力布不要许多珍宝，想要能听懂动物话语的宝石。龙王给了他，小白蛇又反复叮嘱：动物的话不能转告别人，否则他会变成石头。宝石既给能力，也带来限制，两件事必须一起记住。"}]}},{"type":"choice","phase":"independent","title":"为什么先写分猎物？","body":"这处平常小事放在奇遇前，有什么作用？","options":[{"id":"0","text":"只为凑够故事长度"},{"id":"1","text":"让后面的救人选择与他一贯的热心相连"},{"id":"2","text":"证明他每次打猎最多"}],"answer":"1","explanation":"平常乐于助人，为危急时救乡亲的行为作铺垫。","repair":{"gap":"先看题目要你比较什么。","reason":"平常乐于助人，为危急时救乡亲的行为作铺垫。","check":"回到原题，用这个依据再判断。"},"id":"hailibu-07","source":"P85–96","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"第7–11段：急、静与结果","body":"越紧急，越能看清选择。“镇定”不是不担心，而是作出了决定。","detail":["第7段鸟语带来灾情；第8段急着催促，乡亲追问；第9段镇定地讲真相并变石；第10段搬家与洪水验证消息；第11段写人们纪念他。“据说”保留传说的性质。"],"id":"hailibu-08","source":"P85–96","kicker":"按书细读","tutorial":[{"title":"先找第一次卡住的地方","text":"海力布知道灾难，乡亲却不知道消息从哪来。单催“快搬”不能回答他们的疑问。"},{"title":"再解释为什么镇定","text":"他决定把原因说清，让乡亲相信。心理从急切催促转到承担代价。"},{"title":"最后看结果是否照应","text":"变石头照应禁忌；洪水到来照应鸟群警告。前面的信息，在后面都有结果。"}],"reading":{"title":"海力布：读通一个秘密怎样改变所有人","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"变化：帮助更多人，又听见警报","text":"他用宝石了解到动物所在，分给乡亲的猎物更多。几年后，他听见鸟群准备逃离，因为当晚大山会崩塌、洪水会淹没村庄。知道灾难，不等于别人也知道他为什么可信。"},{"label":"矛盾：时间急，大家却不相信","text":"他赶回去催乡亲搬家。乡亲认为搬走老人、孩子和家产并不容易，需要听到原因；而解释原因会让他变石头。于是他面对两难：不解释，大家可能不走；解释，自己会付出代价。"},{"label":"决定：焦急变成镇定","text":"海力布明白，继续催促已经不能解决问题。他决定把得宝、听鸟语和禁忌都讲清，随后变成石头。“镇定”并非不在乎，而是在紧迫中作出了选择。"},{"label":"结果：撤离、灾难与纪念","text":"乡亲悲痛又后悔，带着老人孩子离开。夜里暴雨、大山崩塌，原来的村子被洪水淹没，印证了海力布的警告。后来人们纪念他，把一块石头与他的故事联系起来。文章用“据说”提示这是流传的民间故事。"}]}},{"type":"order","phase":"independent","title":"把主线连起来","body":"按事情发生或方法使用的顺序，依次点选。","items":[{"id":"0","text":"救小白蛇"},{"id":"1","text":"得宝石并知道禁忌"},{"id":"2","text":"听到灾情"},{"id":"3","text":"劝搬家却不被理解"},{"id":"4","text":"说出真相、变成石头"},{"id":"5","text":"乡亲撤离并纪念他"}],"answer":["0","1","2","3","4","5"],"explanation":"得宝解释能听懂鸟语；禁忌解释变石；不信和危急解释最终选择。","repair":{"gap":"找出前一步给后一步带来的条件。","reason":"得宝解释能听懂鸟语；禁忌解释变石；不信和危急解释最终选择。","check":"先放起点，再连起因果。"},"id":"hailibu-09","source":"P85–96","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"人物题怎样答","prompt":"海力布是怎样的人？选两处不同言行作依据。","reference":"可说热心助人：分猎物、救蛇；愿为乡亲承担巨大代价：明知禁忌仍讲真相。评价要连证据，不要求你赞成故事中所有选择。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"hailibu-10","source":"P85–96","kicker":"课后题与常见考法","tutorial":[{"title":"审题：要两处不同依据","text":"写两个“善良”不算两处依据。先从平常生活、奇遇和危急时刻各找一件事。"},{"title":"老师先示范一处","text":"平常把猎物分给乡亲，这是帮助人的行动，所以可以说他热心助人。"},{"title":"第二处由你解释","text":"再选救蛇或说出秘密：发生了什么，它为什么支持你的人物判断？"}],"responseSupport":[{"label":"先放证据","text":"在……的时候，他……。","why":"先把一件事说实，再补“这说明”。"},{"label":"写第二处","text":"另一处是……，虽然……，他仍……。","why":"适合写条件与选择，但条件必须来自故事。"}],"reading":{"title":"海力布：读通一个秘密怎样改变所有人","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"起点：他平时怎样生活","text":"海力布靠打猎生活，也常把猎物分给别人。文章先让我们看到他平时乐于帮助人的行为。后面遇见更大的困难时，他怎样选择，就有了性格上的依据。"},{"label":"第一件事：救下小白蛇","text":"打猎时，他救下一条被老鹰抓走的小白蛇。小白蛇告诉他，自己是龙王的女儿，愿意带他去接受酬谢。一个普通的帮助行动，引出了故事中的神奇经历。"},{"label":"决定：焦急变成镇定","text":"海力布明白，继续催促已经不能解决问题。他决定把得宝、听鸟语和禁忌都讲清，随后变成石头。“镇定”并非不在乎，而是在紧迫中作出了选择。"}]}},{"type":"teach","phase":"teach","title":"换角色，不乱换事实","body":"改成“我”来讲，要站在海力布知道的事情里说。","detail":["创造性复述可补合情理的心情、动作或语言；不能让“我”提前知道还没发生的洪水。补写的想象与原故事事实分清。"],"id":"hailibu-11","source":"P85–96","kicker":"按书细读","tutorial":[{"title":"身份换了，知道的事有限","text":"用“我”讲，你知道自己得宝和听见鸟语；不能突然知道每个乡亲的内心。"},{"title":"时间位置先站稳","text":"讲“劝搬家”时，你还活着，还在努力说服；不能先说“我变成石头以后又大喊”。"},{"title":"局部示范","text":"“大家迟迟不肯走，我知道光着急没有用。”这是按当时处境作的合理转述。"},{"title":"把三步自己补上","text":"我怎样催→大家为什么不信→我决定怎样解释。情节保持，句子由你组织。"}]},{"type":"open","phase":"independent","title":"我就是海力布","prompt":"以海力布的身份讲“催搬家—大家追问—决定解释”这一段。写几句或先口头讲，再记关键词；暂时不写自己变石头之后又做了什么。","reference":"保留紧急、乡亲不理解、决定解释这三个条件。语言可以自己组织，不能把结果改成没有代价却人人立刻相信。","checklist":["以“我”的身份讲","保留乡亲不信和灾难逼近","解释决定说出原因的转折"],"id":"hailibu-12","source":"P85–96","kicker":"课后题与常见考法","responseSupport":[{"label":"表现紧急","text":"眼看……，我急忙……。","why":"用真实情节表达紧急，不必堆“非常非常”。"},{"label":"表现转折","text":"我明白，光……还不够，必须……。","why":"适合从催促转向解释原因，由你填关键意思。"}],"reading":{"title":"海力布：读通一个秘密怎样改变所有人","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"变化：帮助更多人，又听见警报","text":"他用宝石了解到动物所在，分给乡亲的猎物更多。几年后，他听见鸟群准备逃离，因为当晚大山会崩塌、洪水会淹没村庄。知道灾难，不等于别人也知道他为什么可信。"},{"label":"矛盾：时间急，大家却不相信","text":"他赶回去催乡亲搬家。乡亲认为搬走老人、孩子和家产并不容易，需要听到原因；而解释原因会让他变石头。于是他面对两难：不解释，大家可能不走；解释，自己会付出代价。"},{"label":"决定：焦急变成镇定","text":"海力布明白，继续催促已经不能解决问题。他决定把得宝、听鸟语和禁忌都讲清，随后变成石头。“镇定”并非不在乎，而是在紧迫中作出了选择。"}]}},{"type":"open","phase":"independent","title":"简要介绍那块石头","prompt":"向没听过故事的人讲清“海力布”石头的来历，保留必要因果，删去不影响来历的细节。","reference":"救蛇得宝→听懂灾情→为救乡亲说出秘密→变石并被纪念。简要介绍不用复述所有对话。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"hailibu-13","source":"P85–96","kicker":"课后题与常见考法","tutorial":[{"title":"题目只问石头的来历","text":"不要把所有对白搬进介绍；留下为什么得到能力、为什么说出秘密、为什么变石头。"},{"title":"老师示范删与留","text":"龙宫有什么珍宝可以略写；“说出动物的话会变石头”必须留，否则石头来源断了。"},{"title":"现在组织短介绍","text":"按救蛇得宝→听到灾情→解释秘密→变石被纪念来讲，用自己的话连因果。"}],"reading":{"title":"海力布：读通一个秘密怎样改变所有人","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"第一件事：救下小白蛇","text":"打猎时，他救下一条被老鹰抓走的小白蛇。小白蛇告诉他，自己是龙王的女儿，愿意带他去接受酬谢。一个普通的帮助行动，引出了故事中的神奇经历。"},{"label":"第二件事：得宝，也知道代价","text":"海力布不要许多珍宝，想要能听懂动物话语的宝石。龙王给了他，小白蛇又反复叮嘱：动物的话不能转告别人，否则他会变成石头。宝石既给能力，也带来限制，两件事必须一起记住。"},{"label":"变化：帮助更多人，又听见警报","text":"他用宝石了解到动物所在，分给乡亲的猎物更多。几年后，他听见鸟群准备逃离，因为当晚大山会崩塌、洪水会淹没村庄。知道灾难，不等于别人也知道他为什么可信。"},{"label":"决定：焦急变成镇定","text":"海力布明白，继续催促已经不能解决问题。他决定把得宝、听鸟语和禁忌都讲清，随后变成石头。“镇定”并非不在乎，而是在紧迫中作出了选择。"},{"label":"结果：撤离、灾难与纪念","text":"乡亲悲痛又后悔，带着老人孩子离开。夜里暴雨、大山崩塌，原来的村子被洪水淹没，印证了海力布的警告。后来人们纪念他，把一块石头与他的故事联系起来。文章用“据说”提示这是流传的民间故事。"}]}},{"type":"teach","phase":"teach","title":"奇特想象有什么用","body":"宝石听懂动物、人物变石，是传说里的想象。它们让人的愿望更鲜明。","detail":["本课把希望有人预知灾难、保护乡亲的愿望放进故事。培优阅读可对照纸书《八仙过海》，找奇异本领怎样推动事情发展。"],"id":"hailibu-14","source":"P85–96","kicker":"按书细读","tutorial":[{"title":"神奇不是无用装饰","text":"宝石让人听懂鸟语，变石禁忌让解释原因带上代价。它们直接推动事件。"},{"title":"人物的愿望是什么","text":"他希望保护乡亲；人们通过流传故事，记住愿意帮助别人的人。"},{"title":"想象与事实分开","text":"“据说”承认故事来自流传。可以欣赏想象，不必把宝石能力当作现实知识。"}]},{"type":"open","phase":"transfer","title":"换一个民间故事","prompt":"可以选本软件里已读过的牛郎织女，也可就海力布换问法：如果保留宝石的能力却删去禁忌，哪一种冲突会消失？说清原因，不用另找书。","reference":"有能力又有禁忌，才会出现“解释救人却会变石”的两难。若删去禁忌，海力布仍要说服乡亲，但承担变石代价的冲突不再成立。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"hailibu-15","source":"P85–96","kicker":"换个情境"},{"id":"hailibu-end","type":"teach","phase":"transfer","title":"这一段先收住，下次从这里接","body":"先说一件今天能自己解释的事。还不会的留下来；暂停不清空，下一次从未完成处继续。","source":"P85–96","tutorial":[{"title":"带走一句自己的话","text":"不用追求现在把整课都做完。先说你今天学会使用的一种方法。"},{"title":"留下真正的接续点","text":"还有未完成的题或需要提示的地方，继续保留，不把“看过”记成“独立会”。"}]}],"reading":{"title":"海力布：读通一个秘密怎样改变所有人","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"起点：他平时怎样生活","text":"海力布靠打猎生活，也常把猎物分给别人。文章先让我们看到他平时乐于帮助人的行为。后面遇见更大的困难时，他怎样选择，就有了性格上的依据。"},{"label":"第一件事：救下小白蛇","text":"打猎时，他救下一条被老鹰抓走的小白蛇。小白蛇告诉他，自己是龙王的女儿，愿意带他去接受酬谢。一个普通的帮助行动，引出了故事中的神奇经历。"},{"label":"第二件事：得宝，也知道代价","text":"海力布不要许多珍宝，想要能听懂动物话语的宝石。龙王给了他，小白蛇又反复叮嘱：动物的话不能转告别人，否则他会变成石头。宝石既给能力，也带来限制，两件事必须一起记住。"},{"label":"变化：帮助更多人，又听见警报","text":"他用宝石了解到动物所在，分给乡亲的猎物更多。几年后，他听见鸟群准备逃离，因为当晚大山会崩塌、洪水会淹没村庄。知道灾难，不等于别人也知道他为什么可信。"},{"label":"矛盾：时间急，大家却不相信","text":"他赶回去催乡亲搬家。乡亲认为搬走老人、孩子和家产并不容易，需要听到原因；而解释原因会让他变石头。于是他面对两难：不解释，大家可能不走；解释，自己会付出代价。"},{"label":"决定：焦急变成镇定","text":"海力布明白，继续催促已经不能解决问题。他决定把得宝、听鸟语和禁忌都讲清，随后变成石头。“镇定”并非不在乎，而是在紧迫中作出了选择。"},{"label":"结果：撤离、灾难与纪念","text":"乡亲悲痛又后悔，带着老人孩子离开。夜里暴雨、大山崩塌，原来的村子被洪水淹没，印证了海力布的警告。后来人们纪念他，把一块石头与他的故事联系起来。文章用“据说”提示这是流传的民间故事。"},{"label":"读这篇要带走的办法","text":"先连起救蛇—得宝—救乡亲三件事；评价人物时用平时的小事和危急时的决定作证；换成“我”复述时，人物知道什么、经历什么不能变，心情和说法可以合理组织。"}]},"examTargets":["三件主要事件及因果","禁忌的伏笔与照应","焦急到镇定的人物心理变化","转换角色复述与简要介绍石头来历"],"segments":[{"id":"hailibu-story","title":"读通宝石的能力与限制","startStepId":"hailibu-01","endStepId":"hailibu-05","minutes":11,"scene":"hotel","goal":"读故事、认关键字词，操控禁忌与后果。","check":"收起模型，解释“为什么不敢说，最后又为什么说”。"},{"id":"hailibu-evidence","title":"看前后照应，学会人物题","startStepId":"hailibu-06","endStepId":"hailibu-10","minutes":10,"scene":"hotel","goal":"从平常助人到危急选择，学会用两处言行举证。","check":"独立选择两处不同事件解释人物特点。"},{"id":"hailibu-retell","title":"换成我来讲，再介绍石头","startStepId":"hailibu-11","endStepId":"hailibu-end","minutes":11,"scene":"train","goal":"角色变换保留事实，简要介绍保留必要因果。","check":"以海力布口吻讲出转折，再说清石头来历。"}],"sourceNotes":["本次教学重做：随身阅读为依据原书的原创转述；分步示范与局部表达帮助必须记提示，不代表孩子已独立完成。"],"reader":{"author":"仁·甘珠尔扎布整理","pages":"P91–93","core":"记住救蛇、得宝、救乡亲，换成“我”讲一遍。","hook":"能听懂动物说话，却不能告诉别人……","notes":[{"anchor":"民间故事","meaning":"这是人们流传下来的故事。","why":"宝石和变石头是故事里的神奇想象。"},{"anchor":"总是把猎物分给大家","meaning":"平时他就热心帮助乡亲。","why":"后面的选择，有前面的事情作铺垫。"},{"anchor":"急忙搭箭开弓","meaning":"他先救了遇险的小白蛇。","why":"救蛇这件事，引出了后面得宝石的事。"},{"anchor":"如果对别人说了","meaning":"宝石能帮他，也有一条限制。","why":"先记住这条限制，后面才能读懂他的为难。"},{"anchor":"什么珍宝也不要","meaning":"他选了对打猎有用的宝石。","why":"不是见到什么宝物都想拿。"},{"anchor":"再三叮嘱","meaning":"小白蛇一遍又一遍地提醒。","why":"这是后面变石头的前因，不能漏着讲。"},{"anchor":"今天晚上","meaning":"灾难就在今晚，时间很紧。","why":"从这里开始，故事转向怎样救乡亲。"},{"anchor":"急得掉下了眼泪","meaning":"他急着救人，大家却还不相信。","why":"换成“我”来讲，也要把两边的难处说清。"},{"anchor":"镇定地","meaning":"想清楚后，他决定说出实情。","why":"从着急到镇定，说明他已经作出选择。"},{"anchor":"大山崩塌了","meaning":"乡亲们撤离后，灾难真的来了。","why":"这一结果接上前面鸟儿的话。"},{"anchor":"世世代代纪念","meaning":"大家一直记得他的帮助。","why":"最后回到人们对海力布的怀念。"}],"tests":[{"q":"不看书，用三件事讲清海力布的故事。","ref":"救小白蛇，得到有禁忌的宝石，为救乡亲说出秘密并变成石头。","back":2,"modelAnswer":"第一件事：海力布打猎时救了小白蛇，小白蛇要报答他。\n第二件事：他得到一颗能听懂动物说话的宝石，但不能把听到的话告诉别人，否则就会变成石头。\n第三件事：他听见灾难将至，为救乡亲说出秘密，自己变成石头，乡亲们及时搬走，躲过了灾难。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"为什么小白蛇要反复叮嘱？这和后面哪件事连着？","ref":"让读者先知道说出动物的话会变石头，后面海力布的选择和代价才讲得通。","back":5,"modelAnswer":"小白蛇反复叮嘱，是因为说出动物的话会让海力布变成石头，这个后果非常严重。这一叮嘱和后来海力布为救乡亲说出秘密、变成石头前后相连，也让我们明白他是在知道代价的情况下作出选择。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"现在你是海力布。用“我”讲劝乡亲搬家的这一段。","ref":"保持事情顺序和人物关系；用“我”讲焦急劝说、大家不信、决定说出真相，不能只换几个称呼。","back":7,"modelAnswer":"我听见鸟儿说，今晚大山要崩塌，洪水要淹没村子，便急忙赶回去劝乡亲们搬家。可是大家不相信，我急得掉下眼泪。我知道说出秘密就会变成石头，但为了救大家，还是把救小白蛇、得到宝石和听见灾难消息的经过都说了出来。话刚说完，我就变成了一块石头。","answerKind":"换人称复述示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"kind":"article","paragraphs":[{"text":"在我国的一些地区，流传着一个动人的民间故事。","anchor":"民间故事","meaning":"这是人们流
