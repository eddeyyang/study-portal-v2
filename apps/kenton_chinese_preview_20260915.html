传下来的故事。","why":"宝石和变石头是故事里的神奇想象。","label":"第 1 段"},{"text":"从前有一个猎人，名叫海力布。他热心帮助别人，每次打猎回来，总是把猎物分给大家，自己只留下很少的一份。大家都非常尊敬他。","anchor":"总是把猎物分给大家","meaning":"平时他就热心帮助乡亲。","why":"后面的选择，有前面的事情作铺垫。","label":"第 2 段"},{"text":"有一天，海力布到深山去打猎，忽然听见天上有呼救声。他抬头一看，一只老鹰抓着一条小白蛇正从他头上方飞过。他急忙搭箭开弓，对准老鹰射去。老鹰受了伤，丢下小白蛇逃了。","anchor":"急忙搭箭开弓","meaning":"他先救了遇险的小白蛇。","why":"救蛇这件事，引出了后面得宝石的事。","label":"第 3 段"},{"text":"海力布对小白蛇说：“可怜的小东西，快回家去吧！”小白蛇说：“敬爱的猎人，您是我的救命恩人，我要报答您。我是龙王的女儿，您跟我回去，我爸爸一定会好好酬谢您。我爸爸的宝库里有许多珍宝，您要什么都可以。如果您都不喜欢，可以要我爸爸含在嘴里的那颗宝石。只要嘴里含着那颗宝石，就能听懂各种动物说的话。”海力布想，珍宝我倒不在乎，能听懂动物的话，对一个猎人来说，实在是太好了。他问小白蛇：“真有这样一颗宝石吗？”小白蛇说：“真的。但是动物说什么话，您只能自己知道。如果对别人说了，您就会变成一块石头。”","anchor":"如果对别人说了","meaning":"宝石能帮他，也有一条限制。","why":"先记住这条限制，后面才能读懂他的为难。","label":"第 4 段"},{"text":"海力布点点头，跟着小白蛇到了龙宫。老龙王对海力布十分感激，要重谢他，于是把他领进宝库，让他自己挑选珍宝，爱什么就拿什么。海力布什么珍宝也不要，他对龙王说：“如果您真想给我点儿东西作纪念，请把您嘴里含着的那颗宝石送给我吧。”龙王低头想了一会儿，就把嘴里含的宝石吐出来，送给了海力布。","anchor":"什么珍宝也不要","meaning":"他选了对打猎有用的宝石。","why":"不是见到什么宝物都想拿。","label":"第 5 段"},{"text":"海力布临走的时候，小白蛇跟了出来，再三叮嘱他说：“敬爱的猎人，您要记住，无论动物说了什么话，都不要对别人说。如果说了，您马上就会变成石头，永远不能复活了！”海力布谢过小白蛇，就回家了。","anchor":"再三叮嘱","meaning":"小白蛇一遍又一遍地提醒。","why":"这是后面变石头的前因，不能漏着讲。","label":"第 6 段"},{"text":"海力布有了这颗宝石，打猎方便极了。他把宝石含在嘴里，能听懂飞禽走兽的语言，能知道哪座山上有哪些动物。从此以后，他每次打猎回来，分给大家的猎物更多了。这样过了几年。有一天，他正在深山里打猎，忽然听见一群鸟在议论着什么。仔细一听，那只领头的鸟说：“咱们赶快飞到别处去吧！今天晚上，这里的大山要崩塌，大地要被洪水淹没，不知道要淹死多少人呢！”","anchor":"今天晚上","meaning":"灾难就在今晚，时间很紧。","why":"从这里开始，故事转向怎样救乡亲。","label":"第 7 段"},{"text":"海力布听到这番话，大吃一惊。他急忙跑回家对大家说：“咱们赶快搬到别处去吧！这个地方不能住了！”大家听了感到很奇怪，住得好好的，为什么要搬家呢？尽管海力布焦急地催促大家，可是谁也不相信他。海力布急得掉下了眼泪，说：“我可以发誓，我说的话千真万确。相信我的话吧，赶快搬走！再晚就来不及了！”有个老人对海力布说：“海力布，你是我们的好邻居，我们知道你从来不说谎话。可是今天你让我们搬家，你总得说清楚哇。咱们在这山下住了好几代啦，老老小小这么多人，搬家可不容易呀！”","anchor":"急得掉下了眼泪","meaning":"他急着救人，大家却还不相信。","why":"换成“我”来讲，也要把两边的难处说清。","label":"第 8 段"},{"text":"海力布知道着急也没有用，不把为什么要搬家说清楚，大家是不会相信的。再一迟延，灾难就要夺去乡亲们的生命。要救乡亲们，只有牺牲自己。他想到这里，就镇定地对大家说：“今天晚上，这里的大山要崩塌，洪水要淹没大地。你们看，鸟都飞走了。”接着，他就把怎么得到宝石，怎么听见一群鸟议论避难，以及为什么不能把听来的消息告诉别人，都原原本本照实说了。海力布刚说完，就变成了一块石头。","anchor":"镇定地","meaning":"想清楚后，他决定说出实情。","why":"从着急到镇定，说明他已经作出选择。","label":"第 9 段"},{"text":"大家看见海力布变成了石头，都非常后悔，非常悲痛。他们含着眼泪，念着海力布的名字，扶着老人，领着孩子，赶着牛羊，往很远的地方走去。他们走在路上，忽然乌云密布，狂风怒号，接着就是倾盆大雨。半夜里，只听一声震天动地的巨响，大山崩塌了，洪水涌了出来，把他们住的村子淹没了。","anchor":"大山崩塌了","meaning":"乡亲们撤离后，灾难真的来了。","why":"这一结果接上前面鸟儿的话。","label":"第 10 段"},{"text":"人们世世代代纪念海力布。据说现在还能找到那块叫“海力布”的石头呢。","anchor":"世世代代纪念","meaning":"大家一直记得他的帮助。","why":"最后回到人们对海力布的怀念。","label":"第 11 段"}],"poem":false,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P91–93；按该书课文录入，省去注音与教参批注。","media":{"src":"/assets/reader-art/hailibu.webp","alt":"海力布向乡亲们指向远处，劝大家赶紧离开村庄。","caption":"知道危险，却不能说出秘密。海力布会怎么办？","credit":"AI 情境插画","kind":"story"}}},{"id":"cowherd-one","title":"牛郎织女（一）","date":null,"minutes":26,"bookPages":"P97–109","unit":3,"goal":"抓主要情节，读懂对比和伏笔；把简略情节扩写具体。","source":"金牌训练·同步教材 P97–109；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"先过字词关","body":"读一遍，圈出不熟的字。先看结构和意思，再回课文读通。","detail":["会写字：郎、嫂、棚、挺、罕、幸、柴、惯、纱、妻、哎、饰、婚、辈","会认字：舔 tiǎn、恳 kěn、筛 shāi、咧 liě、歹 dǎi、梭 suō、监 jiān、狱 yù、酿 niàng、瞌 kē、落 là、腮 sāi（嫂、罕、惯见会写字）","词语：嫂子、牛棚、稀罕、好歹、笑嘻嘻、成家立业、相依为命、眉开眼笑","“郎”右阝，“朗”右月；“嫂”右边叟；“妻”下女；“罕”不要写成军。“落”丢三落四là、落枕lào、落泪luò；看门kān、看见kàn；树干gàn、干扰gān。"],"id":"cowherd-one-01","source":"P97–109","kicker":"按书细读","reading":{"title":"牛郎织女（一）：从相依生活到决定成家","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：牛郎的处境","text":"牛郎小时候失去父母，跟哥哥嫂子生活，却受到冷落。他每天照看老牛，住得简陋。老牛虽然不会像人一样交谈，却成了他最亲近的伙伴。"},{"label":"二：关心写在具体事里","text":"牛郎挑好草、找干净的水，随季节照料老牛，还清理牛棚、帮助赶走虫子。他把心里的话说给老牛听，希望有一天它能回答。文章把这些小事写得详细，让“亲密、善良”看得见。"},{"label":"三：分家与独立","text":"哥哥嫂子让牛郎带走老牛和一辆旧车离开。牛郎失望于家人的态度，但庆幸还能与老牛相伴。他离家后靠劳动建起住处，开垦土地，让生活安顿下来。"},{"label":"四：老牛突然开口","text":"一天，老牛告诉牛郎，仙女将到湖中游玩，并指点他如何遇见织女。前面“牛会不会说话”的盼望在这里接上了。神奇帮助使故事从孤独劳动转向一次相遇。"},{"label":"五：见面与交谈","text":"牛郎照老牛的指点前往湖边，拿到织女的纱衣，随后把衣服归还，两人开始交谈。故事中的办法推动相遇；阅读时要继续听两人的处境和愿望，才知道为什么后来会一起生活。"},{"label":"六：织女讲天上生活","text":"织女虽然生活在天上，却整日织锦，缺少自由。她和伙伴们难得来到人间，喜欢这里的生活。牛郎也把自己的经历告诉她。两人逐渐理解彼此。"},{"label":"七：共同作出选择","text":"织女愿意留在人间，与牛郎共同生活，两人回家，老牛也替他们高兴。到这里，牛郎的生活从缺少亲人关心、独自劳动，走到有了相互理解的伴侣。"},{"label":"反问原句，供本课使用","text":"原句：“他又何必恋恋不舍呢？”原句：“离不离开家有什么关系？”联系分家处境，前一句强调没有必要留恋冷淡的家庭，后一句强调能与老牛在一起更重要。"}]},"tutorial":[{"title":"把人和词先认清","text":"牛郎的郎右边是阝；明朗的朗右边是月。嫂读 sǎo，妻下半是女。"},{"title":"词语放回关系","text":"相依为命：靠彼此生活；亲密：关系近；周到：各方面都照料到。"},{"title":"多音字凭意思选","text":"丢三落四读 là；落枕读 lào；落泪读 luò。先读整词，不让同一个字把句意带偏。"}]},{"type":"recall","phase":"recall","title":"遮住字表，自己写","prompt":"从“郎、嫂、惯、妻、辈”里选自己不熟的字，看准后收起材料。可纸写再核对，也可先认词打字；没纸笔不需要卡在这里。","reference":"核对：郎右阝，嫂右边是叟，惯左忄、右贯，妻下女，辈下面是车。本课会写字还包括棚、挺、罕、幸、柴、纱、哎、饰、婚。纸写留待安静时可接续。","checklist":["分清这次是认词还是书写","核对过自己选的字","不会的字已留下"],"id":"cowherd-one-02","source":"P97–109","kicker":"遮住讲回"},{"type":"model","phase":"guided","title":"前面一笔，后面有用","body":"查看三个前后关系，再抽走一处前因，判断故事哪里断了。","model":"story","config":{"scenes":[{"label":"相依为命","cause":"哥哥嫂子冷淡；牛郎孤单","event":"他细心照料老牛，常向它说话","result":"人与牛亲近，后面老牛帮助他有了铺垫","evidence":"吃、喝、住和驱蝇的细节"},{"label":"离开旧家","cause":"被赶走，只分得牛和车","event":"砍柴、种地、搭草房","result":"有自己的生活，仍缺少知心人","evidence":"劳动写出勤劳，冷落写出孤单"},{"label":"彼此理解","cause":"牛郎孤独，织女向往自由","event":"相遇后讲自己的遭遇","result":"二人愿意共同生活","evidence":"人物愿望解释婚姻选择"}]},"id":"cowherd-one-03","source":"P97–109","kicker":"跟着推演"},{"type":"recall","phase":"recall","title":"先讲回主要变化","prompt":"从童年到成家，牛郎的处境怎样变了？老牛在其中起了什么作用？","reference":"受冷落、与牛相伴→独立劳动生活→在老牛帮助下相遇织女并成家。按主要阶段说，不逐句搬原文。","checklist":["先收起提示，再试着讲","讲出了本题要求的关键关系","需要重新看的地方如实保留"],"id":"cowherd-one-04","source":"P97–109","kicker":"遮住讲回"},{"type":"teach","phase":"teach","title":"第1–8段：对比写人物","body":"家人的冷淡，与牛郎照顾老牛的细致相对照。读者因此理解他的孤单与善良。","detail":["第1–2段身世与冷落；第3–4段按吃草、喝水、住处和季节写细心照料；第5–8段被分家、离家、劳动安身。不要把“穷”直接等同“善良”，人物判断要看行为。"],"id":"cowherd-one-05","source":"P97–109","kicker":"按书细读","tutorial":[{"title":"同一处境看两种关系","text":"哥哥嫂子冷淡，老牛与他亲近；人和牛两边一比，更能感到牛郎的孤单。"},{"title":"照牛为什么不一笔带过","text":"照料随季节变化，还包括水草、牛棚和虫子。细节让“周到”不只是评价词。"},{"title":"考作用要连前后","text":"这些细节既表现勤劳善良，也让老牛后来帮助牛郎有情感上的依据。"}],"reading":{"title":"牛郎织女（一）：从相依生活到决定成家","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：牛郎的处境","text":"牛郎小时候失去父母，跟哥哥嫂子生活，却受到冷落。他每天照看老牛，住得简陋。老牛虽然不会像人一样交谈，却成了他最亲近的伙伴。"},{"label":"二：关心写在具体事里","text":"牛郎挑好草、找干净的水，随季节照料老牛，还清理牛棚、帮助赶走虫子。他把心里的话说给老牛听，希望有一天它能回答。文章把这些小事写得详细，让“亲密、善良”看得见。"},{"label":"三：分家与独立","text":"哥哥嫂子让牛郎带走老牛和一辆旧车离开。牛郎失望于家人的态度，但庆幸还能与老牛相伴。他离家后靠劳动建起住处，开垦土地，让生活安顿下来。"}]}},{"type":"choice","phase":"independent","title":"照牛为何写得详细？","body":"写喂草、饮水、清扫牛棚，最能说明什么？","options":[{"id":"0","text":"牛郎照料周到，也为老牛帮助他作铺垫"},{"id":"1","text":"牛郎不需要与人相处"},{"id":"2","text":"故事只介绍养牛方法"}],"answer":"0","explanation":"连续细节说明人与牛的感情，后文帮助不是突然出现的。","repair":{"gap":"先看题目要你比较什么。","reason":"连续细节说明人与牛的感情，后文帮助不是突然出现的。","check":"回到原题，用这个依据再判断。"},"id":"cowherd-one-06","source":"P97–109","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"第9–16段：奇遇让故事转向","body":"老牛开口，把牛郎带到新的相遇。讲述时抓办法、相遇和交谈的起点。","detail":["老牛指点去湖边；牛郎照做，取走纱衣又归还，随后与织女交谈。这是原故事的情节，不要在复述中漏掉先后，也不要把自己的改编混成原文。"],"id":"cowherd-one-07","source":"P97–109","kicker":"按书细读","tutorial":[{"title":"先看转折前的生活","text":"牛郎靠自己劳动安顿，但仍孤单。"},{"title":"神奇帮助让哪一步发生","text":"老牛开口指路，牛郎才有机会与织女相遇。讲故事时这一步不能省成“后来就结婚了”。"},{"title":"解释前后联系","text":"前面写亲近老牛、盼望交谈，后面开口帮助；准备与结果相连，故事更顺。"}],"reading":{"title":"牛郎织女（一）：从相依生活到决定成家","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"三：分家与独立","text":"哥哥嫂子让牛郎带走老牛和一辆旧车离开。牛郎失望于家人的态度，但庆幸还能与老牛相伴。他离家后靠劳动建起住处，开垦土地，让生活安顿下来。"},{"label":"四：老牛突然开口","text":"一天，老牛告诉牛郎，仙女将到湖中游玩，并指点他如何遇见织女。前面“牛会不会说话”的盼望在这里接上了。神奇帮助使故事从孤独劳动转向一次相遇。"},{"label":"五：见面与交谈","text":"牛郎照老牛的指点前往湖边，拿到织女的纱衣，随后把衣服归还，两人开始交谈。故事中的办法推动相遇；阅读时要继续听两人的处境和愿望，才知道为什么后来会一起生活。"}]}},{"type":"teach","phase":"teach","title":"第17–21段：听懂双方的愿望","body":"两个人讲出过去，才能理解为什么愿意一起生活。","detail":["织女在天上织锦，生活受束缚，向往自由。牛郎希望有知心人。共同愿望把相遇连向成家。最后老牛的反应呼应此前的帮助。"],"id":"cowherd-one-08","source":"P97–109","kicker":"按书细读","tutorial":[{"title":"不要只记相遇方法","text":"如果只讲怎么碰见，听众仍不知道为什么两个人愿意一起生活。"},{"title":"分别听见两个愿望","text":"牛郎希望有人相伴；织女希望摆脱受拘束的生活。交流让彼此理解。"},{"title":"结局从愿望接出来","text":"两人愿意共同生活，这才是从相遇到成家的关键。人物的行动要放回愿望理解。"}],"reading":{"title":"牛郎织女（一）：从相依生活到决定成家","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"五：见面与交谈","text":"牛郎照老牛的指点前往湖边，拿到织女的纱衣，随后把衣服归还，两人开始交谈。故事中的办法推动相遇；阅读时要继续听两人的处境和愿望，才知道为什么后来会一起生活。"},{"label":"六：织女讲天上生活","text":"织女虽然生活在天上，却整日织锦，缺少自由。她和伙伴们难得来到人间，喜欢这里的生活。牛郎也把自己的经历告诉她。两人逐渐理解彼此。"},{"label":"七：共同作出选择","text":"织女愿意留在人间，与牛郎共同生活，两人回家，老牛也替他们高兴。到这里，牛郎的生活从缺少亲人关心、独自劳动，走到有了相互理解的伴侣。"}]}},{"type":"choice","phase":"independent","title":"“眉开眼笑”着重什么？","body":"牛郎听到能与织女共同生活时很欢喜。哪个理解贴切？","options":[{"id":"0","text":"舒展眉眼，显出愉快"},{"id":"1","text":"眉毛真的张开了"},{"id":"2","text":"和愤怒完全一样"}],"answer":"0","explanation":"联系喜悦情境理解神态。眉飞色舞常更突出兴奋、得意的神色，不是到处互换。","repair":{"gap":"先看题目要你比较什么。","reason":"联系喜悦情境理解神态。眉飞色舞常更突出兴奋、得意的神色，不是到处互换。","check":"回到原题，用这个依据再判断。"},"id":"cowherd-one-09","source":"P97–109","kicker":"课后题与常见考法"},{"type":"order","phase":"independent","title":"抓主线，不搬所有话","body":"按事情发生或方法使用的顺序，依次点选。","items":[{"id":"0","text":"幼年受冷落，与牛相伴"},{"id":"1","text":"离家后劳动安身"},{"id":"2","text":"老牛开口指点"},{"id":"3","text":"湖边相遇并交谈"},{"id":"4","text":"双方愿意成家"}],"answer":["0","1","2","3","4"],"explanation":"这些是主要转折，具体对话可以在讲述时有选择地展开。","repair":{"gap":"找出前一步给后一步带来的条件。","reason":"这些是主要转折，具体对话可以在讲述时有选择地展开。","check":"先放起点，再连起因果。"},"id":"cowherd-one-10","source":"P97–109","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"独立回答课后题","prompt":"用自己的话概括这个故事，并解释“相依为命”为什么适合牛郎与老牛。","reference":"概括抓主要转折；词语解释要说明孤单处境、互相依靠与感情，不只是把词换成另一个词。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"cowherd-one-11","source":"P97–109","kicker":"课后题与常见考法","tutorial":[{"title":"题目有两个任务","text":"先概括故事，再解释“相依为命”为什么贴切。两个任务要分别回答。"},{"title":"概括保留四个阶段","text":"受冷落→照牛和独立劳动→老牛相助→相遇成家。不需要照抄二十多段。"},{"title":"解释词语要找处境","text":"不能只写“相依为命就是互相依靠”。还要说谁依靠谁、为何这样依靠。"}],"responseSupport":[{"label":"连起阶段","text":"起初……，后来……，在……的帮助下……。","why":"每个空填关键变化，不要塞满所有细节。"},{"label":"把词放回人","text":"这个词合适，因为牛郎……，而老牛……。","why":"解释双方关系；只报近义词不够。"}],"reading":{"title":"牛郎织女（一）：从相依生活到决定成家","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：牛郎的处境","text":"牛郎小时候失去父母，跟哥哥嫂子生活，却受到冷落。他每天照看老牛，住得简陋。老牛虽然不会像人一样交谈，却成了他最亲近的伙伴。"},{"label":"二：关心写在具体事里","text":"牛郎挑好草、找干净的水，随季节照料老牛，还清理牛棚、帮助赶走虫子。他把心里的话说给老牛听，希望有一天它能回答。文章把这些小事写得详细，让“亲密、善良”看得见。"},{"label":"三：分家与独立","text":"哥哥嫂子让牛郎带走老牛和一辆旧车离开。牛郎失望于家人的态度，但庆幸还能与老牛相伴。他离家后靠劳动建起住处，开垦土地，让生活安顿下来。"},{"label":"四：老牛突然开口","text":"一天，老牛告诉牛郎，仙女将到湖中游玩，并指点他如何遇见织女。前面“牛会不会说话”的盼望在这里接上了。神奇帮助使故事从孤独劳动转向一次相遇。"},{"label":"七：共同作出选择","text":"织女愿意留在人间，与牛郎共同生活，两人回家，老牛也替他们高兴。到这里，牛郎的生活从缺少亲人关心、独自劳动，走到有了相互理解的伴侣。"}]}},{"type":"teach","phase":"teach","title":"扩写要添什么","body":"给简略的一件事补上具体动作、对话和神态，让人仿佛看见。","detail":["先找原文没展开的地方，例如牛郎照顾老牛、织女谈天上生活。补写应合人物性格和当时条件，保留主线；与“故事新编”改变情节的任务分清。"],"id":"cowherd-one-12","source":"P97–109","kicker":"按书细读","tutorial":[{"title":"先保留原来发生的事","text":"扩写“牛郎照顾老牛”，不能变成他不管老牛去当将军。"},{"title":"选一个时刻，不加一整天","text":"比如给牛喂水这一刻：他怎么拿、怎么放、看到了什么反应？"},{"title":"局部示范","text":"原创合理想象：“他摸了摸水盆，见水不冰了，才推到老牛面前。”用动作显示细心，不是重复“非常细心”。"},{"title":"接下来撤去示范","text":"你换一个照料时刻或织女叙述天上生活，自选动作、语气或表情。"}]},{"type":"open","phase":"independent","title":"把简略处讲具体","prompt":"选“牛郎照料老牛”或“织女讲述天上生活”，写三五句自创细节，注明“我的合理想象”。","reference":"要有场景、动作或对话；不能只反复说“非常细心”“特别不自由”。想象不能与已知情节冲突。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"cowherd-one-13","source":"P97–109","kicker":"课后题与常见考法","responseSupport":[{"label":"让动作有顺序","text":"先……，又……，最后……。","why":"适合连续动作，但要省掉没有作用的步骤。"},{"label":"表现心情变化","text":"刚……，便……。","why":"可以连接一处观察和人物反应；细节由你想。"}],"reading":{"title":"牛郎织女（一）：从相依生活到决定成家","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"二：关心写在具体事里","text":"牛郎挑好草、找干净的水，随季节照料老牛，还清理牛棚、帮助赶走虫子。他把心里的话说给老牛听，希望有一天它能回答。文章把这些小事写得详细，让“亲密、善良”看得见。"},{"label":"六：织女讲天上生活","text":"织女虽然生活在天上，却整日织锦，缺少自由。她和伙伴们难得来到人间，喜欢这里的生活。牛郎也把自己的经历告诉她。两人逐渐理解彼此。"}]}},{"type":"open","phase":"independent","title":"把两句反问改得意思不变","prompt":"原句已在随身阅读中：“他又何必恋恋不舍呢？”“离不离开家有什么关系？”任选一句，改成陈述句，再解释原句加强了哪一种感情。","reference":"“他没有必要恋恋不舍。”“只要还能与老牛在一起，离不离开这个家并不重要。”反问加强了对冷淡家庭不再留恋、庆幸能与老牛相伴的语气。","checklist":["改句保留原来的肯定或否定意思","解释联系分家的处境","没有只说“加强语气”就停住"],"id":"cowherd-one-14","source":"P97–109","kicker":"课后题与常见考法","tutorial":[{"title":"先看反问是否真在求答案","text":"牛郎不是请别人解释“有什么关系”，而是在表达自己的判断。"},{"title":"把问法换成直接判断","text":"“何必”常是在说“没有必要”。改变句式时，别把原来的否定改成肯定。"},{"title":"再说明态度","text":"回到被冷落却能带走老牛的处境，就知道这反问表达不再留恋和庆幸。"}],"reading":{"title":"牛郎织女（一）：从相依生活到决定成家","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"三：分家与独立","text":"哥哥嫂子让牛郎带走老牛和一辆旧车离开。牛郎失望于家人的态度，但庆幸还能与老牛相伴。他离家后靠劳动建起住处，开垦土地，让生活安顿下来。"},{"label":"反问原句，供本课使用","text":"原句：“他又何必恋恋不舍呢？”原句：“离不离开家有什么关系？”联系分家处境，前一句强调没有必要留恋冷淡的家庭，后一句强调能与老牛在一起更重要。"}]}},{"type":"open","phase":"transfer","title":"用到新故事里","prompt":"一句“孩子终于找到朋友”很简略。你会补哪两类细节，让读者知道他们为什么成为朋友？","reference":"补相处中互相帮助的事情、对话或神态；细节应解释友情形成，不能只添加衣服颜色。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"cowherd-one-15","source":"P97–109","kicker":"换个情境"},{"id":"cowherd-one-end","type":"teach","phase":"transfer","title":"这一段先收住，下次从这里接","body":"先说一件今天能自己解释的事。还不会的留下来；暂停不清空，下一次从未完成处继续。","source":"P97–109","tutorial":[{"title":"带走一句自己的话","text":"不用追求现在把整课都做完。先说你今天学会使用的一种方法。"},{"title":"留下真正的接续点","text":"还有未完成的题或需要提示的地方，继续保留，不把“看过”记成“独立会”。"}]}],"reading":{"title":"牛郎织女（一）：从相依生活到决定成家","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：牛郎的处境","text":"牛郎小时候失去父母，跟哥哥嫂子生活，却受到冷落。他每天照看老牛，住得简陋。老牛虽然不会像人一样交谈，却成了他最亲近的伙伴。"},{"label":"二：关心写在具体事里","text":"牛郎挑好草、找干净的水，随季节照料老牛，还清理牛棚、帮助赶走虫子。他把心里的话说给老牛听，希望有一天它能回答。文章把这些小事写得详细，让“亲密、善良”看得见。"},{"label":"三：分家与独立","text":"哥哥嫂子让牛郎带走老牛和一辆旧车离开。牛郎失望于家人的态度，但庆幸还能与老牛相伴。他离家后靠劳动建起住处，开垦土地，让生活安顿下来。"},{"label":"四：老牛突然开口","text":"一天，老牛告诉牛郎，仙女将到湖中游玩，并指点他如何遇见织女。前面“牛会不会说话”的盼望在这里接上了。神奇帮助使故事从孤独劳动转向一次相遇。"},{"label":"五：见面与交谈","text":"牛郎照老牛的指点前往湖边，拿到织女的纱衣，随后把衣服归还，两人开始交谈。故事中的办法推动相遇；阅读时要继续听两人的处境和愿望，才知道为什么后来会一起生活。"},{"label":"六：织女讲天上生活","text":"织女虽然生活在天上，却整日织锦，缺少自由。她和伙伴们难得来到人间，喜欢这里的生活。牛郎也把自己的经历告诉她。两人逐渐理解彼此。"},{"label":"七：共同作出选择","text":"织女愿意留在人间，与牛郎共同生活，两人回家，老牛也替他们高兴。到这里，牛郎的生活从缺少亲人关心、独自劳动，走到有了相互理解的伴侣。"},{"label":"反问原句，供本课使用","text":"原句：“他又何必恋恋不舍呢？”原句：“离不离开家有什么关系？”联系分家处境，前一句强调没有必要留恋冷淡的家庭，后一句强调能与老牛在一起更重要。"}]},"examTargets":["按主要阶段概括内容","细节与对比体现牛郎形象","反问改陈述并解释语气","在不改主线的前提下把简略处讲具体"],"segments":[{"id":"cowherd1-story","title":"读懂相依为命与相遇","startStepId":"cowherd-one-01","endStepId":"cowherd-one-08","minutes":13,"scene":"hotel","goal":"认词并读完故事，看关系对比、帮助和人物愿望。","check":"能说出牛郎处境怎样变化，老牛为什么重要。"},{"id":"cowherd1-expand","title":"概括、扩写与反问","startStepId":"cowherd-one-09","endStepId":"cowherd-one-end","minutes":13,"scene":"hotel","goal":"抓主线概括，把一个简略时刻写具体。","check":"保留原情节写自己的细节，并解释一句反问的态度。"}],"sourceNotes":["本次教学重做：随身阅读为依据原书的原创转述；分步示范与局部表达帮助必须记提示，不代表孩子已独立完成。"],"reader":{"author":"叶圣陶整理","pages":"P102–107","core":"抓主要事情，再把简略的地方讲具体。","hook":"他最亲密的伙伴，竟然是一头牛。","groups":[[0,1,"温和的眼神","牛郎孤单，老牛却亲近他。","把亲人的冷淡和老牛的温和放在一起看。"],[2,3,"照看那头牛挺周到","吃、喝、清洁，他都照顾到。","说牛郎勤劳善良，要拿这些小事作依据。"],[4,7,"头也不回","被赶出家后，他靠劳动安家。","抓“打柴、盖房、种庄稼”，看他怎样过日子。"],[8,12,"老牛真会说话了","老牛开口，告诉他怎样遇见织女。","会说话是民间故事的想象。复述别漏老牛的帮助。"],[13,16,"双手托着纱衣","牛郎和织女在湖边相识。","这是旧故事的情节；生活中拿别人的东西要先问同意。"],[17,19,"自由","织女不喜欢没有自由的生活。","想象对话时，要符合她想过自由生活的愿望。"],[20,20,"手拉着手","两人一起回家，见到老牛。","相识之后成家，事情接成了一条线。"]],"tests":[{"q":"牛郎怎样照顾老牛？挑两件具体事说一说。","ref":"如挑好草、让牛喝干净水、刷身赶虻、打扫牛棚。具体事情说明照看周到。","back":2,"modelAnswer":"牛郎让老牛吃嫩嫩的青草，喝干净的水，还把牛棚打扫得干干净净。天气热时，他牵老牛到树林里休息；天气冷时，又让它在山坡上晒太阳。这些事情说明他照顾老牛很细心。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"讲一讲牛郎是怎样和织女认识的。","ref":"老牛指点，牛郎到湖边，归还纱衣后交谈，两人说起各自生活，决定一起过日子。","back":8,"modelAnswer":"老牛告诉牛郎，仙女们会到湖里洗澡，并指点他去找织女。牛郎来到湖边，拿起粉红色纱衣。其他仙女飞走后，他把纱衣还给织女，两人交谈，知道了彼此的生活。织女向往人间自由的生活，后来与牛郎结为夫妻。","answerKind":"故事复述参考","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"“他常常把看见的、听见的事告诉牛。”选一天，把这句话讲成一个小场面。","ref":"可以想象时间地点、见闻、牛郎的话和老牛的反应；符合人物处境，并说明这是自己补充的想象。","back":3,"modelAnswer":"傍晚，牛郎抱来一捆青草，坐在老牛身旁。他轻轻摸着牛背说：“今天我在山坡上看见一窝小鸟，它们正张着嘴等妈妈呢。”老牛慢慢嚼着草，抬起头看了看他。牛郎笑了，接着讲起白天的见闻。","answerKind":"合理想象示例","answerNote":"补出的动作和对话是合理想象；你可以有不同写法。"}],"kind":"article","paragraphs":[{"text":"古时候有个孩子，爹娘都死了，跟着哥哥嫂子过日子。哥哥嫂子待他很不好，叫他吃剩饭，穿破衣裳，夜里在牛棚里睡。牛棚里没床铺，他就睡在干草上。他每天放牛。那头牛跟他很亲密，用温和的眼神看着他，有时候还伸出舌头舔舔他的手，怪有意思的。哥哥嫂子见着他总是爱理不理的，仿佛他一在眼前，就浑身不舒服。两相比较，他也乐得跟牛一块儿出去，一块儿睡。","anchor":"温和的眼神","meaning":"牛郎孤单，老牛却亲近他。","why":"把亲人的冷淡和老牛的温和放在一起看。","label":"第 1 段"},{"text":"他没名字，人家见他每天放牛，就叫他牛郎。","anchor":"","meaning":"牛郎孤单，老牛却亲近他。","why":"把亲人的冷淡和老牛的温和放在一起看。","label":"第 2 段"},{"text":"牛郎照看那头牛挺周到。一来是牛跟他亲密；二来呢，他想，牛那么勤勤恳恳地干活，不好好照看它，怎么对得起它呢？他总是挑很好的草地，让牛吃嫩嫩的青草；家里吃的干草，筛得一点儿土也没有。牛渴了，他就牵着它到小溪的上游，让它喝干净的水。夏天天气热，就在树林里休息；冬天天气冷，就在山坡上晒太阳。他把牛身上刷得干干净净，不沾一点儿草叶、土粒。夏天，一把蒲扇不离手，把成群乱转的牛虻都赶跑了。牛棚也打扫得干干净净。在干干净净的地方住，牛舒服，自己也舒服。","anchor":"照看那头牛挺周到","meaning":"吃、喝、清洁，他都照顾到。","why":"说牛郎勤劳善良，要拿这些小事作依据。","label":"第 3 段"},{"text":"牛郎随口哼几支小曲儿，没人听他的，可是牛摇摇耳朵闭闭眼，好像听得挺有味儿。牛郎心里想什么，嘴里就说出来，没人听他的，可是牛咧开嘴，笑嘻嘻的，好像明白他的意思。他常常把看见的、听见的事告诉牛，有时候跟它商量一些事。牛好像全了解，虽然没说话，可是眉开眼笑的，他也就满意了。自然，有时候他还觉得美中不足，要是牛能说话，把了解的和想说的都一五一十地说出来，那该多好呢。","anchor":"","meaning":"吃、喝、清洁，他都照顾到。","why":"说牛郎勤劳善良，要拿这些小事作依据。","label":"第 4 段"},{"text":"一年一年过去，牛郎渐渐长大了。哥哥嫂子想独占爹娘留下来的家产，把他看成眼中钉。一天，哥哥把牛郎叫到跟前，装得很亲热的样子说：“你如今长大了，也该成家立业了。老人家留下一点儿家产，咱们分了吧。一头牛，一辆车，都归你；别的归我。”","anchor":"","meaning":"被赶出家后，他靠劳动安家。","why":"抓“打柴、盖房、种庄稼”，看他怎样过日子。","label":"第 5 段"},{"text":"嫂子在旁边，三分像笑七分像发狠，说：“我们挑顶有用的东西给你，你知道吗？你要知道好歹，赶紧离开这儿。天还早，能走就走吧。”","anchor":"","meaning":"被赶出家后，他靠劳动安家。","why":"抓“打柴、盖房、种庄稼”，看他怎样过日子。","label":"第 6 段"},{"text":"牛郎听哥哥嫂子这么说，想了想，说：“好，我这就走！”他想哥哥嫂子既然这样对待他，他又何必恋恋不舍呢？那辆车不稀罕，幸亏那头老牛归了他，亲密的伙伴还在一块儿，离不离开家有什么关系？","anchor":"","meaning":"被赶出家后，他靠劳动安家。","why":"抓“打柴、盖房、种庄稼”，看他怎样过日子。","label":"第 7 段"},{"text":"他就牵着老牛，拉着破车，头也不回，一直往前走，走出村子，走过树林，走到山里。从那以后，他白天上山打柴，柴装满一车，就让老牛拉着，到集市上去换粮食；夜晚就让老牛在车旁边休息，自己睡在车上。过了些日子，他在山前边盖了一间草房，又在草房旁边开辟了一块地，种些庄稼，这就算安了家。","anchor":"头也不回","meaning":"被赶出家后，他靠劳动安家。","why":"抓“打柴、盖房、种庄稼”，看他怎样过日子。","label":"第 8 段"},{"text":"一天晚上，他走进草房，忽然听见一声“牛郎”，他从没听见过这个声音。是谁叫他呢？回头一看，微弱的星光下，老牛嘴一张一合的，正在说话。","anchor":"","meaning":"老牛开口，告诉他怎样遇见织女。","why":"会说话是民间故事的想象。复述别漏老牛的帮助。","label":"第 9 段"},{"text":"老牛真会说话了！","anchor":"老牛真会说话了","meaning":"老牛开口，告诉他怎样遇见织女。","why":"会说话是民间故事的想象。复述别漏老牛的帮助。","label":"第 10 段"},{"text":"牛郎并不觉得奇怪，像是听惯了它说话似的，就转过身子去听。","anchor":"","meaning":"老牛开口，告诉他怎样遇见织女。","why":"会说话是民间故事的想象。复述别漏老牛的帮助。","label":"第 11 段"},{"text":"老牛说：“明天黄昏时候，你翻过右边那座山，山那边是一片树林，树林前边是一个湖，那时候会有些仙女在湖里戏水。她们的纱衣放在草地上，你要捡起那件粉红色的纱衣，跑到树林里等着，跟你要纱衣的那个仙女就是你的妻子。这个好机会你可别错过了。”","anchor":"","meaning":"老牛开口，告诉他怎样遇见织女。","why":"会说话是民间故事的想象。复述别漏老牛的帮助。","label":"第 12 段"},{"text":"“知道了。”牛郎高兴地回答。","anchor":"","meaning":"老牛开口，告诉他怎样遇见织女。","why":"会说话是民间故事的想象。复述别漏老牛的帮助。","label":"第 13 段"},{"text":"第二天黄昏时候，牛郎翻过右边的那座山，穿过树林，走到湖边。湖面映着晚霞的余光，蓝紫色的波纹晃晃荡荡。他听见有女子的笑声，顺着声音看，果然有好些个女子在湖里戏水。他沿着湖边走，没几步，就看见草地上放着好些纱衣，花花绿绿的，件件都那么漂亮。里头果然有一件粉红色的纱衣，他就拿起来，转身走进树林。","anchor":"","meaning":"牛郎和织女在湖边相识。","why":"这是旧故事的情节；生活中拿别人的东西要先问同意。","label":"第 14 段"},{"text":"他静静地等着。过了一会儿，就听见女子们上岸的声音。只听见一个说：“不早了，咱们赶紧回去吧！咱们偷偷地到人间来，要是老人家知道了，不知道要怎么罚咱们呢！”过了一会儿，又听见一个说：“怎么，你们都走啦？难得来一趟，多自在啊，也不多玩一会儿。——哎呀！我的纱衣哪儿去了？谁瞧见了？”","anchor":"","meaning":"牛郎和织女在湖边相识。","why":"这是旧故事的情节；生活中拿别人的东西要先问同意。","label":"第 15 段"},{"text":"牛郎听到这儿，从树林里走出来，双手托着纱衣，说：“姑娘，别着急，你的纱衣在这儿。”","anchor":"双手托着纱衣","meaning":"牛郎和织女在湖边相识。","why":"这是旧故事的情节；生活中拿别人的东西要先问同意。","label":"第 16 段"},{"text":"姑娘穿上纱衣。一边梳她长长的黑头发，一边跟牛郎谈话。牛郎把自己的情形一五一十地说了。姑娘听得出了神，又同情他，又爱惜他，就把自己的情形也告诉了他。","anchor":"","meaning":"牛郎和织女在湖边相识。","why":"这是旧故事的情节；生活中拿别人的东西要先问同意。","label":"第 17 段"},{"text":"原来姑娘是天上王母娘娘的外孙女，织得一手好彩锦，名字叫织女。每天早晨和傍晚，王母娘娘拿她织的彩锦装饰天空，那就是灿烂的云霞，什么东西也没它美丽。王母娘娘需要的彩锦多，就叫织女成天成夜地织，一会儿也不许休息。织女身子老在机房里，手老在梭子上，劳累不用说，自由也没有了，等于关在监狱里，实在难受。她常常想，人人说天上好，天上好，天上有什么好呢？没有自由，又看不见什么。她总想离开天上，到人间去，哪怕是一天半天呢，也可以见识见识人间的景物。她把这个想法跟别的仙女说了，别的仙女也都说早有这种想法。那天下午，王母娘娘喝千年酿的葡萄酒，多喝了点儿，靠在宝座上直打瞌睡，看样子不见得马上就醒。仙女们见机会难得，就你拉我、我拉你地溜出来。一齐飞到人间。她们飞到湖边，看见湖水清得可爱，就跳下去戏水。织女关在机房里太久了，现在能够在湖水里无拘无束地玩，心里真痛快，想多玩一会儿，没想到就落在了后边。","anchor":"自由","meaning":"织女不喜欢没有自由的生活。","why":"想象对话时，要符合她想过自由生活的愿望。","label":"第 18 段"},{"text":"牛郎听完织女的话，就说：“姑娘，既然天上没什么好，你就不用回去了。你能干活，我也能干活，咱们两个结了婚，一块儿在人间过一辈子吧。”","anchor":"","meaning":"织女不喜欢没有自由的生活。","why":"想象对话时，要符合她想过自由生活的愿望。","label":"第 19 段"},{"text":"织女想了想，说：“你说得很对，咱们结婚，一块儿过日子吧。”","anchor":"","meaning":"织女不喜欢没有自由的生活。","why":"想象对话时，要符合她想过自由生活的愿望。","label":"第 20 段"},{"text":"他们俩手拉着手，穿过树林，翻过山头，回到草房。牛郎把老牛指给织女看，说它就是从小到大相依为命的伴儿。织女拍拍老牛的脖子，用腮帮挨挨它的耳朵，算是跟它行见面礼。老牛眉开眼笑地朝她看，仿佛说：“正是这个新娘子。”","anchor":"手拉着手","meaning":"两人一起回家，见到老牛。","why":"相识之后成家，事情接成了一条线。","label":"第 21 段"}],"poem":false,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P102–107；按该书课文录入，省去注音与教参批注。","media":{"src":"/assets/reader-art/cowherd.webp","alt":"牛郎坐在茅屋旁照料老牛。","caption":"先看看牛郎怎样对待老牛，再读他们之间发生的事。","credit":"AI 情境插画","kind":"story"}}},{"id":"cowherd-two","title":"牛郎织女（二）","date":null,"minutes":23,"bookPages":"P110–116","unit":3,"goal":"把两篇故事接成连环画，用伏笔、动作和反复理解人物愿望。","source":"金牌训练·同步教材 P110–116；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"先过字词关","body":"读一遍，圈出不熟的字。先看结构和意思，再回课文读通。","detail":["会写字：本课为略读课，无新增会写字表","会认字：俭 jiǎn、逗 dòu、偎 wēi、珊 shān、瑚 hú、礁 jiāo、筐 kuāng、拗 niù","词语：勤劳节俭、依偎、富丽堂皇、怒气冲冲、察访、拗不过","拗不过niù；拗口ào；拗断ǎo。背包bēi、背后bèi；冲着chòng、直冲云霄chōng。"],"id":"cowherd-two-01","source":"P110–116","kicker":"按书细读","reading":{"title":"牛郎织女（二）：相聚、分离与再次争取","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：人间的幸福","text":"牛郎与织女共同劳动，养育孩子。织女喜欢这个家，也喜欢亲自安排自己的生活。但她仍担心天上的王母发现，这份担忧为后面的变化作了准备。"},{"label":"二：老牛留下嘱咐","text":"老牛临终前让牛郎把自己的皮保存下来，告诉他遇急事时可能用得上。故事先把神奇物件及用途交代在这里，后面出现飞行能力才不突兀。"},{"label":"三：王母前来阻挠","text":"王母发现织女留在人间，强行把她带走，也粗暴地对待孩子。她用自己的规矩评判织女。人物说的“败坏门风”是王母的立场，不等于作者赞同这一评价。"},{"label":"四：突然中断的生活","text":"牛郎回来，看到未做完的家务、留下的食物和哭泣的孩子，明白织女被带走了。平常生活的东西忽然停在中途，使家庭被拆散的痛苦更具体。"},{"label":"五：牛皮让追赶成为可能","text":"牛郎想起老牛的嘱咐，披上牛皮，带着孩子追上天去。王母划出天河，把他们隔开。这一段把“牛皮的伏笔”和“阻挠团聚的力量”都接到了结果上。"},{"label":"六：隔河仍在争取","text":"牛郎和织女隔河相望，织女没有放弃相会的愿望，坚持争取。最终，故事让他们得到每年七月初七相会的机会。"},{"label":"七：鹊桥寄托希望","text":"相会时，喜鹊搭桥。这是民间故事的神奇结尾，把分离的人重新连接起来，寄托团圆与幸福的愿望。星与天河在这里承担传说情节，不是天文学解释。"},{"label":"把两篇连成六幅画","text":"身世孤单→照料老牛→相遇成家→幸福生活→遭到拆散并追赶→七夕相会。配字要说明该幅发生什么；画面突出一两个动作，不必把整段课文塞入图里。"}]},"tutorial":[{"title":"这是略读课，先认词","text":"这课没有新增会写字任务。先认准节俭 jiǎn、依偎 wēi、拗不过 niù，再放回句子。"},{"title":"词义用在情境里","text":"节俭是节省、不浪费；依偎是亲密地靠着；拗不过是坚持不过对方。"},{"title":"本课重点另有所在","text":"读清牛皮的前后作用，把两篇接成连贯故事；不要把整段时间都用来抄生字。"}]},{"type":"recall","phase":"recall","title":"把认词放回句子","prompt":"先读“勤劳节俭、孩子依偎着母亲、王母拗不过织女”。任选一个，不看提示说出意思；不会的可以打开材料再学，暂不要求默写。","reference":"勤劳节俭：劳动勤快又节省；依偎：亲密地靠着；拗不过：坚持争执中不能使对方改变。这是认词理解，不记作本课会写字考核。","checklist":["我实际读过所选词","能把意思放回句子","不把认词记成默写"],"id":"cowherd-two-02","source":"P110–116","kicker":"遮住讲回"},{"type":"model","phase":"guided","title":"故事里的希望，怎样被打断","body":"看前因怎样带出后果，再抽走一条伏笔，比较叙事会缺什么。","model":"story","config":{"scenes":[{"label":"幸福与担心","cause":"二人劳动，儿女相伴","event":"织女仍担心王母找来","result":"幸福中埋下追捕的伏笔","evidence":"反复说喜欢，写珍惜眼前生活"},{"label":"留下牛皮","cause":"老牛即将死去","event":"嘱咐留下牛皮，以后有用","result":"后面追赶织女时能飞起来","evidence":"提前交代，不是需要时突然变出"},{"label":"隔河相望","cause":"王母强行抓走织女","event":"牛郎追来，被天河阻隔","result":"双方分离，仍不放弃","evidence":"抓、推等动作与追赶相对照"},{"label":"七夕相会","cause":"织女持续争取","event":"得到一年一次见面的机会","result":"鹊桥相会寄托团圆愿望","evidence":"是民间想象，不是星体形成的科学解释"}]},"id":"cowherd-two-03","source":"P110–116","kicker":"跟着推演"},{"type":"recall","phase":"recall","title":"不看图，讲回因果","prompt":"老牛留下牛皮的情节为什么不能随便删掉？","reference":"它提前解释牛郎后来怎样追上天去；删掉后能力突然出现，前后缺少联系。","checklist":["先收起提示，再试着讲","讲出了本题要求的关键关系","需要重新看的地方如实保留"],"id":"cowherd-two-04","source":"P110–116","kicker":"遮住讲回"},{"type":"teach","phase":"teach","title":"第1–2段：幸福，也有伏笔","body":"“她喜欢”的反复突出珍惜；担心和嘱咐则提醒后面可能有变化。","detail":["勤劳节俭的生活与天庭束缚相对。老牛临终的断续话语，可联系省略号体会说话艰难；不要把所有省略号都解释成同一种作用。"],"id":"cowherd-two-05","source":"P110–116","kicker":"按书细读","tutorial":[{"title":"先让幸福变具体","text":"连续用“她喜欢”领起几个并列句，形成排比，把对家庭、劳动和自由生活的喜爱写得更充分。"},{"title":"平静里留下担忧","text":"她怕王母察访，读者就会想到：这样的生活会不会被打断？"},{"title":"老牛的嘱咐再作准备","text":"留下牛皮不是多余细节，后面的追赶需要它解释能力从哪里来。"}],"reading":{"title":"牛郎织女（二）：相聚、分离与再次争取","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：人间的幸福","text":"牛郎与织女共同劳动，养育孩子。织女喜欢这个家，也喜欢亲自安排自己的生活。但她仍担心天上的王母发现，这份担忧为后面的变化作了准备。"},{"label":"二：老牛留下嘱咐","text":"老牛临终前让牛郎把自己的皮保存下来，告诉他遇急事时可能用得上。故事先把神奇物件及用途交代在这里，后面出现飞行能力才不突兀。"}]}},{"type":"teach","phase":"teach","title":"第3–5段：用动作看冲突","body":"王母怎样带走人？牛郎怎样追赶？动作把双方态度写出来。","detail":["王母抓走织女、推开孩子；牛郎看到未织完的布、热饭和哭泣的孩子，发现幸福被打断。细节让突然离散可感，不只是说“他们很伤心”。"],"id":"cowherd-two-06","source":"P110–116","kicker":"按书细读","tutorial":[{"title":"抓双方的动作","text":"一方强行带走，一方急忙追赶；同一件事，两个人的态度从行动里出现。"},{"title":"留意没完成的小事","text":"家务与食物停在中途，说明美好生活被突然打断，悲痛就不只是一个词。"},{"title":"答人物题怎样落笔","text":"写某人的一次行动，再解释它表明维护自由还是阻挠团聚。不要只列“好人、坏人”。"}],"reading":{"title":"牛郎织女（二）：相聚、分离与再次争取","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"三：王母前来阻挠","text":"王母发现织女留在人间，强行把她带走，也粗暴地对待孩子。她用自己的规矩评判织女。人物说的“败坏门风”是王母的立场，不等于作者赞同这一评价。"},{"label":"四：突然中断的生活","text":"牛郎回来，看到未做完的家务、留下的食物和哭泣的孩子，明白织女被带走了。平常生活的东西忽然停在中途，使家庭被拆散的痛苦更具体。"},{"label":"五：牛皮让追赶成为可能","text":"牛郎想起老牛的嘱咐，披上牛皮，带着孩子追上天去。王母划出天河，把他们隔开。这一段把“牛皮的伏笔”和“阻挠团聚的力量”都接到了结果上。"}]}},{"type":"choice","phase":"independent","title":"“败坏门风”是谁的看法？","body":"王母认为织女的选择“败坏门风”。怎样读这句话？","options":[{"id":"0","text":"这是王母的态度，不等于叙述者赞同"},{"id":"1","text":"这是织女真的做坏事的客观结论"},{"id":"2","text":"所有人物都这样认为"}],"answer":"0","explanation":"人物的话体现人物立场，不能自动当作全文认可的道理。","repair":{"gap":"先看题目要你比较什么。","reason":"人物的话体现人物立场，不能自动当作全文认可的道理。","check":"回到原题，用这个依据再判断。"},"id":"cowherd-two-07","source":"P110–116","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"第6–8段：结局里的愿望","body":"隔河相望仍然争取团聚。神奇结尾装着人们对自由、幸福的向往。","detail":["变成星星、喜鹊搭桥都是传说。结尾让一年一次团聚成为希望；理解故事的情感，不把它当作天文成因。"],"id":"cowherd-two-08","source":"P110–116","kicker":"按书细读","tutorial":[{"title":"先问结尾解决了什么","text":"人被天河隔开，团聚成为愿望；鹊桥给这一愿望一个出口。"},{"title":"神奇情节背后有人心","text":"喜鹊搭桥很奇特，更重要的是它帮助相爱的人相见。"},{"title":"答主题要从故事推出来","text":"先说明分离和相会的情节，再说人们向往自由与团圆；不是背一句口号就结束。"}],"reading":{"title":"牛郎织女（二）：相聚、分离与再次争取","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"六：隔河仍在争取","text":"牛郎和织女隔河相望，织女没有放弃相会的愿望，坚持争取。最终，故事让他们得到每年七月初七相会的机会。"},{"label":"七：鹊桥寄托希望","text":"相会时，喜鹊搭桥。这是民间故事的神奇结尾，把分离的人重新连接起来，寄托团圆与幸福的愿望。星与天河在这里承担传说情节，不是天文学解释。"}]}},{"type":"order","phase":"independent","title":"两篇连成六幅画","body":"按事情发生或方法使用的顺序，依次点选。","items":[{"id":"0","text":"受冷落，与老牛相伴"},{"id":"1","text":"离家劳动，老牛指点"},{"id":"2","text":"相遇织女并成家"},{"id":"3","text":"幸福生活，老牛留下牛皮"},{"id":"4","text":"织女被抓，牛郎追赶受阻"},{"id":"5","text":"隔河相望，七夕鹊桥相会"}],"answer":["0","1","2","3","4","5"],"explanation":"连环画应保留起因、发展、关键转折和结局，两篇不能各自断开。","repair":{"gap":"找出前一步给后一步带来的条件。","reason":"连环画应保留起因、发展、关键转折和结局，两篇不能各自断开。","check":"先放起点，再连起因果。"},"id":"cowherd-two-09","source":"P110–116","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"给连环画配字","prompt":"从六幅里挑最重要的转折，写一条简短配文，再说画面应突出哪个动作。","reference":"配字讲清事件，不堆满对话；画面让人看见动作与结果。先在纸上画，再留下配文即可。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"cowherd-two-10","source":"P110–116","kicker":"课后题与常见考法","tutorial":[{"title":"一幅图只抓一件事","text":"例如“披牛皮追赶”，画面最该出现牛皮、牛郎与孩子、追赶方向。"},{"title":"配字不等于画面清单","text":"配字讲清因为何事、做了什么；不必把每件衣物颜色写进来。"},{"title":"看看前后能否接上","text":"前幅留下牛皮，后幅披皮追赶。只画后幅而没交代前因，读者会问他怎么会飞。"}],"responseSupport":[{"label":"给画面配因果","text":"得知……后，……便……。","why":"把原因和行动连起来；人物与事件由你填。"}],"reading":{"title":"牛郎织女（二）：相聚、分离与再次争取","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"二：老牛留下嘱咐","text":"老牛临终前让牛郎把自己的皮保存下来，告诉他遇急事时可能用得上。故事先把神奇物件及用途交代在这里，后面出现飞行能力才不突兀。"},{"label":"五：牛皮让追赶成为可能","text":"牛郎想起老牛的嘱咐，披上牛皮，带着孩子追上天去。王母划出天河，把他们隔开。这一段把“牛皮的伏笔”和“阻挠团聚的力量”都接到了结果上。"},{"label":"把两篇连成六幅画","text":"身世孤单→照料老牛→相遇成家→幸福生活→遭到拆散并追赶→七夕相会。配字要说明该幅发生什么；画面突出一两个动作，不必把整段课文塞入图里。"}]}},{"type":"open","phase":"independent","title":"人物评价靠证据","prompt":"比较织女与王母，用各自言行说明她们面对自由生活的不同态度。","reference":"织女向往并争取幸福；王母强行阻挠。用相应行为支撑，不只写善良/狠心两个标签。","checklist":["分别给出织女和王母的行为","解释行为表现的立场","没有把王母的话当成作者判断"],"id":"cowherd-two-11","source":"P110–116","kicker":"课后题与常见考法","reading":{"title":"牛郎织女（二）：相聚、分离与再次争取","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"三：王母前来阻挠","text":"王母发现织女留在人间，强行把她带走，也粗暴地对待孩子。她用自己的规矩评判织女。人物说的“败坏门风”是王母的立场，不等于作者赞同这一评价。"},{"label":"六：隔河仍在争取","text":"牛郎和织女隔河相望，织女没有放弃相会的愿望，坚持争取。最终，故事让他们得到每年七月初七相会的机会。"}]}},{"type":"open","phase":"transfer","title":"同一个结局，换一种开头","prompt":"试从“七夕相会”开头讲，再补回事情为什么走到这里。","reference":"可以先展示结果吸引人，但回叙仍需交代相遇、成家、被拆散和争取相会的因果。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"cowherd-two-12","source":"P110–116","kicker":"换个情境"},{"id":"cowherd-two-end","type":"teach","phase":"transfer","title":"这一段先收住，下次从这里接","body":"先说一件今天能自己解释的事。还不会的留下来；暂停不清空，下一次从未完成处继续。","source":"P110–116","tutorial":[{"title":"带走一句自己的话","text":"不用追求现在把整课都做完。先说你今天学会使用的一种方法。"},{"title":"留下真正的接续点","text":"还有未完成的题或需要提示的地方，继续保留，不把“看过”记成“独立会”。"}]}],"reading":{"title":"牛郎织女（二）：相聚、分离与再次争取","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"一：人间的幸福","text":"牛郎与织女共同劳动，养育孩子。织女喜欢这个家，也喜欢亲自安排自己的生活。但她仍担心天上的王母发现，这份担忧为后面的变化作了准备。"},{"label":"二：老牛留下嘱咐","text":"老牛临终前让牛郎把自己的皮保存下来，告诉他遇急事时可能用得上。故事先把神奇物件及用途交代在这里，后面出现飞行能力才不突兀。"},{"label":"三：王母前来阻挠","text":"王母发现织女留在人间，强行把她带走，也粗暴地对待孩子。她用自己的规矩评判织女。人物说的“败坏门风”是王母的立场，不等于作者赞同这一评价。"},{"label":"四：突然中断的生活","text":"牛郎回来，看到未做完的家务、留下的食物和哭泣的孩子，明白织女被带走了。平常生活的东西忽然停在中途，使家庭被拆散的痛苦更具体。"},{"label":"五：牛皮让追赶成为可能","text":"牛郎想起老牛的嘱咐，披上牛皮，带着孩子追上天去。王母划出天河，把他们隔开。这一段把“牛皮的伏笔”和“阻挠团聚的力量”都接到了结果上。"},{"label":"六：隔河仍在争取","text":"牛郎和织女隔河相望，织女没有放弃相会的愿望，坚持争取。最终，故事让他们得到每年七月初七相会的机会。"},{"label":"七：鹊桥寄托希望","text":"相会时，喜鹊搭桥。这是民间故事的神奇结尾，把分离的人重新连接起来，寄托团圆与幸福的愿望。星与天河在这里承担传说情节，不是天文学解释。"},{"label":"把两篇连成六幅画","text":"身世孤单→照料老牛→相遇成家→幸福生活→遭到拆散并追赶→七夕相会。配字要说明该幅发生什么；画面突出一两个动作，不必把整段课文塞入图里。"}]},"examTargets":["伏笔与后文照应","从语言动作辨别人物立场","连贯复述两篇并设计连环画","由神奇结尾理解团圆愿望"],"segments":[{"id":"cowherd2-cause","title":"牛皮为什么要提前出现","startStepId":"cowherd-two-01","endStepId":"cowherd-two-08","minutes":13,"scene":"hotel","goal":"读通幸福、拆散、追赶、相会和前后照应。","check":"能解释牛皮的伏笔如何支持后面追赶。"},{"id":"cowherd2-picture","title":"两篇接成六幅画","startStepId":"cowherd-two-09","endStepId":"cowherd-two-end","minutes":10,"scene":"train","goal":"把连续故事用事件和短配文表达，再说人物立场。","check":"六幅事件顺序连贯，配文有明确行动和原因。"}],"sourceNotes":["本次教学重做：随身阅读为依据原书的原创转述；分步示范与局部表达帮助必须记提示，不代表孩子已独立完成。"],"reader":{"author":"叶圣陶整理","pages":"P112–115","core":"给主要情节配上小标题，就能讲清后半个故事。","hook":"一道天河，把一家人隔开了。","notes":[{"anchor":"她喜欢","meaning":"人间的劳动和陪伴，让织女快乐。","why":"反复说“她喜欢”，让你感到她有多珍惜。"},{"anchor":"把我的皮留着","meaning":"老牛留下临终叮嘱。","why":"后面牛郎能飞起来，前面先交代了原因。"},{"anchor":"要把织女捉回来","meaning":"王母娘娘知道后十分生气。","why":"她要维护自己的尊严，不顾织女的愿望。"},{"anchor":"一把抓住","meaning":"王母娘娘强行带走织女。","why":"抓和推这些动作，让她的蛮横看得见。"},{"anchor":"他忽然想起老牛临死前说的话","meaning":"牛郎披牛皮追赶，却被天河隔开。","why":"前面的叮嘱，在这里用上了。"},{"anchor":"远远地望着","meaning":"一家人被隔在河的两边。","why":"这一幕，可以给连环画配“隔河相望”。"},{"anchor":"不肯死心","meaning":"织女坚持，争取每年相见。","why":"她没有轻易放弃一起生活的愿望。"},{"anchor":"搭起一座桥","meaning":"喜鹊搭桥，让他们一年一会。","why":"人们用神奇的想象，寄托团圆的愿望。"}],"tests":[{"q":"用四个小标题，讲清这篇故事。","ref":"如幸福生活、织女被抓、天河相隔、鹊桥相会。能接清主要情节即可。","back":0,"modelAnswer":"一、男耕女织，生活美满。\n二、老牛去世，留下嘱托。\n三、王母拆散，天河相隔。\n四、真情感人，七夕相会。","answerKind":"小标题示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"牛郎为什么突然能飞？找前面与它连着的地方。","ref":"他按老牛临终的话披上牛皮。前面留下的叮嘱和后面的飞行互相照应。","back":1,"modelAnswer":"牛郎披上老牛留下的牛皮，挑着两个孩子，便能飞上天空。前文写老牛临死前嘱咐他留下牛皮，紧急时可以披上。这一伏笔解释了后面他为什么能飞，并不是突然出现一个没有来由的本领。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"给最后一幅连环画写一句话，让没读过的人也看懂。","ref":"如：每年七月初七，喜鹊搭起桥，让隔着天河的牛郎织女相会。要点有人物、事情和结果。","back":7,"modelAnswer":"每年农历七月初七，喜鹊搭起桥，让被天河分隔的牛郎和织女相会。","answerKind":"连环画配文示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"kind":"article","paragraphs":[{"text":"从此牛郎在地里耕种，织女在家里纺织。有时候，织女也帮助牛郎干些地里的活。两个人勤劳节俭，日子过得挺美满。转眼间两三个年头过去了，他们生了一个男孩和一个女孩。到孩子能说话的时候，晚上得空，织女就指着星星，给孩子们讲些天上的故事。天上虽然富丽堂皇，可是没有自由，她不喜欢。她喜欢人间的生活：跟牛郎一块儿干活，她喜欢；逗着兄妹俩玩，她喜欢；看门前小溪的水活泼地流过去，她喜欢；听晓风晚风轻轻地吹过树林，她喜欢。两个孩子听她这么说，就偎在她怀里，叫一声“娘”，回过头来又叫一声“爹”。她乐极了，可是有时候也发愁。愁什么呢？她没告诉牛郎。她是怕外祖母知道她在这儿会来找她。","anchor":"她喜欢","meaning":"人间的劳动和陪伴，让织女快乐。","why":"反复说“她喜欢”，让你感到她有多珍惜。","label":"第 1 段"},{"text":"一天，牛郎去喂牛，那头衰老的牛又说话了，眼眶里满是眼泪：“我快不行了，不能帮你们下地干活了……我死以后，你把我的皮留着。碰见什么紧急事，你就披上我的皮……”老牛没说完就死了。夫妻两个痛哭了一场，留下老牛的皮，把老牛的尸骨埋在草房后边的山坡上。","anchor":"把我的皮留着","meaning":"老牛留下临终叮嘱。","why":"后面牛郎能飞起来，前面先交代了原因。","label":"第 2 段"},{"text":"再说天上，仙女们溜到人间的事到底让王母娘娘知道了。王母娘娘罚她们，把她们关在黑屋子里。她尤其恨织女，竟敢留在人间不回来，简直是有意败坏她的门风，损害她的尊严。她发誓要把织女捉回来，哪怕织女藏在泰山底下的石缝里，大海中心的珊瑚礁上，也一定要抓回来，给她顶厉害的惩罚。","anchor":"要把织女捉回来","meaning":"王母娘娘知道后十分生气。","why":"她要维护自己的尊严，不顾织女的愿望。","label":"第 3 段"},{"text":"王母娘娘派了好些天兵天将到人间察访，察访了好久，才知道织女在牛郎家里，跟牛郎做了夫妻。一天，她亲自到牛郎家里，可巧牛郎在地里干活，她就一把抓住织女往外走。织女的男孩见那老太婆怒气冲冲地拉着织女走，就跑过来拉住织女的衣裳。王母娘娘狠狠一推，孩子倒在地上，她就带着织女一齐飞起来。织女心里恨极了，望着两个可爱的孩子，一时不知该怎么办，只喊了一句：“快去找你爹！”","anchor":"一把抓住","meaning":"王母娘娘强行带走织女。","why":"抓和推这些动作，让她的蛮横看得见。","label":"第 4 段"},{"text":"牛郎跟着男孩赶回家，只见梭子放在织了半截的布匹上，灶上的饭正冒着热气，女孩坐在门前哭。他决定上天去追，把织女救回来。可是怎么能上天呢？他忽然想起老牛临死前说的话，这不正是紧急事吗？他赶紧披上牛皮，找出两个筐，一个筐里放一个孩子，挑起来就往外跑。一出屋门，他就飞起来了，耳边的风呼呼直响。飞了一会儿，望见妻子和老太婆了，他就喊“我来了”，两个孩子也连声喊“娘”。越飞越近，眼看要赶上了，王母娘娘拔下头上的玉簪往背后一划，糟了，牛郎的前边忽然出现一条天河。天河很宽，波浪很大，牛郎飞不过去了。","anchor":"他忽然想起老牛临死前说的话","meaning":"牛郎披牛皮追赶，却被天河隔开。","why":"前面的叮嘱，在这里用上了。","label":"第 5 段"},{"text":"从此以后，牛郎在天河的这边，织女在天河的那边，只能远远地望着，不能生活在一块儿了。他们就成了天河两边的牵牛星和织女星。","anchor":"远远地望着","meaning":"一家人被隔在河的两边。","why":"这一幕，可以给连环画配“隔河相望”。","label":"第 6 段"},{"text":"织女受了很厉害的惩罚，可是不肯死心，一定要跟牛郎一块儿过日子。日久天长，王母娘娘也拗不过她，就允许她每年农历七月初七跟牛郎会一次面。","anchor":"不肯死心","meaning":"织女坚持，争取每年相见。","why":"她没有轻易放弃一起生活的愿望。","label":"第 7 段"},{"text":"每年的这一天，成群的喜鹊在天河上边搭起一座桥，让牛郎、织女在桥上会面。就因为这件事，每逢那一天，人们很少看见喜鹊，它们都往天河那儿搭桥去了。还有人说，那一天夜里，要是在葡萄架下边静静地听着，还可以听见牛郎、织女在桥上亲亲密密地说话呢。","anchor":"搭起一座桥","meaning":"喜鹊搭桥，让他们一年一会。","why":"人们用神奇的想象，寄托团圆的愿望。","label":"第 8 段"}],"poem":false,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P112–115；按该书课文录入，省去注音与教参批注。","media":{"src":"/assets/reader-art/cowherd.webp","alt":"牛郎和老牛在乡间的情境插画。","caption":"接着上篇想一想：老牛留下的叮嘱，后来有什么用？","credit":"AI 情境插画","kind":"story"}}},{"id":"folk-speaking","title":"口语交际：讲民间故事","date":null,"minutes":15,"bookPages":"P117","unit":3,"goal":"把听众带进故事；重要转折讲清楚，语气动作服务人物。","source":"金牌训练·同步教材 P117；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"听众没读过，也能听懂","body":"选自己熟悉的民间故事。先抓主线，再挑一个精彩处展开。","detail":["可以换角色、调整开头或补合理细节；要能分清原故事和自己的补充。合适的语气、表情和动作可以增强讲述效果，不能盖住情节。"],"id":"folk-speaking-01","source":"P117","kicker":"按书细读","reading":{"title":"没有纸书，也有一个能开讲的故事","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"可以直接选本课程读过的故事","text":"你已经可以从海力布或牛郎织女中选一个，不需要再找书。若选海力布，主线是：平时助人→救蛇得宝→听见灾情→劝搬不成→说出秘密变石→乡亲脱险。"},{"label":"听众最需要的桥","text":"第一次听的人不知道宝石有什么限制。你必须在变石头前交代禁忌；同样，讲牛郎飞上天前要交代牛皮。讲快、声音响都不能替代缺失的原因。"},{"label":"局部示范：先交代，再停一下","text":"原创讲法示范：“大家仍然不肯离开。海力布明白，必须把原因讲清了。”在决定前稍停，语速放慢；接着讲清他选择说出秘密，不需要每句话都大喊。"},{"label":"讲述之后怎样自己检查","text":"暂时没有听众，可以自己轻声完整讲一遍，再问：一个没读过的人知道人物是谁吗？知道为什么改变吗？知道结果吗？把自己漏掉的一处记下来，修那一处后重讲即可。"}]},"tutorial":[{"title":"先选你现在能讲的故事","text":"海力布和牛郎织女的随身阅读就在本课程里。选一个已经读通的，不要临时找陌生故事。"},{"title":"四到六件事先排稳","text":"重要的是事件能接上，不是事件数量越多越好。把转折原因留住。"},{"title":"只选一个精彩处展开","text":"海力布决定说出秘密、牛郎想起牛皮，都可作为重点；开头与普通路程可以短讲。"}]},{"type":"open","phase":"guided","title":"先定故事与路线","prompt":"从海力布或牛郎织女中选一个，写故事名，再用关键词排出4—6个主要事件。暂不需要完整成段。","reference":"可用随身阅读核对。海力布主线含救蛇、得宝与禁忌、听到灾情、劝说与解释、变石、乡亲脱险；用自己的词缩成4—6步。","checklist":["选了实际读过的故事","前后有因果连接","结局前的必要条件没有漏"],"id":"folk-speaking-02","source":"P117","kicker":"跟着推演"},{"type":"choice","phase":"independent","title":"听众听不明白怎么办？","body":"你讲到人物突然飞起来。听众问“他怎么会飞？”","options":[{"id":"0","text":"只把声音放大"},{"id":"1","text":"补回前面留下神奇物件的情节"},{"id":"2","text":"说听众没有认真听"}],"answer":"1","explanation":"先补缺失的因果，声音大不能替代内容清楚。","repair":{"gap":"先看题目要你比较什么。","reason":"先补缺失的因果，声音大不能替代内容清楚。","check":"回到原题，用这个依据再判断。"},"id":"folk-speaking-03","source":"P117","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"精彩处慢一点","body":"转折前稍停，人物对话换合适语气，动作只选一两处。","detail":["不是每句话都夸张表演。紧张处、惊讶处和普通叙述应有区别；让身边的人听一段，指出哪里没听懂。"],"id":"folk-speaking-04","source":"P117","kicker":"按书细读","tutorial":[{"title":"先让意思清楚","text":"讲“海力布镇定下来”时，不先吼一句，要让听众明白他决定承担代价。"},{"title":"一处停顿怎样帮理解","text":"在“他终于决定……”后稍停，让听众等待关键转折，然后把决定讲完整。"},{"title":"动作只为补意思","text":"说指向飞走的鸟，可以稍作指向动作；没用的动作会分散听众，不必全程表演。"}]},{"type":"recall","phase":"recall","title":"不看提纲讲一次","prompt":"收起提纲，完整讲一次。身边有人可请他听；没有听众就自己轻声讲。讲完记一处漏掉的原因或不顺的地方。","reference":"真实讲述后记录，不把点下一步算口头完成。没有听众可先自述，再标待家长听。","checklist":["我确实讲过一遍","我记下一个真实漏处或听众问题","没有把点击下一步当作已讲"],"id":"folk-speaking-05","source":"P117","kicker":"遮住讲回"},{"type":"open","phase":"independent","title":"按问题重讲关键一段","prompt":"根据刚才的问题改讲一段，留下你补上的内容。","reference":"要补的是听众理解所需要的因果或细节，不必整篇重来。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"folk-speaking-06","source":"P117","kicker":"课后题与常见考法","tutorial":[{"title":"只修第一个没听懂的地方","text":"如果听众问“为什么会变石头”，就补禁忌，不必从故事第一句重来。"},{"title":"把桥补回原位置","text":"放在得宝之后、说出秘密之前，后面的变石才好懂。"},{"title":"重讲这一小段","text":"保留自己的讲法，把新补的因果放进去；其他已经讲顺的部分不用推翻。"}]},{"type":"open","phase":"transfer","title":"把讲故事的方法带出去","prompt":"旅行后给没同行的人讲一件有转折的事，你准备保留哪三件关键信息？","reference":"谁在什么情况下遇到什么变化，怎样应对，结果如何；真实经历不冒充民间传说。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"folk-speaking-07","source":"P117","kicker":"换个情境"},{"id":"folk-speaking-end","type":"teach","phase":"transfer","title":"这一段先收住，下次从这里接","body":"先说一件今天能自己解释的事。还不会的留下来；暂停不清空，下一次从未完成处继续。","source":"P117","tutorial":[{"title":"带走一句自己的话","text":"不用追求现在把整课都做完。先说你今天学会使用的一种方法。"},{"title":"留下真正的接续点","text":"还有未完成的题或需要提示的地方，继续保留，不把“看过”记成“独立会”。"}]}],"reading":{"title":"没有纸书，也有一个能开讲的故事","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"可以直接选本课程读过的故事","text":"你已经可以从海力布或牛郎织女中选一个，不需要再找书。若选海力布，主线是：平时助人→救蛇得宝→听见灾情→劝搬不成→说出秘密变石→乡亲脱险。"},{"label":"听众最需要的桥","text":"第一次听的人不知道宝石有什么限制。你必须在变石头前交代禁忌；同样，讲牛郎飞上天前要交代牛皮。讲快、声音响都不能替代缺失的原因。"},{"label":"局部示范：先交代，再停一下","text":"原创讲法示范：“大家仍然不肯离开。海力布明白，必须把原因讲清了。”在决定前稍停，语速放慢；接着讲清他选择说出秘密，不需要每句话都大喊。"},{"label":"讲述之后怎样自己检查","text":"暂时没有听众，可以自己轻声完整讲一遍，再问：一个没读过的人知道人物是谁吗？知道为什么改变吗？知道结果吗？把自己漏掉的一处记下来，修那一处后重讲即可。"}]},"examTargets":["讲清起因经过结果","适当丰富细节与使用语气动作","听众理解不了时补回因果","完整讲述与点击完成分开记录"],"segments":[{"id":"folk-tell","title":"从提纲到完整讲述","startStepId":"folk-speaking-01","endStepId":"folk-speaking-end","minutes":15,"scene":"hotel","goal":"选已读故事，完整讲一次，再补听众或自己发现的一个缺口。","check":"真实讲过并记录一个修订处；点完不等于已经讲过。"}],"sourceNotes":["本次教学重做：随身阅读为依据原书的原创转述；分步示范与局部表达帮助必须记提示，不代表孩子已独立完成。"],"reader":{"kind":"guide","core":"讲清主要事情，再添合适的语气和细节。","hook":"你来当讲故事的人。","author":"读写小练习","pages":"P117","textSource":"依据家长所供教辅的本课要求编写；以下是原创学习指引，不是课文原文。","paragraphs":[{"label":"选一个熟悉的故事","text":"先说谁遇到什么事，怎么做，最后怎样。可以选海力布或牛郎织女。","anchor":"","meaning":"选一个熟悉的故事","why":"先把事情接顺。"},{"label":"挑一处讲具体","text":"选择最紧张或最好玩的地方，想象人物会说什么、做什么。说明哪些是你补充的想象。","anchor":"","meaning":"挑一处讲具体","why":"添细节要符合原来的情节。"},{"label":"开口试一遍","text":"海力布着急时怎么说？乡亲不明白时怎么问？用不同语气演一演。","anchor":"","meaning":"开口试一遍","why":"声音变化，是为了让人听懂人物。"}],"tests":[{"q":"从海力布或牛郎织女中选一个，写故事名，再用关键词排出4—6个主要事件。暂不需要完整成段。","ref":"可用随身阅读核对。海力布主线含救蛇、得宝与禁忌、听到灾情、劝说与解释、变石、乡亲脱险；用自己的词缩成4—6步。","back":0,"modelAnswer":"故事名：《猎人海力布》。\n救小白蛇 → 得到宝石 → 听见灾难消息 → 劝乡亲搬家 → 说出秘密变成石头 → 乡亲获救。","answerKind":"提纲示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"收起提纲，完整讲一次。身边有人可请他听；没有听众就自己轻声讲。讲完记一处漏掉的原因或不顺的地方。","ref":"真实讲述后记录，不把点下一步算口头完成。没有听众可先自述，再标待家长听。","back":0,"modelAnswer":"海力布是个热心帮助乡亲的猎人。他救了小白蛇，得到一颗宝石，能听懂动物说话，但说出秘密就会变成石头。一天，他听见鸟儿说灾难将至，急忙劝乡亲搬家。大家不信，他为了救大家，只好说出秘密，自己变成石头。乡亲们及时离开，躲过了灾难，一直纪念他。\n讲后自查示例：我刚才漏讲了“说出秘密会变成石头”，下次要补上，不然听众就不明白他付出了什么代价。","answerKind":"完整讲述与自查示例","answerNote":"示例展示怎样讲完整。你实际漏了哪一处，要按自己的讲述记录；没有漏也可以如实写。"},{"q":"旅行后给没同行的人讲一件有转折的事，你准备保留哪三件关键信息？","ref":"谁在什么情况下遇到什么变化，怎样应对，结果如何；真实经历不冒充民间传说。","back":0,"modelAnswer":"我要保留三件关键信息：原来打算做什么，中途遇到什么意外，我们怎样应对、最后怎样。比如讲一次临时改变路线的经历，要说清原计划、改路的原因和改路后的结果，听的人才明白事情的转折。","answerKind":"讲述计划示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"media":null}},{"id":"new-story","title":"习作：故事新编","date":null,"minutes":25,"bookPages":"P118–119","unit":3,"goal":"保留熟悉故事的人物，设计新结果，并让新情节把结果撑起来。","source":"金牌训练·同步教材 P118–119；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"先知道这次写什么","body":"保留熟悉故事的人物，设计新结果，并让新情节把结果撑起来。","detail":["本版原书习作是《故事新编》。从熟悉故事出发，可以重新设计结局。","例如《龟兔赛跑》可以想双方都赢、都没赢或另一种结局；先选结果，再想过程中必须发生什么。"],"id":"new-story-01","source":"P118–119","kicker":"按书细读","reading":{"title":"《故事新编》：新结局要有新原因","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"先认原故事，再想新变化","text":"新编可以换结局、增加转折，但保留大家认识的主要人物。先说原来发生什么、怎样结束，再明确自己想改哪一点。它与复述不同：复述应保留主要事实，新编可以有意识地改变。"},{"label":"共同起点：龟兔赛跑","text":"传统故事里，兔子因自满停下睡觉，乌龟持续前进，最后乌龟获胜。新编可以选择兔子赢、乌龟再赢、双方都赢或双方都没赢；只宣布新结果还不够，过程必须让人相信。"},{"label":"老师示范倒推，不替你写全文","text":"如果想让兔子赢，先问它这次改变什么：它是否认真跑完全程？如果想双方都赢，可以先改变比赛规则，让获胜目标从单纯争速度变成共同完成任务。新规则要在前面交代，不能到结尾突然宣布。"},{"label":"转折怎样变成一个片段","text":"原创局部示范：“兔子刚想抄近路，发现路牌上的箭头已经被风吹反了。”这个变化会造成判断困难；接下来人物怎样观察、选择和行动，由你设计。不要只加一个怪物名字，却与结局没有关系。"},{"label":"组织整篇的路线","text":"先让读者认出原人物和这次的新条件；接着写关键困难与选择；最后让结果从选择中发生。语言、动作、神态可让人物鲜明，但不能代替前因后果。"},{"label":"检查新编是否站得住","text":"把你增加的一件事删掉，看结局是否还一样。若完全没影响，它可能只是装饰；若结局靠一个没有提前交代的神奇物件才成立，就需要补条件。"}]},"tutorial":[{"title":"题目允许怎样改","text":"主要人物让人认得，结局和过程可以重新设计。新编是有意创造，不是复述记错。"},{"title":"先选你想要的结局","text":"《龟兔赛跑》可换谁赢，或让双方都赢、都没赢。选一个你有兴趣解释的结果。"},{"title":"真正要学的一步","text":"从结果倒问：前面必须发生什么？没有新原因，结尾换几个字还不算编好了。"}]},{"type":"choice","phase":"guided","title":"新结局需要哪一种过程？","body":"你想写“兔子这次赢了”。哪一种过程真正支持这个新结局？","options":[{"id":"0","text":"只把结尾“乌龟赢”改成“兔子赢”，前面仍写兔子睡到比赛结束。"},{"id":"1","text":"兔子改变轻敌的做法，遇到干扰也继续认真完成比赛。"}],"answer":"1","explanation":"新结局由新行动产生。若前面仍睡到比赛结束，结尾突然获胜就缺少原因。","repair":{"gap":"结尾与前面的行动接不上。","reason":"要让兔子获胜，过程必须提供能导致获胜的变化。","check":"找出真正改变行动的那一种。"},"id":"new-story-02","source":"P118–119","kicker":"跟着推演","reference":"选择第二种：改变过程中的态度和行动，让获胜有原因。"},{"type":"open","phase":"guided","title":"原来怎样，这次怎样","prompt":"写原故事名、原来的关键原因与结局，再写你准备怎样改结果。可以用3行关键词，不用先写正文。","reference":"示例只说明规划形式：原故事人物／原来因为什么出现何种结果／我希望改成什么结果。新编可以想象，不要求真实经历，但要标清哪些是你新加的。","checklist":["说明原故事及原结果","明确自己的新结果","分清原有与新加的内容"],"id":"new-story-03","source":"P118–119","kicker":"跟着推演"},{"type":"teach","phase":"teach","title":"从一个点写清楚","body":"新结果需要新原因。每加一个转折，就问：人物为什么会这样做？这会带来什么？","detail":["先交代事情的条件，再写最能说明变化的动作、语言或细节。次要经过可以简写，重要转折展开写。"],"id":"new-story-04","source":"P118–119","kicker":"按书细读","tutorial":[{"title":"从终点往前问一步","text":"如果想双方都赢，先想“赢”的条件是什么。相同规则下一定只能第一名赢吗？"},{"title":"把新条件放到前面","text":"若改成合作任务，开赛前就要交代规则。不能比赛结束才突然加一条有利规则。"},{"title":"再设一个真正难题","text":"有了合作规则，还要出现必须合作才能解决的困难，人物才有行动可写。"},{"title":"回到你的故事","text":"看你选的新结局，写出一个必要的新原因；人物的选择再把原因连到结果。"}]},{"type":"open","phase":"independent","title":"写一个关键片段","prompt":"为你的新结局写一个关键转折，加入对话或动作，让它合情合理。","reference":"人物和原故事有联系；新情节能解释新结果；改变是有意的新编，不是复述时记错。","checklist":["关键变化与新结局有关","人物作出了可理解的选择","至少一个动作或对话让过程具体"],"id":"new-story-05","source":"P118–119","kicker":"课后题与常见考法","responseSupport":[{"label":"让转折有来源","text":"正当……时，……发生了变化。","why":"变化必须会影响结局；不要为惊险无缘无故加事。"},{"label":"写出人物选择","text":"他先想……，看到……后，决定……。","why":"显示观察和选择，后面结果才有依据。"},{"label":"连接结果","text":"因为这一次……，最后……。","why":"检查你新加的行动有没有推动新结局。"}],"collectFrom":["new-story-03"]},{"type":"recall","phase":"recall","title":"遮住提示，说出路线","prompt":"不用看刚才的说明，讲一遍你准备先写什么、重点写什么、怎样收尾。","reference":"路线服务中心。读者需要知道起点、重要变化和结果；不要只报三个空标题。","checklist":["先收起提示，再试着讲","讲出了本题要求的关键关系","需要重新看的地方如实保留"],"id":"new-story-06","source":"P118–119","kicker":"遮住讲回"},{"type":"choice","phase":"independent","title":"哪种修改真正补上了原因？","body":"初稿写“乌龟和兔子一起获奖”，但前文只有争第一。现在最该怎么改？","options":[{"id":"0","text":"把奖杯写得更大更闪亮。"},{"id":"1","text":"补清这次比赛的规则，再写两人怎样完成获奖条件。"},{"id":"2","text":"加一句“大家都很感动”，不解释原因。"}],"answer":"1","explanation":"问题是共同获奖没有依据。补规则和相应行动，才把过程接到结果；形容奖杯不能补因果。","repair":{"gap":"共同获奖的条件没有交代。","reason":"读者需要先知道规则，再看到人物怎样达到。","check":"找能补回条件与行动的修改。"},"id":"new-story-07","source":"P118–119","kicker":"课后题与常见考法","reference":"补清规则与两人的行动，让共同获奖有来由。"},{"type":"open","phase":"independent","title":"连起来，写自己的初稿","prompt":"取回你前面的新结局和关键片段，把它们组织成一篇自己的故事。重点写关键选择；可在这里写，也可在纸上成文并记位置。","reference":"人物和原故事有联系；新情节能解释新结果；改变是有意的新编，不是复述时记错。","checklist":["主要人物与原故事有联系","新规则或条件提前交代","关键选择推动新结果","自己的创作与示范分得清"],"id":"new-story-08","source":"P118–119","kicker":"课后题与常见考法","collectFrom":["new-story-03","new-story-05"],"tutorial":[{"title":"把自己的三块接起来","text":"原人物与新条件→困难和选择→新结局。先检查顺序，不急着加长。"},{"title":"重点写最有变化的一刻","text":"关键决定可写语言动作心理；开赛、路程等不重要的部分简写。"},{"title":"最后读一遍因果","text":"每看到“于是、所以、终于”，就问前面是否真的给了原因。读者不应靠猜。"}]},{"type":"open","phase":"independent","title":"给自己的稿子改一笔","prompt":"选一处重复、含糊或不合情理的地方，写出修改前后，并说为什么改。","reference":"说明修改怎样帮助读者看清人物、过程或变化。开放习作需要家长复看，软件不按关键词自动判优秀。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"new-story-09","source":"P118–119","kicker":"课后题与常见考法","tutorial":[{"title":"不要先数用了几个好词","text":"先看哪一次转折最突然，读者最可能问“为什么”。"},{"title":"补条件或改行动","text":"若结尾靠合作，前面就需要合作条件与实际配合；若条件不合适，也可修改结局。"},{"title":"再选一个词让动作准确","text":"“冲过去”和“挪过去”速度感不同。按你希望写出的动作来选，不是越强烈越好。"}],"responseSupport":[{"label":"补原因","text":"原来缺少……，我在……之前补上……。","why":"在正确的位置补线索，比结尾解释一大段更顺。"},{"label":"调动作","text":"我把“走”改成“……”，因为这时人物……。","why":"由你的情节决定快慢、犹豫或坚定，不随机换华丽词。"}]},{"type":"open","phase":"transfer","title":"把方法带出去","prompt":"把“争第一”改成“合作完成”，故事中什么规则或条件必须一同改变？","reference":"若目标改成合作完成，就要交代共同任务与获胜条件，让每个角色的优势实际帮助任务完成。不能仍只比谁先到，再无理由判所有人获胜。","checklist":["指出需要变化的规则或条件","人物行动配合新目标","结局由过程自然得到"],"id":"new-story-10","source":"P118–119","kicker":"换个情境"},{"id":"new-story-end","type":"teach","phase":"transfer","title":"这一段先收住，下次从这里接","body":"先说一件今天能自己解释的事。还不会的留下来；暂停不清空，下一次从未完成处继续。","source":"P118–119","tutorial":[{"title":"带走一句自己的话","text":"不用追求现在把整课都做完。先说你今天学会使用的一种方法。"},{"title":"留下真正的接续点","text":"还有未完成的题或需要提示的地方，继续保留，不把“看过”记成“独立会”。"}]}],"reading":{"title":"《故事新编》：新结局要有新原因","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"先认原故事，再想新变化","text":"新编可以换结局、增加转折，但保留大家认识的主要人物。先说原来发生什么、怎样结束，再明确自己想改哪一点。它与复述不同：复述应保留主要事实，新编可以有意识地改变。"},{"label":"共同起点：龟兔赛跑","text":"传统故事里，兔子因自满停下睡觉，乌龟持续前进，最后乌龟获胜。新编可以选择兔子赢、乌龟再赢、双方都赢或双方都没赢；只宣布新结果还不够，过程必须让人相信。"},{"label":"老师示范倒推，不替你写全文","text":"如果想让兔子赢，先问它这次改变什么：它是否认真跑完全程？如果想双方都赢，可以先改变比赛规则，让获胜目标从单纯争速度变成共同完成任务。新规则要在前面交代，不能到结尾突然宣布。"},{"label":"转折怎样变成一个片段","text":"原创局部示范：“兔子刚想抄近路，发现路牌上的箭头已经被风吹反了。”这个变化会造成判断困难；接下来人物怎样观察、选择和行动，由你设计。不要只加一个怪物名字，却与结局没有关系。"},{"label":"组织整篇的路线","text":"先让读者认出原人物和这次的新条件；接着写关键困难与选择；最后让结果从选择中发生。语言、动作、神态可让人物鲜明，但不能代替前因后果。"},{"label":"检查新编是否站得住","text":"把你增加的一件事删掉，看结局是否还一样。若完全没影响，它可能只是装饰；若结局靠一个没有提前交代的神奇物件才成立，就需要补条件。"}]},"examTargets":["清楚区分原故事与自己的新编","由新结局倒推新情节","语言动作神态表现人物","前因后果合理，修改能补关键缺口"],"segments":[{"id":"new-story-draft","title":"为新结局编出可信的过程","startStepId":"new-story-01","endStepId":"new-story-end","minutes":25,"scene":"hotel","goal":"由结果倒推新条件，写关键转折并组织自己的新编。","check":"新结局有新条件和行动支撑，留下本人的片段或初稿。"}],"sourceNotes":["本次教学重做：随身阅读为依据原书的原创转述；分步示范与局部表达帮助必须记提示，不代表孩子已独立完成。"],"reader":{"kind":"guide","core":"结局变了，前面的原因也要说得通。","hook":"这次龟兔赛跑，会发生什么？","author":"读写小练习","pages":"P118–119","textSource":"依据家长所供教辅的本课要求编写；以下是原创学习指引，不是课文原文。","paragraphs":[{"label":"先定一个新结局","text":"兔子赢、乌龟赢、一起到，或者都没到。选一个你最想讲的结果。","anchor":"","meaning":"先定一个新结局","why":"先知道要把故事带到哪里。"},{"label":"想清为什么","text":"如果兔子这次不睡觉，乌龟为什么还能赢？发生了什么新事情？","anchor":"","meaning":"想清为什么","why":"给新结局一个讲得通的原因。"},{"label":"把过程写出来","text":"谁遇到什么困难，怎样应对？加一段动作或对话，让故事动起来。","anchor":"","meaning":"把过程写出来","why":"新奇之后，还要让人明白。"},{"label":"回头检查","text":"从结果往前看：前面铺好了原因吗？没写过的神奇东西，不能最后突然冒出来救场。","anchor":"","meaning":"回头检查","why":"前因和后果要接上。"}],"tests":[{"q":"写原故事名、原来的关键原因与结局，再写你准备怎样改结果。可以用3行关键词，不用先写正文。","ref":"示例只说明规划形式：原故事人物／原来因为什么出现何种结果／我希望改成什么结果。新编可以想象，不要求真实经历，但要标清哪些是你新加的。","back":0,"modelAnswer":"原故事：《龟兔赛跑》。\n原来的原因与结局：兔子跑得快却中途睡觉，乌龟一直坚持，最后乌龟获胜。\n新结果：把比赛改为共同送信。兔子负责岸上的路，乌龟负责过河，两人合作把信送到。","answerKind":"合理想象示例","answerNote":"补出的动作和对话是合理想象；你可以有不同写法。"},{"q":"为你的新结局写一个关键转折，加入对话或动作，让它合情合理。","ref":"人物和原故事有联系；新情节能解释新结果；改变是有意的新编，不是复述时记错。","back":0,"modelAnswer":"雨后的木桥断了，兔子抱着信，在河边急得直跺脚。乌龟游过来说：“把信交给我，我先送到对岸。剩下的陆路，再由你接着跑。”兔子把信装进防水袋，递了过去。过河后，兔子接住信，飞快地奔向收信人的家。","answerKind":"合理想象示例","answerNote":"补出的动作和对话是合理想象；你可以有不同写法。"},{"q":"把“争第一”改成“合作完成”，故事中什么规则或条件必须一同改变？","ref":"若目标改成合作完成，就要交代共同任务与获胜条件，让每个角色的优势实际帮助任务完成。不能仍只比谁先到，再无理由判所有人获胜。","back":0,"modelAnswer":"目标要从“谁先到终点谁赢”改成“共同把信送到”。任务也要有两人各自能发挥长处的部分：兔子跑陆路快，乌龟会游水。还要提前说明途中有河、信不能弄湿，并安排好交接，合作完成的结局才有依据。","answerKind":"新编思路示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"media":null}},{"id":"k-unit3-garden","title":"语文园地三、快乐读书吧与回看","date":null,"minutes":23,"bookPages":"P120–124","unit":3,"goal":"把民间故事的语言、情节和愿望串起来，读懂《乞巧》并自主阅读。","source":"金牌训练·同步教材 P120–124；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"故事能传下去，有什么特点","body":"口头讲述的语言亲切，神奇情节引人入胜，也寄托人们的愿望。","detail":["用海力布和牛郎织女各举一个例子：神奇物件或情节怎样推动故事；人们希望保护乡亲、获得自由或团圆。不要把“民间故事”只定义成有神仙。"],"id":"k-unit3-garden-01","source":"P120–124","kicker":"按书细读","reading":{"title":"语言积累与一篇随身民间故事","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"三篇课文共同教什么","text":"海力布与牛郎织女都有普通人的生活、神奇的帮助或限制，以及保护他人、自由团聚的愿望。民间故事语言适合口头讲述；理解时既要跟上情节，也要问神奇变化在替谁解决什么难题。"},{"label":"俗语与成语对照","text":"鼻子都气歪了—气急败坏；前怕狼后怕虎—畏首畏尾；盼星星盼月亮—望眼欲穿；打开天窗说亮话—直言不讳；吃水不忘挖井人—饮水思源。大意相近，表达的口气和适合的场合不完全相同。"},{"label":"《乞巧》原诗","text":"唐·林杰：七夕今宵看碧霄，牵牛织女渡河桥。家家乞巧望秋月，穿尽红丝几万条。"},{"label":"先看天上，再看人间","text":"今宵是今晚，碧霄是青天。前两句写七夕望向天空，联想牛郎织女相会；后两句转到人间，家家望月穿针，祈求心灵手巧。“几万条”夸张地写参与很多、心愿热切，不是精确统计丝线。"},{"label":"把相遇讲具体：可用的事实","text":"牛郎把自己的身世告诉织女；织女说天上织锦辛苦、没有自由，自己向往人间生活。这些是原故事已有内容。扩写初见时，可以据此补问答、语气或动作，但不能把她向往人间改成只想立刻回天上。"},{"label":"随身选读：《田螺姑娘》教学转述","text":"从前，一个勤劳的年轻人在田间发现大田螺，带回家放在水缸里。此后他劳作回家，总见饭菜备好、屋子收拾齐整，却不知道谁在帮忙。他留心观察，发现一位姑娘从水缸边出现，原来神奇的田螺与帮助有关。在书中介绍的这个版本里，两人后来成为家人，过上安稳的日子。"},{"label":"读这则故事要抓的线","text":"拾得田螺→家中发生变化→查明帮助者→生活变好。神奇角色把普通劳动者对被关心、幸福生活的愿望写出来。这是原书P122所介绍故事的简要教学转述，不等于完整阅读整本故事集。"},{"label":"整本书继续读什么","text":"原书还介绍中国、欧洲和非洲的民间故事集。手头没有整本书，先读完这里的短篇并记录范围；有书时再从已读位置接着读，比较不同地区故事中的人物、神奇情节与愿望。"}]},"tutorial":[{"title":"不是有神仙就算读懂","text":"先讲发生什么，再说明神奇情节怎样推动事情；只报“有宝石”还没有解释作用。"},{"title":"把两篇放一起","text":"宝石让海力布听到灾情，牛皮让牛郎追赶；都把普通人的愿望与神奇力量连起来。"},{"title":"说主题也要带事","text":"保护乡亲、争取团聚，各有对应行动；先找行动，再说人们的愿望。"}]},{"type":"teach","phase":"teach","title":"俗语与成语，意思相通","body":"俗语常像生活里的话，成语较凝练。选择要看人物和场合。","detail":["鼻子都气歪了—气急败坏；前怕狼后怕虎—畏首畏尾；盼星星盼月亮—望眼欲穿；打开天窗说亮话—直言不讳；吃水不忘挖井人—饮水思源。","意思相近不代表语气完全一样。给人物写口语对话时，亲切的俗语常更自然。"],"id":"k-unit3-garden-02","source":"P120–124","kicker":"按书细读","tutorial":[{"title":"先保留相同意思","text":"“盼星星盼月亮”和“望眼欲穿”都写急切盼望，不是简单写看星空。"},{"title":"再听说话的口气","text":"“我盼星星盼月亮，总算等到你。”像自然对话；成语可以更凝练，但不必每句都换。"},{"title":"用到人物身上","text":"生气、犹豫、盼望、坦言、感恩，分别去找相应说法。先选意思，再选口气。"}]},{"type":"choice","phase":"independent","title":"换说法，保留意思","body":"“盼星星盼月亮，终于等到你回来。”对应哪个成语？","options":[{"id":"0","text":"气急败坏"},{"id":"1","text":"望眼欲穿"},{"id":"2","text":"饮水思源"}],"answer":"1","explanation":"这里突出长久、急切地盼望，不是生气或感恩。","repair":{"gap":"先看题目要你比较什么。","reason":"这里突出长久、急切地盼望，不是生气或感恩。","check":"回到原题，用这个依据再判断。"},"id":"k-unit3-garden-03","source":"P120–124","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"让人物说自己的话","prompt":"给一个急切盼朋友回来的人写一句对话，先用俗语，再换成较凝练的说法。","reference":"两种表达保留急切盼望的意思；比较哪一种更像这个人物平时说话。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"k-unit3-garden-04","source":"P120–124","kicker":"课后题与常见考法","responseSupport":[{"label":"口语起笔","text":"我盼星星盼月亮，终于……。","why":"适合人物急切等到某件事，结尾由你写。"}]},{"type":"teach","phase":"teach","title":"读《乞巧》","body":"前两句说传说，后两句写人间习俗。先读懂，再背。","detail":["林杰：七夕今宵看碧霄，牵牛织女渡河桥。家家乞巧望秋月，穿尽红丝几万条。","乞巧是向织女乞求灵巧；碧霄指青天。“几万条”突出参与者多、心愿热切，不是统计数字。"],"id":"k-unit3-garden-05","source":"P120–124","kicker":"按书细读","tutorial":[{"title":"第一眼看今晚的天空","text":"“今宵”是今晚，“碧霄”是青天。先把时间地点的意思读清。"},{"title":"诗从传说走向生活","text":"前两句联想天上相会，后两句写人间乞巧。不是四句都在说神仙。"},{"title":"“乞巧”到底求什么","text":"“乞”是请求，“巧”是灵巧。人们借穿针等活动寄托心灵手巧的愿望。"},{"title":"理解后再记两幅画","text":"天空：牛郎织女渡桥；人间：家家望月穿针。用这两幅画记顺序，再核对原诗。"}],"reading":{"title":"语言积累与一篇随身民间故事","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"《乞巧》原诗","text":"唐·林杰：七夕今宵看碧霄，牵牛织女渡河桥。家家乞巧望秋月，穿尽红丝几万条。"},{"label":"先看天上，再看人间","text":"今宵是今晚，碧霄是青天。前两句写七夕望向天空，联想牛郎织女相会；后两句转到人间，家家望月穿针，祈求心灵手巧。“几万条”夸张地写参与很多、心愿热切，不是精确统计丝线。"}]}},{"type":"recall","phase":"recall","title":"背诗、解释，再分次默写","prompt":"先背《乞巧》，解释传说与人间活动怎样相连。有纸笔和时间，再遮住诗默写；暂时没有就留下“待默写”，不用这次全部做完。","reference":"核对原诗：七夕今宵看碧霄，牵牛织女渡河桥。家家乞巧望秋月，穿尽红丝几万条。前两句写七夕仰望天空、想象相会，后两句写望月乞巧、穿针引线。重点区分今宵与碧霄。背诵、解释、纸笔默写分别记录，打字不代替纸笔。","checklist":["我说明了实际完成的是背诵、解释还是默写","背诗和默写后都重新对照原句","没做默写就留下待写，错字与漏句分别记"],"id":"k-unit3-garden-06","source":"P120–124","kicker":"遮住讲回","reading":{"title":"语言积累与一篇随身民间故事","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"《乞巧》原诗","text":"唐·林杰：七夕今宵看碧霄，牵牛织女渡河桥。家家乞巧望秋月，穿尽红丝几万条。"},{"label":"先看天上，再看人间","text":"今宵是今晚，碧霄是青天。前两句写七夕望向天空，联想牛郎织女相会；后两句转到人间，家家望月穿针，祈求心灵手巧。“几万条”夸张地写参与很多、心愿热切，不是精确统计丝线。"}]}},{"type":"choice","phase":"independent","title":"诗中数字怎么理解？","body":"“穿尽红丝几万条”中的“几万条”最主要的表达效果是？","options":[{"id":"0","text":"精确公布丝线用量"},{"id":"1","text":"夸张地突出参与之多、愿望之切"},{"id":"2","text":"说明只能用红线量天空"}],"answer":"1","explanation":"诗歌中的数字需联系表达目的，这里不是精确测量。","repair":{"gap":"先看题目要你比较什么。","reason":"诗歌中的数字需联系表达目的，这里不是精确测量。","check":"回到原题，用这个依据再判断。"},"id":"k-unit3-garden-07","source":"P120–124","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"快乐读书吧：读一本，留下发现","body":"先读这里的《田螺姑娘》教学转述。手边有整本书时，再继续扩展阅读。","detail":["原书提到中国、欧洲、非洲等地区民间故事，可沿《田螺姑娘》等继续读。比较不同故事的相似愿望与各自特色，不把未读的内容算已读。"],"id":"k-unit3-garden-08","source":"P120–124","kicker":"按书细读","tutorial":[{"title":"先在这里读一篇","text":"随身材料已经提供《田螺姑娘》的简要教学转述。没带书也能先读出事件和愿望。"},{"title":"抓一次神奇变化","text":"年轻人外出劳动，家里却被收拾好。变化引出疑问，后来发现姑娘才接上原因。"},{"title":"把读到的范围说实","text":"可以记录“读完本页转述”。不能因此记成读完《中国民间故事》整本书。"}]},{"type":"open","phase":"independent","title":"留下真实读过的一篇","prompt":"可直接用刚读的《田螺姑娘》转述：记阅读范围，列四件事，写最神奇的变化及它表达的愿望。有整本书也可换成实际读过的故事。","reference":"范围可写“本页《田螺姑娘》教学转述”。事件：拾螺、发现家中变化、找到帮助者、生活变好。说明神奇帮助寄托对幸福与被关心的期盼。未读整本就保留续读状态。","checklist":["写清实际读到的范围","四件事连得起来","说明神奇变化与人物愿望的关系"],"id":"k-unit3-garden-09","source":"P120–124","kicker":"课后题与常见考法","reading":{"title":"语言积累与一篇随身民间故事","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"随身选读：《田螺姑娘》教学转述","text":"从前，一个勤劳的年轻人在田间发现大田螺，带回家放在水缸里。此后他劳作回家，总见饭菜备好、屋子收拾齐整，却不知道谁在帮忙。他留心观察，发现一位姑娘从水缸边出现，原来神奇的田螺与帮助有关。在书中介绍的这个版本里，两人后来成为家人，过上安稳的日子。"},{"label":"读这则故事要抓的线","text":"拾得田螺→家中发生变化→查明帮助者→生活变好。神奇角色把普通劳动者对被关心、幸福生活的愿望写出来。这是原书P122所介绍故事的简要教学转述，不等于完整阅读整本故事集。"},{"label":"整本书继续读什么","text":"原书还介绍中国、欧洲和非洲的民间故事集。手头没有整本书，先读完这里的短篇并记录范围；有书时再从已读位置接着读，比较不同地区故事中的人物、神奇情节与愿望。"}]}},{"type":"open","phase":"independent","title":"单元独立检查","prompt":"不看提示说明：怎样创造性复述而不讲乱？故事新编又有什么不同？","reference":"复述保留主要事实与因果，可换角色、补合理细节；新编可以改情节结果，但要让新原因撑起结果。","checklist":["回答了题目中的每个任务","用本课事件或自己的材料作依据","参考过帮助时如实保留提示记录"],"id":"k-unit3-garden-10","source":"P120–124","kicker":"课后题与常见考法"},{"type":"open","phase":"transfer","title":"把初见的一句话讲具体","prompt":"根据随身材料，把“织女讲了天上生活”扩成两三句初见对话。补一个牛郎的提问、一句织女的回答，再用一个动作或语气表现心情；注明“我的合理想象”。","reference":"事实基础是织女在天上织锦、缺少自由、向往人间。可以想象牛郎问她为何下来，以及她怎样解释；对话由你组织，语气动作支持当时心情，不改变主要事实。","checklist":["保留天上生活与向往人间的事实","问答能彼此接上","动作或语气帮助表现心情","明确新增的是合理想象"],"id":"k-unit3-garden-11","source":"P120–124","kicker":"换个情境","responseSupport":[{"label":"让问答接起来","text":"听到……，牛郎问：“……？”","why":"先有听见的信息，再有具体问题，避免突然换话题。"},{"label":"让语气显示心情","text":"她轻轻叹了口气，说：“……”","why":"只有想表达受拘束的无奈时才用；若你选择另一种心情，也可换动作。"}],"reading":{"title":"语言积累与一篇随身民间故事","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"把相遇讲具体：可用的事实","text":"牛郎把自己的身世告诉织女；织女说天上织锦辛苦、没有自由，自己向往人间生活。这些是原故事已有内容。扩写初见时，可以据此补问答、语气或动作，但不能把她向往人间改成只想立刻回天上。"}]}},{"id":"k-unit3-garden-end","type":"teach","phase":"transfer","title":"这一段先收住，下次从这里接","body":"先说一件今天能自己解释的事。还不会的留下来；暂停不清空，下一次从未完成处继续。","source":"P120–124","tutorial":[{"title":"带走一句自己的话","text":"不用追求现在把整课都做完。先说你今天学会使用的一种方法。"},{"title":"留下真正的接续点","text":"还有未完成的题或需要提示的地方，继续保留，不把“看过”记成“独立会”。"}]}],"reading":{"title":"语言积累与一篇随身民间故事","note":"随身阅读：依据书中事件重新讲述，非课文原文。短引原句会单独注明；纸书页码供有书时对照。","paragraphs":[{"label":"三篇课文共同教什么","text":"海力布与牛郎织女都有普通人的生活、神奇的帮助或限制，以及保护他人、自由团聚的愿望。民间故事语言适合口头讲述；理解时既要跟上情节，也要问神奇变化在替谁解决什么难题。"},{"label":"俗语与成语对照","text":"鼻子都气歪了—气急败坏；前怕狼后怕虎—畏首畏尾；盼星星盼月亮—望眼欲穿；打开天窗说亮话—直言不讳；吃水不忘挖井人—饮水思源。大意相近，表达的口气和适合的场合不完全相同。"},{"label":"《乞巧》原诗","text":"唐·林杰：七夕今宵看碧霄，牵牛织女渡河桥。家家乞巧望秋月，穿尽红丝几万条。"},{"label":"先看天上，再看人间","text":"今宵是今晚，碧霄是青天。前两句写七夕望向天空，联想牛郎织女相会；后两句转到人间，家家望月穿针，祈求心灵手巧。“几万条”夸张地写参与很多、心愿热切，不是精确统计丝线。"},{"label":"把相遇讲具体：可用的事实","text":"牛郎把自己的身世告诉织女；织女说天上织锦辛苦、没有自由，自己向往人间生活。这些是原故事已有内容。扩写初见时，可以据此补问答、语气或动作，但不能把她向往人间改成只想立刻回天上。"},{"label":"随身选读：《田螺姑娘》教学转述","text":"从前，一个勤劳的年轻人在田间发现大田螺，带回家放在水缸里。此后他劳作回家，总见饭菜备好、屋子收拾齐整，却不知道谁在帮忙。他留心观察，发现一位姑娘从水缸边出现，原来神奇的田螺与帮助有关。在书中介绍的这个版本里，两人后来成为家人，过上安稳的日子。"},{"label":"读这则故事要抓的线","text":"拾得田螺→家中发生变化→查明帮助者→生活变好。神奇角色把普通劳动者对被关心、幸福生活的愿望写出来。这是原书P122所介绍故事的简要教学转述，不等于完整阅读整本故事集。"},{"label":"整本书继续读什么","text":"原书还介绍中国、欧洲和非洲的民间故事集。手头没有整本书，先读完这里的短篇并记录范围；有书时再从已读位置接着读，比较不同地区故事中的人物、神奇情节与愿望。"}]},"examTargets":["民间故事内容与表达特点","俗语成语辨义与情境使用","背诵、解释与纸笔默写乞巧分开核验","自主阅读记录与创造性复述方法区分"],"segments":[{"id":"unit3-language","title":"俗语、成语与乞巧","startStepId":"k-unit3-garden-01","endStepId":"k-unit3-garden-07","minutes":12,"scene":"train","goal":"用合适的说法表达情境，读懂两幅诗中画面再背。","check":"解释一个俗语与对应成语，讲出乞巧的传说与习俗。"},{"id":"unit3-reading","title":"读一篇短故事，再比较讲法","startStepId":"k-unit3-garden-08","endStepId":"k-unit3-garden-end","minutes":11,"scene":"hotel","goal":"阅读随身田螺姑娘转述，记录范围并区分复述与新编。","check":"依据实际读过的材料，解释神奇情节与人物愿望。"}],"sourceNotes":["本次教学重做：随身阅读为依据原书的原创转述；分步示范与局部表达帮助必须记提示，不代表孩子已独立完成。"],"reader":{"kind":"guide","core":"故事讲顺，想象有根据，人物说话像本人。","hook":"把你喜欢的民间故事讲给别人听。","author":"读写小练习","pages":"P120–124","textSource":"依据家长所供教辅的本课要求编写；以下是原创学习指引，不是课文原文。","paragraphs":[{"label":"串好主要情节","text":"海力布：救蛇、得宝、救乡亲。牛郎织女：相识、成家、被拆散、相会。","anchor":"","meaning":"串好主要情节","why":"像给连环画排好顺序。"},{"label":"换个人来讲","text":"改用海力布的“我”来讲。谁是我、谁是别人，要一直分清。","anchor":"","meaning":"换个人来讲","why":"口吻变了，原来的事情别变乱。"},{"label":"把简略处讲具体","text":"选一句简写的情节，补场景、动作和对话。哪些是想象，要说清。","anchor":"","meaning":"把简略处讲具体","why":"想象要合人物、合情节。"},{"label":"接着读一本书","text":"选一个民间故事，记最神奇的地方，再讲它为什么让你记住。","anchor":"","meaning":"接着读一本书","why":"阅读收获用自己的话讲，不背介绍。"}],"tests":[{"q":"给一个急切盼朋友回来的人写一句对话，先用俗语，再换成较凝练的说法。","ref":"两种表达保留急切盼望的意思；比较哪一种更像这个人物平时说话。","back":0,"modelAnswer":"用俗语：“我盼星星盼月亮，总算盼到你回来了！”\n换一种较凝练的说法：“我盼你回来，真是望眼欲穿啊！”\n两句都表达急切盼望的心情，第一句更口语化，第二句更简练。","answerKind":"对话示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"先背《乞巧》，解释传说与人间活动怎样相连。有纸笔和时间，再遮住诗默写；暂时没有就留下“待默写”，不用这次全部做完。","ref":"核对原诗：七夕今宵看碧霄，牵牛织女渡河桥。家家乞巧望秋月，穿尽红丝几万条。前两句写七夕仰望天空、想象相会，后两句写望月乞巧、穿针引线。重点区分今宵与碧霄。背诵、解释、纸笔默写分别记录，打字不代替纸笔。","back":0,"modelAnswer":"《乞巧》　唐·林杰\n七夕今宵看碧霄，牵牛织女渡河桥。\n家家乞巧望秋月，穿尽红丝几万条。\n前两句写人们仰望夜空，想到牛郎织女七夕相会的传说；后两句写人间望月、穿针乞巧的活动。传说和习俗由“七夕”联系起来。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"根据随身材料，把“织女讲了天上生活”扩成两三句初见对话。补一个牛郎的提问、一句织女的回答，再用一个动作或语气表现心情；注明“我的合理想象”。","ref":"事实基础是织女在天上织锦、缺少自由、向往人间。可以想象牛郎问她为何下来，以及她怎样解释；对话由你组织，语气动作支持当时心情，不改变主要事实。","back":0,"modelAnswer":"我的合理想象：\n牛郎轻声问：“你在天上过得快乐吗？”\n织女低下头说：“每天都要织许多布，我多想过自由的日子。”\n说着，她望向远处的田野，眼睛亮了起来。","answerKind":"合理想象示例","answerNote":"补出的动作和对话是合理想象；你可以有不同写法。"}],"media":null}}]};window.LESSON_BLUEPRINT={appId:"kenton_chinese_preview_20260915",child:"kenton",source:"金牌训练·学习笔记同步教材·五年级语文上 P60–124",courseDate:"2026-09-15起，按原书接续",currentGap:"新增衔接课尚无独立完成证据；以真实首答建立起点。",observableOutcome:"不看提示能复述课文展开顺序，并用词句或实验结果支撑判断。",essentialQuestion:"课文说了什么，作者怎样说，考试让我们用什么证据回答？",coreInsight:"关键句串起比较；言行与前后变化支撑人物判断。",realMeaning:"读懂事情与证据，能把自己的想法讲清楚。",compressionPath:"全文阅读→点句子看重点→独立讲回→对照与定点回读→少量迁移",visibleMechanism:"相邻事物比较、救援秩序、民间故事因果与伏笔",transferProof:"独立重建顺序并解释新情境，开放表达仍待复看。",knowledgeMechanism:"由全文顺序定位证据，由操作变化理解原因，由表达效果回答考向。",primaryInteraction:"原生SVG因果推演、顺序重排、自己写关键词和讲回。",childAnswerContract:"child-first-v1",childFirstLayerLimit:100,escapePolicy:"repair-once-then-reveal-and-continue",maxBlockingAttempts:2,masteryBoundary:"预习完成不等于掌握；首答、提示后修正、主观自查分开保留。",audio:"not-applicable：本轮目标为默读理解、视觉推演与自主表达。",surprise:"亲手改变条件，看到证据与推断一起改变。",surpriseTrigger:"每课主要模型操作后，再遮挡讲回。",phases:["teach","guided","recall","independent","repair","transfer"]};window.DDLearningSyncConfig={manualOnly:true};</script>

<script>(function(){
'use strict';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const person=(x,y,color='#476477')=>`<g transform="translate(${x} ${y})" fill="${color}"><circle cy="-15" r="7"/><path d="M-9-4Q0-11 9-4L12 19H-12Z"/></g>`;
function button(text,handler,cls=''){const b=document.createElement('button');b.type='button';b.className='model-button '+cls;b.textContent=text;b.onclick=handler;return b;}
function stage(host){host.innerHTML='<div class="knowledge-stage"></div><div class="model-controls"></div><p class="model-result" aria-live="polite"></p>';return[host.children[0],host.children[1],host.children[2]];}
const speedObjects=[['人','奔跑'],['鸵鸟','两腿奔跑'],['猎豹','陆地奔跑'],['游隼','向下俯冲'],['喷气式飞机','高速飞行'],['火箭','向太空飞行'],['流星体','在太空运动'],['光','传播']];
function speed(step,host,change){
 const [view,controls,result]=stage(host),saved=step.savedState||{};let idx=Number.isInteger(saved.comparison)?saved.comparison:1,visited=new Set(saved.viewed||[]),qualifier=saved.qualifier||0,removed=!!saved.removed,wordTried=!!saved.wordTried;
 const qs=step.config?.qualifiers||[{word:'陆地上',with:'猎豹是陆地上跑得最快的动物。',without:'猎豹是跑得最快的动物。',effect:'去掉范围，容易让人以为包括所有动物。'}];
 const tab=document.createElement('div');tab.className='speed-tabs';
 speedObjects.slice(1).forEach((o,i)=>tab.append(button(o[0],()=>{idx=i;visited.add(i);draw();emit();})));
 controls.append(tab);const words=document.createElement('div');words.className='model-row';qs.forEach((q,i)=>words.append(button('看“'+q.word+'”',()=>{qualifier=i;removed=false;draw();emit();})));controls.append(words);
 const toggle=button('试着删去条件词',()=>{removed=!removed;wordTried=true;draw();emit();},'primary');controls.append(toggle);
 function emit(){change({model:'speed',comparison:idx,viewed:[...visited],qualifier,removed,wordTried,complete:visited.size>=2&&wordTried});}
 function draw(){const a=speedObjects[idx],b=speedObjects[idx+1],q=qs[qualifier]||qs[0];tab.querySelectorAll('button').forEach((e,i)=>e.setAttribute('aria-pressed',String(i===idx)));words.querySelectorAll('button').forEach((e,i)=>e.setAttribute('aria-pressed',String(i===qualifier)));toggle.textContent=removed?'把“'+q.word+'”放回来':'试着删去“'+q.word+'”';
 view.innerHTML=`<div class="model-eyebrow">从熟悉的事物，一步步向外看</div><div class="speed-pair"><div><span class="speed-token">${esc(a[0])}</span><small>${esc(a[1])}</small></div><div class="relation-arrow">&lt;</div><div><span class="speed-token faster">${esc(b[0])}</span><small>${esc(b[1])}</small></div></div><div class="speed-line"><span style="width:38%"></span><span style="width:78%"></span></div><p class="model-caption">长短仅表示快慢次序，不表示速度比例。</p><div class="scene-caption"><strong>${esc(removed?q.without:q.with)}</strong><span>${removed?'少了条件，还准确吗？':'条件词给这句话划出了边界。'}</span></div>`;
 result.textContent=(step.config?.pairs?.[idx]?.evidence||`读到“${b[0]}”时，找它与“${a[0]}”的比较。`)+(removed?' '+q.effect:' 再试试删词，比较意思怎样改变。');
 }
 draw();
}
function rescue(step,host,change){
 const [view,controls,result]=stage(host);let state=Number.isInteger(step.savedState?.scene)?step.savedState.scene:0,visited=new Set(step.savedState?.viewed||[]);const labels=['看遇险时','查清船况','安排撤离','照顾见习水手'];
 labels.forEach((s,i)=>controls.append(button(s,()=>{state=i;visited.add(i);draw();change({model:'rescue',scene:i,observation:labels[i],viewed:[...visited],complete:visited.size>=3});})));

function pause(){tick();active=false;dialog('先歇一会儿','<p>已经记住你读到哪儿了。</p><button class="primary" id="resume">接着读</button><a class="button quiet" href="'+esc(homeURL())+'">回去选课</a>');$('#resume').onclick=closeDialog;}
function exportData(){const data={schema:'reader-backup-v1',child:C.child,appId:C.appId,mode,reader:state,legacy:get(OLDKEY),round};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=C.child+'-reading-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('#parentButton').onclick=()=>{const legacy=get(OLDKEY);dialog('家长 · 记录与教材','<div data-parent-analysis><p>课文按所供教辅的版本录入，重点与自测是本次重写。查看、读到结尾、口述自报和对照参考都不等于掌握。所有主观题待复看。</p><p>本轮语文约 '+Math.floor(round.seconds/60)+' 分钟；停下和切到后台不计时。</p><button id="export">导出全部记录</button> <button id="newRound">休息好了，另开一轮</button><details><summary>新版回答与阅读位置</summary>'+C.lessons.map(l=>{const r=state.lessons[l.id];return r?'<h3>'+esc(l.title)+'</h3><p>第 '+(r.p+1)+' 段 · 自测 '+r.answers.filter(a=>a?.completedAt).length+' 题已对照，待复看</p>'+r.answers.map((a,i)=>'<p>第 '+(i+1)+' 题 · '+esc(a.responseMode==='spoken-unrecorded'?'口述自报，未录音':'文字作答')+'</p><p class="record-answer">'+esc(a.firstText||a.text||'未留下文字')+'</p>').join(''):'';}).join('')+'</details><details><summary>改版前的回答（完整保留）</summary><p>旧记录不覆盖新版。下面保留原样，导出也包含旧记录。</p><pre class="record-answer">'+esc(JSON.stringify(legacy,null,2)||'尚无旧记录')+'</pre></details><details><summary>教材与使用方式</summary><p>哥哥《金牌训练·学习笔记同步教材》五年级语文上；弟弟同系列四年级语文上。原文只包含所选课文，不含整本书和教参答案。</p><p>阅读页可以逐段前进，也能直接点段落号。情境插画和实物照片均随离线包保存；照片来源、作者与许可标在图下。模型按需展开。写作与园地显示原创指引，不标成原课文。每次窗口建议只选一科，车上约15分钟，安静处约25分钟。</p><button id="offline">准备离线课程</button><p id="offlineStatus"></p></details></div>');$('#export').onclick=exportData;$('#newRound').onclick=()=>{round.rounds.push({seconds:round.seconds,startedAt:round.startedAt,endedAt:now(),reason:'parent-new-round'});round.seconds=0;round.startedAt=now();routeStart=0;state.window={id:routeWindowId(),seconds:0,limit:(state.scene==='train'?15:25)*60};save();closeDialog();toast('新一轮已开始，原来的用时仍保留。');};$('#offline').onclick=e=>window.prepareTravelMath?.(e.currentTarget,$('#offlineStatus'));};
function tick(){const current=Date.now(),delta=Math.min(3,Math.max(0,(current-lastTick)/1000));lastTick=current;if(!active||document.hidden||$('#dialog').open||!L)return;refreshDay();round.seconds+=delta;rec().seconds+=delta;if(state.window)state.window.seconds+=delta;save();const requested=Number(q.get('routeMinutes')),limit=state.scene==='train'?Math.min(15,requested>0?requested:15):Math.min(25,requested>0?requested:25);if(round.seconds>=25*60||(state.window&&state.window.seconds>=state.window.limit)){active=false;dialog('这段时间先休息','<p>读到的位置已经存好，下次从这里继续。</p><a class="button primary" href="'+esc(homeURL())+'">先休息</a><button class="quiet" id="restedResume">休息好了，接着这一段</button>');$('#restedResume').onclick=()=>{round.rounds.push({seconds:round.seconds,startedAt:round.startedAt,endedAt:now(),reason:'resumed-after-rest'});round.seconds=0;round.startedAt=now();state.window={id:routeWindowId(),seconds:0,limit:(state.scene==='train'?15:25)*60};save();closeDialog();};}}
setInterval(tick,2000);document.addEventListener('visibilitychange',()=>{lastTick=Date.now();if(!document.hidden){const latest=get(ROUNDKEY);if(latest?.day===round.day&&Number.isFinite(latest.seconds))round.seconds=Math.max(round.seconds,latest.seconds);}});window.addEventListener('pagehide',()=>{tick();save();});
if(q.has('routeDay'))state.day=Math.max(1,Math.min(10,+q.get('routeDay')||2));if(['train','hotel'].includes(q.get('routeScene')))state.scene=q.get('routeScene');
const direct=q.get('lesson');if(direct&&C.lessons.some(x=>x.id===direct))start(direct);else home();
})();
</script>
</body></html>
