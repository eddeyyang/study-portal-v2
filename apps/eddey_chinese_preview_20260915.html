":"按书细读","tutorial":[{"title":"先认清三个位置词","text":"茎jīng是支撑、连接的部分；叶柄bǐng连接叶片与茎；“脚”是课文中帮助攀附的细丝。"},{"title":"先整体读，再看模型","text":"课文讲读已经列出五段：位置、叶子、脚的位置、爬的过程、两种后续变化。"},{"title":"别被字词拦住主线","text":"先读准茎、柄、触、萎wěi，再用模型把它们对应到位置与动作。"}]},{"type":"recall","phase":"recall","title":"把最不熟的字词再记一次","prompt":"先挑最多三个不熟的字词试着认读；有纸笔就遮住提示写一遍。记录自己要改的地方，没有纸笔可先记待写。","reference":"重新打开本课字词讲解，对照偏旁、部件和笔画。没有纸笔可以先练认读或打字，把纸笔默写留到酒店；这几种练习分开记录。","checklist":["我说明这次是认读、打字还是纸写","我对照材料核对了读音或字形","没做纸写就记待写，不算默写完成"],"id":"ivy-02","source":"P100–109","kicker":"遮住讲回"},{"type":"model","phase":"guided","title":"一只脚，怎样把茎拉近墙","body":"先让脚触墙，逐步看圆片、弯曲和拉近；再改成没触墙作对照。","model":"ivy","config":{},"id":"ivy-03","source":"P100–109","kicker":"跟着推演"},{"type":"recall","phase":"recall","title":"遮住模型，讲清动作","prompt":"把脚的变化连成一段。它是不是同一只脚松开再往上迈？","reference":"触墙→头上成圆片→巴住→细丝弯曲→拉嫩茎贴墙。新长的脚接着攀附，不是同一只脚像人的脚那样移动。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"ivy-04","source":"P100–109","kicker":"遮住讲回"},{"type":"teach","phase":"teach","title":"第1–2段：从一墙叶子看起","body":"先看长在哪里，再看叶子的颜色、排列和风中的样子。","detail":["叶子从嫩红到嫩绿，再到长大的鲜绿；一顺儿朝下、铺得均匀写排列，风拂过时漾起波纹写动态。不是一开始就只列脚的结构。"],"id":"ivy-05","source":"P100–109","kicker":"按书细读","tutorial":[{"title":"按作者的观察顺序看","text":"先看生长的墙，再看一墙叶子，最后才靠近看脚。这是从整体走向局部。"},{"title":"老师示范找连续观察的证据","text":"嫩红到嫩绿，中间有“不几天”。这段写的不是一次看到的颜色，而是隔几天后的变化。"},{"title":"整理成一句回答","text":"作者记录嫩叶几天前后的不同颜色，说明他在不同时间继续观察了同一植物。"}]},{"type":"choice","phase":"independent","title":"“拂过”比普通“吹过”多什么？","body":"联系叶子漾起波纹。","options":[{"id":"0","text":"强调轻轻掠过的感觉"},{"id":"1","text":"强调把整面墙吹倒"},{"id":"2","text":"说明没有风"}],"answer":"0","explanation":"拂写轻柔，和叶面波纹相呼应；替换后轻柔感可能减弱。","repair":{"gap":"先看题目要你比较什么。","reason":"拂写轻柔，和叶面波纹相呼应；替换后轻柔感可能减弱。","check":"回到原题，用这个依据再判断。"},"id":"ivy-06","source":"P100–109","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"第3段：脚在哪里","body":"找茎，再找叶柄。脚在长叶柄处的反面，是细丝，不是叶子。","detail":["枝状的六七根细丝，嫩红，像蜗牛触角。精确的位置、数量和颜色来自细致观察。用纸画茎、叶柄和相对位置，比背名词更能查理解。"],"id":"ivy-07","source":"P100–109","kicker":"按书细读","tutorial":[{"title":"按位置一步步找","text":"先找到茎，再找到长叶柄的位置，脚就在这个位置的反面。"},{"title":"再加形状、数量、颜色","text":"枝状六七根细丝，嫩红，像蜗牛触角。位置找对后，细节才有安放之处。"},{"title":"画图是为了检查理解","text":"不比谁画得漂亮。下一步由你画出茎、叶柄与反面的脚，并说清关系。"}]},{"type":"open","phase":"independent","title":"画图说明位置","prompt":"画茎、叶柄、叶子和脚，标出“反面”；再用一句话介绍脚的形状和颜色。","reference":"图里脚要在茎上长叶柄处的反面；六七根细丝像触角，嫩红。画得好看不是评分点，位置关系才是。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"ivy-08","source":"P100–109","kicker":"课后题与常见考法","reading":{"title":"读懂《爬山虎的脚》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第3段 · 脚到底在哪里","text":"爬山虎的“脚”长在茎上。茎上长叶柄的位置，反面伸出六七根分枝状细丝；细丝嫩红，形状像蜗牛触角。辨位置时先找茎与叶柄，再找它们相对的那一面。"}]}},{"type":"teach","phase":"teach","title":"第4–5段：动作与两种结局","body":"第4段写怎样爬，第5段比较触墙和未触墙的变化。","detail":["触、变、巴、弯、拉、贴，动词连成过程。没触墙的脚会萎；触墙的细丝和圆片逐渐变灰，攀附牢固。作者追踪变化，才能作出对照。"],"id":"ivy-09","source":"P100–109","kicker":"按书细读","tutorial":[{"title":"用动作把过程连起来","text":"触到墙，尖端成小圆片，巴住墙，细丝弯曲，嫩茎被拉近并贴住墙。"},{"title":"再追踪两种后续","text":"没触墙的脚枯萎；触墙的逐渐变灰，仍牢固。只看一次，难以知道后来怎样。"},{"title":"常考题怎样作证","text":"题目问观察仔细，就引用位置或动作等细节；问连续，就找时间与前后变化。别只重复题干。"}]},{"type":"order","phase":"independent","title":"把爬的过程排清楚","body":"按事情发生或方法使用的顺序，依次点选。","items":[{"id":"0","text":"脚触着墙"},{"id":"1","text":"细丝头部变成小圆片"},{"id":"2","text":"圆片巴住墙"},{"id":"3","text":"细丝由直变弯"},{"id":"4","text":"拉住嫩茎，使它贴墙"}],"answer":["0","1","2","3","4"],"explanation":"巴住后弯曲，才把茎拉向墙；不要把贴墙放在最前。","repair":{"gap":"找出前一步给后一步带来的条件。","reason":"巴住后弯曲，才把茎拉向墙；不要把贴墙放在最前。","check":"先放起点，再连起因果。"},"id":"ivy-10","source":"P100–109","kicker":"课后题与常见考法"},{"type":"choice","phase":"independent","title":"“逐渐”能随便删吗？","body":"细丝和小圆片逐渐变成灰色。","options":[{"id":"0","text":"能，任何变化都瞬间完成"},{"id":"1","text":"不能随意删，它交代变化是慢慢发生的"},{"id":"2","text":"只能用来凑字数"}],"answer":"1","explanation":"逐渐保留时间过程，体现持续观察和准确表达。","repair":{"gap":"先看题目要你比较什么。","reason":"逐渐保留时间过程，体现持续观察和准确表达。","check":"回到原题，用这个依据再判断。"},"id":"ivy-11","source":"P100–109","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"课后题独立回答","prompt":"从叶子、脚或攀爬过程选两处，说明为什么说作者观察得特别仔细。","reference":"用具体位置、形状、颜色、动作或时间变化作证据，不能只写“作者看得很仔细”。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"ivy-12","source":"P100–109","kicker":"课后题与常见考法","reading":{"title":"读懂《爬山虎的脚》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第2段 · 叶子怎样变、怎样排","text":"初生叶子嫩红，过几天长成嫩绿，长大后绿得鲜亮。叶尖朝下，叶子铺得均匀。风轻轻拂过，一墙叶子像漾起波纹。颜色的先后变化需要连续看；排列和风中的动静需要细看。"},{"label":"第3段 · 脚到底在哪里","text":"爬山虎的“脚”长在茎上。茎上长叶柄的位置，反面伸出六七根分枝状细丝；细丝嫩红，形状像蜗牛触角。辨位置时先找茎与叶柄，再找它们相对的那一面。"},{"label":"第4段 · 抓墙、弯曲、拉近","text":"细丝触到墙后，尖端形成小圆片，贴住墙面。原先直的细丝弯曲，把嫩茎拉近，使它紧贴墙。新的脚接着攀附，爬山虎因此不断往上长；不是同一只脚像人一样松开再迈一步。"},{"label":"第5段 · 分两种情况继续看","text":"没有触到墙的脚，过几天会枯萎，后来不留痕迹。触到墙的细丝和小圆片，颜色逐渐变灰，仍牢牢附着。作者对两种情况都继续观察，才知道它们后来不同的变化。"}]},"responseSupport":[{"label":"先说明证据是哪一处","text":"课文写到……","why":"从具体位置、数量、动作或前后颜色中选一处，不只写作者很仔细。"},{"label":"把细节连到观察方法","text":"这说明作者不只……，还……","why":"说明要经过怎样的观察，才能写出这条细节。"}]},{"type":"teach","phase":"teach","title":"从课文到观察记录","body":"选固定对象，多次记录。日期、变化和没变的地方都可以写。","detail":["可用表格或小图记录：时间—颜色/形状/大小—变化—疑问。前后比同一部位、用同一尺度，更容易发现真实变化。对未知物体以看和记录为主，不靠尝来辨认。"],"id":"ivy-13","source":"P100–109","kicker":"按书细读","tutorial":[{"title":"把课文方法带到自己手上","text":"选一个能再次看见的对象。今天先记日期、部位和两处事实。"},{"title":"下次比较要对得上","text":"仍看同一对象、同一部位，必要时用同样的尺度。不要换了一片叶却当成原叶变化。"},{"title":"没有变化也可以写","text":"真实记录能接续，就有价值。不要为了像作文而提前编出生长结果。"}]},{"type":"open","phase":"transfer","title":"开始一次真实观察","prompt":"选一种你能持续看到的植物，写今天日期、看到的两处细节和下一次准备比较的部位。","reference":"今天写实际看到的；未来变化留空，等下次观察。模拟图不能当真实观察记录。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"ivy-14","source":"P100–109","kicker":"换个情境"},{"id":"ivy-end","type":"teach","phase":"transfer","title":"留好这一课的接续点","body":"把这次能自己说明的一点留下，再记一处还需帮助的地方。现在可以保存并休息，下次从未完处接着学。","source":"P100–109","tutorial":[{"title":"这次的学习目标","text":"看清脚的位置和攀爬过程，用准确词语说明连续观察的发现。"},{"title":"完成与学会分开","text":"看过讲解、跟着完成、自己能说、隔天还能说，是不同情况。只记录这次真实做到了哪一步。"}]}],"reading":{"title":"读懂《爬山虎的脚》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第1段 · 先看到整片植物","text":"学校操场北边的墙上长满爬山虎，作者家的西墙和房顶上也长着大片爬山虎。先交代生长位置与茂盛的整体样子，再带我们靠近细看。"},{"label":"第2段 · 叶子怎样变、怎样排","text":"初生叶子嫩红，过几天长成嫩绿，长大后绿得鲜亮。叶尖朝下，叶子铺得均匀。风轻轻拂过，一墙叶子像漾起波纹。颜色的先后变化需要连续看；排列和风中的动静需要细看。"},{"label":"第3段 · 脚到底在哪里","text":"爬山虎的“脚”长在茎上。茎上长叶柄的位置，反面伸出六七根分枝状细丝；细丝嫩红，形状像蜗牛触角。辨位置时先找茎与叶柄，再找它们相对的那一面。"},{"label":"第4段 · 抓墙、弯曲、拉近","text":"细丝触到墙后，尖端形成小圆片，贴住墙面。原先直的细丝弯曲，把嫩茎拉近，使它紧贴墙。新的脚接着攀附，爬山虎因此不断往上长；不是同一只脚像人一样松开再迈一步。"},{"label":"第5段 · 分两种情况继续看","text":"没有触到墙的脚，过几天会枯萎，后来不留痕迹。触到墙的细丝和小圆片，颜色逐渐变灰，仍牢牢附着。作者对两种情况都继续观察，才知道它们后来不同的变化。"},{"label":"把全文连起来 · 从整体到局部","text":"先看在哪里长，再看一墙叶子，随后看脚的位置、爬的动作和后来的变化。准确的位置词、动作词、时间词，让观察过程可以被读者复原。"}]},"segments":[{"id":"ivy-process","title":"从整体读到脚的攀爬","startStepId":"ivy-01","endStepId":"ivy-08","minutes":17,"goal":"找准脚的位置，讲清攀爬动作","scene":"hotel","check":"画对茎、叶柄与脚的位置，再讲一次拉近过程。"},{"id":"ivy-observe","title":"找观察证据，开始自己记录","startStepId":"ivy-09","endStepId":"ivy-end","minutes":12,"goal":"用时间和细节说明连续细致观察","scene":"train","check":"选两条课文证据，说明怎样观察才知道。"}],"reader":{"author":"叶圣陶","pages":"P36–38","core":"按“触墙→巴住→弯曲→拉近”看清它怎样爬。","hook":"它的“脚”，真的会一步步走吗？","notes":[{"anchor":"墙上","meaning":"先看整片爬山虎长在哪里。","why":"从远处的整体，慢慢走近看叶子和脚。"},{"anchor":"不几天","meaning":"叶子从嫩红变成嫩绿。","why":"看了不同日子，才知道颜色在变化。"},{"anchor":"反面","meaning":"脚在长叶柄处的反面，像细丝。","why":"位置、样子、颜色都写清，说明看得细。"},{"anchor":"拉一把","meaning":"小圆片巴墙，细丝弯曲，嫩茎被拉近。","why":"它不靠一只脚挪着走，而是不断长出新的脚。"},{"anchor":"逐渐","meaning":"触墙的脚慢慢变灰，巴得很牢。","why":"没触墙的会萎掉。连续看，才能发现两种变化。"}],"tests":[{"q":"用自己的话说，爬山虎怎样往上爬？","ref":"脚触墙，头部变小圆片并巴住墙；细丝弯曲，拉嫩茎贴墙，新脚接着长。","back":3,"modelAnswer":"爬山虎的脚触着墙时，细丝的头上变成小圆片，巴住墙。细丝原先是直的，后来弯曲，把嫩茎拉一把，使它紧贴在墙上。爬山虎不断长出新脚，就这样一脚一脚往上爬。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"哪一个词让你知道作者不是只看了一眼？为什么？","ref":"如“不几天”“逐渐”“后来”，这些变化需要在不同时间连续观察。","back":4,"modelAnswer":"“逐渐”写出细丝和小圆片不是一下子变成灰色，而是在一段时间里慢慢变化。作者需要连续观察，比较前后的样子，才能发现并准确写出这个过程。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"如果你观察一片叶子，明天怎样接着看，才能知道它变没变？","ref":"继续看同一片叶，记下日期，比较同一部位的颜色、大小或边缘；没变也如实记。","back":1,"modelAnswer":"我会继续看同一株植物的同一片叶，先记日期和时间，再看颜色、边缘和大小，与今天的记录比较。没有量过就不编长度，没有变化也照实写。最后记下一个想继续观察的问题。","answerKind":"观察计划示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"从课文找出一句你觉得写得准确、形象的句子，抄写下来，再说说好在哪里。","ref":"抄对原句；指出具体词语怎样让画面准确或生动。","modelAnswer":"我选的句子是：“一阵风拂过，一墙的叶子就漾起波纹，好看得很。”\n“漾起波纹”把满墙叶子随风起伏的样子写得像水面上的波纹，让我仿佛看见一整面墙的叶子轻轻摆动。这是抄写与赏析示例，你可以选自己喜欢的另一句。","back":1,"answerKind":"摘抄与赏析示例","answerNote":"意思完整、有课文依据即可，不必逐字相同。"}],"kind":"article","paragraphs":[{"text":"学校操场北边墙上满是爬山虎。我家也有爬山虎，从小院的西墙爬上去，在房顶上占了一大片地方。","anchor":"墙上","meaning":"先看整片爬山虎长在哪里。","why":"从远处的整体，慢慢走近看叶子和脚。","label":"第 1 段"},{"text":"爬山虎刚长出来的叶子是嫩红的，不几天叶子长大，就变成嫩绿的。爬山虎的嫩叶，不大引人注意，引人注意的是长大了的叶子。那些叶子绿得那么新鲜，看着非常舒服。叶尖一顺儿朝下，在墙上铺得那么均匀，没有重叠起来的，也不留一点儿空隙。一阵风拂过，一墙的叶子就漾起波纹，好看得很。","anchor":"不几天","meaning":"叶子从嫩红变成嫩绿。","why":"看了不同日子，才知道颜色在变化。","label":"第 2 段"},{"text":"以前，我只知道这种植物叫爬山虎，可不知道它怎么能爬。今年，我注意了，原来爬山虎是有脚的。爬山虎的脚长在茎上。茎上长叶柄的地方，反面伸出枝状的六七根细丝，这些细丝很像蜗牛的触角。细丝跟新叶子一样，也是嫩红的。这就是爬山虎的脚。","anchor":"反面","meaning":"脚在长叶柄处的反面，像细丝。","why":"位置、样子、颜色都写清，说明看得细。","label":"第 3 段"},{"text":"爬山虎的脚触着墙的时候，六七根细丝的头上就变成小圆片，巴住墙。细丝原先是直的，现在弯曲了，把爬山虎的嫩茎拉一把，使它紧贴在墙上。爬山虎就是这样一脚一脚地往上爬。如果你仔细看那些细小的脚，你会想起图画上蛟龙的爪子。","anchor":"拉一把","meaning":"小圆片巴墙，细丝弯曲，嫩茎被拉近。","why":"它不靠一只脚挪着走，而是不断长出新的脚。","label":"第 4 段"},{"text":"爬山虎的脚要是没触着墙，不几天就萎了，后来连痕迹也没有了。触着墙的，细丝和小圆片逐渐变成灰色。不要瞧不起那些灰色的脚，那些脚巴在墙上相当牢固，要是你的手指不费一点儿劲，休想拉下爬山虎的一根茎。","anchor":"逐渐","meaning":"触墙的脚慢慢变灰，巴得很牢。","why":"没触墙的会萎掉。连续看，才能发现两种变化。","label":"第 5 段"}],"poem":false,"textSource":"家长本次提供的语文课本 P36–38；正文与已有录入核对一致。","extension":{"title":"资料袋 · 连续观察怎样记","source":"课本 P38 · 观察记录形式的学习说明","text":"可以用“图文结合”记录同一对象在不同日期的变化，也可以做表格，列出观察对象、时间、体长、颜色、进食情况。书中的银杏和蚕记录是示例，不能当成你自己的观察结果。","prompt":"旅行时选一个还能再次看到的对象。今天记真实细节，下次再看同一部位；没量过就不编数字。"},"media":{"kind":"photo","at":2,"src":"/assets/reader-art/ivy.webp","alt":"爬山虎枝条贴在墙面上，枝条旁能看到分叉的小脚。","caption":"沿着枝条找一找：哪些细小的分叉，正贴住墙面？这是已经长牢的脚。","credit":"Jules Verne Times Two / julesvernex2.com","license":"CC BY-SA 4.0","modified":"仅转为 WebP，未改动内容","licenseURL":"https://creativecommons.org/licenses/by-sa/4.0/","source":"https://commons.wikimedia.org/wiki/File:Japanese_ivy_(Parthenocissus_tricuspidata)_branches_clinging_to_a_wall,_Centro_Interpretativo_Gon%C3%A7alo_Ribeiro_Telles,_Lisbon,_Portugal_julesvernex2-2.jpg"}}},{"id":"cricket","title":"蟋蟀的住宅","date":null,"minutes":31,"bookPages":"P110–121","unit":3,"goal":"从住宅特点和修建过程读懂“伟大的工程”，辨别准确说明与拟人表达。","source":"金牌训练·同步教材 P110–121；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"住宅和施工，先认准这些词","body":"读一遍，圈出不熟的字。先看结构和意思，再回课文读通。","detail":["会写字：宅、毫、选、择、址、穴、厅、专、内、修、较、增","会认字：蟋 xī、蟀 shuài、慎 shèn、畅 chàng、掘 jué、倾 qīng、置 zhì、朴 pǔ、燥 zào","词语：住宅、毫不、选择、住址、洞穴、大厅、专家、柔弱、惊奇、内部、光滑、修理、清洁、较大、增长","毫不是豪；穴下为八；专的中间结构要认清。弹琴tán、弹弓dàn；踏实tā、踏步tà；钻研zuān、钻石zuàn。"],"id":"cricket-01","source":"P110–121","kicker":"按书细读","tutorial":[{"title":"先从两个问题读全文","text":"住宅什么样？又怎样修出来？先在讲读页看清这两条线。"},{"title":"读准住处与动作词","text":"住宅zhù zhái，洞穴dòng xué，慎重shèn zhòng，挖掘wā jué，干燥gān zào。"},{"title":"理解“不肯随遇而安”","text":"在本文中，它不满足于随便一个藏身处，而是挑选地方、亲自修建。下面找具体证据。"}]},{"type":"recall","phase":"recall","title":"把最不熟的字词再记一次","prompt":"先挑最多三个不熟的字词试着认读；有纸笔就遮住提示写一遍。记录自己要改的地方，没有纸笔可先记待写。","reference":"重新打开本课字词讲解，对照偏旁、部件和笔画。没有纸笔可以先练认读或打字，把纸笔默写留到酒店；这几种练习分开记录。","checklist":["我说明这次是认读、打字还是纸写","我对照材料核对了读音或字形","没做纸写就记待写，不算默写完成"],"id":"cricket-02","source":"P110–121","kicker":"遮住讲回"},{"type":"model","phase":"guided","title":"剖开住宅，看它怎样修","body":"依次查看选址、外部、内部和施工，再试着把坡地改成低洼地，比较排水条件。","model":"cricket","config":{},"id":"cricket-03","source":"P110–121","kicker":"跟着推演"},{"type":"recall","phase":"recall","title":"先用两方面介绍","prompt":"不看图，说课文从哪两方面讲住宅；为什么“工具简单”很重要？","reference":"住宅的特点、修建的过程。工具柔弱简单与完成的工程形成反差，是“伟大”的重要依据。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"cricket-04","source":"P110–121","kicker":"遮住讲回"},{"type":"teach","phase":"teach","title":"第1–4段：从出名引到住宅","body":"不光唱歌，还因住宅出名。与别的昆虫比较，先看选择的不同。","detail":["蟋蟀不肯随遇而安：慎重选住址，要求排水通畅、温和阳光，不利用现成洞穴，自己挖掘。工具的设问引出劳动成果让人惊奇。作者从童年兴趣写到持续研究。"],"id":"cricket-05","source":"P110–121","kicker":"按书细读","tutorial":[{"title":"老师示范解释“不肯随遇而安”","text":"先看词义：不随便满足于现成环境。再回第2段，找它究竟怎样选、怎样做。"},{"title":"挑直接证据","text":"要排水通畅、有温和阳光；不利用现成洞穴，而是自己一点点挖。这几处正好对应选择与行动。"},{"title":"连成有依据的回答","text":"它慎重选址，还亲自挖掘，不是找到临时藏身处就满足，所以文中说它不肯随遇而安。"}]},{"type":"choice","phase":"independent","title":"不肯随遇而安，证据在哪？","body":"哪条最能说明课文里的意思？","options":[{"id":"0","text":"任何现成洞穴都立刻住进去"},{"id":"1","text":"慎重选址，并亲自挖掘住宅"},{"id":"2","text":"它与蝉一样有名"}],"answer":"1","explanation":"这里强调对住址有要求、亲自建设，不是只用成语给它贴性格标签。","repair":{"gap":"先看题目要你比较什么。","reason":"这里强调对住址有要求、亲自建设，不是只用成语给它贴性格标签。","check":"回到原题，用这个依据再判断。"},"id":"cricket-06","source":"P110–121","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"第5–6段：外面到里面","body":"外部看位置、门和平台；内部看墙壁、干燥和清洁。","detail":["朝阳斜坡、弯曲隧道、出口草遮掩、门口平台；内部墙壁光滑，简朴清洁干燥。最多九寸深、一指宽是课文的观察描述，不等于每一个巢穴都完全相同。"],"id":"cricket-07","source":"P110–121","kicker":"按书细读","tutorial":[{"title":"按镜头移动介绍","text":"从外到内：斜坡和隧道，出口的草与平台，最后看内部墙壁和卫生。"},{"title":"特点后面接用途","text":"如隧道倾斜，联系排水；出口有草，联系隐蔽。不要只列形容词。"},{"title":"下一步你当讲解员","text":"选四个特点，按外到内讲，并解释其中一处的作用。文本讲读可随时对照。"}]},{"type":"open","phase":"independent","title":"当一次住宅讲解员","prompt":"按外部—内部介绍，至少讲四个特点，并说明一项特点有什么用。","reference":"例如向阳斜坡便于保持干燥和排水；出口草丛帮助隐蔽；内部光滑平整。用课文证据，不想象豪华家具。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"cricket-08","source":"P110–121","kicker":"课后题与常见考法","reading":{"title":"读懂《蟋蟀的住宅》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第5段 · 住宅外面","text":"住宅在向阳的斜坡，隧道倾斜、弯曲，便于雨后干燥。课文记录隧道最多九寸深、一指宽。出口一丛草半遮着，蟋蟀不吃这丛草；门口还有整理平坦的平台。安静时，它在平台上鸣叫，作者把这说成“弹琴”。"},{"label":"第6段 · 住宅里面","text":"里面没有很多布置，墙壁却被修得光滑平整，整体简朴、清洁、干燥。这样适用的住宅，只靠简单工具慢慢建成，正是作者赞叹“伟大的工程”的原因。"}]}},{"type":"teach","phase":"teach","title":"第7–9段：工具、动作、时间","body":"前足扒、大颚搬、后足踏、后腿推铺。主体建好，还要长时间整修。","detail":["课文写大多十月开始，累了短暂休息又继续；天气变冷、身体长大，洞穴加深加阔，温和冬日仍整修。连续细致观察才能看见这些变化。"],"id":"cricket-09","source":"P110–121","kicker":"按书细读","tutorial":[{"title":"工具与动作要配对","text":"前足扒土，大颚搬土块，后足踏地，后腿推土并铺开。把不同动作分给正确部位。"},{"title":"时间也是建造过程","text":"主体挖好后，还会长期加深加宽；温和的冬日也可能整修。不是一次挖完永远不变。"},{"title":"老师示范提取表格信息","text":"问施工时间，就找十月与冬日；问工具，就找身体部位；问过程，就区分初建与整修。先按题目分类，再整理。"}]},{"type":"order","phase":"independent","title":"抓修建过程","body":"按事情发生或方法使用的顺序，依次点选。","items":[{"id":"0","text":"选定合适位置"},{"id":"1","text":"用身体各部位挖掘、搬推泥土"},{"id":"2","text":"完成住宅重要部分"},{"id":"3","text":"随着天气和身体变化长时间整修"}],"answer":["0","1","2","3"],"explanation":"“完成重要部分”不等于再也不修；后续的整修不能遗漏。","repair":{"gap":"找出前一步给后一步带来的条件。","reason":"“完成重要部分”不等于再也不修；后续的整修不能遗漏。","check":"先放起点，再连起因果。"},"id":"cricket-10","source":"P110–121","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"为什么称为伟大的工程？","prompt":"同时从“结果”和“工具、劳动”两边解释。","reference":"住宅布局适用、清洁干燥；却只靠柔弱简单的身体工具，一点点挖并长期整修。两方面形成反差，不是因洞穴比人的房子大。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"cricket-11","source":"P110–121","kicker":"课后题与常见考法","reading":{"title":"读懂《蟋蟀的住宅》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第3—4段 · 工具与成果形成反差","text":"它有很厉害的施工工具吗？并没有，它只靠较柔弱的身体部位。这使劳动成果更让人惊奇。作者接着交代：小时候喜欢捉蟋蟀，现在则为了研究而寻找它们的巢穴。"},{"label":"第5段 · 住宅外面","text":"住宅在向阳的斜坡，隧道倾斜、弯曲，便于雨后干燥。课文记录隧道最多九寸深、一指宽。出口一丛草半遮着，蟋蟀不吃这丛草；门口还有整理平坦的平台。安静时，它在平台上鸣叫，作者把这说成“弹琴”。"},{"label":"第6段 · 住宅里面","text":"里面没有很多布置，墙壁却被修得光滑平整，整体简朴、清洁、干燥。这样适用的住宅，只靠简单工具慢慢建成，正是作者赞叹“伟大的工程”的原因。"},{"label":"第7段 · 各个部位怎样工作","text":"课文写蟋蟀多在十月、秋天初寒时开工。它用前足扒土，用大颚搬开较大的土块，用后足踏地，再借后腿上的两排锯把土向后推、斜着铺开。要把工具与各自的动作配对。"},{"label":"第8段 · 工作中也会短暂休息","text":"蟋蟀钻进土里干活，疲劳时到未完工的门口休息，过一会儿又进去。作者连续看了两个钟头：这说明他并非只看见一次动作就写下全部过程。"},{"label":"第9段 · 建好后还要继续整修","text":"主体接近完成后，它仍长期修整。随着天气变冷、身体长大，洞穴会加深加宽。即使到温和的冬日，作者还能看见它把泥土抛出。住宅与建造过程两条线，靠长时间观察连在一起。"}]},"responseSupport":[{"label":"先看成果","text":"这座住宅虽然……，却……","why":"把体积小与内部实用分清，不能用比人房子大解释伟大。"},{"label":"再看工具与劳动","text":"它只靠……，还要……","why":"回到简单工具与长期施工，让赞叹有具体依据。"}]},{"type":"teach","phase":"teach","title":"弹琴、住宅：拟人让文字有趣","body":"赋予人的称呼和动作，让观察说明更生动。事实本身仍要准确。","detail":["“弹琴”说鸣声，不是它拿着琴；“住宅、主人”把昆虫当人写。与课后客观介绍外形的说明文字比较：表达风格不同，都应有事实依据。"],"id":"cricket-12","source":"P110–121","kicker":"按书细读","tutorial":[{"title":"同一事实，两种说法","text":"客观说法：“蟋蟀在洞口发出鸣声。”文中用“平台上弹琴”，把它当人来写。"},{"title":"老师解释这种写法","text":"拟人让住处和活动亲切、有趣，也能读出作者的喜爱；并不是蟋蟀真的拿着乐器。"},{"title":"改写时什么不能变","text":"可改变表达方式，不改变观察事实。下一步由你把一句拟人句改成客观介绍。"}]},{"type":"choice","phase":"independent","title":"哪句侧重客观说明？","body":"把有趣表达与科学描述分开。","options":[{"id":"0","text":"主人在平台上弹琴"},{"id":"1","text":"住宅主人享受生活"},{"id":"2","text":"蟋蟀的触角较长，呈线状"}],"answer":"2","explanation":"第三句直接介绍形态，前两句赋予人的身份、动作或感受。","repair":{"gap":"先看题目要你比较什么。","reason":"第三句直接介绍形态，前两句赋予人的身份、动作或感受。","check":"回到原题，用这个依据再判断。"},"id":"cricket-13","source":"P110–121","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"换写法，不换事实","prompt":"把“蟋蟀在平台上弹琴”改成较客观的描述，再说原句的好处。","reference":"可写蟋蟀在洞口平台发出鸣声。原句用拟人使文字风趣、亲近；不能改成真的使用乐器。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"cricket-14","source":"P110–121","kicker":"课后题与常见考法"},{"type":"open","phase":"transfer","title":"把方法用在新观察","prompt":"选一个常见小动物的活动，写两句观察记录，再试写一句明确的拟人表达。","reference":"先分清实际看到的动作和自己的拟人想象；暂时没观察，就写观察计划，不能冒充已做。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"cricket-15","source":"P110–121","kicker":"换个情境"},{"id":"cricket-end","type":"teach","phase":"transfer","title":"留好这一课的接续点","body":"把这次能自己说明的一点留下，再记一处还需帮助的地方。现在可以保存并休息，下次从未完处接着学。","source":"P110–121","tutorial":[{"title":"这次的学习目标","text":"从住宅特点和修建过程读懂“伟大的工程”，辨别准确说明与拟人表达。"},{"title":"完成与学会分开","text":"看过讲解、跟着完成、自己能说、隔天还能说，是不同情况。只记录这次真实做到了哪一步。"}]}],"reading":{"title":"读懂《蟋蟀的住宅》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第1段 · 出名的不只是鸣叫","text":"蟋蟀让人熟悉，不光因为会鸣叫，还因为它的巢穴。作者用“住宅”称呼巢穴，把读者的注意力引到这间小小的住处。"},{"label":"第2段 · 精心选址，自己挖掘","text":"别的昆虫常用临时藏身处，蟋蟀却谨慎挑选：排水要通畅，还要有温和的阳光。它不直接住进现成洞穴，而是自己一点点挖。文中“不肯随遇而安”，具体就表现在这些选择与做法中。"},{"label":"第3—4段 · 工具与成果形成反差","text":"它有很厉害的施工工具吗？并没有，它只靠较柔弱的身体部位。这使劳动成果更让人惊奇。作者接着交代：小时候喜欢捉蟋蟀，现在则为了研究而寻找它们的巢穴。"},{"label":"第5段 · 住宅外面","text":"住宅在向阳的斜坡，隧道倾斜、弯曲，便于雨后干燥。课文记录隧道最多九寸深、一指宽。出口一丛草半遮着，蟋蟀不吃这丛草；门口还有整理平坦的平台。安静时，它在平台上鸣叫，作者把这说成“弹琴”。"},{"label":"第6段 · 住宅里面","text":"里面没有很多布置，墙壁却被修得光滑平整，整体简朴、清洁、干燥。这样适用的住宅，只靠简单工具慢慢建成，正是作者赞叹“伟大的工程”的原因。"},{"label":"第7段 · 各个部位怎样工作","text":"课文写蟋蟀多在十月、秋天初寒时开工。它用前足扒土，用大颚搬开较大的土块，用后足踏地，再借后腿上的两排锯把土向后推、斜着铺开。要把工具与各自的动作配对。"},{"label":"第8段 · 工作中也会短暂休息","text":"蟋蟀钻进土里干活，疲劳时到未完工的门口休息，过一会儿又进去。作者连续看了两个钟头：这说明他并非只看见一次动作就写下全部过程。"},{"label":"第9段 · 建好后还要继续整修","text":"主体接近完成后，它仍长期修整。随着天气变冷、身体长大，洞穴会加深加宽。即使到温和的冬日，作者还能看见它把泥土抛出。住宅与建造过程两条线，靠长时间观察连在一起。"}]},"segments":[{"id":"cricket-house","title":"看懂住宅特点","startStepId":"cricket-01","endStepId":"cricket-08","minutes":17,"goal":"按外到内介绍特点与用途","scene":"hotel","check":"不看讲解说四个特点，并解释一处用途。"},{"id":"cricket-build","title":"理解施工与伟大的工程","startStepId":"cricket-09","endStepId":"cricket-end","minutes":14,"goal":"把工具、劳动与成果结合起来解释","scene":"train","check":"说清简单工具与适用住宅的反差，解释作者的赞叹。"}],"reader":{"author":"［法］法布尔　王大文译","pages":"P116–119","core":"工具那么简单，却造出合用的住宅，所以令人惊奇。","hook":"小小的洞，为什么叫“伟大的工程”？","notes":[{"anchor":"还由于它的住宅","meaning":"作者要带你参观蟋蟀的家。","why":"称作“住宅”，像在介绍一位小邻居。"},{"anchor":"不肯随遇而安","meaning":"它会认真选地方，还自己挖。","why":"不是随便找到一个洞就住进去。"},{"anchor":"工具是那样柔弱","meaning":"它没有坚硬厉害的施工工具。","why":"先记住工具简单，后面再看它造出了什么。"},{"anchor":"为了研究","meaning":"作者从喜欢捉，变成认真研究。","why":"接下来看的，是他观察到的住宅。"},{"anchor":"倾斜的隧道","meaning":"向阳斜坡、草门和平坦平台，各有特点。","why":"顺着外面走一圈，你就能介绍它的家。"},{"anchor":"伟大的工程","meaning":"里面平整、清洁、干燥。","why":"用简单工具做成这样，作者才会赞叹。"},{"anchor":"扒土","meaning":"前足扒、大颚搬、后足踏和推。","why":"动作写得具体，你几乎能看到它施工。"},{"anchor":"两个钟头","meaning":"作者看了很久，才写出干活和休息。","why":"这就是耐心细看的证据。"},{"anchor":"今天做一点儿","meaning":"住宅还会继续加深、加宽。","why":"隔些日子接着看，才知道它一直在整修。"}],"tests":[{"q":"当一次小导游，介绍住宅外面和里面各两个特点。","ref":"外面如向阳、倾斜、隐蔽、有平台；里面如光滑、平整、清洁、干燥。","back":4,"modelAnswer":"请看，住宅建在向阳的斜坡上，洞口很隐蔽，外面还有平坦的平台。再看里面，墙壁光滑，地面平整，整个洞穴清洁、干燥。这是蟋蟀一点一点挖出来、不断整修的家。","answerKind":"小导游示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"为什么小小的住宅是“伟大的工程”？","ref":"因为蟋蟀用简单柔弱的身体部位，自己一点点造出合用的住宅。要把工具和成果放在一起看。","back":5,"modelAnswer":"蟋蟀没有强有力的挖掘工具，只靠柔弱的足和大颚，就能一点一点建成光滑、平整、清洁、干燥的住宅。把简单的工具和这样合用的成果相比，就能理解作者为什么称它为“伟大的工程”。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"“蟋蟀在平台上弹琴”能当作科学记录原样写吗？说说你的理由。","ref":"文学表达把鸣声写成弹琴，读起来有趣；科学记录要写实际怎样发声，不能以为它真的有琴。","back":4,"modelAnswer":"不能原样作为科学记录。“弹琴”是拟人的文学说法，把蟋蟀的鸣叫写得像人的活动，生动又有趣。科学记录应写实际观察到的发声现象；如果还没看清它怎样发声，就注明待观察，不能当作它真的在弹一把琴。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"kind":"article","paragraphs":[{"text":"居住在草地上的蟋蟀，差不多和蝉一样有名。它的出名不光由于它的唱歌，还由于它的住宅。","anchor":"还由于它的住宅","meaning":"作者要带你参观蟋蟀的家。","why":"称作“住宅”，像在介绍一位小邻居。","label":"第 1 段"},{"text":"别的昆虫大多在临时的隐蔽所藏身。它们的隐蔽所得来不费功夫，弃去毫不可惜。蟋蟀和它们不同，不肯随遇而安。它常常慎重地选择住址，一定要排水通畅，并且有温和的阳光。它不利用现成的洞穴。它的舒服的住宅是自己一点儿一点儿挖掘的，从大厅一直到卧室。","anchor":"不肯随遇而安","meaning":"它会认真选地方，还自己挖。","why":"不是随便找到一个洞就住进去。","label":"第 2 段"},{"text":"蟋蟀怎么会有建筑住宅的才能呢？它有特别好的工具吗？没有。蟋蟀并不是挖掘技术的专家，它的工具是那样柔弱，所以人们对它的劳动成果感到惊奇。","anchor":"工具是那样柔弱","meaning":"它没有坚硬厉害的施工工具。","why":"先记住工具简单，后面再看它造出了什么。","label":"第 3 段"},{"text":"在儿童时代，我到草地上去捉蟋蟀，把它们养在笼子里，用菜叶喂它们。现在为了研究蟋蟀，我又搜索起它们的巢穴来。","anchor":"为了研究","meaning":"作者从喜欢捉，变成认真研究。","why":"接下来看的，是他观察到的住宅。","label":"第 4 段"},{"text":"在朝着阳光的斜坡上，青草丛中隐藏着一条倾斜的隧道，即使有骤雨，这里也立刻就会干的。隧道顺着地势弯弯曲曲，最多九寸深，一指宽，这便是蟋蟀的住宅。出口的地方总有一丛草半掩着，就像一座门。蟋蟀出来吃周围的嫩草，绝不去碰这一丛草。那微斜的门口，经过仔细耙扫，收拾得很平坦。这就是蟋蟀的平台。当四周很安静的时候，蟋蟀就在这平台上弹琴。","anchor":"倾斜的隧道","meaning":"向阳斜坡、草门和平坦平台，各有特点。","why":"顺着外面走一圈，你就能介绍它的家。","label":"第 5 段"},{"text":"屋子的内部没什么布置，但是墙壁很光滑。主人有的是时间，把粗糙的地方修理平整。大体上讲，住所是很简朴的，清洁、干燥，很卫生。假使我们想到蟋蟀用来挖掘的工具是那样简单，这座住宅真可以算是伟大的工程了。","anchor":"伟大的工程","meaning":"里面平整、清洁、干燥。","why":"用简单工具做成这样，作者才会赞叹。","label":"第 6 段"},{"text":"蟋蟀盖房子大多是在十月，秋天初寒的时候。它用前足扒土，还用钳子似的大颚搬掉较大的土块。它用强有力的后足踏地。后腿上有两排锯，用它们将泥土推到后面，倾斜地铺开。","anchor":"扒土","meaning":"前足扒、大颚搬、后足踏和推。","why":"动作写得具体，你几乎能看到它施工。","label":"第 7 段"},{"text":"工作做得很快。蟋蟀钻到土底下干活，如果感到疲劳，它就在未完工的家门口休息一会儿，头朝着外面，触须轻微地摆动。不大一会儿，它又进去继续工作。我一连看了两个钟头，看得有些不耐烦了。","anchor":"两个钟头","meaning":"作者看了很久，才写出干活和休息。","why":"这就是耐心细看的证据。","label":"第 8 段"},{"text":"住宅的重要部分快完成了。洞已经挖了有两寸深，够宽敞的了。余下的是长时间的整修，今天做一点儿，明天做一点儿。这个洞可以随天气的变冷和它身体的增长而加深加阔。即使在冬天，只要天气温和，太阳晒到它住宅的门口，还可以看见蟋蟀从里面不断地抛出泥土来。","anchor":"今天做一点儿","meaning":"住宅还会继续加深、加宽。","why":"隔些日子接着看，才知道它一直在整修。","label":"第 9 段"}],"poem":false,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P116–119；按该书课文录入，省去注音与教参批注。","media":{"kind":"photo","at":4,"src":"/assets/reader-art/cricket.webp","alt":"一只尚未成年的田野蟋蟀停在泥土中的洞口旁。","caption":"先找到洞口，再看看它的腿。这样的小身体，是怎样一点点挖出房子的？","credit":"GeXeS","license":"CC BY-SA 4.0","modified":"仅转为 WebP，未改动内容","licenseURL":"https://creativecommons.org/licenses/by-sa/4.0/","source":"https://commons.wikimedia.org/wiki/File:Cvr%C4%8Dek_u_nory.jpg"}}},{"id":"eye-discussion","title":"口语交际：爱护眼睛，保护视力","date":null,"minutes":12,"bookPages":"P122","unit":3,"goal":"先听清别人的观点，再补充自己的理由，合起来形成清楚的建议。","source":"金牌训练·同步教材 P122；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"这次练“讨论”","body":"先了解问题，再轮流发言。回应前，先说明你听懂了哪一点。","detail":["本课练听与说，不用软件诊断同学的视力。可以讨论已知的学习习惯；没有真实调查的数据不要编成“全班统计”。"],"id":"eye-discussion-01","source":"P122","kicker":"按书细读","tutorial":[{"title":"这次重点是怎样接别人的话","text":"先听对方说了什么，复述核心意思，再加一条新的信息或办法。"},{"title":"看一次简短示范","text":"同伴说：“我常忘记停下来。”回应：“你担心看得太久。我补充：开始前先约好何时停。”"},{"title":"现在准备你的一条观察","text":"先用真实见过的学习习惯，练完整一句话。不用编全班统计。"}]},{"type":"open","phase":"guided","title":"准备一条观察","prompt":"说一件你真正观察到的学习习惯，再写一个想向老师了解的问题。","reference":"区分事实、猜想和问题。不要仅凭戴不戴眼镜判断一个人的视力情况。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"eye-discussion-02","source":"P122","kicker":"跟着推演"},{"type":"choice","phase":"independent","title":"怎样回应同伴？","body":"同伴说：“我建议学习中安排休息。”你怎么接？","options":[{"id":"0","text":"不听，马上重复一遍同样的话"},{"id":"1","text":"先说我听到你建议安排休息，再补充怎样一起做到"},{"id":"2","text":"用更大声音盖过别人"}],"answer":"1","explanation":"先回应已听到的意思，再补充有用内容；音量适中，不无故重复。","repair":{"gap":"先看题目要你比较什么。","reason":"先回应已听到的意思，再补充有用内容；音量适中，不无故重复。","check":"回到原题，用这个依据再判断。"},"id":"eye-discussion-03","source":"P122","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"建议说清三件事","body":"做什么、怎样做、为什么。暂时不确定的健康问题，留给家长和专业人士核实。","detail":["原书的交际范例用于学习组织建议。不要把未经核实的用药建议照搬成行动；这里不设置用药任务。"],"id":"eye-discussion-04","source":"P122","kicker":"按书细读","tutorial":[{"title":"把“注意一点”说具体","text":"模糊建议只有“要注意”。具体建议需要说明做什么、怎样安排、为什么这样做。"},{"title":"先回应，再补充","text":"可以说“你希望……，我听懂了。我补充……”；后面要真增加一点内容，不能只是换词重复。"},{"title":"意见未一致时怎么办","text":"说出双方共同希望解决的事，再各解释一个理由。暂时不确定的健康结论记下请教。"}]},{"type":"open","phase":"independent","title":"实际讨论一小段","prompt":"排练同伴说：“我希望赶快学完，这样可以出去玩。”先准确复述他的愿望，再提出一个能兼顾学习和出游的具体安排。真实讨论时，改记对方原意与自己的补充，并注明是哪一种。","reference":"先接住对方想节省时间的愿望，再提出具体的学习与休息安排。使用屏幕示范是排练；与真人交流后才记录真实对方观点，不把排练当课堂调查完成。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"eye-discussion-05","source":"P122","kicker":"课后题与常见考法","body":"有人在身边，就真实轮流讨论；暂时没有同伴，先用下面这句作排练。","responseSupport":[{"label":"先让对方知道你听懂了","text":"你希望……，我听懂了。","why":"准确复述，不加嘲讽，也不把自己的猜测写成对方原话。"},{"label":"再加具体做法","text":"我想补充一个办法：……","why":"要能实行，并说明怎样兼顾双方关心的事。"}]},{"type":"recall","phase":"recall","title":"不看提纲说建议","prompt":"若刚才是真实讨论，说出商量后的一条建议；若是独自排练，就说你准备提出的建议。都要讲清执行办法和理由，并说明是哪一种。","reference":"真实讨论说明建议来自哪些观点；独自排练只记录自己的方案，不能说小组已经同意。还需请教的地方留下，不使用编造的调查数字。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"eye-discussion-06","source":"P122","kicker":"遮住讲回"},{"type":"open","phase":"transfer","title":"旅行中也会讨论","prompt":"两人对一天的安排意见不同。你怎样先复述对方的理由，再提出补充？","reference":"准确复述而不讽刺，提出与共同目标有关的办法，确认对方是否被听懂。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"eye-discussion-07","source":"P122","kicker":"换个情境"},{"id":"eye-discussion-end","type":"teach","phase":"transfer","title":"留好这一课的接续点","body":"把这次能自己说明的一点留下，再记一处还需帮助的地方。现在可以保存并休息，下次从未完处接着学。","source":"P122","tutorial":[{"title":"这次的学习目标","text":"先听清别人的观点，再补充自己的理由，合起来形成清楚的建议。"},{"title":"完成与学会分开","text":"看过讲解、跟着完成、自己能说、隔天还能说，是不同情况。只记录这次真实做到了哪一步。"}]}],"reading":{"title":"读懂《口语交际：爱护眼睛，保护视力》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"任务 · 一起讨论，而不是轮流背稿","text":"书上的活动先了解同学情况，再讨论影响因素与建议，最后向班级汇报。旅行时可以先练讨论方法，回校再补真实班级调查，不用猜测数字。"},{"label":"一轮示范 · 先接住，再补充","text":"虚构练习：小宁说“我有时一看书就忘了休息”。小禾回答“你担心的是连续看太久，我听懂了。我补一个办法：开始前先约好停下活动的时间。”第二个人接着第一个人的意思往前说，没有原样重复一遍。"},{"label":"讲清建议 · 行动、做法、理由","text":"先说想改善什么，再说明具体怎么做，最后解释为什么这样安排。健康结论不确定时，把它记成要请教的问题；本课练有依据的表达，不用同伴发言代替医疗判断。"},{"label":"结束讨论 · 留下一条共同决定","text":"轮流说，声音让对方听清；别人说过的内容可以表示赞同，再加新信息。最后复述双方认可的一条办法，确认没有误解。没有同伴时先独自排练，等真实交流后再补双方意见。"}]},"segments":[{"id":"eye-talk","title":"练一次能接话的讨论","startStepId":"eye-discussion-01","endStepId":"eye-discussion-end","minutes":12,"goal":"先准确回应，再提出具体补充","scene":"train","check":"说清对方的观点与自己的新增建议；排练和实际讨论分别记。"}],"reader":{"kind":"guide","core":"先听懂别人的想法，再补一条。","hook":"怎样讨论，才不是每个人都重说一遍？","author":"读写小练习","pages":"P122","textSource":"依据家长所供教辅的本课要求编写；以下是原创学习指引，不是课文原文。","paragraphs":[{"label":"听清他说什么","text":"同学说：“我一看书就忘了休息。”先用一句话说出他的意思。","anchor":"","meaning":"听清他说什么","why":"听懂后再回应。"},{"label":"接着补充","text":"可以说：“我也会这样。我补一个办法：开始前约好停下活动的时间。”","anchor":"","meaning":"接着补充","why":"补新办法，不原样重复。"},{"label":"留一个问题","text":"不能确定的护眼说法，记下来请教老师或医生。不要用猜的数字代替调查。","anchor":"","meaning":"留一个问题","why":"讨论要有依据。"}],"tests":[{"q":"说一件你真正观察到的学习习惯，再写一个想向老师了解的问题。","ref":"区分事实、猜想和问题。不要仅凭戴不戴眼镜判断一个人的视力情况。","back":0,"modelAnswer":"观察记录：我写字时，有时会越写越靠近本子，直到抬头才发现。\n想问老师的问题：写字时怎样提醒自己保持合适的坐姿和距离？\n这只是记录格式示例；我会换成自己真正观察到的习惯。","answerKind":"写法示例","answerNote":"这是虚构的写法示例。写自己的经历时，请换成真实的人和事。"},{"q":"排练同伴说：“我希望赶快学完，这样可以出去玩。”先准确复述他的愿望，再提出一个能兼顾学习和出游的具体安排。真实讨论时，改记对方原意与自己的补充，并注明是哪一种。","ref":"先接住对方想节省时间的愿望，再提出具体的学习与休息安排。使用屏幕示范是排练；与真人交流后才记录真实对方观点，不把排练当课堂调查完成。","back":0,"modelAnswer":"排练：你想早点完成学习，好有时间出去玩。我也想出去。我们先把这一小段认真做完，核对一下，再一起出去；如果还有没做完的，就先记住位置，按约好的时间接着做，好吗？","answerKind":"讨论排练示例","answerNote":"这是排练，不表示已经和同伴商量过。真实讨论后，按对方的回应调整。"},{"q":"两人对一天的安排意见不同。你怎样先复述对方的理由，再提出补充？","ref":"准确复述而不讽刺，提出与共同目标有关的办法，确认对方是否被听懂。","back":0,"modelAnswer":"我会先说：“你想先去公园，因为担心晚一点人会多，对吗？”确认自己听懂后，再补充：“我想先完成这段学习，免得回来太累。我们能不能先约定出门时间，我在这之前做完这一小段？”","answerKind":"讨论示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"media":null}},{"id":"observation-diary","title":"习作：写观察日记","date":null,"minutes":23,"bookPages":"P123","unit":3,"goal":"固定一个对象，连续观察，把日期、实际变化和自己的想法写清楚。","source":"金牌训练·同步教材 P123；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"先知道这次写什么","body":"固定一个对象，连续观察，把日期、实际变化和自己的想法写清楚。","detail":["先选对象→确定观察部位→多次记录→比较变化→整理成日记。","原书香菇日记按日期比较芽、帽子大小、花纹等变化，值得学的是观察和组织方式，不能复制为自己的种植经历。"],"id":"observation-diary-01","source":"P123","kicker":"按书细读","tutorial":[{"title":"这次先确定一个对象","text":"选今天能看到、明天也能再看的东西。旅行中不断换地方，就选能随身带着或连续留意的同一对象。"},{"title":"第一次先写清现在","text":"先记日期、看哪一处、是什么样，不急着预测明天会长多少。"},{"title":"再看一次才谈变化","text":"下次仍看同一处，再把前后记录比较。没有变化也写，没有观察就留下待做。"}]},{"type":"choice","phase":"guided","title":"哪一条是真正的观察记录？","body":"虚构练习：今天第一次看一片叶，没有问过别人，也没浇过水。哪条可以作为这次看到的事实？","options":[{"id":"0","text":"它从昨天起一直在变黄，因为缺水。"},{"id":"1","text":"叶片大部分是绿色，边缘有一处黄色。"}],"answer":"1","explanation":"第二条写眼前颜色；第一条把没看过的昨天和未经证实的原因写成事实。第一次记录先写清现在，之后才有材料比较。","repair":{"gap":"今天只观察了一次。","reason":"没有昨天的记录，就不能证明从昨天开始变化；也不能只凭颜色确定原因。","check":"选只写眼前看见内容的记录。"},"id":"observation-diary-02","source":"P123","kicker":"跟着推演"},{"type":"open","phase":"guided","title":"先记自己的第一条观察","prompt":"写你准备观察的对象、今天日期、已看见的两处细节。未做观察就写计划，之后回来补。","reference":"今天实际看见什么就写什么；暂时没有对象，只记录准备看什么、何时看，等真的观察后再回来补。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"observation-diary-03","source":"P123","kicker":"跟着推演"},{"type":"teach","phase":"teach","title":"从一个点写清楚","body":"同一个部位前后比较，才能说变化。看见、猜想、听别人说的，要分开记录。","detail":["分清观察事实、个人猜想和待研究问题；这三类都可以记录，但不能互相冒充。","连续比较要固定对象、部位与记录条件。下次记录按真实时间补，不把想象的未来当作已经发生。"],"id":"observation-diary-04","source":"P123","kicker":"按书细读","tutorial":[{"title":"老师示范把“变了”写清","text":"虚构两次记录：上午冰块占杯底的一半，下午看不到冰块，只看见水。先把时间、同一对象和变化对应。"},{"title":"事实和猜想分开","text":"“冰块不见了”是观察；“可能与放置时间有关”是猜想。先写观察，再写想研究的问题。"},{"title":"选词先检查证据","text":"看见两次不同，可以用“与上次相比”；只看一眼，不能说“逐渐”。测量过，才写具体数值。"}]},{"type":"open","phase":"independent","title":"把今天的观察整理成一则日记","prompt":"写今天的观察日记：日期和实际天气；观察过程；看见的细节；和上次相比怎样；自己的疑问或心情。没有上次记录就注明首次。","reference":"真实日期、固定对象、具体细节；有前次记录才比较。未知或没变都能如实写，不能按参考预填未来变化。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"observation-diary-05","source":"P123","kicker":"课后题与常见考法","responseSupport":[{"label":"有前次记录时可用","text":"与上次相比，","why":"后面接同一对象同一部位的变化。首次观察就不选。"},{"label":"发现小变化时可用","text":"仔细看，","why":"后面必须补你真实看见的细节，不能只有这三个字。"},{"label":"提出疑问时可用","text":"我想知道，","why":"让猜想保持为问题，避免把没证实的原因写成事实。"}]},{"type":"recall","phase":"recall","title":"遮住提示，说出路线","prompt":"说出你的对象、第一次记录到的细节、下次还要看哪一处。先后观察的对象或部位不同，要怎样调整？","reference":"固定同一对象和部位，保留日期；下次比较实际变化。若对象换了，要明确另开记录，不能装作同一事物连续变化。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"observation-diary-06","source":"P123","kicker":"遮住讲回"},{"type":"choice","phase":"independent","title":"怎样把“变大了”改准确？","body":"虚构初稿：“它变大了，变得非常非常大。”你确实有同一朵香菇昨天和今天的记录，怎样修改更有用？","options":[{"id":"0","text":"改成“硕大无朋”，这样词更高级。"},{"id":"1","text":"说明变大的是菇帽，和昨天哪一处比较；有真实测量再补数值。"},{"id":"2","text":"编上明天会长多大，让过程更完整。"}],"answer":"1","explanation":"先确定同一对象和部位，再比较真实记录。准确的变化比夸张评价有用；没有测量的数字和未来情况都不能补成事实。","repair":{"gap":"“大”还没告诉别人哪里变了。","reason":"有前后记录，才能指出同一部位的变化。","check":"选择补具体比较，而不夸张或虚构的做法。"},"id":"observation-diary-07","source":"P123","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"整理自己的连续观察本","prompt":"回看你前面的观察。只有一次，就整理好这一则并留出下次日期；已有两次，就分别写清两次事实，再比较。可以纸笔整理，不虚填下一次内容。","reference":"完成一则，不等于已经完成连续观察。保留真实日期和细节，未来一栏留空；等再次观察后再补。","checklist":["中心或观察对象清楚","事情和细节能支撑中心","顺序完整，语句通顺","我标出了准备修改的一处"],"id":"observation-diary-08","source":"P123","kicker":"课后题与常见考法","collectFrom":["observation-diary-03","observation-diary-05","observation-diary-06"]},{"type":"open","phase":"independent","title":"给自己的稿子改一笔","prompt":"选一处重复、含糊或不合情理的地方，写出修改前后，并说为什么改。","reference":"检查修改是否补清观察对象、部位、真实时间或前后变化；删掉未经证实的原因与编造数值。保留原句与改句，说明自己为什么这样改。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"observation-diary-09","source":"P123","kicker":"课后题与常见考法","responseSupport":[{"label":"把笼统评价改成细节","text":"我原来写……，现在改成……","why":"比较改后是否指明部位、颜色、形状或动作，而非只增加字数。"},{"label":"没有证据的原因改成问题","text":"这会不会与……有关？","why":"把未经证实的原因放回猜想的位置，下次再验证。"}]},{"type":"open","phase":"transfer","title":"把方法带出去","prompt":"旅行里能连续观察什么？制定两次可执行的观察安排，并给下一次记录留空。","reference":"选旅途中能够再次接触的同一对象；写清两次可行时间和比较部位。下一次记录留空，真实观察后再补，不预写变化。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"observation-diary-10","source":"P123","kicker":"换个情境"},{"id":"observation-diary-end","type":"teach","phase":"transfer","title":"留好这一课的接续点","body":"把这次能自己说明的一点留下，再记一处还需帮助的地方。现在可以保存并休息，下次从未完处接着学。","source":"P123","tutorial":[{"title":"这次的学习目标","text":"固定一个对象，连续观察，把日期、实际变化和自己的想法写清楚。"},{"title":"完成与学会分开","text":"看过讲解、跟着完成、自己能说、隔天还能说，是不同情况。只记录这次真实做到了哪一步。"}]}],"reading":{"title":"读懂《习作：写观察日记》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"任务 · 记录一个对象的真实变化","text":"观察日记记录对象的变化，也能写观察过程、疑问与心情。一次记录是开始，隔一段时间看同一对象、同一部位，才有条件比较。没有变化也照实记录。"},{"label":"书上范文怎么组织 · 香菇的连续日记","text":"范文先写准备种香菇，再按不同日期写冒芽、帽子变大、花纹显现、最后采摘。它的价值在于每一天都能接着前一天比。具体日期和经历属于范文作者，不能改个名字就当成自己的观察。"},{"label":"观察时看什么 · 先固定部位","text":"例如一直看同一片叶，可以记录颜色、边缘和大小；看同一扇窗外的树，可以记录叶子在不同时间或风中怎样动。比较时说清条件，不能今天看大叶、明天看小叶，却说同一片叶缩小。"},{"label":"原创练笔示范 · 先事实，再猜想","text":"虚构记录：“昨天杯中的冰块还有一半，今天已经看不见冰块，杯里留下水。我想知道变化与放置时间有什么关系。”前句是记录，后句是问题。若没有亲自看见或测量，就不能写成自己的事实。"},{"label":"整理成日记 · 日期、细节、变化、想法","text":"写实际日期；说明这次看了哪里；把最明显的细节写具体；有上次记录再比较；最后写一个真实想法。图画可以帮你记录位置和形状，不必为了好看补没发生的情节。"},{"label":"修改方向 · 准确比热闹重要","text":"“长大了好多”很笼统。可以补大的是哪个部位、和什么相比；测量过才写数值。只有前后多次记录支持时才用“逐渐”，不能看了一眼就编出变化过程。"}]},"segments":[{"id":"observation-write","title":"整理一次观察，留下下次比较位","startStepId":"observation-diary-01","endStepId":"observation-diary-end","minutes":23,"goal":"用自己的真实记录写观察日记","scene":"hotel","check":"指出一条事实、一条猜想和下一次要比的同一部位。"}],"reader":{"kind":"guide","core":"同一个对象，隔些时候再看，记下真实变化。","hook":"今天的小叶子，明天会怎样？","author":"读写小练习","pages":"P123","textSource":"依据家长所供教辅的本课要求编写；以下是原创学习指引，不是课文原文。","paragraphs":[{"label":"选一个能继续看的对象","text":"例如同一盆植物的同一片叶。写下今天日期，记颜色、大小或边缘。","anchor":"","meaning":"选一个能继续看的对象","why":"不要今天看一片，明天换另一片比。"},{"label":"把看见和猜想分开","text":"“叶边有黄点”是看见的；“可能缺水”是猜想。没有量过，别编长度。","anchor":"","meaning":"把看见和猜想分开","why":"先写事实，再写自己的疑问。"},{"label":"下次接着看","text":"仍看同一部位，比较上次的记录。变了什么？没有变化也可以写。","anchor":"","meaning":"下次接着看","why":"连续记录，才能看出过程。"},{"label":"写成一小段","text":"先写日期和对象，再写最明显的变化，最后写感受或想知道的事。","anchor":"","meaning":"写成一小段","why":"还没观察，就先留下计划，之后回来补。"}],"tests":[{"q":"写你准备观察的对象、今天日期、已看见的两处细节。未做观察就写计划，之后回来补。","ref":"今天实际看见什么就写什么；暂时没有对象，只记录准备看什么、何时看，等真的观察后再回来补。","back":0,"modelAnswer":"对象：窗台上一盆绿萝的同一片叶。\n日期：9月17日（示例日期）。\n细节一：叶片大部分是绿色，边缘有一小处发黄。\n细节二：叶尖向下垂。\n如果今天还没观察，我会先写计划：“今晚看同一片叶，记录颜色和叶尖的样子。”","answerKind":"写法示例","answerNote":"这是虚构的写法示例。写自己的经历时，请换成真实的人和事。"},{"q":"写今天的观察日记：日期和实际天气；观察过程；看见的细节；和上次相比怎样；自己的疑问或心情。没有上次记录就注明首次。","ref":"真实日期、固定对象、具体细节；有前次记录才比较。未知或没变都能如实写，不能按参考预填未来变化。","back":0,"modelAnswer":"9月17日　阴（日期、天气和观察均为虚构示例）\n今天我第一次观察窗台上这盆绿萝的一片叶。叶片大部分是绿色，右侧边缘有一小处发黄，叶尖向下垂。因为这是第一次记录，我还不能判断它是刚变黄，还是原来就这样。我想知道：过两天，这处黄色会不会扩大？","answerKind":"写法示例","answerNote":"这是虚构的写法示例。写自己的经历时，请换成真实的人和事。"},{"q":"旅行里能连续观察什么？制定两次可执行的观察安排，并给下一次记录留空。","ref":"选旅途中能够再次接触的同一对象；写清两次可行时间和比较部位。下一次记录留空，真实观察后再补，不预写变化。","back":0,"modelAnswer":"我选住处窗边同一盆植物的一片叶。今天傍晚观察它的颜色和边缘，记下时间；明天早晨再看同一片叶，与第一次的记录比较。\n第一次记录：观察后填写。\n第二次记录：留空，等明天实际观察后再写。","answerKind":"观察计划示例","answerNote":"计划可以先写，观察结果必须等真正看过再填。"}],"media":null}},{"id":"e-unit3-garden","title":"语文园地三与单元回看","date":null,"minutes":24,"bookPages":"P124–128","unit":3,"goal":"把连续观察、准确用词和生动表达连起来；积累动物住处与秋季谚语。","source":"金牌训练·同步教材 P124–128；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"观察后，怎样留下证据","body":"有耐心，多次看，同一处作比较，边看边记。眼前没变化也可以记录。","detail":["视觉、听觉等方法按对象选择；固定对象与比较尺度，记录日期。图或表可帮助整理，不能拿没有发生的变化充数。"],"id":"e-unit3-garden-01","source":"P124–128","kicker":"按书细读","tutorial":[{"title":"先区分细致与连续","text":"看清一个部位的形状、颜色，是细致；隔些时间继续看同一对象，是连续。两者可以结合。"},{"title":"老师示范回查记录","text":"“今天边缘有一处发黄”是观察；“也许缺水”是猜想；“明天是否扩大”是要继续看的问题。"},{"title":"下一步用自己的记录分一分","text":"没有实际观察本，就先在课堂示范上练分类，再把自己的真实观察留到下次补。"}]},{"type":"open","phase":"guided","title":"回看自己的记录","prompt":"从自己的观察记录找一条事实、一条猜想和一个问题。若尚无记录，就用示范“叶缘发黄／也许缺水／明天是否扩大”分类，并写明是课堂练习。","reference":"“今天叶片长2厘米”需有真实测量；“它可能缺水”是推测；“明天颜色是否变化”是问题。没有数据就不要凭想象填数。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"e-unit3-garden-02","source":"P124–128","kicker":"跟着推演","body":"可用你自己的观察；还没开始观察，也能先用本页示范练方法。"},{"type":"teach","phase":"teach","title":"动物的家，叫法有区别","body":"结合常用搭配识记，不把每个字都当成只能配一个动物。","detail":["狗窝；鼠洞、鼠穴、鼠窝；猪圈；马厩jiù、马棚；鱼塘；牛棚、牛圈；虎穴、虎洞。鸟窝和鸟巢常可通用。"],"id":"e-unit3-garden-03","source":"P124–128","kicker":"按书细读","tutorial":[{"title":"把词放回动物","text":"马厩jiù，猪圈，鱼塘，牛棚，虎穴。先读动物和住处的完整搭配。"},{"title":"同一动物不一定只有一名","text":"马厩、马棚都可用；鼠洞、鼠穴也常见。连线练的是常用叫法，不是排除所有别名。"},{"title":"生字用意思帮助记","text":"厩常说养马处，圈在猪圈里读juàn。联系意思再读，不只背一串孤字。"}]},{"type":"choice","phase":"independent","title":"选常见搭配","body":"马的住处常可以叫作什么？","options":[{"id":"0","text":"马厩"},{"id":"1","text":"马塘"},{"id":"2","text":"马蜂窝"}],"answer":"0","explanation":"厩是养马等牲畜的棚舍；不同住处的名字要结合实际对象。","repair":{"gap":"先看题目要你比较什么。","reason":"厩是养马等牲畜的棚舍；不同住处的名字要结合实际对象。","check":"回到原题，用这个依据再判断。"},"id":"e-unit3-garden-04","source":"P124–128","kicker":"课后题与常见考法"},{"type":"model","phase":"guided","title":"两个词，保留两种准确","body":"删掉再放回“逐渐”和“最多”，比较过程和范围。","model":"precision","config":{"pairs":[{"word":"逐渐","withText":"细丝和小圆片逐渐变成灰色。","without":"细丝和小圆片变成灰色。","why":"逐渐说明变化慢慢发生，保留连续观察到的过程。"},{"word":"最多","withText":"隧道最多九寸深。","without":"隧道九寸深。","why":"最多限定上限；删去容易把不同洞穴都说成一个精确深度。"}]},"id":"e-unit3-garden-05","source":"P124–128","kicker":"跟着推演"},{"type":"recall","phase":"recall","title":"自己解释删词题","prompt":"从刚才选一个词，按“词义—原句意思—删后差别”讲一遍。","reference":"逐渐保留缓慢过程；最多保留上限。不能只答“更准确、更生动”而不说哪里改变。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"e-unit3-garden-06","source":"P124–128","kicker":"遮住讲回"},{"type":"teach","phase":"teach","title":"积累秋季谚语","body":"读懂经验里的意思，再背。谚语有地域和气候条件，不是精确预报。","detail":["立了秋，把扇丢。二八月，乱穿衣。夏雨少，秋霜早。","八月里来雁门开，雁儿脚上带霜来。一场秋雨一场寒，十场秋雨要穿棉。八月暖，九月温，十月还有小阳春。","二八月指农历二月、八月；十场是虚指多场；小阳春形容秋冬间暖和如春的一段天气。用衣着需看当地实际天气。"],"id":"e-unit3-garden-07","source":"P124–128","kicker":"按书细读","tutorial":[{"title":"把六句先分画面","text":"前三句记转凉、衣着、雨霜；后三句记大雁、秋雨、小阳春。先懂，再背。"},{"title":"老师示范解释“乱穿衣”","text":"农历二八月冷暖多变，大家穿衣厚薄不同，所以叫乱穿衣。不是说人们故意穿错。"},{"title":"再分清经验与预报","text":"十场泛指多场，小阳春指一段暖和天气。实际冷暖仍看当地情况，不能死等谚语中的数。"}]},{"type":"choice","phase":"independent","title":"“十场秋雨”怎么理解？","body":"这句谚语中的十场，最合适的理解是？","options":[{"id":"0","text":"任何地方第十场雨后必须穿棉衣"},{"id":"1","text":"虚指多场，形容秋雨后转凉的经验"},{"id":"2","text":"准确的全球气温公式"}],"answer":"1","explanation":"谚语概括生活经验，不能把虚数和地域经验改成严格普遍规则。","repair":{"gap":"先看题目要你比较什么。","reason":"谚语概括生活经验，不能把虚数和地域经验改成严格普遍规则。","check":"回到原题，用这个依据再判断。"},"id":"e-unit3-garden-08","source":"P124–128","kicker":"课后题与常见考法"},{"type":"recall","phase":"recall","title":"背后说意思","prompt":"选两条谚语，遮住后背，再用自己的话解释其中一个词。","reference":"背诵、词义、适用条件分开自查。解释“乱穿衣”是冷暖变化时衣着各异，不是讥笑别人。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"e-unit3-garden-09","source":"P124–128","kicker":"遮住讲回"},{"type":"open","phase":"independent","title":"单元独立检查","prompt":"不看提示回答：观察位置怎样影响所见？连续观察怎样看出变化？准确词怎样保留条件？","reference":"诗里换角度；爬山虎追踪颜色与脚；蟋蟀长期整修；逐渐/最多分别保留过程/范围。每条都选一个具体依据。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"e-unit3-garden-10","source":"P124–128","kicker":"课后题与常见考法"},{"type":"open","phase":"transfer","title":"新短文也能读","prompt":"读一句“有些叶片几天后逐渐发黄”，说明能不能改成“叶片发黄”，并写理由。","reference":"原句限定部分叶片、时间及渐变过程；改后丢掉这些条件。回答要指出具体丢了什么。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"e-unit3-garden-11","source":"P124–128","kicker":"换个情境"},{"id":"e-unit3-garden-end","type":"teach","phase":"transfer","title":"留好这一课的接续点","body":"把这次能自己说明的一点留下，再记一处还需帮助的地方。现在可以保存并休息，下次从未完处接着学。","source":"P124–128","tutorial":[{"title":"这次的学习目标","text":"把连续观察、准确用词和生动表达连起来；积累动物住处与秋季谚语。"},{"title":"完成与学会分开","text":"看过讲解、跟着完成、自己能说、隔天还能说，是不同情况。只记录这次真实做到了哪一步。"}]}],"reading":{"title":"读懂《语文园地三与单元回看》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"交流平台 · 观察要接得上","text":"细致观察是看清部位、形状、颜色、动作；连续观察是在不同时间继续看同一对象。把时间和细节记下来，才能比较。用眼、耳等方法要符合对象，不必每次凑齐所有感官。"},{"label":"词语 · 动物住处的常用叫法","text":"狗窝、鼠洞或鼠穴、猪圈、马厩或马棚、鱼塘、牛棚或牛圈、虎穴。一个动物可能有几种常用搭配，不能把连线题误记成永远只能一对一。“厩”读jiù，常指养马的地方。"},{"label":"词句 · 逐渐保留变化过程","text":"“细丝和小圆片逐渐变成灰色”写颜色一点点变化。“变成灰色”只交代结果，没有保留变色的过程。答删词题要说具体少了什么，不能只答“原句更准确”。"},{"label":"词句 · 最多保留数量范围","text":"“最多九寸深”表示深度不超过九寸，不要求每条隧道都刚好九寸。删去“最多”，读者容易理解成确定的九寸。比较词义、句意，再解释表达差别。"},{"label":"积累 · 前三条秋季谚语","text":"立了秋，把扇丢。二八月，乱穿衣。夏雨少，秋霜早。前一句描写转凉的生活经验；二八月指农历二月、八月，衣着各异与冷暖变化有关；第三句是人们对雨水和霜的经验联系。"},{"label":"积累 · 后三条秋季谚语","text":"八月里来雁门开，雁儿脚上带霜来。一场秋雨一场寒，十场秋雨要穿棉。八月暖，九月温，十月还有小阳春。它们把雁、雨和冷暖联系起来。“十场”泛指多场，“小阳春”说一段暖和天气。"},{"label":"读懂后再背 · 不把经验当精确预报","text":"秋季谚语来自长期生活经验，有地域与天气条件。先按雁、雨、暖三个画面记后面三句，再合起来背。实际穿衣看当地天气，不必等够十场雨才加衣服。"}]},"segments":[{"id":"e-garden3-words","title":"观察方法与准确表达","startStepId":"e-unit3-garden-01","endStepId":"e-unit3-garden-06","minutes":13,"goal":"能说明逐渐与最多保留什么信息","scene":"hotel","check":"自选一个词，独立解释删前删后差别。"},{"id":"e-garden3-recall","title":"秋季谚语与单元回看","startStepId":"e-unit3-garden-07","endStepId":"e-unit3-garden-end","minutes":11,"goal":"懂意思地背谚语，用依据回看单元","scene":"train","check":"背两条谚语并解释，再讲一条连续观察的证据。"}],"reader":{"kind":"guide","core":"连续细看，才能把变化写准确。","hook":"怎样把一个小发现写清楚？","author":"读写小练习","pages":"P124–128","textSource":"依据家长所供教辅的本课要求编写；以下是原创学习指引，不是课文原文。","paragraphs":[{"label":"细看与连续看","text":"细看：看清颜色、形状和动作。连续看：隔一段时间，再看同一个对象。","anchor":"","meaning":"细看与连续看","why":"一个看细节，一个看变化。"},{"label":"体会“逐渐”","text":"“细丝和小圆片逐渐变成灰色。”如果去掉“逐渐”，就少了慢慢变化的过程。","anchor":"","meaning":"体会“逐渐”","why":"说词语作用，要说具体少了什么。"},{"label":"让动词排好队","text":"爬山虎：触、变、巴、拉、贴。蟋蟀：扒、搬、踏、推。按动作说，就能讲清过程。","anchor":"","meaning":"让动词排好队","why":"动词准确，画面就清楚。"},{"label":"回看观察日记","text":"找到一条真观察、一条猜想和一个问题。没做过的观察，就先约好下次什么时候看。","anchor":"","meaning":"回看观察日记","why":"不编经历，也能先学方法。"}],"tests":[{"q":"从自己的观察记录找一条事实、一条猜想和一个问题。若尚无记录，就用示范“叶缘发黄／也许缺水／明天是否扩大”分类，并写明是课堂练习。","ref":"“今天叶片长2厘米”需有真实测量；“它可能缺水”是推测；“明天颜色是否变化”是问题。没有数据就不要凭想象填数。","back":0,"modelAnswer":"课堂练习示例：\n事实：这片叶的边缘有一小块黄色。\n猜想：它也许缺水了，但现在还不能确定。\n问题：明天这块黄色会变大吗？\n第一句是能直接看到的，第二句需要查证，第三句决定下一次看什么。","answerKind":"事实、猜想与问题示例","answerNote":"这不是你的观察记录；有自己的记录时，请按真实情况替换。"},{"q":"从刚才选一个词，按“词义—原句意思—删后差别”讲一遍。","ref":"逐渐保留缓慢过程；最多保留上限。不能只答“更准确、更生动”而不说哪里改变。","back":0,"modelAnswer":"词义：“逐渐”表示慢慢地发生变化。\n原句：“细丝和小圆片逐渐变成灰色。”\n删词比较：删掉“逐渐”，只知道它们变成灰色，不知道这是一个慢慢变化的过程。这个词表现了作者连续、细致的观察。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"读一句“有些叶片几天后逐渐发黄”，说明能不能改成“叶片发黄”，并写理由。","ref":"原句限定部分叶片、时间及渐变过程；改后丢掉这些条件。回答要指出具体丢了什么。","back":0,"modelAnswer":"不能随便改。“有些”限定了范围，表示并非所有叶片；“几天后”说明观察到变化的时间；“逐渐”说明变化是慢慢发生的。改成“叶片发黄”，这些信息就都丢了，也可能让人误以为所有叶片都发黄。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"media":null}},{"id":"pangu","title":"盘古开天地","unit":4,"date":null,"minutes":25,"bookPages":"P48–49","goal":"按“劈开天地→撑住天地→化成万物”讲清过程，再用细节说人物。","source":"家长本次提供的语文课本 P48–49；正文按课本录入，讲解与参考写法为学习示例。","steps":[{"id":"pangu-model","type":"model","phase":"guided","model":"pangu","title":"把开天地的过程接起来","config":{},"source":"P48–49"}],"reader":{"kind":"article","pages":"P48–49","author":"古代神话 · 袁珂整理","core":"按“劈开天地→撑住天地→化成万物”讲清过程，再用细节说人物。","hook":"天地还挤在一起时，盘古做了什么？","textSource":"家长本次提供的语文课本 P48–49；正文按课本录入，讲解与参考写法为学习示例。","paragraphs":[{"text":"很久很久以前，天和地还没有分开，宇宙混沌一片，像个大鸡蛋。有个叫盘古的巨人，在混沌之中睡了一万八千年。","anchor":"混沌一片","meaning":"天地还没有分开，盘古在其中沉睡。","why":"像“大鸡蛋”的比喻，让看不见的混沌有了能想象的样子。神话用想象解释世界的起源。","label":"第 1 段"},{"text":"有一天，盘古醒来了，睁眼一看，周围黑乎乎一片，什么也看不见。他一使劲翻身坐了起来，只听咔嚓一声，“大鸡蛋”裂开了一条缝，一丝微光透了进来。巨人见身边有一把斧头，就拿起斧头，对着眼前的黑暗劈过去，只听见一声巨响，“大鸡蛋”碎了。轻而清的东西，缓缓上升，变成了天；重而浊的东西，慢慢下降，变成了地。","anchor":"轻而清","meaning":"盘古劈开“大鸡蛋”，天地分开了。","why":"轻对重、清对浊、上升对下降。两组相反的变化，把“分开”写得清楚。","label":"第 2 段"},{"text":"天和地分开后，盘古怕它们还会合在一起，就头顶天，脚踏地，站在天地当中，随着它们的变化而变化。天每天升高一丈，地每天加厚一丈，盘古的身体也跟着长高。","anchor":"头顶天，脚踏地","meaning":"他撑在天地之间，防止天地重新合拢。","why":"不是劈开就结束了。把“怕合拢”与“顶天踏地”连起来，就懂得为什么要撑。","label":"第 3 段"},{"text":"这样又过了一万八千年，天升得高极了，地变得厚极了。盘古这个巍峨的巨人就像一根柱子，撑在天和地之间，不让它们重新合拢。又不知过了多少年，天和地终于成形了，盘古也精疲力竭，累得倒下了。","anchor":"精疲力竭","meaning":"他坚持到天地成形，最后累倒了。","why":"“一万八千年”“又不知过了多少年”让人感到坚持之久。“终于”连着成果，“精疲力竭”连着付出。","label":"第 4 段"},{"text":"盘古倒下以后，他的身体发生了巨大的变化：他呼出的气息变成了四季的风和飘动的云；他发出的声音化作了隆隆的雷声；他的左眼变成了太阳，照耀大地，他的右眼变成了月亮，给夜晚带来光明；他的四肢和躯干变成了大地的四极和五方的名山；他的血液变成了奔流不息的江河；他的汗毛变成了茂盛的花草树木；他的汗水变成了滋润万物的雨露。……","anchor":"他的身体发生了巨大的变化","meaning":"盘古的身体化成了世间万物。","why":"抓住“身体的什么→变成什么”。气息与风、声音与雷之间有相似处，神奇想象也有联系。","label":"第 5 段"},{"text":"伟大的巨人盘古，用他的整个身体创造了美丽的世界。","anchor":"整个身体","meaning":"最后一句赞美盘古为世界付出全部。","why":"人物评价要回到前面的行动：劈开、撑住、化成万物。这样说“伟大”才有依据。","label":"第 6 段"}],"tests":[{"q":"按照故事的发展顺序，说说盘古开天地的过程。","ref":"劈开天地、顶天立地、化身万物，前后接清。","modelAnswer":"起初，天地混沌一片，盘古在其中沉睡。醒来后，他拿起斧头劈开“大鸡蛋”，轻而清的东西上升成天，重而浊的东西下降成地。为了不让天地合拢，他头顶天、脚踏地，坚持到天地成形。盘古累倒后，身体化作日月、山川、风云和花草树木，创造了美丽的世界。","back":1,"answerKind":"参考答案","answerNote":"意思完整、有课文依据即可，不必逐字相同。"},{"q":"选一处你觉得神奇的地方，想象画面，再说说你心目中的盘古。","ref":"先举神奇的具体画面，再用行动说明人物品质。","modelAnswer":"我觉得盘古顶天立地特别神奇：天每天升高，地每天加厚，他也跟着长高，像一根巨大的柱子撑住天地。在我心中，盘古勇敢、坚强，愿意为世界付出。他劈开黑暗，撑了极漫长的时间，最后还用整个身体化成万物。","back":2,"answerKind":"表达示例","answerNote":"意思完整、有课文依据即可，不必逐字相同。"},{"q":"“气息变成风和云，声音化作雷声”，这些想象有什么联系？你也试着补一句。","ref":"说出相似点；新编的想象标清楚。","modelAnswer":"气息会流动，与风和云相似；声音能被听见，与隆隆的雷声相连。这些变化不是随意拼在一起的，而是抓住了相似的特点。我补充的想象是：“他的发丝变成了随风摆动的柳条。”这句是我的想象，不是课文原句。","back":4,"answerKind":"表达示例","answerNote":"意思完整、有课文依据即可，不必逐字相同。"}],"extension":{"title":"课后再讲一个神话","text":"课本选做：搜集中国神话故事，读后讲给同学听。可以先说故事名字，再按起因、经过、结果讲，最后说明最神奇的一处。","source":"课本 P49 · 选做","prompt":"这是选做延伸，不要求这一轮再学完一个故事。"},"media":{"src":"/assets/reader-art/pangu.webp","alt":"盘古撑在天地之间，天空逐渐升高。","caption":"劈开以后，还要撑住。盘古为什么不能停下来？","credit":"AI 情境插画","kind":"story"}}},{"id":"prometheus","title":"普罗米修斯","unit":4,"date":null,"minutes":25,"bookPages":"P51–53","goal":"用“为何取火→受到什么惩罚→怎样获救”复述，再从言行看人物。","source":"家长本次提供的语文课本 P51–53；正文按课本录入，讲解与参考写法为学习示例。","steps":[{"id":"prometheus-model","type":"model","phase":"guided","model":"prometheus","title":"有火以前，有火以后","config":{},"source":"P51–53"}],"reader":{"kind":"article","pages":"P51–53","author":"古希腊神话","core":"用“为何取火→受到什么惩罚→怎样获救”复述，再从言行看人物。","hook":"为了让人们有火，他愿意付出什么？","textSource":"家长本次提供的语文课本 P51–53；正文按课本录入，讲解与参考写法为学习示例。","paragraphs":[{"text":"很久很久以前，地面上没有火，人们只好吃生的东西，在无边的黑暗中度过一个又一个长夜。就在这时候，有一位名叫普罗米修斯的天神来到了人间，看到人类没有火的悲惨情景，决心冒着危险，到天上去“盗”取火种。","anchor":"决心冒着危险","meaning":"看到人类生活悲惨，他决定冒险取火。","why":"先有“没有火”的困苦，才有取火的决定。这是故事的起因。","label":"第 1 段"},{"text":"有一天，当太阳车从天空驰过的时候，普罗米修斯跑到太阳车那里，从喷射着火焰的车轮上，拿了一颗火星，带到人间。自从有了火，人类就开始用它烧熟食物，驱寒取暖，并用火来驱赶危害人类安全的猛兽……","anchor":"自从有了火","meaning":"火给人类带来了熟食、温暖和安全。","why":"把有火前后放在一起看，就知道“为人类造福”指的是哪些具体变化。","label":"第 2 段"},{"text":"得知普罗米修斯从天上取走火种的消息，众神的领袖宙斯气急败坏，决定给普罗米修斯以最严厉的惩罚，吩咐火神立即执行。","anchor":"气急败坏","meaning":"宙斯决定严厉惩罚取火的人。","why":"“气急败坏”“最严厉”“立即”一起写出他的暴怒。与普罗米修斯关心人类形成对照。","label":"第 3 段"},{"text":"火神赫淮斯托斯很敬佩普罗米修斯，悄悄对他说：“只要你向宙斯承认错误，归还火种，我一定请求他饶恕你。”","anchor":"归还火种","meaning":"火神提出认错并还火，换取饶恕的办法。","why":"听清条件：不是只说一句认错，还要把火还回去。还火会怎样影响人类？","label":"第 4 段"},{"text":"普罗米修斯摇摇头，坚定地回答：“为人类造福，有什么错？我可以忍受各种痛苦，但决不会承认错误，更不会归还火种！”","anchor":"决不会","meaning":"他宁愿受苦，也不愿让人类失去火。","why":"朗读时重读“决不会”“更不会”，读出坚定。人物的选择比只贴“勇敢”标签更能说明他。","label":"第 5 段"},{"text":"火神不敢违抗宙斯的命令，只好把普罗米修斯押到高加索山上。普罗米修斯双手和双脚戴着铁环，被死死地锁在高高的悬崖上。他既不能动弹，也不能睡觉，日夜遭受着风吹雨淋的痛苦。尽管如此，普罗米修斯就是不向宙斯屈服。","anchor":"尽管如此","meaning":"被锁在悬崖、日夜受苦，他仍不屈服。","why":"“尽管如此”承接前面的痛苦，“就是不”写出坚持。难处越具体，选择越有分量。","label":"第 6 段"},{"text":"狠心的宙斯又派了一只凶恶的鹫鹰，每天站在普罗米修斯的双膝上，用它尖利的嘴巴啄食他的肝脏。白天，他的肝脏被吃光了，可是一到晚上，肝脏又重新长了出来。这样，普罗米修斯所承受的痛苦永远没有了尽头。","anchor":"永远没有了尽头","meaning":"惩罚每天重复，痛苦似乎没有尽头。","why":"这是神话中的情节。联系“白天”“晚上”“又”，理解反复承受，而不是只发生一次。","label":"第 7 段"},{"text":"许多年来，普罗米修斯一直被锁在那座可怕的悬崖上。","anchor":"许多年来","meaning":"他被囚禁了很长时间。","why":"这一句很短，却把时间拉长。“一直”说明苦难没有停止。","label":"第 8 段"},{"text":"有一天，著名的大力士赫拉克勒斯经过高加索山。他看到普罗米修斯被锁在悬崖上，心中愤愤不平，便挽弓搭箭，射死了那只鹫鹰，又用石头砸碎了锁链。普罗米修斯——这位敢于从天上“盗”取火种的英雄，终于获得了自由。","anchor":"终于","meaning":"赫拉克勒斯解救了他，故事有了结果。","why":"“终于”照应前面漫长的受难。讲结果时别把救人的大力士和传令的火神混淆。","label":"第 9 段"}],"tests":[{"q":"按照起因、经过、结果的顺序，复述普罗米修斯的故事。","ref":"为什么取火、取火后受难、被谁救出。","modelAnswer":"起因：人类没有火，生活十分悲惨，普罗米修斯决定冒险为人类取火。经过：他从太阳车上取来火种，让人们能烧熟食物、取暖和驱赶猛兽。宙斯因此惩罚他，把他锁在悬崖上，还派鹫鹰折磨他；他始终不屈服。结果：赫拉克勒斯射死鹫鹰、砸碎锁链，救出了普罗米修斯。","back":0,"answerKind":"参考答案","answerNote":"意思完整、有课文依据即可，不必逐字相同。"},{"q":"故事中哪个情节触动了你？说清情节和自己的感受。","ref":"具体情节＋为什么触动我，依据来自课文。","modelAnswer":"最触动我的是普罗米修斯被锁在悬崖上，不能动弹、不能睡觉，还遭受风吹雨淋，却始终不向宙斯屈服。他本可以答应归还火种来减轻自己的痛苦，但为了人类的幸福，他坚持自己的选择。这让我感受到他的勇敢和为别人着想的精神。","back":5,"answerKind":"交流示例","answerNote":"意思完整、有课文依据即可，不必逐字相同。"},{"q":"读“燧人钻木取火”的阅读链接。两个取火故事有什么相同和不同？","ref":"都帮助人类获得火；取火的方法和经历不同。","modelAnswer":"两个故事都写有人帮助人类获得火，使人们的生活变好。普罗米修斯冒险从太阳车上取来火种，又因取火受到惩罚，最后获救；燧人看见鸟啄燧木时闪出火光，受到启发，回去用小木棍试着钻木，找到了生火的方法。一个突出勇敢与坚持，一个让我看见观察、领悟和尝试。","back":8,"answerKind":"比较示例","answerNote":"意思完整、有课文依据即可，不必逐字相同。"}],"vocabulary":"人名读准：普罗米修斯 sī；赫淮斯托斯 hè huái sī tuō sī；赫拉克勒斯 hè lā kè lè sī。","extension":{"title":"阅读链接 · 燧人钻木取火","text":"从前，在很远很远的地方有一个燧明国，太阳和月亮都照不到那里，所以那里没有白天黑夜，更没有春夏秋冬。燧明国有棵名叫燧木的火树，曲盘起来，有一万顷地那么大，能够发出火光，燧明国的人就在火树下生活。\n后来，有一个圣人来到了这个国家，在这棵大树下休息。他忽然看见许多像猫头鹰一样的鸟，它们在枝叶中间用嘴啄木，每啄一下，就有灿然的火光闪现。于是，圣人领悟到了钻木取火的道理，回去就试着用小木棍来钻木，果然钻出了火。圣人发现了生火的方法，让人们不再过茹毛饮血的生活，所以后人称呼他为燧人。","source":"课本 P53 · 根据袁珂《神话选译百题》相关内容改写","prompt":"先读这个短故事，再比较：火怎样来到人间？"},"media":{"src":"/assets/reader-art/prometheus.webp","alt":"普罗米修斯把火带给人类，人们用火烹食和取暖。","caption":"有火以前和有火以后，人们的生活怎样变了？","credit":"AI 情境插画","kind":"story"}}}]};window.LESSON_BLUEPRINT={appId:"eddey_chinese_preview_20260915",child:"eddey",source:"金牌训练·学习笔记同步教材·四年级语文上 P52–128",courseDate:"2026-09-15起，按原书接续",currentGap:"新增衔接课尚无独立完成证据；以真实首答建立起点。",observableOutcome:"不看提示能复述课文展开顺序，并用词句或实验结果支撑判断。",essentialQuestion:"课文说了什么，作者怎样说，考试让我们用什么证据回答？",coreInsight:"改变条件检验解释；从内容、写法和启示提出有帮助的问题。",realMeaning:"读懂事情与证据，能把自己的想法讲清楚。",compressionPath:"全文阅读→点句子看重点→独立讲回→对照与定点回读→少量迁移",visibleMechanism:"实验条件、需求、赛马换序、诗景视角与连续观察",transferProof:"独立重建顺序并解释新情境，开放表达仍待复看。",knowledgeMechanism:"由全文顺序定位证据，由操作变化理解原因，由表达效果回答考向。",primaryInteraction:"原生SVG因果推演、顺序重排、自己写关键词和讲回。",childAnswerContract:"child-first-v1",childFirstLayerLimit:100,escapePolicy:"repair-once-then-reveal-and-continue",maxBlockingAttempts:2,masteryBoundary:"预习完成不等于掌握；首答、提示后修正、主观自查分开保留。",audio:"not-applicable：本轮目标为默读理解、视觉推演与自主表达。",surprise:"亲手改变条件，看到证据与推断一起改变。",surpriseTrigger:"每课主要模型操作后，再遮挡讲回。",phases:["teach","guided","recall","independent","repair","transfer"]};window.DDLearningSyncConfig={manualOnly:true};</script>

function bat(step,host,change){
 const [view,controls,result]=stage(host);let current=step.savedState?.blocker||'none',run=!!step.savedState?.run,mode=step.savedState?.mode||'bat',visited=new Set(step.savedState?.viewed||[]),prediction=step.savedState?.prediction||null;
 const blockers=[['none','不遮挡'],['eyes','蒙住眼睛'],['mouth','封住嘴'],['ears','塞住耳朵']];
 const row=document.createElement('div');row.className='model-row';blockers.forEach(([id,label])=>row.append(button(label,()=>{current=id;run=false;prediction=null;draw();emit('choose');})));controls.append(row);

 const runBtn=button('观察实验结果',()=>{if(!prediction)return;run=true;visited.add(current);draw();emit('observe');},'primary');controls.append(runBtn);
 const modeBtn=button('对照雷达',()=>{mode=mode==='bat'?'radar':'bat';run=false;draw();emit('compare');});controls.append(modeBtn);

if(q.has('routeDay'))state.day=Math.max(1,Math.min(10,+q.get('routeDay')||2));if(['train','hotel'].includes(q.get('routeScene')))state.scene=q.get('routeScene');
const direct=q.get('lesson');if(direct&&C.lessons.some(x=>x.id===direct))start(direct);else home();
})();
</script>
