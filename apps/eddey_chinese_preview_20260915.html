现并试着改变？"},{"lessonId":"tianji","question":"马没有换，哪三场对阵变了？为什么只赢一场还不够？"}]}},"scope":"先按实际学到的位置衔接，再用酒店早晨和车上时间分段学。后续备课库不等于旅途必做清单；老师实际漏课清单尚未确认。","sources":[{"title":"金牌训练·学习笔记同步教材·四年级语文上","pages":"P52–128","note":"按学字词、讲课文、划重点、理结构、做课后题的顺序改编；按用户要求录入所选课文全文，段落讲解与自测为原创。"},{"title":"家长本次提供的语文课本","pages":"P36–38、48–49、51–53","note":"爬山虎的脚、盘古开天地、普罗米修斯，可直接跳选；会写字以本次课本为准。"}],"lessons":[{"id":"night-flight","title":"夜间飞行的秘密","date":"2026-09-15","minutes":30,"bookPages":"P52–61","goal":"借实验读懂探路过程，区分事实与猜测，并能从内容、写法、生活启示三个角度提问。","source":"私有教材《金牌训练·学习笔记同步教材·四年级语文上》P52–61；part03 PDF14–23；缺字表P53–55已回看原PDF61–63页。教学文字、题目与模型为原创改述。","steps":[{"id":"bat-01","phase":"teach","type":"teach","title":"先读准，才读得懂","kicker":"学字词 · 先疏通课文","body":"这篇课文有两个秘密：蝙蝠怎样探路？飞机怎样安全夜航？先认清字词，再用实验找答案。","source":"金牌训练四上语文 P52–55；字表已对照原页","detail":["本课会写字：蚊、题、科、绳、嘴、蝇、靠、研、究、播、驾、驶。把自己最不熟的两个字各写一次，再对照检查。预习会认不等于已经会默写。","读词：蚊子 wén zi、问题 wèn tí、绳子 shéng zi、嘴巴 zuǐ ba、苍蝇 cāng ying、依靠 yī kào、研究 yán jiū、传播 chuán bō、驾驶 jià shǐ。再读：证明、配合、如何、现代、安装、类似、科学家、驾驶员。","会认字：蝙 biān、蝠 fú、避 bì、锐 ruì、障 zhàng、碍 ài、荧 yíng、屏 píng；蝇、驾还要会写。把“蝙蝠、避开、敏锐、障碍、荧光屏”放回课文读。","看结构记字：“蚊”左边是虫；“绳”的绞丝旁提示绳线；“嘴”左边是口；“究”上面是穴、下面是九；“驾”上加下马，“驶”左马右史。不要把“研究”的“究”写成“穷”。","资料小窗：这课用蝙蝠探路和雷达探测作比较。先研究生物怎样完成一件事，再思考能否帮助人类改进工具，这是仿生研究的一种思路。正文讲的是课文所述蝙蝠的回声定位，不表示所有蝙蝠都没有视力。"],"tutorial":[{"title":"这一课先做什么","text":"先读“课文讲读”，看懂飞机的问题。遇到生字用下面字词栏疏通，不必等所有字都会写才读正文。"},{"title":"把容易混的部件看清","text":"蚊、蝇都有虫字旁；绳有绞丝旁。“究”下边是九，“驾”上加下马，“驶”左马右史。"},{"title":"现在读出两组词","text":"研究、传播、驾驶；蝙蝠、敏锐、障碍、荧光屏。生词放回句子才容易记住。"}]},{"id":"bat-02","phase":"guided","type":"choice","title":"同一个字，换词就换读音","kicker":"学字词 · 多音字","body":"“屏幕、屏住呼吸；横七竖八、蛮横”中的“屏、横”，按顺序应怎样读？","source":"金牌训练 P56；原创辨音题","options":[{"id":"a","text":"píng、bǐng；héng、hèng"},{"id":"b","text":"bǐng、píng；hèng、héng"},{"id":"c","text":"píng、píng；héng、héng"}],"answer":"a","explanation":"“屏幕”读 píng；“屏住”是暂时抑止，读 bǐng。“横七竖八”读 héng；“蛮横”读 hèng。","repair":{"gap":"先看“屏”所在的词。","reason":"看屏幕，与屏住呼吸，意思不同。","check":"把两个完整词各读一次，再选。"}},{"id":"bat-03","phase":"teach","type":"teach","title":"词语藏着观察结果","kicker":"学字词 · 联系画面理解","body":"“横七竖八”是杂乱地交错着；“灵巧”是灵活又巧妙。绳子越杂乱，仍能避开就越能说明本领。","source":"金牌训练 P56；原创释义与例句","detail":["词义相加法：“灵”有灵活的意思，“巧”有巧妙的意思，合起来帮助理解“灵巧”。“横七竖八”不是恰好七根横着、八根竖着，而是形容摆放杂乱。","“清朗”在文中形容夜空晴朗明净；“敏锐”说感觉得快而准确；“障碍”是挡住前进的东西；“超声波”是一种人耳通常听不到的高频声波。看不见、听不见，不等于它不存在。","换词读一读：灵巧—灵活；避开—躲开；证明—证实；秘密—奥秘。换词前要试读整句，不能见到“近义词”就处处互换。","对着想：安全—危险，灵巧—笨拙，敏锐—迟钝，显示—隐藏。用“绳子摆得很整齐”与“绳子横七竖八”比较，两幅画面哪里不同？"],"tutorial":[{"title":"把词变成画面","text":"横七竖八：绳子杂乱交错，不是正好七横八竖。灵巧：动作灵活又巧妙。"},{"title":"老师比较给你看","text":"如果绳子整齐、空隙大，避开它不太难；杂乱细绳也碰不到，才更能突出蝙蝠的探路本领。"},{"title":"遇到词义题怎么答","text":"先解释词，再回到这句话说它写出了什么。只抄词典意思，还没有讲出在本文中的作用。"}]},{"id":"bat-04","phase":"teach","type":"teach","title":"为什么先写飞机，再写蝙蝠？","kicker":"讲课文 · 第 1—3 自然段","body":"开头先让我们看见飞机夜航，再提出疑问，把目光转向蝙蝠。蝙蝠能避开细电线，让人猜：是眼睛特别厉害吗？","source":"金牌训练 P57；课文第1—3自然段原创改述","detail":["第1段写夜空中飞来的飞机，让抽象的“安全夜航”变成可想象的画面。第2段接着发问，并提示可以从蝙蝠找线索。这样把两种看起来不同的飞行联系起来。","第3段先写蝙蝠能夜飞、能捉虫、还能避开很细的电线，再猜测它是不是靠敏锐的眼睛。这时只是提出可能的解释，还没有证明。","“即使……也……”把困难条件和结果连起来：连极细的电线都能避开，更能突出探路本领。考试问表达作用时，要说清“突出什么本领”，不能只写“生动形象”。"],"tutorial":[{"title":"先把第1—3段连起来","text":"飞机夜航提出问题，蝙蝠的本领提供线索，“靠眼睛吗”提出猜想。下面的实验负责验证猜想。"},{"title":"老师示范：开头为什么不直接写实验","text":"题目问“安排的作用”，我就找开头的问题与结尾的回答，不只复述实验。"},{"title":"连成一句回答","text":"先写飞机夜航，能引出读者的疑问，再带着问题研究蝙蝠；结尾介绍雷达，回答开头的疑问。"}],"reading":{"title":"读懂《夜间飞行的秘密》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第1—2段 · 从飞机夜航发问","text":"晴朗的夜空里，一架飞机正在飞行。天这么黑，它怎样发现前方的障碍呢？文章先摆出这个问题，又告诉读者：要找答案，可以先看看蝙蝠。飞机的问题暂时留着，中间的研究就是为了解答它。"},{"label":"第3段 · 看见本领，提出猜想","text":"蝙蝠在夜里飞行，能捉飞蛾、蚊子，也能避开很细的电线。作者顺势猜想：它是不是靠非常敏锐的眼睛看清道路？“本领强”是观察，“靠眼睛”还只是待验证的猜想。"}]}},{"id":"bat-05","phase":"guided","type":"model","title":"你来改变实验条件","kicker":"讲课文 · 第 4—7 自然段","body":"每次只改一处：蒙住眼睛、塞住耳朵，或封住嘴。先猜会不会碰绳，再观察。哪里一断，探路就失败？","source":"金牌训练 P58；课文实验与探路链的可操作改编","model":"bat","modelConfig":{"prompt":"先猜结果，再依次试蒙眼、塞耳、封嘴。每次只改一个部位。","conditions":[{"id":"eyes","label":"蒙住眼睛","result":"仍能避开绳子","brokenLink":null},{"id":"ears","label":"塞住耳朵","result":"碰到绳子，铃铛响","brokenLink":"接收反射回来的超声波"},{"id":"mouth","label":"封住嘴","result":"碰到绳子，铃铛响","brokenLink":"发出超声波"}],"chain":["嘴发出超声波","声波遇到障碍物反射","耳朵接收反射声波","调整飞行方向"],"guardrails":["各次保持房间与绳子条件相同，不能同时封两处后混淆证据","模型表示课文所述实验，不推断蝙蝠没有视力","雷达波型如出现须标无线电波"]},"reference":"蒙眼仍能避开绳子；塞耳、封嘴分别会乱撞。探路需要发出超声波，也需要接收回来的超声波。","reading":{"title":"读懂《夜间飞行的秘密》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第4段 · 第一次实验","text":"科学家在房间里交错拉起许多绳子，绳子上挂铃铛。他们蒙住蝙蝠的眼睛，让它飞。过了几个钟头，铃铛仍没响，蝙蝠没有撞上绳子。这说明：在这次实验中，眼睛被遮住也没有妨碍它探路。"},{"label":"第5—6段 · 用另两次实验比较","text":"科学家保持房间和绳子不变，一次塞住蝙蝠耳朵，另一次封住蝙蝠嘴巴。这两次它都会乱撞，铃铛不断响。三种结果放在一起，才有依据说这套探路本领需要嘴与耳朵配合。"},{"label":"第7段 · 配合到底怎样发生","text":"反复研究后，科学家进一步弄清过程：课文中的蝙蝠用嘴发出超声波；波向前传播，遇到障碍后返回；耳朵收到返回的波，蝙蝠就改变飞行方向。人耳通常听不到超声波。三次实验说明“哪些部位要配合”，后续研究解释“怎样配合”。"}]}},{"id":"bat-06","phase":"recall","type":"recall","title":"把刚才的变化讲回来","kicker":"遮挡回忆 · 不看模型说","body":"为什么嘴和耳朵少一个都不行？从“发出什么”开始，按路上发生的事讲给旁边的人听。","source":"金牌训练 P58；原创口头讲回","reference":"课文中的蝙蝠从嘴里发出超声波；波遇到障碍物反射回来，耳朵接收到后，蝙蝠调整方向。封嘴会缺少发出的信号，塞耳会收不到返回的信号。重点是发出、返回、接收的配合，不要求逐字相同。"},{"id":"bat-07","phase":"guided","type":"order","title":"从现象走到结论","kicker":"跟着做 · 证据的先后","body":"把这条判断路排顺。注意：先观察实验结果，再下结论。","source":"金牌训练 P58；原创顺序题","items":[{"id":"test","text":"分别蒙眼、塞耳、封嘴进行实验"},{"id":"result","text":"蒙眼不撞，塞耳或封嘴会乱撞"},{"id":"inference","text":"比较结果：这套探路本领依靠嘴和耳朵配合"}],"answer":["test","result","inference"],"explanation":"结论必须跟着观察走。只看蒙眼实验，能判断它并非靠眼睛完成这次探路，还不能独自证明嘴和耳朵怎样工作。","repair":{"gap":"先找哪一步真的看到了结果。","reason":"“靠嘴和耳朵”是比较实验后得出的结论。","check":"把实验和观察放在结论前，再排一次。"}},{"id":"bat-08","phase":"teach","type":"teach","title":"三次实验，还没有讲完全部秘密","kicker":"讲课文 · 第 4—7 自然段细读","body":"三次实验发现“嘴和耳朵要配合”。后来的反复研究，才讲清超声波怎样来回传递。这是两层发现。","source":"金牌训练 P58；段落关系与写法","detail":["第4段详写实验布置：屋里拉绳、挂铃铛，再蒙住蝙蝠的眼睛。铃铛不响、绳子没碰到，就是可观察的证据。","第5段把改变的条件写清：一次塞耳，一次封嘴；两次都乱撞。其余条件沿用前一次，作者就不必把房间、绳子、铃铛重说两遍。","第6段归纳三次结果：探路靠嘴和耳朵相互配合。第7段继续解释配合的过程。不要把“做了三次”说成“从此不用再研究了”。","把失去正常探路能力的蝙蝠比作“没头苍蝇”，让“到处乱撞”的样子更容易想象。这不是说蝙蝠变成了苍蝇。","写法可带走：相同的过程第一次说明白，后面着重写条件变化和不同结果；这样既清楚，又不重复。"],"tutorial":[{"title":"先分清两层答案","text":"三次实验告诉我们嘴和耳朵要配合；后续研究才说明超声波怎样来回。知道要配合，不等于已经知道全过程。"},{"title":"老师读第4—5段给你看","text":"第4段把房间、绳子、铃铛讲清。第5段只重点写换了哪个部位、结果怎样，房间没有重新介绍。"},{"title":"这就是详略的理由","text":"共同条件第一次交代完整，后面突出变化。读者仍能比较实验，还能避免重复。"}]},{"id":"bat-09","phase":"teach","type":"teach","title":"飞机的秘密，现在接上了","kicker":"讲课文 · 第 8 自然段","body":"雷达发出无线电波，接收遇到目标后返回的波，再把探测信息显示出来。它与蝙蝠探路的过程相似，使用的波不同。","source":"金牌训练 P59；课文第8自然段与比较","detail":["蝙蝠：嘴发出超声波 → 遇到障碍物返回 → 耳朵接收 → 调整方向。雷达：天线发出无线电波 → 遇到目标返回 → 雷达接收、处理并显示信息。","相同的是“发出—返回—接收”的探测思路。不同的是：超声波属于声音；雷达用的无线电波属于电磁波，不是声音。不要因为都带“波”字，就说它们一样。","第8段回应开头飞机安全夜航的问题，文章前后连在一起。这篇课文借两种探路方式的比较，帮助我们理解探测的原理。","从这篇课文不能直接断定：所有夜间活动的动物都靠超声波。想了解另一种动物，还需要它自己的观察和资料证据。"],"tutorial":[{"title":"沿同一条路对应","text":"蝙蝠嘴发出，耳朵接收；雷达天线发出、接收，再显示信息。都通过信号返回来发现障碍。"},{"title":"相似处与不同处一起说","text":"过程相似，不代表波相同。蝙蝠用超声波；雷达用无线电波。"},{"title":"回头看开篇","text":"现在你知道为何先问飞机了：蝙蝠的研究为理解雷达搭桥，雷达又回答飞机夜航的问题。"}]},{"id":"bat-10","phase":"guided","type":"choice","title":"相似，不是完全一样","kicker":"跟着做 · 比较探路方式","body":"哪句话把蝙蝠探路与雷达说清楚了？","source":"金牌训练 P58–60；原创比较题","options":[{"id":"a","text":"它们都发出超声波，所以完全相同。"},{"id":"b","text":"它们都利用返回的波探测；蝙蝠用超声波，雷达用无线电波。"},{"id":"c","text":"雷达只需要发出波，不需要接收。"}],"answer":"b","explanation":"先找共同过程，再指出波的区别。返回的波必须被接收，才能提供探测信息。","repair":{"gap":"先分清两种波的名字。","reason":"过程相似，并不表示材料或工具相同。","check":"回想嘴与雷达天线各发出什么，再选。"}},{"id":"bat-11","phase":"teach","type":"teach","title":"考试问一个词，要回到整句话","kicker":"划重点 · “反复”“终于”","body":"“反复”告诉我们研究不止一次；“终于”让我们感到结果来之不易。答题时，先解释词，再说它让我们读出了什么。","source":"金牌训练 P57–58；重点词语删换题教学","detail":["待分析的意思是：科学家经过多次研究，最终才弄清蝙蝠探路的秘密。若删掉“反复”“终于”，事件大意还在，但研究多次、得出结果不容易的意味变弱了。","答题路线：先说明删后表达效果有变化 → 解释关键词在句中的意思 → 结合研究过程说出严谨探索、坚持研究。不要见到“能否删去”就不看句子机械回答“不能”。","还可从三类题找证据：问“怎样探路”，回第7段找过程；问“实验说明什么”，比第4—6段结果；问“为什么略写后两次”，比较相同布置和不同条件。"],"tutorial":[{"title":"老师示范：为什么“反复”有用","text":"先审题：问删词的差别。再定位：它修饰“研究”，说明研究做了多次。"},{"title":"把删前删后比一次","text":"有“反复”，能读出研究持续多次；删去后，只知道研究过，看不出多次尝试。"},{"title":"组织答案，不套空话","text":"可以说：“反复”表示多次，说明发现不是一次研究就得到的；删去会少掉研究过程的艰辛。下一步由你把“终于”也考虑进去。"}],"reading":{"title":"读懂《夜间飞行的秘密》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第7段 · 配合到底怎样发生","text":"反复研究后，科学家进一步弄清过程：课文中的蝙蝠用嘴发出超声波；波向前传播，遇到障碍后返回；耳朵收到返回的波，蝙蝠就改变飞行方向。人耳通常听不到超声波。三次实验说明“哪些部位要配合”，后续研究解释“怎样配合”。"}]}},{"id":"bat-12","phase":"guided","type":"open","title":"说出删掉后少了什么","kicker":"跟着答 · 有判断，也有依据","body":"把“经过反复研究，终于找到答案”改成“研究后找到答案”，表达少了什么？用自己的话说。","source":"金牌训练 P57；原创改写辨析题","prompt":"不要只答“不能删”。说明原句怎样让你感到研究的过程。","reference":"改后仍知道找到了答案，但不明显看出研究做过多次、结果来得不容易。原来的两个词让我们读到不断研究的过程和坚持探索的态度。","checklist":["说明研究不是只做一次","说明结果来得不容易","把词语意思与表达效果联系起来"],"repair":{"gap":"如果只答“生动”，还没说清少了什么。","reason":"这两个词写的是次数和过程感受。","check":"各说一句：做了多少次？答案容易得到吗？"},"responseSupport":[{"label":"解释研究次数","text":"“反复”说明……","why":"先说词义与它修饰的研究，再解释删后少什么。"},{"label":"解释结果难得","text":"“终于”让我读出……","why":"不是换近义词，而是比较有无期待和努力过程。"}]},{"id":"bat-13","phase":"guided","type":"order","title":"把整篇课文搭起来","kicker":"课文结构 · 三个部分","body":"按文章讲解的顺序排列。最后一部分要回答最开始的问题。","source":"金牌训练 P57–60；课文结构重组","items":[{"id":"question","text":"飞机怎样安全夜航？转向蝙蝠寻找线索（1—2段）"},{"id":"bat","text":"通过实验与研究，解释蝙蝠怎样探路（3—7段）"},{"id":"radar","text":"用相似的探测过程解释雷达，回应飞机夜航（8段）"}],"answer":["question","bat","radar"],"explanation":"全文是提出问题、探究蝙蝠、解释雷达。中间的实验负责提供证据，结尾负责回应开头。","repair":{"gap":"先找文章开头在问谁。","reason":"飞机是开头的问题；蝙蝠是理解这个问题的线索。","check":"让最后一部分回到飞机，再排。"}},{"id":"bat-14","phase":"teach","type":"teach","title":"这篇语文课还教你怎样提问","kicker":"主题与方法 · 看三种角度","body":"读课文可以问三件事：写了什么？为什么这样写？读完还想研究什么？问题会带着你找证据。","source":"金牌训练 P60；主题归纳与课后问题清单","detail":["内容角度：问事实、原因、过程。例如“为什么实验要在绳子上挂铃铛？”可以回到实验内容找线索。","写法角度：问作者怎样组织、为什么选某种表达。例如“为什么第一次实验写得详细，后两次写得简短？”要比较文章的写法。","启示与生活角度：从这篇课文继续思考。例如“另一种动物夜里怎样寻找食物？”这个问题有价值，但答案不一定已经写在本文里。","本文让我们看见：有了疑问，可以观察、比较、实验，再形成有证据的解释。能讲出这样的过程，比只背一句“热爱科学”更具体。"],"tutorial":[{"title":"先分三个角度","text":"问内容是在找事实或原因；问写法是在研究作者为什么这样讲；问生活是在找还能怎样用。"},{"title":"老师用另一段文字示范","text":"短段：我试了几次才修好拉链。内容：拉链哪里坏了？写法：“几次”能删吗？生活：修别的东西时也要先找原因吗？"},{"title":"回到本课，由你换角度","text":"不要把三个问句都写成“蝙蝠为什么”。先选一个内容疑问，再想一个写法或生活疑问。"}]},{"id":"bat-15","phase":"recall","type":"recall","title":"合上提示，说回全文","kicker":"遮挡回忆 · 先问，再找证据","body":"用三句话讲清：开头问什么？中间用什么证据解释？最后又回到什么？再说一种你会用的提问角度。","source":"金牌训练 P57–60；原创整课讲回","reference":"先问飞机如何安全夜航；再通过蝙蝠实验和研究，说明超声波怎样发出、返回、被接收；最后比较雷达的无线电波探测，回应飞机夜航。提问可以围绕课文内容、作者写法，或联系生活所得的启发。"},{"id":"bat-16","phase":"independent","type":"choice","title":"独立判断：作者为什么这样写？","kicker":"自己来 · 写法与依据","body":"后两次实验写得简短，最准确的理由是什么？","source":"金牌训练 P58；原创独立检验","options":[{"id":"a","text":"后两次没有作用，可以不认真读。"},{"id":"b","text":"结果已经猜到了，所以不需要证据。"},{"id":"c","text":"实验布置相同，作者重点写改了哪里和出现的结果，避免重复。"}],"answer":"c","explanation":"后两次提供重要证据；简写的是已经交代过的相同布置，不是把实验的重要性写没了。","repair":{"gap":"先把“写得简短”和“不重要”分开。","reason":"关键变化与结果仍然写出来了。","check":"找出三次相同的条件，再回原题。"}},{"id":"bat-17","phase":"independent","type":"open","title":"由你写出两种问题","kicker":"自己来 · 从不同角度提问","body":"围绕这篇课文，提出两个角度不同的问题。说说各属于什么角度。先独立说，再展开对照。","source":"金牌训练 P60；课后任务原创设计","prompt":"可以口述给身边的人，再留下几个关键词。两个问题不要只是换一种说法问同一件事。","reference":"例：内容角度——铃铛怎样帮助科学家判断蝙蝠是否碰到绳子？写法角度——作者为什么先写飞机，再介绍蝙蝠？也可从本文得到启发，提出一个需要另查证据的生活问题。例子不是唯一答案。","checklist":["两个问题角度不同","能指出内容、写法或启示中的所属角度","问题具体，能说出想弄清什么"],"repair":{"gap":"如果两个问题都问“怎样探路”，角度还相同。","reason":"换角度是换想研究的事情。","check":"保留一个内容问题，再问作者为什么这样写。"},"responseSupport":[{"label":"换成写法角度","text":"作者为什么先写……再写……？","why":"这是提问的方向；需要你选出正文中值得研究的具体安排。"},{"label":"从生活继续想","text":"如果换成……，还需要什么证据？","why":"引导新的问题，不能直接把课文结论推广给所有对象。"}]},{"id":"bat-18","phase":"transfer","type":"open","title":"换一段文字，也会提问","kicker":"换材料 · 近迁移","body":"短文：我们吃的马铃薯和藕长在地下，属于植物的茎。马铃薯的茎膨大成块；藕的茎一节节相连。","source":"金牌训练 P60–61；“茎还是根”任务的原创缩写变式","prompt":"针对短文，提一个内容问题，再提一个写法问题。可以问“为什么”，也可以问作者怎样介绍。","reference":"内容问题可问：有什么特征能帮助我们判断它们属于茎？写法问题可问：为什么先说它们都属于茎，再分别介绍形状？前一个可能需要补充资料，后一个可比较短文组织。","checklist":["一个问题在问植物的事实或原因","一个问题在问短文怎样介绍","没有把“长在地下”直接当成“一定是根”"],"repair":{"gap":"先辨认你在问植物，还是在问作者。","reason":"内容问题研究事物，写法问题研究表达。","check":"把第二问改成“作者为什么先……再……”。"}},{"id":"bat-19","phase":"transfer","type":"open","title":"生活中也别急着下结论","kicker":"换情境 · 远迁移","body":"小航换了水杯，也换了杯盖，发现书包不漏水了。他说：“一定是新杯盖的功劳！”这个证据够吗？","source":"依金牌训练 P58实验比较方法与P60启示提问原创迁移","prompt":"说出哪里还不能确定，再提出一个能帮助检查的问题。","reference":"还不能单独确定是杯盖起作用，因为杯子和杯盖同时变了。可以问：在杯子相同的情况下，只换杯盖，漏水情况怎样？这借用了课文比较条件、用结果判断的思路。","checklist":["看出杯子和杯盖同时改变","没有把猜测直接当成事实","提出只改变一个有关条件的比较办法"],"repair":{"gap":"先数一数，他同时换了几样东西。","reason":"两样一起变，暂时分不清是哪样起作用。","check":"保留同一个杯子，再考虑怎样比较。"}},{"id":"bat-20","phase":"teach","type":"teach","title":"带走两条路","kicker":"收束 · 预习到这里","body":"读懂内容：现象 → 问题 → 证据 → 解释。回答题目：看清问什么 → 回到对应段落 → 说明证据。","source":"金牌训练 P60–61；全课与拓展收束","detail":["本课后续常见任务：读准、写对字词；说明三次实验结果；讲清嘴与耳朵配合；比较超声波和无线电波；分析关键词与详略写法；从不同角度提问。课堂题目只检查这次表现，不会据此直接宣布“全部掌握”。","词语拓展：在“横七竖八、五颜六色、百发百中”中找数字，再说一个同类词。不要把成语里的数字全理解为精确数量。","科学精神的拓展可以化成一句自己的话：有想法，也要去检查；解释与观察冲突时，要愿意重新研究。这是对原书拓展的归纳，不是名言原句。","接下来如果只复习一处：重新讲一次超声波的来回过程，再独立提出一个写法问题。留下待复看的地方，比赶着点完更有用。"],"tutorial":[{"title":"能带走的本领","text":"读新说明文时，先找它要解释的问题，再看观察或实验怎样支持答案。"},{"title":"答题时用四步","text":"审清题目问什么，定位对应段落，选出直接证据，连成自己的回答。"},{"title":"下一次怎样接","text":"如果能独立讲出探路过程，下一次重点练提问和词句作用；说不清就回到实验与第7段。"}]}],"reading":{"title":"读懂《夜间飞行的秘密》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第1—2段 · 从飞机夜航发问","text":"晴朗的夜空里，一架飞机正在飞行。天这么黑，它怎样发现前方的障碍呢？文章先摆出这个问题，又告诉读者：要找答案，可以先看看蝙蝠。飞机的问题暂时留着，中间的研究就是为了解答它。"},{"label":"第3段 · 看见本领，提出猜想","text":"蝙蝠在夜里飞行，能捉飞蛾、蚊子，也能避开很细的电线。作者顺势猜想：它是不是靠非常敏锐的眼睛看清道路？“本领强”是观察，“靠眼睛”还只是待验证的猜想。"},{"label":"第4段 · 第一次实验","text":"科学家在房间里交错拉起许多绳子，绳子上挂铃铛。他们蒙住蝙蝠的眼睛，让它飞。过了几个钟头，铃铛仍没响，蝙蝠没有撞上绳子。这说明：在这次实验中，眼睛被遮住也没有妨碍它探路。"},{"label":"第5—6段 · 用另两次实验比较","text":"科学家保持房间和绳子不变，一次塞住蝙蝠耳朵，另一次封住蝙蝠嘴巴。这两次它都会乱撞，铃铛不断响。三种结果放在一起，才有依据说这套探路本领需要嘴与耳朵配合。"},{"label":"第7段 · 配合到底怎样发生","text":"反复研究后，科学家进一步弄清过程：课文中的蝙蝠用嘴发出超声波；波向前传播，遇到障碍后返回；耳朵收到返回的波，蝙蝠就改变飞行方向。人耳通常听不到超声波。三次实验说明“哪些部位要配合”，后续研究解释“怎样配合”。"},{"label":"第8段 · 回答开头的飞机问题","text":"飞机上的雷达用天线发出无线电波。波遇到障碍物返回，雷达接收并显示信息，驾驶员据此了解前方情况。它与蝙蝠探路都有“发出—返回—接收”，但无线电波不是超声波。结尾回到飞机，使开头的问题得到回答。"}]},"segments":[{"id":"bat-story","title":"看懂课文与探路实验","startStepId":"bat-01","endStepId":"bat-10","minutes":18,"goal":"讲清嘴、耳朵和返回信号怎样配合","scene":"hotel","check":"遮住模型，从嘴发出开始讲完探路过程。"},{"id":"bat-reading","title":"学会提问与带证据回答","startStepId":"bat-11","endStepId":"bat-20","minutes":12,"goal":"能解释词语作用，提出两种角度的问题","scene":"train","check":"独立提两个角度不同的问题，并说一个删词差别。"}],"unit":2,"reader":{"author":"科普课文","pages":"P57–59","core":"先看实验怎么做，再问“为什么这样写”。","hook":"黑灯瞎火，蝙蝠怎么绕开细绳？","notes":[{"anchor":"一架飞机在夜航","meaning":"先让你看见夜里飞来的飞机。","why":"故事从眼前的画面开始，引出飞行的秘密。"},{"anchor":"飞机是怎么做到安全飞行的呢","meaning":"先提问题，再带你找答案。","why":"你也可以带着这个问题往下读。"},{"anchor":"难道它的眼睛特别敏锐","meaning":"蝙蝠会不会靠眼睛探路？","why":"现在只是猜想，后面用实验来查。"},{"anchor":"铃铛一个也没响","meaning":"蒙住眼睛，它仍然没撞绳子。","why":"绳上有铃铛，撞了就会响。这个结果说明探路不靠眼睛。"},{"anchor":"一次把蝙蝠的耳朵塞上，一次把蝙蝠的嘴封住","meaning":"塞耳和封嘴是分开做的两次实验。","why":"这里简写，因为第一场已把屋子和绳子交代清楚。"},{"anchor":"嘴和耳朵的相互配合","meaning":"嘴发出声音，耳朵接收回来的声音。","why":"少了哪一边，这条探路的路就断了。"},{"anchor":"反复研究，终于","meaning":"科学家试了很多次，才弄明白。","why":"这几个字写出了研究不容易。不是做完就马上全懂了。"},{"anchor":"工作原理与蝙蝠探路类似","meaning":"两者都会发出波，再接收返回的波。","why":"蝙蝠用超声波，雷达用无线电波。类似，不是完全相同。"}],"tests":[{"q":"说一说：蒙眼、塞耳、封嘴，分别发生了什么？","ref":"蒙眼仍避开绳子；塞耳或封嘴后碰撞。探路需要嘴和耳朵配合。","back":3,"modelAnswer":"蒙住眼睛时，蝙蝠仍能避开绳子，铃铛一个也没响。塞住耳朵时，它到处乱撞，铃铛响个不停；封住嘴时，也出现了这样的结果。实验说明蝙蝠在这种情况下探路，需要嘴和耳朵相互配合。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"为什么第一次实验写得详细，后两次写得简短？","ref":"前面已交代场地和方法，后面突出改了哪个条件、结果怎样，就不必重复。","back":4,"modelAnswer":"第一次实验详细交代了屋子、绳子、铃铛以及实验方法，让读者明白怎样判断蝙蝠有没有碰到障碍。后两次只需突出“塞耳朵”“封嘴”这两个改变和各自的结果，不重复介绍相同的布置。这样写重点清楚，也更简洁。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"请从两个角度各提一个问题：文章写了什么？作者为什么这样写？","ref":"内容问题如“蝙蝠怎样判断障碍？”；写法问题如“为什么从飞机夜航写起？”能帮助理解课文就有价值。","back":1,"modelAnswer":"问内容：蝙蝠的嘴和耳朵怎样配合，帮助它避开障碍？\n问写法：文章为什么先写飞机夜航，再写蝙蝠的实验？","answerKind":"提问示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"kind":"article","paragraphs":[{"text":"清朗的夜空出现两个亮点，越来越近了，才看清楚是一红一绿的两盏灯。接着传来了隆隆声，这是一架飞机在夜航。","anchor":"一架飞机在夜航","meaning":"先让你看见夜里飞来的飞机。","why":"故事从眼前的画面开始，引出飞行的秘密。","label":"第 1 段"},{"text":"在漆黑的夜里，飞机是怎么做到安全飞行的呢？要想了解其中的秘密，我们可以从蝙蝠说起。","anchor":"飞机是怎么做到安全飞行的呢","meaning":"先提问题，再带你找答案。","why":"你也可以带着这个问题往下读。","label":"第 2 段"},{"text":"蝙蝠能在夜里飞行，还能捕捉飞蛾和蚊子；而且无论怎么飞，从来没见过它跟什么东西相撞，即使一根极细的电线，它也能灵巧地避开。难道它的眼睛特别敏锐，能在漆黑的夜里看清楚所有的东西吗？","anchor":"难道它的眼睛特别敏锐","meaning":"蝙蝠会不会靠眼睛探路？","why":"现在只是猜想，后面用实验来查。","label":"第 3 段"},{"text":"为了弄清楚这个问题，两百多年前，科学家做了一次实验。他们在一间屋子里横七竖八地拉了许多绳子，绳子上系了许多铃铛，然后把蝙蝠的眼睛蒙上，让它在屋子里飞。蝙蝠飞了几个钟头，铃铛一个也没响，那么多的绳子，它一根也没碰着。","anchor":"铃铛一个也没响","meaning":"蒙住眼睛，它仍然没撞绳子。","why":"绳上有铃铛，撞了就会响。这个结果说明探路不靠眼睛。","label":"第 4 段"},{"text":"科学家又做了两次实验：一次把蝙蝠的耳朵塞上，一次把蝙蝠的嘴封住，让它在屋子里飞。蝙蝠就像没头苍蝇似的到处乱撞，挂在绳子上的铃铛响个不停。","anchor":"一次把蝙蝠的耳朵塞上，一次把蝙蝠的嘴封住","meaning":"塞耳和封嘴是分开做的两次实验。","why":"这里简写，因为第一场已把屋子和绳子交代清楚。","label":"第 5 段"},{"text":"三次实验的结果证明，蝙蝠夜里飞行，探路靠的不是眼睛，而是嘴和耳朵的相互配合。","anchor":"嘴和耳朵的相互配合","meaning":"嘴发出声音，耳朵接收回来的声音。","why":"少了哪一边，这条探路的路就断了。","label":"第 6 段"},{"text":"后来，科学家经过反复研究，终于揭开了蝙蝠能在夜里飞行的秘密。它一边飞，一边从嘴里发出超声波。人的耳朵听不见超声波，蝙蝠的耳朵却能听见。超声波向前传播时，遇到障碍物就反射回来，传到蝙蝠的耳朵里，蝙蝠就立刻改变飞行的方向。","anchor":"反复研究，终于","meaning":"科学家试了很多次，才弄明白。","why":"这几个字写出了研究不容易。不是做完就马上全懂了。","label":"第 7 段"},{"text":"知道了蝙蝠在夜里如何飞行，你猜到飞机夜间飞行的秘密了吗？现代飞机上安装了雷达，雷达的工作原理与蝙蝠探路类似。雷达通过天线发出无线电波，无线电波遇到障碍物就反射回来，雷达接收到后显示在荧光屏上。从雷达的荧光屏上，驾驶员能够清楚地看到前方有没有障碍物，所以飞机飞行就更安全了。","anchor":"工作原理与蝙蝠探路类似","meaning":"两者都会发出波，再接收返回的波。","why":"蝙蝠用超声波，雷达用无线电波。类似，不是完全相同。","label":"第 8 段"}],"poem":false,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P57–59；按该书课文录入，省去注音与教参批注。","media":{"kind":"photo","at":2,"src":"/assets/reader-art/bat.webp","alt":"夜间飞行、展开双翼的蝙蝠。","caption":"夜里看不清，蝙蝠怎样避开障碍？照片能让我们看见它，后面的实验才能帮我们找出原因。","credit":"PLoS Biology · The Sound of Dinner (2006)","license":"CC BY 2.5","modified":"仅转为 WebP，未改动内容","licenseURL":"https://creativecommons.org/licenses/by/2.5/","source":"https://commons.wikimedia.org/wiki/File:Bat_flying_at_night.png"}}},{"id":"square-hat-shop","title":"方帽子店","date":"2026-09-17","minutes":30,"bookPages":"P62–72","goal":"按因果读懂故事，用人物语言与动作作证，复述意外片段，并筛选最有助理解课文的问题。","source":"私有教材《金牌训练·学习笔记同步教材·四年级语文上》P62–72；part04 PDF1–11；字表P62–64、正文P68–69与P71提问表已回看原PDF70–72、76–77、79页。教学文字、题目与模型为原创改述。","steps":[{"id":"hats-01","phase":"teach","type":"teach","title":"先把故事里的字认清","kicker":"学字词 · 开始读故事","body":"这家店一直只做方帽子。帽子不好戴，为什么还不肯改？先读准“脑袋、舒服、橱窗”，再看人物怎么做。","source":"金牌训练 P62–65；字表已对照原页","detail":["本课会写字：帽、脑、袋、服、蕉、假、扣、懂、筒、摆、玻、璃。会认字还包括：橱 chú、嚷 rāng、溜 liù；蕉、扣、筒既要认，也要写。","读词：帽子 mào zi、脑袋 nǎo dai、舒服 shū fu、香蕉 xiāng jiāo、假如 jiǎ rú、设法 shè fǎ、扣子 kòu zi、懂事 dǒng shì、圆筒 yuán tǒng、摆放 bǎi fàng、玻璃 bō li、广告、改变、各式各样。","借熟字记新字：厨旁加木成橱，焦上加草字头成蕉，同上加竹字头成筒。用手做一次“扣住”的动作，记住“扣”的提手旁。","写字观察：“帽”的右边上宽下窄，里面两横不要接到两边；“袋”上代下衣；“懂”右边是“董”；“玻、璃”都是王字旁。挑最不熟的两个写一次，再对照。","作者施雁冰写过许多儿童文学作品。这一课是童话：人物和事情可以带有夸张、有趣的想象，但我们仍要按故事里的证据理解人物。"],"tutorial":[{"title":"先读一个完整故事","text":"先在课文讲读中看清：旧帽不好戴，孩子试新帽，顾客作选择。遇到字词再回查，不只背创新两个字。"},{"title":"读准能帮你看懂动作","text":"读准“脑袋、舒服、橱窗、设法”。“设法”是想办法，后面找布、试做就是这个词在故事里的动作。"},{"title":"抓住一个总问题","text":"同样卖帽子，两家店为什么有不同结果？带着它读人物说了什么、做了什么。"}]},{"id":"hats-02","phase":"guided","type":"choice","title":"“一溜烟”不是慢慢走","kicker":"学字词 · 读音和意思","body":"“一溜烟跑了”的“溜”读 liù，写跑得很快。下面哪一组读音正确？","source":"金牌训练 P65–66；原创辨音题","options":[{"id":"a","text":"一溜烟 liū；溜冰 liù"},{"id":"b","text":"一溜烟 liù；溜冰 liū"},{"id":"c","text":"一溜烟 liù；溜冰 liù"}],"answer":"b","explanation":"“一溜烟”读 liù；“溜冰、溜走”读 liū。把读音放在词里记，更容易分开。","repair":{"gap":"先把两个完整的词读出来。","reason":"“一溜烟”和“溜冰”不是同一个读音。","check":"按“liù 烟、liū 冰”再读，再选。"}},{"id":"hats-03","phase":"teach","type":"teach","title":"“一直这样”能说明好用吗？","kicker":"学字词 → 讲课文 · 第 1—6 段","body":"“橱窗”用来展示商品；“设法”就是想办法。故事中的大人只说一直如此，孩子却问：戴着不舒服，能不能变？","source":"金牌训练 P65–67；词义与起因","detail":["词语小窗：人山人海＝聚集的人很多；密密麻麻＝又多又密；大吃一惊＝非常意外；各式各样＝有许多不同式样；古董在文中指过时、不再被人使用的方帽子，不是夸它值钱。","“舒服、舒适”都与合意、轻松有关。“帽子戴着舒服”强调身体感受；“舒适的房间”常描写环境。近义不表示任何句子都可以生硬互换。","近义词可以换着试读：奇怪—奇特，假如—如果，吃惊—惊讶，喜欢—喜爱，各式各样—各种各样。比如“他十分惊讶”与“他十分吃惊”，都在写遇到意外时的反应。","读反义，想画面：舒服—难受；喜欢—讨厌；密密麻麻—稀稀疏疏。原书还引导比较“人山人海”和“人迹罕至”，分别是人很多和很少有人到。","第1—3段写店里只做方帽子，还把老做法当成不能改变的理由。第4段写实际问题：圆头放进方帽子，有的地方紧、有的地方松，冬夏戴着也不舒服。第5—6段，孩子的追问与大人的旧理由碰在一起。"],"tutorial":[{"title":"先把矛盾找出来","text":"一边是“从来这样”，一边是“戴着不舒服”。前者说明习惯，后者才是使用感受。"},{"title":"老师示范想问题","text":"我不会马上写“店主坏”。我先问：既然不舒服，他为什么不肯试别的办法？"},{"title":"带着问题操作","text":"下面比较帽形和季节。改变后要看是否合用，不能只凭“新”判好。"}]},{"id":"hats-04","phase":"guided","type":"model","title":"换一种帽子，会改变什么？","kicker":"动手看 · 从问题到尝试","body":"先看圆头戴方帽子哪里不合适，再试不同帽形与季节。顾客在意的是合不合用。哪个改变真能解决问题？","source":"金牌训练 P67、P69–70；帽子需求对照的教学模型","model":"hats","modelConfig":{"prompt":"改变帽子选择与使用季节，观察帽形、材料、舒适性和顾客理由。","oldReason":"从来这样做，所以不改变","newReason":"看看哪里不舒服，再试适合头形和季节的帽子","choices":[{"id":"old","label":"不改变的方帽子","observation":"形状不合头，仍有太紧和太宽的地方"},{"id":"round","label":"试合适的圆帽子","observation":"帽子更贴合头形，可比较舒适度"},{"id":"summer","label":"夏季宽边草帽","observation":"依据故事，适合夏季使用"},{"id":"winter","label":"冬季呢绒帽","observation":"依据故事，适合冬季保暖"}],"guardrails":["不是凭“新”就判优；改变要能满足实际需要","只能归纳故事中人物，不说所有大人守旧、所有孩子创新","模型观察不是现实产品测评"]},"reference":"从头形与季节的实际需要出发，尝试合适的帽子，再看效果。故事里旧店只坚持一直如此，新帽子则更舒服、更多样，所以吸引顾客。"},{"id":"hats-05","phase":"recall","type":"recall","title":"把刚才的比较讲回来","kicker":"遮挡回忆 · 不看模型","body":"“一直这样做”和“这样戴着舒服”，哪一种能直接说明帽子合用？用模型里的一处变化说理由。","source":"金牌训练 P67、P69–70；原创讲回","reference":"“一直这样做”只说明过去的习惯，不能证明现在合用。试着让帽子适合头形或季节，再比较舒适性，才能说明是否解决了问题。可以用圆帽贴合头形或冬夏不同帽子的例子解释。"},{"id":"hats-06","phase":"teach","type":"teach","title":"开头怎样写出“全都一样”？","kicker":"讲课文 · 第 1—6 段细读","body":"作者连续写几顶帽子都是方的，让我们看见满橱窗都一样。再写戴着不舒服，老规矩与真实感受的矛盾就出现了。","source":"金牌训练 P66–67；排比、省略号与人物依据","detail":["“第一顶……第二顶……第三顶……”连续列举，形成排比，强调帽子都一样。这里的省略号表示后面还有同类帽子没有列完。","“从来、才是、不能改”连起来看，表现店里的人认定旧做法，不愿尝试改变。分析人物不要只贴“固执”的标签，要用这些话作依据。","“舒服吗？真不舒服！”是自问自答，叫设问。它把读者注意力引向实际感受，也为孩子尝试改帽子说明原因。","孩子心里问圆头为什么不能戴圆帽，是心理描写。他们还没有做成新帽子，但已开始发现问题、提出疑问。"],"tutorial":[{"title":"把重复读出不同效果","text":"作者依次写几顶帽子都是方的，像带着你沿橱窗一顶顶看。它强调数量多，却没有变化。"},{"title":"再看人物的理由","text":"店里把一直如此当成不能改变的理由。这句话最能回答“为什么固守旧做法”。"},{"title":"常考作用题怎样答","text":"先点出重复或排比，再说强调的是“许多帽子都一样”。不能只写“生动形象”。"}]},{"id":"hats-07","phase":"guided","type":"choice","title":"哪句话最能证明不愿改变？","kicker":"跟着找 · 人物要有证据","body":"有人判断：“这家店固守旧做法。”哪条证据最直接？","source":"金牌训练 P66–67；原创证据选择题","options":[{"id":"a","text":"橱窗是商店的玻璃窗。"},{"id":"b","text":"店里说：过去都做方帽子，所以不能改。"},{"id":"c","text":"街上的人很多。"}],"answer":"b","explanation":"这句话把“过去一直这样”当成拒绝改变的理由，直接表现了店里的想法。","repair":{"gap":"先看题目要证明哪一种想法。","reason":"人数和橱窗位置不能证明愿不愿意改变。","check":"找人物谈“改不改”的话，再选。"}},{"id":"hats-08","phase":"teach","type":"teach","title":"孩子不是只说“我不喜欢”","kicker":"讲课文 · 第 7—10 自然段","body":"孩子先做不同形状的纸帽，再想到用布，找来布试做。疑问变成了行动：发现不舒服 → 想办法 → 做出来试。","source":"金牌训练 P67–68；原页已核验","detail":["第7段：孩子用纸做圆形、尖形、香蕉形等帽子，感到舒服又漂亮。这与原来只有一种方帽形成对比。","第8—9段：一个孩子提出如果用布做，另一个补充戴起来会更舒服。“假如……”后面的话还未说完，这里的省略号表示话没说完，不是列举省略。","第10段：他们设法找布，真的试做圆帽子。把它扣在头上的样子比作碗，让形状容易想象。“设法”和“试着”说明他们动手尝试，不是只有空想。"],"tutorial":[{"title":"行动有三步","text":"孩子先用纸试不同形状；觉得合用后想到布；再找布动手做。办法在试做中逐步改进。"},{"title":"老师示范分析孩子","text":"题目若问“孩子善于尝试，依据在哪”，就找“做纸帽、找布、试圆帽”这些行动。"},{"title":"把证据连成回答","text":"孩子发现方帽不舒服后，试做不同帽子，并改用布，说明他们会把疑问变成实际尝试。下一题换你分析店主。"}]},{"id":"hats-09","phase":"teach","type":"teach","title":"争执中，动作比标签更有力","kicker":"讲课文 · 第 11—15 自然段","body":"店主看见儿子戴圆帽，抓起来丢在地上。儿子要拿回，捡起戴上跑走。同一顶帽子，让两种态度碰在一起。","source":"金牌训练 P68；第11—15段原图已核验，原创改述","detail":["第11段先写人群中出现几顶圆帽，再写店主最意外的是自己的儿子也戴了圆帽。意外一步加深，推动后面的争执。","店主命令儿子扔掉圆帽，并抓、丢帽子；儿子坚持要圆帽，后来捡起、戴上、跑走。语言和动作共同表现双方立场不同。","第11—15段共用了6个感叹号，让命令、不满、争执的语气更强。考试问作用时，不要只答“有感叹号”，要说双方情绪强烈、态度冲突。","这些细节帮助我们理解人物，不表示现实中遇到不同意见也要模仿“抓、丢、跑”。学到的是从证据认识态度，以及用尝试检验想法。"],"tutorial":[{"title":"只看这个争执片段","text":"店主抓起、丢掉圆帽；儿子捡起、戴上、跑走。抓住同一顶帽子上的相反动作。"},{"title":"从动作读出态度","text":"丢掉，是拒绝接受；捡回戴上，是坚持选择。写人物特点，要把态度和动作搭在一起。"},{"title":"接下来由你组织","text":"你可以选店主一个动作作证。用“他做了什么，这说明什么”说清，不必把全部动作抄一遍。"}],"reading":{"title":"读懂《方帽子店》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第11—15段 · 父子争执","text":"街上出现圆帽，最让店主吃惊的是自己的儿子也戴了圆帽。店主抓起圆帽，把它丢到地上，并坚持让儿子戴方帽。儿子要拿回圆帽，最后捡起、戴上，跑走了。店主拒绝改变，儿子坚持自己的新选择，两种态度在同一件事里显出来。"}]}},{"id":"hats-10","phase":"guided","type":"open","title":"先练一次带证据的回答","kicker":"跟着答 · 态度与依据","body":"如果说店主不愿接受新帽子，你能从刚才的争执中找到一个动作或一句话作证吗？说清它说明了什么。","source":"金牌训练 P68；原创人物分析短答","prompt":"按“他……，这让我看出……”说一句即可。不要只说“他很生气”。","reference":"例如：他把儿子的圆帽抓起来丢在地上，这让我看出他拒绝圆帽，不愿接受新的做法。也可引用他要求儿子不要圆帽的话，再解释拒绝改变的态度。","checklist":["找到店主的具体话语或动作","说明该证据与拒绝改变的关系","没有把故事中的一个人物说成所有大人"],"repair":{"gap":"“很生气”还没告诉别人你从哪里看出来。","reason":"人物判断需要具体动作或话语支撑。","check":"补一个“抓、丢”或拒绝圆帽的话，再解释。"},"responseSupport":[{"label":"从动作起笔","text":"他把圆帽……，这说明……","why":"用正文里的动作支持判断，比单说他生气更完整。"}]},{"id":"hats-11","phase":"teach","type":"teach","title":"顾客最后用选择给了答案","kicker":"讲课文 · 第 16—21 自然段","body":"孩子长大后做出适合不同季节的帽子。新旧两店出现后，顾客比较再选择。方帽子渐渐无人使用，成了文中的“古董”。","source":"金牌训练 P68–70；第16—21段原图与OCR互核","detail":["第16段，帽子不只改变形状，也适应季节：夏天有宽边的香蕉形草帽，冬天有圆筒形呢绒帽，春秋有碗形布帽。故事把“更合用”写具体了。","第17段，两家店的广告形成对比：旧店强调从不改变的方帽，新店强调各种式样和舒服。广告也能表现它们重视什么。","第18段，顾客在两家店前来回看、看了很久，说明先有犹豫与比较；最终进入新店。不能凭空加上“因为更便宜”，文中没有这个依据。","第19—21段，街上的帽子变得多样，店主依旧愤怒，方帽渐渐被淘汰。“气得几乎昏过去”用了夸张，突出店主强烈的反应。结尾交代结果，也让拒绝改进的后果更清楚。"],"tutorial":[{"title":"新帽到底新在哪里","text":"不仅帽形多，还分别适合夏季、冬季和春秋。它从人的需要出发。"},{"title":"顾客有一个变化过程","text":"先来回看、想很久，说明在比较和犹豫；最后进新店，说明作出了选择。"},{"title":"合理想象的范围","text":"你可以写顾客想试舒服的款式，因为文中有依据；不能直接说新帽半价，文中没提供价格。"}]},{"id":"hats-12","phase":"guided","type":"choice","title":"同样的省略号，作用相同吗？","kicker":"划重点 · 标点要放回句子","body":"甲：列出圆帽、尖帽、香蕉形帽……乙：“假如我们用布来做……”后面的话被接走。哪种理解正确？","source":"金牌训练 P66–67、P70；原创省略号辨析","options":[{"id":"a","text":"甲是列举未完；乙是话没说完。"},{"id":"b","text":"甲乙都说明人物说话害怕。"},{"id":"c","text":"甲是话没说完；乙是列举未完。"}],"answer":"a","explanation":"看省略号所在的句子：甲还可以继续列同类帽子，乙是在说一句尚未完成的话。","repair":{"gap":"先看省略号前面在做什么。","reason":"列名称，与说一半的设想，不是一回事。","check":"甲还能补帽子名称；乙要接后半句话。再选。"}},{"id":"hats-13","phase":"guided","type":"order","title":"起因、经过、结果连起来","kicker":"课文结构 · 故事不能倒过来","body":"把故事排顺。每一步都想一想：前一件事怎样引出了后一件事？","source":"金牌训练 P70；结构图原创改编","items":[{"id":"old","text":"起因：只做方帽，戴着不舒服；孩子产生疑问（1—6段）"},{"id":"try","text":"经过：孩子试做新帽，受到店主反对（7—15段）"},{"id":"result","text":"结果：新帽更合需要，顾客选择新店，方帽过时（16—21段）"}],"answer":["old","try","result"],"explanation":"因为旧帽不舒服，才出现尝试；因为新帽适合需要，才出现顾客的选择。这样讲出来的是因果，不只是事件名单。","repair":{"gap":"先找最初为什么想改帽子。","reason":"不舒服引出尝试，尝试后的效果引出选择。","check":"按“为什么做—怎样做—后来怎样”重排。"}},{"id":"hats-14","phase":"teach","type":"teach","title":"真正该带走的，不只是“要创新”","kicker":"主题归纳 · 改进要有用","body":"旧店把习惯当成理由，新店去解决不舒服。故事鼓励我们发现问题、尝试改进；改了以后，还要看是否真的更合用。","source":"金牌训练 P70–71；主题归纳原创讲解","detail":["主旨不是“方形一定坏、圆形一定好”，也不是“旧的一律丢、新的一定买”。文章中的问题是帽子不适合人，店主却拒绝改变。","回答“受到什么启发”，先说从故事中发现的道理，再给一个生活中能改进的真实做法，说明希望解决什么。只有“我要创新”还不够具体。","写作可学两点：一是用大人与孩子、旧店与新店的对比突出态度；二是用人物说的话、做的动作让读者自己看出人物特点。"],"tutorial":[{"title":"把结局和起因接上","text":"起因是方帽不舒服，旧店拒绝改进；结局是顾客选择更合用的新帽。道理藏在这条因果里。"},{"title":"别把道理说过头","text":"不是所有旧东西都该丢。该改的是已经不合需要、却仍被硬保留的做法。"},{"title":"老师示范一句启发","text":"先发现哪里不方便，再试一个改变，并比较实际效果。只有喊“我要创新”，别人还不知道你会做什么。"}]},{"id":"hats-15","phase":"recall","type":"recall","title":"不看提示，把故事讲顺","kicker":"遮挡回忆 · 三句话复述","body":"为什么有人想改帽子？他们怎样尝试？最后发生了什么？用自己的话说，保留最关键的原因和结果。","source":"金牌训练 P70–71；原创全文回忆","reference":"旧店只做方帽，戴起来不舒服，却不肯改变。孩子发现问题，试做各种新帽，店主反对；后来新帽更适合人们的需要，顾客选择新店，方帽渐渐过时。重点是原因、尝试、结果，不必背原句。"},{"id":"hats-16","phase":"independent","type":"open","title":"讲一个你没想到的片段","kicker":"自己来 · 重点复述任务","body":"选故事里最让你意外的一段。先说为什么意外，再按事情发生的顺序复述。人物做了什么，要讲清楚。","source":"金牌训练 P62目标、P69重点训练；原创任务提示","prompt":"你可以选父子争执，也可以选其他有依据的片段。先独立口述，再记几个关键词。","reference":"例如选父子争执：我没想到店主的儿子也喜欢圆帽。店主看到后很吃惊，抓起圆帽丢掉；儿子坚持要圆帽，捡起戴上，跑走了。也可选顾客最终换店等片段。允许自己的表达，不能把没有发生的事当原文事实。","checklist":["说清选的是哪个片段及意外之处","事情顺序与课文一致","包含关键人物的动作或话语","用自己的话，没有编造改变结果的新情节"],"repair":{"gap":"如果只说“他丢帽子”，听的人还不知前因。","reason":"复述要让没读过的人也跟得上。","check":"补上谁戴了什么、引起什么反应，再讲结果。"},"reading":{"title":"读懂《方帽子店》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第1—6段 · 老规矩遇到不舒服","text":"一家帽子店只做方帽子，店里认为过去一直这样做，以后也不能改。橱窗里一顶又一顶全是方的。圆头戴方帽，有的地方紧，有的地方太宽，确实不舒服。孩子们发现矛盾：既然头是圆的，为什么不试试圆帽？"},{"label":"第7—10段 · 从疑问到试做","text":"孩子先用纸做圆形、尖形、香蕉形等帽子，戴上后觉得舒服又好看。他们接着想：换成布会不会更舒服？于是找布，试着做出圆帽。这里有完整的尝试：发现问题，提出办法，实际制作，再看效果。"},{"label":"第11—15段 · 父子争执","text":"街上出现圆帽，最让店主吃惊的是自己的儿子也戴了圆帽。店主抓起圆帽，把它丢到地上，并坚持让儿子戴方帽。儿子要拿回圆帽，最后捡起、戴上，跑走了。店主拒绝改变，儿子坚持自己的新选择，两种态度在同一件事里显出来。"},{"label":"第16—17段 · 新帽子解决不同需要","text":"孩子长大后做出更多帽子：夏季用宽边草帽，冬季用呢绒帽，春秋用布帽。新店宣传款式多、戴着舒服；旧店仍强调方帽从不改变。新帽的价值不只是形状新，而是适合人和季节。"},{"label":"第18段 · 顾客比较之后选择","text":"顾客站在两家店前，来回看、想了很久，最后走进新店。文章没有写价格或赠品；解释他们的选择，要根据帽子的舒适、款式和季节需要。可以想象顾客的心声，但要说明这是根据故事作的合理想象。"},{"label":"第19—21段 · 结局回到最初的问题","text":"街上各式新帽越来越多，店主仍然很生气。方帽渐渐没人戴，成了文中的“古董”。老店被淘汰的原因，是不合用却拒绝改进。故事提醒我们用实际需要和效果检验办法，不能只用“一直如此”作理由。"}]},"responseSupport":[{"label":"先交代前因","text":"让我意外的是……。当时……","why":"先说你的意外和发生条件，接下来由你复述事件。"},{"label":"按事情顺序接","text":"接着……，最后……","why":"只在确有先后事件时使用，不替你添加新情节。"}]},{"id":"hats-17","phase":"independent","type":"open","title":"顾客犹豫时，可能在想什么？","kicker":"自己来 · 想象要有边界","body":"顾客在两家店前看了好久，最后去了新店。请补出一个合理的心里想法，并说明你根据哪处内容想的。","source":"金牌训练 P69–70；顾客心理训练原创改编","prompt":"两三句就够。文中没写价格，不能拿便宜当已经知道的原因。","reference":"例如：我过去总戴方帽，有些不习惯换。但方帽戴着不舒服，新店的帽子有不同式样，也许能挑到合适的，我想试试。依据是旧帽不舒服、两店广告不同，以及顾客先比较再进新店。","checklist":["想法能解释先犹豫、后选择","引用了舒服、款式或比较等文中依据","没有把价格、赠品等自己加的条件当原文事实"],"repair":{"gap":"先分清“可以想象”和“文中有依据”。","reason":"顾客的心声要贴着他眼前看到的两家店。","check":"回到两则广告，重说一个选择理由。"},"reading":{"title":"读懂《方帽子店》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第16—17段 · 新帽子解决不同需要","text":"孩子长大后做出更多帽子：夏季用宽边草帽，冬季用呢绒帽，春秋用布帽。新店宣传款式多、戴着舒服；旧店仍强调方帽从不改变。新帽的价值不只是形状新，而是适合人和季节。"},{"label":"第18段 · 顾客比较之后选择","text":"顾客站在两家店前，来回看、想了很久，最后走进新店。文章没有写价格或赠品；解释他们的选择，要根据帽子的舒适、款式和季节需要。可以想象顾客的心声，但要说明这是根据故事作的合理想象。"}]},"responseSupport":[{"label":"标清这是想象","text":"我想顾客也许在想：“……”","why":"顾客内心没有直接写出，表达时保持合理推测。"}]},{"id":"hats-18","phase":"teach","type":"teach","title":"问题很多，先抓哪一个？","kicker":"解习题 · 四个角度筛问题","body":"可以问内容、人物、主旨、生活启发。先选能解释人物为何这样做、故事为何这样结束的问题，再研究细节。","source":"金牌训练 P71–72；四角度表已对照原图","detail":["内容理解：谁做了什么，情节怎样发展？例如孩子为什么做圆帽。人物分析：人物怎样想，为什么这样做？例如店主为什么扔圆帽。","主旨理解：故事想提醒我们什么？例如旧店为什么失去顾客。生活延伸：我们身边有没有明明不合用，却一直沿用的做法？","筛选不是说细节问题全没用。“呢绒是什么”能帮我们理解材料，但如果时间有限，“方帽为什么被淘汰”更能连起人物、情节与道理。细节可以随后查。","读书时先列问题，再比较：回答它，能不能让整篇故事更清楚？如果能，就值得优先研究。"],"tutorial":[{"title":"先选能读懂全文的问题","text":"“方帽为什么过时”能连起不舒服、拒绝改进和顾客选择，值得先研究。"},{"title":"再安放小问题","text":"“呢绒是什么”帮助理解帽子材料，也有用；但它不能单独解释整篇结局。"},{"title":"你的筛选方法","text":"问自己：这个问题解决后，人物为什么这样做、故事为什么这样结束，会不会更清楚？"}]},{"id":"hats-19","phase":"independent","type":"choice","title":"先研究哪个，最能读懂全篇？","kicker":"自己来 · 选择有用的问题","body":"只剩一点时间，你先研究哪一个问题，最能把人物、情节和结果连起来？","source":"金牌训练 P71–72；原创筛选题","options":[{"id":"a","text":"橱窗究竟有多宽？"},{"id":"b","text":"店主的衣服是什么颜色？"},{"id":"c","text":"戴着不舒服，旧店为何不改？这怎样影响最后的结果？"}],"answer":"c","explanation":"这个问题连起“不舒服—拒绝改变—失去顾客”，能帮助理解人物和主旨。前两问在文中也未必有答案。","repair":{"gap":"先想：答完这个问题，能懂哪件重要的事？","reason":"理解人物选择和故事结局，比猜装饰细节更接近主线。","check":"选能连起起因与结果的一问。"}},{"id":"hats-20","phase":"transfer","type":"open","title":"换到学校里，你怎样改进？","kicker":"换情境 · 生活迁移与收束","body":"班级一直按身高放雨伞，但放学取伞很拥堵。有人说：“以前就这样，别改。”你会怎样试一个改进？","source":"依金牌训练 P72“结合生活谈启发”原创迁移","prompt":"说清：现在的问题是什么？想改变哪一处？怎样知道改后更好？不必一次想出完美办法。","reference":"例：问题是大家挤在同一处取伞。可尝试按放学队伍分区放伞，先试一天，再看取伞是否更顺、不拿错。原方法若仍适合某些情况，可以保留；关键是用实际效果检查改进。","checklist":["指出取伞拥堵这个实际问题","提出与问题相关、可以尝试的改变","说明如何观察效果，而非只说新办法一定好"],"repair":{"gap":"先说你要解决哪件不方便的事。","reason":"只是换一个新规则，还不等于解决问题。","check":"补一句：试过后，看什么变化来判断好不好。"},"detail":["本课后续常见任务：读写字词；用语言动作分析人物；解释排比、省略号、感叹号的作用；按起因经过结果复述；讲最意外的片段；筛选有价值的问题；联系生活说明启发。开放回答保留自查与待复看，不能只因点了完成就视为掌握。"]}],"reading":{"title":"读懂《方帽子店》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第1—6段 · 老规矩遇到不舒服","text":"一家帽子店只做方帽子，店里认为过去一直这样做，以后也不能改。橱窗里一顶又一顶全是方的。圆头戴方帽，有的地方紧，有的地方太宽，确实不舒服。孩子们发现矛盾：既然头是圆的，为什么不试试圆帽？"},{"label":"第7—10段 · 从疑问到试做","text":"孩子先用纸做圆形、尖形、香蕉形等帽子，戴上后觉得舒服又好看。他们接着想：换成布会不会更舒服？于是找布，试着做出圆帽。这里有完整的尝试：发现问题，提出办法，实际制作，再看效果。"},{"label":"第11—15段 · 父子争执","text":"街上出现圆帽，最让店主吃惊的是自己的儿子也戴了圆帽。店主抓起圆帽，把它丢到地上，并坚持让儿子戴方帽。儿子要拿回圆帽，最后捡起、戴上，跑走了。店主拒绝改变，儿子坚持自己的新选择，两种态度在同一件事里显出来。"},{"label":"第16—17段 · 新帽子解决不同需要","text":"孩子长大后做出更多帽子：夏季用宽边草帽，冬季用呢绒帽，春秋用布帽。新店宣传款式多、戴着舒服；旧店仍强调方帽从不改变。新帽的价值不只是形状新，而是适合人和季节。"},{"label":"第18段 · 顾客比较之后选择","text":"顾客站在两家店前，来回看、想了很久，最后走进新店。文章没有写价格或赠品；解释他们的选择，要根据帽子的舒适、款式和季节需要。可以想象顾客的心声，但要说明这是根据故事作的合理想象。"},{"label":"第19—21段 · 结局回到最初的问题","text":"街上各式新帽越来越多，店主仍然很生气。方帽渐渐没人戴，成了文中的“古董”。老店被淘汰的原因，是不合用却拒绝改进。故事提醒我们用实际需要和效果检验办法，不能只用“一直如此”作理由。"}]},"segments":[{"id":"hats-story","title":"读懂变化与人物态度","startStepId":"hats-01","endStepId":"hats-10","minutes":17,"goal":"从动作与使用效果认识人物","scene":"hotel","check":"用店主一个动作说明他对新帽的态度。"},{"id":"hats-tell","title":"讲顺故事，再迁移方法","startStepId":"hats-11","endStepId":"hats-20","minutes":13,"goal":"复述片段，有依据地想象和谈启发","scene":"train","check":"自己复述一个片段，说明意外在哪里。"}],"unit":2,"reader":{"author":"施雁冰","pages":"P66–70","core":"顺着“不舒服→试着改→人们选择”读懂故事。","hook":"圆脑袋戴方帽子，真的舒服吗？","groups":[[0,2,"从来","这家店一直只做方帽子。","“一直这样做”就是他们不肯改的理由。"],[3,5,"真不舒服","帽子不合适，孩子提出疑问。","大人只看旧习惯，孩子开始看戴着舒不舒服。"],[6,9,"试着","孩子先用纸，再用布做帽子。","不光是想一想，还亲手试了才知道。"],[10,14,"大吃一惊","父亲反对，儿子仍喜欢圆帽子。","试着读出父子不同的语气，听听他们的态度。"],[15,17,"舒服","新帽子照顾了形状和季节的需要。","人们最后选择新店，因为帽子合用。"],[18,19,"古董","方帽子渐渐没人戴了。","故事提醒我们：发现不合适，可以试着改。"]],"tests":[{"q":"孩子们为什么要改帽子？后来做了什么？","ref":"方帽子不舒服。他们提出疑问，用纸和布尝试新样式，后来按季节做不同帽子。","back":3,"modelAnswer":"孩子们觉得方帽子戴着不舒服，所以想改变帽子的形状。他们先用纸做圆帽子，后来用布做，试出了更合适的样式。长大后，他们还按季节制作不同的帽子，让人们戴得舒服。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"读父子争帽子的一段，用两种语气说出他们不同的想法。","ref":"父亲坚持旧帽子、反对改变；儿子喜欢圆帽子，想继续戴。语气要让人听出这个不同。","back":10,"modelAnswer":"父亲坚持戴方帽子，反对儿子戴圆帽子；儿子觉得圆帽子好，想继续戴。\n读父亲的“快快把它丢掉！”时，我会用生气、命令的语气；读儿子的“我要！我要！”时，我会用着急又坚持的语气，表现他不愿放弃圆帽子。","answerKind":"完整回答与朗读示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"如果新帽子好看却扎头，你还会买它吗？用故事里的道理说说。","ref":"可以不买。改变要看实际需要和是否舒服，不能只因为它“新”就选。","back":15,"modelAnswer":"我不会买。帽子好看却扎头，仍然不适合戴。故事里的新帽子受到欢迎，是因为它们符合人们的实际需要、戴着舒服。因此，选择帽子既要看样子，也要看是否合用，不能只因为它新就买。","answerKind":"表达示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"kind":"article","paragraphs":[{"text":"这家帽子店从来没有做过别的帽子。","anchor":"从来","meaning":"这家店一直只做方帽子。","why":"“一直这样做”就是他们不肯改的理由。","label":"第 1 段"},{"text":"他们的橱窗里都是方帽子。第一顶是方的，第二顶是方的，第三顶还是方的……","anchor":"","meaning":"这家店一直只做方帽子。","why":"“一直这样做”就是他们不肯改的理由。","label":"第 2 段"},{"text":"问他们为什么只做方帽子，他们总是这样回答：“我们从来都是做方帽子，方帽子才是好帽子，不能改的。”","anchor":"从来","meaning":"这家店一直只做方帽子。","why":"“一直这样做”就是他们不肯改的理由。","label":"第 3 段"},{"text":"做帽子的人做方帽子，买帽子的人买方帽子。我们常常可以看见戴着方帽子的人在马路上走着。他们圆圆的脑袋藏在方帽子里，紧的地方太紧，宽的地方太宽，冬天戴着不太暖，夏天戴着却热得满头汗。舒服吗？真不舒服！","anchor":"真不舒服","meaning":"帽子不合适，孩子提出疑问。","why":"大人只看旧习惯，孩子开始看戴着舒不舒服。","label":"第 4 段"},{"text":"小孩子们觉得方帽子又奇怪又不舒服，他们想，圆圆的头为什么戴方帽子呢？圆的不行吗？","anchor":"","meaning":"帽子不合适，孩子提出疑问。","why":"大人只看旧习惯，孩子开始看戴着舒不舒服。","label":"第 5 段"},{"text":"大人们总是这样回答：“因为一直以来都是这样的。”","anchor":"","meaning":"帽子不合适，孩子提出疑问。","why":"大人只看旧习惯，孩子开始看戴着舒不舒服。","label":"第 6 段"},{"text":"小孩子们可不喜欢戴方方的帽子，他们喜欢用纸做出圆的、尖的、香蕉形的帽子，戴在头上，又舒服又漂亮。","anchor":"","meaning":"孩子先用纸，再用布做帽子。","why":"不光是想一想，还亲手试了才知道。","label":"第 7 段"},{"text":"“假如我们用布做成真的帽子……”一个小孩子说。","anchor":"","meaning":"孩子先用纸，再用布做帽子。","why":"不光是想一想，还亲手试了才知道。","label":"第 8 段"},{"text":"“那戴在头上就更舒服了。”另一个小孩子接着说。","anchor":"","meaning":"孩子先用纸，再用布做帽子。","why":"不光是想一想，还亲手试了才知道。","label":"第 9 段"},{"text":"他们设法找到一些布，试着做了几顶圆帽子，像碗一样扣在头上，很舒服。","anchor":"试着","meaning":"孩子先用纸，再用布做帽子。","why":"不光是想一想，还亲手试了才知道。","label":"第 10 段"},{"text":"街上人山人海。在密密麻麻的方帽子中，忽然出现了几顶圆帽子，方帽子店的主人大吃一惊。最让他吃惊的是，自己的儿子也戴了一顶圆帽子！","anchor":"大吃一惊","meaning":"父亲反对，儿子仍喜欢圆帽子。","why":"试着读出父子不同的语气，听听他们的态度。","label":"第 11 段"},{"text":"“快快把它丢掉！”方帽子店的主人抓起圆帽子，丢在地上。","anchor":"","meaning":"父亲反对，儿子仍喜欢圆帽子。","why":"试着读出父子不同的语气，听听他们的态度。","label":"第 12 段"},{"text":"“我要！我要！”儿子嚷嚷着。","anchor":"","meaning":"父亲反对，儿子仍喜欢圆帽子。","why":"试着读出父子不同的语气，听听他们的态度。","label":"第 13 段"},{"text":"“不懂事的孩子！好好的方帽子不戴，要戴圆帽子！”","anchor":"","meaning":"父亲反对，儿子仍喜欢圆帽子。","why":"试着读出父子不同的语气，听听他们的态度。","label":"第 14 段"},{"text":"儿子不理他，拾起圆帽子戴在头上，一溜烟似的跑了。","anchor":"","meaning":"父亲反对，儿子仍喜欢圆帽子。","why":"试着读出父子不同的语气，听听他们的态度。","label":"第 15 段"},{"text":"孩子们慢慢地长大了，想出了许多帽子的式样，碗形的、香蕉形的、圆筒形的……夏天戴宽边的香蕉形的草帽，冬天戴圆筒形的呢绒帽，春天和秋天戴碗形的布帽。","anchor":"","meaning":"新帽子照顾了形状和季节的需要。","why":"人们最后选择新店，因为帽子合用。","label":"第 16 段"},{"text":"后来，方帽子店对面，又开了一家帽子店，橱窗里放着各式各样的帽子，却没有一顶是方的。方帽子店里摆放着方方正正的帽子，却没有一顶是圆的，玻璃橱窗里还贴了一张广告：“专卖从不改变的方的好帽子。”对面的新帽子店里也贴了一张广告：“专卖各式各样的舒服的好帽子。”","anchor":"舒服","meaning":"新帽子照顾了形状和季节的需要。","why":"人们最后选择新店，因为帽子合用。","label":"第 17 段"},{"text":"顾客们在方帽子店门前站一会儿，又到新帽子店门前站一会儿，不知道买哪一种好。他们在两家的橱窗前看了好久，最后还是进了新帽子店。","anchor":"","meaning":"新帽子照顾了形状和季节的需要。","why":"人们最后选择新店，因为帽子合用。","label":"第 18 段"},{"text":"路上的行人已经变了样子，夏天戴着宽边的香蕉形的草帽，冬天戴着圆筒形的呢绒帽……","anchor":"","meaning":"方帽子渐渐没人戴了。","why":"故事提醒我们：发现不合适，可以试着改。","label":"第 19 段"},{"text":"那些不舒服的方帽子，慢慢地成为古董。","anchor":"古董","meaning":"方帽子渐渐没人戴了。","why":"故事提醒我们：发现不合适，可以试着改。","label":"第 20 段"}],"poem":false,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P66–70；按该书课文录入，省去注音与教参批注。","media":null}},{"id":"tianji","title":"田忌赛马","date":null,"minutes":28,"bookPages":"P73–80","unit":2,"goal":"看清比赛规则和马力条件，理解调整出场顺序怎样改变总结果。","source":"金牌训练·同步教材 P73–80；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"读准这一课的关键词","body":"读一遍，圈出不熟的字。先看结构和意思，再回课文读通。","detail":["会写字：本课为略读课，无新增会写字表","会认字：忌 jì、将 jiàng、获 huò、赢 yíng、拳 quán、跃 yuè、恍 huǎng、悟 wù、谋 móu、划 huà、策 cè、荐 jiàn","词语：赏识、摩拳擦掌、跃跃欲试、兴致勃勃、不动声色、出谋划策","将来jiāng、大将jiàng；划船huá、计划huà；差错chā、差不多chà、公差chāi、参差cī。"],"id":"tianji-01","source":"P73–80","kicker":"按书细读","tutorial":[{"title":"带着总问题读故事","text":"一匹马都不换，为什么总结果能变？先读完整讲读页，尤其留意孙膑观察到的条件。"},{"title":"认准关键字词","text":"田忌jì，孙膑bìn，大将jiàng，计划huà，赢yíng，出谋划策móu huà cè。"},{"title":"词语联系赛前画面","text":"摩拳擦掌、跃跃欲试写急着上场；兴致勃勃写观众很有兴趣。它们写的是谁，别混在一起。"}]},{"type":"recall","phase":"recall","title":"遮住拼音，读出关键人名与词语","prompt":"先遮住字词提示，读“田忌、大将、出谋划策、赢”；记下还不稳的读音。本课先要求认读，不另加整页抄写。","reference":"田忌jì；大将jiàng；出谋划策móu huà cè；赢yíng。再把词放回比赛故事中读通。","checklist":["我先遮住拼音认读了","我对照本课拼音核对了读音","还不稳的读音已留下，没有记成默写"],"id":"tianji-02","source":"P73–80","kicker":"遮住讲回"},{"type":"model","phase":"guided","title":"亲手排三场比赛","body":"先按上、中、下跑一次，再换田忌的顺序，比较三局总成绩。","model":"race","config":{},"id":"tianji-03","source":"P73–80","kicker":"跟着推演","reading":{"title":"读懂《田忌赛马》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第1—2段 · 孙膑先看清条件","text":"孙膑是田忌的门客，田忌欣赏他的才能。孙膑看了几场赛马，发现双方马的脚力相差不多，而且都能分成上、中、下三等。这两个发现，给调整出场顺序留下了可能。"},{"label":"第3—9段 · 不换马，改变安排","text":"孙膑说自己有办法取胜。田忌以为要换更好的马，孙膑却说一匹也不用换。他已经认真想过安排，所以很有把握。田忌信任他，决定按他的办法再约比赛。办法能实施，也需要听取建议的人。"},{"label":"第10段 · 比赛即将开始","text":"比赛双方都急着一试身手，观众也兴致很高。就在这时，孙膑把田忌叫到一旁，悄悄告诉他出场安排。读到这里，读者也想知道：不换马，究竟怎样赢？"},{"label":"第11段 · 第一局输了，仍不着急","text":"田忌的下等马对齐威王的上等马，齐王的马跑在前面。田忌输了这一局，却不动声色。这次失利在原先计划中；他要争的是三局总胜负。"},{"label":"第12—14段 · 两场优势换来全场胜利","text":"第二局，田忌用上等马对齐王中等马，获胜后微微一笑。第三局，他用中等马对齐王下等马，又赢了，才满意地笑。总计两胜一负，田忌赢下整场。马没有变快，变的是对阵关系。"}]}},{"type":"recall","phase":"recall","title":"不看模型，说明关键","prompt":"田忌没有换马，为什么能改变结果？什么条件不能漏？","reference":"把下等马对齐王上等马，上等对中等，中等对下等，争取两胜。需双方各级马力相差不大、三局按胜局数定胜负；不是任何换顺序都有效。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"tianji-04","source":"P73–80","kicker":"遮住讲回"},{"type":"teach","phase":"teach","title":"第1–9段：先观察，再献策","body":"孙膑先看马力和比赛，再提出办法。田忌的信任让办法能够实施。","detail":["相同等级马的脚力相差不大，是换序能有两局优势的条件。上、中、下分级提供调配空间。不是临场凭运气，也不是马突然跑快。"],"id":"tianji-05","source":"P73–80","kicker":"按书细读","tutorial":[{"title":"先观察，才有把握","text":"同等级马力差得不多，又分三等，才可能用较高等级争取两局优势。"},{"title":"为什么还写那段对话","text":"田忌起初想到换马，孙膑说明不用换；田忌最终选择信任，安排才能执行。"},{"title":"老师示范：孙膑聪明在哪","text":"我先找他的行为“看比赛、发现分级和差距”，再接“据此调整对阵”。只写足智多谋，还没有证据。"}]},{"type":"choice","phase":"independent","title":"哪条条件支撑计策？","body":"假如田忌最快的马也远慢于齐王最慢的马，仅换顺序会怎样？","options":[{"id":"0","text":"仍一定两胜"},{"id":"1","text":"不能靠这个办法保证赢"},{"id":"2","text":"一定三胜"}],"answer":"1","explanation":"计策利用跨等级优势；若这个优势不存在，原来的胜负推理就不成立。","repair":{"gap":"先看题目要你比较什么。","reason":"计策利用跨等级优势；若这个优势不存在，原来的胜负推理就不成立。","check":"回到原题，用这个依据再判断。"},"id":"tianji-06","source":"P73–80","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"第10–16段：结果逐局出现","body":"一场输了，不能立刻判断全场输了。看表情时，也要连上整体安排。","detail":["第一局下对上败，田忌不动声色；第二局上对中胜，微微一笑；第三局中对下胜，满意地笑。结尾齐王问计，孙膑被推荐为军师。"],"id":"tianji-07","source":"P73–80","kicker":"按书细读","tutorial":[{"title":"老师先示范第一局","text":"题目问“不着急的原因”。定位第11段，看见下等对上等；再联系前面的安排，知道这一负在预料中。"},{"title":"把理由说完整","text":"他早知道第一局可能输，计划是争后两局、赢全场，所以这时不着急。"},{"title":"现在继续读后两局","text":"第二场只赢一局，第三场才确定两胜。留意“微微”和“满意”怎样随全场形势改变。"}]},{"type":"order","phase":"independent","title":"把观察变成结果","body":"按事情发生或方法使用的顺序，依次点选。","items":[{"id":"0","text":"看清分级和脚力差距"},{"id":"1","text":"设计三场对阵"},{"id":"2","text":"田忌采纳办法"},{"id":"3","text":"第一局败、后两局胜"},{"id":"4","text":"说明计策，推荐孙膑"}],"answer":["0","1","2","3","4"],"explanation":"先有条件和谋划，才有比赛验证；不能把获胜当成没有原因的巧合。","repair":{"gap":"找出前一步给后一步带来的条件。","reason":"先有条件和谋划，才有比赛验证；不能把获胜当成没有原因的巧合。","check":"先放起点，再连起因果。"},"id":"tianji-08","source":"P73–80","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"用图讲比赛","prompt":"画两列三行，一列齐王、一列田忌，写每局等级与胜负，再说明为什么不是换马。","reference":"齐王上中下，田忌下上中；田忌负胜胜，总两胜。画的是出场对应关系，马本身没换。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"tianji-09","source":"P73–80","kicker":"课后题与常见考法","responseSupport":[{"label":"先搭对阵表","text":"齐王：上、中、下；田忌：……","why":"齐王顺序作固定参照，田忌顺序和胜负由你填写。"}]},{"type":"choice","phase":"independent","title":"人物判断要有依据","body":"“孙膑善于思考”最直接的依据是什么？","options":[{"id":"0","text":"他被叫作孙膑"},{"id":"1","text":"他观察条件并设计能取两胜的顺序"},{"id":"2","text":"看热闹的人很多"}],"answer":"1","explanation":"人物品质要从观察、分析和行动找到依据。","repair":{"gap":"先看题目要你比较什么。","reason":"人物品质要从观察、分析和行动找到依据。","check":"回到原题，用这个依据再判断。"},"id":"tianji-10","source":"P73–80","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"从赛马到看问题","body":"有时看整局，比只争一局更重要。使用计策还要检查规则和条件。","detail":["原书拓展联系“抓关键”的思路。用到新情境时，先明确整体目标；不能把课文简化成遇到什么事都先故意输。"],"id":"tianji-11","source":"P73–80","kicker":"按书细读","tutorial":[{"title":"复述有两条线","text":"故事线：观察—献策—实施—获胜。比赛线：下对上、上对中、中对下。前者讲原因，后者讲办法。"},{"title":"人物题别只贴标签","text":"说孙膑善思考，补他的观察与调序；说田忌听得进建议，补他信任并实施。"},{"title":"把方法带出去前先查条件","text":"新比赛若规则或能力差距不同，就要重新分析。不能把“先输一场”当万能秘诀。"}]},{"type":"open","phase":"independent","title":"独立答课后问题","prompt":"复述比赛过程，并解释田忌为什么从不动声色到满意地笑。","reference":"比赛按事先安排逐步实现预期；每局表情与总策略相连。第一次输并不意外，最终两胜完成目标。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"tianji-12","source":"P73–80","kicker":"课后题与常见考法","reading":{"title":"读懂《田忌赛马》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第11段 · 第一局输了，仍不着急","text":"田忌的下等马对齐威王的上等马，齐王的马跑在前面。田忌输了这一局，却不动声色。这次失利在原先计划中；他要争的是三局总胜负。"},{"label":"第12—14段 · 两场优势换来全场胜利","text":"第二局，田忌用上等马对齐王中等马，获胜后微微一笑。第三局，他用中等马对齐王下等马，又赢了，才满意地笑。总计两胜一负，田忌赢下整场。马没有变快，变的是对阵关系。"}]},"responseSupport":[{"label":"把表情和局势对应","text":"第……局时，他……，因为……","why":"答的是每次态度变化的原因，不能只把三种表情抄完。"}]},{"type":"open","phase":"transfer","title":"换个三局任务","prompt":"三人各擅长不同项目，要比赛三项。只把最强的人放第一项够吗？还要查什么？","reference":"查每人特长、每项对手和总分规则，再安排；不能照搬赛马顺序而不看新条件。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"tianji-13","source":"P73–80","kicker":"换个情境"},{"id":"tianji-end","type":"teach","phase":"transfer","title":"留好这一课的接续点","body":"把这次能自己说明的一点留下，再记一处还需帮助的地方。现在可以保存并休息，下次从未完处接着学。","source":"P73–80","tutorial":[{"title":"这次的学习目标","text":"看清比赛规则和马力条件，理解调整出场顺序怎样改变总结果。"},{"title":"完成与学会分开","text":"看过讲解、跟着完成、自己能说、隔天还能说，是不同情况。只记录这次真实做到了哪一步。"}]}],"reading":{"title":"读懂《田忌赛马》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"第1—2段 · 孙膑先看清条件","text":"孙膑是田忌的门客，田忌欣赏他的才能。孙膑看了几场赛马，发现双方马的脚力相差不多，而且都能分成上、中、下三等。这两个发现，给调整出场顺序留下了可能。"},{"label":"第3—9段 · 不换马，改变安排","text":"孙膑说自己有办法取胜。田忌以为要换更好的马，孙膑却说一匹也不用换。他已经认真想过安排，所以很有把握。田忌信任他，决定按他的办法再约比赛。办法能实施，也需要听取建议的人。"},{"label":"第10段 · 比赛即将开始","text":"比赛双方都急着一试身手，观众也兴致很高。就在这时，孙膑把田忌叫到一旁，悄悄告诉他出场安排。读到这里，读者也想知道：不换马，究竟怎样赢？"},{"label":"第11段 · 第一局输了，仍不着急","text":"田忌的下等马对齐威王的上等马，齐王的马跑在前面。田忌输了这一局，却不动声色。这次失利在原先计划中；他要争的是三局总胜负。"},{"label":"第12—14段 · 两场优势换来全场胜利","text":"第二局，田忌用上等马对齐王中等马，获胜后微微一笑。第三局，他用中等马对齐王下等马，又赢了，才满意地笑。总计两胜一负，田忌赢下整场。马没有变快，变的是对阵关系。"},{"label":"第15—16段 · 智慧得到认可","text":"齐威王发现安排很巧，询问是谁出的主意。田忌如实说明，并推荐孙膑。后来孙膑被任命为军师。故事从欣赏才能写到信任建议，最后用结果验证了孙膑的观察和思考。"}]},"segments":[{"id":"tianji-match","title":"看条件，亲排三场","startStepId":"tianji-01","endStepId":"tianji-07","minutes":16,"goal":"理解调序改变两局优势的条件","scene":"hotel","check":"不看模型说清哪三组对阵、为什么不是换马。"},{"id":"tianji-evidence","title":"讲比赛，解释人物表情","startStepId":"tianji-08","endStepId":"tianji-end","minutes":12,"goal":"用比赛局势解释态度变化","scene":"train","check":"把三次表情与每一局、整场目标联系起来。"}],"reader":{"author":"根据《史记·孙子吴起列传》相关内容改写","pages":"P76–78","core":"马没换，换的是三场的对阵顺序。","hook":"第一场输了，为什么还不着急？","groups":[[0,1,"脚力相差不多","孙膑先看清马的实力。","马分三等、实力相近，才有这样安排的可能。"],[2,8,"一匹也不用换","孙膑想换顺序，不换马。","“胸有成竹”是心中已有办法。办法来自观察。"],[9,10,"不动声色","先用下等马对上等马，输了。","这是计划中的一场，后面还有两场。"],[11,13,"胜两场输一场","再用上对中、中对下，赢了两场。","看整场比赛，不能只看第一场。"],[14,15,"出场顺序","齐威王发现赢在安排上。","复述时，把哪匹对哪匹说清楚。"]],"tests":[{"q":"按三场顺序说：田忌分别拿哪匹马对齐威王的哪匹马？","ref":"下对上、上对中、中对下。结果一负两胜。","back":10,"modelAnswer":"第一场，田忌用下等马对齐威王的上等马，输了。\n第二场，田忌用上等马对齐威王的中等马，赢了。\n第三场，田忌用中等马对齐威王的下等马，也赢了。\n三场合起来，田忌两胜一负，赢得比赛。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"孙膑为什么有把握？他先看到了什么？","ref":"他观察到马的脚力相差不多，而且能分三等，再考虑如何安排对阵。","back":1,"modelAnswer":"孙膑先观察到双方的马脚力相差不多，都能分成上、中、下三等。他据此安排田忌的下等马对对方上等马，再用己方上等马、中等马分别对对方中等马、下等马，争取赢下两场，所以有把握。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"如果对方最慢的马也比我方最快的快，照搬这个顺序还能赢吗？","ref":"不能。换顺序有用，是因为合适的对阵中有取胜机会。条件变了，要重新想办法。","back":1,"modelAnswer":"不能。假如对方最慢的马都比我方最快的马快，那么我方任何一匹马对上对方任何一匹马，都没有速度优势。原来的安排能赢，是因为其中两组对阵有取胜机会；条件改变了，不能照搬顺序。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"kind":"article","paragraphs":[{"text":"孙膑是齐国大将田忌的门客，田忌对他非常赏识。","anchor":"","meaning":"孙膑先看清马的实力。","why":"马分三等、实力相近，才有这样安排的可能。","label":"第 1 段"},{"text":"田忌经常同齐威王及贵族们赛马。孙膑看了几场比赛后发现，大家的马脚力相差不多，且都能分成上、中、下三等。","anchor":"脚力相差不多","meaning":"孙膑先看清马的实力。","why":"马分三等、实力相近，才有这样安排的可能。","label":"第 2 段"},{"text":"一天，孙膑对田忌说：“将军，我有个办法，保证能让您在赛马时获胜。”","anchor":"","meaning":"孙膑想换顺序，不换马。","why":"“胸有成竹”是心中已有办法。办法来自观察。","label":"第 3 段"},{"text":"田忌问道：“你是说换几匹更好的马？”","anchor":"","meaning":"孙膑想换顺序，不换马。","why":"“胸有成竹”是心中已有办法。办法来自观察。","label":"第 4 段"},{"text":"孙膑说：“一匹也不用换。”","anchor":"一匹也不用换","meaning":"孙膑想换顺序，不换马。","why":"“胸有成竹”是心中已有办法。办法来自观察。","label":"第 5 段"},{"text":"田忌有些不明白：“那怎么能有赢的把握呢？”","anchor":"","meaning":"孙膑想换顺序，不换马。","why":"“胸有成竹”是心中已有办法。办法来自观察。","label":"第 6 段"},{"text":"孙膑胸有成竹地说：“将军请放心，按照我的主意办，一定能让您赢。”","anchor":"","meaning":"孙膑想换顺序，不换马。","why":"“胸有成竹”是心中已有办法。办法来自观察。","label":"第 7 段"},{"text":"田忌很信任孙膑，决定全听他的。","anchor":"","meaning":"孙膑想换顺序，不换马。","why":"“胸有成竹”是心中已有办法。办法来自观察。","label":"第 8 段"},{"text":"于是，田忌又同齐威王及贵族们约好一起赛马。","anchor":"","meaning":"孙膑想换顺序，不换马。","why":"“胸有成竹”是心中已有办法。办法来自观察。","label":"第 9 段"},{"text":"田忌和齐威王的对阵就要开始了。比赛双方摩拳擦掌，跃跃欲试。观众们也兴致勃勃地猜测着比赛结果。就在这时，孙膑把田忌请到一边，悄悄地把办法告诉了他。","anchor":"","meaning":"先用下等马对上等马，输了。","why":"这是计划中的一场，后面还有两场。","label":"第 10 段"},{"text":"比赛开始了。第一场，田忌先用下等马对齐威王的上等马，齐威王的马遥遥领先。田忌输了，但他不动声色，一点儿都不着急。","anchor":"不动声色","meaning":"先用下等马对上等马，输了。","why":"这是计划中的一场，后面还有两场。","label":"第 11 段"},{"text":"接着，第二场比赛开始了。田忌用上等马对齐威王的中等马，胜了第二场。田忌微微一笑。","anchor":"","meaning":"再用上对中、中对下，赢了两场。","why":"看整场比赛，不能只看第一场。","label":"第 12 段"},{"text":"第三场，田忌用中等马对齐威王的下等马，又胜了一场。田忌满意地笑了。","anchor":"","meaning":"再用上对中、中对下，赢了两场。","why":"看整场比赛，不能只看第一场。","label":"第 13 段"},{"text":"比赛结束了。田忌胜两场输一场，赢了齐威王。","anchor":"胜两场输一场","meaning":"再用上对中、中对下，赢了两场。","why":"看整场比赛，不能只看第一场。","label":"第 14 段"},{"text":"齐威王好奇地问田忌：“你这样安排马的出场顺序，是不是有人给你出谋划策？”","anchor":"出场顺序","meaning":"齐威王发现赢在安排上。","why":"复述时，把哪匹对哪匹说清楚。","label":"第 15 段"},{"text":"田忌如实相告，并把孙膑引荐给齐威王。后来，齐威王任命孙膑为军师。","anchor":"","meaning":"齐威王发现赢在安排上。","why":"复述时，把哪匹对哪匹说清楚。","label":"第 16 段"}],"poem":false,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P76–78；按该书课文录入，省去注音与教参批注。","media":{"src":"/assets/reader-art/tianji.webp","alt":"两匹马正在比赛，孙膑和田忌在场边观察。","caption":"每场两匹马，三场定输赢。孙膑到底换了什么？","credit":"AI 情境插画","kind":"story"}}},{"id":"family-writing","title":"习作：我的家人","date":null,"minutes":24,"bookPages":"P81","unit":2,"goal":"选家人的鲜明特点，用具体小事和自己的感受把人写清楚。","source":"金牌训练·同步教材 P81；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"先知道这次写什么","body":"选家人的鲜明特点，用具体小事和自己的感受把人写清楚。","detail":["本版习作是《我的家人》。先想各人的不同特点，再挑最能体现特点的真实事例。","可以用恰当的比较表现特点，但不要只贴动物或性格标签。外貌、爱好、说话和做事方式都要联系真实观察。"],"id":"family-writing-01","source":"P81","kicker":"按书细读","tutorial":[{"title":"先挑你确实认识的特点","text":"想两三位准备写的家人，各写一个特点。不要照搬书里爸爸、妈妈的性格。"},{"title":"先集中练一个人","text":"选最有真实小事的一位，先把一个片段写清，学会方法后再补其他家人。"},{"title":"一篇文章怎么组成","text":"开头说写谁，中间每人一个特点配小事，结尾写自己的感受。不是把同一个夸奖词贴给全家。"}]},{"type":"choice","phase":"guided","title":"哪件小事最能说明“细心”？","body":"虚构练习：要写一位家人出门前很细心，下面哪件事最能支持这个特点？","options":[{"id":"0","text":"他很快提起行李走到门口。"},{"id":"1","text":"他照着清单逐项确认，发现少一把伞，又把伞补上。"}],"answer":"1","explanation":"快速提行李说明动作快；逐项确认并补上遗漏，才直接说明细心。选材料时，要让小事和准备写的特点对应。","repair":{"gap":"先分清要写细心，还是动作快。","reason":"证据要显示检查或发现遗漏，不只是做了事情。","check":"再找哪件事体现了认真核对。"},"id":"family-writing-02","source":"P81","kicker":"跟着推演"},{"type":"open","phase":"guided","title":"给准备写的家人各找一件小事","prompt":"列出准备写的两三位家人：称呼—一个特点—一件真实小事。暂时只想到一位也先保留，后面再补。选最清楚的一件来练片段。","reference":"可只写关键词，如“家人称呼／特点／什么时候做过什么”。事情必须由你确认；参考示范里的检查行李，不默认发生在你家。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"family-writing-03","source":"P81","kicker":"跟着推演"},{"type":"teach","phase":"teach","title":"从一个点写清楚","body":"比较要有共同点，事情要能作证。别人如何说、如何做，你当时有什么感受，都能帮助写清楚。","detail":["可选比较的共同点必须来自真实观察。例如“像小鹿一样轻快”要有动作作证；如果只是安静地做事，这个比喻就不贴切。","片段先用自己的小事，补一个最能表现特点的细节，再读回去。对人物的感受由自己决定，不套用范文的家庭成员性格。"],"id":"family-writing-04","source":"P81","kicker":"按书细读","tutorial":[{"title":"老师示范怎样补“细心”","text":"虚构原句：“叔叔很细心。”我先问哪个动作能让别人看出来，不急着加成语。"},{"title":"只补最有用的动作","text":"虚构改句：“他对着清单逐项检查，又回头确认有没有遗漏。”清单、逐项、确认，让细心有了画面。"},{"title":"换成你自己的素材","text":"回看你前面的家人小事，补他真的做过的动作或说过的话。没有发生过的细节不用。"}]},{"type":"open","phase":"independent","title":"写一个关键片段","prompt":"只选前面一位家人的一件事，写三四句：当时什么情况，他怎样做，你从中看出什么特点。需要时选下面一个词，补成你自己的句子。","reference":"特点、事情、感受彼此对应；不用“大人都怎样”代替观察自己的家人。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"family-writing-05","source":"P81","kicker":"课后题与常见考法","responseSupport":[{"label":"做事仔细时可用","text":"逐项检查","why":"适合真的一项一项核对；只是看了一眼，就不用这个词。"},{"label":"说话温和时可用","text":"轻声说","why":"适合你听见对方压低声音；若当时很急或喊得响，就保留真实语气。"},{"label":"动作利落时可用","text":"熟练地","why":"适合多次做过、动作顺当；第一次试着做，不强加熟练。"}]},{"type":"recall","phase":"recall","title":"遮住提示，说出路线","prompt":"不看提纲，说说你准备写哪几位家人，各用哪件事表现什么特点。还缺一位的材料，就明确说下次补什么。","reference":"每位家人的“特点—真实小事”要对应。先说清自己的材料，再决定段落，不用背空泛的起因经过结果。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"family-writing-06","source":"P81","kicker":"遮住讲回"},{"type":"choice","phase":"independent","title":"哪一次修改更有帮助？","body":"虚构片段：“姐姐很耐心，我一道题没听懂，她很耐心地再讲。我觉得她特别耐心。”只改一处，怎样更能让读者看见耐心？","options":[{"id":"0","text":"把三处耐心分别换成三个意思相近的成语。"},{"id":"1","text":"删去重复评价，补她怎样慢慢讲、怎样等我试着做。"},{"id":"2","text":"再加一段姐姐体育比赛得奖的经过。"}],"answer":"1","explanation":"耐心说了三次，读者仍看不见过程。补慢慢讲、等待试做等真实细节，才让特点有依据；不相关的得奖先不写。","repair":{"gap":"这段缺的不是更多评价词。","reason":"读者还没看到耐心具体表现在哪个动作。","check":"选能补出相关动作、减少重复的修改。"},"id":"family-writing-07","source":"P81","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"连起来，写自己的初稿","prompt":"回看前面的素材和片段。开头介绍写谁；每位家人各成一段，特点配一件真实小事；结尾写自己的感受。可以在纸上成文，留下已写片段或纸本位置。","reference":"检查每个人是否有具体小事，是否说清与你的关系和感受。没有字数要求时不为凑数复制同一句夸奖；书中示范不等于你的家庭经历。","checklist":["中心或观察对象清楚","事情和细节能支撑中心","顺序完整，语句通顺","我标出了准备修改的一处"],"id":"family-writing-08","source":"P81","kicker":"课后题与常见考法","collectFrom":["family-writing-03","family-writing-05","family-writing-06"]},{"type":"open","phase":"independent","title":"给自己的稿子改一笔","prompt":"选一处重复、含糊或不合情理的地方，写出修改前后，并说为什么改。","reference":"说明修改怎样帮助读者看清人物、过程或变化。开放习作需要家长复看，软件不按关键词自动判优秀。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"family-writing-09","source":"P81","kicker":"课后题与常见考法","responseSupport":[{"label":"缺动作，先补动作","text":"他先……，接着……","why":"只有事情确有两个动作才用，别把简单动作故意拉长。"},{"label":"已有小事，可接感受","text":"看到这一幕，我……","why":"接你当时真实的想法，不规定一定感动或幸福。"}]},{"type":"open","phase":"transfer","title":"把方法带出去","prompt":"旅途中你发现家人一个以前没注意的特点，会记录哪件小事来证明？","reference":"说清哪位家人、你新发现的特点，以及哪件真实小事支持这个发现。新的特点允许和以前印象不同，用这次的具体证据说明。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"family-writing-10","source":"P81","kicker":"换个情境"},{"id":"family-writing-end","type":"teach","phase":"transfer","title":"留好这一课的接续点","body":"把这次能自己说明的一点留下，再记一处还需帮助的地方。现在可以保存并休息，下次从未完处接着学。","source":"P81","tutorial":[{"title":"这次的学习目标","text":"选家人的鲜明特点，用具体小事和自己的感受把人写清楚。"},{"title":"完成与学会分开","text":"看过讲解、跟着完成、自己能说、隔天还能说，是不同情况。只记录这次真实做到了哪一步。"}]}],"reading":{"title":"读懂《习作：我的家人》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"任务 · 让别人认识你的家人","text":"这次写熟悉的家人：外貌、性格或习惯都能成为特点。先各选一个鲜明特点，再给每位要写的家人找一个真实小场景。先集中练一位，最后再组合。"},{"label":"书上教法 · 特点要有小事作证","text":"如果只说“他很细心”，读者还看不见。要补他做了什么、怎样做。例如虚构示范：“出门前，他按名单逐件检查，又把漏装的水杯放进去。”列出动作，比多写几个“非常”更能说明细心。这个示范不代表你的家人做过。"},{"label":"书上教法 · 比喻先找相同点","text":"书中的示范用熟悉动物作比较。可以学比较的方法，不照搬爸爸、妈妈的性格。若你的家人反应灵敏，才可能用小鹿作局部比较；若共同点说不清，保留普通表达更准确。"},{"label":"组织 · 开头、各人片段、自己的感受","text":"开头简短介绍准备写谁；中间分别写特点与一件小事，最有画面的地方写具体；结尾写与家人相处的真实感受。每个人不必一样长，也不必都用比喻。"},{"label":"修改 · 一次只丰富一处","text":"从自己的句子出发，检查它少的是动作、说话内容，还是自己的感受。只选符合事实的词句；不适合就不用。把改过的片段放回正文，读一遍，确认家人的特点与小事相配。"}]},"segments":[{"id":"family-draft","title":"从家人小事写到自己的初稿","startStepId":"family-writing-01","endStepId":"family-writing-end","minutes":24,"goal":"家人特点与真实小事对应，自己组织成文","scene":"hotel","check":"读自己的一个片段，指出哪个细节最能证明特点。"}],"reader":{"kind":"guide","core":"选家人的一个特点，用小事写出来。","hook":"让读的人像见到你的家人一样。","author":"读写小练习","pages":"P81","textSource":"依据家长所供教辅的本课要求编写；以下是原创学习指引，不是课文原文。","paragraphs":[{"label":"先想一个人","text":"你准备写谁？他有什么特别的习惯或做法？先说一个。","anchor":"","meaning":"先想一个人","why":"一个鲜明特点，比一串好词更好写。"},{"label":"找到一件事","text":"回忆某一天，他说了什么、做了什么。只选和这个特点有关的事。","anchor":"","meaning":"找到一件事","why":"事情和特点要连得上。"},{"label":"写得看得见","text":"不要只写“他很勤劳”。写他在什么时候，怎样收拾、修理或照顾家人。","anchor":"","meaning":"写得看得见","why":"让动作替你说明特点。"},{"label":"读给家人听","text":"写一个小片段，问自己：哪里最像他？哪里还太空？只改最不具体的一句。","anchor":"","meaning":"读给家人听","why":"自己的真事，不照搬别人的范文。"}],"tests":[{"q":"列出准备写的两三位家人：称呼—一个特点—一件真实小事。暂时只想到一位也先保留，后面再补。选最清楚的一件来练片段。","ref":"可只写关键词，如“家人称呼／特点／什么时候做过什么”。事情必须由你确认；参考示范里的检查行李，不默认发生在你家。","back":0,"modelAnswer":"妈妈—做事有条理—出门前按用途把要带的东西分装好，并逐项核对。\n爷爷—有耐心—教我修一件小物品时，让我先观察，再陪我慢慢试。\n我先选妈妈整理行李这件事来写。","answerKind":"写法示例","answerNote":"这是虚构的写法示例。写自己的经历时，请换成真实的人和事。"},{"q":"只选前面一位家人的一件事，写三四句：当时什么情况，他怎样做，你从中看出什么特点。需要时选下面一个词，补成你自己的句子。","ref":"特点、事情、感受彼此对应；不用“大人都怎样”代替观察自己的家人。","back":0,"modelAnswer":"出门前，桌上摆满了要带的东西。妈妈先把衣服、洗漱用品和证件分开放，再对着清单一项项核对。发现少了一件雨衣，她补进袋子，才拉上拉链。看着整齐的行李，我觉得她做事很有条理。","answerKind":"写法示例","answerNote":"这是虚构的写法示例。写自己的经历时，请换成真实的人和事。"},{"q":"旅途中你发现家人一个以前没注意的特点，会记录哪件小事来证明？","ref":"说清哪位家人、你新发现的特点，以及哪件真实小事支持这个发现。新的特点允许和以前印象不同，用这次的具体证据说明。","back":0,"modelAnswer":"我想记下一次临时换乘的经过：家人先看指示牌，再核对车次，最后带我们找到站台。我会写清他按什么顺序做、遇到疑问怎样确认，用这件具体的小事说明他做事细致。","answerKind":"写法示例","answerNote":"这是虚构的写法示例。写自己的经历时，请换成真实的人和事。"}],"media":null}},{"id":"e-unit2-garden","title":"语文园地二与单元回看","date":null,"minutes":26,"bookPages":"P82–88","unit":2,"goal":"从不同角度提问，选有帮助的问题；认识形声字，比较句子的表达效果。","source":"金牌训练·同步教材 P82–88；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"问题从三个方向来","body":"问内容、问写法、问与生活的联系。提问后还要找证据解答。","detail":["内容：发生了什么、为什么？写法：这样安排或重复有什么作用？联系生活：这个道理能用在哪里、有什么条件？筛选最能帮助读懂课文的问题。"],"id":"e-unit2-garden-01","source":"P82–88","kicker":"按书细读","tutorial":[{"title":"老师用赛马示范三个角度","text":"内容：调了什么顺序？写法：为什么写田忌三次不同的表情？生活：换比赛还要查哪些条件？"},{"title":"筛出最值得先问的","text":"先理解怎么调、为什么能赢，再研究写法。问马身上几根毛，不能帮助解释全篇。"},{"title":"换你选另一篇","text":"下一步选蝙蝠或帽子，自己写两种角度的问题，不把这里的示范换个名字就照抄。"}]},{"type":"open","phase":"guided","title":"给课文提两个好问题","prompt":"从已学的蝙蝠或帽子课选一篇，提出两个不同角度的问题，圈出最值得先解决的。","reference":"写明角度，并说明选它的原因。例如实验为何每次只改一个条件属于方法理解，不只询问一个无关细节。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"e-unit2-garden-02","source":"P82–88","kicker":"跟着推演"},{"type":"teach","phase":"teach","title":"用偏旁与词义一起识字","body":"读一遍，圈出不熟的字。先看结构和意思，再回课文读通。","detail":["会写字：纲、揍、锈、沫、矿、综、氧、俱","会认字：结合形声字识字","词语：提纲、挨揍、铁锈、泡沫、矿物、综合、氧气、俱全","冈→纲；奏→揍；秀→锈；末→沫；广→矿；宗→综；羊→氧；具→俱。偏旁常提示意思，声旁提供读音线索但不保证完全同音。"],"id":"e-unit2-garden-03","source":"P82–88","kicker":"按书细读","tutorial":[{"title":"先看有意义的偏旁","text":"沫有三点水，联系泡沫；矿有石字旁，联系矿物。偏旁帮助猜意思，还要放进词中验证。"},{"title":"再把共同部件找出来","text":"冈—纲、奏—揍、秀—锈、末—沫；广—矿、宗—综、羊—氧、具—俱。"},{"title":"读音别一概而论","text":"共同部件能提供声音线索，但广和矿不完全同音。读准词，再记结构。"}]},{"type":"recall","phase":"recall","title":"把最不熟的字词再记一次","prompt":"先挑最多三个不熟的字词试着认读；有纸笔就遮住提示写一遍。记录自己要改的地方，没有纸笔可先记待写。","reference":"重新打开本课字词讲解，对照偏旁、部件和笔画。没有纸笔可以先练认读或打字，把纸笔默写留到酒店；这几种练习分开记录。","checklist":["我说明这次是认读、打字还是纸写","我对照材料核对了读音或字形","没做纸写就记待写，不算默写完成"],"id":"e-unit2-garden-04","source":"P82–88","kicker":"遮住讲回"},{"type":"choice","phase":"independent","title":"“沫”为什么有三点水？","body":"联系泡沫的意思判断。","options":[{"id":"0","text":"提示与液体有关"},{"id":"1","text":"说明它一定读水"},{"id":"2","text":"偏旁完全没用"}],"answer":"0","explanation":"形旁帮助联系意义；还需读准mò，不把整字读成偏旁。","repair":{"gap":"先看题目要你比较什么。","reason":"形旁帮助联系意义；还需读准mò，不把整字读成偏旁。","check":"回到原题，用这个依据再判断。"},"id":"e-unit2-garden-05","source":"P82–88","kicker":"课后题与常见考法"},{"type":"model","phase":"guided","title":"重复与概括，效果不同","body":"对照两组句子，删去、放回关键词，看意思和强调处怎样改变。","model":"precision","config":{"pairs":[{"word":"还是","withText":"第一顶是方的，第二顶是方的，第三顶还是方的。","without":"前三顶全是方的。","why":"概括更简洁；一顶顶重复写，更突出始终不变。"},{"word":"的时候","withText":"那条狗高兴的时候叫，紧张的时候叫，发怒的时候也叫。","without":"那条狗高兴、紧张、发怒的时候都叫。","why":"前句反复列举，强调各种时候都叫；后句合并表达，更紧凑。"}]},"id":"e-unit2-garden-06","source":"P82–88","kicker":"跟着推演"},{"type":"recall","phase":"recall","title":"用自己的话比一比","prompt":"重复与概括哪一个一定更好？请说一个选择的理由。","reference":"没有脱离目的的唯一好法。想突出反复、不变可用重复，想简洁交代可概括。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"e-unit2-garden-07","source":"P82–88","kicker":"遮住讲回"},{"type":"teach","phase":"teach","title":"设问：自己问，自己答","body":"问题把注意力引到重点，后面的回答说清意思。","detail":["设问常见形式：“它有特别好的工具吗？没有。”与只问不答、向别人求答的问句不同，也与强调意思的反问不同。"],"id":"e-unit2-garden-08","source":"P82–88","kicker":"按书细读","tutorial":[{"title":"自己问，再自己答","text":"原创示范：“列车停了吗？还没有，只是减速了。”问题引起注意，紧跟回答说明情况。"},{"title":"只问别人，是另一种用法","text":"“列车几点到站？”如果等别人回答，就是普通提问。不能见到问号都判设问。"},{"title":"回到文章看用途","text":"设问不是装饰，它把读者的注意力引向作者准备说明的重点。"}]},{"type":"choice","phase":"independent","title":"找出设问","body":"哪句是自己提出问题又回答？","options":[{"id":"0","text":"你准备什么时候出发？"},{"id":"1","text":"难道我们不该认真观察吗？"},{"id":"2","text":"它靠什么探路？靠嘴和耳朵配合。"}],"answer":"2","explanation":"题中问题后紧接回答，是设问。反问强调已知判断，不是求答案。","repair":{"gap":"先看题目要你比较什么。","reason":"题中问题后紧接回答，是设问。反问强调已知判断，不是求答案。","check":"回到原题，用这个依据再判断。"},"id":"e-unit2-garden-09","source":"P82–88","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"积累：学与问要相连","body":"敢问，也要思考、求证和实践。","detail":["博学之，审问之，慎思之，明辨之，笃行之。——《中庸》","智能之士，不学不成，不问不知。——王充","人非生而知之者，孰能无惑？——韩愈","善疑者，不疑人之所疑，而疑人之所不疑。——方以智。联系主动发现值得追问之处理解，不是为了反对而反对。"],"id":"e-unit2-garden-10","source":"P82–88","kicker":"按书细读","tutorial":[{"title":"把五个动作串起来","text":"博学、审问、慎思、明辨、笃行：先广泛学，再问、想、辨，最后做。"},{"title":"聪明不能代替学习","text":"王充的话强调要学习和提问；韩愈的话提醒不懂很正常。"},{"title":"熟悉的地方也能发现问题","text":"方以智提醒我们别只重复别人已经问过的地方。但提出新疑问后仍要认真求证。"}]},{"type":"recall","phase":"recall","title":"背一句，做一件事","prompt":"遮住后背一句关于学习提问的名句，再举你准备怎样求证的问题。","reference":"解释意思后说明找课文证据、观察比较或请教的办法；提了问题不等于已解决。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"e-unit2-garden-11","source":"P82–88","kicker":"遮住讲回"},{"type":"open","phase":"independent","title":"单元独立回看","prompt":"各说一个：实验怎样支持解释；帽子的改变为什么有用；赛马计策的前提是什么。","reference":"蝙蝠控制遮挡条件；帽子联系人的需要；赛马联系马力分级和总胜局规则。遇到卡点回对应课。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"e-unit2-garden-12","source":"P82–88","kicker":"课后题与常见考法"},{"type":"open","phase":"transfer","title":"到新地方，问什么","prompt":"看到一个不熟悉的展品，写一个内容问题和一个值得继续查证的问题。","reference":"问题应指向理解展品或原因；先区分看见的事实和自己的猜想，再找来源。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"e-unit2-garden-13","source":"P82–88","kicker":"换个情境"},{"id":"e-unit2-garden-end","type":"teach","phase":"transfer","title":"留好这一课的接续点","body":"把这次能自己说明的一点留下，再记一处还需帮助的地方。现在可以保存并休息，下次从未完处接着学。","source":"P82–88","tutorial":[{"title":"这次的学习目标","text":"从不同角度提问，选有帮助的问题；认识形声字，比较句子的表达效果。"},{"title":"完成与学会分开","text":"看过讲解、跟着完成、自己能说、隔天还能说，是不同情况。只记录这次真实做到了哪一步。"}]}],"reading":{"title":"读懂《语文园地二与单元回看》 · 原创分段讲读","note":"依据原书内容作的原创教学转述，不是课文原文；短引、原诗和虚构练习分别注明。逐字朗读、摘录请对照原书。","paragraphs":[{"label":"交流平台 · 内容、写法、生活三个方向","text":"内容问题问“写了什么、为什么”：如蝙蝠怎样探路。写法问题问“为什么这样讲”：如先写飞机再讲蝙蝠有什么作用。生活问题把道理带出去：判断改进有没有用，应比较什么。先解决能帮助读懂全文的问题。"},{"label":"识字 · 同一部件，换偏旁","text":"冈—纲，奏—揍，秀—锈，末—沫，广—矿，宗—综，羊—氧，具—俱。先读完整词“提纲、挨揍、铁锈、泡沫、矿物、综合、氧气、俱全”，再看偏旁与意思的关系。声旁提供线索，不保证读音完全相同。"},{"label":"句段 · 重复与概括","text":"原创对照：他检查车票，检查行李，还检查房卡。／他检查车票、行李和房卡。第一句连续出现“检查”，突出他一项项认真做；第二句把相同动作合起来，交代得简洁。选哪句取决于你要强调什么。"},{"label":"句段 · 设问引起注意","text":"“它是靠眼睛探路的吗？实验表明，这套本领主要靠嘴和耳朵配合。”自己提出问题再回答，是设问。若只是请别人告诉答案，就是普通提问；若用问句强调已有判断，则要结合语气理解，不能见到问号都说设问。"},{"label":"积累 · 学问要有行动","text":"《中庸》：博学之，审问之，慎思之，明辨之，笃行之。意思是广泛学习，仔细追问，认真思考，清楚辨别，再踏实实践。王充：智能之士，不学不成，不问不知。聪明也不能代替学习和发问。"},{"label":"积累 · 不懂时敢问，熟悉时也会想","text":"韩愈：人非生而知之者，孰能无惑？谁都不是生来什么都会，有疑惑很正常。方以智：善疑者，不疑人之所疑，而疑人之所不疑。要能在大家习以为常的地方发现值得探究的问题，随后还要找证据。"}]},"segments":[{"id":"e-garden2-language","title":"提问、识字与句子比较","startStepId":"e-unit2-garden-01","endStepId":"e-unit2-garden-09","minutes":16,"goal":"能从不同角度提问，分辨句子表达目的","scene":"hotel","check":"给另一篇课文提两问，解释重复或概括的选择。"},{"id":"e-garden2-recall","title":"积累名句，单元回看","startStepId":"e-unit2-garden-10","endStepId":"e-unit2-garden-end","minutes":10,"goal":"背名句并用课文证据回看单元","scene":"train","check":"能说名句意思，讲清三篇课文各一条依据。"}],"reader":{"kind":"guide","core":"不只问“是什么”，还可以问“为什么这样写”。","hook":"同一篇课文，可以怎么提问？","author":"读写小练习","pages":"P82–88","textSource":"依据家长所供教辅的本课要求编写；以下是原创学习指引，不是课文原文。","paragraphs":[{"label":"问内容","text":"读蝙蝠实验，可以问：“为什么蒙眼还能避开绳子？”","anchor":"","meaning":"问内容","why":"问题帮你弄懂文章说的事。"},{"label":"问写法","text":"还可以问：“为什么第一次实验写得详细？”","anchor":"","meaning":"问写法","why":"看看作者怎样把事情讲清。"},{"label":"联系生活问","text":"再想：“还有什么办法能探测看不见的障碍？”需要查证后再答。","anchor":"","meaning":"联系生活问","why":"读完文章，还能带着问题往外想。"},{"label":"练自问自答","text":"“舒服吗？真不舒服！”作者自己问，接着自己答。这叫设问。你也试说一句。","anchor":"","meaning":"练自问自答","why":"一问一答，把要紧的意思亮出来。"}],"tests":[{"q":"从已学的蝙蝠或帽子课选一篇，提出两个不同角度的问题，圈出最值得先解决的。","ref":"写明角度，并说明选它的原因。例如实验为何每次只改一个条件属于方法理解，不只询问一个无关细节。","back":0,"modelAnswer":"我选《夜间飞行的秘密》。\n内容问题：蝙蝠为什么蒙住眼睛还不会撞到绳子？（我先解决这一问。）\n写法问题：作者为什么把第一次实验写得详细，后两次写得简略？\n先弄清实验内容，再看作者怎样把实验讲明白。","answerKind":"提问示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"先挑最多三个不熟的字词试着认读；有纸笔就遮住提示写一遍。记录自己要改的地方，没有纸笔可先记待写。","ref":"重新打开本课字词讲解，对照偏旁、部件和笔画。没有纸笔可以先练认读或打字，把纸笔默写留到酒店；这几种练习分开记录。","back":0,"modelAnswer":"可以练这三个词：蝙蝠（biān fú）、雷达（léi dá）、障碍（zhàng ài）。\n先读准，再遮住汉字自己写，最后展开逐字核对。记录示例：“‘障’字还没写清楚，要对照后再写一次。”如果没有纸笔，就记“待写”，不把只读过当成已经默写。","answerKind":"认读与记录示例","answerNote":"这是一组练习示例；实际要改哪个字，请按你自己写出的结果记录。"},{"q":"看到一个不熟悉的展品，写一个内容问题和一个值得继续查证的问题。","ref":"问题应指向理解展品或原因；先区分看见的事实和自己的猜想，再找来源。","back":0,"modelAnswer":"内容问题：这件展品是用什么材料做成的？\n继续查证的问题：人们为什么选这种材料，它怎样影响展品的用途？\n第一问可以先看说明牌，第二问还需要找更多可靠资料。","answerKind":"提问示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"media":null}},{"id":"river-poem","title":"古诗三首：暮江吟","date":null,"minutes":18,"bookPages":"P89–99","unit":3,"goal":"从夕阳到月夜，抓颜色、时间和比喻，看见诗中的两幅画。","source":"金牌训练·同步教材 P89–99；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"先读诗，再看画面","body":"从夕阳到月夜，抓颜色、时间和比喻，看见诗中的两幅画。","detail":["白居易（唐）：一道残阳铺水中，半江瑟瑟半江红。可怜九月初三夜，露似真珠月似弓。","本课三首古诗都需要背诵；《题西林壁》还需默写。按自己当前这一首分次完成，不要求一轮做完三首。"],"id":"river-poem-01","source":"P89–99","kicker":"按书细读","tutorial":[{"title":"先完整读四句","text":"一道残阳铺水中，半江瑟瑟半江红。可怜九月初三夜，露似真珠月似弓。"},{"title":"先分两幅画","text":"前两句是傍晚的江水，后两句是月夜的露珠和新月。先分时间，再看颜色与形状。"},{"title":"这一首要带走什么","text":"能用自己的话说画面，解释“铺、瑟瑟、可怜”，再借画面背出全诗。"}]},{"type":"teach","phase":"teach","title":"把诗中的字词放回画面","body":"读一遍，圈出不熟的字。先看结构和意思，再回课文读通。","detail":["会写字：残、铺、壁、横、侧、峰、庐、缘、梅、降、章、输","会认字：暮 mù、瑟 sè、骚 sāo、逊 xùn（残、缘、降、输见会写字）","词语：残阳、铺水、瑟瑟、可怜、真珠","这是三首诗合用的字表。“残”左边是歹，右边是戋；“壁”下面是土；“缘”左边是纟。“铺水”pū，“商铺”pù；“未肯降”xiáng，“降落”jiàng。"],"id":"river-poem-02","source":"P89–99","kicker":"按书细读","tutorial":[{"title":"用画面记词义","text":"残阳是将落的太阳；瑟瑟在这里是碧绿色；可怜是可爱；真珠就是珍珠。"},{"title":"把读音放进完整词","text":"铺水pū，商铺pù；本组诗中的未肯降读xiáng，降落读jiàng。"},{"title":"一次只修最不熟的字","text":"本组三诗字表在补充字词栏。今天先留意残、铺，后两首再照应壁、侧、峰、缘等字。"}]},{"type":"recall","phase":"recall","title":"把最不熟的字词再记一次","prompt":"先挑最多三个不熟的字词试着认读；有纸笔就遮住提示写一遍。记录自己要改的地方，没有纸笔可先记待写。","reference":"重新打开本课字词讲解，对照偏旁、部件和笔画。没有纸笔可以先练认读或打字，把纸笔默写留到酒店；这几种练习分开记录。","checklist":["我说明这次是认读、打字还是纸写","我对照材料核对了读音或字形","没做纸写就记待写，不算默写完成"],"id":"river-poem-03","source":"P89–99","kicker":"遮住讲回"},{"type":"model","phase":"guided","title":"改变画面，再读诗句","body":"切换黄昏与月夜，分别找颜色和形状。","model":"poetry","config":{"poem":"river"},"id":"river-poem-04","source":"P89–99","kicker":"跟着推演"},{"type":"recall","phase":"recall","title":"先遮住诗句讲画面","prompt":"用自己的话讲刚才看见的变化，再说它对应诗中哪个意思。","reference":"夕阳斜铺江水，碧绿与红色相映；夜里露珠像珍珠，弯月像弓。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"river-poem-05","source":"P89–99","kicker":"遮住讲回"},{"type":"teach","phase":"teach","title":"一二句：为什么是“铺”","body":"夕阳斜照，柔和地铺在水面上。“瑟瑟”写碧绿，别读成发冷。","detail":["一道残阳、半江碧绿半江红：写出夕阳下的水色。铺比射更贴近低角度、柔和铺展的画面。诗人用色彩写眼前景。"],"id":"river-poem-06","source":"P89–99","kicker":"按书细读","tutorial":[{"title":"老师示范“铺”能不能换","text":"先解释它在诗中写夕阳斜照；再想象低低的光平展在水面。"},{"title":"比较一个字带来的变化","text":"换成“射”，读起来更像一道直射的光；“铺”更能留住夕阳柔和、舒展的样子。"},{"title":"把答案连起来","text":"“铺”写夕阳斜照并在江面展开的状态，表现秋日余光的柔和，比只说“照”更有画面。"}]},{"type":"choice","phase":"independent","title":"“可怜”在这里什么意思？","body":"联系美丽、令人喜爱的江夜。","options":[{"id":"0","text":"值得怜悯"},{"id":"1","text":"可爱，令人喜爱"},{"id":"2","text":"十分贫困"}],"answer":"1","explanation":"古今词义可能不同，要用诗中情景核对。","repair":{"gap":"先看题目要你比较什么。","reason":"古今词义可能不同，要用诗中情景核对。","check":"回到原题，用这个依据再判断。"},"id":"river-poem-07","source":"P89–99","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"三四句：两处比喻","body":"露珠像珍珠，弯月像弓。形状、光泽让夜景看得见。","detail":["九月初三是农历日期。由残阳到月夜，时间推移；不要把四句都说成同一时刻。课文用“真珠”，默写按原诗。"],"id":"river-poem-08","source":"P89–99","kicker":"按书细读","tutorial":[{"title":"先把两组对应找出来","text":"露珠像珍珠，月亮像弓。不能把露珠与弓配在一起。"},{"title":"再说相似在何处","text":"露珠与珍珠都晶亮；弯月与弓的形状相似。抓相似点，比只报“用了比喻”多一步。"},{"title":"由画面读出感受","text":"第三句已经说这夜晚可爱。具体景物与赞叹合起来，能读出诗人的喜爱。下一题由你组织赏析。"}]},{"type":"order","phase":"independent","title":"两幅画按时间展开","body":"按事情发生或方法使用的顺序，依次点选。","items":[{"id":"0","text":"夕阳斜照江水"},{"id":"1","text":"半江碧绿半江红"},{"id":"2","text":"月夜露珠晶莹"},{"id":"3","text":"弯月如弓挂天边"}],"answer":["0","1","2","3"],"explanation":"前两句傍晚江景，后两句月夜景色。","repair":{"gap":"找出前一步给后一步带来的条件。","reason":"前两句傍晚江景，后两句月夜景色。","check":"先放起点，再连起因果。"},"id":"river-poem-09","source":"P89–99","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"赏析题自己答","prompt":"“露似真珠月似弓”用了什么写法？写出怎样的画面和感受？","reference":"指出两组比喻，说明露的晶莹、月的弯曲，联系诗人对江夜景色的喜爱，不只答“比喻，生动形象”。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"river-poem-10","source":"P89–99","kicker":"课后题与常见考法"},{"type":"recall","phase":"recall","title":"背诗，再解释一个词","prompt":"不看提示背完整首诗，再解释一个最容易按今天意思误解的词。","reference":"一道残阳铺水中，半江瑟瑟半江红。可怜九月初三夜，露似真珠月似弓。 检查漏字、错字与理解分别记录，不用“背过”代替实际背诵。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"river-poem-11","source":"P89–99","kicker":"遮住讲回"},{"type":"open","phase":"transfer","title":"在新情境里用方法","prompt":"看一次日落，用颜色或形状写两句，再指出哪句是观察、哪句用了比喻。","reference":"景物特点来自实际所见；比喻选择相似点，不硬套珍珠和弓。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"river-poem-12","source":"P89–99","kicker":"换个情境"},{"id":"river-poem-end","type":"teach","phase":"transfer","title":"留好这一课的接续点","body":"把这次能自己说明的一点留下，再记一处还需帮助的地方。现在可以保存并休息，下次从未完处接着学。","source":"P89–99","tutorial":[{"title":"这次的学习目标","text":"从夕阳到月夜，抓颜色、时间和比喻，看见诗中的两幅画。"},{"title":"完成与学会分开","text":"看过讲解、跟着完成、自己能说、隔天还能说，是不同情况。只记录这次真实做到了哪一步。"}]}],"reading":{"title":"读懂《古诗三首：暮江吟》 · 原创分段讲读","paragraphs":[{"label":"原诗 · 唐代白居易《暮江吟》","text":"一道残阳铺水中，半江瑟瑟半江红。可怜九月初三夜，露似真珠月似弓。"},{"label":"第1句 · 先看时间与光","text":"太阳快落山，低低的余光斜照在江面，仿佛平展地铺开。“残阳”点出傍晚，“铺”让我们想到柔和、舒展的光。"},{"label":"第2句 · 再看水的颜色","text":"江面一部分泛着碧绿色，另一部分被夕阳染红。“瑟瑟”在这里说碧绿色，不是冷得发抖。“半江”让两种水色相互映衬，不必当作精确测量。"},{"label":"第3句 · 时间走到夜里","text":"诗人赞叹农历九月初三的夜晚真可爱。“可怜”在古诗中是可爱，不能照今天“值得同情”的意思翻译。"},{"label":"第4句 · 露珠和弯月","text":"露珠晶亮，像珍珠；新月弯弯，像一张弓。两处比喻分别抓光泽与形状，把美景写得看得见。原诗写“真珠”，背诵和对照时保留原字。"},{"label":"整首怎么连 · 傍晚到月夜","text":"前两句看残阳与江水，后两句看露珠与新月。先懂这两幅画，再照“光—水色—赞叹—露月”四个提示背诗，最后撤去提示。"}],"note":"原诗按书呈现，讲读部分为原创解释。"},"segments":[{"id":"river-poem-whole","title":"读懂画面，学会解释，再背诗","startStepId":"river-poem-01","endStepId":"river-poem-end","minutes":18,"goal":"从夕阳到月夜，抓颜色、时间和比喻，看见诗中的两幅画。","scene":"hotel","check":"遮住原诗背一遍，再用自己的话解释本诗关键字词或道理。"}],"reader":{"author":"［唐］白居易","pages":"P95","core":"读出两幅画：傍晚的江面，入夜的露珠和月亮。","hook":"同一条江，怎么一半绿、一半红？","notes":[{"anchor":"铺","meaning":"夕阳斜照江面，像轻轻铺开。","why":"“瑟瑟”在这里说碧绿。画面一绿一红。"},{"anchor":"可怜","meaning":"这里的“可怜”是可爱。","why":"露珠像珍珠，月亮像弓。你能用手比出那弯月吗？"}],"tests":[{"q":"这首诗写了哪两个时间的景色？各有什么？","ref":"傍晚写残阳和江水；夜晚写露珠和弯月。","back":0,"modelAnswer":"诗中写了傍晚和夜晚两个时候。傍晚，夕阳照在江面上，一半江水呈青绿色，一半映着红光。夜晚，露珠像真珠一样晶莹，弯弯的月亮像一张弓。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"“铺”让你看到怎样的阳光？和直直地射下来一样吗？","ref":"不一样。“铺”让人想到夕阳斜照，柔和地铺洒在江面上。","back":0,"modelAnswer":"“铺”写出夕阳斜照在水面上，光柔和地展开，像铺满了江面。如果换成“直射”，就会让人想到笔直、强烈地照射，难以表现傍晚阳光贴着水面展开的感觉。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"不看诗，把两幅画讲出来，再试着背全诗。","ref":"先讲夕阳照水，一半碧绿一半红；再讲晶亮露珠和弓形弯月。背诵后自行对照原诗。","back":1,"modelAnswer":"第一幅画：夕阳低低地照着江面，江水一半青绿，一半泛红。第二幅画：夜色中，晶莹的露珠和弯弯的月亮相映。\n《暮江吟》　唐·白居易\n一道残阳铺水中，半江瑟瑟半江红。\n可怜九月初三夜，露似真珠月似弓。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"kind":"article","paragraphs":[{"text":"一道残阳铺水中，半江瑟瑟半江红。","anchor":"铺","meaning":"夕阳斜照江面，像轻轻铺开。","why":"“瑟瑟”在这里说碧绿。画面一绿一红。","label":"第 1 段"},{"text":"可怜九月初三夜，露似真珠月似弓。","anchor":"可怜","meaning":"这里的“可怜”是可爱。","why":"露珠像珍珠，月亮像弓。你能用手比出那弯月吗？","label":"第 2 段"}],"poem":true,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P95；按该书课文录入，省去注音与教参批注。","media":null}},{"id":"mountain-poem","title":"古诗三首：题西林壁","date":null,"minutes":18,"bookPages":"P89–99","unit":3,"goal":"换位置看山，理解局部与全貌；背诵并默写本诗。","source":"金牌训练·同步教材 P89–99；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"先读诗，再看画面","body":"换位置看山，理解局部与全貌；背诵并默写本诗。","detail":["苏轼（宋）：横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。","本课三首古诗都需要背诵；《题西林壁》还需默写。按自己当前这一首分次完成，不要求一轮做完三首。"],"id":"mountain-poem-01","source":"P89–99","kicker":"按书细读","tutorial":[{"title":"先完整读诗","text":"横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。"},{"title":"跟诗人换位置","text":"横侧、远近、高低，共同提醒你：眼前一面还不是全部。"},{"title":"今天的目标","text":"看懂位置和所见的关系；说出后两句因果；背诵，并留一段安静时间纸笔默写。"}]},{"type":"model","phase":"guided","title":"改变画面，再读诗句","body":"切换横看、侧看和远看，比较轮廓怎样改变。","model":"poetry","config":{"poem":"mountain"},"id":"mountain-poem-02","source":"P89–99","kicker":"跟着推演"},{"type":"recall","phase":"recall","title":"先遮住诗句讲画面","prompt":"用自己的话讲刚才看见的变化，再说它对应诗中哪个意思。","reference":"从横、侧和远近高低等不同位置看，山的样子各不相同；身处其中容易只看到局部。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"mountain-poem-03","source":"P89–99","kicker":"遮住讲回"},{"type":"teach","phase":"teach","title":"一二句：位置变，样子变","body":"横侧与远近高低是观察位置。诗中不是山自己一会儿变岭、一会儿变峰。","detail":["正面、侧面、远处、近处、高处、低处看到的形状不同。由多个角度观察，才能丰富对同一事物的认识。"],"id":"mountain-poem-04","source":"P89–99","kicker":"按书细读","tutorial":[{"title":"老师示范找观察角度","text":"题目问从哪看，就圈“横、侧”；问站在哪里，再圈“远、近、高、低”。"},{"title":"把所见接到位置后","text":"横看是连绵的岭，侧看是突出的峰。答案要有位置，也有对应景色。"},{"title":"别误解成山在变身","text":"变的是观察点，山本身没有在诗人面前突然换形状。"}]},{"type":"choice","phase":"independent","title":"“只缘”里的“缘”怎么讲？","body":"不识庐山真面目，只缘身在此山中。","options":[{"id":"0","text":"缘分"},{"id":"1","text":"因为"},{"id":"2","text":"边缘"}],"answer":"1","explanation":"后句解释前句原因，所以缘是因为。","repair":{"gap":"先看题目要你比较什么。","reason":"后句解释前句原因，所以缘是因为。","check":"回到原题，用这个依据再判断。"},"id":"mountain-poem-05","source":"P89–99","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"三四句：从景到理","body":"身在山里容易只见局部。想看全貌，需要换角度，把信息合起来。","detail":["不能推出“旁观者永远正确”。他也可能只看到一面；关键是全面观察、比较信息，而非谁离得远谁都对。"],"id":"mountain-poem-06","source":"P89–99","kicker":"按书细读","tutorial":[{"title":"先解释一句里的因果","text":"“不识”是结果，“只缘”引出原因：人在山里，容易只看到局部。"},{"title":"把前后的句子接起来","text":"前两句已展示不同位置看见不同样子，所以后两句继续思考怎样认识全貌。"},{"title":"道理要说得恰当","text":"看事物多换角度、合看信息。不能说所有身在其中的人都错，或旁观者都对。"}]},{"type":"open","phase":"independent","title":"默写《题西林壁》","prompt":"遮住原诗，在纸上完整默写。再留下自己写错的字或漏掉的句子。","reference":"横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。重点检查岭/峰、缘、庐；打字正确不代替纸笔默写。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"mountain-poem-07","source":"P89–99","kicker":"课后题与常见考法"},{"type":"open","phase":"independent","title":"诗句怎样讲道理","prompt":"从一二句看到的差别，怎样推出三四句的思考？","reference":"同一山从各位置呈现不同形态，说明局部所见有局限；联系“身在此山中”解释看全貌的困难。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"mountain-poem-08","source":"P89–99","kicker":"课后题与常见考法"},{"type":"recall","phase":"recall","title":"背诗，再解释一个词","prompt":"不看提示背完整首诗，再解释一个最容易按今天意思误解的词。","reference":"横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。 检查漏字、错字与理解分别记录，不用“背过”代替实际背诵。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"mountain-poem-09","source":"P89–99","kicker":"遮住讲回"},{"type":"open","phase":"transfer","title":"在新情境里用方法","prompt":"两个人从不同方向看同一个物品，说法不同。怎样查清楚而不急着说一人错了？","reference":"换角度共同观察，把各自看到的部分拼在一起，检查条件。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"mountain-poem-10","source":"P89–99","kicker":"换个情境"},{"id":"mountain-poem-end","type":"teach","phase":"transfer","title":"留好这一课的接续点","body":"把这次能自己说明的一点留下，再记一处还需帮助的地方。现在可以保存并休息，下次从未完处接着学。","source":"P89–99","tutorial":[{"title":"这次的学习目标","text":"换位置看山，理解局部与全貌；背诵并默写本诗。"},{"title":"完成与学会分开","text":"看过讲解、跟着完成、自己能说、隔天还能说，是不同情况。只记录这次真实做到了哪一步。"}]}],"reading":{"title":"读懂《古诗三首：题西林壁》 · 原创分段讲读","paragraphs":[{"label":"原诗 · 宋代苏轼《题西林壁》","text":"横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。"},{"label":"第1句 · 同一座山，换角度看","text":"横着看，山岭连绵；从侧面看，山峰显得高而突出。山没有自己变形，是观察位置改变了所见的轮廓。"},{"label":"第2句 · 远近高低继续比较","text":"站远处、近处、高处、低处，看到的样子也不同。诗人没有把其中一幅当成全部，而是提醒我们还有别的视角。"},{"label":"第3—4句 · 为什么难认全貌","text":"“识”是辨认，“真面目”指整体的真实面貌，“缘”是因为。诗人身在山中，视线受局部景物限制，因此难以看清整座山。"},{"label":"从景到理 · 把局部信息合起来","text":"前两句给出不同所见，后两句解释所见为什么受限制。理解事物时，可以换位置、换角度，并比较各方信息。不能由此说旁观者一定正确。"},{"label":"背写路径 · 先两联，再全诗","text":"第一联记观察：横侧、远近高低。第二联记因果：不识，因为身在其中。本诗需要背诵并默写；看不清的字可在本页对照，纸笔默写与口头背诵分开检查。"}],"note":"原诗按书呈现，讲读部分为原创解释。"},"segments":[{"id":"mountain-poem-whole","title":"读懂画面，学会解释，再背诗","startStepId":"mountain-poem-01","endStepId":"mountain-poem-end","minutes":18,"goal":"换位置看山，理解局部与全貌；背诵并默写本诗。","scene":"hotel","check":"遮住原诗背一遍，再用自己的话解释本诗关键字词或道理。"}],"reader":{"author":"［宋］苏轼","pages":"P96","core":"站的位置不同，看见的山就不同。","hook":"一座山，怎么一会儿是岭、一会儿是峰？","notes":[{"anchor":"横看成岭侧成峰","meaning":"横着看连成山岭，侧着看像山峰。","why":"山没有变，是看的位置变了。"},{"anchor":"只缘","meaning":"“只缘”就是“只因为”。","why":"人在山里面，容易只看见一部分，难见全貌。"}],"tests":[{"q":"为什么同一座庐山，会有不同的样子？","ref":"看山的位置、角度、远近和高低不同，看到的部分与形状也不同。","back":0,"modelAnswer":"因为诗人观察庐山的位置和距离不同。从正面、侧面看，山的形状不同；从远处、近处、高处、低处看，看到的景象也不同。所以同一座山会呈现不同的样子。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"用自己的话说说后两句的意思。","ref":"认不清庐山的完整面貌，是因为自己正身在山中。","back":1,"modelAnswer":"我认不清庐山真正的全貌，是因为我正处在庐山之中，只看见其中的一部分。这两句也提醒我们：认识事物时，不能只凭局部就下结论，要换个角度、看得全面一些。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"只看一张照片就判断一件东西，你会提醒自己什么？","ref":"可能只看到一个面。可以换角度、再看更多部分，然后判断。","back":0,"modelAnswer":"我会提醒自己：一张照片只拍下某个角度、某个时刻，不能代表事物的全部。我还要看其他角度的照片，了解拍摄时的情况，必要时到现场观察，再作判断。","answerKind":"表达示例","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"kind":"article","paragraphs":[{"text":"横看成岭侧成峰，远近高低各不同。","anchor":"横看成岭侧成峰","meaning":"横着看连成山岭，侧着看像山峰。","why":"山没有变，是看的位置变了。","label":"第 1 段"},{"text":"不识庐山真面目，只缘身在此山中。","anchor":"只缘","meaning":"“只缘”就是“只因为”。","why":"人在山里面，容易只看见一部分，难见全貌。","label":"第 2 段"}],"poem":true,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P96；按该书课文录入，省去注音与教参批注。","media":null}},{"id":"snow-poem","title":"古诗三首：雪梅","date":null,"minutes":18,"bookPages":"P89–99","unit":3,"goal":"比较不同方面的长处，理解拟人和诗中的道理。","source":"金牌训练·同步教材 P89–99；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"先读诗，再看画面","body":"比较不同方面的长处，理解拟人和诗中的道理。","detail":["卢钺（宋）：梅雪争春未肯降，骚人阁笔费评章。梅须逊雪三分白，雪却输梅一段香。","本课三首古诗都需要背诵；《题西林壁》还需默写。按自己当前这一首分次完成，不要求一轮做完三首。"],"id":"snow-poem-01","source":"P89–99","kicker":"按书细读","tutorial":[{"title":"先完整读诗","text":"梅雪争春未肯降，骚人阁笔费评章。梅须逊雪三分白，雪却输梅一段香。"},{"title":"找出争论和回答","text":"前两句问谁更好，后两句改从白、香两个方面比较。"},{"title":"今天带走的本领","text":"读懂几个古词，说明拟人让怎样的画面出现，再用两种长处把全诗背顺。"}]},{"type":"model","phase":"guided","title":"改变画面，再读诗句","body":"分别按白、香两方面比较，看看能否只选一个总赢家。","model":"poetry","config":{"poem":"snow"},"id":"snow-poem-02","source":"P89–99","kicker":"跟着推演"},{"type":"recall","phase":"recall","title":"先遮住诗句讲画面","prompt":"用自己的话讲刚才看见的变化，再说它对应诗中哪个意思。","reference":"雪更白，梅更香；比较标准不同，各有长处，不能脱离方面硬排总胜负。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"snow-poem-03","source":"P89–99","kicker":"遮住讲回"},{"type":"teach","phase":"teach","title":"一二句：把梅雪当人写","body":"争春、不服输，让梅和雪像在比赛。诗人也一时难评。","detail":["降xiáng是服输；骚人指诗人；阁笔的阁同搁，是放下笔；费评章指难以评定高下。"],"id":"snow-poem-04","source":"P89–99","kicker":"按书细读","tutorial":[{"title":"把难词先换明白","text":"降xiáng是服输；骚人指诗人；阁gē同搁，指放下；评章是评议高下。"},{"title":"老师示范拟人怎么分析","text":"“争”原是人的行为，却写在梅、雪身上，让它们像两个不肯相让的对手。"},{"title":"作用要说到画面","text":"不能只写“用了拟人”。还要说写出了梅雪各自争春、不肯服输的情态。"}]},{"type":"choice","phase":"independent","title":"三分白是精确成绩吗？","body":"联系诗的表达目的判断。","options":[{"id":"0","text":"是测量出来的白度分数"},{"id":"1","text":"不是，表示雪在白这一方面胜过梅"},{"id":"2","text":"是梅有三片花瓣"}],"answer":"1","explanation":"这里说长短与程度，不是精确数值报告。","repair":{"gap":"先看题目要你比较什么。","reason":"这里说长短与程度，不是精确数值报告。","check":"回到原题，用这个依据再判断。"},"id":"snow-poem-05","source":"P89–99","kicker":"课后题与常见考法"},{"type":"teach","phase":"teach","title":"三四句：两种长处","body":"按白来比，雪胜；按香来比，梅胜。尺子换了，结果也换了。","detail":["梅须逊雪三分白，雪却输梅一段香。逊是不及。道理是各有长短，可取长补短，不能随意推广成每个人各方面都一样。"],"id":"snow-poem-06","source":"P89–99","kicker":"按书细读","tutorial":[{"title":"换两把比较的尺子","text":"先比洁白，雪胜；再比清香，梅胜。比较标准不同，长处也不同。"},{"title":"看清“逊”和“输”","text":"两字都说明比不上，也从侧面显出对方长处。三分、一段不当精确成绩来算。"},{"title":"把两联连起来","text":"后两句把前面的争高下分开回答，启发我们看到各自长短，再学习别人的长处。"}]},{"type":"open","phase":"independent","title":"人物式写法有什么作用","prompt":"找一处拟人，再解释最后两句怎样回应前面的争论。","reference":"争春、未肯降赋予人的动作态度；结尾分白和香两方面比较，化解只争一个赢家的难题。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"snow-poem-07","source":"P89–99","kicker":"课后题与常见考法"},{"type":"recall","phase":"recall","title":"背诗，再解释一个词","prompt":"不看提示背完整首诗，再解释一个最容易按今天意思误解的词。","reference":"梅雪争春未肯降，骚人阁笔费评章。梅须逊雪三分白，雪却输梅一段香。 检查漏字、错字与理解分别记录，不用“背过”代替实际背诵。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"snow-poem-08","source":"P89–99","kicker":"遮住讲回"},{"type":"open","phase":"transfer","title":"在新情境里用方法","prompt":"选旅行用的两件物品，一件轻、一件结实。你会怎样比较并作选择？","reference":"先明确使用需要，再按不同方面比较长短，不只报一个“最好”。","checklist":["我回答了题目真正问的内容","我给出了具体依据","这是我自己的说法"],"id":"snow-poem-09","source":"P89–99","kicker":"换个情境"},{"id":"snow-poem-end","type":"teach","phase":"transfer","title":"留好这一课的接续点","body":"把这次能自己说明的一点留下，再记一处还需帮助的地方。现在可以保存并休息，下次从未完处接着学。","source":"P89–99","tutorial":[{"title":"这次的学习目标","text":"比较不同方面的长处，理解拟人和诗中的道理。"},{"title":"完成与学会分开","text":"看过讲解、跟着完成、自己能说、隔天还能说，是不同情况。只记录这次真实做到了哪一步。"}]}],"reading":{"title":"读懂《古诗三首：雪梅》 · 原创分段讲读","paragraphs":[{"label":"原诗 · 宋代卢钺《雪梅》","text":"梅雪争春未肯降，骚人阁笔费评章。梅须逊雪三分白，雪却输梅一段香。"},{"label":"第1句 · 梅和雪像在争胜","text":"梅花与雪都不肯服输，好像在争谁更能装点春光。“降”读xiáng，是服输；“争”把梅雪当作有态度的人来写。"},{"label":"第2句 · 诗人也难评","text":"“骚人”指诗人。“阁”同“搁”，读gē，是放下。诗人放下笔，费心评议高下：只争一个总赢家，确实不好回答。"},{"label":"第3句 · 先用“白”作标准","text":"与雪相比，梅花在洁白上稍逊一些。“逊”是比不上，“三分”表示差一些，不是比赛打出精确的三分。"},{"label":"第4句 · 再用“香”作标准","text":"改比香气，雪就不如梅。第三、四句用不同标准比较，写出梅与雪各有长处，也各有不足。"},{"label":"全诗的转折 · 从争输赢到看长处","text":"前两句写争论与难评，后两句分方面给出判断。读到这里，学到的不只是“大家都好”，而是说清好在哪里，再学人长处、补己不足。"}],"note":"原诗按书呈现，讲读部分为原创解释。"},"segments":[{"id":"snow-poem-whole","title":"读懂画面，学会解释，再背诗","startStepId":"snow-poem-01","endStepId":"snow-poem-end","minutes":18,"goal":"比较不同方面的长处，理解拟人和诗中的道理。","scene":"hotel","check":"遮住原诗背一遍，再用自己的话解释本诗关键字词或道理。"}],"reader":{"author":"［宋］卢钺","pages":"P96–97","core":"比白，雪胜；比香，梅胜。各有所长。","hook":"梅和雪争第一，你怎么评？","notes":[{"anchor":"未肯降","meaning":"梅和雪像两个人，都不肯服输。","why":"“降”读xiáng。把它们写得会争，是拟人。"},{"anchor":"三分白","meaning":"雪更白，梅更香。","why":"换一个比较的方面，就有不同的长处。"}],"tests":[{"q":"诗里梅和雪各有什么长处？","ref":"雪更洁白，梅有清香。两者各有所长。","back":1,"modelAnswer":"梅花的长处是有清香，雪的长处是洁白。梅花没有雪那么白，雪没有梅花那样的香气。它们各有长处，也各有不足。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"“梅雪争春”为什么有趣？","ref":"把梅和雪写得像人，会争、会不服输，画面变得活泼。","back":0,"modelAnswer":"“争”把梅花和雪写得像两个都不肯服输的人，仿佛都在说自己最能代表春天。这样的拟人写法让画面活泼、有趣，也引出了后面对各自长处的比较。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"},{"q":"一个人跑得快，一个人画得好，能只用一个“谁更好”来比吗？","ref":"要先说比什么。不同方面各有长处，可以互相学习。","back":1,"modelAnswer":"不能只问谁更好。跑得快是运动方面的长处，画得好是绘画方面的长处，要先说清比较什么。就像梅花和雪，一个有香气，一个更洁白，各有所长，不能只用一个标准评价全部。","answerKind":"参考答案","answerNote":"意思说清楚、有依据即可，不必逐字相同。"}],"kind":"article","paragraphs":[{"text":"梅雪争春未肯降，骚人阁笔费评章。","anchor":"未肯降","meaning":"梅和雪像两个人，都不肯服输。","why":"“降”读xiáng。把它们写得会争，是拟人。","label":"第 1 段"},{"text":"梅须逊雪三分白，雪却输梅一段香。","anchor":"三分白","meaning":"雪更白，梅更香。","why":"换一个比较的方面，就有不同的长处。","label":"第 2 段"}],"poem":true,"textSource":"家长提供的《金牌训练·学习笔记同步教材》P96–97；按该书课文录入，省去注音与教参批注。","media":null}},{"id":"ivy","title":"爬山虎的脚","date":null,"minutes":29,"bookPages":"P100–109","unit":3,"goal":"看清脚的位置和攀爬过程，用准确词语说明连续观察的发现。","source":"金牌训练·同步教材 P100–109；原书逐页核对，教学与练习原创改编。","steps":[{"type":"teach","phase":"teach","title":"先分清茎、叶柄和脚","body":"读一遍，圈出不熟的字。先看结构和意思，再回课文读通。","detail":["会写字：虎、操、墙、隙、茎、柄、触、萎、痕、迹、瞧","会认字：蜗 wō、曲 qū（茎、柄、萎见会写字）","词语：操场、墙壁、新鲜、均匀、空隙、叶柄、触角、弯曲、痕迹、牢固","“隙”右上不要加钩；茎jīng、柄bǐng；弯曲qū、乐曲qǔ；新鲜xiān、鲜为人知xiǎn。"],"id":"ivy-01","source":"P100–109","kicker
