{place:'回到开头',en:['I like my school.',"It's lovely and cool."],zh:'再说一次对学校的喜欢，收尾。',cue:'重复开头，别漏掉！',keywords:['school','lovely','cool'],hint:'第9、10句与第1、2句完全相同。',note:'整首10句，8句不重复；结尾仍要完整背出。'}];

{q:'我们每天在那里做运动。填两个词。',frame:'We ____ there every day.',a:'do sports',help:'“做运动”是一整块 do sports；不要漏 sports 的 s。',phase:'independent'},

{q:'把地点放到句末，意思不变。写完整句。',frame:'In the classroom I study.',a:'I study in the classroom.',help:'先说 I study，再接 in the classroom。',phase:'transfer'},
{q:'换个地方：我在卧室读书。用 I 开头写一句。',frame:'卧室：the bedroom　读书：read',a:'I read in the bedroom.',help:'先说人物和动作 I read，再接 in the bedroom。',phase:'transfer'},

const $=id=>document.getElementById(id), esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function valid(v){return v&&v.appId===APP_ID&&v.child===CHILD&&v.version===1&&Array.isArray(v.history)&&Array.isArray(v.notes)&&v.tries&&v.assisted&&v.drafts&&v.groupReview;}

else if(s.screen==='notes'){const n=NOTES[s.note];h=top('笔记 '+(s.note+1)+' / '+NOTES.length,'把关键句记下来','拿出本子，只记这一张。')+'<div class="notecard"><h2>'+n[0]+'</h2><p class="note-en" lang="en">'+esc(n[1])+'</p><p>'+esc(n[2])+'</p><p class="small">'+esc(n[3])+'</p></div><div class="row">'+btn('上一条','prev-note')+btn(s.notes.includes(s.note)?'已记好，下一条':'我记好了，下一条','noted','primary')+'</div>'+btn('直接检查句型','quiz','soft')+'<p class="small">“记好了”只记录你的确认；之后还要遮住检验。</p>';}
else if(s.screen==='recite'){h='<section data-phase="independent">'+top('整篇挑战 · 不看英文','沿路线背一遍',s.reciteStarted?'从第一句背到最后一句，再展开核对。':'先想地点，再想动作。准备好就收起提示。')+(s.reciteStarted?'':map())+(s.reciteStarted?'<div class="quote">I like my school</div><p class="tip">现在不看提示，从头背到尾。</p>':btn('收起路线，开始背','begin-recitation','primary'))+(s.reciteStarted?btn(s.revealed?'收起原文':'我背完了，展开核对','reveal-poem','soft'):'')+(s.revealed?'<div class="full-poem" lang="en">'+poem()+'</div><p class="tip">回想刚才：有没有漏句、换错词？</p><div class="row">'+btn('有卡住，回去补','oral-review')+btn('刚才完整背出了','oral-pass','green')+'</div>':'')+'<p class="small">口述不录音、不自动评分。这里记录你的自评。</p></section>';}
else if(s.screen==='quiz'){const q=QUESTIONS[s.q];h=(q.phase==='transfer'?'<section data-phase="transfer">':'<section data-phase="independent">')+top((q.phase==='transfer'?'换个场景':'遮住检查')+' · '+(s.q+1)+' / '+QUESTIONS.length,'自己写出来',q.q)+'<div class="paper en">'+esc(q.frame)+'</div><form id="answerForm"><label for="answer" class="small">你的答案（大小写、空格和句末标点不扣分）</label><input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(s.drafts[s.q]||'')+'"><button class="primary" type="submit">检查答案</button></form><div id="feedback" aria-live="polite"></div><div style="margin-top:12px">'+btn('想不起来，看方法','help')+'</div></section>';}
else if(s.screen==='repair'){const q=QUESTIONS[s.q];h='<section data-phase="repair">'+top('补这一个点','找回关键词','你的原答案已保留。')+explanation('先看这句话想表达什么。',q.help,'回到原题，再自己写一次。')+'<div class="paper en" data-reference-answer>'+esc(q.a)+'</div><button class="primary" data-action="return" data-return-to-question="original">回原题再写</button><section class="tip" data-learning-escape="answer-and-continue"><p data-reference-answer>参考：'+esc(q.a)+'</p><button data-action="skip" data-continue-after-reveal>记为待复习并继续</button></section></section>';}
else if(s.screen==='done'){h=top('本次练习完成','今天先记到这里','背诵与句型分开看，不把点完当背会。')+'<div class="complete">5 站</div><p class="tip">'+summary()+'</p><div class="row">'+btn('再背整篇','recite')+btn(s.completed?'本次已保存':'完成并保存记录','finish','green')+'</div>'+btn('查看本次记录','records')+'<p class="small">合上页面，隔一会儿再背一遍，才知道是否记牢。</p>';}
else if(s.screen==='records'){h=top('家长与孩子都能查看','学习记录','只属于 Eddey；口述是自评，不是自动判分。')+'<p class="tip">'+summary()+'</p><div class="records" data-parent-analysis>'+s.history.slice().reverse().map(e=>'<div class="record"><b>'+esc(e.label||e.kind)+'</b><p>'+esc(e.answer||'')+'</p><span class="small">'+esc(e.status||'过程记录')+' · '+esc(new Date(e.ts).toLocaleTimeString('zh-CN'))+'</span></div>').join('')+'</div><div class="row">'+btn('下载记录','export')+btn('继续学习','home','primary')+'</div><p class="small">本机自动保留进度；完成后通过门户同步。无原始录音，无自动掌握结论。</p>';}
else {s.screen='home';return render();}
$('app').innerHTML=h;const form=$('answerForm');if(form){form.addEventListener('submit',e=>{e.preventDefault();check();});$('answer').addEventListener('input',()=>{s.drafts[s.q]=$('answer').value;save();});}}
function summary(){const oral=s.history.filter(e=>e.kind==='oral').at(-1);const attempts=s.history.filter(e=>e.kind==='answer');const independent=new Set(attempts.filter(e=>e.status==='独立正确').map(e=>e.q));const review=new Set(attempts.filter(e=>e.status==='待复习'||e.status==='提示后正确').map(e=>e.q));return '整篇背诵：'+(oral?oral.status:'还未自评')+'；句型独立正确 '+independent.size+'/'+QUESTIONS.length+'；句型需回看 '+review.size+' 项；笔记确认 '+s.notes.length+'/'+NOTES.length+'。';}
function norm(x){return x.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?。！？,，]/g,'').replace(/\s+/g,' ').trim();}
function check(){const q=QUESTIONS[s.q],answer=$('answer').value;s.drafts[s.q]=answer;if(!answer.trim()){$('feedback').innerHTML='<p class="feedback warn">先写一点；想不起来可以点“看方法”。</p>';return;}const match=norm(answer)===norm(q.a);s.tries[s.q]=(s.tries[s.q]||0)+1;event('answer',{q:s.q,label:q.frame,answer,status:match?(s.assisted[s.q]?'提示后正确':'独立正确'):'待复习',expected:q.a});if(match){$('feedback').innerHTML='<p class="feedback">'+(s.assisted[s.q]?'这次写对了；看过提示，之后再独立试。':'独立写对了。')+'</p>'+btn('下一题','next-question','green');document.querySelector('#answerForm button').disabled=true;}else{s.assisted[s.q]=true;save();go('repair');}}
function nextQuestion(){if(s.q<QUESTIONS.length-1){s.q++;go('quiz');}else go('done');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a.startsWith('group-')){s.group=Number(a.slice(6));s.level=0;go('group');return;}if(a.startsWith('level-')){s.level=Number(a.slice(6));save();render();return;}
if(a==='start'){s.group=0;s.level=0;go('group');}else if(a==='next-group'){if(s.group<4){s.group++;s.level=0;go('group');}else go('recite');}else if(a==='review-group'){s.groupReview[s.group]=true;event('group-review',{label:GROUPS[s.group].place,status:'背诵待复习'});s.level=0;render();}else if(a==='move'){s.moved=!s.moved;save();render();}else if(a==='model-said'){event('retell',{label:'解释人物、地点、动作',status:'本人确认已口述，内容未评'});go('notes');}else if(a==='prev-note'){s.note=Math.max(0,s.note-1);save();render();}else if(a==='noted'){if(!s.notes.includes(s.note))s.notes.push(s.note);event('note',{label:NOTES[s.note][0],status:'本人确认已记笔记'});if(s.note<NOTES.length-1){s.note++;go('notes');}else{s.q=0;go('quiz');}}else if(a==='quiz'){s.q=0;go('quiz');}else if(a==='begin-recitation'){s.reciteStarted=true;s.revealed=false;save();render();}else if(a==='reveal-poem'){s.revealed=!s.revealed;save();render();}else if(a==='oral-review'||a==='oral-pass'){event('oral',{label:'整篇10句口述',status:a==='oral-pass'?'本人自评完整背出，待复验':'本人自评有卡点，待复习'});s.reciteStarted=false;s.revealed=false;if(a==='oral-review'){s.group=0;s.level=0;go('group');}else go('model');}else if(a==='help'){s.assisted[s.q]=true;save();go('repair');}else if(a==='return'){go('quiz');}else if(a==='skip'){event('answer',{q:s.q,label:QUESTIONS[s.q].frame,answer:s.drafts[s.q]||'',status:'待复习',expected:QUESTIONS[s.q].a,action:'看参考后继续'});nextQuestion();}else if(a==='next-question'){nextQuestion();}else if(a==='finish'){if(s.completed)return;let accepted=false;if(!TEST&&window.DDLearningSync){accepted=DDLearningSync.complete({client_event_id:APP_ID+'-'+s.session+'-'+s.history.length,kid:CHILD,subject:'英语',topic:'I like my school',item:'校园儿歌背诵与核心句型',payload:{appId:APP_ID,summary:summary(),evidence:s.history,notes:s.notes,oralAssessment:'self-reported'}});}s.completed=TEST||accepted;save();render();$('notice').textContent=TEST?'测试记录已保存在本机，不写正式学情。':accepted?'已在本机保存并进入同步队列；联网后由门户同步。':'本机记录已保留；云端同步未能加入队列。';}else if(a==='export'){const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='eddey-school-rhyme-'+day+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}else if(['home','notes','records','model','text','recite'].includes(a)){if(a==='recite'){s.reciteStarted=false;s.revealed=false;}go(a);}});
document.addEventListener('keydown',e=>{const g=e.target.closest('g[data-action]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();g.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
render();
})();
</script></body></html>
