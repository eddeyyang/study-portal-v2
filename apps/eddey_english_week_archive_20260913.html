function eddeyModel(){const sets=[['An artist','A farmer','A teacher'],['plays the guitar','holds a ruler','flies a kite'],['on the beach','near the house','in the playground'],['in the morning','at noon','on Monday']];const labels=['Who · 谁','What · 做什么','Where · 在哪里','When · 什么时候'];return `<p>换一格，看看句子里的哪一部分跟着变。</p><div class="slots">${sets.map((set,i)=>`<label>${labels[i]}<select data-slot="${i}" aria-label="${labels[i]}">${set.map((x,j)=>`<option value="${j}" ${slot[i]===j?'selected':''}>${x}</option>`).join('')}</select></label>`).join('')}</div><div class="scene"><svg viewBox="0 0 600 155" aria-hidden="true"><rect x="32" y="50" width="536" height="62" rx="30" fill="#e2d3b6"/><path d="M110 84H490" stroke="#9a9f95" stroke-width="3"/>${slot.map((x,i)=>`<g transform="translate(${100+i*133},${80-(i===highlight?8:0)})"><circle r="28" fill="${['#e6b38c','#a5cfde','#b7d1b8','#c8b7d7'][i]}"/><text text-anchor="middle" y="6" font-size="17" fill="#303a50">${['Who','What','Where','When'][i]}</text></g>`).join('')}</svg></div><div class="sentence" lang="en">${sets.map((s,i)=>`<span class="${i===highlight?'highlight':''}">${s[slot[i]]}</span>`).join(' ')}.</div><div class="chipset">${labels.map((x,i)=>`<button data-question-part="${i}" aria-pressed="${highlight===i}">${x.split(' · ')[0]}?</button>`).join('')}</div><p class="caption">${highlight<0?'点一个问题，句中对应的信息会亮起来。':labels[highlight]+'：答案就藏在亮起的那一格。'}</p><div class="actions"><button id="speakModel">${speaker}听这一句</button><button id="resetModel">还原</button></div><details data-child-detail="secondary"><summary>我还没懂</summary><p>What 这格在本练习中要补上合适的动作。一个人“弹吉他”用 plays the guitar，不能只把四个名词并排摆好。</p><p>on Monday · in April · in the morning · at noon · at night。</p><p>校内复习：have no = do not have any；has no = does not have any。does 后面用 have。</p></details>`}

function filteredWords(){if(state.pack==='只复习错词')return C.words.filter(w=>state.review.includes(w.id));return C.words.filter(w=>state.pack==='本周全部'?!w.pack.includes('选学'):w.pack===state.pack)}
function resetWordAttempt(){const list=filteredWords(),w=list[state.wordIndex%Math.max(1,list.length)];if(w&&state.mode!=='learn')state.drafts[w.id]='';tries=0;assisted=false;save()}
function renderWords(){stop();save();const list=filteredWords(),w=list[state.wordIndex%Math.max(1,list.length)];if(!w){$('#stage').innerHTML=shell('recall','暂时没有待复习词',`<p>当前没有错词记录。这不表示全部掌握；可以回词表做一次独立拼写。</p><button id="allWords" class="primary">打开本周词表</button>`);$('#allWords').onclick=()=>{state.pack='本周全部';state.wordIndex=0;resetWordAttempt();renderWords()};return}const idx=state.wordIndex%list.length;$('#stage').innerHTML=shell(state.mode==='test'?'independent':state.mode==='recall'?'recall':'teach',state.mode==='test'?'先听，再拼出来':'先听懂，再记牢',`<div class="row"><label class="field" style="flex:1;margin:0"><span>词表范围</span><select id="packSelect">${['本周全部',...new Set(C.words.map(w=>w.pack)),'只复习错词'].map(p=>`<option ${p===state.pack?'selected':''}>${esc(p)}</option>`).join('')}</select></label><span class="caption">${idx+1} / ${list.length}</span></div><div class="progress"><i style="width:${(idx+1)/list.length*100}%"></i></div><div class="panel"><p class="caption">${esc(w.pack)}</p>${state.mode==='learn'?`<div class="word" lang="en">${esc(w.text)}</div><p>${esc(w.zh)}</p><p class="example" lang="en">${esc(w.example)}</p><div class="actions"><button id="hearWord">${speaker}听单词</button><button id="hearSlow">${speaker}慢一点</button><button id="hearExample">听例句</button></div><div class="actions"><button class="primary" id="hideWord">遮住，我来拼</button><button id="knownNext">认识，下一词</button></div>`:`<p class="word-hidden">${state.mode==='test'?'听音拼写':esc(w.zh)}</p><div class="actions"><button id="hearWord">${speaker}再听一次</button><button id="hearSlow">${speaker}慢一点</button></div><label class="field"><span>用键盘自己拼写</span><input type="text" id="spell" maxlength="100" autocapitalize="off" autocomplete="off" spellcheck="false" value="${esc(state.drafts[w.id]||'')}"></label><label class="row caption"><input type="checkbox" id="spellAssisted">我用了语音输入或别人提示</label><div class="actions"><button class="primary" id="checkSpell">检查拼写</button><button id="showWord">不会，教我一下</button></div><div id="spellFeedback" class="feedback" aria-live="polite"></div>`}</div><div class="actions"><button id="previousWord">上一词</button><button id="testWords">听音默写本组</button><button id="reviewWords">只复习错词（${state.review.length}）</button></div><p class="caption">词表与例句可分开听。例句为教学自编；本次正确不等于长期掌握。</p>`);$('#packSelect').onchange=e=>{state.pack=e.target.value;state.wordIndex=0;resetWordAttempt();renderWords()};$('#hearWord').onclick=()=>play(w.text,1,state.mode!=='learn');$('#hearSlow').onclick=()=>play(w.text,.88,state.mode!=='learn');$('#previousWord').onclick=()=>moveWord(-1);$('#testWords').onclick=()=>{state.mode='test';state.wordIndex=0;resetWordAttempt();renderWords()};$('#reviewWords').onclick=()=>{state.pack='只复习错词';state.mode='test';state.wordIndex=0;resetWordAttempt();renderWords()};if(state.mode==='learn'){$('#hearExample').onclick=()=>play(w.example);$('#hideWord').onclick=()=>{state.mode='recall';state.drafts[w.id]='';tries=0;assisted=true;save();renderWords()};$('#knownNext').onclick=()=>{record(w.id,'','self-reported-familiar');moveWord(1)}}else{$('#spell').oninput=e=>{state.drafts[w.id]=e.target.value;save()};$('#spell').onkeydown=e=>{if(e.key==='Enter')$('#checkSpell').click()};$('#checkSpell').onclick=()=>checkSpell(w);$('#showWord').onclick=()=>wordHelp(w,true)}}
function moveWord(delta){stop();const len=filteredWords().length;state.wordIndex=(state.wordIndex+delta+len)%Math.max(1,len);resetWordAttempt();renderWords()}
function checkSpell(w){stop();const ans=$('#spell').value.trim();if(!ans){$('#spellFeedback').textContent='先试着拼一拼；也可以点“不会，教我一下”。';return}tries++;const ok=normalize(ans)===normalize(w.text),a=assisted||$('#spellAssisted').checked||state.mode==='recall'||tries>1;record(w.id,ans,ok?(a?'assisted-correct':'independent-correct'):'needs-repair',{expected:w.text,pack:w.pack,inputMode:$('#spellAssisted').checked?'voice-or-assisted':'typed'});if(ok){if(!a){const prior=state.history.filter(h=>h.id===w.id).slice(-2);if(prior.length===2&&prior.every(h=>h.result==='independent-correct'))state.review=state.review.filter(id=>id!==w.id)}$('#spellFeedback').innerHTML=`<p class="success">${a?'跟着完成了。下一轮再独立试。':'自己拼对了。'}</p><div class="actions"><button class="primary" id="wordNext">下一词</button><button id="holdWord">停一下</button></div>`;$('#wordNext').onclick=()=>moveWord(1);$('#holdWord').onclick=()=>{clearTimeout(advanceTimer);$('#holdWord').textContent='已停，准备好再继续'};if(!a&&state.auto)advanceTimer=setTimeout(()=>moveWord(1),1600);save()}else{markReview(w.id);save();wordHelp(w,tries>=2)}}
function wordHelp(w,reveal){stop();assisted=true;markReview(w.id);save();const ans=normalize($('#spell').value),target=normalize(w.text);let i=0;while(i<ans.length&&ans[i]===target[i])i++;$('#spellFeedback').innerHTML=`<section class="repair" data-phase="repair">${primary('先看第 '+(i+1)+' 个字符附近。','把词分成短一点的声音，再对齐字母。','听一遍，回原词再拼。')}<div class="actions"><button id="repairAudio">${speaker}再听</button><button data-return-to-question="true" id="returnWord">回原词重试</button></div>${reveal?`<div data-learning-escape="answer-and-continue"><p>不会把你锁在这里。看清以后，再来复习。</p><p data-reference-answer class="word" lang="en">${esc(w.text)}</p><p>${esc(w.zh)}</p><button data-continue-after-reveal class="primary" id="wordEscape">记为待复习并继续</button></div>`:''}</section>`;$('#repairAudio').onclick=()=>play(w.text,.88,true);$('#returnWord').onclick=()=>{$('#spellFeedback').innerHTML='';$('#spell').focus()};if(reveal)$('#wordEscape').onclick=()=>{record(w.id,$('#spell').value,'reference-shown-review-needed',{expected:w.text});moveWord(1)}}
function renderReading(){stop();save();const p=C.readings[readingIndex];$('#stage').innerHTML=shell('guided','一句一句，读给自己听',`<label class="field"><span>选择朗读内容</span><select id="readingSelect">${C.readings.map((p,i)=>`<option value="${i}" ${readingIndex===i?'selected':''}>${esc(p.title)}</option>`).join('')}</select></label><p class="caption">${esc(p.source)}。点句子里的英文词，可以单独听。</p><div class="actions"><button class="primary" id="readAll">${speaker}逐句听，留时间跟读</button><button id="readStop">停止</button><button id="coverReading">${readingCovered?'显示课文':'遮住课文试读'}</button></div><div class="reading">${p.lines.map((s,i)=>`<article class="line" data-line="${i}"><button class="speak-line" data-speak-line="${i}">${speaker}第 ${i+1} 句</button><p class="line-text" lang="en" ${readingCovered?'hidden':''}>${s.split(/([A-Za-z]+(?:[’'][A-Za-z]+)*)/).map(t=>/^[A-Za-z]/.test(t)?`<button class="word-tap" data-read-word="${esc(t)}" aria-label="读 ${esc(t)}">${esc(t)}</button>`:esc(t)).join('')}</p></article>`).join('')}</div><div class="actions"><button id="readReport">我自己练读过这一篇</button></div><p class="caption">练读由本人勾选，不自动评发音，也不代替老师要求的视频回传。</p>`);$('#readingSelect').onchange=e=>{readingIndex=+e.target.value;renderReading()};document.querySelectorAll('[data-speak-line]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.line').forEach(a=>a.classList.toggle('active',a.dataset.line===b.dataset.speakLine));play(p.lines[+b.dataset.speakLine])});document.querySelectorAll('[data-read-word]').forEach(b=>b.onclick=()=>play(b.dataset.readWord,.88));$('#readStop').onclick=stop;$('#readAll').onclick=()=>{let i=0;const next=()=>{if(i>=p.lines.length)return;document.querySelectorAll('.line').forEach(a=>a.classList.toggle('active',+a.dataset.line===i));const s=p.lines[i++];play(s,1,false,()=>{const wait=Math.max(2200,Math.min(8500,s.split(' ').length*360));$('#audioFeedback').textContent='轮到你读，稍后继续下一句。';readTimer=setTimeout(next,wait)})};next()};$('#coverReading').onclick=()=>{readingCovered=!readingCovered;renderReading()};$('#readReport').onclick=()=>{state.readPractice[readingIndex]=new Date().toISOString();record('reading-'+readingIndex,'','self-reported-practice');$('#readReport').textContent='已记下练读；发音质量未评定'}}
function renderHomework(){$('#stage').innerHTML=shell('transfer','书本任务，回到书上完成',`<p>做完一项再勾选。这里的勾选，是你自己报告的完成情况。</p><div class="checklist">${C.homework.map(([id,title,tip])=>`<label><input type="checkbox" data-homework="${id}" ${state.homework[id]?'checked':''}><div><strong>${esc(title)}</strong><p class="caption">${esc(tip)}</p></div></label>`).join('')}</div>${C.computer?`<h3>老师要求：至少上机三次</h3><p class="caption">完成老师指定的平台任务后再勾选。打开本软件不自动算一次。</p><div class="homework-count">${state.computer.map((x,i)=>`<label class="row"><input type="checkbox" data-computer="${i}" ${x?'checked':''}>第 ${i+1} 次</label>`).join('')}</div>`:''}<div class="actions"><button class="primary" id="completeSession">结束这次学习并同步摘要</button><button id="reviewFromHomework">回看待复习词</button></div><div id="syncFeedback" aria-live="polite"></div>`);document.querySelectorAll('[data-homework]').forEach(b=>b.onchange=()=>{state.homework[b.dataset.homework]=b.checked;record('homework-'+b.dataset.homework,String(b.checked),'self-reported-homework')});document.querySelectorAll('[data-computer]').forEach(b=>b.onchange=()=>{state.computer[+b.dataset.computer]=b.checked;record('computer-'+b.dataset.computer,String(b.checked),'self-reported-computer-task')});$('#completeSession').onclick=sync;$('#reviewFromHomework').onclick=()=>{state.pack='只复习错词';state.mode='test';state.wordIndex=0;resetWordAttempt();goto('words')}}
async function sync(){stop();save();const t=$('#syncFeedback');if(test||DDLearningSync.isTest()){t.textContent='家长测试已隔离，不会上传正式学习记录。';return}if(state.revision===state.submittedRevision){t.textContent='这份摘要已进入同步队列。联网后会自动补传。';return}if(!state.history.length){t.textContent='还没有练习记录。可以先做一小段，再结束。';return}const eventId=C.appId+':'+state.session+':'+state.revision;const ok=DDLearningSync.complete({kid:C.child,subject:'英语',topic:C.title,client_event_id:eventId,item:'本周英语练习摘要；自报任务与独立作答分开',payload:{appId:C.appId,version:1,independentCorrect:state.history.filter(h=>h.result==='independent-correct').length,assisted:state.history.filter(h=>/assisted|reference/.test(h.result)).length,reviewWords:state.review.map(id=>C.words.find(w=>w.id===id)?.text),homeworkSelfReported:state.homework,computerSelfReported:C.computer?state.computer:null,elapsedSeconds:Math.round(state.elapsed),mastery:'not-assessed'}});if(ok){state.submittedRevision=state.revision;save();t.textContent='摘要已进入队列，正在同步。';const r=await DDLearningSync.flush();t.textContent=r.ok?'学习摘要已同步。':'摘要留在本机队列，联网后自动补传。'}else t.textContent='暂未加入同步队列，请稍后再试。'}
function exportFile(type){save();const md='# '+C.title+'\n\n孩子：'+C.child+'\n材料接收：'+C.receivedDate+'\n\n## 待复习词\n'+state.review.map(id=>C.words.find(w=>w.id===id)?.text).join('、')+'\n\n## 作答过程\n'+state.history.map(h=>'- '+h.at+' | '+h.id+' | '+h.answer+' | '+h.result).join('\n')+'\n\n## 本人报告的任务\n'+JSON.stringify({homework:state.homework,computer:state.computer,reading:state.readPractice},null,2)+'\n\n软件不根据打开、听读或自报勾选宣布掌握。\n';const data=type==='json'?JSON.stringify(state,null,2):md;const url=URL.createObjectURL(new Blob([data],{type:type==='json'?'application/json':'text/markdown;charset=utf-8'}));$('#modalTitle').textContent='带走学习记录';$('#modalBody').innerHTML=`<label class="field"><span>可下载，也可以全选复制</span><textarea id="exportText" readonly style="min-height:260px"></textarea></label><div class="actions"><a class="button primary" id="downloadFile">下载 ${type.toUpperCase()}</a><button id="copySelect">全选文字</button></div>`;$('#exportText').value=data;$('#downloadFile').href=url;$('#downloadFile').download=C.appId+'-'+day+'.'+type;$('#copySelect').onclick=()=>{$('#exportText').focus();$('#exportText').select()};setTimeout(()=>URL.revokeObjectURL(url),600000)}
function parent(){stop();$('#modal').hidden=false;$('#modalTitle').textContent='家长 · 本周学习记录';$('#modalBody').innerHTML=`<div data-parent-analysis><p>${esc(C.source)}。</p><p>本周要求按 9 月 13 日收到的老师文字归档；具体授课日期未由通知单独写明。第 8 扫描页归属待确认，本课未拿它作为个人学情。</p><p>${C.child==='kenton'?'比较级、最高级“默写不太好”是老师对全班的反馈；不预判哥哥本人不会。词形依据本次笔记；动物词依据 PU2 可见两页，老师实际默写清单未单独提供。':'本周课外词表共 36 个；另列 7 个校内地点词为选学。书本 p41–42 页码来自老师通知；扫描第19页是 W-Questions Exercise1，第16页 Exercise2 与书p42的对应尚未确认，不据此代做书面题。'}</p><p>英语为固定美式候选声线 af_heart。音频待验收：文件已生成，尚未完成逐条听感与手机硬件实播。读音按钮失败会明确提示。课文源页有裁切时只收录可读正文，不补造听力答案。</p><p>语音输入：家长报告本机 Control + H 可用。可先点输入框，再用这台电脑已配置的语音输入；快捷键由设备决定，本软件不改系统快捷键。听写若借助语音转写，请勾选提示，不计为独立拼写。</p><p>正确首答可短暂停留后前进；答错、看过答案和开放表达保留手动继续。错词需连续两次独立正确才退出当前复习列表，历史仍保留；长期掌握待延迟复测。</p><label class="row"><input type="checkbox" id="autoAdvance" ${state.auto?'checked':''}>独立答对后自动进入下一题</label><p>完整表达只保存本人原话并引导自查，不按关键词宣布口语或语法掌握。所有作答与备份分孩子、软件和正式/测试空间保存；只有明确结束才上传匿名摘要，原话留在本机。</p><div class="actions"><button id="exportJson">完整备份 JSON</button><button id="exportMd">学习记录 Markdown</button><button id="parentReview">只练错词</button></div><label class="field"><span>导入同一孩子、同一软件、同一模式的备份</span><input id="importFile" type="file" accept=".json,application/json"></label><p id="importFeedback" role="status"></p><details><summary>完整词表与材料覆盖</summary><div class="table-scroll"><table><thead><tr><th>范围</th><th>词与来源</th></tr></thead><tbody>${C.words.map(w=>`<tr><td>${esc(w.pack)}</td><td>${esc(w.text)} · ${esc(w.zh)}<br><small>${esc(w.source)}</small></td></tr>`).join('')}</tbody></table></div></details><details><summary>最近的原始作答（${state.history.length} 条）</summary>${state.history.slice(-80).reverse().map(h=>`<div class="record"><p>${esc(h.id)} · ${esc(h.result)}</p><p>${esc(h.answer)||'（无文字作答）'}</p><small>${esc(h.at)}</small></div>`).join('')}</details></div>`;$('#autoAdvance').onchange=e=>{state.auto=e.target.checked;save()};$('#exportJson').onclick=()=>exportFile('json');$('#exportMd').onclick=()=>exportFile('md');$('#parentReview').onclick=()=>{$('#modal').hidden=true;state.pack='只复习错词';state.mode='test';state.wordIndex=0;resetWordAttempt();goto('words')};$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2*1024*1024)throw Error('文件太大');const s=JSON.parse(await f.text());if(!valid(s))throw Error('孩子、软件、模式或数据结构不匹配');WeekPrivate.set.call(localStorage,KEY+':before-import',JSON.stringify(state));state=s;state.session=uid();state.submittedRevision=-1;save();render();$('#importFeedback').textContent='已导入；导入前的记录已备份在本机。'}catch(err){$('#importFeedback').textContent='没有导入：'+err.message+'。原记录保留。'}}}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>goto(b.dataset.nav));$('#parentBtn').onclick=parent;$('#closeModal').onclick=()=>$('#modal').hidden=true;$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').hidden=true};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#modal').hidden=true;stop()}});document.addEventListener('visibilitychange',()=>{stop();save();lastTick=Date.now()});window.addEventListener('pagehide',()=>{stop();save()});render();if(restoreNotice)$('#saveStatus').textContent=restoreNotice;
</script></body></html>
