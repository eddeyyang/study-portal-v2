<style>

 --card:#fff;--line:#f0ddd0;--green:#2e9c54;--greenbg:#e9f7ee;--red:#e1553f;--redbg:#fdecea;--muted:#9a8b82;--blue:#2f6fb3;--bluebg:#e8f0fa;--tap:48px;}

body{margin:0;font-family:'LXGW WenKai Screen','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
 background:radial-gradient(circle at 10% 4%,#ffe1cc 0,transparent 42%),radial-gradient(circle at 92% 12%,#fff3cf 0,transparent 36%),var(--paper);color:var(--ink);min-height:100vh;padding-bottom:64px;}

.top{display:flex;align-items:center;gap:10px;padding:8px 2px;}

.home{text-decoration:none;font-size:20px;background:#fff;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink);box-shadow:0 3px 0 #f0d8c8;flex:none;}
.intro{font-size:13.5px;color:#6b5a4e;line-height:1.75;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;}
.intro b{color:var(--cd);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile{position:relative;background:#fff;border:2px solid var(--line);border-top:6px solid var(--c);border-radius:18px;padding:15px 11px;cursor:pointer;box-shadow:0 6px 0 #f3e2d6;text-align:center;}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 #f3e2d6;}
.tile .ic{font-size:34px;}.tile .nm{font-weight:800;font-size:15px;margin-top:7px;color:var(--cd);}.tile .ds{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;}
.tile.gold{border-top-color:var(--gold);}
.tile .done{position:absolute;top:-9px;right:-6px;background:var(--green);color:#fff;font-size:10.5px;font-weight:800;border-radius:9px;padding:2px 8px;box-shadow:0 2px 0 rgba(0,0,0,.12);}
.tile .done.bad{background:var(--red);}
.tile .done.pending{background:#8d8178;color:#fff;}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:15px;margin:11px 0;box-shadow:0 6px 0 #f3e2d6;}
.h2{font-size:17px;font-weight:800;color:var(--cd);margin:0 0 4px;}

.why b{color:var(--green);}

.deep .q{font-weight:800;color:#a8730a;}
.btn{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:12px;padding:12px 16px;cursor:pointer;color:#fff;background:var(--c);box-shadow:0 4px 0 var(--cd);min-height:var(--tap);}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--golddk);color:#5a3d00;}
.btn.ghost{background:#fff;color:var(--cd);border:2px solid var(--line);box-shadow:0 4px 0 #f3e2d6;}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 #1f4e7e;}
.btn:active{transform:translateY(2px);}

.back{background:none;border:none;color:var(--muted);font-size:15px;font-family:inherit;font-weight:800;cursor:pointer;padding:6px 2px;}
.hide{display:none!important;}
.tag{display:inline-block;background:var(--gold);color:#5a3d00;font-size:11px;font-weight:800;border-radius:8px;padding:2px 8px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.tipbar{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6;}
/* 算式变身机 */
.formula{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin:10px 0;font-weight:800;}
.tok{background:var(--cbg);border:2px solid #f0cdb6;color:var(--cd);border-radius:12px;padding:8px 13px;font-size:22px;min-width:44px;text-align:center;transition:transform .45s ease,opacity .45s ease,background .3s;}
.tok.op{background:#fff;border-color:var(--line);color:#8a6a55;font-size:19px;padding:8px 9px;min-width:0;}
.tok.ans{background:var(--gold);border-color:var(--golddk);color:#5a3d00;}
.tok.hi{background:#ffe9b8;border-color:var(--gold);box-shadow:0 0 0 3px #ffe9b8;}
.tok.friend{background:#d9f2e2;border-color:var(--green);color:var(--green);}
.baby{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease;}
.baby.show{opacity:1;transform:translateY(0);}
.names{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:700;}
.names span{min-width:44px;text-align:center;}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;}
.chip{font-family:inherit;font-weight:800;font-size:14px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--cd);min-height:var(--tap);}
.chip.on{background:var(--c);color:#fff;border-color:var(--cd);}
/* 分步动画 */
.steps{display:flex;gap:6px;justify-content:center;margin:6px 0 10px;}
.sdot{width:30px;height:8px;border-radius:999px;background:#f0ddd0;}
.sdot.on{background:var(--c);}
.stepnote{background:var(--bluebg);border-left:5px solid var(--blue);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.7;margin:8px 0;min-height:44px;}
.stepnote b{color:var(--blue);}
/* 回忆卡 */
.recall{background:linear-gradient(135deg,#fff,#fff6ea);border:2px solid var(--gold);border-radius:16px;padding:18px 14px;text-align:center;margin:10px 0;box-shadow:0 6px 0 #f3e2d6;}
.recall .q{font-size:20px;font-weight:800;color:var(--cd);line-height:1.5;}
.recall .a{font-size:20px;font-weight:800;color:var(--green);line-height:1.5;}
.recall .mask{display:inline-block;background:#5a3d00;color:#5a3d00;border-radius:8px;padding:0 12px;user-select:none;}
/* 检验站 */
.timerbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 13px;font-weight:800;font-size:14px;color:var(--cd);margin:8px 0;}
.qprog{font-size:12.5px;color:var(--muted);font-weight:800;}
.qbox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;}
.qtext{font-size:16.5px;font-weight:800;line-height:1.7;margin:2px 0 10px;}
.qtext .star{color:var(--golddk);}
.opts{display:grid;gap:9px;}
.opt{font-family:inherit;text-align:left;font-size:15px;font-weight:700;line-height:1.5;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;min-height:46px;color:var(--ink);}
.opt:active{transform:scale(.98);}
.opt.right{background:var(--greenbg);border-color:var(--green);color:var(--green);}
.opt.wrong{background:var(--redbg);border-color:var(--red);color:var(--red);}

.answerbox label{display:block;font-size:13px;font-weight:800;color:var(--cd);margin-bottom:8px;line-height:1.6;}
.answerrow{display:flex;gap:9px;align-items:stretch;}
.answerrow input{min-width:0;flex:1;border:2px solid var(--line);border-radius:12px;padding:11px 13px;font:800 20px/1.2 inherit;color:var(--ink);background:#fff;outline:none;min-height:var(--tap);}
.answerrow input:focus{border-color:var(--c);box-shadow:0 0 0 3px rgba(232,100,47,.12);}
.coverage{display:grid;gap:8px;margin-top:10px;}
.coverage-row{display:grid;grid-template-columns:72px 1fr auto;gap:9px;align-items:center;background:#fff8f2;border:1px solid #f3d7c6;border-radius:12px;padding:9px 10px;font-size:12.5px;line-height:1.55;}
.coverage-row b{color:var(--cd);}.coverage-row span:last-child{font-size:11px;font-weight:800;color:var(--green);white-space:nowrap;}
.contract{background:linear-gradient(135deg,#fff0e6,#fff9df);border:2px solid #f0c9ad;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.8;margin:10px 0;}
.contract b{color:var(--cd);}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0;}
.mapnode{background:#fff;border:2px solid var(--line);border-radius:13px;padding:10px;font-size:13px;line-height:1.6;}
.mapnode b{display:block;color:var(--cd);font-size:14px;margin-bottom:3px;}
.worked{display:grid;gap:8px;margin:9px 0;}
.worked div{background:#fff;border:1px dashed #e8b98f;border-radius:11px;padding:9px 11px;font-size:14px;line-height:1.75;}
.fb{border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.75;margin-top:10px;}
.fb.ok{background:var(--greenbg);border:2px solid var(--green);}
.fb.no{background:var(--redbg);border:2px solid var(--red);}
.fb .etag{display:inline-block;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;border-radius:8px;padding:2px 9px;margin-bottom:5px;}
.explain{background:#fff;border:1.5px dashed var(--golddk);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:13.5px;line-height:1.75;}
.explain b{color:#a8730a;}
/* 记录面板 */
.panel{background:#fff;border:2px solid var(--blue);border-radius:16px;padding:13px 14px;margin:12px 0;}
.panel h3{margin:0 0 6px;font-size:15px;color:var(--blue);}
.panel .stat{font-size:13.5px;line-height:1.8;color:#4a3c33;}
.panel .stat b{color:var(--cd);}
.result-big{font-size:44px;font-weight:800;text-align:center;color:var(--golddk);margin:6px 0;}
.daily-spark{width:100%;margin:4px 0 10px;background:linear-gradient(135deg,#fff8d8,#fff);border:2px solid var(--gold);border-radius:14px;padding:10px 12px;color:#6a4700;font:800 13px/1.6 inherit;cursor:pointer;min-height:var(--tap);text-align:left;box-shadow:0 4px 0 #ead39a;}
.daily-answer{display:block;color:var(--green);margin-top:3px;}
.fadeup{animation:fadeup .4s ease both;}
@keyframes fadeup{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>

var EV_KEY='study:eddey:math-g4-u1-textbook-complete-20260901:v1:events';
var WB_KEY='study:eddey:math-g4-u1-textbook-complete-20260901:v1:wrongbook';
function loadJSON(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function loadEvents(){var v=loadJSON(EV_KEY,[]);return Array.isArray(v)?v:[];}
function saveEvents(a){try{localStorage.setItem(EV_KEY,JSON.stringify(a.slice(-400)));}catch(e){}}
function loadWB(){var v=loadJSON(WB_KEY,{});return (v&&typeof v==='object'&&!Array.isArray(v))?v:{};}
function saveWB(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function logEvent(ev){var a=loadEvents();a.push(ev);saveEvents(a);
 if(ev.qid){var wb=loadWB();
  if(ev.ok===false){var r=wb[ev.qid]||{fails:0,streak:0};r.fails+=1;r.streak=0;wb[ev.qid]=r;}
  else if(ev.ok===true&&wb[ev.qid]){wb[ev.qid].streak+=1;if(wb[ev.qid].streak>=2)delete wb[ev.qid];}
  saveWB(wb);}
}
function wbCount(){return Object.keys(loadWB()).length;}
function stationStat(sid){var a=loadEvents().filter(function(e){return e.station===sid&&typeof e.ok==='boolean';});
 if(!a.length)return null;var ok=a.filter(function(e){return e.ok;}).length;return {ok:ok,bad:a.length-ok};}

var AC=null;
function beep(good){try{
 if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
 if(AC.state==='suspended')AC.resume();
 var t=AC.currentTime;
 function tone(f,st,d){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t+st);g.gain.exponentialRampToValueAtTime(0.12,t+st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+st+d);
  o.connect(g);g.connect(AC.destination);o.start(t+st);o.stop(t+st+d+0.02);}
 if(good){tone(660,0,0.12);tone(880,0.1,0.18);}else{tone(196,0,0.25);}

function renderPanel(){

 var ok=a.filter(function(e){return e.ok;}).length,bad=a.length-ok;
 var wb=loadWB(),wbList=Object.keys(wb);
 var ms=a.reduce(function(s,e){return s+(e.ms||0);},0);
 var h='<div class="panel"><h3>📊 我的练习记录</h3><div class="stat">已作答 <b>'+a.length+'</b> 题次 · ✅对 <b>'+ok+'</b> · ❌错 <b>'+bad+'</b> · 累计用时 <b>'+Math.round(ms/1000)+'秒</b><br>📒 错题本：<b>'+wbList.length+'</b> 题'+(wbList.length?('（'+wbList.map(function(k){var q=QUESTIONS.find(function(x){return x.id===k;});return q?q.short:k;}).join('、')+'）'):'（空空如也，太棒了）')+'</div>'+
 '<div class="row"><button class="btn blue sm" id="btnCopy">📋 复制记录</button><button class="btn ghost sm" id="btnSave">💾 存成文件</button></div></div>';
 var p=$('recordPanel');if(!p)return;p.innerHTML=h;
 $('btnCopy').onclick=function(){copyText(exportText(),this);};
 $('btnSave').onclick=function(){downloadText(exportText());};
}
function exportText(){
 var a=loadEvents();var wb=loadWB();
 var lines=[];
 lines.push('弟弟(eddey) · 数学 · 四上金牌预习 第1单元《运算关系与运算律》');
 lines.push('导出时间：'+new Date().toLocaleString('zh-CN'));
 var att=a.filter(function(e){return typeof e.ok==='boolean';});
 var ok=att.filter(function(e){return e.ok;}).length;
 lines.push('总作答 '+att.length+' 题次 · 对 '+ok+' · 错 '+(att.length-ok));
 lines.push('');
 lines.push('== 错题本（连对2次才毕业）==');
 var keys=Object.keys(wb);
 if(!keys.length)lines.push('（空）');
 keys.forEach(function(k){var q=QUESTIONS.find(function(x){return x.id===k;});
  lines.push('· '+(q?q.short:k)+'｜错过 '+wb[k].fails+' 次 · 连对 '+wb[k].streak+'/2');});
 lines.push('');
 lines.push('== 反复错的题（错≥2次）==');
 var cnt={};att.forEach(function(e){if(!e.ok&&e.qid)cnt[e.qid]=(cnt[e.qid]||0)+1;});
 var rep=Object.keys(cnt).filter(function(k){return cnt[k]>=2;});
 if(!rep.length)lines.push('（暂无）');
 rep.forEach(function(k){var q=QUESTIONS.find(function(x){return x.id===k;});
  lines.push('· '+(q?q.short:k)+' 错 '+cnt[k]+' 次｜错因 '+(q?q.tag:'')+'｜'+(q?q.hint:''));});
 lines.push('');
 lines.push('== 每题明细 ==');
 att.forEach(function(e){lines.push('['+new Date(e.ts).toLocaleString('zh-CN')+'] '+(e.ok?'✅':'❌')+' '+e.item+'｜所选:'+e.user+'｜'+Math.round((e.ms||0)/1000)+'秒'+(e.ok?'':('｜错因:'+e.tag)));});
 lines.push('');
 lines.push('== 原始JSON ==');
 lines.push(JSON.stringify({child:'eddey',subject:'数学',app:'math-gold-g4u1',unit:'四上第1单元 运算关系与运算律',events:a}));
 return lines.join('\n');
}
function copyText(txt,btn){
 function done(){if(btn){var o=btn.textContent;btn.textContent='✅ 已复制';setTimeout(function(){btn.textContent=o;},1500);}}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallback();});}
 else fallback();
 function fallback(){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();done();}
}
function downloadText(txt){
 var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
 var a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='eddey_数学_四上第1单元_预习记录_'+new Date().toISOString().slice(0,10)+'.txt';
 document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(a.href);},400);
}

 {n:'加法结合律',f:'(a+b)+c = a+(b+c)',memo:'换位置靠交换律，加括号靠结合律',eg:'(20+40)+18 = 20+(40+18)'},
 {n:'乘法结合律',f:'(a×b)×c = a×(b×c)',memo:'先乘哪两个都行，记得加括号',eg:'25×17×4 = 17×(25×4)'},
 {n:'乘法分配律',f:'(a+b)×c = a×c + b×c',memo:'括号里每个数都要和外面的数相乘',eg:'(25+9)×4 = 25×4 + 9×4'}
];

  {toks:['25','×','17','×','4'],hi:[],note:'<b>第1步·找朋友：</b>记住乘法凑整三兄弟：<b>2×5=10、4×25=100、8×125=1000</b>。这里有 25 和 4！'},
  {toks:['17','×','25','×','4'],hi:[2,4],note:'<b>第2步·交换位置（乘法交换律）：</b>把 25 和 4 搬到一起。'},

 {id:'q26',lv:'常考',short:'被除数看错',back:'s7',tag:'G4 商差与被除数差没连接',q:'被除数218看成128，商比正确结果少2，余数相同。除数是多少？',answer:'45',hint:'被除数少了218−128＝90，商少2，说明90是2个除数：90÷2＝45。'},
 {id:'q27',lv:'常考',short:'四部分和',back:'s7',tag:'G4 和倍关系没翻译',q:'商7余4，被除数、除数、商、余数的和是119。除数是多少？',answer:'13',hint:'119−7−4＝108；被除数＋除数＝108。被除数＝7×除数＋4，所以(108−4)÷8＝13。'},

 {id:'q29',lv:'常考',short:'接近整百乘法',back:'s7',tag:'G2 分配律漏乘',q:'28×98＝？',answer:'2744',hint:'98＝100−2：28×100−28×2＝2800−56＝2744。'},
 {id:'q30',lv:'常考',short:'125乘808',back:'s7',tag:'G3 拆数后漏项',q:'125×808＝？',answer:'101000',hint:'808＝800＋8：125×800＋125×8＝100000＋1000＝101000。'},

var quiz=null,qTimer=null;
function groupOf(q){var n=Number(q.id.replace('q',''));if(n<=4||n>=10&&n<=16)return'relation';if(n>=5&&n<=9)return'laws';if(n>=17&&n<=23)return'methods';if(n>=24&&n<=30)return'common';return'enrich';}
function answerValue(q){return q.answer!=null?String(q.answer):String(q.opts[q.ans]);}
function useInput(q){return q.answer!=null||/^-?\d+(\.\d+)?$/.test(answerValue(q));}
function startQuiz(mode,group){
 var list;
 if(mode==='wrong'){
  var wb=loadWB();list=QUESTIONS.filter(function(q){return wb[q.id];});
  if(!list.length){renderHome();return;}
 }else if(mode==='group')list=QUESTIONS.filter(function(q){return groupOf(q)===group;});
 else list=QUESTIONS.slice();
 quiz={mode:mode,group:group||'all',list:list,i:0,right:0,wrong:0,t0:Date.now(),qStart:Date.now(),wrongs:[]};
 $('home').classList.add('hide');$('view').classList.remove('hide');window.scrollTo(0,0);
 drawQ();
}
function fmtSec(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+'分'+(s%60)+'秒';}
function drawQ(){
 var q=quiz.list[quiz.i];
 var order=[];if(!useInput(q)){order=q.opts.map(function(_,i){return i;});for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}quiz.order=order;}quiz.qStart=Date.now();
 var h='<div class="timerbar"><span class="qprog">'+(quiz.mode==='wrong'?'📒 错题重做':'📝 独立检验')+' · 第 '+(quiz.i+1)+' / '+quiz.list.length+' 题 · '+q.lv+'</span><span id="qclock">⏱ 0秒</span></div>'+ 
 '<div class="qbox fadeup" data-phase="independent"><div class="qtext">'+(q.lv.indexOf('★')>=0?'<span class="star">★</span> ':'')+esc(q.q)+'</div><div class="opts" id="opts"></div><div id="fb" aria-live="polite"></div></div>';
 $('stage').innerHTML=h;
 var oh='';
 if(useInput(q))oh='<div class="answerbox"><label for="shortAnswer">先在纸上或脑中算，再输入关键数字。没有选项，避免靠猜。</label><div class="answerrow"><input id="shortAnswer" inputmode="numeric" autocomplete="off" aria-label="输入答案"><button class="btn" id="submitAnswer">提交</button></div></div>';
 else order.forEach(function(oi,idx){oh+='<button class="opt" data-oi="'+oi+'"><b style="color:var(--cd)">'+'ABCD'[idx]+'.</b> '+esc(q.opts[oi])+'</button>';});
 $('opts').innerHTML=oh;
 if(qTimer)clearInterval(qTimer);
 qTimer=setInterval(function(){var c=$('qclock');if(c)c.textContent='⏱ '+fmtSec(Date.now()-quiz.t0);},500);
 if(useInput(q)){$('submitAnswer').onclick=function(){answerInput(q);};$('shortAnswer').onkeydown=function(e){if(e.key==='Enter')answerInput(q);};setTimeout(function(){var a=$('shortAnswer');if(a)a.focus();},30);}
 else $('opts').querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(q,+b.dataset.oi,b);};});
}
function answerInput(q){var box=$('shortAnswer');if(!box||box.disabled)return;var raw=box.value.trim().replace(/[,，\s]/g,'');if(raw===''){box.focus();return;}var ok=raw===answerValue(q).replace(/[,，\s]/g,'');box.disabled=true;$('submitAnswer').disabled=true;box.style.borderColor=ok?'var(--green)':'var(--red)';finishAnswer(q,raw,ok,$('submitAnswer'));}
function answer(q,oi,btn){
 var ok=(oi===q.ans);
 $('opts').querySelectorAll('.opt').forEach(function(b){b.style.pointerEvents='none';
  if(+b.dataset.oi===q.ans)b.classList.add('right');});
 finishAnswer(q,q.opts[oi],ok,btn);
}
function finishAnswer(q,user,ok,btn){
 var ms=Date.now()-quiz.qStart;
 beep(ok);
 logEvent({ts:Date.now(),station:'s5',qid:q.id,item:q.q,user:String(user),ok:ok,ms:ms,tag:ok?'':q.tag,hint:q.hint});
 if(ok){quiz.right++;btn.classList.add('right');
  $('fb').innerHTML='<div class="fb ok fadeup">🎉 <b>答对了！</b>'+(quiz.mode==='wrong'?'<br>📒 错题连对进度已更新（连对2次毕业）。':'')+
  '<div class="row" style="margin-top:8px"><button class="btn sm" id="qnext">'+(quiz.i<quiz.list.length-1?'下一题 ›':'看成绩 ›')+'</button></div></div>';
 }else{quiz.wrong++;btn.classList.add('wrong');quiz.wrongs.push(q);
  if(!q.retry&&quiz.mode!=='wrong'){var retry={};for(var k in q)retry[k]=q[k];retry.retry=true;quiz.list.splice(Math.min(quiz.i+2,quiz.list.length),0,retry);}
  $('fb').innerHTML='<div class="fb no fadeup" data-phase="repair"><span class="etag">🏷️ 错因：'+q.tag+'</span>'+ 
  '<div>正确答案：<b>'+esc(answerValue(q))+'</b>（本题已进错题本📒）</div>'+
  '<div class="explain">💡 <b>只修断掉的一步：</b>'+q.hint+'<br><b>同一道原题会在后面重新出现，必须再独立做对。</b></div>'+
  '<div class="row" style="margin-top:8px"><button class="btn gold sm" id="qback">📖 回炉重学这一站</button><button class="btn sm" id="qnext" data-return-to-question="same-original-after-repair">知道了，先修复再回原题 ›</button></div></div>';
  $('qback').onclick=function(){openStation(q.back);};
 }
 $('qnext').onclick=function(){
  quiz.i++;
  if(quiz.i<quiz.list.length){drawQ();window.scrollTo(0,0);}
  else drawResult();
 };
}
function drawResult(){
 if(qTimer){clearInterval(qTimer);qTimer=null;}
 var total=Date.now()-quiz.t0;
 var all=quiz.list.length,score=Math.round(quiz.right/all*100);
 var wb=loadWB(),wc=Object.keys(wb).length;
 var h='<div class="card fadeup" data-phase="transfer" style="text-align:center"><div class="h2">🏁 '+(quiz.mode==='wrong'?'错题重做':'独立检验')+'成绩单</div>'+ 
 '<div class="result-big">'+score+'<span style="font-size:20px">分</span></div>'+
 '<div style="font-size:15px;font-weight:800">✅ 对 '+quiz.right+' 题 ｜ ❌ 错 '+quiz.wrong+' 题 ｜ ⏱ 用时 '+fmtSec(total)+'</div>'+
 '<div style="font-size:13px;color:var(--muted);margin-top:4px">平均每题 '+fmtSec(total/all)+' ｜ 📒 错题本现有 '+wc+' 题'+(wc?'，去首页点"错题本"专门消灭它们':'，全部毕业，太棒了！')+'</div></div>';
 if(quiz.wrongs.length){
  h+='<div class="card"><div class="h2">🔍 错题回顾（带讲解）</div>';
  quiz.wrongs.forEach(function(q){
   h+='<div class="fb no" style="margin-top:8px"><span class="etag">🏷️ '+q.tag+'</span><div style="font-weight:800">'+esc(q.q)+'</div><div>正确答案：<b>'+esc(answerValue(q))+'</b></div><div class="explain">💡 '+q.hint+'</div></div>';
  });
  h+='</div>';
 }else{
  h+='<div class="card" style="text-align:center"><div style="font-size:40px">🏆</div><div style="font-weight:800;color:var(--golddk)">全对！第1单元已经可以开学领跑啦</div></div>';
 }
 h+='<div class="row" style="justify-content:center;margin:12px 0"><button class="btn" id="rretry">🔁 再测一次</button>'+(wc?'<button class="btn gold" id="rwrong">📒 只重做错题</button>':'')+'<button class="btn ghost" id="rhome">回单元地图</button></div>';
 $('stage').innerHTML=h;
 window.scrollTo(0,0);
 $('rretry').onclick=function(){startQuiz(quiz.mode,quiz.group);};
 var rw=$('rwrong');if(rw)rw.onclick=function(){startQuiz('wrong');};
 $('rhome').onclick=function(){goHome();};
}

/* ============ 错题本入口 ============ */
function openWrongbook(){
 var wb=loadWB(),keys=Object.keys(wb);
 $('home').classList.add('hide');$('view').classList.remove('hide');window.scrollTo(0,0);
 if(!keys.length){
  $('stage').innerHTML='<div class="card fadeup" style="text-align:center"><div class="h2">📒 错题本</div><div style="font-size:38px;margin:8px 0">🎉</div><div style="font-weight:800;line-height:1.8">错题本是空的！<br>做错的题会自动进来，连对 2 次才能毕业出去。</div></div>';
  return;
 }
 var h='<div class="card fadeup"><div class="h2">📒 错题本（'+keys.length+' 题待毕业）</div><div class="base">规则：<b>错 1 次进本，连续答对 2 次才毕业</b>。点下面按钮逐题消灭它们！</div>';
 keys.forEach(function(k){var q=QUESTIONS.find(function(x){return x.id===k;});if(!q)return;
  h+='<div class="fb no" style="margin-top:8px"><span class="etag">🏷️ '+q.tag+'</span><div style="font-weight:800">'+esc(q.q)+'</div><div style="font-size:12.5px;color:var(--muted)">错过 '+wb[k].fails+' 次 · 连对 '+wb[k].streak+'/2</div></div>';});
 h+='<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="wbstart">🔥 开始重做错题</button></div></div>';
 $('stage').innerHTML=h;
 $('wbstart').onclick=function(){startQuiz('wrong');};
}

renderDailySurprise();
renderHome();
</script>
