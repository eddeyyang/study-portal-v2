function submit(){const p=state.position,q=current();if(p.stage!=='answer')return;if(!p.draft?.trim()){$('answer').focus();$('saveStatus').textContent='先写一点；不会时可以看方法，不会锁住。';return;}p.tries++;if(q.open){note(p.draft,q.id,q.answers[0],null,false,'open-response',q.skill);p.assisted=true;p.stage='reference';renderReference();save();return;}const ok=match(q,p.draft);note(p.draft,q.id,q.answers[0],ok,p.assisted,'answer',q.skill);if(ok){p.stage='correct';p.results.push({id:q.id,ok:true,independent:!p.assisted});correctFeedback();}else{p.assisted=true;state.seen[q.id]=true;p.stage='repair';renderReference();}save();}

function parent(){const pending=Object.values(state.wrong).filter(w=>w.status==='review').length;show('<section class="hero" data-parent-analysis><span class="eyebrow">EDDEY · 家长页</span><h1>范围与本机记录</h1><p>U4《Our birthday》；教材实际扫描p31–38优先，练习对应一课一练p25–27。</p><p class="small">重点先检查对话衔接、人物动作归属及漏项。一次卷面不能证明“经常错”；已经做对的语法不预设为弱项。网页不公开原答、成绩或原卷。</p><p class="small">20词与词组、10个背默句为本次复习建议，不冒充老师新通知。公开页面以自编变式、必要短句与复述提示为主；整段课文请配纸书或已交付PDF。</p><p class="small">本课是视觉提示下的阅读、拼写、词块背默，不含自动报读、听辨或发音评分。若要练听写，需要另有经试听合格的音频。</p><h2>本轮怎么带</h2><p>约25—30分钟：对话7分钟 → 人物/活动与新短文7分钟 → 语法按需5分钟 → 5词2句6分钟。学校作业与本软件共用这段时间；未接入的纸笔用时不能自动累计。</p><label>这轮已做的同科纸笔/对话分钟<input id="paperMinutes" type="number" min="0" max="30" value="0"></label><button id="addPaper" class="quiet">计入本轮时间</button><h2>记录与复习</h2><p>已记录 '+state.attempts.length+' 次作答/提示；待复习 '+pending+' 项。累计 '+Math.floor(state.seconds/60)+' 分钟。</p><p class="small">本机自动保存，只有“完成并同步”才提交匿名摘要。测试、预览不上传。原话留在本机；看答案后正确不算独立。连续两次独立正确只关闭当前错题，不能代替跨日稳定掌握。</p><div class="actions"><button id="exportJSON">导出 JSON</button><button id="exportMD">导出可读记录</button></div><label>导入同一孩子、软件、版本和模式的 JSON<input type="file" id="importFile" accept=".json,application/json"></label><p id="importStatus" class="status"></p><a id="testLink" href="?mode=test">家长测试，不影响正式记录</a><details><summary>查看本机历史</summary>'+state.attempts.slice(-80).reverse().map(a=>'<div class="record">'+esc(a.ts)+' · '+esc(a.task)+'<span style="display:block"></span>原答：'+esc(a.answer)+'<span style="display:block"></span>状态：'+(a.ok===true?(a.assisted?'辅助完成':'独立正确'):a.ok===false?'待修复':'待复看')+'</div>').join('')+'</details></section>');$('addPaper').onclick=()=>{const m=Number($('paperMinutes').value);if(Number.isFinite(m)&&m>=0&&m<=30){state.seconds+=m*60;state.roundSeconds+=m*60;save();$('paperMinutes').value='0';$('saveStatus').textContent='已计入本轮；不会覆盖之前用时。';}};$('exportJSON').onclick=()=>download('Eddey-U4-records.json',JSON.stringify(state,null,2),'application/json');$('exportMD').onclick=()=>download('Eddey-U4-records.md','# Eddey U4 复习记录\n\n'+state.attempts.map(a=>`- ${a.ts} | ${a.task} | ${a.ok===true?(a.assisted?'辅助正确':'独立正确'):'待复习/复看'}\n  原答：${a.answer}\n  参考：${a.reference}`).join('\n'),'text/markdown');$('importFile').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>5000000)throw Error('文件过大');const s=JSON.parse(await file.text());if(!valid(s))throw Error('孩子、版本、模式或格式不匹配');const ids=new Set(state.attempts.map(a=>a.id));const incoming=s.attempts.filter(a=>!ids.has(a.id));state.attempts.push(...incoming);state.seconds=Math.max(state.seconds,s.seconds);for(const [id,w]of Object.entries(s.wrong)){if(!byId[id]&&!DIALOGUES.some(d=>d.id===id))continue;if(w&&['review','resolved'].includes(w.status)&&Number.isInteger(w.streak)&&w.streak>=0&&typeof w.last==='string'&&(!state.wrong[id]||w.last>state.wrong[id].last))state.wrong[id]=w;}save();$('importStatus').textContent='已合并 '+incoming.length+' 条；当前题目和原有记录保留。';}catch(e){$('importStatus').textContent='未导入：'+e.message+'。原记录保留。';}};}
