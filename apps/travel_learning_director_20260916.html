  const roundKey=(who,subject)=>'study:'+who+':'+subject+'-study-round:v1:'+mode;
  // Scene and subject intentionally do not create another time allowance.
  const windowKey=(who=child,plannedDay=day,realDate=date)=>realDate+':'+who+':'+plannedDay;
  function elapsed(){const value=readSaved().elapsed;return object(value)&&value.version===1&&object(value.windows)&&object(value.active)?value:{version:1,windows:{},active:{}};}
  function writeElapsed(value){try{localStorage.setItem(key,JSON.stringify({...readSaved(),elapsed:value}));}catch{}}
  function roundTotal(who,subject){
    try{
      const raw=localStorage.getItem(roundKey(who,subject));if(raw===null)return 0;
      const value=JSON.parse(raw);if(!object(value)||!validSeconds(value.seconds)||!Array.isArray(value.rounds))return null;
      let total=value.seconds;for(const item of value.rounds){if(!object(item)||!validSeconds(item.seconds))return null;total+=item.seconds;}
      return validSeconds(total)?total:null;
    }catch{return null;}
  }
  function softwareUsed(data=elapsed(),id=windowKey()){return validSeconds(data.windows[id])?data.windows[id]:0;}
  function refreshContext(){
    const current=today();if(current!==date){date=current;actual=Math.floor((Date.parse(date)-Date.parse(plan.startDate))/86400000)+1;day=actual>=1&&actual<=10?actual:2;choice=null;scene=null;}
    const latest=readSaved();spent=latest.date===date&&object(latest.spent)?latest.spent:{};limits=latest.date===date&&object(latest.limits)?latest.limits:{};used=previousUsed();
  }
  function settle(){
    refreshContext();const data=elapsed();let changed=false;
    for(const [id,active] of Object.entries(data.active)){
      if(!object(active)||!['kenton','eddey'].includes(active.child)||!['math','chinese','english'].includes(active.subject)||id!==active.child+':'+active.subject||active.date!==date||!Number.isInteger(active.day)||active.day<1||active.day>10){delete data.active[id];changed=true;continue;}
      const total=roundTotal(active.child,active.subject);if(total===null)continue;
      // A corrupt/missing baseline is not reconstructed from earlier learning.
      if(!validSeconds(active.lastTotal)){active.lastTotal=total;changed=true;continue;}
      if(total>active.lastTotal){
        const target=windowKey(active.child,active.day,active.date);
        data.windows[target]=softwareUsed(data,target)+total-active.lastTotal;
        active.lastTotal=total;changed=true;
      }
      // Keep the high-water mark if storage regresses; never refund spent time.
    }
    if(changed)writeElapsed(data);return data;
  }
  function begin(subject,where){
    const data=settle(),id=child+':'+subject,total=roundTotal(child,subject),previous=data.active[id];
    data.active[id]={child,subject,date,day,scene:where,lastTotal:previous&&previous.date===date&&previous.day===day&&validSeconds(previous.lastTotal)?Math.max(previous.lastTotal,total??0):total};
    writeElapsed(data);save();
  }
  function save(){try{localStorage.setItem(key,JSON.stringify({...readSaved(),child,day,subject:choice,scene,date,spent,limits,lessonId:selectedLesson}));}catch{}}
  let selectedLesson=sameSavedWindow?readSaved().lessonId||'':'';
  const courses=()=>window.TRAVEL_LESSONS[child];
  const curriculum=window.TRAVEL_CURRICULUM;
  const subjects={chinese:'语文',math:'数学',english:'英语'};
  const currentPlan=()=>curriculum.children[child];
  const suggestion=(subject=choice)=>courses().find(l=>l.id===currentPlan()[subject][day-1]);
  const labelDate=n=>new Intl.DateTimeFormat('zh-CN',{timeZone:'UTC',month:'long',day:'numeric',weekday:'short'}).format(new Date(forDay(n)+'T00:00:00Z'));
  const memoryFile=l=>child+'_'+(l.subject==='english'&&l.unit===3?'english_unit3':l.subject)+'_memory_20260917.html';
  const fileFor=l=>l.subject==='english'&&l.unit===3?child+'_english_unit3_20260917.html':file(l.subject);
  function remaining(t,where){
    const planned=plan.windows[day-1].minutes||25,ceiling=Math.min(where==='train'?15:25,planned),limit=limits[child+':'+day];
    const total=Number.isInteger(limit)&&limit>0?Math.min(limit,ceiling):ceiling;
    const base=readSaved().allowances?.[windowKey()]?.baseline;
    return Math.max(0,total*60-Math.max(0,used*60+softwareUsed(t)-(validSeconds(base)?base:0)));
  }
  function restThenContinue(){
    const t=settle(),latest=readSaved(),allowances=object(latest.allowances)?latest.allowances:{},previous=allowances[windowKey()];
    allowances[windowKey()]={baseline:used*60+softwareUsed(t),breaks:[...(Array.isArray(previous?.breaks)?previous.breaks:[]),{at:new Date().toISOString(),seconds:used*60+softwareUsed(t),reason:'explicit-rested'}]};
    try{
      // One explicit rest ends the child's current subject rounds without
      // refunding cumulative elapsed time or deleting any answer history.
      for(const subject of ['chinese','math','english']){
        const id=roundKey(child,subject),raw=localStorage.getItem(id);if(!raw)continue;
        const r=JSON.parse(raw);if(!object(r)||!validSeconds(r.seconds)||!Array.isArray(r.rounds))continue;
        if(r.seconds>0)r.rounds.push({seconds:r.seconds,startedAt:r.startedAt,endedAt:new Date().toISOString(),reason:'travel-explicit-rest'});
        r.seconds=0;r.startedAt=new Date().toISOString();localStorage.setItem(id,JSON.stringify(r));
      }
      localStorage.setItem(key,JSON.stringify({...latest,allowances}));
    }catch{}
    render();$('#status').textContent='好，按现在的空档接着学。之前的用时和回答都保留。';
  }
  function render(){
    const timing=settle(),w=plan.windows[day-1],where=scene||w.scene;
    if(!subjects[choice])choice='chinese';
    let rec=suggestion(),selected=courses().find(x=>x.id===selectedLesson&&x.subject===choice);
    if(!selected)selected=rec||courses().find(x=>x.subject===choice);
    selectedLesson=selected.id;
    const unit=selected.unit||2,eligible=courses().filter(x=>x.subject===choice&&(choice!=='english'||x.unit===unit));
    const cp=currentPlan(),forecast=[...cp.forecast].reverse().find(x=>x.start<=forDay(day))||cp.forecast[0];
    const suggested=where==='train'?'接着读／讲回上次这一课':where==='rest'?'今天先休息，课程都留着':'有空可以接这一课';
    document.body.dataset.child=child;
    root.innerHTML='<header class="reader-top"><a href="../index.html">‹ 学习首页</a><label>谁来学 <select id="who" aria-label="谁来学"><option value="kenton" '+(child==='kenton'?'selected':'')+'>Kenton</option><option value="eddey" '+(child==='eddey'?'selected':'')+'>Eddey</option></select></label><button class="quiet" id="parent">家长</button></header>'+(test?'<p class="test-banner">试用模式 · 不计正式学习记录</p>':'')+'<section class="welcome"><div class="eyebrow">旅途中，也学一点</div><h1>语文、数学、英语，都在这里</h1><p>选一科，接着上次的位置。背诵与默写也有自己的入口。</p><svg class="journey-art" viewBox="0 0 650 110" role="img" aria-label="一列火车驶过山间"><path d="M0 92L114 18L185 66L263 28L369 95" fill="#d5e8df"/><path d="M330 96L441 37L530 89L600 53L650 95" fill="#e2e8dc"/><circle cx="536" cy="22" r="14" fill="#efd298"/><path d="M0 99H650" stroke="#98aca2" stroke-width="2"/><path d="M80 80V47Q80 40 90 40H327Q357 40 382 80Z" fill="#fffefa" stroke="#78939a" stroke-width="2"/><path d="M80 70H370" stroke="var(--identity)" stroke-width="7"/>'+[101,146,191,236,281].map(x=>'<rect x="'+x+'" y="48" width="27" height="14" rx="3" fill="#a8cbd0"/>').join('')+'<path d="M326 48H338L355 62H326Z" fill="#a8cbd0"/><circle cx="124" cy="86" r="7" fill="#526c78"/><circle cx="308" cy="86" r="7" fill="#526c78"/></svg></section><nav class="subject-tabs" aria-label="学习科目">'+Object.entries(subjects).map(([id,name])=>'<button type="button" data-subject="'+id+'" aria-pressed="'+(choice===id)+'">'+name+'<small>'+({chinese:'阅读 · 背诵默写',math:'看图理解 · 自己算',english:'Unit 2–3 · 读写背'}[id])+'</small></button>').join('')+'</nav><form class="selection" id="form"><label>学习日期<select id="day">'+plan.windows.map(x=>'<option value="'+x.day+'" '+(x.day===day?'selected':'')+'>'+labelDate(x.day)+' · '+(x.minutes?x.minutes+'分钟可选':'休息日')+'</option>').join('')+'</select></label><label>在哪里学<select id="scene"><option value="hotel" '+(where==='hotel'?'selected':'')+'>酒店 / 安静坐好</option><option value="train" '+(where==='train'?'selected':'')+'>火车上</option><option value="rest" '+(where==='rest'?'selected':'')+'>先休息</option></select></label><section class="recommendation wide" aria-label="当天课程建议"><p class="journey-date">'+labelDate(day)+' · '+subjects[choice]+'</p><h2 id="selectedTitle">'+esc(selected.title)+'</h2><p>'+suggested+'。'+(where==='rest'?'出发、返程和休息优先。':where==='train'?'今天只接已学的部分，晕车就停。':'不必把三科都做完；已经完成就选后面的课。')+'</p>'+(choice==='english'?'<p class="muted">按课表预计：'+esc(forecast.unit)+' · 已备好 Unit 2、Unit 3，可按老师进度切换。</p>':'')+'</section>'+(choice==='english'?'<label class="wide">学到哪个单元<select id="unit"><option value="2" '+(unit===2?'selected':'')+'>Unit 2 · '+esc(courses().find(x=>x.unit===2).unitTitle)+'</option><option value="3" '+(unit===3?'selected':'')+'>Unit 3 · '+esc(courses().find(x=>x.unit===3).unitTitle)+'</option></select></label>':'')+'<label class="wide">上哪一课<select id="lesson">'+eligible.map(l=>'<option value="'+esc(l.id)+'" '+(l.id===selectedLesson?'selected':'')+'>'+esc(l.title)+'</option>').join('')+'</select></label><a id="start" class="button primary wide" href="#">'+(choice==='math'?'看图学这一课':'读这一课')+' →</a><div class="travel-link-row wide"><a id="memoryLink" class="plain-link" href="#" '+(choice==='math'?'hidden':'')+'>'+(choice==='english'?'单独练：背词、默写与背句子':'单独练：背诵与默写')+' →</a></div><p class="selection-hint wide" id="status" role="status">各课可直接跳选；本窗口还可学约 '+Math.floor(remaining(timing,where)/60)+' 分钟。</p><button id="rested" class="quiet rest-resume wide" type="button" '+(remaining(timing,where)>=60||where==='rest'?'hidden':'')+'>休息好了，接着学</button></form><details class="travel-outline"><summary>看这次旅行的课程安排</summary><p class="school-note">每日只是在三科中选一科的建议。日期不会把课程标成已完成；火车上先续做已学内容。'+esc(curriculum.basis)+'</p><ol>'+plan.windows.map(x=>'<li><strong>'+labelDate(x.day)+'</strong> · '+(x.minutes?subjects[choice]+'：'+esc(courses().find(l=>l.id===cp[choice][x.day-1]).title)+(x.scene==='train'?'（续读／复习）':''):'出发／返程，休息优先')+'</li>').join('')+'</ol>'+(choice==='english'?'<p class="school-note">常规英语课：周'+cp.englishWeekdays.map(n=>'一二三四五'[n-1]).join('、周')+'。预测来自现有课表；老师实际页码优先。</p><p>'+esc(cp.nextUnit)+'</p><p class="school-note">'+esc(cp.nextNote)+'</p>':'')+'</details>';
    const links=()=>{const l=courses().find(x=>x.id===$('#lesson').value);if(!l)return;$('#selectedTitle').textContent=l.title;for(const [selector,target] of [['#start',fileFor(l)],['#memoryLink',memoryFile(l)]]){const u=new URL(target,location.href);u.searchParams.set('lesson',l.id);u.searchParams.set('routeDay',day);u.searchParams.set('routeScene',where);if(test)u.searchParams.set('test','1');$(selector).href=u.href;}};links();
    $('#who').onchange=e=>{child=e.target.value;selectedLesson='';save();render();};
    $('#day').onchange=e=>{day=+e.target.value;scene=plan.windows[day-1].scene;selectedLesson='';save();render();};
    $('#scene').onchange=e=>{scene=e.target.value;save();render();};
    document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{choice=b.dataset.subject;selectedLesson='';save();render();});
    if($('#unit'))$('#unit').onchange=e=>{const requested=+e.target.value;selectedLesson=rec.unit===requested?rec.id:courses().find(l=>l.subject==='english'&&l.unit===requested).id;save();render();};
    $('#lesson').onchange=e=>{selectedLesson=e.target.value;links();save();};
    const launch=(e,memory=false)=>{const t=settle(),l=courses().find(x=>x.id===$('#lesson').value),where=$('#scene').value;scene=where;selectedLesson=l.id;choice=l.subject;save();
      if(where==='rest'){e.preventDefault();$('#status').textContent='好，今天先休息。上次学到的位置还在。';return;}
      const left=remaining(t,where);
      if(left<60){e.preventDefault();$('#status').textContent='这段时间先休息。休息好后可以接着学，原来的回答和用时都保留。';$('#rested').hidden=false;return;}
      begin(l.subject,where);const url=new URL(memory?memoryFile(l):fileFor(l),location.href);url.searchParams.set('lesson',l.id);url.searchParams.set('routeDay',day);url.searchParams.set('routeScene',where);url.searchParams.set('routeMinutes',Math.floor(left/60));const breaks=readSaved().allowances?.[windowKey()]?.breaks?.length;if(breaks)url.searchParams.set('routeWindow',windowKey()+':'+breaks);if(test)url.searchParams.set('test','1');e.currentTarget.href=url.href;
    };
    $('#start').onclick=e=>launch(e);$('#memoryLink').onclick=e=>launch(e,true);$('#rested').onclick=restThenContinue;
    $('#form').onsubmit=e=>{e.preventDefault();$('#start').click();};
    $('#parent').onclick=()=>{let d=document.querySelector('#directorDialog');if(!d){d=document.createElement('dialog');d.id='directorDialog';document.body.append(d);}d.innerHTML='<header><strong>家长 · 时间与离线</strong><button class="quiet" id="close">关闭</button></header><p>每个空档选一科。车上最多15分钟，安静处约25分钟；换科、换单元与背默不重新计时。</p><p>网站已用约 '+Math.floor(softwareUsed(settle())/60)+' 分钟。</p><label>本窗口已做纸笔 / 听讲几分钟？<input id="used" type="number" min="0" max="180" value="'+used+'"></label><p>休息后可以明确开始下一段；已用时间和作答历史不会删除。</p><button id="nextWindow">休息好了，再学一段</button><p>'+esc(curriculum.basis)+'</p><p>已经完成的课直接换课；这份安排不改变老师进度或孩子掌握状态。</p><button id="offline">准备离线课程</button><p id="offlineStatus" role="status"></p>';d.showModal();$('#close').onclick=()=>d.close();$('#used').onchange=e=>{const value=+e.target.value;if(Number.isInteger(value)&&value>=0&&value<=180){used=value;spent[child+':'+day]=value;save();}};$('#nextWindow').onclick=()=>{d.close();restThenContinue();};$('#offline').onclick=e=>window.prepareTravelMath(e.currentTarget,$('#offlineStatus'));};
    save();
  }
  const $=s=>document.querySelector(s);
  window.addEventListener('pageshow',render);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){settle();}});
  window.addEventListener('storage',e=>{if(e.key===key||e.key?.includes('-study-round:'))settle();});
  render();
})();
</script></body></html>
