<style>
:root{--blue:#2f6fb3;--blued:#225182;--bluebg:#e8f0fa;--gold:#f2b632;--golddk:#c98a00;
 --ink:#23303a;--paper:#eef5fc;--card:#fff;--line:#dbe7f3;--green:#2e9c54;--greenbg:#e9f7ee;
 --red:#e1553f;--redbg:#fdecea;--muted:#7d8a96;--purple:#7b54c0;--purplebg:#f1ebfa;--orange:#e8842c;--orangebg:#fdf1e3;--teal:#0e8f8f;--tealbg:#e5f6f6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'LXGW WenKai Screen','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
 background:radial-gradient(circle at 10% 4%,#d3e6fb 0,transparent 40%),radial-gradient(circle at 92% 98%,#dde9fb 0,transparent 44%),var(--paper);
 color:var(--ink);min-height:100vh;padding:0 0 50px;}
.wrap{max-width:620px;margin:0 auto;padding:12px;}
.top{display:flex;align-items:center;gap:10px;padding:8px 2px 6px;}
.badge{background:var(--blue);color:#fff;font-weight:800;font-size:17px;padding:6px 13px;border-radius:13px 13px 13px 4px;box-shadow:0 4px 0 var(--blued);}
.top h1{font-size:16px;margin:0;flex:1;}
.top .home{text-decoration:none;font-size:20px;background:#fff;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink);box-shadow:0 3px 0 #cddcec;}
.mute{font-size:18px;background:#fff;border:none;width:38px;height:38px;border-radius:11px;cursor:pointer;box-shadow:0 3px 0 #cddcec;}
.intro{font-size:13px;color:var(--muted);line-height:1.7;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;}
.intro b{color:var(--blued);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
.tile{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 12px;cursor:pointer;box-shadow:0 6px 0 #e1ecf7;text-align:center;transition:transform .08s;border-top:6px solid var(--blue);position:relative;}

.tile .nm{font-weight:800;font-size:16px;margin-top:8px;color:var(--blued);}

.btn.ghost{background:#fff;color:var(--blued);border:2px solid var(--blue);box-shadow:0 5px 0 #cddcec;}
.btn.green{background:var(--green);box-shadow:0 5px 0 #1f7a3e;}

.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.center{justify-content:center;}
.hide{display:none!important;}
.back{background:none;border:none;color:var(--muted);font-size:15px;font-family:inherit;cursor:pointer;font-weight:800;padding:6px 2px;}
.why{background:var(--greenbg);border-left:5px solid var(--green);border-radius:10px;padding:11px 14px;font-size:14px;line-height:1.7;margin:10px 0;}

.opt:active{transform:translateY(2px);box-shadow:0 2px 0 #e4eef8;}
.opt.right{background:var(--greenbg);border-color:var(--green);color:var(--green);font-weight:800;}

.sencn{font-size:13px;color:var(--muted);text-align:center;margin-bottom:6px;}
.term{border-bottom:2px dotted var(--blue);cursor:pointer;color:inherit;font-style:normal;}
.term:active{background:#ffe9a8;border-radius:3px;}
.termbar{font-size:11.5px;color:var(--muted);text-align:center;margin:4px 0 0;}
#bub{position:fixed;background:#fff;border-radius:13px;padding:11px 15px;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:9999;max-width:290px;text-align:center;border:2px solid var(--gold);animation:pop .25s;}

#bub .bc{font-size:13px;font-weight:600;color:var(--ink);margin-top:3px;text-align:left;line-height:1.7;}

@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}

.rec b{color:var(--blued);}
.tipbar{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6;}
textarea.exp{width:100%;height:120px;font-family:inherit;font-size:12px;border:2px solid var(--line);border-radius:10px;padding:8px;}
.famchips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
.chip{font-family:inherit;font-size:14.5px;font-weight:800;padding:8px 12px;border-radius:11px;border:2px solid var(--line);background:#fff;color:var(--blued);cursor:pointer;box-shadow:0 3px 0 #e4eef8;}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.tipbox{background:#fffaf0;border:2px dashed var(--gold);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.8;margin:8px 0;}
.tipbox b{color:var(--golddk);}

.tok{font-family:inherit;font-size:18px;font-weight:800;background:#fff;border:2.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--ink);transition:all .2s;position:relative;}
.tok:active{transform:scale(.95);}

.tok.lit small{display:block;font-size:10px;font-weight:800;letter-spacing:0;}

.machine{background:linear-gradient(180deg,#f7fbff,#eef5fd);border:2px solid var(--line);border-radius:14px;padding:16px 10px;margin:10px 0;text-align:center;min-height:150px;}

.blockpiece{display:inline-block;border-radius:12px;padding:9px 13px;font-weight:800;font-size:15px;margin:10px 4px 2px;animation:pop .5s;}

/* ---- 合并机 ---- */
.morph{background:#fff;border:2px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;font-size:16px;line-height:1.9;text-align:center;font-weight:700;}
.morph s{color:var(--red);}

.morph.zoom{animation:pop .45s;}

.numrow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0 6px;}
.numstage{font-size:24px;font-weight:800;background:#fff;border:2px solid var(--blue);color:var(--blued);border-radius:13px;padding:9px 15px;letter-spacing:1px;}
.numstage.o{border-color:var(--orange);color:var(--orange);opacity:0;transform:scale(.6);transition:all .5s cubic-bezier(.34,1.56,.64,1);}

.numstage .hl{color:var(--red);border-bottom:3px solid var(--red);font-style:normal;}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0;}
.day{font-family:inherit;font-size:14px;font-weight:800;background:#fff;border:2px solid var(--line);border-radius:9px;padding:8px 0;cursor:pointer;color:var(--ink);}
.day.on{background:var(--gold);border-color:var(--golddk);color:#5a3d00;}
.numshow{background:var(--orangebg);border:2px dashed var(--orange);border-radius:13px;padding:12px;text-align:center;margin:8px 0;min-height:74px;}
.numshow .big{font-size:21px;font-weight:800;color:#8a5200;}
.numshow .ab{font-size:14px;color:var(--muted);font-weight:700;margin-top:2px;}
/* ---- 复习卡 ---- */
.rulecard{background:#fff;border:2px solid var(--line);border-left:6px solid var(--blue);border-radius:13px;padding:11px 14px;margin:8px 0;font-size:14px;line-height:1.8;}
.rulecard b{color:var(--blued);}
.rulecard .ex{font-size:13.5px;color:var(--ink);}
.rulecard .cn{font-size:12px;color:var(--muted);}
.en{border-bottom:1px dashed rgba(122,110,130,.4);cursor:pointer;padding:0 1px;border-radius:3px;}
</style>

  <div class="tipbar">周一课的内容：主语/表语从句（认识概念）+ 数词用法 + 定语/状语从句。<br>课前玩=预习不慌，课后玩=快速复习巩固！</div>

<script>
"use strict";
/* ===================== 朗读：audio-first ===================== */
const AUDIO_DIR="audio/kenton_english_monday_lab/";
let exAudio=null,audioTok=0;
function audioHash(s){const b=new TextEncoder().encode(s);let x=0x811c9dc5>>>0;for(let i=0;i<b.length;i++){x^=b[i];x=Math.imul(x,0x01000193)>>>0;}return('0000000'+x.toString(16)).slice(-8);}
function getExAudio(){if(!exAudio){exAudio=new Audio();exAudio.setAttribute('playsinline','');exAudio.preload='auto';try{document.body.appendChild(exAudio);}catch(e){}}return exAudio;}
function mkUtter(t,lang){const u=new SpeechSynthesisUtterance(t);u.lang=(lang==='en')?'en-US':'zh-CN';u.rate=(lang==='en')?0.85:0.95;u.pitch=1.03;
  try{const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang&&x.lang.startsWith(lang==='en'?'en':'zh'));if(v)u.voice=v;}catch(e){}return u;}
/* Chrome/Edge 坑：cancel() 后立刻 speak() 会被静默吞掉，必须隔一拍再说 */
let ttsTok=0;
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{try{speechSynthesis.getVoices();}catch(e){}};}catch(e){}
function ttsSpeakOnce(t,lang){
  if(!('speechSynthesis'in window))return;
  try{speechSynthesis.cancel();}catch(e){}
  ttsTok++;const my=ttsTok;
  setTimeout(()=>{if(my!==ttsTok)return;
    try{speechSynthesis.resume();speechSynthesis.speak(mkUtter(t,lang));}catch(e){}
  },120);
}
function speakOnce(t,lang){
  lang=lang||'en';
  try{speechSynthesis.cancel();}catch(e){}
  ttsTok++;audioTok++;const myTok=audioTok;
  const a=getExAudio();let done=false;
  const stale=()=>done||myTok!==audioTok;
  const fb=()=>{if(stale())return;done=true;ttsSpeakOnce(t,lang);};
  a.onended=()=>{if(stale())return;done=true;};
  a.onerror=fb;
  try{a.pause();}catch(e){}
  a.src=AUDIO_DIR+audioHash(lang+"|"+t)+".mp3";
  try{a.currentTime=0;}catch(e){}
  const p=a.play();
  if(p&&typeof p.catch==='function')p.catch(fb);
}
/* ===================== 音效 + 静音 ===================== */
let actx=null,muted=localStorage.getItem('kml_mute')==='1';
function beep(ok){
  if(muted)return;
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime;
    (ok?[[523,0],[659,.09],[784,.18]]:[[196,0],[147,.14]]).forEach(f=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=ok?'triangle':'sawtooth';o.frequency.value=f[0];
      g.gain.setValueAtTime(.0001,t+f[1]);g.gain.exponentialRampToValueAtTime(.18,t+f[1]+.02);g.gain.exponentialRampToValueAtTime(.0001,t+f[1]+.22);
      o.connect(g);g.connect(actx.destination);o.start(t+f[1]);o.stop(t+f[1]+.26);});
  }catch(e){}
}
function syncMute(){document.getElementById('muteBtn').textContent=muted?'🔕':'🔔';}
document.getElementById('muteBtn').onclick=()=>{muted=!muted;localStorage.setItem('kml_mute',muted?'1':'0');syncMute();};
syncMute();
/* ===================== 记录 ===================== */
const EV_KEY='kml_events_v1';
function loadEv(){try{return JSON.parse(localStorage.getItem(EV_KEY)||'[]');}catch(e){return[];}}
function logEvent(ev){const a=loadEv();a.push(ev);localStorage.setItem(EV_KEY,JSON.stringify(a));}
function lastScore(lesson){const a=loadEv();for(let i=a.length-1;i>=0;i--)if(a[i].lesson===lesson)return a[i];return null;}
function finishMod(lesson,items,t0){
  const wrong=items.filter(x=>!x.ok).length;
  logEvent({ts:Date.now(),type:'quiz',subject:'英语·周一预习(从句+数词)',lesson:lesson,total:items.length,wrong:wrong,
    durationSec:Math.round((Date.now()-t0)/1000),items:items});
}
/* ===================== 术语点击解释 ===================== */
const TERMS={
 '从句':'把一个小句子当"积木"，塞进大句子里干活——这块积木就叫从句。它干什么活，就叫什么从句。',
 '主语':'句子的主人公，就是"谁"。The boy runs.（男孩跑）里的 The boy 男孩。它一般站在句子最前面。',
 '表语':'站在 is/am/are 后面的词，说主人公"是什么样"。He is happy.（他很开心）里的 happy。',
 '定语':'形容名词的词，回答"什么样的？"。a red apple（一个红苹果）里的 red 红色的。',
 '状语':'说"什么时候、在哪儿、为什么"做的部分。I run in the morning.（我早上跑步）里的 in the morning 在早上。',
 '主语从句':'一个小句子当了主人公。What he said is true. = "他说的话"是真的。"他说的话"就是主人公！（高中才学，认识就行）',
 '表语从句':'一个小句子站在 is 后面，说"是什么"。The news is that we won. = 消息就是：我们赢啦！（高中才学，认识就行）',
 '定语从句':'一个小句子跟在名词屁股后面，说"哪一个"。the boy who runs fast = 跑得快的那个男孩。',
 '状语从句':'一个小句子挂在旁边，说"什么时候/为什么"。as soon as I arrive = 我一到（就……）。你已经学过啦！',
 '名词':'人和东西的名字：boy 男孩、book 书、news 消息。',
 'be动词':'is / am / are，意思是"是"。过去的事用 was / were。',
 '基数词':'数数的数字：one, two, three…（1、2、3…）。',
 '序数词':'排队报"第几"的数字：first, second, third…（第1、第2、第3…）。说日期、名次、第几课都用它。'
};
function term(t){return '<span class="term" data-term="'+t+'">'+t+'</span>';}
function hideBub(){const b=document.getElementById('bub');if(b)b.remove();}
function showTermBub(t,x,y){
  hideBub();const tr=TERMS[t];if(!tr)return;
  const b=document.createElement('div');b.id='bub';
  b.innerHTML='<div class="be">📖 '+t+'</div><div class="bc">'+tr+'</div>';
  document.body.appendChild(b);
  const r=b.getBoundingClientRect();
  let l=x-r.width/2,tp=y-r.height-16;
  if(l<8)l=8;if(l+r.width>window.innerWidth-8)l=window.innerWidth-r.width-8;if(tp<8)tp=y+24;
  b.style.left=l+'px';b.style.top=tp+'px';
  setTimeout(()=>{document.addEventListener('click',hideBub,{once:true});document.addEventListener('touchstart',hideBub,{once:true});},120);
}
document.addEventListener('click',e=>{const el=e.target.closest('.term');if(!el)return;e.stopPropagation();showTermBub(el.dataset.term,e.clientX||window.innerWidth/2,e.clientY||120);});
document.addEventListener('click',e=>{const el=e.target.closest('[data-say]');if(!el)return;speakOnce(el.dataset.say,el.dataset.lang||'en');});
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sayBtn(t,label){return '<button class="say" data-say="'+esc(t)+'" data-lang="en">🔊 '+(label||'听')+'</button>';}

/* ===================== 🧩 从句积木工厂数据 ===================== */
const BLOCKS=[
{key:'sub',nm:'主语从句',emoji:'👑',col:'var(--purple)',bg:'var(--purplebg)',lv:'高中·认识就行',
 frame:[{t:'____',slot:1,lab:'主语'},{t:'is',lab:'be动词'},{t:'true',lab:'表语'}],
 piece:'What he said',pieceCn:'他说的话',
 full:'What he said is true.',cn:'他说的话是真的。',

  qIdx=0;qItems=[];qT0=Date.now();
  if(qTimer)clearInterval(qTimer);
  qTimer=setInterval(()=>{const e=$('qClock');if(e)e.textContent='⏱ '+Math.round((Date.now()-qT0)/1000)+'s';},500);
  quizOne();
}
function quizOne(){
  if(qIdx>=QUIZ.length){
    if(qTimer){clearInterval(qTimer);qTimer=null;}
    finishMod('综合小检验',qItems,qT0);beep(true);
    const wrong=qItems.filter(x=>!x.ok);
    const sec=Math.round((Date.now()-qT0)/1000);
    $('stage').innerHTML='<div class="card" style="text-align:center;"><div style="font-size:52px;">🏆🎉</div>'+
     '<div class="h2">检验完成！对 '+(QUIZ.length-wrong.length)+' / '+QUIZ.length+'</div>'+
     '<div class="hint">用时 '+sec+' 秒 · 平均每题 '+Math.round(sec/QUIZ.length)+' 秒</div>'+
     (wrong.length?'<div style="text-align:left;margin-top:8px;"><b style="color:var(--red);">错题回顾（记住讲解！）</b>'+
       wrong.map(w=>'<div class="rec">❌ '+esc(w.hint)+'<br><span style="color:var(--muted);font-size:12px;">'+esc(w.tag)+'</span></div>').join('')+'</div>':'<div class="stamp">全对，周一见！🔥</div>')+
     '<div class="row center" style="margin-top:10px;"><button class="btn" onclick="renderQuiz()">🔁 再来一轮</button><button class="btn ghost" onclick="document.getElementById(\'backBtn\').click()">回大厅</button></div></div>';
    return;
  }
  const q=QUIZ[qIdx],t0=Date.now();
  $('stage').innerHTML='<div class="card"><div class="pgr">第 '+(qIdx+1)+' / '+QUIZ.length+' 题 · <span id="qClock">⏱ 0s</span></div>'+
   '<div class="sen" style="font-size:15.5px;">'+esc(q.stem)+'</div><div class="opts" id="qOpts">'+
   q.opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div><div id="qFb"></div></div>';
  document.querySelectorAll('#qOpts .opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,ok=i===q.a;
    document.querySelectorAll('#qOpts .opt').forEach(x=>x.classList.add('off'));
    b.classList.add(ok?'right':'wrong');
    if(!ok)document.querySelector('#qOpts .opt[data-i="'+q.a+'"]').classList.add('right');
    beep(ok);
    qItems.push({word:'第'+(qIdx+1)+'题',hint:q.stem,ok:ok,ms:Date.now()-t0,user:q.opts[i],tag:q.why});
    $('qFb').innerHTML='<div class="why'+(ok?'':' bad')+'"><span class="lab">'+(ok?'✅ 对啦！':'❌ 看讲解：')+'</span> '+q.why+'</div>'+
     '<div class="row center"><button class="btn" id="qNx">'+(qIdx<QUIZ.length-1?'下一题 →':'交卷 🏁')+'</button></div>';
    $('qNx').onclick=()=>{qIdx++;quizOne();};
  });
}

/* ===================== 📖 学习记录 ===================== */
function buildExport(){
  const evs=loadEv();
  const wrongMap={};
  evs.forEach(e=>(e.items||[]).forEach(it=>{if(!it.ok){const k=it.hint||it.word;wrongMap[k]=(wrongMap[k]||0)+1;}}));
  let txt='【哥哥 · 周一课前预习馆（从句+数词） · 练习导出】\n日期：'+new Date().toLocaleString('zh-CN')+'\n\n== 反复错的题（错≥2） ==\n';
  const rep=Object.entries(wrongMap).filter(x=>x[1]>=2);
  txt+=rep.length?rep.map(x=>'- '+x[0]+'（错'+x[1]+'次）').join('\n'):'（暂无）';
  txt+='\n\n== 每次明细 ==\n';
  evs.forEach(e=>{txt+='['+new Date(e.ts).toLocaleString('zh-CN')+'] '+e.lesson+'：共'+e.total+'题 错'+e.wrong+'题 用时'+(e.durationSec||0)+'s\n';
    (e.items||[]).forEach(it=>{if(!it.ok)txt+='   ❌ '+(it.hint||it.word)+'（选了 '+(it.user||'?')+'）\n';});});
  txt+='\n== 原始JSON（投喂给爸爸的Claude归档用） ==\n'+JSON.stringify({child:'哥哥',subject:'英语·周一预习(从句+数词)',events:evs});
  return txt;
}
function renderRec(){
  const evs=loadEv();
  const mods={};evs.forEach(e=>{mods[e.lesson]=e;});
  let h='<div class="card"><div class="h2">📖 我的学习记录</div>';
  if(!evs.length){h+='<div class="hint">还没有记录，先去🧩积木工厂吧！</div></div>';$('stage').innerHTML=h;return;}
  h+='<div class="rec"><b>已练 '+evs.length+' 次</b> · 共 '+evs.reduce((s,e)=>s+e.total,0)+' 题 · 错 '+evs.reduce((s,e)=>s+e.wrong,0)+' 题</div>';
  h+=Object.values(mods).map(e=>'<div class="rec"><b>'+e.lesson+'</b>（最近一次）：✅对'+(e.total-e.wrong)+' ❌错'+e.wrong+' · '+new Date(e.ts).toLocaleDateString('zh-CN')+'</div>').join('');
  const wrong=[];evs.forEach(e=>(e.items||[]).forEach(it=>{if(!it.ok)wrong.push(it);}));
  if(wrong.length){h+='<div style="margin-top:8px;"><b style="color:var(--red);">错题回顾</b>'+
    wrong.slice(-8).map(w=>'<div class="rec">❌ '+esc(w.hint||w.word)+'<br><span style="color:var(--muted);font-size:12px;">选了：'+esc(w.user||'?')+(w.tag?' · '+esc(w.tag):'')+'</span></div>').join('')+'</div>';}
  h+='<div class="row center" style="margin-top:10px;"><button class="btn" id="cpBtn">📋 复制导出</button>'+
     '<button class="btn ghost" id="dlBtn">💾 存成文件</button>'+
     '<button class="btn ghost sm" id="clrBtn" style="color:var(--red);border-color:var(--red);">🗑 清空</button></div>'+
     '<textarea class="exp hide" id="expTxt"></textarea></div>';
  $('stage').innerHTML=h;
  $('cpBtn').onclick=()=>{const t=buildExport();const ta=$('expTxt');ta.classList.remove('hide');ta.value=t;ta.select();
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{$('cpBtn').textContent='✅ 已复制';}).catch(()=>{document.execCommand('copy');$('cpBtn').textContent='✅ 已复制';});
    else{document.execCommand('copy');$('cpBtn').textContent='✅ 已复制';}};
  $('dlBtn').onclick=()=>{const b=new Blob([buildExport()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='哥哥_周一预习_练习记录_'+new Date().toISOString().slice(0,10)+'.txt';a.click();};
  $('clrBtn').onclick=()=>{if(confirm('确定清空全部练习记录？（导出之后再清哦）')){localStorage.removeItem(EV_KEY);renderRec();}};
}

renderHome();
</script>
