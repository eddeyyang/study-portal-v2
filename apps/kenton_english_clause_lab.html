<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../assets/learning-sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>哥哥英语 · 状语从句时光机</title>
<style>
:root{--blue:#2f6fb3;--blued:#225182;--bluebg:#e8f0fa;--gold:#f2b632;--golddk:#c98a00;
 --ink:#23303a;--paper:#eef5fc;--card:#fff;--line:#dbe7f3;--green:#2e9c54;--greenbg:#e9f7ee;
 --red:#e1553f;--redbg:#fdecea;--muted:#7d8a96;--purple:#7b54c0;--purplebg:#f1ebfa;--orange:#e8842c;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'LXGW WenKai Screen','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
 background:radial-gradient(circle at 10% 4%,#d3e6fb 0,transparent 40%),radial-gradient(circle at 92% 98%,#dde9fb 0,transparent 44%),var(--paper);
 color:var(--ink);min-height:100vh;padding:0 0 50px;}
.wrap{max-width:620px;margin:0 auto;padding:12px;}
.top{display:flex;align-items:center;gap:10px;padding:8px 2px 6px;}
.badge{background:var(--blue);color:#fff;font-weight:800;font-size:17px;padding:6px 13px;border-radius:13px 13px 13px 4px;box-shadow:0 4px 0 var(--blued);}
.top h1{font-size:16px;margin:0;flex:1;}
.top .home{text-decoration:none;font-size:20px;background:#fff;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink);box-shadow:0 3px 0 #cddcec;}
.mute{font-size:18px;background:#fff;border:none;width:38px;height:38px;border-radius:11px;cursor:pointer;box-shadow:0 3px 0 #cddcec;}
.intro{font-size:13px;color:var(--muted);line-height:1.7;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;}
.intro b{color:var(--blued);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
.tile{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 12px;cursor:pointer;box-shadow:0 6px 0 #e1ecf7;text-align:center;transition:transform .08s;border-top:6px solid var(--blue);position:relative;}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 #e1ecf7;}
.tile .ic{font-size:38px;line-height:1;}
.tile .nm{font-weight:800;font-size:16px;margin-top:8px;color:var(--blued);}
.tile .ds{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
.tile .done{position:absolute;top:6px;right:8px;font-size:11px;font-weight:800;color:var(--green);background:var(--greenbg);border-radius:8px;padding:2px 7px;}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:11px 0;box-shadow:0 6px 0 #e4eef8;}
.h2{font-size:18px;font-weight:800;margin:0 0 4px;color:var(--blued);}
.hint{font-size:13px;color:var(--muted);line-height:1.7;}
.btn{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:13px;padding:11px 16px;cursor:pointer;color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blued);transition:transform .06s;}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blued);}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 var(--golddk);color:#5a3d00;}
.btn.ghost{background:#fff;color:var(--blued);border:2px solid var(--blue);box-shadow:0 5px 0 #cddcec;}
.btn.green{background:var(--green);box-shadow:0 5px 0 #1f7a3e;}
.btn.sm{font-size:13.5px;padding:9px 13px;}
.btn:disabled{opacity:.45;box-shadow:none;transform:none;}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.center{justify-content:center;}
.hide{display:none!important;}
.back{background:none;border:none;color:var(--muted);font-size:15px;font-family:inherit;cursor:pointer;font-weight:800;padding:6px 2px;}
.why{background:var(--greenbg);border-left:5px solid var(--green);border-radius:10px;padding:11px 14px;font-size:14px;line-height:1.7;margin:10px 0;}
.why.bad{background:var(--redbg);border-left-color:var(--red);}
.why .lab{font-weight:800;color:var(--green);}
.why.bad .lab{color:var(--red);}
.opts{display:grid;gap:10px;margin-top:8px;}
.opt{font-family:inherit;font-size:16px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:13px;padding:12px 15px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 #e4eef8;}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 #e4eef8;}
.opt.right{background:var(--greenbg);border-color:var(--green);color:var(--green);font-weight:800;}
.opt.wrong{background:var(--redbg);border-color:var(--red);color:var(--red);font-weight:800;}
.opt.off{pointer-events:none;}
.formula{background:var(--bluebg);border-radius:13px;padding:12px 14px;font-size:15px;line-height:1.8;margin:8px 0;}
.formula b{color:var(--blued);}
.sen{font-size:17px;font-weight:700;line-height:1.7;text-align:center;margin:10px 0 2px;}
.sen .sub{background:var(--bluebg);border-radius:7px;padding:1px 5px;color:var(--blued);}
.sen .main{background:#fff6dd;border-radius:7px;padding:1px 5px;color:var(--golddk);}
.sencn{font-size:13px;color:var(--muted);text-align:center;margin-bottom:6px;}
.say{font-family:inherit;font-size:13.5px;font-weight:800;padding:7px 13px;border-radius:11px;border:2px solid var(--gold);background:#fffaf0;color:var(--golddk);cursor:pointer;box-shadow:0 3px 0 #f0dca0;}
.pgr{font-size:12.5px;color:var(--muted);text-align:center;margin:2px 0 6px;}
/* ---- 时光机时间轴 ---- */
.tl{position:relative;height:190px;background:linear-gradient(180deg,#f7fbff,#eef5fd);border:2px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden;}
.tl .axis{position:absolute;left:4%;right:4%;top:130px;height:5px;background:#c8d9ec;border-radius:3px;}
.tl .axis:after{content:"";position:absolute;right:-2px;top:-6px;border-left:14px solid #c8d9ec;border-top:8px solid transparent;border-bottom:8px solid transparent;}
.tl .mk{position:absolute;top:142px;font-size:12px;font-weight:800;color:var(--muted);transform:translateX(-50%);}
.tl .nowline{position:absolute;top:26px;bottom:44px;width:0;border-left:2px dashed var(--red);left:50%;}
.tl .nowtag{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--red);}
.ech{position:absolute;font-size:12.5px;font-weight:800;background:#fff;border:2px solid var(--blue);color:var(--blued);border-radius:10px;padding:5px 8px;box-shadow:0 3px 0 #d7e5f4;opacity:0;transform:translateY(10px) scale(.85);transition:all .5s;white-space:nowrap;}
.ech.gold{border-color:var(--gold);color:var(--golddk);}
.ech.go{opacity:1;transform:translateY(0) scale(1);}
.ech .tag{display:block;font-size:10.5px;color:var(--red);font-weight:800;}
.ebar{position:absolute;height:16px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--blue) 0 12px,#6f9fd0 12px 24px);width:0;transition:width 1.6s linear;opacity:.9;}
.ebar.gold{background:repeating-linear-gradient(90deg,var(--gold) 0 12px,#f5cf7a 12px 24px);}
.ebar.wait{background:repeating-linear-gradient(90deg,#b9c6d4 0 10px,#dde6ee 10px 20px);}
.ebarlab{position:absolute;font-size:11.5px;font-weight:800;color:var(--blued);opacity:0;transition:opacity .4s;white-space:nowrap;}
.ebarlab.go{opacity:1;}
.tlcap{background:var(--purplebg);border-radius:11px;padding:10px 13px;font-size:14px;line-height:1.7;min-height:44px;margin:8px 0;}
.tlcap b{color:var(--purple);}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.ech.pulse{animation:pulse 1s infinite;}
@keyframes flash{0%,100%{background:#fff;}50%{background:#ffe9a8;}}
.ech.flash{animation:flash .8s 3;}
/* ---- 变身机 ---- */
.morph{background:#fff;border:2px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;font-size:16.5px;line-height:1.9;text-align:center;font-weight:700;}
.morph s{color:var(--red);}
.morph b{color:var(--green);background:var(--greenbg);border-radius:6px;padding:0 4px;}
.morph.zoom{animation:pop .45s;}
@keyframes pop{0%{transform:scale(.7);opacity:0;}60%{transform:scale(1.06);}100%{transform:scale(1);opacity:1;}}
.stepn{background:var(--bluebg);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.7;margin:6px 0;}
.stamp{display:inline-block;border:3px solid var(--green);color:var(--green);font-weight:800;border-radius:10px;padding:3px 10px;font-size:14px;transform:rotate(-6deg);margin:6px 0;}
/* ---- 红绿灯 ---- */
.lightbox{display:flex;gap:12px;justify-content:center;margin:10px 0;flex-wrap:wrap;}
.lamp{flex:1;min-width:130px;background:#243447;border-radius:15px;padding:12px;text-align:center;color:#fff;}
.lamp .bulb{width:44px;height:44px;border-radius:50%;margin:4px auto;background:#44546a;transition:all .5s;display:grid;place-items:center;font-size:20px;}
.lamp.on1 .bulb{background:#3ddc74;box-shadow:0 0 22px #3ddc74;}
.lamp.on2 .bulb{background:#4aa3ff;box-shadow:0 0 22px #4aa3ff;}
.lamp .t{font-size:12.5px;font-weight:800;line-height:1.5;}
.lamp .v{font-size:15px;font-weight:800;color:#ffe07a;min-height:22px;}
/* ---- 分拣机 ---- */
.baskets{display:flex;gap:12px;margin:12px 0;}
.basket{flex:1;border:3px dashed var(--blue);background:var(--bluebg);border-radius:15px;padding:14px 8px;text-align:center;font-weight:800;color:var(--blued);cursor:pointer;font-size:15px;font-family:inherit;}
.basket small{display:block;font-weight:600;color:var(--muted);font-size:11px;margin-top:3px;}
.basket:active{transform:scale(.97);}
.basket.hit{background:var(--greenbg);border-color:var(--green);color:var(--green);}
.basket.miss{background:var(--redbg);border-color:var(--red);color:var(--red);}
/* ---- 脑图 ---- */
.mapsvg{width:100%;height:auto;display:block;}
.mapsvg .node{cursor:pointer;}
.famchips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
.chip{font-family:inherit;font-size:14.5px;font-weight:800;padding:8px 13px;border-radius:11px;border:2px solid var(--line);background:#fff;color:var(--blued);cursor:pointer;box-shadow:0 3px 0 #e4eef8;}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);}
/* ---- 篮球 ---- */
.court{position:relative;height:110px;background:linear-gradient(180deg,#fdf3e3,#f7e3c4);border:2px solid #eed9b0;border-radius:14px;margin:8px 0;overflow:hidden;}
.hoop{position:absolute;right:14px;top:12px;font-size:34px;}
.ball{position:absolute;left:18px;bottom:10px;font-size:30px;opacity:0;}
.ball.shoot{animation:shoot 1s forwards;}
@keyframes shoot{0%{opacity:1;left:18px;bottom:10px;}50%{left:45%;bottom:75px;}100%{opacity:1;left:78%;bottom:44px;transform:rotate(360deg);}}
.scorebd{position:absolute;left:12px;top:10px;font-size:14px;font-weight:800;color:#8a5a00;}
.en{border-bottom:1px dashed rgba(122,110,130,.4);cursor:pointer;padding:0 1px;border-radius:3px;}
.en:active{background:#ffe9a8;}
#bub{position:fixed;background:#fff;border-radius:13px;padding:11px 15px;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:9999;max-width:280px;text-align:center;border:2px solid var(--gold);animation:pop .25s;}
#bub .be{font-size:13.5px;font-weight:800;}
#bub .bc{font-size:15px;font-weight:800;color:var(--blued);margin-top:3px;}
.rec{background:var(--bluebg);border-radius:12px;padding:11px 13px;margin:8px 0;font-size:13.5px;line-height:1.8;}
.rec b{color:var(--blued);}
.tipbar{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6;}
.proverb{background:linear-gradient(180deg,#fffaf0,#fff3d9);border:2px solid var(--gold);border-radius:13px;padding:12px;text-align:center;margin:10px 0;}
.proverb .p1{font-size:15.5px;font-weight:800;color:#6a4a00;}
.proverb .p2{font-size:12.5px;color:var(--muted);margin-top:3px;}
textarea.exp{width:100%;height:120px;font-family:inherit;font-size:12px;border:2px solid var(--line);border-radius:10px;padding:8px;}
</style>

<div class="wrap">

  </div>
  <div id="home"></div>

  </div>
  <div class="tipbar">把「状语从句」讲义做成会动的时光机——看动画懂时态，不是刷题。<br>英文看不懂？<b>长按</b>带虚线的英文可以看中文。</div>

<script>
"use strict";
/* ===================== 朗读：audio-first（预合成神经音优先，缺失回退浏览器TTS） ===================== */
const AUDIO_DIR="audio/kenton_english_clause_lab/";
let exAudio=null,audioTok=0;
/* 必须与 tools 脚本 fnv() 一致：对 (lang+"|"+text) 的 UTF-8 字节做 FNV-1a，8位十六进制 */
function audioHash(s){const b=new TextEncoder().encode(s);let x=0x811c9dc5>>>0;for(let i=0;i<b.length;i++){x^=b[i];x=Math.imul(x,0x01000193)>>>0;}return('0000000'+x.toString(16)).slice(-8);}
function getExAudio(){if(!exAudio){exAudio=new Audio();exAudio.setAttribute('playsinline','');exAudio.preload='auto';try{document.body.appendChild(exAudio);}catch(e){}}return exAudio;}
function mkUtter(t,lang){const u=new SpeechSynthesisUtterance(t);u.lang=(lang==='en')?'en-US':'zh-CN';u.rate=(lang==='en')?0.9:0.95;u.pitch=1.03;
  try{const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang&&x.lang.startsWith(lang==='en'?'en':'zh'));if(v)u.voice=v;}catch(e){}return u;}
function ttsSpeakOnce(t,lang){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();speechSynthesis.resume();}catch(e){}try{speechSynthesis.speak(mkUtter(t,lang));}catch(e){}}
function speakOnce(t,lang){
  lang=lang||'en';
  try{speechSynthesis.cancel();}catch(e){}
  audioTok++;const myTok=audioTok;
  const a=getExAudio();let done=false;
  const stale=()=>done||myTok!==audioTok;
  const fb=()=>{if(stale())return;done=true;ttsSpeakOnce(t,lang);};
  a.onended=()=>{if(stale())return;done=true;};
  a.onerror=fb;
  try{a.pause();}catch(e){}
  a.src=AUDIO_DIR+audioHash(lang+"|"+t)+".mp3";
  try{a.currentTime=0;}catch(e){}
  const p=a.play();
  if(p&&typeof p.catch==='function')p.catch(fb);
}
/* ===================== 音效 + 静音 ===================== */
let actx=null,muted=localStorage.getItem('kcl_mute')==='1';
function beep(ok){
  if(muted)return;
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime;
    (ok?[[523,0],[659,.09],[784,.18]]:[[196,0],[147,.14]]).forEach(f=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=ok?'triangle':'sawtooth';o.frequency.value=f[0];
      g.gain.setValueAtTime(.0001,t+f[1]);g.gain.exponentialRampToValueAtTime(.18,t+f[1]+.02);g.gain.exponentialRampToValueAtTime(.0001,t+f[1]+.22);
      o.connect(g);g.connect(actx.destination);o.start(t+f[1]);o.stop(t+f[1]+.26);});
  }catch(e){}
}
function syncMute(){document.getElementById('muteBtn').textContent=muted?'🔕':'🔔';}
document.getElementById('muteBtn').onclick=()=>{muted=!muted;localStorage.setItem('kcl_mute',muted?'1':'0');syncMute();};
syncMute();

/* ===================== 记录（localStorage + 导出） ===================== */
const EV_KEY='kcl_events_v1';
function loadEv(){try{return JSON.parse(localStorage.getItem(EV_KEY)||'[]');}catch(e){return[];}}
function logEvent(ev){const a=loadEv();a.push(ev);localStorage.setItem(EV_KEY,JSON.stringify(a));}
function lastScore(lesson){const a=loadEv();for(let i=a.length-1;i>=0;i--)if(a[i].lesson===lesson)return a[i];return null;}

/* ===================== 长按英文看中文 ===================== */
const DICT={'while':'当…的时候(同时)','typing':'正在打字','letters':'信件','notes':'笔记','taking notes':'记笔记',
'when':'当…的时候','typed':'打字(过去式)','before':'在…之前','arrived':'到达(过去式)','arrive':'到达','airport':'机场',
'plane':'飞机','had taken off':'已经起飞了','taken off':'起飞','after':'在…之后','school':'学校','class':'课','ended':'结束了',
'until':'直到','everyone':'每个人','here':'这里','since':'自从','played':'玩/打(过去式)','basketball':'篮球',
'as soon as':'一…就','Shanghai':'上海','call':'打电话','by the time':'到…的时候','got home':'到家','brother':'弟弟/哥哥',
'finished':'完成了','homework':'作业','so that':'为了/以便','stay':'留下','reading':'阅读','classroom':'教室',
'big':'大的','hold':'容纳','people':'人','runs':'跑','fast':'快','no one':'没有人','catch up with':'追上',
'enough':'足够','too':'太','tired':'累的','dark':'黑暗的','bright':'明亮的','see':'看见','anything':'任何东西',
'room':'房间','such':'如此(接名词)','because':'因为(接句子)','because of':'因为(接短语)','rain':'雨','rained':'下雨了',
'heavily':'猛烈地','ill':'生病的','illness':'疾病','weather':'天气','if':'如果','rains':'下雨','tomorrow':'明天',
'stay at home':'待在家','rest':'休息','please':'请','him':'他','will':'将要','practice':'练习','perfect':'完美的',
'a will':'志向/意志','way':'方法/路','Cherry':'Cherry(人名)','Mike':'Mike(人名)','Mark':'Mark(人名)','No.1':'第一名'};
function getTrans(t){
  if(!t)return null;const c=t.trim().replace(/[.,!?;:'"]+$/,'').trim();
  if(DICT[c])return DICT[c];const lo=c.toLowerCase();
  for(const k in DICT)if(k.toLowerCase()===lo)return DICT[k];
  const ws=c.split(/\s+/);
  if(ws.length>1)return ws.map(w=>{const wc=w.replace(/[.,!?;:'"]+$/,'');if(DICT[wc])return DICT[wc];const wl=wc.toLowerCase();for(const k in DICT)if(k.toLowerCase()===wl)return DICT[k];return wc;}).join(' · ');
  return null;
}
function hideBub(){const b=document.getElementById('bub');if(b)b.remove();}
function showBub(text,x,y){
  hideBub();const tr=getTrans(text);if(!tr)return;
  const b=document.createElement('div');b.id='bub';
  b.innerHTML='<div class="be">'+text+'</div><div class="bc">'+tr+'</div>';
  document.body.appendChild(b);
  const r=b.getBoundingClientRect();
  let l=x-r.width/2,t=y-r.height-16;
  if(l<8)l=8;if(l+r.width>window.innerWidth-8)l=window.innerWidth-r.width-8;if(t<8)t=y+24;
  b.style.left=l+'px';b.style.top=t+'px';
  setTimeout(()=>{document.addEventListener('click',hideBub,{once:true});document.addEventListener('touchstart',hideBub,{once:true});},120);
}
let lpT=null,lpEl=null;
document.addEventListener('touchstart',e=>{const el=e.target.closest('.en');if(!el)return;lpEl=el;const tc=e.touches[0];
  lpT=setTimeout(()=>{if(lpEl===el){showBub(el.textContent||'',tc.clientX,tc.clientY);if(navigator.vibrate)navigator.vibrate(30);}},480);},{passive:true});
document.addEventListener('touchend',()=>{clearTimeout(lpT);lpEl=null;},{passive:true});
document.addEventListener('touchmove',()=>{clearTimeout(lpT);lpEl=null;},{passive:true});
document.addEventListener('mousedown',e=>{const el=e.target.closest('.en');if(!el)return;lpEl=el;
  lpT=setTimeout(()=>{if(lpEl===el)showBub(el.textContent||'',e.clientX,e.clientY);},480);});
document.addEventListener('mouseup',()=>{clearTimeout(lpT);lpEl=null;});
document.addEventListener('dblclick',e=>{const el=e.target.closest('.en');if(!el)return;e.preventDefault();showBub(el.textContent||'',e.clientX,e.clientY);});
/* 🔊 按钮统一走 data-say */
document.addEventListener('click',e=>{const el=e.target.closest('[data-say]');if(!el)return;speakOnce(el.dataset.say,el.dataset.lang||'en');});
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function enS(t){return '<span class="en">'+esc(t)+'</span>';}
function sayBtn(t,label){return '<button class="say" data-say="'+esc(t)+'" data-lang="en">🔊 '+(label||'听')+'</button>';}

/* ===================== 内容数据（全部来自「状语从句」讲义） ===================== */

const $=id=>document.getElementById(id);
function renderHome(){
  let h='<div class="intro">这是把你的<b>「状语从句」讲义</b>变成的时光机 🛸——从句就是给句子挂上的"小车厢"，说清<b>什么时候、为什么、结果怎样</b>。'+
    '先去 <b>⏰时光机实验室</b> 看时间轴动画，再去 <b>🔧变形机</b> 玩"保持句意不变"。'+
    '<div style="margin-top:8px;"><button class="btn gold sm" id="tvBtn">🔊 先点我测试声音</button></div></div><div class="grid">';
  MODS.forEach(m=>{
    const ls=lastScore(m.nm);
    const done=ls?('<span class="done">✅对'+(ls.total-ls.wrong)+' ❌错'+ls.wrong+'</span>'):'';
    h+='<div class="tile" data-mod="'+m.id+'"><div class="ic">'+m.ic+'</div><div class="nm">'+m.nm+'</div><div class="ds">'+m.ds+'</div>'+done+'</div>';
  });
  h+='</div><div class="proverb" data-say="Where there is a will, there is a way." data-lang="en">'+
     '<div class="p1">Where there is a will, there is a way. 🔊</div>'+
     '<div class="p2">有志者事竟成。—— 讲义里送你的一句谚语，点我听</div></div>';
  $('home').innerHTML=h;
  $('tvBtn').onclick=()=>{beep(true);speakOnce('While Cherry is typing letters, we are taking notes.','en');};
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>openMod(t.dataset.mod));
}
function openMod(id){
  $('home').classList.add('hide');$('view').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
  ({map:renderMap,time:renderTime,trans:renderTrans,cond:renderCond,bec:renderBec,quiz:renderQuiz,rec:renderRec})[id]();
}
$('backBtn').onclick=()=>{$('view').classList.add('hide');$('home').classList.remove('hide');renderHome();window.scrollTo({top:0,behavior:'smooth'});};

           '<div class="ech pulse" id="chA" style="left:18%;top:26px;">'+d.aLab+'</div>';
  }else if(d.type==='order'){
    inner+='<div class="ech" id="chA" style="left:7%;top:40px;">'+d.e1+'<span class="tag">'+d.e1tag+'</span></div>'+
           '<div class="ech gold" id="chB" style="left:30%;top:92px;">'+d.e2+'</div>';

  }else if(d.type==='since'){
    inner+='<div class="ech" id="chA" style="left:10%;top:92px;">'+d.from+'</div>'+
           '<div class="ebarlab" id="labB" style="left:14%;top:44px;">'+d.bar+'</div><div class="ebar" id="barB" style="left:14%;top:64px;"></div>';
  }else if(d.type==='future'){

           '<div class="ech gold" id="chB" style="left:72%;top:92px;">'+d.bLab+'<span class="tag">'+d.bTag+'</span></div>';
  }
  return '<div class="tl" id="tlBox">'+inner+'</div>';

function playTL(d){
  const cap=$('tlCap');let step=0;
  const caps=d.caps;
  function showCap(i){if(caps[i])cap.innerHTML='👉 '+caps[i];}
  showCap(0);
  const on=id=>{const e=$(id);if(e)e.classList.add('go');};
  const grow=(id,w)=>{const e=$(id);if(e)e.style.width=w;};
  if(d.type==='parallel'){
    on('labA');on('labB');grow('barA','30%');grow('barB','30%');
    setTimeout(()=>showCap(1),1800);
  }else if(d.type==='pastpoint'){
    on('labB');grow('barB','26%');
    setTimeout(()=>{on('chA');$('chA').classList.add('flash');showCap(1);},1400);
  }else if(d.type==='order'){
    setTimeout(()=>{on('chA');},200);
    setTimeout(()=>{showCap(1);},1300);
    setTimeout(()=>{on('chB');showCap(2);},2600);
  }else if(d.type==='until'){
    grow('barB','34%');
    setTimeout(()=>{on('chGate');showCap(1);},1500);
    setTimeout(()=>{const g=$('chGate');if(g)g.innerHTML='✅ everyone is here';on('chAct');showCap(2);},2800);
  }else if(d.type==='since'){
    on('chA');
    setTimeout(()=>{grow('barB','36%');showCap(1);},700);
    setTimeout(()=>{showCap(2);},2400);
  }else if(d.type==='future'){
    setTimeout(()=>{on('chA');showCap(1);},300);
    setTimeout(()=>{on('chB');showCap(2);},1900);
  }
  setTimeout(()=>speakOnce(d.sen,'en'),600);
}

     (wrong.length?'<div style="text-align:left;margin-top:8px;"><b style="color:var(--red);">打铁回顾（记住讲解再来！）</b>'+
       wrong.map(w=>'<div class="rec">❌ '+esc(w.hint)+'<br><span style="color:var(--muted);">'+esc(w.tag)+'</span></div>').join('')+'</div>':'<div class="stamp">全场命中 🔥</div>')+
     '<div class="row center" style="margin-top:10px;"><button class="btn" onclick="renderQuiz()">🔁 再赛一场</button><button class="btn ghost" onclick="document.getElementById(\'backBtn\').click()">回大厅</button></div></div>';
    return;
  }
  const q=QUIZ[qIdx],t0=Date.now();
  $('stage').innerHTML='<div class="card"><div class="pgr">第 '+(qIdx+1)+' / '+QUIZ.length+' 球 · <span id="qClock">⏱ 0s</span></div>'+
   '<div class="court"><div class="scorebd">得分 '+qScore+'</div><div class="hoop">🥅</div><div class="ball" id="ball">🏀</div></div>'+
   '<div class="sen" style="font-size:16px;">'+enS(q.stem)+'</div><div class="opts" id="opts">'+
   q.opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div><div id="fb"></div></div>';
  document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,ok=i===q.a;
    document.querySelectorAll('#opts .opt').forEach(x=>x.classList.add('off'));
    b.classList.add(ok?'right':'wrong');
    if(!ok)document.querySelector('#opts .opt[data-i="'+q.a+'"]').classList.add('right');
    beep(ok);
    if(ok){qScore+=2;const ball=$('ball');ball.classList.add('shoot');const sb=document.querySelector('.scorebd');if(sb)setTimeout(()=>{sb.textContent='得分 '+qScore;},900);}
    qItems.push({word:'第'+(qIdx+1)+'球',hint:q.stem,ok:ok,ms:Date.now()-t0,user:q.opts[i],tag:q.why});
    $('fb').innerHTML='<div class="why'+(ok?'':' bad')+'"><span class="lab">'+(ok?'🏀 唰！进了 +2分':'❌ 打铁！看讲解：')+'</span> '+q.why+'</div>'+
     '<div class="row center"><button class="btn" id="nx">'+(qIdx<QUIZ.length-1?'下一球 →':'终场 🏁')+'</button></div>';
    $('nx').onclick=()=>{qIdx++;quizOne();};
  });
}

/* ===================== 📖 学习记录 ===================== */
function buildExport(){
  const evs=loadEv();
  const wrongMap={};
  evs.forEach(e=>(e.items||[]).forEach(it=>{if(!it.ok){const k=it.hint||it.word;wrongMap[k]=(wrongMap[k]||0)+1;}}));
  let txt='【哥哥 · 英语状语从句时光机 · 练习导出】\n日期：'+new Date().toLocaleString('zh-CN')+'\n\n== 反复错的题（错≥2） ==\n';
  const rep=Object.entries(wrongMap).filter(x=>x[1]>=2);
  txt+=rep.length?rep.map(x=>'- '+x[0]+'（错'+x[1]+'次）').join('\n'):'（暂无）';
  txt+='\n\n== 每次明细 ==\n';
  evs.forEach(e=>{txt+='['+new Date(e.ts).toLocaleString('zh-CN')+'] '+e.lesson+'：共'+e.total+'题 错'+e.wrong+'题 用时'+(e.durationSec||0)+'s\n';
    (e.items||[]).forEach(it=>{if(!it.ok)txt+='   ❌ '+(it.hint||it.word)+'（选了 '+(it.user||'?')+'）\n';});});
  txt+='\n== 原始JSON（投喂给爸爸的Claude归档用） ==\n'+JSON.stringify({child:'哥哥',subject:'英语·状语从句',events:evs});
  return txt;
}
function renderRec(){
  const evs=loadEv();
  const mods={};evs.forEach(e=>{mods[e.lesson]=e;});
  let h='<div class="card"><div class="h2">📖 我的学习记录</div>';
  if(!evs.length){h+='<div class="hint">还没有记录，先去玩时光机吧！</div></div>';$('stage').innerHTML=h;return;}
  h+='<div class="rec"><b>已练 '+evs.length+' 次</b> · 共 '+evs.reduce((s,e)=>s+e.total,0)+' 题 · 错 '+evs.reduce((s,e)=>s+e.wrong,0)+' 题</div>';
  h+=Object.values(mods).map(e=>'<div class="rec"><b>'+e.lesson+'</b>（最近一次）：✅对'+(e.total-e.wrong)+' ❌错'+e.wrong+' · '+new Date(e.ts).toLocaleDateString('zh-CN')+'</div>').join('');
  const wrong=[];evs.forEach(e=>(e.items||[]).forEach(it=>{if(!it.ok)wrong.push(it);}));
  if(wrong.length){h+='<div style="margin-top:8px;"><b style="color:var(--red);">错题回顾</b>'+
    wrong.slice(-8).map(w=>'<div class="rec">❌ '+esc(w.hint||w.word)+'<br><span style="color:var(--muted);font-size:12px;">选了：'+esc(w.user||'?')+(w.tag?' · '+esc(w.tag):'')+'</span></div>').join('')+'</div>';}
  h+='<div class="row center" style="margin-top:10px;"><button class="btn" id="cpBtn">📋 复制导出</button>'+
     '<button class="btn ghost" id="dlBtn">💾 存成文件</button>'+
     '<button class="btn ghost sm" id="clrBtn" style="color:var(--red);border-color:var(--red);">🗑 清空</button></div>'+
     '<textarea class="exp hide" id="expTxt"></textarea></div>';
  $('stage').innerHTML=h;
  $('cpBtn').onclick=()=>{const t=buildExport();const ta=$('expTxt');ta.classList.remove('hide');ta.value=t;ta.select();
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{$('cpBtn').textContent='✅ 已复制';}).catch(()=>{document.execCommand('copy');$('cpBtn').textContent='✅ 已复制';});
    else{document.execCommand('copy');$('cpBtn').textContent='✅ 已复制';}};
  $('dlBtn').onclick=()=>{const b=new Blob([buildExport()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='哥哥_状语从句_练习记录_'+new Date().toISOString().slice(0,10)+'.txt';a.click();};
  $('clrBtn').onclick=()=>{if(confirm('确定清空全部练习记录？（导出之后再清哦）')){localStorage.removeItem(EV_KEY);renderRec();}};
}

renderHome();
