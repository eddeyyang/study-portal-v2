    function tone(kind='tap'){
      if(!soundOn)return;
      try{
        if(!audioContext)audioContext=new (window.AudioContext||window.webkitAudioContext)();
        if(audioContext.state==='suspended')audioContext.resume();
        const now=audioContext.currentTime;
        const notes=kind==='ok'?[[523,.00],[659,.08]]:kind==='bad'?[[196,.00],[165,.12]]:[[340,.00]];
        notes.forEach(([hz,delay])=>{
          const osc=audioContext.createOscillator(),gain=audioContext.createGain();
          osc.type=kind==='bad'?'triangle':'sine';osc.frequency.value=hz;

        });
      }catch(_){}
    }

      </section>
      <section class="progress"><div class="metrics"><div class="metric"><strong>${p.done}/5</strong><span>完成环节</span></div><div class="metric"><strong>${p.open}</strong><span>待回炉</span></div><div class="metric"><strong>${p.attempts}</strong><span>独立作答</span></div></div><div class="bar"><i style="width:${p.done*20}%"></i></div><div class="btn-row"><button class="btn" onclick="go('recall')">翻卡复习</button><button class="btn" onclick="go('records')">查看学习记录</button></div></section>
      <details class="source"><summary>给家长看的材料说明</summary><div><b>材料依据：</b>${MATERIAL}。本课新授：时间（when/while/as/by the time/till/until/since）、地点（where）、目的（so that/in order that）、结果（so/such…that、enough/too…to）四类状语从句；让步状从老师说明虚拟语气时再讲，本软件不出题。回家任务：练习卷勾画部分 + 背诵不规则动词31—60（下周一默写，软件内为 fall→leave 共30词，按老师原表逐行核对）。例句音频为软件助教补充，不冒充课堂录音。</div></details>`;
    }
    function iconFor(id){
      const icons={
        sort:'<svg viewBox="0 0 24 24"><path d="M4 6h6v5H4zM14 13h6v5h-6zM10 8.5h4M12 8.5V15M12 15h2"/></svg>',
        time:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 3"/></svg>',
        verbs:'<svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M7 20a2 2 0 0 1 0-4h12M9 8h6"/></svg>',
        recall:'<svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M7 20a2 2 0 0 1 0-4h12M9 8h6"/></svg>',
        quiz:'<svg viewBox="0 0 24 24"><path d="M8 4h8l3 3v13H5V7z"/><path d="M9 11h6M9 15h4M8 4v3h8V4"/></svg>'
      };return icons[id];
    }
    /* ========== 1. 连词分拣台（guided） ========== */
    function startSort(){pickedConn=null;sortedMap={};route='sort';render();scrollTo(0,0)}
    function sortDone(){return Object.keys(sortedMap).length}
    function sortPage(){
      const total=BINS.reduce((s,b)=>s+b.conns.length,0);
      if(sortDone()>=total){
        markModule('sort',{total});
        return`${pageHead('分拣完成','14 个连词都回了各自的箱子')}<section class="panel" data-phase="guided"><div class="empty"><strong>分对了！</strong><p>口诀：先问从句"回答什么问题"——何时→时间、何地→地点、为何→目的、结果如何→结果。</p><div class="btn-row"><button class="btn primary wide" onclick="go('time')">下一步：时间连词显微镜 →</button></div></div></section>`;
      }
      return`${pageHead('连词分拣台',`点一个连词，再点它该去的箱子 · ${sortDone()}/${total}`)}
      <section class="panel" data-phase="guided"><span class="pill">先想：从句回答什么问题？</span>
      <div class="conn-tray">${BINS.flatMap(b=>b.conns).map(c=>`<button class="conn ${pickedConn===c?'on':''} ${sortedMap[c]?'done':''}" onclick="pickConn('${c}')">${c}</button>`).join('')}</div>
      <div class="bin-grid">${BINS.map(b=>`<button class="bin" onclick="dropConn('${b.id}')"><h3>${b.name}</h3><small>${b.sub}</small><div class="got">${b.conns.filter(c=>sortedMap[c]).map(c=>`<i>${c}</i>`).join('')}</div></button>`).join('')}</div>
      <div class="hint-box" id="sortHint"><b>玩法：</b>先点上面的连词小球，再点下面的箱子。不确定就想想：这个从句在回答"什么时候 / 在哪里 / 为了什么 / 结果怎样"？</div>
      </section>`;
    }
    function pickConn(c){if(sortedMap[c])return;pickedConn=c;tone('tap');render()}
    function dropConn(binId){
      if(!pickedConn){toast('先点一个连词小球');return}
      const bin=BINS.find(b=>b.id===binId);
      if(bin.conns.includes(pickedConn)){
        sortedMap[pickedConn]=binId;tone('ok');
        toast(sortDone()>=BINS.reduce((s,b)=>s+b.conns.length,0)?'全部放对！':'放对了！');
        recordAttempt({questionId:`sort-${pickedConn}`,prompt:'连词分类',selected:binId,expected:binId,correct:true,skill:'连词分类',activity:'guided',stage:'sort',ms:0});
      }else{
        tone('bad');
        recordAttempt({questionId:`sort-${pickedConn}`,prompt:'连词分类',selected:binId,expected:BINS.find(b=>b.conns.includes(pickedConn)).id,correct:false,reason:CONN_HINT[pickedConn]||'',skill:'连词分类',activity:'guided',stage:'sort',ms:0});
        toast(CONN_HINT[pickedConn]||'再想想这个从句回答什么问题');
      }
      render();
    }
    /* ========== 2. 时间连词显微镜（guided） ========== */
    function timePage(){
      if(timePos>=TIME_CARDS.length){
        markModule('time',{cards:TIME_CARDS.length});
        return`${pageHead('显微镜看完啦','7 个时间连词 + 主将从现')}<section class="panel" data-phase="guided"><div class="empty"><strong>时间的脾气摸清了</strong><p>while 管时段、as 管并肩、by the time 配完成、not…until 直到才、since 自从配完成；主句将来时，从句绝不用 will。</p><div class="btn-row"><button class="btn primary wide" onclick="go('verbs')">下一步：动词 31—60 带背 →</button></div></div></section>`;
      }
      const c=TIME_CARDS[timePos];
      return`${pageHead('时间连词显微镜',`第 ${timePos+1} / ${TIME_CARDS.length} 张 · 点 🔊 听例句`)}
      <section class="panel" data-phase="guided"><div class="stepper">${['看连词','听例句','说规则','下一张'].map((x,i)=>`<div class="step ${i===0?'on':''}">${i+1}. ${x}</div>`).join('')}</div>
      <div class="tcard"><div class="cw">${esc(c.w)}</div><div class="cm">${esc(c.m)}</div>
        <div class="ex">${esc(c.ex)}<small>${esc(c.cn)}</small></div>
        <div class="rule">💡 ${esc(c.rule)}</div></div>
      <div class="btn-row"><button class="btn" onclick="playSentence('${c.audio}','例句：${esc(c.w)}')">🔊 听例句</button><button class="btn primary" onclick="nextTime()">${timePos===TIME_CARDS.length-1?'看完啦 ✓':'下一张 →'}</button></div>
      </section>`;
    }
    function nextTime(){timeRead.add(timePos);timePos++;render();scrollTo({top:0,behavior:'smooth'})}
    /* ========== 3. 不规则动词 31—60 带背（guided + 遮挡回忆） ========== */
    function verbsPage(){
      const seenCount=verbSeen.size;
      const allSeen=seenCount>=VERBS.length;
      if(verbPos>=VERBS.length){
        markModule('verbs',{total:VERBS.length});
        return`${pageHead('31—60 翻完一轮','周一默写：错词会留在记录里')}<section class="panel" data-phase="recall"><div class="empty"><strong>${allSeen?'30 个全部遮开过':'还有没翻的'}</strong><p>建议：遮住三态能默写出来的才算过；写错的回学校纸笔再写两遍。可以再来一轮。</p><div class="btn-row"><button class="btn" onclick="verbPos=0;render()">再来一轮</button><button class="btn primary" onclick="go('recall')">去翻规则卡 →</button></div></div></section>`;
      }
      const v=VERBS[verbPos],open=verbSeen.has(v.n);
      return`${pageHead('动词三态带背 · 31—60',`第 ${verbPos+1} / ${VERBS.length} 个 · 已遮开 ${seenCount}/30 · 先遮着背，再点开核对`)}
      <section class="panel" data-phase="recall"><span class="pill">下周一默写范围（老师原表）</span>
      <div class="verb-card ${open?'open':''}" onclick="flipVerb()">
        <span class="n">No.${v.n}</span>
        <div class="base">${esc(v.base)}</div><div class="ipa">${esc(v.ipa)}</div><div class="zh">${esc(v.zh)}</div>
        <div class="forms"><div><b>${esc(v.past)}</b><span>过去式</span></div><div><b>${esc(v.pp)}</b><span>过去分词</span></div></div>
        <div class="tip">💡 ${esc(v.tip)}${open?'':'　（点卡片遮住/打开）'}</div>
      </div>
      <div class="btn-row"><button class="btn" onclick="playSentence('${v.audio}','${esc(v.base)} 三态')">🔊 听三态</button>${verbPos>0?`<button class="btn" onclick="verbPos--;render()">← 上一个</button>`:''}<button class="btn primary" onclick="nextVerb()">${verbPos===VERBS.length-1?'翻完 ✓':'下一个 →'}</button></div>
      </section>`;
    }
    function flipVerb(){const v=VERBS[verbPos];verbSeen.has(v.n)?verbSeen.delete(v.n):verbSeen.add(v.n);tone('tap');render()}
    function nextVerb(){verbSeen.add(VERBS[verbPos].n);verbPos++;render();scrollTo({top:0,behavior:'smooth'})}
    function recallPage(){
      const opened=Object.values(state.recall).filter(Boolean).length;
      return`${pageHead('遮挡回忆','先说答案，再点开核对；可以反复翻回')}<section class="panel" data-phase="recall"><span class="pill">${opened}/6 已核对</span><h2>六张规则翻卡</h2><div class="recall-grid">${recallCards.map((card,i)=>`<button class="recall ${state.recall[i]?'open':''}" onclick="flipRecall(${i})"><span class="front">${i+1}. ${esc(card[0])}</span><span class="back">${esc(card[1])}</span><span class="tap">${state.recall[i]?'再点一次翻回':'先自己说，再点开'}</span></button>`).join('')}</div><div class="btn-row"><button class="btn" onclick="resetRecall()">全部翻回</button><button class="btn primary" onclick="finishRecall()">我能遮住说出六条 →</button></div></section>`;
    }
    function flipRecall(i){state.recall[i]=!state.recall[i];save();tone('tap');render()}
    function resetRecall(){state.recall={};save();render()}
    function finishRecall(){markModule('recall',{cards:6});tone('ok');startQuiz()}
    function startQuiz(){quizPos=0;quizMode='original';answerState=null;route='quiz';render();scrollTo(0,0)}
    function currentQuestion(){return questions[quizPos]}
    function currentPart(){const q=currentQuestion();return quizMode==='transfer'?q.variation:q}
    function quizPage(){
      if(quizPos>=questions.length){
        markModule('quiz',{questions:questions.length});
        return`${pageHead('独立检验完成','错后重教与原题返回都已保留')}<section class="panel"><div class="empty"><strong>完成</strong><p>十题已经做完。待回炉项目会保留在记录里，连续答对两次才算解决。</p><div class="btn-row"><button class="btn" onclick="go('records')">查看记录</button><button class="btn primary" onclick="startQuiz()">再做一轮</button></div></div></section>`;
      }
      const q=currentQuestion(),part=currentPart();
      return`${pageHead('独立合并检验',`第 ${quizPos+1} / ${questions.length} 题${quizMode==='transfer'?' · 小变式':''}`)}<section class="panel" ${quizMode==='transfer'?'data-phase="transfer"':'data-phase="independent"'}><span class="pill">${esc(q.skill)}</span><h2>${esc(part.prompt)}</h2><div class="choices">${part.options.map((option,i)=>`<button class="choice ${choiceClass(i)}" ${answerState?.locked?'disabled':''} onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${esc(option)}</button>`).join('')}</div>${quizFeedback()}</section>`;
    }
    function choiceClass(i){if(!answerState?.locked)return'';const p=currentPart();if(i===p.answer)return'right';if(i===answerState.selected)return'wrong';return''}
    function answerQuiz(index){
      if(answerState?.locked)return;
      const q=currentQuestion(),part=currentPart(),correct=index===part.answer,wasWrong=Boolean(state.wrongbook[q.id]?.errors);
      recordAttempt({questionId:`${q.id}-${quizMode}`,prompt:part.prompt,selected:part.options[index],expected:part.options[part.answer],correct,reason:correct?'':q.repair,skill:q.skill,activity:'independent',stage:quizMode,ms:0});
      if(correct){
        updateWrong(q,true);
        answerState={locked:true,selected:index,correct:true};
        tone('ok');
        if(quizMode==='original'&&wasWrong){answerState.needTransfer=true}
      }else{
        updateWrong(q,false);answerState={locked:true,selected:index,correct:false};tone('bad');
      }
      save();render();
    }
    function updateWrong(q,correct){
      const item=state.wrongbook[q.id]||(state.wrongbook[q.id]={id:q.id,skill:q.skill,errors:0,streak:0,solved:false,lastWrong:null});
      if(correct){if(item.errors>0)item.streak++;if(item.errors>0&&item.streak>=2)item.solved=true}
      else{item.errors++;item.streak=0;item.solved=false;item.lastWrong=new Date().toISOString()}
    }
    function quizFeedback(){
      if(!answerState)return'';
      const q=currentQuestion();
      if(!answerState.correct)return`<div class="feedback no"><h3>先停一下，不跳题</h3><div>${esc(q.explain)}</div><div class="btn-row"><button class="btn danger wide" onclick="openRepair()">进入定点重教 →</button></div></div>`;
      const need=answerState.needTransfer;
      return`<div class="feedback ok"><h3>${need?'原题改对了，再做一个小变式':'判断正确'}</h3><div>${esc(q.explain)}</div><div class="btn-row"><button class="btn primary wide" onclick="${need?'startTransfer()':'nextQuiz()'}">${need?'做小变式 →':quizPos===questions.length-1?'查看结果':'下一题 →'}</button></div></div>`;
    }
    function openRepair(){repairQuestion=currentQuestion();route='repair';render();scrollTo(0,0)}
    function repairPage(){
      const q=repairQuestion;
      return`${pageHead('定点重教',`保持第 ${quizPos+1} 题现场，不丢进度`)}<section class="panel" data-phase="repair"><span class="pill">${esc(q.skill)}</span><h2>这一步为什么会错？</h2><div class="repair-rule"><b>判断口令：</b>${esc(q.repair)}<br><b>放回原句：</b>${esc(q.explain)}</div><p>请把口令说一遍，再回到刚才那一道题改答。</p><div class="btn-row"><button class="btn primary wide" data-return-to-question="independent" onclick="returnToQuestion()">我看懂了，返回刚才第 ${quizPos+1} 题 →</button></div></section>`;
    }
    function returnToQuestion(){route='quiz';quizMode='original';answerState=null;render();scrollTo(0,0)}
    function startTransfer(){quizMode='transfer';answerState=null;render();scrollTo(0,0)}
    function nextQuiz(){quizPos++;quizMode='original';answerState=null;render();scrollTo(0,0)}
    function recordsPage(){
      const wrong=Object.values(state.wrongbook).filter(x=>x.errors>0);
      return`${pageHead('学习记录','只属于 Kenton 与本软件')}<section class="panel"><div class="metrics"><div class="metric"><strong>${state.attempts.length}</strong><span>独立作答</span></div><div class="metric"><strong>${wrong.filter(x=>!x.solved).length}</strong><span>待回炉</span></div><div class="metric"><strong>${wrong.filter(x=>x.solved).length}</strong><span>已解决</span></div></div></section>
      <section class="panel"><h2>错题回炉</h2>${wrong.length?`<div class="wrong-list">${wrong.map(item=>`<div class="wrong-item"><div><strong>${esc(item.skill)}</strong><small>错 ${item.errors} 次 · 连对 ${item.streak}/2</small></div><span class="status ${item.solved?'solved':'open'}">${item.solved?'已解决':'待回炉'}</span></div>`).join('')}</div>`:'<div class="empty"><strong>暂无错题</strong><p>完成独立检验后，这里会按知识点记录。</p></div>'}
      <div class="btn-row"><button class="btn" onclick="downloadJson()">导出 JSON</button><button class="btn" onclick="downloadMarkdown()">导出学习汇报</button><button class="btn" onclick="document.getElementById('importFile').click()">导入记录</button><input id="importFile" type="file" accept="application/json" hidden onchange="importJson(event)"><button class="btn primary" onclick="startQuiz()">只做检验</button></div><p class="privacy">本机记录键包含 Kenton、软件名和版本；不会与 Eddey 或家长测试记录混用。</p></section>`;
    }
    function report(){
      const wrong=Object.values(state.wrongbook).filter(x=>x.errors>0&&!x.solved);
      return`# Kenton 状语从句学习汇报\n\n- 软件版本：${VERSION}\n- 最近学习：${state.lastOpened}\n- 累计学习：${Math.round(state.totalMs/60000)} 分钟\n- 独立作答：${state.attempts.length}\n- 待回炉：${wrong.length}\n\n## 待回炉\n${wrong.length?wrong.map(x=>`- ${x.skill}：错 ${x.errors} 次，连对 ${x.streak}/2`).join('\n'):'- 无'}\n\n材料：${MATERIAL}\n`;
    }
    function download(name,type,text){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([text],{type}));link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
    function downloadJson(){download('kenton-adverbial-clause-record.json','application/json',JSON.stringify(state,null,2))}
    function downloadMarkdown(){download('kenton-adverbial-clause-report.md','text/markdown',report())}
    function importJson(event){
      const file=event.target.files?.[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data?.child!=='Kenton'||data?.appId!==APP_ID||!Array.isArray(data.attempts)||typeof data.wrongbook!=='object')throw new Error();state={...defaultState(),...data,schema:2,version:VERSION};save();toast('记录导入成功');go('records')}catch(_){toast('导入失败：不是本软件的 Kenton 记录')}};
      reader.readAsText(file);event.target.value='';
    }
    function syncSoundButton(){
      const button=document.getElementById('soundToggle');if(!button)return;
      button.textContent=soundOn?'声':'静';button.setAttribute('aria-label',soundOn?'关闭点击反馈音':'打开点击反馈音');
    }
    document.getElementById('soundToggle').addEventListener('click',()=>{soundOn=!soundOn;localStorage.setItem('study:kenton:ui-sound',soundOn?'1':'0');if(soundOn)tone('ok');syncSoundButton()});
    Object.assign(window,{go,startSort,pickConn,dropConn,nextTime,flipVerb,nextVerb,playSentence,flipRecall,resetRecall,finishRecall,startQuiz,answerQuiz,openRepair,returnToQuestion,startTransfer,nextQuiz,downloadJson,downloadMarkdown,importJson});
    render();
  })();
  </script>
</body>
</html>
