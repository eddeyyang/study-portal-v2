function warmModel(){return '<section class="screen" data-phase="guided"><h1>最后再更新一次</h1><div class="boxes"><div class="box"><small>i</small><b>'+model.i+'</b></div><div class="box"><small>tnt</small><b>'+model.tnt+'</b></div><div class="box"><small>阶段</small><b style="font-size:16px">'+(model.ended?'退出':['检查','乘法','更新'][model.phase])+'</b></div></div><div class="pointer">'+esc(model.last)+'</div><div class="actions">'+btn(model.ended?'重新演示':'执行下一步',model.ended?'reset-model':'step-model','primary')+'</div><pre>'+esc(ORIGINAL_LOOP)+'</pre><div class="output">'+esc(model.out)+'</div><div class="actions">'+btn('回到刚才那道题','return-quiz')+'</div></section>';}
function valueModel(){const div=state.q===4,hi=Math.floor(model.number/1000),lo=model.number%1000,d=hi-lo,n=String(model.fmt),out=model.left?n.padEnd(5,' '):n.padStart(5,' ');return '<section class="screen" data-phase="guided"><span class="eyebrow">改一次，看结果</span><h1>'+(div?'整除看余数':'五格输出台')+'</h1>'+(div?'<p>N='+model.number+'</p><div class="boxes"><div class="box"><small>N/1000</small><b>'+hi+'</b></div><div class="box"><small>N%1000</small><b>'+lo+'</b></div><div class="box"><small>两者的差</small><b>'+d+'</b></div></div><div class="pointer">差 % 314 = '+d%314+'；'+(d%314===0?'余数为0，整除条件成立。':'余数不是0，整除条件不成立。')+'</div><pre>((N/1000)-(N%1000))%314==0</pre><div class="actions">'+btn('换一个六位数','value-n','primary')+'</div>':'<p>数字'+n+'，'+(model.left?'左':'右')+'对齐，总宽度至少5格。</p><div class="digits">'+out.split('').map(c=>'<span class="digit">'+(c===' '?'□':c)+'</span>').join('')+'</div><pre>'+esc('printf("%'+(model.left?'-':'')+'5d",'+n+');')+'</pre><div class="actions">'+btn('切换左右对齐','value-align','primary')+btn('切换数字','value-number')+'</div><p class="mini">□表示一个空格；格式符里的5不会被打印。</p>')+'<div class="actions">'+btn('回到刚才那道题','return-quiz')+btn('回到笔记','return-note')+'</div></section>';}

function modelHtml(){if(state.q===0)return warmModel();if(state.q>=4&&state.q<=6)return valueModel();const height=state.q>=7;return '<section class="screen" data-phase="guided"><span class="eyebrow">动一下，看真正改变了什么</span><h1>'+(height?'谁更接近':'执行到哪一步')+'</h1>'+(height?'<p>Alice 150；候选依次是165、135、133。</p><div class="ruler">'+model.heights.map((h,i)=>'<div class="person"><span style="height:'+((h-100)*1.4)+'px;background:'+(i===0?'#b39ddb':h===model.best?'#36c5d6':'#dae5e8')+'"></span><b>'+h+'</b><small>'+(i===0?'Alice':'差'+Math.abs(h-150))+'</small></div>').join('')+'</div><div class="boxes"><div class="box"><small>比较基准</small><b>150</b></div><div class="box"><small>当前身高</small><b>'+model.best+'</b></div><div class="box"><small>当前距离</small><b>'+model.bestD+'</b></div></div>':'<div class="actions">'+['empty','normal','continue','break'].map((m,i)=>btn(['有空分号','无空分号','遇偶数continue','遇3就break'][i],'mode-'+m,model.mode===m?'primary':'')).join('')+'<div class="boxes"><div class="box"><small>i</small><b>'+model.i+'</b></div><div class="box"><small>total</small><b>'+model.total+'</b></div><div class="box"><small>下一步</small><b style="font-size:16px">'+(model.ended?'已结束':['检查','执行','更新'][model.phase])+'</b></div></div>')+'<div class="pointer" role="status">'+esc(model.last)+'</div>'+(!height?'<p class="mini">输出区（尚未输出时为空）</p><div class="output">'+esc(model.out)+'</div>':'')+'<div class="actions">'+btn(model.ended?'重新演示':'执行下一步',model.ended?'reset-model':'step-model','primary')+btn('还原','reset-model')+'</div><pre>'+esc(height?'int best=h2, bestD=abs(h2-h1);\n// h3、h4依次进入\nint d=abs(h-h1);\nif(d<bestD || (d==bestD && h<best)){\n best=h; bestD=d;\n}':model.mode==='empty'?'for(i=1;i<5;i++);\n total+=i;\ncout<<total;':model.mode==='normal'?'for(i=1;i<5;i++) total+=i;\ncout<<total;':model.mode==='continue'?'for(i=1;i<5;i++){\n if(i%2==0) continue;\n cout<<i<<"#";\n}\ncout<<i<<"END";':'for(i=1;i<5;i++){\n if(i==3) break;\n cout<<i<<"#";\n}\ncout<<i<<"END";')+'</pre><p class="mini muted">这是短模型；下面检验题保留原题代码。</p><div class="actions">'+btn('回到刚才那道题','return-quiz')+btn('回到笔记','return-note')+'</div></section>';}
function stepModel(){if(state.q===0){if(model.phase===0){if(model.i<5){model.last=model.i+'<5成立，下一步做乘法。';model.phase=1;}else{model.ended=true;model.out=' 0 5';model.last='5<5失败，循环外printf读到tnt=0、i=5。';}}else if(model.phase===1){model.tnt*=model.i;model.last='乘以'+model.i+'，tnt变成'+model.tnt+'。';model.phase=2;}else{model.i++;model.last='i++变成'+model.i+'；再检查。';model.phase=0;}render();return;}if(state.q>=7){if(model.index===0){model.last='先把165留下：best=165，bestD=15。';model.index++;}else if(model.index<=2){const h=model.heights[model.index+1],d=Math.abs(h-150);if(d<model.bestD || (d===model.bestD&&h<model.best)){model.best=h;model.bestD=d;model.last=h+'差'+d+'，同差更矮或距离更小：身高和距离一起更新。';}else model.last=h+'差'+d+'，没有更近，保留'+model.best+'。';model.index++;}else{model.ended=true;model.last='最终输出身高135，不是距离15。';}}else if(model.phase===0){if(model.i<5){model.last=model.i+'<5成立，进入'+(model.mode==='empty'?'空循环体。':'循环体。');model.phase=1;}else{if(model.mode==='empty')model.total+=model.i;model.out=['empty','normal'].includes(model.mode)?String(model.total):model.out+model.i+'END';model.ended=true;model.last='条件失败，i保留'+model.i+'，现在执行循环外语句。';}}else if(model.phase===1){if(model.mode==='break'&&model.i===3){model.ended=true;model.out+=model.i+'END';model.last='break立刻退出；没有执行i++，i仍是3。';}else{if(model.mode==='normal'){model.total+=model.i;model.last='total加'+model.i+'，变成'+model.total+'。';}else if(model.mode==='empty')model.last='分号是空循环体；这里不做total+=i。';else if(model.mode==='continue'&&model.i%2===0)model.last='偶数遇continue：跳过cout，接着仍执行i++。';else{model.out+=model.i+'#';model.last='执行cout，输出'+model.i+'#。';}model.phase=2;}}else{model.i++;model.phase=0;model.last='执行i++，i变成'+model.i+'；接着重新检查。';}render();}
const PHASE_OPEN={recall:'<section class="screen" data-phase="recall">',independent:'<section class="screen" data-phase="independent">',transfer:'<section class="screen" data-phase="transfer">'};
function question(){const q=QUESTIONS[state.q];return PHASE_OPEN[q.phase]+'<span class="eyebrow">'+(q.phase==='independent'?'原题检验':q.phase==='transfer'?'短迁移 · 自编':'遮住笔记，自己试')+' · '+(state.q+1)+'/'+QUESTIONS.length+'</span><h1>'+q.topic+'</h1><p>'+q.prompt+'</p><pre>'+esc(q.code)+'</pre>'+(q.kind==='choice'?'<div class="answer-options">'+q.choices.map((s,i)=>btn(String.fromCharCode(65+i)+' · '+esc(s),'answer-'+String.fromCharCode(65+i))).join('')+'</div>':'<form id="answerForm"><label for="answer">'+(['condition','update','output'].includes(q.kind)?'填写C++代码；大小写要正确':q.kind==='explain'?'写一句原因，也可用系统语音输入':q.kind==='spaces'?'用□代替空格':q.kind==='text'?'填写完整输出，不加空格':'按题目顺序填写，用空格隔开')+'</label><textarea id="answer" '+''+' maxlength="600">'+esc(state.drafts[q.id]||'')+'</textarea><div class="actions"><button class="primary" type="submit">'+(q.kind==='explain'?'保存解释，查看要点':'检查答案')+'</button></div></form>')+'<div id="feedback" aria-live="polite"></div><div class="actions">'+btn('看关键笔记','help-note')+btn('先标待复习，继续','skip')+'</div></section>';}
function reference(q){return q.kind==='choice'?q.answer+'：'+q.choices[q.answer.charCodeAt(0)-65]:q.answer;}
function repair(){const q=QUESTIONS[state.q];return '<section class="screen" data-phase="repair"><h1>只补这一处</h1><div data-child-explanation="primary"><p data-child-part="gap">你卡在：'+q.topic+'。</p><p data-child-part="reason">'+q.why+'</p><p data-child-part="check">对照原代码，回去再试一次。</p></div><pre>'+esc(q.code)+'</pre><div class="actions"><button class="primary" data-action="return-quiz" data-return-to-question="original">回到刚才那道题</button>'+btn('看一步变化','model')+'</div><div class="escape" data-learning-escape="answer-and-continue"><p>赶时间可以先记参考答案。</p><pre data-reference-answer>'+esc(reference(q))+'</pre><button data-action="skip" data-continue-after-reveal>记为待复习并继续</button></div></section>';}
function notebook(){return '<section class="screen"><span class="eyebrow">拿出本子 · 抄关键句</span><h1>得分点笔记</h1><p>先抄今天练到的条目。例子只用来核对。</p>'+NOTES.map((n,i)=>'<article class="notebook-item"><h3>'+String(i+1).padStart(2,'0')+' / '+n[0]+'</h3><p>'+esc(n[1])+'</p><pre>'+esc(n[2])+'</pre><button data-action="note-'+i+'">'+(state.notes['all-'+i]?'已确认抄好':'我已抄好这一条')+'</button></article>').join('')+'<div class="actions">'+btn('下载笔记','download-notes')+btn('返回刚才的位置','back','primary')+'</div></section>';}
function records(){return '<section class="screen" data-parent-analysis><h1>本次学习记录</h1><p>只记录Kenton本次操作。抄写为自报，解释待复核；未做题不会计为通过。</p><p>活跃用时约 '+Math.ceil(state.activeSeconds/60)+' 分钟。</p><table class="proof"><thead><tr><th>题目</th><th>当前证据</th></tr></thead><tbody>'+QUESTIONS.map(q=>'<tr><td>'+q.topic+' / '+q.id+'</td><td>'+esc(state.done[q.id]||'未做')+'</td></tr>').join('')+'</tbody></table><details><summary>查看原回答与尝试</summary><pre>'+esc(JSON.stringify(state.history,null,2))+'</pre></details><p>未做整套新卷，也未自动评测任意C++程序。本课不据局部正确率预测考试分数。</p><div class="actions">'+btn('下载学习记录','export')+btn('复制待问问题','copy')+btn('返回','back','primary')+'</div></section>';}
const REFERENCE_PROGRAM='#include <iostream>\n#include <cstdlib>\nusing namespace std;\nint main(){\n int h1,h2,h3,h4;\n cin>>h1>>h2>>h3>>h4;\n int best=h2, bestD=abs(h2-h1);\n int h=h3, d=abs(h-h1);\n if(d<bestD || (d==bestD && h<best)){\n  best=h; bestD=d;\n }\n h=h4; d=abs(h-h1);\n if(d<bestD || (d==bestD && h<best)){\n  best=h; bestD=d;\n }\n cout<<best;\n return 0;\n}';
function program(){return '<section class="screen"><span class="eyebrow">有余力再做 · 不强求一次完成</span><h1>写成完整程序</h1><p>回到自己的编程平台，独立写“最近身高”。卡住超过10分钟，先记下卡点。</p><label for="programDraft">我的程序草稿（自动保存在本机）</label><textarea id="programDraft" maxlength="12000" style="min-height:180px" spellcheck="false">'+esc(state.program||'')+'</textarea><details><summary>查看完整参考（看过后不算独立完成）</summary><pre>'+esc(REFERENCE_PROGRAM)+'</pre><p>参考使用逐个候选比较；与原题题意相同。不要直接复制当作自己会写。</p></details><details><summary>需要核对的测试</summary><pre>150 165 135 133 → 135\n150 140 160 149 → 149\n150 160 140 180 → 140\n150 140 160 180 → 140\n150 151 130 199 → 151</pre></details><label for="realRun">真实平台结果或卡点</label><textarea id="realRun" maxlength="1500" placeholder="粘贴报错、题号与最后提交结果">'+esc(state.realRun||'')+'</textarea><p class="mini muted">这里保存草稿，不编译任意C++，也不评隐藏测试点。完整程序分数以真实平台为准。</p><div class="actions">'+btn('练一遍提交检查','submission','primary')+btn('本次先停，保留记录','finish')+'</div></section>';}

function submission(){const n=state.submission.stage;return '<section class="screen"><span class="eyebrow">操作练习 · 不是正式考试系统</span><h1>运行后还要提交</h1><div class="note"><p>运行成功 ≠ 已提交。</p><p>提交测评后，查看最后一次记录。</p></div><p>'+['模拟现场：程序已经写好，现在只在编辑器里。','模拟现场：编译运行通过，样例输出相符。还没有提交。','模拟现场：提交记录已出现，状态为已收到。','已查看模拟提交记录。正式考试还要核对题号、语言与最后一次结果。'][n]+'</p><div class="machine"><p>保存代码：已保存</p><p>样例运行：'+(n>=1?'已检查':'未检查')+'</p><p>提交记录：'+(n>=2?'模拟记录 #1 · 已收到':'没有记录')+'</p><p>最后结果：'+(n>=3?'已查看（仅操作练习）':'未查看')+'</p></div><div class="actions">'+btn(['检查样例运行','提交测评（模拟）','查看提交记录','我已记下，结束短练'][n],'submit-step','primary')+btn('本次先停，保留记录','finish')+'</div><p class="mini muted">本页没有向考试平台提交代码，不代表已获得编程分数。</p></section>';}
function finish(){const checked=Object.keys(state.done).length;return '<section class="screen"><span class="badge">短练收尾</span><h1>把关键点带走</h1><div class="success-mark">已处理 '+checked+' / '+QUESTIONS.length+' 个检验节点</div><p>把待复习的题带来问我；今天的笔记明天再遮住看一次。</p><div class="actions">'+btn('查看得分笔记','notebook')+btn('查看记录','records')+'</div><div class="actions">'+btn(state.syncDone?'已加入同步队列':'完成并同步','sync','primary')+btn('下载记录','export')+'</div><p class="mini muted">只有点击“完成并同步”才申请上传。网络失败会保留本机队列；不把练过记成考试通过。</p><div class="actions">'+btn('回到短练入口','home')+btn('完整程序与提交','program')+'</div></section>';}
function render(){const count=Object.keys(state.done).length;$('progress').innerHTML=Array.from({length:QUESTIONS.length},(_,i)=>'<span class="'+(i<count?'on':'')+'"></span>').join('');$('stage').innerHTML=({home,note,model:modelHtml,quiz:question,repair,notebook,records,submission,program,finish}[state.screen]||home)();}
function assess(value){const q=QUESTIONS[state.q],v=value.trim();if(!v){$('notice').textContent='先写一个答案，或选“先标待复习，继续”。';return;}state.drafts[q.id]=v;state.tries[q.id]=(state.tries[q.id]||0)+1;const tokens=x=>(x.match(/[A-Za-z_][A-Za-z_0-9]*|\d+|==|&&|\|\||<<|[^\s]/g)||[]).join(' ');const ok=q.kind==='numbers'?v.normalize('NFKC').split(/[\s,，、；;]+/).filter(Boolean).join(' ')===q.answer:q.kind==='spaces'?value.replace(/[ \u3000]/g,'□').replace(/[\r\n]+$/,'')===q.answer:q.kind==='condition'?tokens(v)===tokens(q.answer):q.kind==='update'?[tokens(q.answer),tokens('bestD=d; best=h;')].includes(tokens(v)):q.kind==='output'?[tokens('cout<<best;'),tokens('cout << best << endl;')].includes(tokens(v)):v===q.answer;const helped=!!state.assisted[q.id]||state.tries[q.id]>1;const outcome=ok===null?'解释已记录，待复核':ok?(helped?'修复后正确':'本次首答正确'):'待复习';state.history.push({questionId:q.id,topic:q.topic,response:v,outcome,assisted:helped,at:new Date().toISOString()});state.syncDone=false;
if(ok===false){state.done[q.id]='待复习';state.assisted[q.id]=true;save();if(state.tries[q.id]===1){go('repair');return;}$('feedback').innerHTML='<div class="escape" data-learning-escape="answer-and-continue"><p>不反复卡在这里。先抄要点，再继续。</p><pre data-reference-answer>'+esc(reference(q))+'</pre><p>'+q.why+'</p><div class="actions">'+btn('我再改一次','return-quiz')+'<button data-action="skip" data-continue-after-reveal>记为待复习并继续</button></div></div>';return;}
state.done[q.id]=outcome;if(ok===null)state.assisted[q.id]=true;save();$('feedback').innerHTML='<div class="feedback good"><p>'+(ok===null?'解释已保存，待家长复核。':'这一步正确。')+'</p><p>'+esc(ok===null?q.answer:q.why)+'</p><div class="actions">'+btn('继续','next','primary')+'</div></div>';const f=$('answerForm');if(f)f.querySelector('button').disabled=true;document.querySelectorAll('[data-action^="answer-"]').forEach(b=>b.disabled=true);}
function next(){if(state.q>=state.end){go('finish');return;}const n=QUESTIONS[state.q].note;state.q++;go(QUESTIONS[state.q].note!==n?'note':'quiz');}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function report(){return 'Kenton 考前短练\n'+QUESTIONS.map(q=>q.id+' '+q.topic+'：'+(state.done[q.id]||'未做')).join('\n')+'\n最近回答：\n'+state.history.slice(-12).map(h=>h.questionId+'：'+h.response+'（'+h.outcome+'）').join('\n')+'\n请只讲待复习题的第一个错误转折，保留原代码。';}
async function action(a){$('notice').textContent='';if(a==='value-n'){model.number=model.number===740112?314159:740112;render();return;}if(a==='value-align'){model.left=!model.left;render();return;}if(a==='value-number'){model.fmt=model.fmt===314?27:314;render();return;}if(a.startsWith('mode-')){resetModel();model.mode=a.slice(5);render();return;}if(a.startsWith('answer-')){assess(a.slice(7));return;}if(a.startsWith('note-')){state.notes['all-'+a.slice(5)]=new Date().toISOString();save();render();return;}if(a.startsWith('start-')){const ranges=[[0,0],[1,6],[7,11]],r=ranges[Number(a.slice(6))];state.q=r[0];state.end=r[1];go('note');return;}switch(a){case'noted':state.notes['rule-'+QUESTIONS[state.q].note]=new Date().toISOString();go('quiz');break;case'model':modelType=state.q>=5?'loop':'digits';state.assisted[QUESTIONS[state.q].id]=true;resetModel();go('model');break;case'step-model':stepModel();break;case'reset-model':resetModel();render();break;case'return-quiz':go('quiz');break;case'return-note':go('note');break;case'help-note':state.assisted[QUESTIONS[state.q].id]=true;go('note');break;case'next':next();break;case'skip':{const q=QUESTIONS[state.q];state.done[q.id]='待复习';state.assisted[q.id]=true;state.history.push({questionId:q.id,topic:q.topic,response:state.drafts[q.id]||'',outcome:'查看参考或跳过，待复习',assisted:true,at:new Date().toISOString()});state.syncDone=false;next();break;}case'submit-step':if(state.submission.stage<3){state.submission.stage++;save();render();}else{state.submission.confirmedAt=new Date().toISOString();state.notes.submit=state.submission.confirmedAt;go('finish');}break;case'program':go('program');break;case'submission':go('submission');break;case'finish':go('finish');break;case'notebook':case'records':state.returnScreen=state.screen;go(a);break;case'back':go(['notebook','records'].includes(state.returnScreen)?'home':state.returnScreen||'home');break;case'home':go('home');break;case'export':download(APP_ID+'-record.json',JSON.stringify({...state,test:testQuery||!!window.DDLearningSync?.isTest(),exportedAt:new Date().toISOString()},null,2),'application/json');$('notice').textContent='已生成本次记录文件。';break;case'download-notes':download('Kenton-代码突破得分笔记.txt',NOTES.map((n,i)=>(i+1)+'. '+n[0]+'\n'+n[1]+'\n'+n[2]).join('\n\n'),'text/plain;charset=utf-8');break;case'copy':try{await navigator.clipboard.writeText(report());$('notice').textContent='已复制，可粘贴给老师。';}catch(e){$('notice').textContent='复制不可用，请下载记录。';}break;case'sync':if(state.syncDone){$('notice').textContent='本次结果已加入同步队列；可在门户检查同步状态。';break;}if(testQuery||!window.DDLearningSync||window.DDLearningSync.isTest()){$('notice').textContent='测试环境：只保存本机，不上传正式记录。';break;}const sync=window.DDLearningSync;for(const h of state.history){sync.recordAttempt({client_event_id:APP_ID+'-'+state.started+'-'+state.history.indexOf(h),kid:CHILD,subject:'编程',topic:h.topic,item:h.questionId,ok:h.outcome==='本次首答正确'||h.outcome==='修复后正确'?true:h.outcome==='解释已记录，待复核'?null:false,payload:{...h,notesSelfReported:true}});}state.syncDone=!!sync.complete({kid:CHILD,subject:'编程',topic:'考前循环与条件及最近身高',item:'完成短练并保留待复习项',payload:{outcomes:state.done,notes:state.notes,submissionPractice:state.submission,activeSeconds:state.activeSeconds,programDraft:state.program,realPlatformReport:state.realRun,referenceViewed:!!state.referenceViewed,mastery:'not_inferred'}});save();render();$('notice').textContent=state.syncDone?'已加入同步队列；发送结果以门户同步状态为准。':'同步队列未保存成功，请下载记录。';break;}}
document.addEventListener('toggle',e=>{if(state.screen==='program'&&e.target.open){state.referenceViewed=true;save();}},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b.dataset.action);});document.addEventListener('submit',e=>{if(e.target.id==='answerForm'){e.preventDefault();assess($('answer').value);}});document.addEventListener('input',e=>{if(e.target.id==='programDraft'){state.program=e.target.value;save();}if(e.target.id==='realRun'){state.realRun=e.target.value;save();}if(e.target.id==='answer'){state.drafts[QUESTIONS[state.q].id]=e.target.value;save();}});$('notesNav').onclick=()=>{if(['quiz','repair'].includes(state.screen))state.assisted[QUESTIONS[state.q].id]=true;action('notebook');};$('recordsNav').onclick=()=>{if(state.screen==='quiz')state.assisted[QUESTIONS[state.q].id]=true;action('records');};render();
})();
</script></body></html>
