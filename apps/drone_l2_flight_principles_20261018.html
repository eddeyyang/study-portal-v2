<script>
'use strict';
const LESSON_BLUEPRINT=Object.freeze({appId:'drone-l2-flight-principles',child:'both',version:'1.0.0',source:'家长上传：L2-1 航空器家族图谱与飞行原理，2026-10-18；原理与史实经一手资料核对',courseDate:null,materialReceivedDate:'2026-10-18',currentGap:'二级课程刚开始；尚无独立掌握证据',observableOutcome:'能按托举方式辨认五家族，并脱离提示解释浮力、机翼和空气的关系',essentialQuestion:'这么重的飞行器，究竟靠什么留在空中？',coreInsight:'先找向上托举的来源，再看飞行器怎样与空气相互作用',realMeaning:'理解无人机旋翼、操控气流和安全常识，辨别背诵口诀的适用边界',compressionPath:'操作气流模型→讲回因果→五家族迁移→遮挡回忆→独立自测→错误定点修复',visibleMechanism:'拖动热度、相对气流、旋翼和上升气流，飞行器、力箭头与说明同步变化',transferProof:'用纸飞机、风筝与无人机新情景解释没有发动机也能滑翔以及悬停的原因',knowledgeMechanism:'同一空气作用模型切换到浮力、机翼、旋翼、扑翼、滑翔和四力视角',primaryInteraction:'可操控SVG飞行场景与因果参数',childAnswerContract:'child-first-v1',childFirstLayerLimit:100,escapePolicy:'repair-once-then-reveal-and-continue',maxBlockingAttempts:2,masteryBoundary:'开放讲回仅记录原话与自查；提示后改对、看答案、自查不算独立掌握；错题需连续两次独立正确才解决',audio:'not-applicable：核心为视觉推演和自述，无音频依赖',surprise:'空气看不见，但飞行器的变化让作用显形',surpriseTrigger:'孩子改变第一个控制量后，同屏出现对应力与运动结果',phases:['teach','guided','recall','independent','repair','transfer'],budgetMinutes:28});
const APP=LESSON_BLUEPRINT.appId,VERSION=LESSON_BLUEPRINT.version,SCHEMA='drone-l2-record-v1';
const DAILY_SURPRISES=['机翼不拍动，也能产生升力。秘密是它与空气的相对运动。','看不见的空气，也能把东西托起来。','纸飞机没有发动机，也能用高度换一段前进的路。','直升机的旋翼，可以看作旋转着的机翼。'];
const NODES=[
{id:'families',title:'先找谁在托举',tag:'两大类 · 五家族',time:3,core:'先问：靠浮力，还是靠机翼与空气作用？找到“谁在托”，家族就不难分。',memory:'两大类：轻于空气、重于空气。五家族：浮空、固定翼、旋翼、扑翼、滑翔。',prompt:'热气球和飞机都能上天，托起它们的主要力量一样吗？',answer:'不一样。热气球主要靠空气浮力；飞机主要靠机翼与空气相对运动产生的升力。',details:['本课件把航空器整理成五个家族。浮空器列在“轻于空气”一类；固定翼、旋翼、扑翼、滑翔列在“重于空气”一类。','轻于空气指整体平均密度低于周围空气，不是说一个大气球没有重量。','滑翔机通常也有固定机翼；这里的五家族是课件的记忆分组，并非严格互斥的唯一分类。'],control:'craft',low:'热气球',high:'固定翼',repair:'先找托举来源。气球靠浮力，机翼靠与空气相互作用。'},
{id:'buoyancy',title:'热空气托起气球',tag:'浮空器家族',time:3,core:'气球里的空气变热，密度变小。同样体积装的空气变轻，浮力足以托起整体时，就能上升。',memory:'热气球、孔明灯：热空气。飞艇：轻气体＋推进装置。',prompt:'热气球通常随风走，飞艇为什么能主动选择航向？',answer:'飞艇有发动机等推进装置和操纵装置，可以主动控制航向；热气球通常随风移动，主要调节高度。',details:['模型保持外界空气与气球体积不变：浮力大致不变，加热使内部空气质量减少，整体重量减小；箭头是定性示意。','热气球通常随风水平移动，并非只在原地上下；飞行员可调高度，利用不同高度的风。','飞艇被课件称为空中巨兽，通常装氦等轻气体；仍受风影响，并非任何时候都能随意飞。','氦气不燃烧；氢气可燃。现代载人飞艇常用氦气，不要自行做点火或充气实验。','孔明灯同样利用热空气，升空后难以控制，有火灾风险，许多地方禁止燃放。','热气球对应孟格菲兄弟（Montgolfier，中文另有蒙哥菲尔等译名）。'],control:'heat',low:'较冷',high:'更热',repair:'分清“托起来”与“主动转向”。浮力负责托举，推进和操纵装置帮助控制航向。'},
{id:'wing',title:'不拍翅膀也能飞',tag:'固定翼家族',time:4,core:'机翼与空气有相对运动，周围气流和压力就会变化，产生升力。机翼形状和迎风角度也重要。',memory:'机翼与空气相对运动 → 空气动力。伯努利：合适条件下，流速较快处静压较低。',prompt:'把机翼固定在风洞里，让空气吹过，它还可能产生升力吗？为什么？',answer:'可能。虽然机翼没向前飞，空气仍在相对机翼运动；合适的形状和迎风角度会使气流与压力变化，产生升力。',details:['上方常见流速较快、静压较低，下方压力相对较高；合起来形成向上的空气动力。实际气流比这个入门示意更复杂。','不是所有机翼都“上凸下平”，也不能说上下气流必须同时到达机翼后缘。','伯努利讲压力与流速的关系；牛顿定律讲力与运动。两者描述同一个飞行过程，不是互相排斥。','固定翼例子：飞行者一号、民航客机、战斗机。不同机型还有各自的翼型和性能。'],control:'wind',low:'没有相对气流',high:'有相对气流',repair:'看的是相对运动。飞机前进或空气吹过机翼，都能让空气相对机翼流动。'},
{id:'rotor',title:'把机翼转起来',tag:'旋翼机家族',time:3,core:'旋翼转动，让空气向下运动；空气也给旋翼向上的力。直升机能垂直起降，还能悬停。',memory:'旋翼向下推空气，空气向上推旋翼。作用与反作用：牛顿第三定律。',prompt:'无人机悬停时没有往前飞，为什么仍能获得向上的力？',answer:'它的旋翼持续旋转，与空气相对运动并把空气向下推动。空气对旋翼的作用产生向上的力，因此不必整个机身往前飞。',details:['悬停时，旋翼产生的总向上力要与重力平衡，还要保持稳定姿态；不是“转得越快越稳”。','竹蜻蜓是中国古代飞行玩具。课件把它视作直升机的雏形；它也利用旋转的翼与空气作用。','作用与反作用大小相等、方向相反，作用在不同物体上：一个作用在空气，一个作用在旋翼。','本页是原理模型，不是实际无人机调参教程；不要把手靠近旋转桨叶。'],control:'rotor',low:'停止',high:'旋转',repair:'机身不前进，不代表机翼不运动。旋翼转动就能与空气发生相对运动。'},
{id:'flap',title:'像鸟一样扇动',tag:'扑翼机家族',time:2,core:'扑翼机模仿鸟拍翅膀。翅膀与空气相互作用，获得升力和向前的推力。',memory:'达芬奇观察鸟 → 设计扑翼飞行器。扑翼靠扇动，与空气相互作用。',prompt:'鸟向下扇动翅膀时，是谁给鸟一个向上的力？',answer:'翅膀对空气施力，空气也对翅膀施力；空气给鸟向上的力。这符合牛顿第三定律。',details:['达芬奇研究鸟翼、画过扑翼飞行器的设计；不能说他已经成功乘着它飞上天。','真实扑翼的角度、扭转与运动很复杂。这里突出“翅膀与空气互相施力”这一关系。','牛顿第三定律也适用于固定翼和旋翼，并非扑翼机独有。'],control:'flap',low:'翅膀上举',high:'向下扇动',repair:'力成对出现。翅膀推空气，空气也推翅膀，两个力作用在不同物体上。'},
{id:'glide',title:'用高度换前进',tag:'滑翔机家族',time:3,core:'不用发动机，也能一边降低高度一边前进。遇到足够强的上升气流，还能飞久一些，甚至升高。',memory:'滑翔用高度换前进；上升气流帮助久飞和爬升。',prompt:'没有上升气流时，纸飞机还能滑翔吗？它通常要付出什么？',answer:'能。它可以一边前进一边降低高度，用高度换取前进；上升气流不是滑翔必须具备的条件。',details:['热气流、山坡气流等可能向上运动，给滑翔机提供“空气电梯”。','风筝靠风流过它产生升力，牵线的拉力也参与平衡。课件称它为“系留式滑翔机”，这是课件分类口径。','古代木鸢故事关联墨子与鲁班；课件的背诵关联为墨子—木鸢（风筝）。','李林塔尔是滑翔先驱，常被称为“滑翔机之父”；“蝙蝠侠”是本课件的记忆昵称。'],control:'thermal',low:'静止空气',high:'强上升气流',repair:'把“能滑翔”和“能越飞越高”分开。下降前进也是滑翔，上升气流帮助维持或增加高度。'},
{id:'forces',title:'读懂四个力',tag:'飞行物理基础',time:4,core:'飞机常讲四种力：升力、重力、推力、阻力。力不平衡时，运动状态会改变。下降不一定是坠落。',memory:'升力向上托，重力向下拉；推力推动，阻力阻碍相对运动。',prompt:'一架飞机正在下降，就能判断它一定要坠毁吗？说一个反例。',answer:'不能。飞机可能在受控下降或滑翔，比如滑翔机能一边下降一边前进，最后安全着陆。',details:['本图只画水平平直飞行时的简化方向：升力与相对来流垂直；重力指向地面；阻力与相对运动方向相反。','水平匀速直线飞行中，升力与重力平衡、推力与阻力平衡。别把这种条件套到所有转弯和爬升。','在简化竖直模型中，向上力小于重力会产生向下加速度；不等于立即向下运动，更不等于一定坠地。','气流就是流动的空气；风是空气流动的一种表现。空气动力来自物体和空气的相互作用。','其他条件相同时，迎风面积越大，阻力通常越大；形状、速度和空气密度也会影响阻力。','飞机主要靠机翼升力托举；它也受空气浮力，只是通常相对很小，不能说完全没有浮力。'],control:'forces',low:'看四力',high:'改变迎风面积',repair:'先区分受控下降和坠落。运动要看全部力和原来的状态，单看“正在下降”不够。'},
{id:'history',title:'给人物找飞行器',tag:'人物 · 关键史实',time:3,core:'把人物连到他研究的飞行器，再记一个关键点。传说和成功飞行要分清。',memory:'墨子木鸢，孟格菲气球；达芬奇扑翼，莱特固定翼，李林塔尔滑翔。',prompt:'莱特兄弟和达芬奇都研究飞行，能把“设计过”说成“成功飞过”吗？',answer:'不能。达芬奇画过扑翼飞行器设计；莱特兄弟在1903年12月17日完成了有动力、可操纵的固定翼飞行。设计与成功实飞是不同证据。',details:['莱特兄弟：1903年12月17日，飞行者一号；第一次飞行12秒、120英尺，约36.6米。课件约36米、常见取整约37米均可。','飞行者一号是有动力、可操纵、重于空气的固定翼飞机。','孟格菲兄弟关联热气球；达芬奇关联模仿鸟类的扑翼设计；李林塔尔关联滑翔试飞。','万户火箭椅属于传说，不能当作已经证实的成功载人飞行；“陶成道”身份也未在本次核实。','古代木鸢关联墨子、鲁班。使用“课件关联词”记忆，不把复杂发明史简化为唯一、无争议的发明人。'],control:'history',low:'人物',high:'贡献',repair:'先分清证据：画过设计不等于成功实飞；传说也不能直接当作确证史实。'}];
const MC=(id,node,prompt,choices,right,why,transfer=false)=>({id,node,prompt,choices,right,why,transfer});
const QUESTIONS=[
MC('q1',0,'热气球主要靠什么被托起来？',['空气浮力','旋转机翼产生的力','发动机向上的喷气'],0,'热气球主要利用空气浮力。'),
MC('q2',0,'按这张课件的记忆分组，哪组都属于重于空气的飞行器？',['飞艇、热气球','固定翼、旋翼、扑翼、滑翔机','孔明灯、滑翔机'],1,'固定翼、旋翼、扑翼、滑翔机列在重于空气一类。'),

function repaintPeopleMatch(){
  const host=document.getElementById('peopleMatcher');
  if(!host)return;
  host.outerHTML=peopleMatchMarkup();
  bindPeopleMatch();
}
function bindPeopleMatch(){
  const host=document.getElementById('peopleMatcher');
  if(!host)return;
  host.querySelectorAll('[data-people-choice]').forEach(button=>button.addEventListener('click',()=>{
    if(peopleMatcherState.checked)return;
    peopleMatcherState.choice=Number(button.dataset.peopleChoice);
    repaintPeopleMatch();
    document.querySelector('[data-people-check]')?.focus({preventScroll:true});
  }));
  host.querySelector('[data-people-check]')?.addEventListener('click',()=>{
    const m=peopleMatcherState;
    if(m.checked||m.choice===null)return;
    m.checked=true;
    state.operations??=[];
    state.operations.push({id:uid(),node:7,action:'people-match',person:PEOPLE_MATCH[m.active].name,choice:PEOPLE_MATCH[m.choice].contribution,matched:m.choice===m.active,assisted:true,at:new Date().toISOString()});
    if(state.operations.length>400)state.operations=state.operations.slice(-400);
    save();
    repaintPeopleMatch();
  });
  host.querySelector('[data-people-retry]')?.addEventListener('click',()=>{
    peopleMatcherState.choice=null;peopleMatcherState.checked=false;repaintPeopleMatch();
  });
  host.querySelector('[data-people-next]')?.addEventListener('click',()=>{
    peopleMatcherState={active:(peopleMatcherState.active+1)%PEOPLE_MATCH.length,choice:null,checked:false};repaintPeopleMatch();
  });
}

function renderRecords(){const wrong=Object.values(state.wrong),ind=state.attempts.filter(a=>a.ok===true&&!a.assisted).length;$('#view').innerHTML=`<section class="panel" data-parent-analysis><span class="eyebrow">${parentMode?'家长测试':'本机学习档案'} · ${child==='kenton'?'Kenton':'Eddey'}</span><h2>看过程，也看提示</h2><p class="muted">只展示当前学习者的数据。操作和完成流程不等于掌握。</p><div class="stats"><div><b>${state.completedNodes.length}/8</b><small>走完学习节点</small></div><div><b>${ind}</b><small>独立答对次数</small></div><div><b>${wrong.filter(w=>w.status!=='resolved').length}</b><small>待复习题</small></div></div><details class="detail"><summary>待复习与已解决的题</summary>${wrong.length?wrong.map(w=>`<div class="history-entry"><b>${safe(QUESTIONS.find(q=>q.id===w.questionId)?.prompt||w.questionId)}</b><p>${w.status==='resolved'?'连续两次独立正确，已解决':'待复习'} · 独立连续正确 ${w.streak} 次</p><p>${safe(w.reason)}</p></div>`).join(''):'<p>尚无错题记录。</p>'}</details><details class="detail"><summary>作答原话与记录（${state.attempts.length} 条）</summary>${state.attempts.slice().sort((a,b)=>b.at.localeCompare(a.at)).map(a=>`<div class="history-entry"><b>${safe(a.question)}</b><p>原答：${safe(a.answer)}</p><p>参考：${safe(a.reference)}</p><p class="muted">${a.ok===true?(a.assisted?'提示后正确':'独立正确'):a.ok===false?'本次错误':a.kind==='teachback'?'讲回自查':'待复看'} · ${safe(a.at.slice(0,10))}</p></div>`).join('')||'<p>还没有作答；不会提前记为学会。</p>'}</details><details class="detail" id="allAnswers"><summary>完整参考答案 · 28 道自测</summary><ol class="reference-list">${QUESTIONS.map((q,i)=>`<li><b>${i+1}. ${q.prompt}</b><p>${q.open?q.answer:q.choices[q.right]+'。'+q.why}</p></li>`).join('')}</ol></details><details class="detail" id="allNotes"><summary>全部学习笔记 · 8 段</summary>${NODES.map((n,i)=>`<article class="history-entry"><h3>${i+1}. ${n.title}</h3><p>${n.core}</p><p>${n.memory}</p>${n.details.map(d=>`<p>${d}</p>`).join('')}</article>`).join('')}</details><div class="record-tools"><h3>带走记录</h3><div class="row"><button id="exportJSON">导出 JSON</button><button id="exportMD">导出可读笔记</button><button id="importButton">导入 JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><p class="muted">导入只接受同一孩子、课程、版本与模式；按记录编号合并，不删除原记录。</p><p id="importStatus" class="status"></p></div>${parentReference()}</section>`;for(const id of ['allAnswers','allNotes'])$('#'+id).addEventListener('toggle',()=>{if($('#'+id).open&&state.quiz&&!state.quiz.done){for(const qid of state.quiz.ids.slice(state.quiz.index))state.quiz.assisted[qid]=true;save();}});$('#exportJSON').onclick=()=>download(JSON.stringify(state,null,2),'application/json',APP+'-'+child+'-records.json');$('#exportMD').onclick=()=>download(markdown(),'text/markdown',APP+'-'+child+'-records.md');$('#importButton').onclick=()=>$('#importFile').click();$('#importFile').onchange=importRecords;}
function parentReference(){return `<details class="detail parent-detail" data-parent-analysis><summary>家长：原讲义差异与核验来源</summary><p>材料：2026-10-18 上传的《L2-1 航空器家族图谱与飞行原理》单页。软件覆盖两大类、五家族、飞行物理、人物速记及知识拓展。未验证官方题库或发证机构，也没有孩子已掌握的预设结论。</p><ul><li>讲义“飞机受到的力→浮力”：飞机主要靠机翼升力，仍受较小空气浮力。自测不把原句作为唯一正确答案。</li><li>“升力小于重力→掉地面”过度简化。运动要看所有力与原状态，下降可控，不等于必坠。</li><li>“上凸下平、上快下慢”不能解释所有机翼。流速与压力口诀有条件，不教“等时到达”错误解释。</li><li>伯努利与牛顿不是互斥；固定翼、旋翼、扑翼都遵守牛顿定律。</li><li>没有上升气流也能滑翔；上升气流帮助延时或爬升。</li><li>“系留式滑翔机”保留为讲义称风筝的口径；通用表述为有牵线的重于空气飞行器。</li><li>热气球通常随风水平移动，可以调节高度；飞艇可主动控制航向，但仍受风影响。</li><li>莱特首飞：12秒、120英尺≈36.6米。约36米或约37米都接受。</li><li>万户火箭椅为传说，不作为确证首飞；“陶成道”身份未核实。“蝙蝠侠”为李林塔尔的课件记忆昵称。</li><li>墨子与鲁班均见于古代木鸢叙述。孟格菲是课件对Montgolfier的译名。达芬奇设计过扑翼飞行器，不等于成功实飞。</li></ul><p>模型只展示定性因果，不是流体计算或真机飞行模拟。开放题的本地关键词检查仅辅助找关系，不能可靠判断所有语义；因此不把开放题自动计为独立掌握。</p><ul class="source-list"><li><a href="https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/four-forces-on-an-airplane/" target="_blank" rel="noopener">NASA：飞机四种力</a></li><li><a href="https://www.grc.nasa.gov/WWW/K-12/WindTunnel/Activities/buoy_Archimedes.html" target="_blank" rel="noopener">NASA：空气浮力</a></li><li><a href="https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/bernoulli-and-newton/" target="_blank" rel="noopener">NASA：伯努利与牛顿</a></li><li><a href="https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/gliders/" target="_blank" rel="noopener">NASA：滑翔机</a></li><li><a href="https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/vector-balance-of-forces-glider/" target="_blank" rel="noopener">NASA：滑翔机受力</a></li><li><a href="https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/four-forces-on-a-kite/" target="_blank" rel="noopener">NASA：风筝与牵线作用</a></li><li><a href="https://www.jpl.nasa.gov/news/nasa-seeks-comments-on-possible-airship-challenge/" target="_blank" rel="noopener">NASA JPL：飞艇与主动航行</a></li><li><a href="https://home.nps.gov/articles/wrightflyer.htm" target="_blank" rel="noopener">美国国家公园管理局：飞行者一号</a></li><li><a href="https://home.nps.gov/articles/idea-of-flight.htm" target="_blank" rel="noopener">美国国家公园管理局：飞行史与热气球</a></li><li><a href="https://blog.sciencemuseum.org.uk/remembering-leonardo-da-vinci/" target="_blank" rel="noopener">英国科学博物馆：达芬奇</a></li><li><a href="https://www.lilienthal-museum.de/Olma/eotto.htm" target="_blank" rel="noopener">李林塔尔博物馆：生平与滑翔研究</a></li><li><a href="https://www.ihchina.cn/art/detail/id/14436.html" target="_blank" rel="noopener">中国非遗网：木鸢与风筝</a></li><li><a href="https://www.grc.nasa.gov/www/k-12/TRC/Rockets/history_of_rockets.html" target="_blank" rel="noopener">NASA：万户火箭椅传说</a></li></ul></details>`;}
function download(content,type,name){const u=URL.createObjectURL(new Blob([content],{type:type+';charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function markdown(){return '# 飞行的秘密 · 学习记录\n\n学习者：'+child+'\n模式：'+(parentMode?'家长测试':'孩子学习')+'\n版本：'+VERSION+'\n累计用时：'+Math.ceil(state.seconds/60)+' 分钟\n\n'+state.attempts.slice().sort((a,b)=>a.at.localeCompare(b.at)).map((a,i)=>'## '+(i+1)+'. '+a.question+'\n\n- 原答：'+a.answer+'\n- 参考：'+a.reference+'\n- 记录：'+(a.ok===true?(a.assisted?'提示后正确':'独立正确'):a.ok===false?'错误':'待复看/自查')+'\n- 时间：'+a.at+'\n').join('\n')+'\n## 下次从这里继续\n\n'+NODES[state.node].title+'；当前页面：'+page+'\n';}
function validRecord(d){return d&&d.schema===SCHEMA&&d.appId===APP&&d.version===VERSION&&d.child===child&&d.mode===state.mode&&Array.isArray(d.attempts)&&d.attempts.length<=10000&&d.attempts.every(a=>a&&typeof a.id==='string'&&typeof a.question==='string'&&typeof a.answer==='string'&&typeof a.reference==='string'&&typeof a.at==='string'&&a.question.length<=2000&&a.answer.length<=2000)&&Array.isArray(d.completedNodes)&&d.completedNodes.every(n=>Number.isInteger(n)&&n>=0&&n<8)&&d.wrong&&typeof d.wrong==='object'&&!Array.isArray(d.wrong)&&Number.isFinite(d.seconds)&&d.seconds>=0;}
async function importRecords(e){const file=e.target.files[0];if(!file)return;try{if(file.size>4000000)throw Error('文件太大，请使用本课程导出的记录');const d=JSON.parse(await file.text());if(!validRecord(d))throw Error('孩子、课程、版本、模式或记录格式不匹配，原记录未改动');const ids=new Set(state.attempts.map(a=>a.id)),fresh=d.attempts.filter(a=>{if(ids.has(a.id))return false;ids.add(a.id);return true;});state.attempts.push(...fresh);state.completedNodes=[...new Set([...state.completedNodes,...d.completedNodes])];state.seconds=Math.max(state.seconds,d.seconds);for(const q of QUESTIONS){const rows=state.attempts.filter(a=>a.questionId===q.id).sort((a,b)=>a.at.localeCompare(b.at));if(!rows.length)continue;let streak=0,had=false,count=0;for(const a of rows){if(a.ok!==true||a.assisted){had=true;streak=0;if(a.ok===false)count++;}else if(had)streak++;}if(had)state.wrong[q.id]={questionId:q.id,node:q.node,firstAt:rows[0].at,lastAt:rows.at(-1).at,status:streak>=2?'resolved':'review',streak,count,reason:NODES[q.node].repair};}save();$('#importStatus').textContent='已合并 '+fresh.length+' 条新记录；原进度与草稿保留。';}catch(err){$('#importStatus').textContent='未导入：'+err.message;}e.target.value='';}
function updateTime(){if(!state)return;const m=Math.floor(state.roundSeconds/60),s=Math.floor(state.roundSeconds%60);$('#timeText').textContent='本轮 '+m+':'+String(s).padStart(2,'0')+' / 30:00 · '+(parentMode?'测试计时':'可随时暂停');}
function pause(atLimit){if(!requireChild())return;clearTimeout(autoTimer);paused=true;save();$('#pauseModal').hidden=false;$('#pauseTitle').textContent=atLimit?'这一轮先休息':'这一段已经保存';$('#pauseText').textContent=atLimit?'本轮已到30分钟，当前位置和草稿都保留。需要继续，由家长另开一轮。':'下次回来，接着当前的位置。同步只发送匿名学习摘要，作答原话留在本机。';$('#resumeButton').textContent=atLimit?'家长：另开一轮，接着学':'继续这一段';$('#syncStatus').textContent='';$('#syncButton').textContent=testMode()?'测试记录仅留本机':'完成并同步';}
function hasQueuedSyncEvent(eventId){try{const rows=JSON.parse(localStorage.getItem('dd:sync:queue:v1')||'[]');return Array.isArray(rows)&&rows.some(row=>row&&row.client_event_id===eventId&&row.kid===child);}catch{return false;}}
async function synchronize(){save();if(testMode()){ $('#syncStatus').textContent='当前是测试环境；正式记录和云端同步未写入。';return;}if(!window.DDLearningSync){$('#syncStatus').textContent='同步模块未加载，记录仍在本机。稍后可再试。';return;}const signature=[state.attempts.length,state.operations.length,state.completedNodes.join(',')].join('|');if(signature===state.lastSyncedSignature&&!state.pendingSyncId){$('#syncStatus').textContent='没有新增学习记录，本次不用重复同步。';return;}const btn=$('#syncButton');btn.disabled=true;try{if(!state.pendingSyncId){state.pendingSyncId=APP+'-'+child+'-'+uid();state.pendingSyncCount=state.attempts.length;state.pendingSyncSignature=signature;const rows=state.attempts.slice(state.lastSyncedCount,state.pendingSyncCount);state.pendingSyncPayload={version:VERSION,completed_nodes:state.completedNodes.slice(),seconds:state.seconds,new_attempt_count:rows.length,independent_correct:rows.filter(a=>a.ok===true&&!a.assisted).length,review_question_ids:Object.values(state.wrong).filter(w=>w.status!=='resolved').map(w=>w.questionId),round:state.round};save();}const alreadyQueued=hasQueuedSyncEvent(state.pendingSyncId);const queued=window.DDLearningSync.complete({client_event_id:state.pendingSyncId,kid:child,subject:'无人机',topic:'L2-1 航空器家族与飞行原理',item:'完成本轮学习，提交匿名摘要',payload:state.pendingSyncPayload});const trackedEvent=queued||alreadyQueued||hasQueuedSyncEvent(state.pendingSyncId);const result=await window.DDLearningSync.flush();if(trackedEvent&&!testMode()&&result?.ok&&!result?.queued){state.lastSyncedCount=state.pendingSyncCount;state.lastSyncedSignature=state.pendingSyncSignature;state.pendingSyncId=null;state.pendingSyncPayload=null;save();$('#syncStatus').textContent='匿名学习摘要已同步。原话仍保留在本机。';}else $('#syncStatus').textContent=trackedEvent?'已进入离线队列，尚未确认云端接收。联网后可继续同步。':'尚未确认本次学习摘要已送达，请稍后再试。原记录保留在本机。';}catch{$('#syncStatus').textContent='同步结果未确认；记录仍在本机，同一记录编号会避免重复。';}finally{btn.disabled=false;}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.identity)chooseIdentity(b.dataset.identity);if(b.dataset.page)setPage(b.dataset.page);if(b.dataset.node!==undefined){state.node=Number(b.dataset.node);state.lessonStage='observe';setPage('learn');}if(b.dataset.modelChoice!==undefined){modelChoice=Number(b.dataset.modelChoice);refreshModel();operation();}if(b.dataset.recallLevel!==undefined){recallLevel=Number(b.dataset.recallLevel);renderRecall();}if(b.dataset.recallIndex!==undefined){state.recall=Number(b.dataset.recallIndex);recallLevel=2;save();renderRecall();}if(b.dataset.answer!==undefined)answerChoice(Number(b.dataset.answer));});
$('#identityButton').onclick=()=>{$('#identityModal').hidden=false;};$('#closeIdentity').onclick=()=>$('#identityModal').hidden=true;$('#pauseButton').onclick=()=>pause(false);$('#resumeButton').onclick=()=>{if(state.roundSeconds>=1800){state.roundSeconds=0;state.round++;}paused=false;lastTick=Date.now();$('#pauseModal').hidden=true;save();render();};$('#pauseHome').onclick=()=>{$('#pauseModal').hidden=true;page='home';save();render();};$('#syncButton').onclick=synchronize;
setInterval(()=>{const now=Date.now();if(state&&!paused&&!document.hidden&&page!=='home'&&page!=='records'){state.seconds+=Math.min(5,(now-lastTick)/1000);state.roundSeconds+=Math.min(5,(now-lastTick)/1000);updateTime();if(state.roundSeconds>=1800)pause(true);else save();}lastTick=now;},5000);
document.addEventListener('visibilitychange',()=>{lastTick=Date.now();clearTimeout(autoTimer);save();});window.addEventListener('pagehide',()=>{clearTimeout(autoTimer);save();});if(incoming)chooseIdentity(incoming);else if(queryTest)chooseIdentity('parent');else renderHome();
</script></body></html>
