function blankReason(id){return {id,kind:'',reason:'',memory:'',sense:'看见',detail:'',feeling:'',sentence:'',revised:'',word:'',paragraph:''}}
function fresh(){return {schema:'place-writer-v1',child:'eddey',appId:'eddey-place-writer',version:1,session:crypto.randomUUID(),startedAt:new Date().toISOString(),step:0,reasonIndex:0,draftIndex:0,place:'',location:'',audience:'同学',reasons:[blankReason('r1'),blankReason('r2')],explanation:'',title:'',opening:'',ending:'',transfer:'',checks:{},reviewNeeded:[],history:[],elapsed:0,completed:false,syncRequested:false,demoChoice:null}}

let lastTick=Date.now(),view='main',repairReturn=0,showGuide=true,demoMessage='';
function valid(s){return !!s&&s.schema==='place-writer-v1'&&s.child==='eddey'&&s.appId==='eddey-place-writer'&&s.version===1&&Number.isInteger(s.step)&&s.step>=0&&s.step<=8&&Array.isArray(s.reasons)&&s.reasons.length>=2&&s.reasons.length<=3&&new Set(s.reasons.map(r=>r.id)).size===s.reasons.length&&s.reasons.every(r=>r&&/^r[123]$/.test(r.id)&&['kind','reason','memory','sense','detail','feeling','sentence','revised','word','paragraph'].every(k=>typeof r[k]==='string'&&r[k].length<=12000))&&['session','startedAt','place','location','audience','explanation','title','opening','ending','transfer'].every(k=>typeof s[k]==='string'&&s[k].length<=12000)&&Number.isInteger(s.reasonIndex)&&s.reasonIndex>=0&&s.reasonIndex<s.reasons.length&&Number.isInteger(s.draftIndex)&&s.draftIndex>=0&&s.draftIndex<s.reasons.length+2&&Array.isArray(s.history)&&s.history.length<=200&&Array.isArray(s.reviewNeeded)&&s.reviewNeeded.every(x=>Number.isInteger(x)&&x>=0&&x<=8)&&!!s.checks&&typeof s.checks==='object'&&!Array.isArray(s.checks)&&Object.entries(s.checks).every(([k,v])=>['place','reasons','details','order','words','ending'].includes(k)&&typeof v==='boolean')&&(!s.paperParts||Array.isArray(s.paperParts)&&s.paperParts.every(i=>Number.isInteger(i)&&i>=0&&i<=4))&&Number.isFinite(s.elapsed)&&s.elapsed>=0&&typeof s.completed==='boolean'&&typeof s.syncRequested==='boolean'}

const names=['看方法','选地方','找理由','补细节','选词句','排顺序','自己写','读一遍','收手记'];
function field(key,label,placeholder='',long=false,value){const val=value===undefined?state[key]:value;return `<label class="field"><span>${esc(label)}</span>${long?`<textarea data-bind="${key}" maxlength="12000" placeholder="${esc(placeholder)}">${esc(val)}</textarea>`:`<input data-bind="${key}" maxlength="160" value="${esc(val)}" placeholder="${esc(placeholder)}">`}</label>`}

function render(){if(view!=='main')return;$('.progress').innerHTML=names.map((n,i)=>`<button class="${i===state.step?'current':i<state.step?'past':''}" data-step="${i}" ${i===state.step?'aria-current="step"':''}>${n}</button>`).join('');const r=state.reasons[state.reasonIndex];let h='';
if(state.step===0){h=`<section class="stage" data-phase="teach"><div class="postcard">${scene()}<div><span class="eyebrow">推荐一个好地方</span><p>让同学读着读着，<br>也想去看看。</p><span class="caption">先玩一分钟，再写自己的。</span></div></div><div class="panel" style="margin-top:18px"><h2>“好”，要说出理由。</h2><p>假设你在推荐一家书店。</p><div class="paper" data-surprise="reason-bridge"><div class="reason">我的理由：这里适合安静看书。</div><div class="bridge"><svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true"><path d="M2 3v15h19m-7-6 7 6-7 6" fill="none" stroke="#bc7354" stroke-width="2"/></svg><div class="detail-slot" id="demoSlot">选一条细节，放到理由下面。</div></div></div><div class="cards"><button data-demo="0" class="chip">只听见轻轻的翻书声。</button><button data-demo="1" class="chip">门口有一个大招牌。</button></div><div id="demoFeedback" aria-live="polite"></div>${field('explanation','你来讲：细节为什么要跟理由有关？','先说给自己听，再记几个字。',true)}<div class="actions"><button data-action="known" class="quiet">我会了，写自己的</button><button data-action="next" class="primary">去找我的好地方 →</button></div></div></section>`}
if(state.step===1){h=`<section class="stage" data-phase="guided"><span class="eyebrow">01 / 回忆一处地方</span><h2>你最想带同学去哪儿？</h2>${primary('先不用想开头怎么写。','去过、记得细节，就有材料。','选一个你能说出两件小事的地方。')}<div class="panel">${field('place','这个地方叫什么？','公园、书店、小镇……也可以是很小的地方。')}${field('location','大概在哪里？','写城市或区域即可，不必写家庭地址。')}<details data-child-detail="secondary"><summary>脑子里暂时没有地方？</summary><p>想想最近一次：你不想离开的地方、玩得投入的地方，或发现新东西的地方。</p><p>闭上眼，先回忆你在那里做过的一件事。能记起具体经过的，通常更好写。</p></details></div>${nav('给它找理由')}</section>`}
if(state.step===2){h=`<section class="stage" data-phase="guided"><span class="eyebrow">02 / 推荐的理由</span><h2>它有什么特别之处？</h2><p class="muted">挑两三个不同的理由。不必每种都写。</p><div class="strip">${state.reasons.map((x,i)=>`<button data-r="${i}" aria-pressed="${i===state.reasonIndex}">理由 ${i+1}</button>`).join('')}${state.reasons.length===2?'<button data-action="addReason">＋ 第三个</button>':''}</div><div class="panel"><div class="label">理由 ${state.reasonIndex+1}</div><div class="cards">${['好看','好玩','好吃','有收获','其他特点'].map(x=>`<button class="chip ${r.kind===x?'selected':''}" data-kind="${x}">${x}</button>`).join('')}</div>${reasonField('reason','你想推荐它的哪一点？',r.kind==='有收获'?'在那里，你发现了什么？':r.kind==='好玩'?'哪个项目或活动，让你特别想再去？':'不要只写“很美”，说出美在什么地方。')}${reasonField('memory','想到的一件小事或一个画面','先记关键词，也可以用输入法里的语音输入。',true)}${state.reasons.length===3?'<button class="quiet small" data-action="removeReason">撤下这条理由（内容保留在备份）</button>':''}<div id="reasonFeedback"></div></div>${nav(state.reasonIndex<state.reasons.length-1?'想下一个理由':'去补细节','reasonNext')}</section>`}
if(state.step===3){h=`<section class="stage" data-phase="guided"><span class="eyebrow">03 / 把画面放大</span><h2>让人看见“${esc(r.kind||'特别')}”在哪。</h2><div class="strip">${state.reasons.map((x,i)=>`<button data-r="${i}" aria-pressed="${i===state.reasonIndex}">理由 ${i+1}</button>`).join('')}</div><div class="paper"><div class="reason">${esc(r.reason||'你的推荐理由还没写，可以回上一步补。')}</div><p class="small muted">你的回忆：${esc(r.memory||'暂时没记')}</p><div class="bridge"><svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true"><path d="M2 3v15h19m-7-6 7 6-7 6" fill="none" stroke="#bc7354" stroke-width="2"/></svg><div class="detail-slot" id="liveDetail">${esc(r.detail||'你补的细节，会接在这个理由下面。')}</div></div></div><div class="panel"><p class="small">挑你真正记得的一种感觉就够了。</p><div class="flex">${['看见','听见','闻到','尝到','碰到','做过'].map(x=>`<button class="small" data-sense="${x}" aria-pressed="${r.sense===x}">${x}</button>`).join('')}</div><p class="note" id="sensePrompt">${sensePrompt(r.sense)}</p>${reasonField('detail','把一个小细节说清楚','它是什么样？怎么动？你做了什么？',true)}${reasonField('feeling','这个细节，为什么让你想推荐它？','它让你感到什么，或发现了什么？',true)}<details data-child-detail="secondary"><summary>老师说“五感”，必须都写吗？</summary><p>不用凑齐。选能说明推荐理由的真实细节。“闻到海风的气息”是嗅觉，真正尝到食物才是味觉。没有经历过的味道不要编。</p></details></div>${nav(state.reasonIndex<state.reasons.length-1?'补下一个理由':'挑一处写得更准','detailNext')}</section>`}
if(state.step===4){h=`<section class="stage" data-phase="guided"><span class="eyebrow">04 / 用自己的好词句</span><h2>先写得准，再写得生动。</h2><div class="strip">${state.reasons.map((x,i)=>`<button data-r="${i}" aria-pressed="${i===state.reasonIndex}">理由 ${i+1}</button>`).join('')}</div><div class="panel"><p class="small muted">你的细节：${esc(r.detail||'还没补细节，可以回去想一想。')}</p>${reasonField('sentence','先用平常的话写一句','把你刚才记的细节，变成自己的话。',true)}<details data-child-detail="secondary" id="wordHelp"><summary>找一个准确的词，或试试比喻</summary><p class="small">先看词的意思。符合当时情况才用。</p><div class="flex">${wordsFor(r).map(([w,def])=>`<button class="word" data-word="${esc(w)}" data-def="${esc(def)}">${w}</button>`).join('')}</div><div id="wordMeaning" class="note">${r.word?esc(r.word):'点一个词，看看它适不适合。'}</div><p>想用比喻？先问“它像什么”，再问“哪里像”。颜色、形状或动作有相似处才贴切。不用比喻也可以写得好。</p></details>${reasonField('revised','现在你来改一句（也可以保留原句）','不自动替换，选你觉得最贴切的说法。',true)}<div id="sentenceCompare" class="paper"><span class="label">我的修改</span><p>${esc(r.sentence||'先写原句。')}</p><p style="color:var(--deep)">${esc(r.revised||'你的新句子会出现在这里。')}</p></div></div>${nav('把理由排一排')}</section>`}
if(state.step===5){h=`<section class="stage" data-phase="recall"><span class="eyebrow">05 / 先搭自己的提纲</span><h2>先写哪一点？</h2><p class="muted">把最想推荐的一点选出来，留更多笔墨。</p><div class="paper"><div class="label">开头 · 地方与位置</div><p>${esc(state.place||'待选地方')} · ${esc(state.location||'待补位置')}</p><div class="label">中间 · 一个理由一段</div>${state.reasons.map((x,i)=>`<div class="order-row"><span class="number">0${i+1}</span><p>${esc(x.reason||'这条理由还没写')}<br><span class="caption">${esc(x.detail||'细节待补')}</span></p><button data-move="${i},-1" aria-label="理由${i+1}上移">↑</button><button data-move="${i},1" aria-label="理由${i+1}下移">↓</button></div>`).join('')}<div class="label" style="margin-top:16px">结尾 · 你的感受与邀请</div><p>用自己的话，邀请同学去看看。</p></div><label class="field"><span>我最想展开的是</span><select id="focusReason">${state.reasons.map((x,i)=>`<option value="${x.id}" ${state.focusReason===x.id?'selected':''}>理由${i+1}：${esc(x.reason||'待补')}</option>`).join('')}</select></label><details data-child-detail="secondary"><summary>看一眼老师的办法</summary><p>整篇：开头说地方和位置；中间分写两三个特点；结尾总结、表达感受、发出邀请。</p><p>每个理由：先概括，再用具体画面或经历说明。先写哪一段，由你决定；同一段里的路线和时间要清楚。</p></details><button data-action="recall" class="subtle">遮住提纲，自己讲一遍</button><div id="recallBox" hidden class="note">不看提示，说说：我推荐哪里？为什么值得去？每个理由能用哪件小事说明？<button data-action="revealOutline" class="quiet">再看提纲</button></div>${nav('开始自己写')}</section>`}
if(state.step===6){const d=draftPart();h=`<section class="stage" data-phase="independent"><span class="eyebrow">06 / 我的正文</span><h2>${esc(d.title)}</h2><div class="strip">${['开头',...state.reasons.map((_,i)=>'理由'+(i+1)),'结尾'].map((x,i)=>`<button data-draft="${i}" aria-pressed="${state.draftIndex===i}">${x}</button>`).join('')}</div><div class="panel"><div class="flex" style="justify-content:space-between"><p class="small">想法在这里，句子由你来写。</p><button class="quiet small" data-action="toggleGuide">${showGuide?'收起':'展开'}提示</button></div><div id="draftGuide" ${showGuide?'':'hidden'} class="note">${esc(d.guide)}</div>${state.draftIndex===0?field('title','给文章起个题目','可以最后再想'):''}<label class="field"><span>${esc(d.label)}</span><textarea id="draftText" maxlength="12000" placeholder="用自己的话慢慢写，不用照着范文。">${esc(d.value)}</textarea></label><p class="caption">可以用键盘或输入法的语音输入。也可以看着提纲写在纸上。</p><details data-child-detail="secondary"><summary>这段该怎样接起来？</summary><p>${esc(d.help)}</p></details><button data-action="paper" class="quiet small">这一段我写在纸上了</button></div>${nav(state.draftIndex<state.reasons.length+1?'写下一段':'读读整篇','draftNext')}</section>`}
if(state.step===7){h=`<section class="stage" data-phase="independent"><span class="eyebrow">07 / 当一次读者</span><h2>同学能明白为什么去吗？</h2><div class="panel"><h3>${esc(state.title||'我的好地方')}</h3><div class="manuscript">${esc(manuscript()||'正文还没有写在这里。如果你写在纸上，就读纸上的文章。')}</div><div class="checks">${[['place','能知道我推荐哪里、它在哪里'],['reasons','两三个理由各有特点，不在重复'],['details','每个理由都有相关的真实细节'],['order','段落有顺序，最重要的地方写得更具体'],['words','词语贴切，读起来通顺'],['ending','结尾表达了我的感受或邀请']].map(([k,t])=>`<label><input type="checkbox" data-check="${k}" ${state.checks[k]?'checked':''}><span>${t}</span></label>`).join('')}</div><button data-action="review" class="primary">帮我找下一处要改的地方</button><div id="reviewFeedback" aria-live="polite"></div><p class="caption">这里按你的自检给提醒，不是老师评分。</p></div>${nav('留下我的手记')}</section>`}
if(state.step===8){h=`<section class="stage" data-phase="transfer"><span class="eyebrow">08 / 带走自己的方法</span><h2>你已经留下了自己的想法。</h2><div class="postcard">${scene()}<div><p>${esc(state.place||'我的好地方')}</p><span>${state.reasons.filter(x=>x.reason.trim()).length} 条推荐理由 · ${state.reasons.filter(x=>x.detail.trim()).length} 处细节</span></div></div><div class="panel" style="margin-top:18px"><h3>下次，这个办法还能用在哪？</h3>${field('transfer','试着推荐一本书或一项活动','自己写：一个推荐理由＋一件能说明它的小事。',true)}<p class="small muted">累了可以下次再想。今天先把作文写好。</p><div class="flex"><button data-action="finish" class="primary">保存今天的手记</button><button data-action="exportMd">导出我的提纲和正文</button></div><div id="finishFeedback" aria-live="polite"></div><details data-parent-analysis><summary>给家长的进度与同步</summary><p>正文、地点和个人回忆仅保留在本机。云端只同步完成步骤、结构自检与待复看项，不上传作文原文。</p><p>有字、有勾选不等于掌握；请看他能否独立说清“理由为什么配这条细节”。</p><button data-action="sync">完成并同步学习摘要</button><div id="syncFeedback"></div></details></div>${nav('回去修改','revise')}</section>`}
$('#stage').innerHTML=h;bind();if(state.step===0&&state.demoChoice!==null)demo(state.demoChoice,false);$('#saveStatus').textContent=(test?'家长测试 · ':'')+(restored?'接着上次的手记写。':'想法会留在这台设备，可以分几次写。');}
function sensePrompt(s){return {看见:'看见什么颜色、形状？它怎样变化？',听见:'什么声音？从哪儿传来？轻还是响？',闻到:'什么气味？靠近哪里时闻到的？',尝到:'你真正吃过什么？入口是什么味道？',碰到:'摸起来是什么感觉？只写安全接触的东西。',做过:'你先做了什么？接着发生了什么？'}[s]||'回忆当时一个小细节。'}
function wordsFor(r){if(r.sense==='听见')return [['低声细语','轻声说话，适合安静交谈。'],['人声鼎沸','人们的声音很嘈杂热闹，不能形容安静。'],['沙沙','可形容树叶摩擦等轻轻的声音。']];if(r.kind==='好吃'||r.sense==='尝到'||r.sense==='闻到')return [['酥脆','一咬容易碎，常形容炸烤食物。'],['清香','清淡、好闻的香气。'],['软糯','柔软、有一点黏，常形容食物口感。']];if(r.kind==='好玩'||r.sense==='做过')return [['小心翼翼','动作很谨慎，生怕出错。'],['迫不及待','急得等不及了。'],['左摇右晃','向两边摇摆，要有真实动作。']];return [['波光粼粼','水面有一片片闪动的光。'],['层层叠叠','一层连着一层，彼此重叠。'],['郁郁葱葱','草木茂盛、充满生机。']];}
function draftPart(){let i=state.draftIndex;if(i===0)return {title:'先告诉大家，推荐哪里。',label:'我的开头',value:state.opening,guide:state.place+' · '+state.location,help:'用一两句话说明地方、位置，或你最想推荐的特点。不必先夸遍祖国风景。'};if(i===state.reasons.length+1)return {title:'用自己的感受收尾。',label:'我的结尾',value:state.ending,guide:'回头想想：你最喜欢它什么？你想邀请同学做什么？',help:'照应开头，写自己的感受或邀请。不必保证每个人都会喜欢。'};let r=state.reasons[i-1];return {title:'让理由 '+i+' 站得住。',label:'这个理由，写成一段',value:r.paragraph,guide:[r.reason,r.detail,r.feeling,r.revised||r.sentence].filter(Boolean).join('\n'),help:'先概括这一点，再写你记得的细节。写景可按看到的先后；写活动可按动作的先后。最后说说它为什么吸引你。'+(state.focusReason===r.id?'这是你最想展开的一点，可以把关键经过再写具体些。':'')}}
function manuscript(){return [state.opening,...state.reasons.map(r=>r.paragraph),state.ending].filter(x=>x.trim()).join('\n\n')}
function demo(i,record=true){state.demoChoice=i;$('#demoSlot').textContent=i===0?'只听见轻轻的翻书声。':'门口有一个大招牌。';$('#demoFeedback').innerHTML=i===0?primary('这条细节能说明“安静”。','轻轻的翻书声，让人听见环境。','换到自己的地方，你会选什么细节？'):primary('招牌大，还不能说明安静。','细节要能解释前面的理由。','试试另一条，看它怎样支持“安静”。');if(record)checkpoint('reason-detail-demo-'+i)}
function go(step){state.step=Math.max(0,Math.min(8,step));view='main';showNotice('');save();render();window.scrollTo({top:0,behavior:'instant'})}
function bind(){document.querySelectorAll('[data-bind]').forEach(el=>el.oninput=()=>{const k=el.dataset.bind;if(k.startsWith('reason.'))state.reasons[state.reasonIndex][k.slice(7)]=el.value;else state[k]=el.value;state.completed=false;state.syncRequested=false;save();if($('#liveDetail'))$('#liveDetail').textContent=state.reasons[state.reasonIndex].detail||'你补的细节，会接在这个理由下面。';if($('#sentenceCompare')){const r=state.reasons[state.reasonIndex];$('#sentenceCompare').innerHTML='<span class="label">我的修改</span><p>'+esc(r.sentence||'先写原句。')+'</p><p style="color:var(--deep)">'+esc(r.revised||'你的新句子会出现在这里。')+'</p>'}});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{state.reasonIndex=+b.dataset.r;save();render()});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{state.reasons[state.reasonIndex].kind=b.dataset.kind;save();render()});document.querySelectorAll('[data-sense]').forEach(b=>b.onclick=()=>{state.reasons[state.reasonIndex].sense=b.dataset.sense;save();render()});document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>demo(+b.dataset.demo));document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const t=b.dataset.word+'：'+b.dataset.def;state.reasons[state.reasonIndex].word=t;$('#wordMeaning').textContent=t+' 你当时的细节符合吗？';save()});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.move.split(',').map(Number),j=i+d;if(j<0||j>=state.reasons.length){showNotice(j<0?'已经在第一条了。':'已经在最后一条了。');return}[state.reasons[i],state.reasons[j]]=[state.reasons[j],state.reasons[i]];checkpoint('reorder-reasons');render()});if($('#focusReason')){$('#focusReason').value=state.focusReason||state.reasons[0].id;state.focusReason=$('#focusReason').value;$('#focusReason').onchange=e=>{state.focusReason=e.target.value;save()}}document.querySelectorAll('[data-draft]').forEach(b=>b.onclick=()=>{state.draftIndex=+b.dataset.draft;save();render()});if($('#draftText'))$('#draftText').oninput=e=>{let i=state.draftIndex;if(i===0)state.opening=e.target.value;else if(i===state.reasons.length+1)state.ending=e.target.value;else state.reasons[i-1].paragraph=e.target.value;state.completed=false;state.syncRequested=false;save()};document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{state.checks[el.dataset.check]=el.checked;save()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));}
function action(a){if(a==='back')return go(state.step-1);if(a==='next')return go(state.step+1);if(a==='known')return go(1);if(a==='help')return repair();if(a==='reasonNext'){const r=state.reasons[state.reasonIndex];if(!r.reason.trim()||!r.memory.trim()){showNotice('可以先记几个关键词。暂时想不出，就点“卡住了”，先留着再想。');return repair()}if(state.reasonIndex<state.reasons.length-1){state.reasonIndex++;save();render()}else{state.reasonIndex=0;go(3)}return}if(a==='detailNext'){if(state.reasonIndex<state.reasons.length-1){state.reasonIndex++;save();render()}else{state.reasonIndex=0;go(4)}return}if(a==='addReason'){state.reasons.push(blankReason(['r1','r2','r3'].find(id=>!state.reasons.some(r=>r.id===id))));state.reasonIndex=2;save();render();return}if(a==='removeReason'){state.history.push({ts:new Date().toISOString(),action:'removed-reason',value:state.reasons[state.reasonIndex]});state.reasons.splice(state.reasonIndex,1);state.reasonIndex=0;state.draftIndex=0;save();render();return}if(a==='recall'){$('.paper').hidden=true;$('#recallBox').hidden=false;return}if(a==='revealOutline'){$('.paper').hidden=false;$('#recallBox').hidden=true;return}if(a==='toggleGuide'){showGuide=!showGuide;render();return}if(a==='draftNext'){checkpoint('draft-part-'+state.draftIndex);if(state.draftIndex<state.reasons.length+1){state.draftIndex++;save();render()}else go(7);return}if(a==='paper'){state.paperParts=state.paperParts||[];if(!state.paperParts.includes(state.draftIndex))state.paperParts.push(state.draftIndex);checkpoint('self-reported-paper-'+state.draftIndex);showNotice('记下了。读一遍时，请拿出纸上的这一段。');return}if(a==='review'){const targets=[['place',1,'先让读者知道地方和位置。'],['reasons',2,'看两条理由有没有重复。各挑一个不同特点。'],['details',3,'挑一条理由，补一件能说明它的小事。'],['order',5,'检查先后顺序，最重要的一点有没有展开。'],['words',4,'读一句不顺的地方，用平常的话重新说一遍。'],['ending',6,'想一句自己的感受或邀请。']];const t=targets.find(x=>!state.checks[x[0]]);$('#reviewFeedback').innerHTML=t?`<div class="feedback">${t[2]}<br><button id="fixTarget">回去改这一处</button></div>`:'<div class="note">你已逐项自检。请再读给家长听，让他指出一处还想追问的地方。</div>';if(t){$('#fixTarget').onclick=()=>{if(t[0]==='ending')state.draftIndex=state.reasons.length+1;go(t[1])}}return}if(a==='revise')return go(6);if(a==='finish'){state.completed=true;checkpoint('saved-work-not-mastery');if(!save()){$('#finishFeedback').textContent='保存失败，请先导出手记备份。';return}$('#finishFeedback').innerHTML='<div class="note">今天的手记已留在本机。还能回去修改。'+(!manuscript()?' 如果正文写在纸上，请把纸一起留好。':'')+'</div>';return}if(a==='exportMd')return download('md');if(a==='sync')return sync();}
function repair(){repairReturn=state.step;view='repair';const guide={0:['细节没接上理由。','能说明理由的细节，才有用。','试着问：读者能从哪里看出来？'],1:['暂时想不起写哪里。','亲自去过，通常更好回忆。','想一想最近不想离开的地方。'],2:['理由还太笼统。','想起一件小事，就能找到特点。','那次，你看了什么或做了什么？'],3:['有理由，还缺一个小画面。','颜色、声音、动作都能帮忙。','只挑当时记得的一种，先说出来。'],4:['想用好词，却不知选哪个。','准确比华丽更重要。','先用平常话说一句，再改一个词。'],5:['不知道先写哪段。','一个理由配一段，更容易看懂。','先把相同理由的细节放在一起。'],6:['有提纲，却接不成一段。','先说特点，再说一件具体的事。','先写第一句，下一句回答“哪里看出”。'],7:['不知道该改哪里。','先看有没有说清推荐的理由。','选一条理由，问它后面有没有细节。'],8:['换了对象，方法想不起来。','推荐书，也要说理由和细节。','想想书里哪件事让你喜欢它。']}[state.step];$('#stage').innerHTML=`<section class="stage panel" data-phase="repair"><span class="eyebrow">停一下，只想这一小步</span><h2>先说出来，就有开头。</h2>${primary(...guide)}<div data-learning-escape="answer-and-continue"><p data-reference-answer>小支架：我推荐的特点 → 我记得的一个细节 → 它为什么吸引我。先填自己的关键词，不用一口气写完整。</p><div class="actions"><button data-return-to-question="true" class="primary" id="returnQuestion">回原处，我再想想</button><button data-continue-after-reveal id="escape">先留着，继续往下</button></div></div></section>`;$('#returnQuestion').onclick=()=>go(repairReturn);$('#escape').onclick=()=>{if(!state.reviewNeeded.includes(repairReturn))state.reviewNeeded.push(repairReturn);checkpoint('help-used-review-needed');go(repairReturn+1)};}
async function sync(){const target=$('#syncFeedback');if(test||DDLearningSync.isTest()){target.textContent='家长测试已隔离，不会上传正式记录。';return}if(state.syncRequested){target.textContent='已加入同步队列，请勿重复提交。联网后会重试。';return}state.completed=true;const id='place-writer:'+state.session+':'+crypto.randomUUID();const accepted=DDLearningSync.complete({kid:'eddey',subject:'语文',topic:'推荐一个好地方',client_event_id:id,item:'保存写作过程；作品质量待家长复看',payload:{appId:state.appId,version:1,reasonCount:state.reasons.filter(r=>r.reason.trim()).length,detailCount:state.reasons.filter(r=>r.detail.trim()).length,writtenParts:[state.opening,...state.reasons.map(r=>r.paragraph),state.ending].filter(x=>x.trim()).length,selfChecks:state.checks,reviewNeeded:state.reviewNeeded,mastery:'not-assessed',elapsed:state.elapsed}});state.syncRequested=accepted;save();target.textContent=accepted?'摘要已加入队列，正在同步。':'未加入队列，请稍后重试。';if(accepted){const r=await DDLearningSync.flush();target.textContent=r.ok?'学习摘要已同步。作文原文仍只在本机。':'摘要仍在本机队列，联网后自动重试。'}}
function exportText(){return '# '+(state.title||'我的好地方推荐手记')+'\n\n地点：'+state.place+'\n位置：'+state.location+'\n\n## 我的提纲\n'+state.reasons.map((r,i)=>'\n'+(i+1)+'. '+r.reason+'\n细节：'+r.detail+'\n感受：'+r.feeling+'\n原句：'+r.sentence+'\n修改：'+r.revised).join('\n')+'\n\n## 我的正文\n\n'+manuscript()+'\n\n## 留待再想\n'+state.reviewNeeded.map(i=>names[i]).join('、')+'\n\n自检是本人勾选；软件未给作文评分或判定掌握。\n'}
function download(type){save();const content=type==='json'?JSON.stringify(state,null,2):exportText();const blob=new Blob([content],{type:type==='json'?'application/json':'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob),filename='Eddey-place-writing-'+day+'.'+type;$('#modal').hidden=false;$('#modalTitle').textContent=type==='json'?'完整手记备份':'带走我的提纲和正文';$('#modalBody').innerHTML='<p>这里都是你自己留下的文字。下载文件，或全选后复制到自己的笔记。</p><label class="field"><span>导出内容</span><textarea id="exportContent" readonly style="min-height:280px"></textarea></label><div class="flex"><a id="exportLink" class="button primary">下载文件</a><button id="selectExport">全选文字</button></div><p class="caption">如果设备没有开始下载，可以全选复制。完整 JSON 备份可在家长页导入。</p>';$('#exportContent').value=content;$('#exportLink').href=url;$('#exportLink').download=filename;$('#selectExport').onclick=()=>{$('#exportContent').focus();$('#exportContent').select()};setTimeout(()=>URL.revokeObjectURL(url),600000)}
function openParent(){$('#modal').hidden=false;$('#modalTitle').textContent='家长 · 写作过程';$('#modalBody').innerHTML=`<div data-parent-analysis><p>本周习作：推荐一个好地方。依据老师黑板、两篇范文和《金牌训练》书30–31页。教材强调特色、推荐缘由和合理表达；老师要求中间写两三个特别之处。</p><p>只教方法和组织本人素材；不生成整篇范文、不自动续写、不把字数当作文分数。</p><div class="note">已留 ${state.reasons.filter(r=>r.reason).length} 条理由；${state.reasons.filter(r=>r.detail).length} 处细节。待复看：${state.reviewNeeded.map(i=>names[i]).join('、')||'暂未标记（不等于掌握）'}。</div><p>建议先用15–25分钟构思，再按孩子实际状态写正文，不设倒计时。问一句：“这个细节为什么能说明你的推荐理由？”</p><p>本课用视觉和文字支架，不设机器朗读。可以先口头说，再用设备输入法输入。没有接入开放式AI批改，最终质量需要家长或老师读作品判断。</p><div class="flex"><button id="jsonOut">完整备份 JSON</button><button id="mdOut">提纲与正文 Markdown</button><button id="reviewOnly">只看待完善处</button></div><label class="field"><span>导入这份软件的备份</span><input type="file" id="importFile" accept=".json,application/json"></label><div id="importStatus" role="status"></div><p class="caption">只接受弟弟这份软件的备份。导入前会保存当前版本，原文不会发往服务器。不同设备需用备份文件转移。</p></div>`;$('#jsonOut').onclick=()=>download('json');$('#mdOut').onclick=()=>download('md');$('#reviewOnly').onclick=()=>{$('#modal').hidden=true;go(state.reviewNeeded[0]??7)};$('#importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024)throw Error('文件太大');const s=JSON.parse(await f.text());if(!valid(s))throw Error('格式、孩子或软件版本不匹配');WriterPrivateStorage.set.call(localStorage,KEY+':before-import',JSON.stringify(state));state=s;state.syncRequested=false;save();view='main';render();$('#importStatus').textContent='导入成功。导入前的版本已留在本机。'}catch(err){$('#importStatus').textContent='没有导入：'+err.message+'。原记录保留。'}}}
$('#parentBtn').onclick=openParent;$('#closeModal').onclick=()=>$('#modal').hidden=true;$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').hidden=true};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').hidden=true});document.addEventListener('visibilitychange',()=>{if(document.hidden)save();lastTick=Date.now()});window.addEventListener('pagehide',save);render();if(test)showNotice('家长测试：这里的操作与弟弟正式手记分开。');
</script></body></html>
