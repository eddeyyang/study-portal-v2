tion":1.1733,"speed":0.9,"listened":false,"contentReview":"pending"},"8ce3f2da":{"text":"listen to the music","lang":"en","file":"unit2-02.mp3","start":6.806,"duration":1.3227,"speed":0.9,"listened":false,"contentReview":"pending"},"e7f75b8b":{"text":"come to life","lang":"en","file":"unit2-02.mp3","start":8.4787,"duration":1.024,"speed":0.9,"listened":false,"contentReview":"pending"},"3f7abce2":{"text":"The school is planning a garden party. The date in the reading is 26 September.","lang":"en","file":"unit2-02.mp3","start":9.8527,"duration":5.056,"speed":0.94,"listened":false,"contentReview":"pending"},"bc706370":{"text":"What will happen on the sports field? There will be traditional games. Children can try Chinese yo-yo, kite-flying, dragon dance and tug of war.","lang":"en","file":"unit2-02.mp3","start":15.2587,"duration":8.8107,"speed":0.94,"listened":false,"contentReview":"pending"},"2fe71c38":{"text":"You can try a game and stamp your card. Then you can get a prize. Come and have a go!","lang":"en","file":"unit2-02.mp3","start":24.4193,"duration":4.7787,"speed":0.94,"listened":false,"contentReview":"pending"},"2f3814cb":{"text":"The invitation ends with a friendly idea: Let's have fun together.","lang":"en","file":"unit2-02.mp3","start":29.548,"duration":4.0747,"speed":0.94,"listened":false,"contentReview":"pending"},"544c81af":{"text":"The children watch Mr Zhong practise kung fu. He introduces changquan. In the lesson, changquan is described as the mother of many kung fu styles.","lang":"en","file":"unit2-02.mp3","start":33.9727,"duration":9.6853,"speed":0.94,"listened":false,"contentReview":"pending"},"d95937c7":{"text":"Mr Zhong talks about twelve kinds of actions. He shows one and asks the children what it looks like. They think of a tree.","lang":"en","file":"unit2-02.mp3","start":44.008,"duration":7.4027,"speed":0.94,"listened":false,"contentReview":"pending"},"2178c927":{"text":"Stand like a pine tree. The children stand straight and strong. A picture in your mind can help you remember the action.","lang":"en","file":"unit2-02.mp3","start":51.7607,"duration":7.2747,"speed":0.94,"listened":false,"contentReview":"pending"},"3d9fe659":{"text":"Sit like a bell. This is another way to use a familiar shape to describe an action. What does this look like? Think before you answer.","lang":"en","file":"unit2-02.mp3","start":59.3853,"duration":7.7227,"speed":0.94,"listened":false,"contentReview":"pending"},"edb549cf":{"text":"Mr Zhong moves as fast as the wind. He explains that he uses all his strength for each action. That is why he moves so fast.","lang":"en","file":"unit2-02.mp3","start":67.458,"duration":8.576,"speed":0.94,"listened":false,"contentReview":"pending"},"c5cebe28":{"text":"The Dragon Dance Club is getting ready for the garden party. Its members are practising together.","lang":"en","file":"unit2-03.mp3","start":0,"duration":5.504,"speed":0.94,"listened":false,"contentReview":"pending"},"a1ffbc17":{"text":"Minmin is at the head of the dragon. He runs too fast. At the tail, Xiaopu calls out, but the others can't keep up with Minmin.","lang":"en","file":"unit2-03.mp3","start":5.854,"duration":8.0213,"speed":0.94,"listened":false,"contentReview":"pending"},"fb1cc1b6":{"text":"Minmin can't hear the call because the music is loud. He runs faster, and the students at the tail lose control of their sticks.","lang":"en","file":"unit2-03.mp3","start":14.2253,"duration":7.7227,"speed":0.94,"listened":false,"contentReview":"pending"},"10d416b1":{"text":"Mr Zhong stops the practice. Everyone needs to work as a team. Minmin should follow the music, and the others should follow him.","lang":"en","file":"unit2-03.mp3","start":22.298,"duration":7.872,"speed":0.94,"listened":false,"contentReview":"pending"},"a1cd12e0":{"text":"They try again and keep the same pace. Now the dragon moves smoothly. Keeping together makes the difference.","lang":"en","file":"unit2-03.mp3","start":30.52,"duration":6.5067,"speed":0.94,"listened":false,"contentReview":"pending"},"b9f6b0f4":{"text":"Start your game introduction with its name. For example: Kite-flying is my favourite traditional game.","lang":"en","file":"unit2-03.mp3","start":37.3767,"duration":6.0587,"speed":0.94,"listened":false,"contentReview":"pending"},"a61d0527":{"text":"Next, explain what you need and how to play. A kite and a windy day are useful for kite-flying. You can run and watch the kite rise.","lang":"en","file":"unit2-03.mp3","start":43.7853,"duration":8.5547,"speed":0.94,"listened":false,"contentReview":"pending"},"3dc1c4ee":{"text":"Finish with a reason and an invitation. You might say that the game is exciting. Invite your friends to have a go.","lang":"en","file":"unit2-03.mp3","start":52.69,"duration":7.0613,"speed":0.94,"listened":false,"contentReview":"pending"},"c307e66e":{"text":"Xiaoming's bird kite is stuck in a tall tree. He cannot get it down.","lang":"en","file":"unit2-03.mp3","start":60.1013,"duration":3.968,"speed":0.94,"listened":false,"contentReview":"pending"},"2163db0f":{"text":"Grandpa uses his Chinese yo-yo to help. It spins fast and makes a whooshing sound.","lang":"en","file":"unit2-03.mp3","start":64.4193,"duration":5.3973,"speed":0.94,"listened":false,"contentReview":"pending"},"9ccb174b":{"text":"The kite is moving. It is falling down. Xiaoming gets his kite back.","lang":"en","file":"unit2-03.mp3","start":70.1667,"duration":4.2667,"speed":0.94,"listened":false,"contentReview":"pending"},"1ce8329d":{"text":"We can work as a team.","lang":"en","file":"unit2-03.mp3","start":74.7833,"duration":1.4507,"speed":0.92,"listened":false,"contentReview":"pending"},"0223bca4":{"text":"There will be traditional games on the sports field.","lang":"en","file":"unit2-03.mp3","start":76.584,"duration":2.6027,"speed":0.92,"listened":false,"contentReview":"pending"},"ec7b031c":{"text":"This is changquan.","lang":"en","file":"unit2-03.mp3","start":79.5367,"duration":1.152,"speed":0.92,"listened":false,"contentReview": function finish(){tick();active=false;state.bookmark.page='finish';const b=state.bookmark,memory=C.kind==='memory',pending=Object.values(state.errors).filter(x=>x.pending).length;show('<section class="practice-card"><div class="part-caption">这一小段，先收好</div><h1>读过，也试着写过</h1><p>'+(memory?'这一组已经走完。错过和纸笔自报的项目会留在“只练待复习”。':'每道题的完整参考答案都可以回看，自己的首答也保留着。')+'</p><p class="support">看过示例、写过一遍，还不能代表独立掌握。</p><button id="sync" class="primary">完成并同步</button><p id="syncStatus" class="support" role="status">原始回答保存在本机；同步只发送学习摘要。</p><details class="scope-list"><summary>回看这次答案</summary>'+(memory?b.queue.map(id=>'<p class="small-record">'+esc(items[id].prompt)+'<br><strong>'+esc(items[id].text)+'</strong></p>').join(''):L.questions.map((q,i)=>'<section class="scope-item"><p>'+esc(q.prompt)+'</p><p lang="en">'+esc(q.model)+'</p><p class="support">'+esc(q.check)+'</p><details><summary>我的回答</summary><p class="small-record">'+esc(state.drafts[L.id+':q'+i]?.text||'没有留下文字回答。')+'</p></details></section>').join(''))+'</details>'+(memory?'<details data-phase="transfer"><summary>给下次的自己留一条提醒</summary><p class="support">从这一组中选最容易错的一项，写清下次怎样检查。</p><textarea id="transfer" class="practice-input" aria-label="给下次的提醒" maxlength="1000">'+esc(state.drafts['transfer:'+b.sessionId]?.text||'')+'</textarea><div class="reference"><strong>写法示例</strong><p>'+esc('“'+items[b.queue[0]].text+'”这一项，我要先盖住原文写一遍，再逐字检查有没有漏写或写错。')+'</p><p class="support">把示例改成你真正需要的提醒。</p></div></details>':'')+'<div class="actions"><button id="home" class="quiet">回去选'+(memory?'组':'课')+'</button><a class="button" href="'+esc(link(memory?C.readingLink:C.memoryLink))+'">'+(memory?'去读课文':'去读写背')+'</a></div></section>');$('#home').onclick=home;$('#sync').onclick=sync;if($('#transfer'))$('#transfer').oninput=e=>{state.drafts['transfer:'+b.sessionId]={text:e.target.value};save();};}
async function sync(){const b=state.bookmark,status=$('#syncStatus');if(test||window.DDLearningSync?.isTest()){status.textContent='试用记录已保存在本机，不上传。';return;}let completion=state.completions[b.sessionId];if(!completion)completion=state.completions[b.sessionId]={id:'reading-practice-'+uid(),ts:now(),synced:false};save();if(completion.synced){status.textContent='这次摘要已经同步。';return;}$('#sync').disabled=true;try{if(!window.DDLearningSync)throw Error('sync unavailable');window.DDLearningSync.setChild(C.child);window.DDLearningSync.complete({client_event_id:completion.id,ts:completion.ts,kid:C.child,subject:C.subject==='english'?'英语':'语文',activity:'session_complete',topic:C.title,item:C.kind==='memory'?'背默练习':'单元阅读',ok:null,source:'apps/'+C.appId+'.html',payload:{schema:C.schema,appId:C.appId,version:C.version,contentRevision:C.revision,lessonId:b.lesson||b.pack,mastery:'pending-independent-verification',summary:{seconds:Math.max(0,state.seconds-(b.startSeconds||0)),totalAttempts:state.runs.filter(r=>r.sessionId===b.sessionId).length,pendingReview:Object.values(state.errors).filter(x=>x.pending).length,independent:0},rawAnswersUploaded:false}});const r=await window.DDLearningSync.flush();completion.synced=!!r?.ok&&!r.queued;status.textContent=completion.synced?'摘要已同步；原始回答仍只在本机。':'本机已保存，联网后继续同步。';save();}catch{status.textContent='本机已经保存；同步暂未完成，可稍后重试。';}finally{$('#sync').disabled=false;}}
function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('#parentButton').onclick=()=>{modal('家长 · 记录与资料','<div data-parent-analysis><p>'+esc(C.source)+'</p><p>'+esc(C.scopeNote)+'</p><p>本机 '+state.runs.length+' 次尝试；本轮累计约 '+Math.floor(round.seconds/60)+' 分钟。看过、纸笔自报、口述与参考后作答不记独立掌握。</p><button id="exportJSON">导出完整 JSON</button> <button id="exportMD">导出可读记录</button><label class="field-label">恢复本软件记录<input id="importJSON" type="file" accept="application/json,.json"></label><p id="importStatus" role="status"></p><details><summary>查看作答</summary><div class="journal-list">'+state.runs.map(r=>'<p><b>'+esc(r.task)+'</b> · '+esc(r.ts)+'</p><p class="small-record">我的回答：'+esc(r.text||'纸笔／口述，未核验')+'<br>参考：'+esc(r.target)+'</p>').join('')+'</div></details><button id="offline">准备离线课程</button><p id="offlineStatus"></p><button id="newRound">休息好了，另开一轮</button></div>');$('#exportJSON').onclick=()=>download(JSON.stringify(state,null,2),C.appId+'-'+today()+'.json','application/json');$('#exportMD').onclick=()=>download('# '+C.title+'\n\n'+C.child+' · '+mode+'\n\n'+state.runs.map(r=>'## '+r.task+'\n\n'+r.ts+'\n\n我的回答：'+(r.text||'纸笔／口述，未核验')+'\n\n参考：'+r.target+'\n\n状态：'+(r.correct===true?'本次比对正确，独立掌握待核':'待复习')+'\n').join('\n'),C.appId+'-'+today()+'.md','text/markdown');$('#importJSON').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>8000000)throw Error('too large');const imported=JSON.parse(await file.text());if(!valid(imported))throw Error('wrong identity');const merged=new Map(state.runs.map(x=>[x.id,x]));for(const r of imported.runs)if(!merged.has(r.id))merged.set(r.id,r);state.runs=[...merged.values()];state.seconds=Math.max(state.seconds,imported.seconds);for(const [id,error] of Object.entries(imported.errors))if(items[id]&&object(error)&&error.pending)state.errors[id]=error;save();$('#importStatus').textContent='已合并作答历史，原记录和当前进度保留。';}catch{$('#importStatus').textContent='文件不属于这个孩子、本软件或当前模式，或格式无效。原记录没有改变。';}};$('#offline').onclick=e=>window.prepareTravelMath?.(e.currentTarget,$('#offlineStatus'));$('#newRound').onclick=()=>{newRound('parent-new-round');close();};};
function newRound(reason){round.rounds.push({seconds:round.seconds,startedAt:round.startedAt,endedAt:now(),reason});round.seconds=0;round.startedAt=now();save();}
function tick(){const t=Date.now(),delta=Math.min(3,Math.max(0,(t-lastTick)/1000));lastTick=t;if(!active||document.hidden||$('#dialog').open)return;if(round.day!==today()){round.rounds.push({day:round.day,seconds:round.seconds,startedAt:round.startedAt,endedAt:now(),reason:'new-day'});round.day=today();round.seconds=0;round.startedAt=now();}const latest=get(ROUNDKEY);if(latest?.day===round.day&&num(latest.seconds))round.seconds=Math.max(round.seconds,latest.seconds);round.seconds+=delta;state.seconds+=delta;save();if(round.seconds>=routeLimit*60){active=false;modal('这段时间先休息','<p>作答已经存好。休息一下，等眼睛舒服了再接着学。</p><button class="primary" id="rested">休息好了，接着学</button><button id="finishRest" class="quiet">回去选课</button>');$('#rested').onclick=()=>{newRound('resumed-after-rest');close();};$('#finishRest').onclick=()=>{close();home();};}}
setInterval(tick,2000);document.addEventListener('visibilitychange',()=>{clearAuto();stopAudio();lastTick=Date.now();});window.addEventListener('pagehide',()=>{tick();stopAudio();save();});
try{const b=state.bookmark;if(C.kind==='reading'&&Q.get('lesson')&&Q.get('lesson')!==b.lesson)startReading(Q.get('lesson'));else if(b.page==='memory'&&Array.isArray(b.queue)&&b.queue.every(id=>items[id])&&Number.isInteger(b.index)&&b.index>=0&&b.index<b.queue.length)memory();else if((b.page==='reading'||b.page==='finish')&&C.kind==='reading'&&(L=C.lessons.find(l=>l.id===b.lesson))){if(b.page==='finish')finish();else if(b.phase==='guided')model();else if(b.phase==='independent')question();else reading();}else if(b.page==='finish'&&C.kind==='memory'&&Array.isArray(b.queue)&&b.queue.every(id=>items[id]))finish();else home();}catch{home();}
})();
</script></body></html>
