function checkLine(ids){if(ids.length!==4)return {ok:false,kind:'count',text:'先选满四个词。再点一下已选的词，可以取消。'};if(!isStraight(ids))return {ok:false,kind:'position',text:'先看位置：这四个词没有落在同一条直线上。声音相同，也不能拐弯连。'};const gs=ids.map(soundOf);if(gs.includes('?'))return {ok:null,kind:'bow',text:'这条线含 bow。先核对它在课本里是“鞠躬”还是“蝴蝶结／弓”。没有语境，就暂时保留这条线。'};if(new Set(gs).size!==1){const pairs=ids.map(i=>words[i].id+' '+groups.find(g=>g.id===soundOf(i)).ipa);return {ok:false,kind:'sound',text:'位置是一条直线，但声音不全一样：'+pairs.join('；')+'。'};}return {ok:true,kind:'correct',text:'这四个划线部分都读 '+groups.find(g=>g.id===gs[0]).ipa+'，也在一条直线上。'};}
