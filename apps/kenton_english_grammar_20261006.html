<script>window.DDLearningSyncConfig={manualOnly:true};</script><script src="../assets/learning-sync.js"></script><script>const CHILD='kenton',NAME='哥哥',APP_ID='kenton_english_grammar_20261006',VERSION=2;const DATA={"courses":{"kenton":[{"id":"looks","title":"谁决定加不加 s","pages":"28–29","quote":"This one looks like an ice cream cone.","ink":"单数加 s；复数不加 s","rule":"一般现在时：第三人称单数 + looks like；I / you / 复数 + look like。","cue":"先看主语，再决定 look 的样子。","states":[{"label":"一片叶子","parts":["The leaf","looks like","a heart."],"why":"leaf 是单数，look 加 s。"},{"label":"几片叶子","parts":["The leaves","look like","hearts."],"why":"leaves 变复数，look 不加 s。"},{"label":"我","parts":["I","look like","my dad."],"why":"I 虽然是一人，也用 look。"}],"checks":[{"prompt":"The flower ___ like a star.","answers":["looks"],"why":"The flower 是第三人称单数。"},{"prompt":"The leaves ___ like little birds.","answers":["look"],"why":"leaves 是复数，不能加 s。"}],"transfer":{"prompt":"用 look like 写“这些云看起来像羊”。","answers":["These clouds look like sheep","The clouds look like sheep"],"why":"复数 clouds 配 look；sheep 单复数同形。"},"note":"原页圈出 This one／looks 与 The leaves／look；补充 I／you 是为了防止把“一个就加 s”当成通用规则。"},{"id":"does","title":"does 来，动词还原","pages":"20","quote":"What does this look like?","ink":"does 后原形","rule":"一般现在时问句：What + does + 第三人称单数 + 动词原形…？复数用 do。","cue":"问句里的 s，由 does 承担。","states":[{"label":"先陈述","parts":["This","looks like","a tree."],"why":"陈述句里 this 配 looks。"},{"label":"再提问","parts":["What","does","this","look like?"],"why":"does 已经变化，look 回原形。"},{"label":"换成复数","parts":["What","do","these","look like?"],"why":"these 是复数，助动词用 do。"}],"checks":[{"prompt":"What does it ___ like?","answers":["look"],"why":"does 后的动词要用原形。"},{"prompt":"What ___ these leaves look like?","answers":["do"],"why":"these leaves 是复数。"}],"transfer":{"prompt":"把 It looks like a bell. 改为“它看起来像什么？”","answers":["What does it look like"],"why":"What + does + it + look like？"},"note":""},{"id":"has","title":"它有，还是它的","pages":"27–28","quote":"It has a stem and many leaves.","ink":"It has＝它有；Its＝它的","rule":"It has + 东西；Its + 名词。I / you / we / they 用 have。","cue":"has 说拥有；its 后面要接东西名。","states":[{"label":"它有","parts":["It","has","a long stem."],"why":"It has 是“它有”。"},{"label":"它的","parts":["Its stem","is","long."],"why":"Its stem 是“它的茎”。"},{"label":"它们有","parts":["They","have","long stems."],"why":"They 是复数，has 换成 have。"}],"checks":[{"prompt":"___ roots are in the soil.（它的）","answers":["Its"],"why":"Its 后面接 roots，表示所属。"},{"prompt":"These plants ___ strong roots.","answers":["have"],"why":"plants 是复数，用 have。"}],"transfer":{"prompt":"用 has 写“这株植物有大叶子”。","answers":["This plant has big leaves","The plant has big leaves"],"why":"This plant 是单数，配 has。"},"note":""},{"id":"nouns","title":"一片叶子到很多片","pages":"26–28","quote":"That plant has special leaves, like a mouth with many teeth!","ink":"leaf → leaves；many teeth","rule":"本页要记：leaf → leaves；tooth → teeth。many 后接可数名词复数。","cue":"数一数，再选名词的形状。","states":[{"label":"一片","parts":["one","leaf"],"why":"one 后用单数 leaf。"},{"label":"很多片","parts":["many","leaves"],"why":"leaf 的复数把 f 变为 ves。"},{"label":"很多颗","parts":["many","teeth"],"why":"tooth 的复数是 teeth。"}],"checks":[{"prompt":"one leaf → two ___","answers":["leaves"],"why":"本词的复数是 leaves，不是 leafs。"},{"prompt":"a mouth with many ___（牙齿）","answers":["teeth"],"why":"many 后用 tooth 的复数 teeth。"}],"transfer":{"prompt":"写出“这株植物有许多叶子”。","answers":["This plant has many leaves","The plant has many leaves"],"why":"主语单数用 has；many 后用 leaves。"},"note":""},{"id":"compare","title":"更容易，怎样变","pages":"15、22–23","quote":"With your help, it becomes easier!","ink":"easy → easier；even faster","rule":"比较级：tall→taller，nice→nicer，big→bigger，easy→easier；beautiful→more beautiful；good→better（最好 best）。even 可修饰比较级。","cue":"先看词形，再决定怎样表示“更”。","states":[{"label":"一般加 er","parts":["tall","→","taller"],"why":"一般加 er；fast 也变 faster。"},{"label":"辅音加 y","parts":["easy","→","easier"],"why":"辅音字母 + y：变 y 为 i，再加 er。"},{"label":"重读短词","parts":["big","→","bigger"],"why":"big：双写末尾 g，再加 er。"},{"la function question(){const c=unit(),q=currentQuestion(),key=qKey();$('stageRoot').innerHTML=(state.pos.phase==='transfer'?'<section data-phase="transfer">':'<section data-phase="independent">')+`<p class="tag">${key==='transfer'?'换个场景，自己写句子':'收起规则，自己试'} <span class="small">${key==='transfer'?'最后一步':`${state.pos.q+1} / ${c.checks.length}`}</span></p><p class="prompt">${esc(q.prompt)}</p><form id="answerForm"><label for="answer" class="small">写你的答案</label><input class="answer" id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(state.pos.drafts[key]||'')}"><p class="small">大小写、句末标点和多余空格不影响判断。</p><div id="feedback" aria-live="polite"></div><div class="actions"><button type="button" id="hint">看规则</button><button class="primary" type="submit" id="submitAnswer">检查答案</button></div></form><div class="actions"><button class="plain" id="needReference">想法不同？对照参考再继续</button></div></section>`;$('answer').oninput=()=>{state.pos.drafts[key]=$('answer').value;save()};$('answerForm').onsubmit=e=>{e.preventDefault();grade()};$('hint').onclick=()=>{state.pos.assisted[key]=true;save();show('再看这条规则',`<div class="rule-sheet"><p class="ruletext">${esc(c.rule)}</p></div><p>${esc(c.cue)}</p><p class="small">本题会保留“看过提示”的记录。</p>`)};$('needReference').onclick=()=>{state.pos.assisted[key]=true;state.pos.repairFrom=state.pos.phase;state.pos.repairKey=key;state.pos.tries[key]=Math.max(2,state.pos.tries[key]||0);event('manual_review_requested',{question:key,answer:state.pos.drafts[key]||'',evidence:'needs_review'});move('repair')}}
function grade(){const c=unit(),q=currentQuestion(),key=qKey(),value=$('answer').value;if(!value.trim()){$('feedback').innerHTML='<p class="feedback bad">先写一个答案；不会时可以看规则。</p>';return}state.pos.drafts[key]=value;const ok=q.answers.some(a=>norm(a)===norm(value)),assisted=!!state.pos.assisted[key]||!!state.pos.tries[key],mid=c.id+':'+key;event('answer',{question:key,prompt:q.prompt,answer:value,expected:q.answers[0],correct:ok?true:key==='transfer'?null:false,evidence:ok?(assisted?'with_help':'independent'):key==='transfer'?'needs_review':'incorrect'});if(!ok){state.pos.tries[key]=(state.pos.tries[key]||0)+1;state.pos.assisted[key]=true;state.mistakes[mid]={unit:c.id,question:key,prompt:q.prompt,last:new Date().toISOString(),streak:0,run:state.pos.run,reviewNeeded:true};state.pos.repairFrom=state.pos.phase;state.pos.repairKey=key;move('repair');return}if(state.mistakes[mid]&&!assisted&&state.mistakes[mid].run!==state.pos.run){let m=state.mistakes[mid];m.streak++;m.run=state.pos.run;m.last=new Date().toISOString();m.reviewNeeded=m.streak<2;save()}$('feedback').innerHTML=`<div class="feedback"><b>${assisted?'提示后改对了':'这题独立完成了'}</b><p>${esc(q.why)}</p></div>`;$('submitAnswer').type='button';$('submitAnswer').textContent=key==='transfer'?'看本组结果 →':'继续下一题 →';$('submitAnswer').onclick=nextQuestion;$('answer').readOnly=true;$('hint').disabled=true;$('answerForm').onsubmit=e=>{e.preventDefault();nextQuestion()}}
function repair(){const c=unit(),key=state.pos.repairKey,from=state.pos.repairFrom,q=key==='transfer'?c.transfer:c.checks[+key],full=(state.pos.tries[key]||0)>=2;$('stageRoot').innerHTML=`<section data-phase="repair"><p class="tag">${key==='transfer'?'对照结构，核对你的表达':'只修这一个地方'}</p><div class="repair" data-child-explanation="primary"><p data-child-part="gap">${key==='transfer'?'这句表达暂未自动确认。':esc(c.cue)}</p><p data-child-part="reason">${esc(q.why)}</p><p data-child-part="check">回到刚才的句子，再试一次。</p></div><p class="small">刚才写的是：${esc(state.pos.drafts[key]||'还没有作答')}</p>${full?`<div class="feedback bad" data-learning-escape="answer-and-continue"><p class="small">对照完整参考，不用反复猜词。</p><p class="ref" data-reference-answer>${esc(q.answers[0])}</p><p class="small">意思相近的其他表达可交家长复看。本题先记待复习。</p><button data-continue-after-reveal id="continueReview">记为待复习，继续 →</button></div>`:''}<div class="actions"><button class="primary" data-return-to-question="original" id="retry">回到原题再改</button><button id="repairRule">再看结构</button></div></section>`;$('retry').onclick=()=>move(from);$('repairRule').onclick=()=>show('把结构接起来',`<p class="ruletext">${esc(c.rule)}</p><p class="ref">${esc(c.states[0].parts.join(' '))}</p>`);if(full)$('continueReview').onclick=()=>{event('continued_after_reference',{question:key,answer:state.pos.drafts[key]||'',expected:q.answers[0],evidence:'needs_review'});state.pos.phase=from;nextQuestion()}}
function nextQuestion(){if(state.pos.phase==='transfer'){complete();return}state.pos.q++;if(state.pos.q>=unit().checks.length)move('transfer');else move('independent')}
function complete(){const c=unit(),events=state.events.filter(e=>e.run===state.pos.run&&e.kind==='answer'),keys=c.checks.map((_,i)=>String(i)).concat('transfer'),independent=keys.every(k=>events.some(e=>e.question===k&&e.correct&&e.evidence==='independent'))&&!keys.some(k=>state.pos.assisted[k]);if(!state.events.some(e=>e.run===state.pos.run&&e.kind==='unit_complete'))event('unit_complete',{evidence:independent?'independent':'with_help'});move('result')}
function result(){const c=unit(),e=state.events.filter(e=>e.unit===c.id&&e.kind==='unit_complete').at(-1),ok=e?.evidence==='independent',delayed=ok&&state.events.some(x=>x.unit===c.id&&x.kind==='unit_complete'&&x.evidence==='independent'&&x.day!==today());$('stageRoot').innerHTML=`<section><p class="tag">这一组练习结束</p><h2>${ok?'规则已经用进新句子了':'改对的地方，下次再独立试'}</h2><div class="rule-sheet"><p class="ruletext">${esc(c.rule)}</p></div><p class="feedback">${ok?(delayed?'你在不同日期完成了无提示书面检查。':'本轮补空和换句都无提示完成。下次再来检查是否记牢。'):'本轮有提示或参考答案，已保留复习位置。'}</p><p class="small">能否把规则讲清楚，还可以请家长听一次。</p><div class="actions"><button id="again">再来一轮</button><button class="primary" id="nextUnit">${COURSE.indexOf(c)<COURSE.length-1?'下一个重点 →':'查看所有重点'}</button></div><button class="plain" id="finishSession">这一轮到这里</button></section>`;$('again').onclick=startCheck;$('nextUnit').onclick=()=>{const i=COURSE.indexOf(c);if(i<COURSE.length-1)selectUnit(COURSE[i+1].id);else catalog()};$('finishSession').onclick=()=>{paused=true;parentPanel();renderHeader()}}
function show(title,html){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;if(!$('dialog').open)$('dialog').showModal()}
function catalog(){show('选择书上一个重点',`<p class="small">每次选 2–3 组；可随时停，进度自动保存。</p>${COURSE.map((c,i)=>`<button class="catalog" data-unit="${c.id}"><span class="num">${String(i+1).padStart(2,'0')}</span><span><b>${esc(c.title)}</b><small>P${esc(c.pages)} · ${esc(status(c.id))}</small></span><span class="arrow">›</span></button>`).join('')}<button id="phrases" class="plain">查书上固定短语</button>`);document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{$('dialog').close();selectUnit(b.dataset.unit)});$('phrases').onclick=phrasePanel}
function phrasePanel(){show('书上另外划出的词和短语',`<p class="small">这些是固定表达。重点语法仍在“变形台”练。</p>${PHRASES.map(([p,en,zh])=>`<div class="parent-row"><span class="label">P${esc(p)}</span><p class="ref">${esc(en)}</p><details><summary>收起意思，先回忆</summary><p>${esc(zh)}</p></details></div>`).join('')}`)}
function sourcePanel(){const c=unit();show('书上划了什么',`<div class="source-strip"><div class="source-tag">课本<strong>${esc(c.pages.split('、')[0])}</strong></div><div class="source-line"><u>${esc(c.quote)}</u></div></div><h3>原页的短注</h3><p class="ruletext">${esc(c.ink)}</p><h3>这条怎么记</h3><p>${esc(c.rule)}</p><p class="small">${esc(c.note||'语法条件按教材及对应教辅解释；变形台和换题练习使用改编例句。')}</p><details data-parent-analysis><summary>出处与范围</summary><p class="small">${CHILD==='kenton'?'哥哥英语课本-整页精简标注版.pdf（18 页；课本 P14–29，含两张朗读纸）':'弟弟英语_p15-27_重点与课堂笔记.pdf（13 页）'}。保留书上页码定位，不公开私人整页扫描。</p></details>`)}
function download(ext){const text=ext==='json'?JSON.stringify(state,null,2):`# ${NAME}的语法学习记录\n\n模式：${TEST?'家长测试':'正式学习'}\n累计：${Math.floor(state.seconds/60)}分钟\n\n`+COURSE.map(c=>`## ${c.title}（P${c.pages}）\n规则：${c.rule}\n状态：${status(c.id)}\n`+state.events.filter(e=>e.unit===c.id&&e.kind==='answer').map(e=>`- ${e.at.slice(0,10)} ${e.prompt} → ${e.answer} / ${e.evidence==='independent'?'无提示正确':e.evidence==='with_help'?'提示后正确':'待修复'}`).join('\n')).join('\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:ext==='json'?'application/json':'text/markdown;charset=utf-8'}));a.download=`${NAME}_语法记录.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function parentPanel(){if(['independent','transfer','repair'].includes(state.pos.phase)){state.pos.assisted[state.pos.phase==='repair'?state.pos.repairKey:qKey()]=true;save()}const c=unit(),wrong=Object.values(state.mistakes).filter(m=>m.reviewNeeded),done=new Set(state.events.filter(e=>e.kind==='unit_complete'&&e.evidence==='independent').map(e=>e.unit));show('家长 · 规则考察与接续',`<div data-parent-analysis><p class="small">本页考察的是划线语法，不要求背整篇课文。一次选 2–3 组：背结构 → 说条件 → 换句用。</p><div class="summary-grid"><div><b>${done.size} / ${COURSE.length}</b><span class="small">无提示书面通过记录</span></div><div><b>${wrong.length}</b><span class="small">仍待复练的错点</span></div></div><h3>当前重点：${esc(c.title)}</h3><p>请孩子说出：${esc(c.cue)}</p><p><b>核对规则：</b>${esc(c.rule)}</p><p><b>再问一句：</b>${esc(c.transfer.prompt)}</p><details><summary>家长参考答案</summary><p class="ref">${esc(c.transfer.answers[0])}</p><p>${esc(c.transfer.why)}</p></details><label><input type="checkbox" id="observed">我已亲自听到孩子讲规则并核对</label><label><input type="checkbox" id="oralHint">过程中给过提示</label><button id="oralRecord">记录本次口头考察</button><p id="oralStatus" class="small"></p><h3>按书上页码抽查</h3><table class="coverage"><thead><tr><th>重点</th><th>本机记录</th></tr></thead><tbody>${COURSE.map(c=>`<tr><td>P${esc(c.pages)}<br>${esc(c.title)}</td><td>${esc(status(c.id))}</td></tr>`).join('')}</tbody></table><h3>复练与保存</h3><div class="actions"><button id="review">从待复习处开始</button><button id="exportJson">导出记录</button></div><div class="actions"><button id="exportMd">导出可读清单</button><button id="sync">完成并同步</button></div><p class="small">刷新会接着当前步骤。错点保留历史；两个回合无提示答对后移出待复习；原题复查不等于掌握所有变式。</p><label class="small" for="importFile">导入本软件、同孩子、同模式的记录</label><input id="importFile" type="file" accept="application/json,.json"><p id="dataStatus" class="small" role="status"></p><details><summary>本次任务范围与数据说明</summary><p class="small">语法结构通过视觉变化、遮挡记忆和书面练习学习。本版不含发音课和听写。口头背规则由家长核对，软件不会声称自动听懂。${TEST?'现在是家长测试模式，不上传正式成绩。':'只有明确点“完成并同步”才发送当前学习摘要。'}已学习、提示后完成、独立作答和跨日复验分别保留。</p></details></div>`);$('oralRecord').onclick=()=>{if(!$('observed').checked){$('oralStatus').textContent='请先亲自听孩子说规则，并勾选已核对。';return}const helped=$('oralHint').checked,old=state.oral.some(o=>o.unit===c.id&&!o.helped&&o.day!==today());state.oral.push({id:uid(),at:new Date().toISOString(),day:today(),unit:c.id,helped,evidence:helped?'with_help':old?'delayed_independent':'independent_now',observer:'parent'});save();$('oralStatus').textContent=helped?'已记为提示后说清。':old?'已记为隔日无提示说清。':'已记为当场无提示说清；改天再抽查。';$('oralRecord').disabled=true};$('exportJson').onclick=()=>download('json');$('exportMd').onclick=()=>download('md');$('review').onclick=()=>{const target=wrong[0];if(!target){$('dataStatus').textContent='目前没有待复习错点，可以选择未练重点或隔日复测。';return}$('dialog').close();selectUnit(target.unit);startCheck()};$('importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>5e6)throw Error('文件过大。');const r=JSON.parse(await f.text());if(!valid(r))throw Error('孩子、软件、模式或数据格式不匹配，原记录没有改变。');const ids=new Set(state.events.map(e=>e.id));state.events.push(...r.events.filter(e=>!ids.has(e.id)));const oralIds=new Set(state.oral.map(e=>e.id));state.oral.push(...r.oral.filter(e=>!oralIds.has(e.id)));state.seconds=Math.max(state.seconds,r.seconds);for(const[k,v]of Object.entries(r.mistakes)){if(v&&COURSE.some(c=>c.id===v.unit)&&typeof v.question==='string'&&typeof v.last==='string'&&Number.isInteger(v.streak)&&v.streak>=0&&(!state.mistakes[k]||v.last>state.mistakes[k].last))state.mistakes[k]=v}save();$('dataStatus').textContent='已合并记录，保留原有历史。'}catch(e){$('dataStatus').textContent=e.message}};$('sync').onclick=sync}
async function sync(){if(TEST||!window.DDLearningSync){$('dataStatus').textContent='测试或离线模式不上传；可以导出记录保存。';return}if(!state.events.some(e=>e.kind==='answer')){$('dataStatus').textContent='还没有本次作答记录需要同步。';return}const S=window.DDLearningSync;S.setChild(CHILD);const sent=S.complete({kid:CHILD,subject:'英语',topic:'课本划线语法记忆与运用',source:`apps/${APP_ID}.html`,client_event_id:`grammar-summary-${CHILD}-${state.events.at(-1).id}`,payload:{appId:APP_ID,version:VERSION,duration_seconds:state.seconds,attemptCount:state.events.filter(e=>e.kind==='answer').length,independentCount:state.events.filter(e=>e.kind==='answer'&&e.evidence==='independent').length,review: Object.values(state.mistakes).filter(m=>m.reviewNeeded).map(m=>({unit:m.unit,question:m.question})),oral:state.oral.map(({unit,day,evidence})=>({unit,day,evidence}))}});$('dataStatus').textContent=sent?'已加入同步队列，正在确认。':'没有新摘要需要同步。';if(sent){try{const r=await S.flush();$('dataStatus').textContent=r?.ok&&!r.pending?'学习摘要已同步。':'同步尚未确认，记录仍在本机，稍后会重试。'}catch{$('dataStatus').textContent='网络暂不可用，记录已保留。'}}}
$('close').onclick=()=>$('dialog').close();$('catalog').onclick=catalog;$('parent').onclick=parentPanel;$('source').onclick=()=>{if(['independent','transfer'].includes(state.pos.phase)){state.pos.assisted[qKey()]=true;save()}sourcePanel()};document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(['independent','transfer','repair'].includes(state.pos.phase)&&b.dataset.nav!=='independent'){state.pos.assisted[state.pos.phase==='repair'?state.pos.repairKey:qKey()]=true;save()}if(b.dataset.nav==='independent')startCheck();else move(b.dataset.nav)});$('pause').onclick=()=>{paused=!paused;renderHeader();if(paused)show('先休息，进度已留好','<div class="pause-card">回来后点“继续学习”，接着刚才的重点。</div>');else $('dialog').close();save()};document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;save()}else renderHeader()});window.addEventListener('pagehide',save);setInterval(()=>{if(!paused&&!document.hidden&&!$('dialog').open){state.seconds++;sessionSeconds++;if(sessionSeconds===1500){paused=true;renderHeader();show('这一轮可以停一停','<p>已经连续练了约 25 分钟。休息一下，进度会保留。</p>')}if(state.seconds%10===0)save()}$('time').textContent=`本次 ${Math.floor(sessionSeconds/60)} 分钟`},1000);
const DAILY_SURPRISES=['换一个主语，看看哪个词先动。','把规则盖住，还能说出后面接什么吗？','今天挑一个“为什么”，讲给家长听。'];const dailySurpriseKey=APP_ID+'|'+CHILD+'|'+today();$('daily').textContent=DAILY_SURPRISES[[...dailySurpriseKey].reduce((s,c)=>s+c.charCodeAt(0),0)%DAILY_SURPRISES.length];render();if(TEST)window.GrammarDebug={getState:()=>state,context:()=>({KEY,TEST}),course:COURSE,norm,valid};

</script></body></html>
