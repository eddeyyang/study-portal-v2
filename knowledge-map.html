<body data-child="kenton">
<div class="shell"><header class="mast"><a class="back" href="https://study-portal-eta.vercel.app/" id="portalLink"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg>Study Portal</a><span class="brand">LEARNING ATLAS / 2026 秋</span><button class="quiet" id="helpBtn" aria-label="使用说明">使用说明</button></header>
<div class="title-row"><div><h1>学习脑图</h1><p class="subtitle">点开一个知识点，把相似的方法连起来，再写下自己的笔记。</p></div><span class="tag-date">内容核对 · 2026.10.12</span></div>
<div class="controls"><div class="seg" aria-label="选择孩子"><button id="kentonBtn" class="who-k active">哥哥</button><button id="eddeyBtn" class="who-e">弟弟</button></div><div class="seg" aria-label="选择学科"><button id="mathBtn" class="active">数学</button><button id="englishBtn">英语</button></div><button id="overviewBtn" class="quiet all-button">整张脑图</button><div class="toolend"><button class="quiet note-summary-btn" id="notesBtn">我的笔记 <span id="notesCount">0</span></button><button class="quiet" id="exportBtn">导出 / 导入</button></div></div>
<div id="storageWarning" class="storage-warning" role="alert" hidden></div>
<main class="board"><section class="visual" aria-label="可点击知识脑图"><div class="boardtop"><nav id="crumb" class="crumb" aria-label="当前位置"></nav><div class="view-switch"><button id="mapBtn" class="active">脑图</button><button id="listBtn">目录</button></div></div><div class="searchbox"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" type="search" autocomplete="off" placeholder="搜索知识点、规则或笔记" aria-label="搜索全部知识点与笔记"><div id="searchResults" class="search-results" hidden></div></div>
<div class="canvas" id="canvas" tabindex="0" aria-label="脑图画布，可以拖动或滚动查看"><div id="spacer" class="spacer"><div id="world" class="world"></div></div></div><div class="outline" id="outline" hidden></div>
<div class="mapfooter"><span class="hint">点分支展开 · 点知识点写笔记</span><div class="zoom"><button id="collapseBtn" title="回到当前学科的主干">收起</button><button id="expandBtn" title="展开当前范围全部知识">展开全部</button><button id="zoomOut" aria-label="缩小脑图">−</button><span class="percent" id="zoomLabel">100%</span><button id="zoomIn" aria-label="放大脑图">＋</button><button id="fitBtn">适合屏幕</button></div></div></section><aside id="inspector" class="inspector" aria-label="知识点与笔记"></aside></main>
<div class="mobile-tip">脑图可左右、上下拖动；点“目录”也能快速找知识。虚线分支表示进度待核。</div>

function expandedItem(n){if(n.kind==='all'||n.kind==='child')return true;if(n.kind==='map')return !overview||expanded.has(n.id);return expanded.has(n.id)}
function getRoot(){return overview?{id:'all',kind:'all',title:'我们的学习地图'}:{...currentMap(),kind:'map'}}
function makeLayout(){let cursor=80;const nodes=[],edges=[],mobile=innerWidth<=760,available=$('canvas').clientWidth||innerWidth-26;const walk=(item,depth)=>{const ch=expandedItem(item)?childrenOf(item):[];const x=mobile?18+depth*24:30+depth*262;const node={...item,x,y:0,w:mobile?Math.max(190,Math.min(260,available-x-34)):(item.kind==='topic'?214:206),h:mobile?84:(item.kind==='topic'?84:72)};nodes.push(node);if(mobile){node.y=cursor;cursor+=98}if(ch.length){const kids=ch.map(c=>walk(c,depth+1));if(!mobile)node.y=(kids[0].y+kids.at(-1).y)/2;for(const k of kids)edges.push([node,k])}else if(!mobile){node.y=cursor;cursor+=96}return node};walk(getRoot(),0);layoutW=Math.max(mobile?available:800,...nodes.map(n=>n.x+n.w+(mobile?20:80)));layoutH=Math.max(530,cursor+30);return{nodes,edges,mobile}}
function nodeMeta(n){if(n.kind==='topic'){const nn=note(n.id);return `${nn?.text.trim()?'<i class="note-dot"></i>':''}${nn?.review?'<i class="review-dot"></i>':''}${n.status==='pending'?'进度待核':n.status==='extra'?'课外':n.status==='custom'?'自己补充':'点开整理与笔记'}`}if(n.kind==='group')return `${groupTopics(n).length} 个知识点${n.status==='pending'?' · 进度待核':n.status==='extra'?' · 课外':''}`;if(n.kind==='map')return n.groups.reduce((a,g)=>a+groupTopics({...g,child:n.child}).length,0)+' 个知识点';return n.kind==='all'?'数学 × 英语 · 分人记笔记':n.child==='kenton'?'五年级 · 独立笔记':'四年级 · 独立笔记'}
function renderMap(keepScroll=false){const old={x:$('canvas').scrollLeft,y:$('canvas').scrollTop};const L=makeLayout();const set=new Set(L.nodes.map(n=>n.id));let paths=L.edges.map(([a,b])=>L.mobile?`<path d="M${a.x+9},${a.y+a.h} V${b.y+b.h/2} H${b.x}"/>`:`<path d="M${a.x+a.w},${a.y+a.h/2} C${a.x+a.w+36},${a.y+a.h/2} ${b.x-50},${b.y+b.h/2} ${b.x},${b.y+b.h/2}"/>`).join('');if(selected&&!L.mobile){const a=L.nodes.find(x=>x.id===selected);if(a)for(const r of topics.get(selected)?.related||[]){const b=L.nodes.find(x=>x.id===r.id);if(b&&b.id!==a.id)paths+=`<path class="cross" d="M${a.x+a.w},${a.y+a.h/2} C${a.x+a.w+48},${a.y+a.h/2} ${b.x+b.w+48},${b.y+b.h/2} ${b.x+b.w},${b.y+b.h/2}"/>`}}
$('world').innerHTML=`<svg class="links" width="${layoutW}" height="${layoutH}" aria-hidden="true">${paths}</svg>`+L.nodes.map((n,i)=>{const fold=childrenOf(n).length>0;return `<button class="node ${i===0?'root':n.kind==='topic'?'':'branch'} ${n.status||''} ${n.kind==='child'?'child-'+n.child:''} ${selected===n.id?'selected':''}" data-node="${esc(n.id)}" data-kind="${n.kind}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px" ${fold?`aria-expanded="${expandedItem(n)}"`:''}><span class="n-title">${esc(n.title)}</span><span class="n-meta">${nodeMeta(n)}</span>${fold&&n.kind!=='all'&&n.kind!=='child'?`<span class="fold" aria-hidden="true">${expandedItem(n)?'−':'＋'}</span>`:''}</button>`}).join('');$('world').style.width=layoutW+'px';$('world').style.height=layoutH+'px';applyZoom();$('world').querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>clickNode(b.dataset.node,b.dataset.kind));if(keepScroll){$('canvas').scrollLeft=old.x;$('canvas').scrollTop=old.y}else{const target=selected?L.nodes.find(n=>n.id===selected):null;requestAnimationFrame(()=>{if(target)scrollNode(target);else{$('canvas').scrollLeft=0;$('canvas').scrollTop=0}})}return L}
function applyZoom(){zoom=Math.max(.32,Math.min(1.65,zoom));$('world').style.transform=`scale(${zoom})`;$('spacer').style.width=layoutW*zoom+'px';$('spacer').style.height=layoutH*zoom+'px';$('zoomLabel').textContent=Math.round(zoom*100)+'%'}
function changeZoom(z){const c=$('canvas'),x=(c.scrollLeft+c.clientWidth/2)/zoom,y=(c.scrollTop+c.clientHeight/2)/zoom;zoom=z;applyZoom();c.scrollLeft=x*zoom-c.clientWidth/2;c.scrollTop=y*zoom-c.clientHeight/2}
function fit(){const c=$('canvas');zoom=Math.max(.32,Math.min(1,(c.clientWidth-20)/layoutW,(c.clientHeight-15)/layoutH));applyZoom();c.scrollLeft=0;c.scrollTop=0}
function scrollNode(n){const c=$('canvas');c.scrollLeft=Math.max(0,(n.x+n.w/2)*zoom-c.clientWidth/2);c.scrollTop=Math.max(0,(n.y+n.h/2)*zoom-c.clientHeight/2)}
function clickNode(id,kind){lastTrigger=document.activeElement;if(kind==='topic'){selectTopic(id);return}if(kind==='map'&&overview){const m=maps.find(x=>x.id===id);choose(m.child,m.subject);return}if(kind==='child'){who=id;updateControls();renderInspector();return}if(kind==='group'){expanded.has(id)?expanded.delete(id):expanded.add(id);selected='';update();renderGroup(id);setUrl();if(innerWidth<=760){const L=makeLayout(),n=L.nodes.find(n=>n.id===id);if(n)scrollNode(n)}return}if(kind==='map'){expanded.clear();selected='';update();renderInspector();return}fit()}
function renderCrumb(){const g=selected?groups.get(topics.get(selected)?.group):null;$('crumb').innerHTML=`<button data-crumb="all">全景</button><span>›</span><button data-crumb="map">${NAMES[who]} · ${SUBS[subject]}</button>${g?'<span>›</span><span class="current">'+esc(g.title)+'</span>':''}`;$('crumb').querySelector('[data-crumb=all]').onclick=showOverview;$('crumb').querySelector('[data-crumb=map]').onclick=()=>choose(who,subject)}
function renderOutline(){const ms=overview?maps:[currentMap()];$('outline').innerHTML=ms.map(m=>`<div><p class="eyebrow">${esc(m.title)}</p>${m.groups.map(g=>`<details ${expanded.has(g.id)?'open':''}><summary>${esc(g.title)}<small>${g.status==='pending'?'进度待核':g.status==='extra'?'课外':''}</small></summary>${groupTopics({...g,child:m.child}).map(n=>`<button class="topic-row" data-topic="${n.id}">${esc(n.title)}${note(n.id)?.text.trim()?'<small>有笔记</small>':''}${note(n.id)?.review?'<small>待复习</small>':''}</button>`).join('')}</details>`).join('')}</div>`).join('');$('outline').querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>selectTopic(b.dataset.topic));$('outline').querySelectorAll('details').forEach(d=>d.ontoggle=()=>{})}
function update(keep=false){updateControls();renderCrumb();renderMap(keep);renderOutline()}
function openInspector(){if(innerWidth<=760){$('inspector').classList.add('open');$('inspector').setAttribute('role','dialog');$('inspector').setAttribute('aria-modal','true');document.body.style.overflow='hidden';$('inspector').scrollTop=0;requestAnimationFrame(()=>{const b=$('inspector').querySelector('.close-detail');b?.focus()})}}
function closeInspector(){const was=$('inspector').classList.contains('open');$('inspector').classList.remove('open');$('inspector').removeAttribute('role');$('inspector').removeAttribute('aria-modal');document.body.style.overflow='';if(was){const trigger=lastTrigger?.isConnected?lastTrigger:$('world').querySelector('[data-node="'+selected+'"]')||$('mapBtn');trigger?.focus?.()}}
const closeControl=()=>'<button class="close-detail" id="closeInspector"><span>←</span> 返回脑图</button>';
function bindClose(){if($('closeInspector'))$('closeInspector').onclick=closeInspector}
function showOverview(){overview=true;selected='';expanded.clear();closeInspector();update();renderInspector();setUrl();if(innerWidth>760)fit()}
function renderInspector(){const m=currentMap(),ns=counts(who);$('inspector').innerHTML=closeControl()+`<div class="overview-mark"><svg viewBox="0 0 40 40"><rect x="3" y="16" width="11" height="9" rx="3"/><rect x="26" y="3" width="11" height="9" rx="3"/><rect x="26" y="17" width="11" height="9" rx="3"/><rect x="26" y="31" width="11" height="7" rx="3"/><path d="M14 20h6V7h6M20 20h6M20 20v14h6"/></svg></div><p class="eyebrow">${overview?'两个人的知识，各自生长':NAMES[who]+' / '+SUBS[subject]}</p><h2>${overview?'先找到一条知识线':'从一条知识线开始'}</h2><p class="overview-copy">点开分支，看知识怎样连接。点开末端的知识点，整理规则、例子和自己的笔记。</p><div class="quick-list">${(overview?maps.map(x=>({id:x.id,title:x.title,source:x.scope})):m.groups.slice(0,4)).map(g=>`<button data-jump="${g.id}">${esc(g.title)}<small>${esc(overview?'进入这张学科脑图':g.status==='pending'?'教材范围，进度待核':'展开知识点 →')}</small></button>`).join('')}</div><div class="statline"><div><b>${m.groups.reduce((n,g)=>n+g.topics.length,0)}</b><span>当前学科知识点</span></div><div><b>${ns.written}</b><span>${NAMES[who]}的笔记</span></div><div><b>${ns.review}</b><span>手动标记待复习</span></div></div><details class="source"><summary>这张图的范围</summary><p>${esc(m.scope)}</p></details>`;bindClose();$('inspector').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const m=maps.find(x=>x.id===b.dataset.jump);if(m)choose(m.child,m.subject);else{expanded.add(b.dataset.jump);update();renderGroup(b.dataset.jump)}})}
function renderGroup(id){const g=groups.get(id);$('inspector').innerHTML=closeControl()+`<p class="eyebrow">${NAMES[g.child]} / ${SUBS[g.subject]} / ${STATUS[g.status]}</p><h2>${esc(g.title)}</h2><p class="overview-copy">先选一个知识点。相似方法会在详情里相互连接。</p><div class="quick-list">${groupTopics(g).map(n=>`<button data-topic="${n.id}">${esc(n.title)}<small>${esc(n.rule.slice(0,47))}${n.rule.length>47?'…':''}</small></button>`).join('')}</div><button class="add-button" id="addTopic">＋ 在这条分支补一个知识点</button><details class="source"><summary>材料定位</summary><p>${esc(g.source)}</p></details>`;bindClose();$('inspector').querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>selectTopic(b.dataset.topic));$('addTopic').onclick=()=>addTopic(id)}
function selectTopic(id){const n=topics.get(id);if(!n)return;lastTrigger=document.activeElement;who=n.child;subject=n.subject;overview=false;selected=id;expanded.add(n.group);$('searchResults').hidden=true;$('search').value='';update();renderTopic();setUrl();openInspector()}
function renderTopic(){const n=topics.get(selected),g=groups.get(n.group),v=note(n.id)||{text:'',review:false};editorBaseline=v.text;$('inspector').innerHTML=closeControl()+`<p class="eyebrow">${NAMES[n.child]} / ${SUBS[n.subject]} / ${n.status==='pending'?'进度待核':n.status==='extra'?'课外内容':'知识整理'}</p><h2>${esc(n.title)}</h2><p class="detail-rule">${esc(n.rule)}</p>${n.example?'<div class="example">'+esc(n.example)+'</div>':''}${n.pitfall?'<p class="section-label">容易混淆的地方</p><p class="pitfall">'+esc(n.pitfall)+'</p>':''}<div class="section-label"><label for="noteText">${NAMES[n.child]} · 这一个知识点的笔记</label><button class="review-btn ${v.review?'active':''}" id="reviewBtn" aria-pressed="${v.review}">${v.review?'已标待复习':'标记待复习'}</button></div><textarea id="noteText" class="note-area" maxlength="20000" placeholder="我的理解：&#10;我自己的例子：&#10;下次要提醒自己：">${esc(v.text)}</textarea><p class="save-state" id="saveState" role="status" aria-live="polite">${v.text?'已从本机恢复笔记':'输入即保存；与另一个孩子分开。'}</p>${v.conflicts?.length?'<details class="source"><summary>保留的另一份笔记（'+v.conflicts.length+'）</summary>'+v.conflicts.map(x=>'<p>'+esc(x.text)+'</p>').join('')+'</details>':''}<p class="section-label">相似知识 · 点开就能跳过去</p><div class="related">${(n.related||[]).slice(0,4).map(r=>{const t=topics.get(r.id);return `<button data-related="${t.id}"><span>${esc(t.title)}<small>${NAMES[t.child]} · ${SUBS[t.subject]} · ${esc(r.why)}</small></span><span class="arrow">↗</span></button>`}).join('')||'<p class="overview-copy">可在当前分支继续补充相关知识。</p>'}</div><button class="add-button" id="addTopic">＋ 补充一个相关知识点</button><details class="source"><summary>教材与范围依据</summary><p>${esc(n.source)}</p><p>${n.status==='pending'?'本项材料已核，实际授课进度尚未确认。':'这是知识整理，不能据打开或记笔记判断孩子已经掌握。'}</p></details>`;bindClose();$('noteText').oninput=()=>saveNote(selected,$('noteText').value);$('reviewBtn').onclick=()=>{saveNote(selected,$('noteText').value,!note(selected)?.review);const v=note(selected);$('reviewBtn').textContent=v.review?'已标待复习':'标记待复习';$('reviewBtn').classList.toggle('active',v.review);$('reviewBtn').setAttribute('aria-pressed',v.review)};$('inspector').querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>selectTopic(b.dataset.related));$('addTopic').onclick=()=>addTopic(n.group)}
function saveNote(id,text,review){const n=topics.get(id),s=latest(n.child),prev=s.notes[id]||{review:false},conflicts=[...(prev.conflicts||[])];if(prev.text&&prev.text!==editorBaseline&&prev.text!==text&&!conflicts.some(x=>x.text===prev.text)){if(conflicts.length>=100){warn('这个知识点保留的不同笔记已满100份。当前文字仍在页面，请先导出备份再整理。');return}conflicts.push({text:prev.text,at:prev.at})}s.notes[id]={...prev,text,review:review??prev.review,at:new Date().toISOString(),conflicts};editorBaseline=text;const ok=persist(n.child,s);updateCounters();const el=$('saveState');if(el)el.textContent=ok?'已保存到当前浏览器 · '+NAMES[n.child]+'的笔记':'本次文字已保留，请导出备份后再离开。';renderMap(true)}
function showDialog(title,html){lastTrigger=document.activeElement;$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;$('dialog').showModal()}
$('dialogClose').onclick=()=>$('dialog').close();$('dialog').addEventListener('close',()=>lastTrigger?.focus?.());
function addTopic(groupId){const g=groups.get(groupId);showDialog('补充一个知识点',`<p>${NAMES[g.child]} · ${SUBS[g.subject]} · ${esc(g.title)}</p><label for="customTitle">知识点名称</label><input id="customTitle" maxlength="60" placeholder="例如：怎样检查小数点"><label for="customRule">先记一句自己的理解</label><textarea id="customRule" class="note-area" maxlength="20000" placeholder="也可以先留空，稍后慢慢整理。"></textarea><div class="actions"><button id="createTopic" class="primary">加入脑图</button></div>`);$('createTopic').onclick=()=>{const title=$('customTitle').value.trim();if(!title){$('customTitle').focus();toast('先给知识点起个名字。');return}const state=latest(g.child);if(state.custom.length>=300){toast('自定义知识点已达300个，请先导出整理。');return}const id='user-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),rule=$('customRule').value;state.custom.push({id,title,rule,group:groupId});persist(g.child,state);registerCustom();$('dialog').close();selectTopic(id);toast('已加入'+NAMES[g.child]+'的脑图。')}}
function search(){const q=$('search').value.trim().toLowerCase();if(!q){$('searchResults').hidden=true;return}const results=[...topics.values()].filter(n=>[n.title,n.rule,n.example,n.pitfall,n.tags.join(' '),note(n.id)?.text].join(' ').toLowerCase().includes(q));$('searchResults').hidden=false;$('searchResults').innerHTML=results.length?results.slice(0,25).map(n=>`<button data-result="${n.id}">${esc(n.title)}<small>${NAMES[n.child]} · ${SUBS[n.subject]} · ${esc(groups.get(n.group).title)}</small></button>`).join('')+(results.length>25?'<p class="empty-search">还有更多结果，请缩短查找范围。</p>':''):'<p class="empty-search">没有找到。试试“小数点”“分配律”或“look”。</p>';$('searchResults').querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>selectTopic(b.dataset.result))}
$('search').oninput=search;$('search').addEventListener('keydown',e=>{if(e.key==='Escape'){$('searchResults').hidden=true;$('search').value=''}if(e.key==='Enter')$('searchResults').querySelector('button')?.click()});
function notebook(){const vals=[...topics.values()].filter(n=>n.child===who&&((noteFilter==='review'?note(n.id)?.review:note(n.id)?.text.trim())));showDialog(NAMES[who]+'的笔记',`<p>分开保存的笔记，可以点标题回到对应知识点继续改。</p><div class="note-filter"><button id="filterAll" class="${noteFilter==='all'?'active':''}">有笔记</button><button id="filterReview" class="${noteFilter==='review'?'active':''}">待复习</button></div>${vals.map(n=>`<article class="notebook-entry"><button data-goto="${n.id}">${esc(n.title)} ↗</button><small>${SUBS[n.subject]} · ${esc(groups.get(n.group).title)}</small><p>${esc(note(n.id)?.text||'已标记待复习，尚未写笔记。')}</p></article>`).join('')||'<p>还没有这一类笔记。点开脑图里的知识点即可开始。</p>'}`);$('filterAll').onclick=()=>{noteFilter='all';$('dialog').close();notebook()};$('filterReview').onclick=()=>{noteFilter='review';$('dialog').close();notebook()};$('dialogBody').querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{$('dialog').close();selectTopic(b.dataset.goto)})}
function download(name,type,content){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function exportNotes(kind){const s=notes[who],name=`${NAMES[who]}_学习脑图笔记_${new Date().toISOString().slice(0,10)}`;if(kind==='json'){download(name+'.json','application/json',JSON.stringify(s,null,2));return}if(kind==='md'){let out=`# ${NAMES[who]}的数学与英语笔记\n\n导出日期：${new Date().toISOString().slice(0,10)}\n\n`;for(const n of topics.values())if(n.child===who&&(s.notes[n.id]?.text.trim()||s.notes[n.id]?.review||n.status==='custom')){out+=`## ${n.title}\n\n${SUBS[n.subject]} / ${groups.get(n.group).title}\n\n${n.rule}\n\n${s.notes[n.id]?.review?'**待复习**\n\n':''}${s.notes[n.id]?.text||'尚未填写笔记。'}\n\n`;for(const c of s.notes[n.id]?.conflicts||[])out+=`另一份保留笔记：\n\n${c.text}\n\n`}download(name+'.md','text/markdown;charset=utf-8',out);return}if(kind==='html'){const clone=document.documentElement.cloneNode(true);clone.dataset.portableChild=who;clone.dataset.portableSubject=subject;clone.dataset.portableNode=selected;for(const id of ['world','outline','inspector','dialogBody','searchResults'])clone.querySelector('#'+id).innerHTML='';clone.querySelector('#search').value='';clone.querySelector('#savedNotes').textContent=JSON.stringify({[who]:s}).replaceAll('<','\\u003c');clone.querySelector('#dialog').removeAttribute('open');clone.querySelector('#toast').hidden=true;clone.querySelector('#inspector').classList.remove('open');clone.querySelector('body').style.overflow='';download(name+'.html','text/html;charset=utf-8','<!doctype html>\n'+clone.outerHTML)}}
function exportDialog(){showDialog('保存与带走笔记',`<p>本次只导出<strong>${NAMES[who]}</strong>的笔记。切换孩子后，可以再导出另一份。</p><div class="export-options"><button id="backup">导出备份文件 · JSON<small>换设备时导入，保留笔记、自定义知识点和待复习标记。</small></button><button id="readable">导出可读笔记 · Markdown<small>按数学、英语整理，方便阅读和打印。</small></button><button id="portable">下载带笔记的脑图 · HTML<small>可在浏览器打开的独立副本；包含当前孩子的笔记。</small></button></div><label for="importNotes">导入${NAMES[who]}之前导出的备份</label><input id="importNotes" type="file" accept=".json,application/json"><div id="importResult" class="import-result" role="status" aria-live="polite"></div><p>不同内容相遇时，会保留另一份笔记，不静默覆盖。笔记没有上传到学情数据库。</p>`);$('backup').onclick=()=>exportNotes('json');$('readable').onclick=()=>exportNotes('md');$('portable').onclick=()=>exportNotes('html');$('importNotes').onchange=importNotes}
async function importNotes(e){const f=e.target.files[0],targetWho=who;if(!f)return;const out=$('importResult');try{if(f.size>5000000)throw Error('文件超过5MB，未改动原笔记。');const incoming=JSON.parse(await f.text());if(!validState(incoming,targetWho))throw Error('孩子或文件格式不匹配，原笔记没有改变。');const dest=latest(targetWho);let conflicts=0;for(const n of incoming.custom){const old=dest.custom.find(x=>x.id===n.id);if(old&&(old.title!==n.title||old.rule!==n.rule||old.group!==n.group))throw Error('自定义知识点编号有冲突，未导入；请保留两份备份。')}const merged=JSON.parse(JSON.stringify(dest));for(const n of incoming.custom)if(!merged.custom.some(x=>x.id===n.id))merged.custom.push(n);for(const [id,v]of Object.entries(incoming.notes)){const old=merged.notes[id];if(!old){merged.notes[id]=v;continue}const saved=[...(old.conflicts||[]),...(v.conflicts||[])];if(old.text.trim()&&old.text!==v.text&&v.text.trim()){saved.push({text:v.text,at:v.at});conflicts++}const unique=[...new Map(saved.map(x=>[x.at+'|'+x.text,x])).values()];if(unique.length>100)throw Error('另一份笔记超过100份，未导入；请保留两份备份后分别整理。');merged.notes[id]={...old,text:old.text.trim()?old.text:v.text,at:old.text.trim()?old.at:v.at,review:old.review||v.review,conflicts:unique}}if(!validState(merged,targetWho))throw Error('合并后的数据不符合本软件格式，原笔记没有改变。');const ok=persist(targetWho,merged);registerCustom();update(true);if(selected)renderTopic();out.textContent=(ok?'已导入并保存。':'已导入本次页面，请立即导出备份。')+(conflicts?`\n${conflicts}处不同笔记已保存在知识点的“另一份笔记”里。`:'')}catch(err){out.textContent=err.message}}
function help(){showDialog('这样使用脑图',`<p>① 先选哥哥或弟弟，再选数学、英语。点“整张脑图”可以看两个人的总览。</p><p>② 点分支展开，点末端知识点看规则与例子。“相似知识”会带你到相关方法。</p><p>③ 在知识点下直接写笔记，也能补充新的知识点。笔记输入后会自动保存。</p><p>④ 想换设备，先导出备份文件，再在另一个设备导入。也可以下载一份带笔记的独立脑图。</p><p>手机上可拖动脑图，或用“目录”找内容。当前浏览器的数据被清理时，本机笔记也会被清掉，请保留备份。</p>`)}
function scope(){showDialog('内容范围与依据',`<p>${esc(DATA.scopeNote)}</p>${maps.map(m=>'<p><strong>'+esc(m.title)+'</strong><br>'+esc(m.scope)+'</p>').join('')}<p>四张学科图共${topics.size-notes.kenton.custom.length-notes.eddey.custom.length}个初始知识点。节点包括核心概念、词语、句型、辨析和应用方法；不是把每一道练习题都复制进来。</p><p>“进度待核”表示材料已经找到，但不能认定学校已经教过。你可先用这些分支做教材整理。</p>`)}
$('kentonBtn').onclick=()=>choose('kenton',subject);$('eddeyBtn').onclick=()=>choose('eddey',subject);$('mathBtn').onclick=()=>choose(who,'math');$('englishBtn').onclick=()=>choose(who,'english');$('overviewBtn').onclick=showOverview;$('notesBtn').onclick=notebook;$('exportBtn').onclick=exportDialog;$('helpBtn').onclick=help;$('scopeBtn').onclick=scope;
$('mapBtn').onclick=()=>{view='map';update(true)};$('listBtn').onclick=()=>{view='list';update(true)};$('zoomIn').onclick=()=>changeZoom(zoom+.15);$('zoomOut').onclick=()=>changeZoom(zoom-.15);$('fitBtn').onclick=fit;
$('collapseBtn').onclick=()=>{selected='';expanded.clear();update();renderInspector();zoom=1;applyZoom();setUrl()};$('expandBtn').onclick=()=>{const ms=overview?maps:[currentMap()];for(const m of ms){expanded.add(m.id);for(const g of m.groups)expanded.add(g.id)}update();if(innerWidth>760)fit();toast('已展开，拖动画布或搜索查看。')};
// Mouse drag scroll; touch keeps native scrolling for smooth one-finger panning.
let drag=null;$('canvas').addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,left:$('canvas').scrollLeft,top:$('canvas').scrollTop};$('canvas').setPointerCapture(e.pointerId)});$('canvas').addEventListener('pointermove',e=>{if(!drag)return;$('canvas').scrollLeft=drag.left-(e.clientX-drag.x);$('canvas').scrollTop=drag.top-(e.clientY-drag.y)});$('canvas').addEventListener('pointerup',()=>drag=null);$('canvas').addEventListener('pointercancel',()=>drag=null);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dialog').open)closeInspector();if(e.key==='Tab'&&$('inspector').classList.contains('open')&&!$('dialog').open){const els=[...$('inspector').querySelectorAll('button,textarea,summary,a[href],input')].filter(el=>el.getClientRects().length);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('storage',e=>{const c=['kenton','eddey'].find(c=>e.key===key(c));if(!c)return;notes[c]=readState(c);registerCustom();updateCounters();renderMap(true);if(selected&&topics.get(selected)?.child===c&&document.activeElement!==$('noteText'))renderTopic();else if(document.activeElement===$('noteText'))toast('另一个窗口更新了笔记，请导出当前内容后核对。')});
window.addEventListener('resize',()=>{if(innerWidth>760)closeInspector();renderMap(true)});
update();if(selected){renderTopic();openInspector()}else renderInspector();if(overview&&innerWidth>760)requestAnimationFrame(fit);
</script>
</body></html>
