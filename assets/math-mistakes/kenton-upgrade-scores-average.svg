<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 285" role="img" aria-labelledby="title"><title id="title">去掉8.8与9.9，剩下4个评分</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#218b9b"/></marker></defs><rect width="560" height="285" rx="18" fill="#f8f8f3"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="280" y="38" text-anchor="middle" font-size="25" fill="#263b4b" font-weight="700">先删最高、最低；再确定几份</text><rect x="35" y="85" width="72" height="62" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="71" y="126" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="500">9.1</text><rect x="118" y="85" width="72" height="62" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="154" y="126" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="500">9.3</text><rect x="201" y="85" width="72" height="62" rx="2" fill="#e5e7e8" stroke="#218b9b" stroke-width="2"/><text x="237" y="126" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="500">8.8</text><path d="M206,93 L268,141" stroke="#54697a" stroke-width="2.5" fill="none"/><rect x="284" y="85" width="72" height="62" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="320" y="126" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="500">9.8</text><rect x="367" y="85" width="72" height="62" rx="2" fill="#e5e7e8" stroke="#218b9b" stroke-width="2"/><text x="403" y="126" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="500">9.9</text><path d="M372,93 L434,141" stroke="#54697a" stroke-width="2.5" fill="none"/><rect x="450" y="85" width="72" height="62" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="486" y="126" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="500">9.5</text><text x="280" y="200" text-anchor="middle" font-size="27" fill="#263b4b" font-weight="500">剩4个评分，不是6份</text><text x="280" y="245" text-anchor="middle" font-size="24" fill="#54697a" font-weight="500">平均分应在9.1与9.8之间</text></g></svg>