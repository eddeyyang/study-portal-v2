<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="title desc"><title id="title">先把总产量缩到每人每天</title><desc id="desc">先把总产量缩到每人每天</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#78889b"/></marker></defs><rect width="640" height="370" rx="18" fill="#fffdf9"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="320" y="45" font-size="30" text-anchor="middle" fill="#303a50">15人 × 3天 → 270个</text><path d="M320 73 L320 112" fill="none" stroke="#78889b" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="153" font-size="30" text-anchor="middle" fill="#303a50">1人 × 1天 → 6个</text><path d="M320 180 L320 219" fill="none" stroke="#78889b" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="258" font-size="30" text-anchor="middle" fill="#303a50">1人 × 5天 → 30个</text><text x="320" y="329" font-size="28" text-anchor="middle" fill="#303a50">900个先求总人数，再减原有15人</text></g></svg>