<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="title"><title id="title">35×2.4的整数部分24×35，保留十位乘10的意义</title><rect width="560" height="400" rx="18" fill="#f8f8f3"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="280" y="38" text-anchor="middle" font-size="27" fill="#263b4b">先看整数部分：24 × 35</text><text x="280" y="95" text-anchor="middle" font-size="28" fill="#263b4b">24 × 5＝120</text><text x="280" y="155" text-anchor="middle" font-size="26" fill="#263b4b">24 × 30＝(24 × 3) × 10</text><text x="280" y="205" text-anchor="middle" font-size="24" fill="#263b4b">24 × 3：4×3＝12，要进1</text><text x="280" y="255" text-anchor="middle" font-size="25" fill="#263b4b">(2×3＋1)个十＋2＝72</text><text x="280" y="315" text-anchor="middle" font-size="29" fill="#263b4b">120＋720＝840</text><text x="280" y="365" text-anchor="middle" font-size="23" fill="#263b4b">原题有1位小数，再还原</text></g></svg>