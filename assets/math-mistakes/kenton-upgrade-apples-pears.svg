<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 275" role="img" aria-labelledby="title"><title id="title">苹果和梨的总价等价替换，只比较钱数，不把水果重量等同</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#218b9b"/></marker></defs><rect width="560" height="275" rx="18" fill="#f8f8f3"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="280" y="34" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="500">只比较钱数</text><rect x="25" y="65" width="170" height="68" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="110" y="94" text-anchor="middle" font-size="23" fill="#263b4b" font-weight="500">9千克苹果</text><text x="110" y="120" text-anchor="middle" font-size="21" fill="#263b4b" font-weight="500">的钱</text><rect x="360" y="65" width="170" height="68" rx="2" fill="#f5dc9a" stroke="#218b9b" stroke-width="2"/><text x="445" y="94" text-anchor="middle" font-size="23" fill="#263b4b" font-weight="500">12千克梨</text><text x="445" y="120" text-anchor="middle" font-size="21" fill="#263b4b" font-weight="500">的钱</text><path d="M205,99 L345,99" stroke="#218b9b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="275" y="80" text-anchor="middle" font-size="21" fill="#263b4b" font-weight="500">等价换成</text><rect x="25" y="180" width="170" height="68" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="110" y="209" text-anchor="middle" font-size="23" fill="#263b4b" font-weight="500">12千克梨</text><text x="110" y="235" text-anchor="middle" font-size="21" fill="#263b4b" font-weight="500">的钱</text><rect x="360" y="180" width="170" height="68" rx="2" fill="#f5dc9a" stroke="#218b9b" stroke-width="2"/><text x="445" y="209" text-anchor="middle" font-size="23" fill="#263b4b" font-weight="500">21千克梨</text><text x="445" y="235" text-anchor="middle" font-size="21" fill="#263b4b" font-weight="500">的钱</text><path d="M205,214 L345,214" stroke="#218b9b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="275" y="195" text-anchor="middle" font-size="21" fill="#263b4b" font-weight="500">加原有的</text><text x="275" y="242" text-anchor="middle" font-size="19" fill="#263b4b" font-weight="500">9千克梨的钱</text></g></svg>