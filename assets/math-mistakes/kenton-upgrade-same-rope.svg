<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="title"><title id="title">绳长就是外圈周长；长方形改围正方形（形状示意）</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#218b9b"/></marker></defs><rect width="560" height="320" rx="18" fill="#f8f8f3"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="280" y="36" text-anchor="middle" font-size="27" fill="#263b4b" font-weight="700">同一根绳子，长度不变</text><rect x="45" y="95" width="204" height="126" rx="2" fill="none" stroke="#218b9b" stroke-width="2"/><text x="155" y="83" text-anchor="middle" font-size="24" fill="#263b4b" font-weight="500">6.8 厘米</text><text x="155" y="262" text-anchor="middle" font-size="23" fill="#263b4b" font-weight="500">4.2 厘米（宽）</text><path d="M280,160 L335,160" stroke="#218b9b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="345" y="95" width="165" height="165" rx="2" fill="none" stroke="#218b9b" stroke-width="2"/><text x="430" y="83" text-anchor="middle" font-size="24" fill="#263b4b" font-weight="500">正方形</text><text x="430" y="282" text-anchor="middle" font-size="24" fill="#263b4b" font-weight="500">边长 ？</text></g></svg>