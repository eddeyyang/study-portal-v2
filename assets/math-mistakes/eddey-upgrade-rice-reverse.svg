<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="title desc"><title id="title">每倒推一天，先加6再乘2</title><desc id="desc">每倒推一天，先加6再乘2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#78889b"/></marker></defs><rect width="640" height="370" rx="18" fill="#fffdf9"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="320" y="42" font-size="30" text-anchor="middle" fill="#303a50">倒推：先撤销下午，再撤销上午</text><text x="77" y="112" font-size="25" text-anchor="middle" fill="#303a50">第3天</text><rect x="130" y="77" width="105" height="58" rx="10" fill="#fff0e6" stroke="#d4623c" stroke-width="2"/><text x="182.5" y="117.0" font-size="30" text-anchor="middle" fill="#303a50">0</text><text x="320" y="112" font-size="27" text-anchor="middle" fill="#303a50">＋6，再×2</text><rect x="435" y="77" width="115" height="58" rx="10" fill="#fff0e6" stroke="#d4623c" stroke-width="2"/><text x="492.5" y="117.0" font-size="30" text-anchor="middle" fill="#303a50">12</text><path d="M555 107 L595 107" fill="none" stroke="#78889b" stroke-width="3" marker-end="url(#arrow)"/><text x="77" y="201" font-size="25" text-anchor="middle" fill="#303a50">第2天</text><rect x="130" y="166" width="105" height="58" rx="10" fill="#fff0e6" stroke="#d4623c" stroke-width="2"/><text x="182.5" y="206.0" font-size="30" text-anchor="middle" fill="#303a50">12</text><text x="320" y="201" font-size="27" text-anchor="middle" fill="#303a50">＋6，再×2</text><rect x="435" y="166" width="115" height="58" rx="10" fill="#fff0e6" stroke="#d4623c" stroke-width="2"/><text x="492.5" y="206.0" font-size="30" text-anchor="middle" fill="#303a50">36</text><path d="M555 196 L595 196" fill="none" stroke="#78889b" stroke-width="3" marker-end="url(#arrow)"/><text x="77" y="290" font-size="25" text-anchor="middle" fill="#303a50">第1天</text><rect x="130" y="255" width="105" height="58