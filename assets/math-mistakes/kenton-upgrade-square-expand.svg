<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 515" role="img" aria-labelledby="title"><title id="title">原正方形边长增加0.9米；增加两条长方形和一个角块</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#218b9b"/></marker></defs><rect width="560" height="515" rx="18" fill="#f8f8f3"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="280" y="38" text-anchor="middle" font-size="27" fill="#263b4b" font-weight="700">增加部分分成三块</text><rect x="110" y="95" width="210" height="210" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><rect x="320" y="95" width="90" height="210" rx="2" fill="#f5dc9a" stroke="#218b9b" stroke-width="2"/><rect x="110" y="305" width="210" height="90" rx="2" fill="#f5dc9a" stroke="#218b9b" stroke-width="2"/><rect x="320" y="305" width="90" height="90" rx="2" fill="#edc578" stroke="#218b9b" stroke-width="2"/><text x="220" y="215" text-anchor="middle" font-size="27" fill="#263b4b" font-weight="500">原正方形</text><text x="220" y="83" text-anchor="middle" font-size="23" fill="#263b4b" font-weight="500">原边长 ？</text><text x="365" y="83" text-anchor="middle" font-size="23" fill="#263b4b" font-weight="500">0.9米</text><text x="440" y="365" text-anchor="start" font-size="21" fill="#263b4b" font-weight="500">0.9米</text><text x="280" y="445" text-anchor="middle" font-size="22" fill="#263b4b" font-weight="500">黄色两条＋角上小方块＝4.59 平方米</text><text x="280" y="480" text-anchor="middle" font-size="22" fill="#54697a" font-weight="500">角上小方块也属于增加面积</text></g></svg>