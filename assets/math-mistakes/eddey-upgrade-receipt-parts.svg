<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc"><title id="title">小票总价分成牙膏与香皂</title><desc id="desc">小票总价分成牙膏与香皂</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#78889b"/></marker></defs><rect width="640" height="260" rx="18" fill="#fffdf9"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="320" y="45" font-size="30" text-anchor="middle" fill="#303a50">小票合计72元</text><rect x="30" y="85" width="435" height="75" rx="10" fill="#fff0e6" stroke="#d4623c" stroke-width="2"/><text x="247.5" y="132" font-size="27" text-anchor="middle" fill="#303a50">牙膏54元</text><rect x="465" y="85" width="145" height="75" rx="10" fill="#fff0e6" stroke="#d4623c" stroke-width="2"/><text x="537.5" y="132" font-size="27" text-anchor="middle" fill="#303a50">香皂2块</text><text x="320" y="218" font-size="30" text-anchor="middle" fill="#303a50">先去掉牙膏，再把剩余价钱平均分2份</text></g></svg>