<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" role="img" aria-labelledby="title"><title id="title">两次分别改变同一个原长方形的长或宽</title><rect width="560" height="390" rx="18" fill="#f8f8f3"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="280" y="35" text-anchor="middle" font-size="24" fill="#263b4b">两次变化，都从原长方形出发</text><rect x="55" y="90" width="180" height="125" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><rect x="55" y="215" width="180" height="55" fill="#f5dc9a" stroke="#218b9b" stroke-width="2"/><text x="145" y="77" text-anchor="middle" font-size="24" fill="#263b4b">原长 ？</text><text x="145" y="247" text-anchor="middle" font-size="22" fill="#263b4b">增加31.2</text><text x="145" y="310" text-anchor="middle" font-size="23" fill="#263b4b">宽增加6分米</text><rect x="295" y="90" width="180" height="125" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><rect x="295" y="90" width="75" height="125" fill="#f5dc9a" stroke="#218b9b" stroke-width="2"/><path d="M495 90v125 M488 90h14 M488 215h14" fill="none" stroke="#263b4b" stroke-width="2"/><text x="510" y="140" text-anchor="middle" font-size="20" fill="#263b4b">原</text><text x="510" y="170" text-anchor="middle" font-size="20" fill="#263b4b">宽</text><text x="510" y="200" text-anchor="middle" font-size="20" fill="#263b4b">？</text><text x="332" y="140" text-anchor="middle" font-size="21" fill="#263b4b">减少</text><text x="332" y="175" text-anchor="middle" font-size="24" fill="#263b4b">18.5</text><text x="385" y="270" text-anchor="middle" font-size="23" fill="#263b4b">长减少5分米</text><text x="280" y="355" text-anchor="middle" font-size="21" fill="#263b4b">面积单位：平方分米；图不按比例</text></g></svg>