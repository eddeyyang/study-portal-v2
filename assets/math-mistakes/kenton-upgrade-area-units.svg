<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" role="img" aria-labelledby="title"><title id="title">长、宽都换成厘米；面积倍率为100×100</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#218b9b"/></marker></defs><rect width="560" height="390" rx="18" fill="#f8f8f3"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="280" y="40" text-anchor="middle" font-size="27" fill="#263b4b" font-weight="700">1 米＝100 厘米</text><rect x="160" y="75" width="220" height="220" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="270" y="195" text-anchor="middle" font-size="28" fill="#263b4b" font-weight="500">1 平方米</text><text x="270" y="345" text-anchor="middle" font-size="24" fill="#263b4b" font-weight="500">100 × 100 个 1 平方厘米</text><text x="105" y="195" text-anchor="middle" font-size="23" fill="#263b4b" font-weight="500">100</text><text x="270" y="67" text-anchor="middle" font-size="23" fill="#263b4b" font-weight="500">100</text></g></svg>