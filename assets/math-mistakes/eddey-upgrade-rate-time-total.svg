<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 325" role="img" aria-labelledby="title desc"><title id="title">效率、时间与总量是三个不同量</title><desc id="desc">效率、时间与总量是三个不同量</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#78889b"/></marker></defs><rect width="640" height="325" rx="18" fill="#fffdf9"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="25" y="50" width="250" height="58" rx="10" fill="#fff0e6" stroke="#d4623c" stroke-width="2"/><text x="150.0" y="90.0" font-size="30" text-anchor="middle" fill="#303a50">每天1400本</text><text x="320" y="91" font-size="30" text-anchor="middle" fill="#303a50">×</text><rect x="365" y="50" width="250" height="58" rx="10" fill="#fff0e6" stroke="#d4623c" stroke-width="2"/><text x="490.0" y="90.0" font-size="30" text-anchor="middle" fill="#303a50">20天</text><text x="150" y="170" font-size="29" text-anchor="middle" fill="#303a50">工作效率</text><text x="490" y="170" font-size="29" text-anchor="middle" fill="#303a50">工作时间</text><path d="M150 190 L320 235" fill="none" stroke="#78889b" stroke-width="3"/><path d="M490 190 L320 235" fill="none" stroke="#78889b" stroke-width="3"/><text x="320" y="286" font-size="30" text-anchor="middle" fill="#303a50">全部完成的本数：工作量</text></g></svg>