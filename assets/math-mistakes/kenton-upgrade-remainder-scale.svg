<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 238" role="img" aria-labelledby="title"><title id="title">商不变时，余数随被除数与除数同倍变化</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#218b9b"/></marker></defs><rect width="560" height="238" rx="18" fill="#f8f8f3"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="25" y="50" width="170" height="54" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="110" y="86" text-anchor="middle" font-size="24" fill="#263b4b" font-weight="500">被除数、除数</text><path d="M205,77 L345,77" stroke="#218b9b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="275" y="60" text-anchor="middle" font-size="22" fill="#263b4b" font-weight="500">同时×10</text><rect x="360" y="50" width="170" height="54" rx="2" fill="#f5dc9a" stroke="#218b9b" stroke-width="2"/><text x="445" y="86" text-anchor="middle" font-size="24" fill="#263b4b" font-weight="500">商仍15</text><rect x="25" y="144" width="170" height="54" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="110" y="180" text-anchor="middle" font-size="24" fill="#263b4b" font-weight="500">原余数1.2</text><path d="M205,171 L345,171" stroke="#218b9b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="275" y="154" text-anchor="middle" font-size="22" fill="#263b4b" font-weight="500">同样×10</text><rect x="360" y="144" width="170" height="54" rx="2" fill="#f5dc9a" stroke="#218b9b" stroke-width="2"/><text x="445" y="180" text-anchor="middle" font-size="24" fill="#263b4b" font-weight="500">新余数12</text></g></svg>