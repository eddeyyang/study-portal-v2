<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="title"><title id="title">正方形每边增加0.9米，面积增加4.59平方米</title><rect width="560" height="520" rx="18" fill="#f8f8f3"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="280" y="38" text-anchor="middle" font-size="26" fill="#263b4b">正方形边长增加0.9米</text><rect x="100" y="100" width="300" height="300" fill="#f5dc9a" stroke="#218b9b" stroke-width="2"/><rect x="100" y="100" width="210" height="210" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="205" y="205" text-anchor="middle" font-size="26" fill="#263b4b">原正方形</text><text x="205" y="248" text-anchor="middle" font-size="25" fill="#263b4b">边长 ？</text><text x="355" y="84" text-anchor="middle" font-size="24" fill="#263b4b">0.9米</text><text x="450" y="360" text-anchor="middle" font-size="24" fill="#263b4b">0.9米</text><text x="280" y="445" text-anchor="middle" font-size="24" fill="#263b4b">黄色增加面积：4.59平方米</text><text x="280" y="485" text-anchor="middle" font-size="25" fill="#263b4b">求原正方形的面积</text></g></svg>