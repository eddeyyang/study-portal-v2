<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 365" role="img" aria-labelledby="title"><title id="title">20米正方形布，裁4.5米乘2.5米整块（尺寸示意）</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#218b9b"/></marker></defs><rect width="560" height="365" rx="18" fill="#f8f8f3"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="280" y="35" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="700">大布与每个整块的尺寸</text><rect x="45" y="80" width="220" height="220" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="155" y="67" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="500">20 米</text><text x="155" y="334" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="500">20 米</text><rect x="325" y="135" width="180" height="100" rx="2" fill="#dff3f4" stroke="#218b9b" stroke-width="2"/><text x="415" y="120" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="500">4.5 米</text><text x="415" y="275" text-anchor="middle" font-size="26" fill="#263b4b" font-weight="500">2.5 米</text><text x="415" y="315" text-anchor="middle" font-size="21" fill="#263b4b">小块放大示意</text></g></svg>