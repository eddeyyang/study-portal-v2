<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">把乘数拆成两部分</title><desc id="desc">把乘数拆成两部分</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#78889b"/></marker></defs><rect width="640" height="320" rx="18" fill="#fffdf9"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="320" y="45" font-size="30" text-anchor="middle" fill="#303a50">28×(20＋6)</text><rect x="70" y="90" width="300" height="130" rx="10" fill="#fff0e6" stroke="#d4623c" stroke-width="2"/><rect x="370" y="90" width="200" height="130" rx="10" fill="#e5eff4" stroke="#718ca3" stroke-width="2"/><text x="220" y="168" font-size="34" text-anchor="middle" fill="#303a50">28×20</text><text x="470" y="168" font-size="34" text-anchor="middle" fill="#303a50">28×6</text><text x="320" y="280" font-size="28" text-anchor="middle" fill="#303a50">两块相加，每块都保留同一个乘数</text></g></svg>